[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/orders/:id/items"
  to = "/.netlify/functions/order-items?id=:id"
  status = 200

