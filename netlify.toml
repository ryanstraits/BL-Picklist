[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/orders/:id/items"
  to = "/.netlify/functions/order-items?id=:id"
  status = 200

[[redirects]]
  from = "/api/orders/:id/messages"
  to = "/.netlify/functions/order-messages?id=:id"
  status = 200

[[redirects]]
  from = "/api/orders/:id/contact"
  to = "/.netlify/functions/order-contact?id=:id"
  status = 200

[[redirects]]
  from = "/api/orders/:id/status-check"
  to = "/.netlify/functions/order-status-check?id=:id"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/colors"
  to = "/.netlify/functions/colors"
  status = 200

[[redirects]]
  from = "/api/item-image"
  to = "/.netlify/functions/item-image"
  status = 200

[[redirects]]
  from = "/api/update-order-status"
  to = "/.netlify/functions/update-order-status"
  status = 200

[[redirects]]
  from = "/api/pick-state"
  to = "/.netlify/functions/pick-state"
  status = 200

[[redirects]]
  from = "/api/send-drive-thru"
  to = "/.netlify/functions/send-drive-thru"
  status = 200

[[redirects]]
  from = "/api/member-rating"
  to = "/.netlify/functions/member-rating"
  status = 200

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/post-feedback"
  status = 200

[[redirects]]
  from = "/api/pirateship-export"
  to = "/.netlify/functions/pirateship-export"
  status = 200
