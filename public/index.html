<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>BrickLink Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script type="module" src="/vendor/pdfjs/pdfjs-bridge.js"></script>
<script type="module" src="/vendor/pdf-lib/pdf-lib-bridge.js"></script>
<style>
  :root {
    --bg: #F5F3EF;
    --surface: #FFFFFF;
    --surface-alt: #ECE8E1;
    --border: #DDD7CC;
    --text: #1D1B18;
    --text-secondary: #6B6459;
    --accent: #C97A22;
    --accent-soft: #F2E2CC;
    --accent-contrast: #FFFFFF;
    --success: #2F8F5B;
    --success-bg: #E3F3EA;
    --danger: #B4483A;
    --danger-soft: #F5DCD7;
    --info: #2E5FA3;
    --info-bg: #E3EAF5;
    --purple: #7A5691;
    /* Distinct from --accent (itself an amber/orange already used all over
       for brand/buttons/active-state chrome) — a true yellow so "you
       already have some of this" actually stands out as its own signal
       rather than blending into ordinary UI color. */
    --warning: #8A6D00;
    --warning-bg: #FBF0CE;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161A;
      --surface: #1D2027;
      --surface-alt: #262A33;
      --border: #31353F;
      --text: #EDEBE6;
      --text-secondary: #9CA3AF;
      --accent: #F2A93B;
      --accent-soft: #3A2D14;
      --accent-contrast: #14161A;
      --success: #4FAE7B;
      --success-bg: #1C3327;
      --danger: #E0685A;
      --danger-soft: #3A1F1B;
      --info: #7BB0FA;
      --info-bg: #1C2A40;
      --purple: #C79FE0;
      --warning: #E8C547;
      --warning-bg: #3A3012;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161A;
    --surface: #1D2027;
    --surface-alt: #262A33;
    --border: #31353F;
    --text: #EDEBE6;
    --text-secondary: #9CA3AF;
    --accent: #F2A93B;
    --accent-soft: #3A2D14;
    --accent-contrast: #14161A;
    --success: #4FAE7B;
    --success-bg: #1C3327;
    --danger: #E0685A;
    --danger-soft: #3A1F1B;
    --info: #7BB0FA;
    --info-bg: #1C2A40;
    --purple: #C79FE0;
    --warning: #E8C547;
    --warning-bg: #3A3012;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .topbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 7px;
    font-family: inherit;
  }
  .back-btn:active { background: var(--surface-alt); }
  .back-btn svg { width: 14px; height: 14px; flex: none; }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 0;
  }
  .brand-logo {
    flex: none;
    width: 32px;
    height: 32px;
    display: block;
  }
  .brand small {
    display: block;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .refresh-btn {
    flex: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:active { background: var(--surface-alt); }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .topbar-row-nav { margin-top: 10px; display: flex; gap: 8px; }
  .nav-tab-btn {
    flex: 1;
    border: 1px dashed var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .nav-tab-btn:active { background: var(--surface-alt); }
  /* Category row (Orders/Inventory) is the persistent top-level switch —
     solid fill on whichever side is active. */
  .nav-tab-btn.active { background: var(--accent); color: var(--accent-contrast); border-style: solid; }
  /* Sub-nav lists every page in the current category (3 for Orders, 4 for
     Inventory), so it reads lighter/smaller than the two primary category
     buttons above it. */
  /* One line, always: Inventory has five buttons (two with count bubbles),
     so the spacing is tight and tightens further on the narrowest phones
     rather than letting the last button wrap onto a second line. */
  .topbar-row-subnav { margin-top: 8px; flex-wrap: nowrap; gap: 6px; }
  .topbar-row-subnav .nav-tab-btn {
    flex: 0 1 auto;
    align-self: stretch; /* the bubble buttons are a hair taller — keep every button level */
    white-space: nowrap;
    border: 1px solid var(--border);
    background: none;
    font-size: 12.5px;
    padding: 5px 9px;
    border-radius: 6px;
  }
  @media (max-width: 380px) {
    .topbar-row-subnav { gap: 4px; }
    .topbar-row-subnav .nav-tab-btn { font-size: 12px; padding: 5px 6px; }
    .topbar-row-subnav .wanted-list-badge { margin-left: 3px; padding: 0 3px; }
  }
  @media (max-width: 340px) {
    .topbar-row-subnav { gap: 3px; }
    .topbar-row-subnav .nav-tab-btn { font-size: 11.5px; padding: 5px 4px; }
  }
  .topbar-row-subnav .nav-tab-btn:active { background: var(--surface-alt); }
  /* The page you're actually on stays in this row rather than vanishing
     — same solid-fill .active look the two primary category buttons use.
     Both background and border-color need restating here, not just
     border: the plain .nav-tab-btn.active rule above sets them, but
     .topbar-row-subnav .nav-tab-btn (same specificity, declared after it)
     sets background:none/border:1px solid var(--border) too — without
     this override, that later same-specificity rule wins the cascade and
     the "active" button would render with no fill and no border, nearly
     invisible text floating with nothing around it. */
  .topbar-row-subnav .nav-tab-btn.active { background: var(--accent); border-color: transparent; }
  .wanted-list-badge {
    display: inline-block;
    margin-left: 5px;
    min-width: 15px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 15px;
  }
  /* Otherwise the badge (accent bg/contrast text) disappears into the
     button's own now-accent fill once Wanted List is the active page —
     flip it so it still reads as a badge sitting on top of the button. */
  .nav-tab-btn.active .wanted-list-badge { background: var(--accent-contrast); color: var(--accent); }

  main { flex: 1; padding: 4px 16px 32px; }

  /* ---- Status states ---- */
  .state-block {
    margin-top: 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13.5px;
    padding: 24px 12px;
  }
  .state-block.error { color: var(--danger); }
  .state-block .retry-btn {
    margin-top: 12px;
    display: inline-block;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .state-block .retry-btn:active { background: var(--surface-alt); }

  /* ---- Orders list ---- */
  .order-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 14px;
    margin-top: 12px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
  }
  .order-card:active { background: var(--surface-alt); }
  /* Blue outline, not the gold tint .needs-pick already uses for "still
     needs picked" — a card that's merely unlogged in the spreadsheet
     reads as a different kind of reminder (an outline, not a fill),
     distinct from a second "new order" flag. Declared before .needs-pick
     so an order needing both (still picking AND not yet logged) shows the
     picking reminder, the more time-sensitive of the two, when the
     cascade has to pick one — .needs-pick resets border-color back to
     default so the blue outline doesn't linger under the gold fill. */
  .order-card.needs-log { border-color: var(--info); border-width: 1.5px; }
  .order-card.needs-pick { background: var(--accent-soft); border-color: var(--border); }
  .order-card.needs-pick:active { background: var(--accent-soft); filter: brightness(0.94); }
  /* A Completed order lingers in the list for a week (see orders.js) so
     Ryan can catch anything the buyer flags, but it's done — nothing left
     to act on — so it reads as visually "put away" rather than an active
     card: a dashed border in place of the usual solid one, and the picks
     bar grayed out regardless of its own fill color (overriding .done's
     green — pick state doesn't matter anymore once an order's complete). */
  .order-card.is-complete { border-style: dashed; }
  .order-card.is-complete .progress-fill { background: var(--text-secondary); }

  .order-status-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .status-action-btn {
    width: 100%;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .status-action-btn:active { background: var(--surface-alt); }
  /* Same solid muted look as .drive-thru-btn:disabled ("Drive Thru
     Sent") — not a blanket opacity fade, which washed the border out to
     near-invisible against a dark background (Ryan's own screenshot:
     "Filed" read as a borderless gray box). A "done" state still needs
     to look like a real button, just a quieter one. */
  .status-action-btn:disabled {
    color: var(--text-secondary);
    border-color: var(--border);
    background: var(--surface-alt);
    cursor: default;
  }
  .status-action-btn.to-packed { color: var(--info); border-color: var(--info); }
  .status-action-btn.to-shipped { color: var(--success); border-color: var(--success); }
  .status-action-btn.to-completed { color: var(--purple); border-color: var(--purple); }
  .status-action-btn.list-drive-thru-btn { color: var(--accent); border-color: var(--accent); }
  .status-action-btn.pickup-btn { color: var(--accent); border-color: var(--accent); }
  .status-action-btn.list-file-btn,
  .status-action-btn.file-order-btn { color: var(--text-secondary); border-color: var(--text-secondary); }
  /* Same blue as .needs-log's card outline and the square "logged" badge
     — one consistent color for the whole spreadsheet-logged feature. */
  .status-action-btn.to-logged { color: var(--info); border-color: var(--info); }

  .pickup-reminder-row {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .order-top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .order-id { font-weight: 600; font-size: 15px; }
  .order-id-group { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .order-date { font-size: 12px; color: var(--text-secondary); flex: none; }

  .status-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    flex: none;
  }
  .status-badge.tone-fresh { color: var(--accent); background: var(--accent-soft); }
  .status-badge.tone-packed { color: var(--success); background: var(--success-bg); }
  .status-badge.tone-done { color: var(--info); background: var(--info-bg); }
  .status-badge.tone-waiting { color: var(--text-secondary); background: var(--surface-alt); }
  .status-badge.tone-complete { color: var(--text-secondary); background: var(--surface-alt); }
  .status-badge.tone-problem { color: var(--danger); background: var(--surface-alt); }
  .order-buyer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .order-total {
    flex: none;
    font-weight: 600;
    color: var(--text);
  }
  .order-lots-items {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .order-weight, .order-type-summary, .buyer-previous-orders {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .order-progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .topbar-submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }
  .topbar-submit-total { font-size: 15px; font-weight: 700; color: var(--text); }
  .progress-track {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-alt);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.2s ease;
  }
  .progress-fill.done { background: var(--success); }
  .progress-label {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* ---- Order detail ---- */
  .order-summary {
    padding-top: 10px;
  }
  .order-summary .order-id { font-size: 17px; }
  .order-summary .order-buyer { margin-top: 4px; }

  /* Order Lookup detail only (readOnly) — id/status/buyer/weight/type
     breakdown pins below the topbar while the action row and item list
     scroll underneath. `top` is set inline at render time to the topbar's
     actual measured height (it varies by view/state), the same pattern
     jumpToItemsBtn's scroll handler already uses. background+border-bottom
     keep it visually distinct from the item list scrolling under it. */
  .order-sticky-top {
    position: sticky;
    z-index: 4;
    background: var(--bg);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .picked-count {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .picked-count strong { color: var(--text); }

  .jump-to-items-btn {
    width: 100%;
    border: 1px solid var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .jump-to-items-btn:active { background: var(--surface-alt); }

  .financial-total {
    font-weight: 700;
    font-size: 14.5px;
  }
  .financial-total .contact-label { color: var(--text); }

  .contact-section {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .contact-row {
    display: flex;
    gap: 10px;
    font-size: 13.5px;
    padding: 4px 0;
  }
  .contact-row + .contact-row { border-top: 1px solid var(--border); }
  .contact-label {
    flex: 0 0 64px;
    color: var(--text-secondary);
  }
  .contact-address { line-height: 1.4; }
  .tracking-number-link {
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }
  .tracking-number-link:active { color: var(--accent); }
  .contact-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .copy-btn {
    flex: 1;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--accent);
    cursor: pointer;
  }
  .copy-btn:active { background: var(--surface-alt); }

  .tracking-entry {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .tracking-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 13.5px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .tracking-save-btn {
    flex: 0 0 auto;
    padding: 5px 12px;
  }

  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .item-row:active { background: var(--surface-alt); }
  .item-row.picked {
    background: var(--success-bg);
    border-color: transparent;
    opacity: 0.75;
  }

  .item-thumb {
    position: relative;
    flex: none;
    width: 65px;
    height: 65px;
    border-radius: 8px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .item-thumb svg { width: 35px; height: 35px; color: var(--text-secondary); }
  .thumb-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 7px;
  }
  .item-row.picked .item-thumb { opacity: 0.6; }

  .qty-chip {
    position: absolute;
    top: -8px;
    left: -8px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-contrast);
    border: 2px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12px;
  }
  .item-row.picked .qty-chip {
    background: var(--success);
    color: #fff;
  }
  /* Multi-piece lots get a visibly bigger, bolder badge than a plain
     qty-1 item — a poka-yoke cue so a >1 lot doesn't quietly get picked
     as if it were a single piece. */
  .qty-chip.multi {
    min-width: 30px;
    height: 30px;
    top: -10px;
    left: -10px;
    border-width: 3px;
    font-size: 13.5px;
  }

  /* A multi-piece lot mid-count (tapped at least once, not yet fully
     tapped) — distinct from both "untouched" and "fully picked" (green,
     via .item-row.picked above), so a half-picked lot never looks the
     same as a done one. */
  .item-row.partial { background: var(--accent-soft); border-color: transparent; }

  .item-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .item-progress-row .progress-track { height: 5px; }
  .item-progress-row .progress-label { font-size: 11px; }

  .item-body { flex: 1; min-width: 0; }
  .item-line1 {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .item-no {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .item-line1-right {
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex: none;
  }
  .item-type-tag {
    font-size: 10.5px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    flex: none;
  }
  /* ---- Sort List page ---- */
  .sort-card { flex-wrap: wrap; cursor: default; }
  .sort-card:active { background: var(--surface); }
  .sort-card > .item-thumb { width: 64px; height: 64px; }
  .sort-card .sort-fig-row > .item-thumb { width: 52px; height: 52px; }
  .sort-card .item-body { min-width: 0; flex: 1 1 0; }
  .sort-card-extra, .sort-card-actions { flex: 1 0 100%; }
  .sort-card-actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .sort-fig-row { cursor: default; }
  .sort-lookup-link {
    display: inline-block; margin-top: 2px; padding: 2px 0; border: 0; background: none;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--info); cursor: pointer;
  }
  .sort-fig-row.sort-fig-all { background: var(--success-bg); }

  /* ---- Add Inventory ---- */
  .inventory-intro {

  }

    border-radius: 10px;
    padding: 20px 16px;
    text-align: center;
  }
  .inventory-file-input { font-size: 13.5px; font-family: inherit; }
  /* Unlike Add Inventory's own upload box (just a centered file input,
     no text), this one carries an explanatory line above the input —
     centered multi-line text reads oddly, so left-align it and give the
     input row its own breathing room below it rather than sitting flush
     under the last line of text. */
  .wanted-bank-import { text-align: left; }
  .wanted-bank-import .inventory-intro { padding-top: 0; margin-bottom: 14px; }
  .wanted-manual-add { margin-top: 16px; }
  .wanted-manual-itemno-row { display: flex; gap: 8px; }

    min-width: 0;

  .wanted-manual-name-preview { margin-top: 10px; }
  .wanted-manual-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    gap: 8px;
    margin-top: 14px;
  }
  .inventory-total-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .inventory-total-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
  }
  .inventory-summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .inventory-bulk-actions { display: flex; gap: 8px; }
  .inventory-bulk-actions button, .inv-start-over-btn {
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;

  .inventory-bulk-actions button:active, .inv-start-over-btn:active { background: var(--surface-alt); }
  .inv-start-over-btn:disabled { opacity: 0.5; cursor: default; }
  .inventory-submit-row .inv-start-over-btn { align-self: center; }

  .item-row.inventory-row { cursor: default; }
  .item-row.inventory-row:active { background: var(--surface); }
  .inventory-row.skipped { opacity: 0.45; }
  /* A stock room listing isn't live for sale — a dotted gray outline marks
     it. More specific than the unsaved-change/delete tints (which blank the
     border), so the outline stays visible while editing. Padding is one
     pixel less to absorb the thicker border without shifting the card. */
  .item-row.inventory-row.in-stock-room { border: 2px dotted var(--text-secondary); padding: 11px; }
  /* Marks a row still waiting on a price check before submit — cleared
     (back to the plain default border) the moment Ryan touches that row's
     own Price field, not on page load or any other edit. On a long list
     this is the at-a-glance way to tell "already looked at the price" from
     "haven't gotten to it yet" without re-reading each one. */
  .inventory-row.needs-review { border: 2px solid var(--info); }

    height: 20px;
    margin-top: 4px;

  .inventory-row .item-thumb { cursor: pointer; }

    margin-top: 8px;

  .inventory-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .inventory-field label {
    font-size: 10.5px;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .inventory-field label .field-hint {
    text-transform: none;
    font-weight: 400;
    letter-spacing: normal;
  }
  .inventory-field input, .inventory-field select, .inventory-field textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    width: 100%;
    min-width: 0;
  }
  .inventory-field textarea {
    resize: vertical;
    min-height: 40px;
  }
  .inventory-field.remarks-field, .inventory-field.description-field, .inventory-field.sale-field { grid-column: 1 / -1; }
  /* Sale % box with the "buyers pay" note beside it. */
  .inventory-field .sale-field-row { display: flex; align-items: center; gap: 10px; }
  .inventory-field .sale-field-row input { width: 84px; flex: none; }
  .inventory-field .sale-note { font-size: 12.5px; color: var(--text-secondary); }
  /* A native date input's own picker control can render at an intrinsic,
     locale-formatted width (e.g. "Aug 18, 2026") that CSS width/
     max-width on the input itself doesn't reliably constrain, especially
     on iOS — the rendered control can paint past its box even though the
     box's own layout width is correct. overflow:hidden on the field
     wrapper is the actual hard guarantee: nothing can ever paint past
     this cell's edge, whatever the native control tries to do. Paired
     with .sale-fields-row below, which gives the date column more than
     half the row so clipping is the rare fallback, not the normal case. */
  .inventory-field.date-field { overflow: hidden; }
  .inventory-field.date-field input { font-size: 12px; }
  /* Used on the two Bulk Sale field rows (item type/date threshold,
     %-off/end date) so the date column gets more than an even 50/50
     split — the other field in each pair (a short select or a 2-digit
     number) doesn't need it. */
  .sale-fields-row { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) !important; }
  .inventory-row-result {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;

  .inventory-row-result.success { color: var(--success); }
  .inventory-row-result.error { color: var(--danger); }
  .inventory-row.result-success { opacity: 0.6; }

  .manage-inventory-search,
  .order-lookup-search,
  .set-fig-lookup-search {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;

    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 14px;
    margin-bottom: 14px;
  }
  .sale-banner-text { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--text); }
  .sale-banner-text span { color: var(--text-secondary); font-size: 12px; }
  /* Same tinted shell either way — "a sale is running" and "a sale ran
     past its end date" are both states Ryan should notice, not a
     neutral/good vs. bad distinction, so there's nothing more to flip
     here once the date's passed; the text itself says which one it is. */
  /* Shared visual identity for every "this is sale-related" container —
     the entry-point boxes, the draft/age-threshold panels, the
     multi-select toolbar, and the active-sale banner all get the same
     tinted treatment and live in the same saleAreaHtml() slot, so the
     whole bulk-sale feature reads as one clearly-labeled area of the
     page, distinct from ordinary browse/search chrome around it and
     from the blue "info" tint used elsewhere (the select toolbar's own
     family here aside). */
  .sale-draft-panel {
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 12px;
    margin-top: 14px;
    margin-bottom: 14px;
  }
  .sale-draft-title { font-weight: 600; font-size: 14px; color: var(--danger); }
  .sale-tools-box-desc { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
  .sale-draft-panel .manage-inventory-sort-row { margin-top: 10px; }
  .sale-age-quick-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  /* The one-line default state of the whole Bulk Sale area — plain text,
     no box at all, so it stays out of the way until tapped. Its sibling,
     the collapse button inside the expanded box above, shares the same
     look so the two read as one toggle rather than two different
     controls. */
  .sale-area-collapsed-btn, .sale-area-collapse-btn {
    display: block;
    border: none;
    background: none;
    color: var(--danger);
    font-family: inherit;
    font-weight: 600;

  .sale-area-collapse-btn { font-size: 14px; margin-bottom: 4px; }
  .sale-select-toolbar {
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 14px;
    margin-bottom: 14px;
  }
  .sale-select-toolbar-text { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--text); }
  .sale-select-toolbar-text span { color: var(--text-secondary); font-size: 12px; }
  .sale-preview-list {
    margin-top: 10px;
    max-height: 280px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);

    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 6px;
    padding: 6px 8px;
    font-size: 12.5px;

  .sale-preview-name { color: var(--text-secondary); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sale-preview-qty { color: var(--text-secondary); flex: none; }
  /* Always its own full-width line below the name/qty, regardless of
     how short the name is — flex-basis: 100% forces a wrap here, and
     since this is a single flex item (price + remove button together)
     the remove button lands right after it on that same new line
     rather than wrapping to a third line of its own. */
  .sale-preview-price-row { flex: 1 1 100%; display: flex; align-items: center; justify-content: space-between; }
  .sale-preview-price { flex: none; white-space: nowrap; }
  .sale-preview-price strong { color: var(--danger); }
  .sale-preview-remove-btn {

    border: none;
    background: none;
    color: var(--text-secondary);
    font-size: 16px;
    line-height: 1;

       3px/4px padding gave a target only a few pixels across, too small
       to reliably hit with a thumb. */
    min-width: 36px;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;

  .fig-log-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--info);

    margin-top: 14px;
    font-size: 13px;

  .browse-tile.browse-tile-select { display: flex; align-items: center; gap: 8px; cursor: default; }

  .browse-tile-nav {

    justify-content: space-between;
    align-items: flex-start;
    flex: 1 1 auto;
    min-width: 0;

    margin: 0;

  .sale-select-whole-row {

    gap: 8px;
    font-size: 13px;

    border-radius: 8px;

  .sale-select-whole-row input { width: 19px; height: 19px; }
  .set-fig-lookup-intro { color: var(--text-secondary); font-size: 13.5px; }
  .set-fig-lookup-type-row { display: flex; gap: 8px; margin-top: 10px; }
  /* The Set/Minifig lookup-type toggle and the Minifigs/Parts results
     sub-toggle share this look on purpose — both are "pick one of two
     modes" controls, just at different levels (which number to look up,
     vs. which half of one lookup's results to show). */
  .set-fig-type-btn, .set-fig-subview-btn {
    flex: 1;
    border: 1px dashed var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .set-fig-type-btn.active, .set-fig-subview-btn.active { background: var(--accent); color: var(--accent-contrast); border-style: solid; }
  .set-fig-lookup-form { display: flex; gap: 8px; align-items: center; }
  .set-fig-lookup-form .set-fig-lookup-search { flex: 1; }
  .set-fig-lookup-btn {
    flex: none;
    margin-top: 4px;
    border: 1.5px solid transparent;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  /* Outlined rather than filled while it reads "Clear" — a visually
     lighter, less primary-looking action than "Look up", since it's
     resetting the search rather than submitting it. */
  .set-fig-lookup-btn.clear { background: none; border-color: var(--accent); color: var(--accent); }
  .set-fig-match-row .item-stock-count { margin-top: 4px; }
  /* Own tint rather than reusing .item-row.picked — that class also
     strikes through the name and dims the thumbnail (right for a picked-
     off pick-list item, backwards here: "owned" should look available,
     not crossed out). */
  .set-fig-match-row.owned { background: var(--success-bg); border-color: transparent; }
  /* A manual mark gets the same green as a real inventory match (it reads
     as "in stock" either way) but a dashed accent border on top, so Ryan
     can still tell "really in my listed inventory" apart from "I just
     tapped Temp add to stock" at a glance. */
  .set-fig-match-row.manual-owned { border: 1px dashed var(--accent); }
  .set-fig-manual-qty-input {
    width: 52px;
    font-family: inherit;
    font-size: 13px;
    padding: 3px 5px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  /* "Temp add to stock" and "Add to wanted list" share this look on
     purpose — same dashed-outline-to-solid-fill toggle, since both are
     the same kind of action: tap to flag something about this row. */
  .set-fig-wanted-bank-btn, .set-fig-manual-owned-btn {
    display: block;
    margin-top: 8px;
    border: 1px dashed var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .set-fig-wanted-bank-btn.added, .set-fig-manual-owned-btn.added { border-style: solid; background: var(--accent); color: var(--accent-contrast); }
  /* A navigational link, not a state-toggle like the two buttons above —
     plain underlined text (same treatment as "View on BrickLink") rather
     than a bordered button, so it doesn't visually compete with "Temp add
     to stock"/"Add to wanted list" as if it were another action on this
     row's own in-stock status. */
  .set-fig-drill-btn, .set-fig-manage-btn {
    display: block;
    margin-top: 6px;
    border: none;
    background: none;
    padding: 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
    cursor: pointer;
  }
  .set-fig-back-btn { margin-top: 10px; }
  /* The sort-list add button sits in the header card's title block, so it's
     a compact one rather than a full-size action button. */
  .sort-list-add-btn { font-size: 12px; padding: 5px 10px; margin-top: 8px; text-align: left; }
  /* Same reason Manage Inventory's .item-row.inventory-row needs this —
     the price-guide block is a third flex child (sibling of .item-thumb/
     .item-body) meant to drop to its own full-width line below them. */
  .set-fig-match-row, .set-fig-header-card { flex-wrap: wrap; }
  .set-fig-missing-hint { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  /* The set/fig itself, not one of its parts — distinguished from the
     match rows below it with the accent color rather than the plain/owned
     tint, same idea as a section header rather than a list item. A bit
     more top margin than an ordinary .item-row's 10px — it's sitting
     right under the lookup form, not another card, so it read as too
     snug against it at the default spacing. */
  .set-fig-header-card { border-color: var(--accent); border-width: 1.5px; margin-top: 16px; }
  .wanted-bank-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .wanted-bank-email-link { text-decoration: none; display: inline-flex; align-items: center; }
  .wanted-bank-clear-btn { color: var(--danger); border-color: var(--danger); }
  .wanted-bank-qty-field {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .wanted-bank-qty-input {
    width: 52px;
    font-family: inherit;
    font-size: 13px;
    padding: 3px 5px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);

  .wanted-bank-row { flex-wrap: wrap; }
  .manage-inventory-cap-note { color: var(--text-secondary); font-size: 12px; text-align: center; margin-top: 10px; }
  .manage-inventory-sort-select,
  .order-lookup-sort-select {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 7px;

  .browse-tile-recent .browse-tile-name { color: var(--accent); }
  /* Layout-only override: the stats tiles sit right after a hint/breadcrumb
     line here instead of being the first thing in the view (unlike the
     orders list and Sales Stats, where .stats-summary's own 4px default is
     already right), so this needs the same 12px gap the old
     Manage-Inventory-only version of this banner used.
     4 tiles (lots/items/value/avg price) instead of the 3 every other
     .stats-summary consumer uses — wraps 2-and-2 rather than squeezing
     four into one row, with a smaller number size so currency fits
     comfortably at half width. */
  .stats-summary.manage-inventory-stats { margin-top: 12px; flex-wrap: wrap; }
  .stats-summary.manage-inventory-stats .stats-summary-tile { flex: 1 1 45%; min-width: 0; }
  .stats-summary.manage-inventory-stats .stats-summary-tile strong { font-size: 14.5px; }

  /* ---- Stat tiles (Orders list header, Manage Inventory banner, Sales
     Stats summary all share this block styling) ---- */
  .stats-summary {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }
  .stats-summary-tile {
    flex: 1;
    text-align: center;
    padding: 12px 8px;

    border: 1px solid var(--border);

  .stats-summary-tile strong {
    display: block;
    font-size: 18px;

    font-weight: 700;
  }
  .stats-summary-tile span {
    font-size: 11.5px;
    color: var(--text-secondary);
  }
  .stats-footnote {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 10px;
  }
  .stats-year-block {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  /* The year heading and every month row below it share one fixed-width
     column layout (orders / avg / revenue, right-aligned) so the numbers
     line up straight down the block instead of each row's text just
     trailing off wherever its own content happens to end. */
  .stats-year-heading {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 12px;
    background: var(--surface-alt);
    font-weight: 700;
    font-size: 14px;
  }
  .stats-year-label { flex: 1; }
  .stats-year-orders { flex: none; width: 72px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .stats-year-avg { flex: none; width: 84px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .stats-year-revenue { flex: none; width: 84px; text-align: right; }
  .stats-month-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stats-month-row + .stats-month-row { border-top: 1px solid var(--border); }
  .stats-month-label { flex: 1; font-weight: 600; color: var(--text); }
  .stats-month-orders { flex: none; width: 72px; text-align: right; }
  .stats-month-avg { flex: none; width: 84px; text-align: right; font-size: 11.5px; }
  .stats-month-revenue { flex: none; width: 84px; text-align: right; color: var(--text); font-weight: 600; }

  /* Box choices tally — its own block below the year/month breakdown,
     same bordered-card language as .stats-year-block but its own row
     shape (a size label, a count, and a free-form pieces/weight range
     that doesn't fit the currency-tuned month-row columns above). */
  .box-stats-block { margin-top: 16px; }
  .box-stats-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .box-stats-row + .box-stats-row { border-top: 1px solid var(--border); }
  .box-stats-label { flex: none; width: 64px; font-weight: 600; color: var(--text); }
  .box-stats-count { flex: none; width: 28px; }
  .box-stats-range { flex: 1; text-align: right; font-size: 11.5px; }
  .box-stats-footnote {
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);

  .manage-inventory-sort-row,
  .order-lookup-sort-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;

  .browse-breadcrumb {

    border-radius: 8px;

    margin-top: 8px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    font-size: 14px;

  /* Sized down and allowed to wrap, per Ryan's own ask — the part-category
     tree's names (e.g. "Minifigure, Torso Assembly") run long enough to
     need the room now that the right side carries three lines instead of

  .browse-tile-name { font-weight: 600; font-size: 13px; flex: 1 1 auto; min-width: 0; padding-right: 10px; }
  .browse-tile-count {

  }
  /* Right-aligned, stacked, close to the count pill it sits under — Ryan's
     own ask, so value/avg read as "belonging to" the quantity rather than

     their own boxed chip (like the count pill above them) rather than
     running together as one line, so they're easier to pick out at a

  .browse-tile-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
  .browse-tile-value-box, .browse-tile-avg-box {

  .browse-tile-avg-box { color: var(--text-secondary); font-weight: 500; }

  .inventory-submit-row {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .inventory-submit-btn {
    width: 100%;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .inventory-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .topbar-submit-btn { flex: none; width: auto; padding: 8px 16px; font-size: 13px; }
  .topbar-cancel-btn {
    flex: none;
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .topbar-cancel-btn:active { background: var(--surface-alt); }
  .topbar-cancel-btn:disabled { opacity: 0.5; cursor: default; }
  .inventory-submit-btn:active { filter: brightness(0.94); }

  .item-row.inventory-row { flex-wrap: wrap; }
  .inventory-price-guide-block { flex: 1 1 100%; min-width: 0; }
  /* View on BrickLink left, the See/Collapse toggle right — both always
     visible above the (collapsible) panel itself, rather than the link
     living inside the panel and only showing once expanded. */
  .price-guide-header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 8px;

  .price-guide-view-link {

    font-weight: 400;
    font-size: 11.5px;
    white-space: nowrap;
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);

  .price-guide-view-link:active { color: var(--accent); }
  .price-guide-hint {

  .price-guide-rank {

    cursor: pointer;

  .reset-btn:active, .bottom-back-btn:active, .select-all-btn:active { background: var(--surface-alt); }
  .bottom-back-btn { color: var(--text); font-weight: 600; }
  .select-all-btn { color: var(--success); border-color: var(--success); }

  .buyer-rating {

  }

  .feedback-icons {
    display: inline-flex;

    flex: none;

    height: 16px;

    line-height: 1;
    flex: none;

  .feedback-icon.given { color: var(--accent); background: var(--accent-soft); }
  .feedback-icon.received-praise { color: var(--success); background: var(--success-bg); }
  .feedback-icon.received-neutral { color: var(--text-secondary); background: var(--surface-alt); }
  .feedback-icon.received-complaint { color: var(--danger); background: var(--surface-alt); }
  /* Square, not round, and blue rather than .given's accent gold — shape
     and color both differ so "logged in spreadsheet" never reads as a
     second feedback-given mark at a glance. Same blue as .needs-log's
     card outline, so the whole logged-in-spreadsheet feature reads as one
     consistent color, distinct from feedback's gold. */
  .feedback-icon.logged { border-radius: 3px; color: var(--info); background: var(--info-bg); }

  /* ---- Drive Thru ---- */
  /* Holds every action button/line the order-summary card offers at once
     (status action(s), Drive Thru, Log in spreadsheet) as equal flex
     items — two fit per row at roughly half width each, with any odd
     one out wrapping to its own full-width row below. Replaces what
     used to be a separate, non-flex .drive-thru-row per button — Ryan
     asked for this once the stack grew to three rows over the course of
     this session (status action, Drive Thru, Log in spreadsheet).
     Deliberately NOT the same "width:100%, let flex-shrink do it" trick
     .order-status-row uses for the list card's (always-exactly-2,
     never-wrapping) RECEIVED-order pair — with flex-wrap in the mix here
     too, a width:100% item's hypothetical (pre-shrink) size already
     fills an entire line on its own, so every item would end up wrapping
     to its own row regardless of how much it then shrinks — wrapping
     happens before shrinking is considered, not after. An explicit ~50%
     flex-basis instead means two items' hypothetical sizes actually fit
     on one line together, so wrapping only kicks in for a genuine third
     item — and flex-grow:1 is what lets that lone item then stretch to
     fill its own row instead of sitting at half width with dead space
     next to it. This flex-basis (not the child's own width:100%, which
     every button/the logged message still carries) is what actually
     governs each item's size here — a non-auto flex-basis always wins
     over width for a flex item's main-axis size, regardless of which
     selector is more specific. min-width: 0 keeps a long button label
     from forcing its flex-basis back up past its shrunk share and
     blowing out the row. */
  .order-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .order-action-row > * { flex: 1 1 calc(50% - 4px); min-width: 0; }
  .drive-thru-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--info);
    color: var(--info);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .drive-thru-btn:active { background: var(--surface-alt); }
  .drive-thru-btn:disabled {
    color: var(--text-secondary);
    border-color: var(--border);
    background: var(--surface-alt);
    cursor: default;
  }

    background: none;
    border: 1px solid var(--border);

    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 6px;
    cursor: pointer;

  .box-choice-btn.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .feedback-section {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .feedback-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .feedback-rating-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .rating-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .rating-btn.selected.praise { color: var(--success); border-color: var(--success); background: var(--success-bg); }
  .rating-btn.selected.neutral { color: var(--info); border-color: var(--info); background: var(--info-bg); }
  .rating-btn.selected.complaint { color: var(--danger); border-color: var(--danger); background: var(--surface-alt); }
  .feedback-textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    resize: vertical;
    min-height: 60px;
    margin-bottom: 10px;
  }
  .feedback-submit-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .feedback-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .feedback-sent-msg { font-size: 13px; color: var(--success); font-weight: 600; }
  /* Sits in the same .order-action-row the "Log in spreadsheet" button it
     replaces does — matching padding, border, and border-radius (global
     box-sizing: border-box means the added border doesn't change the
     box's own height) keeps the row from visibly jumping when it toggles
     between the two, and now reads as a real "done" pill instead of bare
     floating text — Ryan flagged the borderless look from a live
     screenshot. width:100% (not a <button>, so nothing sizes it by
     default) is what lets it share that row's flex-shrink split with
     whatever button sits next to it, same as every .status-action-btn
     there. Tappable to undo, so cursor: pointer despite not being a
     <button>. */
  .spreadsheet-logged-msg { width: 100%; font-size: 12.5px; font-weight: 600; color: var(--info); border: 1px solid var(--info); border-radius: 6px; padding: 8px 14px; cursor: pointer; text-align: center; }

  .buyer-feedback-section {
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .buyer-feedback-section.praise { background: var(--success-bg); border-color: var(--success); }
  .buyer-feedback-section.neutral { background: var(--info-bg); border-color: var(--info); }
  .buyer-feedback-section.complaint { background: var(--surface-alt); border-color: var(--danger); }
  .buyer-feedback-heading {
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .buyer-feedback-section.praise .buyer-feedback-heading { color: var(--success); }
  .buyer-feedback-section.neutral .buyer-feedback-heading { color: var(--info); }
  .buyer-feedback-section.complaint .buyer-feedback-heading { color: var(--danger); }
  .buyer-feedback-comment { font-size: 13.5px; color: var(--text); }
  .buyer-feedback-date { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow: hidden;
    touch-action: none;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .lightbox-hint {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    pointer-events: none;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  .login-gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-gate-card {
    width: 100%;
    max-width: 320px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    text-align: center;
  }
  .login-gate-logo { width: 44px; height: 44px; border-radius: 10px; }
  .login-gate-card h1 {
    margin: 12px 0 4px;
    font-size: 17px;
    font-weight: 700;

  }
  .login-gate-card p {

  }
  .login-gate-card input {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    text-align: center;
    box-sizing: border-box;
  }
  .login-gate-card button {
    width: 100%;
    margin-top: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;

  .login-gate-card button:disabled { opacity: 0.6; cursor: default; }
  .login-gate-card button:active { filter: brightness(0.94); }

</style>
</head>
<body>
