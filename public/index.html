<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>BrickLink Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script type="module" src="/vendor/pdfjs/pdfjs-bridge.js"></script>
<script type="module" src="/vendor/pdf-lib/pdf-lib-bridge.js"></script>
<style>
  :root {
    --bg: #F5F3EF;
    --surface: #FFFFFF;
    --surface-alt: #ECE8E1;
    --border: #DDD7CC;
    --text: #1D1B18;
    --text-secondary: #6B6459;
    --accent: #C97A22;
    --accent-soft: #F2E2CC;
    --accent-contrast: #FFFFFF;
    --success: #2F8F5B;
    --success-bg: #E3F3EA;
    --danger: #B4483A;
    --danger-soft: #F5DCD7;
    --info: #2E5FA3;
    --info-bg: #E3EAF5;
    --purple: #7A5691;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161A;
      --surface: #1D2027;
      --surface-alt: #262A33;
      --border: #31353F;
      --text: #EDEBE6;
      --text-secondary: #9CA3AF;
      --accent: #F2A93B;
      --accent-soft: #3A2D14;
      --accent-contrast: #14161A;
      --success: #4FAE7B;
      --success-bg: #1C3327;
      --danger: #E0685A;
      --danger-soft: #3A1F1B;
      --info: #7BB0FA;
      --info-bg: #1C2A40;
      --purple: #C79FE0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161A;
    --surface: #1D2027;
    --surface-alt: #262A33;
    --border: #31353F;
    --text: #EDEBE6;
    --text-secondary: #9CA3AF;
    --accent: #F2A93B;
    --accent-soft: #3A2D14;
    --accent-contrast: #14161A;
    --success: #4FAE7B;
    --success-bg: #1C3327;
    --danger: #E0685A;
    --danger-soft: #3A1F1B;
    --info: #7BB0FA;
    --info-bg: #1C2A40;
    --purple: #C79FE0;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .topbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 7px;
    font-family: inherit;
  }
  .back-btn:active { background: var(--surface-alt); }
  .back-btn svg { width: 14px; height: 14px; flex: none; }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 0;
  }
  .brand-logo {
    flex: none;
    width: 32px;
    height: 32px;
    display: block;
  }
  .brand small {
    display: block;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .refresh-btn {
    flex: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:active { background: var(--surface-alt); }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .topbar-row-nav { margin-top: 10px; display: flex; gap: 8px; }
  .nav-tab-btn {
    flex: 1;
    border: 1px dashed var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .nav-tab-btn:active { background: var(--surface-alt); }
  /* Category row (Orders/Inventory) is the persistent top-level switch —
     solid fill on whichever side is active. */
  .nav-tab-btn.active { background: var(--accent); color: var(--accent-contrast); border-style: solid; }
  /* Sub-nav is one secondary "jump to the sibling page" link, so it reads
     lighter/smaller than the two primary category buttons above it. */
  .topbar-row-subnav { margin-top: 8px; }
  .topbar-row-subnav .nav-tab-btn {
    flex: none;
    border: 1px solid var(--border);
    background: none;
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 6px;
  }
  .topbar-row-subnav .nav-tab-btn:active { background: var(--surface-alt); }

  main { flex: 1; padding: 4px 16px 32px; }

  /* ---- Status states ---- */
  .state-block {
    margin-top: 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13.5px;
    padding: 24px 12px;
  }
  .state-block.error { color: var(--danger); }
  .state-block .retry-btn {
    margin-top: 12px;
    display: inline-block;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .state-block .retry-btn:active { background: var(--surface-alt); }

  /* ---- Orders list ---- */
  .order-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 14px;
    margin-top: 12px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
  }
  .order-card:active { background: var(--surface-alt); }
  /* Blue, not the gold .needs-pick already uses for "still needs picked"
     — a card that's merely unlogged in the spreadsheet reads as a
     different kind of reminder, not a second "new order" flag. Declared
     before .needs-pick so an order needing both (still picking AND not
     yet logged) shows the picking reminder, the more time-sensitive of
     the two, when the cascade has to pick one. */
  .order-card.needs-log { background: var(--info-bg); }
  .order-card.needs-log:active { background: var(--info-bg); filter: brightness(0.94); }
  .order-card.needs-pick { background: var(--accent-soft); }
  .order-card.needs-pick:active { background: var(--accent-soft); filter: brightness(0.94); }
  /* A Completed order lingers in the list for a week (see orders.js) so
     Ryan can catch anything the buyer flags, but it's done — nothing left
     to act on — so it reads as visually "put away" rather than an active
     card: a dashed border in place of the usual solid one, and the picks
     bar grayed out regardless of its own fill color (overriding .done's
     green — pick state doesn't matter anymore once an order's complete). */
  .order-card.is-complete { border-style: dashed; }
  .order-card.is-complete .progress-fill { background: var(--text-secondary); }

  .order-status-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .status-action-btn {
    width: 100%;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .status-action-btn:active { background: var(--surface-alt); }
  /* Same solid muted look as .drive-thru-btn:disabled ("Drive Thru
     Sent") — not a blanket opacity fade, which washed the border out to
     near-invisible against a dark background (Ryan's own screenshot:
     "Filed" read as a borderless gray box). A "done" state still needs
     to look like a real button, just a quieter one. */
  .status-action-btn:disabled {
    color: var(--text-secondary);
    border-color: var(--border);
    background: var(--surface-alt);
    cursor: default;
  }
  .status-action-btn.to-packed { color: var(--info); border-color: var(--info); }
  .status-action-btn.to-shipped { color: var(--success); border-color: var(--success); }
  .status-action-btn.to-completed { color: var(--purple); border-color: var(--purple); }
  .status-action-btn.list-drive-thru-btn { color: var(--accent); border-color: var(--accent); }
  .status-action-btn.pickup-btn { color: var(--accent); border-color: var(--accent); }
  .status-action-btn.list-file-btn,
  .status-action-btn.file-order-btn { color: var(--text-secondary); border-color: var(--text-secondary); }
  /* Same blue as .needs-log's card tint and the square "logged" badge —
     one consistent color for the whole spreadsheet-logged feature. */
  .status-action-btn.to-logged { color: var(--info); border-color: var(--info); }

  .pickup-reminder-row {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .order-top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .order-id { font-weight: 600; font-size: 15px; }
  .order-id-group { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .order-date { font-size: 12px; color: var(--text-secondary); flex: none; }

  .status-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    flex: none;
  }
  .status-badge.tone-fresh { color: var(--accent); background: var(--accent-soft); }
  .status-badge.tone-packed { color: var(--success); background: var(--success-bg); }
  .status-badge.tone-done { color: var(--info); background: var(--info-bg); }
  .status-badge.tone-waiting { color: var(--text-secondary); background: var(--surface-alt); }
  .status-badge.tone-complete { color: var(--text-secondary); background: var(--surface-alt); }
  .status-badge.tone-problem { color: var(--danger); background: var(--surface-alt); }
  .order-buyer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .order-total {
    flex: none;
    font-weight: 600;
    color: var(--text);
  }
  .order-lots-items {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .order-weight, .order-type-summary, .buyer-previous-orders {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .order-progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .topbar-submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }
  .topbar-submit-total { font-size: 15px; font-weight: 700; color: var(--text); }
  .progress-track {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-alt);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.2s ease;
  }
  .progress-fill.done { background: var(--success); }
  .progress-label {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* ---- Order detail ---- */
  .order-summary {
    padding-top: 10px;
  }
  .order-summary .order-id { font-size: 17px; }
  .order-summary .order-buyer { margin-top: 4px; }

  /* Order Lookup detail only (readOnly) — id/status/buyer/weight/type
     breakdown pins below the topbar while the action row and item list
     scroll underneath. `top` is set inline at render time to the topbar's
     actual measured height (it varies by view/state), the same pattern
     jumpToItemsBtn's scroll handler already uses. background+border-bottom
     keep it visually distinct from the item list scrolling under it. */
  .order-sticky-top {
    position: sticky;
    z-index: 4;
    background: var(--bg);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .picked-count {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .picked-count strong { color: var(--text); }

  .jump-to-items-btn {
    width: 100%;
    border: 1px solid var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .jump-to-items-btn:active { background: var(--surface-alt); }

  .financial-total {
    font-weight: 700;
    font-size: 14.5px;
  }
  .financial-total .contact-label { color: var(--text); }

  .contact-section {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .contact-row {
    display: flex;
    gap: 10px;
    font-size: 13.5px;
    padding: 4px 0;
  }
  .contact-row + .contact-row { border-top: 1px solid var(--border); }
  .contact-label {
    flex: 0 0 64px;
    color: var(--text-secondary);
  }
  .contact-address { line-height: 1.4; }
  .tracking-number-link {
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }
  .tracking-number-link:active { color: var(--accent); }
  .contact-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .copy-btn {
    flex: 1;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--accent);
    cursor: pointer;
  }
  .copy-btn:active { background: var(--surface-alt); }

  .tracking-entry {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .tracking-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 13.5px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .tracking-save-btn {
    flex: 0 0 auto;
    padding: 5px 12px;
  }

  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .item-row:active { background: var(--surface-alt); }
  .item-row.picked {
    background: var(--success-bg);
    border-color: transparent;
    opacity: 0.75;
  }

  .item-thumb {
    position: relative;
    flex: none;
    width: 65px;
    height: 65px;
    border-radius: 8px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .item-thumb svg { width: 35px; height: 35px; color: var(--text-secondary); }
  .thumb-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 7px;
  }
  .item-row.picked .item-thumb { opacity: 0.6; }

  .qty-chip {
    position: absolute;
    top: -8px;
    left: -8px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-contrast);
    border: 2px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12px;
  }
  .item-row.picked .qty-chip {
    background: var(--success);
    color: #fff;
  }
  /* Multi-piece lots get a visibly bigger, bolder badge than a plain
     qty-1 item — a poka-yoke cue so a >1 lot doesn't quietly get picked
     as if it were a single piece. */
  .qty-chip.multi {
    min-width: 30px;
    height: 30px;
    top: -10px;
    left: -10px;
    border-width: 3px;
    font-size: 13.5px;
  }

  /* A multi-piece lot mid-count (tapped at least once, not yet fully
     tapped) — distinct from both "untouched" and "fully picked" (green,
     via .item-row.picked above), so a half-picked lot never looks the
     same as a done one. */
  .item-row.partial { background: var(--accent-soft); border-color: transparent; }

  .item-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .item-progress-row .progress-track { height: 5px; }
  .item-progress-row .progress-label { font-size: 11px; }

  .item-body { flex: 1; min-width: 0; }
  .item-line1 {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .item-no {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .item-line1-right {
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex: none;
  }
  .item-type-tag {
    font-size: 10.5px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    flex: none;
  }
  .item-price {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    flex: none;
  }
  .item-name {
    font-size: 14.5px;
    font-weight: 600;
    margin-top: 3px;
    line-height: 1.3;
  }
  .item-row.picked .item-name { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .item-color, .item-stock-count {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .item-remarks {
    font-size: 12px;
    color: var(--danger);
    margin-top: 5px;
    font-style: italic;
  }
  .item-bl-link {
    display: inline-block;
    font-size: 11.5px;
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
    margin-top: 5px;
  }
  .item-bl-link:active { color: var(--accent); }
  .inventory-row-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 5px;
  }
  .delete-row-btn {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .delete-row-btn:active { background: var(--surface-alt); }
  .delete-row-btn.marked { border-color: var(--border); color: var(--text-secondary); }
  .item-row.marked-for-delete { background: var(--danger-soft); border-color: transparent; }
  .delete-pending-note {
    font-size: 12px;
    color: var(--danger);
    font-weight: 600;
    margin-top: 4px;
  }

  .checkmark {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .item-row.picked .checkmark {
    background: var(--success);
    border-color: var(--success);
  }
  .checkmark svg { display: none; width: 14px; height: 14px; }
  .item-row.picked .checkmark svg { display: block; }
  .checkmark svg path { stroke: #fff; }

  .reset-row, .order-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .reset-row { margin-top: 18px; }
  .order-actions { margin-top: 12px; }

  /* ---- Add Inventory ---- */
  .inventory-intro {
    padding-top: 10px;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .inventory-upload {
    margin-top: 16px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 20px 16px;
    text-align: center;
  }
  .inventory-file-input { font-size: 13.5px; font-family: inherit; }
  .label-prep-canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
  }
  .inventory-total-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 14px;

  .manage-inventory-search,

  .set-fig-lookup-intro { color: var(--text-secondary); font-size: 13.5px; }
  .set-fig-lookup-type-row { display: flex; gap: 8px; margin-top: 10px; }
  .set-fig-type-btn {
    flex: 1;

  .set-fig-lookup-form { display: flex; gap: 8px; align-items: center; }
  .set-fig-lookup-form .set-fig-lookup-search { flex: 1; }
  .set-fig-lookup-btn {
    flex: none;
    margin-top: 4px;

  .set-fig-match-row .item-stock-count { margin-top: 4px; }
  /* Own tint rather than reusing .item-row.picked — that class also
     strikes through the name and dims the thumbnail (right for a picked-
     off pick-list item, backwards here: "owned" should look available,
     not crossed out). */
  .set-fig-match-row.owned { background: var(--success-bg); border-color: transparent; }
  /* A manual mark gets the same green as a real inventory match (it reads
     as "in stock" either way) but a dashed accent border on top, so Ryan
     can still tell "really in my listed inventory" apart from "I just
     ticked the box" at a glance. */
  .set-fig-match-row.manual-owned { border: 1px dashed var(--accent); }
  .set-fig-manual-owned-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .set-fig-manual-owned-toggle input[type="checkbox"] { margin: 0; cursor: pointer; }
  .set-fig-manual-qty-input {
    width: 52px;
    font-family: inherit;
    font-size: 13px;
    padding: 3px 5px;

    color: var(--text);

  /* Same reason Manage Inventory's .item-row.inventory-row needs this —
     the price-guide block is a third flex child (sibling of .item-thumb/
     .item-body) meant to drop to its own full-width line below them. */
  .set-fig-match-row, .set-fig-header-card { flex-wrap: wrap; }
  .set-fig-missing-hint { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  /* The set/fig itself, not one of its parts — distinguished from the
     match rows below it with the accent color rather than the plain/owned
     tint, same idea as a section header rather than a list item. A bit
     more top margin than an ordinary .item-row's 10px — it's sitting
     right under the lookup form, not another card, so it read as too
     snug against it at the default spacing. */
  .set-fig-header-card { border-color: var(--accent); border-width: 1.5px; margin-top: 16px; }
  .manage-inventory-cap-note { color: var(--text-secondary); font-size: 12px; text-align: center; margin-top: 10px; }
  .manage-inventory-sort-select,
  .order-lookup-sort-select {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;

    border-radius: 6px;

  .browse-tile-recent { border-color: var(--accent); }
  .browse-tile-recent .browse-tile-name { color: var(--accent); }
  /* Layout-only override: the stats tiles sit right after a hint/breadcrumb
     line here instead of being the first thing in the view (unlike the
     orders list and Sales Stats, where .stats-summary's own 4px default is
     already right), so this needs the same 12px gap the old
     Manage-Inventory-only version of this banner used.
     4 tiles (lots/items/value/avg price) instead of the 3 every other
     .stats-summary consumer uses — wraps 2-and-2 rather than squeezing
     four into one row, with a smaller number size so currency fits
     comfortably at half width. */
  .stats-summary.manage-inventory-stats { margin-top: 12px; flex-wrap: wrap; }
  .stats-summary.manage-inventory-stats .stats-summary-tile { flex: 1 1 45%; min-width: 0; }
  .stats-summary.manage-inventory-stats .stats-summary-tile strong { font-size: 14.5px; }

  /* ---- Stat tiles (Orders list header, Manage Inventory banner, Sales
     Stats summary all share this block styling) ---- */
  .stats-summary {
    display: flex;
    gap: 12px;
    margin-top: 4px;

  .stats-summary-tile {
    flex: 1;
    text-align: center;
    padding: 12px 8px;

    font-size: 18px;

  .stats-summary-tile span {

  .stats-footnote {

  .stats-year-block {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  /* The year heading and every month row below it share one fixed-width
     column layout (orders / avg / revenue, right-aligned) so the numbers
     line up straight down the block instead of each row's text just
     trailing off wherever its own content happens to end. */
  .stats-year-heading {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 12px;
    background: var(--surface-alt);
    font-weight: 700;
    font-size: 14px;
  }
  .stats-year-label { flex: 1; }
  .stats-year-orders { flex: none; width: 72px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .stats-year-avg { flex: none; width: 84px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .stats-year-revenue { flex: none; width: 84px; text-align: right; }
  .stats-month-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stats-month-row + .stats-month-row { border-top: 1px solid var(--border); }
  .stats-month-label { flex: 1; font-weight: 600; color: var(--text); }
  .stats-month-orders { flex: none; width: 72px; text-align: right; }
  .stats-month-avg { flex: none; width: 84px; text-align: right; font-size: 11.5px; }
  .stats-month-revenue { flex: none; width: 84px; text-align: right; color: var(--text); font-weight: 600; }

  /* Box choices tally — its own block below the year/month breakdown,
     same bordered-card language as .stats-year-block but its own row
     shape (a size label, a count, and a free-form pieces/weight range
     that doesn't fit the currency-tuned month-row columns above). */
  .box-stats-block { margin-top: 16px; }
  .box-stats-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .box-stats-row + .box-stats-row { border-top: 1px solid var(--border); }
  .box-stats-label { flex: none; width: 64px; font-weight: 600; color: var(--text); }
  .box-stats-count { flex: none; width: 28px; }
  .box-stats-range { flex: 1; text-align: right; font-size: 11.5px; }
  .box-stats-footnote {
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);

  .manage-inventory-sort-row,
  .order-lookup-sort-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }

  .browse-breadcrumb {
    display: flex;

    gap: 6px;
    margin-top: 14px;
    font-size: 13px;
  }
  .browse-crumb {

  .browse-crumb-sep { color: var(--text-secondary); }

  .browse-tile-list { margin-top: 10px; }
  .browse-tile {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 14px;
    margin-top: 8px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    font-size: 14px;
  }

  /* Sized down and allowed to wrap, per Ryan's own ask — the part-category
     tree's names (e.g. "Minifigure, Torso Assembly") run long enough to
     need the room now that the right side carries three lines instead of

  .browse-tile-name { font-weight: 600; font-size: 13px; flex: 1 1 auto; min-width: 0; padding-right: 10px; }
  .browse-tile-count {

    font-weight: 600;
    background: var(--surface-alt);
    border-radius: 999px;

  }
  /* Right-aligned, stacked, close to the count pill it sits under — Ryan's
     own ask, so value/avg read as "belonging to" the quantity rather than

     their own boxed chip (like the count pill above them) rather than
     running together as one line, so they're easier to pick out at a

  .browse-tile-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
  .browse-tile-value-box, .browse-tile-avg-box {

    font-weight: 600;

  .browse-tile-value-box { color: var(--text); }
  .browse-tile-avg-box { color: var(--text-secondary); font-weight: 500; }

  .inventory-submit-row {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .inventory-submit-btn {
    width: 100%;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .inventory-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .topbar-submit-btn { flex: none; width: auto; padding: 8px 16px; font-size: 13px; }
  .topbar-cancel-btn {
    flex: none;
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .topbar-cancel-btn:active { background: var(--surface-alt); }
  .topbar-cancel-btn:disabled { opacity: 0.5; cursor: default; }
  .inventory-submit-btn:active { filter: brightness(0.94); }

  .item-row.inventory-row { flex-wrap: wrap; }
  .inventory-price-guide-block { flex: 1 1 100%; min-width: 0; }
  /* View on BrickLink left, the See/Collapse toggle right — both always
     visible above the (collapsible) panel itself, rather than the link
     living inside the panel and only showing once expanded. */
  .price-guide-header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 8px;
    margin-top: 10px;
  }
  .price-guide-toggle-btn {
    flex: none;
    border: none;
    background: none;

    font-weight: 600;

  .price-guide-panel {

    color: var(--text-secondary);
  }
  .price-guide-stats + .price-guide-stats { margin-top: 3px; }
  .price-guide-stats.error { color: var(--danger); }
  .price-guide-view-link {
    flex: none;
    font-weight: 400;
    font-size: 11.5px;
    white-space: nowrap;
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }
  .price-guide-view-link:active { color: var(--accent); }
  .price-guide-hint {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
    margin-bottom: 6px;
  }
  .price-guide-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .price-guide-row:active { background: var(--surface); }
  .price-guide-row + .price-guide-row { border-top: 1px solid var(--border); }
  .price-guide-rank {
    flex: none;
    width: 18px;
    color: var(--text-secondary);
    font-size: 11px;
  }
  .price-guide-qty {
    flex: none;
    width: 30px;
    color: var(--text-secondary);
  }
  .price-guide-price { flex: 1; font-weight: 600; }
  .price-guide-cond {

    font-size: 10.5px;
    font-weight: 600;

    padding: 1px 5px;
  }
  .price-guide-cond.new { color: var(--success); background: var(--success-bg); }
  .price-guide-cond.used { color: var(--info); background: var(--info-bg); }
  .price-guide-noship {
    flex: none;
    font-size: 10.5px;
    color: var(--danger);
    border: 1px solid var(--danger);

  .price-guide-collapse-btn {
    display: block;
    width: 100%;
    margin-top: 8px;

    background: none;

  .reset-btn, .bottom-back-btn, .select-all-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .reset-btn:active, .bottom-back-btn:active, .select-all-btn:active { background: var(--surface-alt); }
  .bottom-back-btn { color: var(--text); font-weight: 600; }
  .select-all-btn { color: var(--success); border-color: var(--success); }

  .buyer-rating {
    color: var(--text-secondary);
    font-size: 12px;
  }

  .buyer-real-name {
    color: var(--text-secondary);
    font-weight: 400;
  }

  .feedback-icons {
    display: inline-flex;
    gap: 3px;
    flex: none;
  }
  .feedback-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    line-height: 1;
    flex: none;
  }
  .feedback-icon.given { color: var(--accent); background: var(--accent-soft); }
  .feedback-icon.received-praise { color: var(--success); background: var(--success-bg); }
  .feedback-icon.received-neutral { color: var(--text-secondary); background: var(--surface-alt); }
  .feedback-icon.received-complaint { color: var(--danger); background: var(--surface-alt); }
  /* Square, not round, and blue rather than .given's accent gold — shape
     and color both differ so "logged in spreadsheet" never reads as a
     second feedback-given mark at a glance. Same blue as .needs-log's
     card tint, so the whole logged-in-spreadsheet feature reads as one
     consistent color, distinct from feedback's gold. */
  .feedback-icon.logged { border-radius: 3px; color: var(--info); background: var(--info-bg); }

  /* ---- Drive Thru ---- */
  /* Holds every action button/line the order-summary card offers at once
     (status action(s), Drive Thru, Log in spreadsheet) as equal flex
     items — two fit per row at roughly half width each, with any odd
     one out wrapping to its own full-width row below. Replaces what
     used to be a separate, non-flex .drive-thru-row per button — Ryan
     asked for this once the stack grew to three rows over the course of
     this session (status action, Drive Thru, Log in spreadsheet).
     Deliberately NOT the same "width:100%, let flex-shrink do it" trick
     .order-status-row uses for the list card's (always-exactly-2,
     never-wrapping) RECEIVED-order pair — with flex-wrap in the mix here
     too, a width:100% item's hypothetical (pre-shrink) size already
     fills an entire line on its own, so every item would end up wrapping
     to its own row regardless of how much it then shrinks — wrapping
     happens before shrinking is considered, not after. An explicit ~50%
     flex-basis instead means two items' hypothetical sizes actually fit
     on one line together, so wrapping only kicks in for a genuine third
     item — and flex-grow:1 is what lets that lone item then stretch to
     fill its own row instead of sitting at half width with dead space
     next to it. This flex-basis (not the child's own width:100%, which
     every button/the logged message still carries) is what actually
     governs each item's size here — a non-auto flex-basis always wins
     over width for a flex item's main-axis size, regardless of which
     selector is more specific. min-width: 0 keeps a long button label
     from forcing its flex-basis back up past its shrunk share and
     blowing out the row. */
  .order-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .order-action-row > * { flex: 1 1 calc(50% - 4px); min-width: 0; }
  .drive-thru-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--info);
    color: var(--info);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .drive-thru-btn:active { background: var(--surface-alt); }
  .drive-thru-btn:disabled {
    color: var(--text-secondary);
    border-color: var(--border);
    background: var(--surface-alt);
    cursor: default;
  }

  /* ---- Order messages ---- */
  .messages-section { margin-top: 16px; }
  .messages-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 8px;

  .message-card {

    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
  }
  .message-meta {

  .message-body { font-size: 13px; color: var(--text); white-space: pre-wrap; }

  /* ---- Feedback ---- */
  .box-choice-section {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .box-choice-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .box-choice-row {
    display: flex;
    gap: 8px;
  }
  .box-choice-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .box-choice-btn.selected {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .feedback-section {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .feedback-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .feedback-rating-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .rating-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .rating-btn.selected.praise { color: var(--success); border-color: var(--success); background: var(--success-bg); }
  .rating-btn.selected.neutral { color: var(--info); border-color: var(--info); background: var(--info-bg); }
  .rating-btn.selected.complaint { color: var(--danger); border-color: var(--danger); background: var(--surface-alt); }
  .feedback-textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    resize: vertical;
    min-height: 60px;
    margin-bottom: 10px;
  }
  .feedback-submit-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .feedback-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .feedback-sent-msg { font-size: 13px; color: var(--success); font-weight: 600; }
  /* Sits in the same .order-action-row the "Log in spreadsheet" button it
     replaces does — matching padding, border, and border-radius (global
     box-sizing: border-box means the added border doesn't change the
     box's own height) keeps the row from visibly jumping when it toggles
     between the two, and now reads as a real "done" pill instead of bare
     floating text — Ryan flagged the borderless look from a live
     screenshot. width:100% (not a <button>, so nothing sizes it by
     default) is what lets it share that row's flex-shrink split with
     whatever button sits next to it, same as every .status-action-btn
     there. Tappable to undo, so cursor: pointer despite not being a
     <button>. */
  .spreadsheet-logged-msg { width: 100%; font-size: 12.5px; font-weight: 600; color: var(--info); border: 1px solid var(--info); border-radius: 6px; padding: 8px 14px; cursor: pointer; text-align: center; }

  .buyer-feedback-section {
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .buyer-feedback-section.praise { background: var(--success-bg); border-color: var(--success); }
  .buyer-feedback-section.neutral { background: var(--info-bg); border-color: var(--info); }
  .buyer-feedback-section.complaint { background: var(--surface-alt); border-color: var(--danger); }
  .buyer-feedback-heading {
    font-size: 12.5px;
    font-weight: 700;

    letter-spacing: 0.03em;

  }
  .buyer-feedback-section.praise .buyer-feedback-heading { color: var(--success); }
  .buyer-feedback-section.neutral .buyer-feedback-heading { color: var(--info); }
  .buyer-feedback-section.complaint .buyer-feedback-heading { color: var(--danger); }
  .buyer-feedback-comment { font-size: 13.5px; color: var(--text); }
  .buyer-feedback-date { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow: hidden;
    touch-action: none;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .lightbox-hint {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    pointer-events: none;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  .login-gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    align-items: center;

  .login-gate-card {

  }
  .login-gate-logo { width: 44px; height: 44px; border-radius: 10px; }
  .login-gate-card h1 {
    margin: 12px 0 4px;

    font-weight: 700;

  }

  .login-gate-card input {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    text-align: center;
    box-sizing: border-box;
  }
  .login-gate-card button {

    margin-top: 10px;

</style>
</head>
<body>
<div class="login-gate hidden" id="loginGate">

  <main>

  <div class="lightbox-hint" id="lightboxHint">Pinch or double-tap to zoom</div>

<script>
(function () {
  var STORAGE_KEY = "picklist:picked-v1";
  var COLORS_CACHE_KEY = "picklist:colors-v1";
  var CATEGORIES_CACHE_KEY = "picklist:categories-v1";
  var state = {};
  var orders = [];
  var itemsCache = {};
  var messagesCache = {};
  var contactCache = {};
  // orderId -> {rating, comment, dateRated} | null. Populated once per
  // non-cached order-detail load (same lifecycle as messagesCache/
  // contactCache — reused on a cached revisit, cleared on forceReload),
  // from the same status-check call that already reconciles Drive
  // Thru/feedback-sent state on open.
  var buyerFeedbackCache = {};
  var ratingsCache = {};
  var driveThruSent = {};
  var feedbackSent = {};
  // orderId -> {rating, comment, dateRated} | undefined. A live mirror of
  // BrickLink's own feedback data (via /api/feedback-list), refreshed on
  // every orders-list load — never locally authored, so unlike
  // feedbackSent/driveThruSent it doesn't go through the durable
  // pick-state actions sync.
  var feedbackReceived = {};
  var pickupScheduled = {};
  // orderId -> "large" | "medium" | "small" | "mailer". Manual for now —
  // Ryan records which box/mailer he actually used per order so this
  // becomes a real dataset (cross-referenced against each order's
  // pieces/weight/value) to eventually replace with an automatic
  // suggestion.
  var boxChoice = {};
  // orderId -> true | false | undefined. Whether Ryan's logged an order in
  // his own bookkeeping spreadsheet, tracked here so Order Lookup can flag
  // whichever old orders he hasn't gotten to yet. undefined (never
  // explicitly touched) falls back to isOrderLogged()'s threshold default
  // below rather than meaning "not logged" outright — that's what lets an
  // explicit false override that default for one particular older order
  // without every other untouched order older than it silently flipping
  // too.
  var spreadsheetLogged = {};
  // Every order at or before this id was already logged in Ryan's
  // spreadsheet before this feature existed — pre-checked so backfilling
  // is "uncheck the exceptions" rather than "check thousands of orders."
  var SPREADSHEET_LOGGED_THRESHOLD = 3256335;
  function isOrderLogged(orderId) {
    var explicit = spreadsheetLogged[orderId];
    if (explicit !== undefined) return !!explicit;
    var n = parseInt(orderId, 10);
    return !isNaN(n) && n <= SPREADSHEET_LOGGED_THRESHOLD;
  }
  var colorsMap = null;
  var categoriesById = null; // categoryId -> { name, parentId }

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : {};
    } catch (e) {
      state = {};
    }
  }

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable locally — the remote push below is what
         actually matters for durability (see pushRemoteState). */
    }
    pushRemoteState();
  }

  // localStorage is just a fast, offline-capable cache; /api/pick-state
  // (a Netlify Blobs store) is the durable source of truth. iOS can and
  // does evict localStorage for a home-screen web app between launches —
  // this is what actually survives a force-quit. Best-effort: on failure
  // (offline, etc.) the local write above still stands for this session,
  // and the next successful sync catches things up.
  function pushRemoteState() {
    postJSON("/api/pick-state", state).catch(function () { /* offline — ignore */ });
  }

  // Combines local and remote pick state per order by union (an item
  // counts as picked if either side has it picked). Never a blind
  // overwrite: the very first sync after this feature ships hits an empty
  // remote store, and overwriting local with that would wipe out
  // whatever's already been picked. A "Clear picks"/"Select all" is a
  // deliberate full replace of one order's picks and pushes immediately,
  // so it isn't undone by this — it only reconciles two states that both
  // grew from the same starting point.
  // Merges one key's raw pick value from each side. Naively OR-ing (the
  // original rule, back when every value was a plain boolean) would
  // silently flatten a qty>1 item's in-progress {n,of} counter into a
  // bare `true` the moment it syncs — any object is truthy in JS — which
  // would mark a 2-of-3-tapped lot as fully picked. Whichever side is
  // genuinely complete wins (a legacy `true` counts as complete); short
  // of that, the greater tap count wins, same "never lose progress"
  // philosophy as the original union, just aware of partial progress now.
  function mergePickValue(v1, v2) {
    var aFull = isRawPickFull(v1), bFull = isRawPickFull(v2);
    if (aFull || bFull) {
      if (v1 && typeof v1 === "object" && v1.n >= v1.of) return v1;
      if (v2 && typeof v2 === "object" && v2.n >= v2.of) return v2;
      return true;
    }
    var aObj = v1 && typeof v1 === "object";
    var bObj = v2 && typeof v2 === "object";
    if (aObj && bObj) return { n: Math.max(v1.n, v2.n), of: v1.of };
    if (aObj) return v1;
    if (bObj) return v2;
    return false;
  }

  function mergeStates(a, b) {
    var orderIds = {};
    Object.keys(a || {}).forEach(function (id) { orderIds[id] = true; });
    Object.keys(b || {}).forEach(function (id) { orderIds[id] = true; });

    var merged = {};
    Object.keys(orderIds).forEach(function (orderId) {
      var picksA = (a && a[orderId]) || {};
      var picksB = (b && b[orderId]) || {};
      var keys = {};
      Object.keys(picksA).forEach(function (k) { keys[k] = true; });
      Object.keys(picksB).forEach(function (k) { keys[k] = true; });
      var picks = {};
      Object.keys(keys).forEach(function (k) {
        var combined = mergePickValue(picksA[k], picksB[k]);
        if (combined) picks[k] = combined;
      });
      merged[orderId] = picks;
    });
    return merged;
  }

  // Resolves once the latest remote state has been pulled in and merged
  // (or the attempt has failed and local state is being kept as-is).
  // Callers that need up-to-date picks before rendering (opening an
  // order) await this.
  var remoteSyncPromise = null;
  function syncStateFromRemote() {
    remoteSyncPromise = fetchJSON("/api/pick-state")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var merged = mergeStates(state, remote);
          // Compare against what the REMOTE has, not what local had a
          // moment ago — that's the real question here. Comparing to the
          // old local value missed the exact case that mattered: remote
          // has nothing (e.g. it was crashing until just now) and local
          // already has everything, so the merge doesn't change local at
          // all but the remote still desperately needs that push.
          var remoteNeedsUpdate = JSON.stringify(merged) !== JSON.stringify(remote);
          state = merged;
          try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          if (remoteNeedsUpdate) pushRemoteState();
          if (currentView === "orders") renderOrdersList();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return remoteSyncPromise;
  }

  // Same durability story as picks, for "Send Drive Thru" / "Leave
  // feedback" — these used to just live in memory for the current page
  // load, so a reload showed the button/form again even though BrickLink
  // already had the action on record. Reuses /api/pick-state's Blobs
  // store under a second key ("actions") since it's the same small
  // per-order boolean-map shape, just two maps instead of one.
  function mergeActionMap(a, b) {
    var merged = {};
    Object.keys(a || {}).forEach(function (k) { if (a[k]) merged[k] = true; });
    Object.keys(b || {}).forEach(function (k) { if (b[k]) merged[k] = true; });
    return merged;
  }

  // Same idea as mergeActionMap but for a per-order *value* (which box)
  // rather than a plain boolean flag — an OR doesn't mean anything for
  // two different box choices, so this just prefers whichever side
  // actually has a value, local first (a fresh tap on this device is
  // more likely to be the intended one than a stale remote value).
  function mergeChoiceMap(a, b) {
    var merged = {};
    var keys = {};
    Object.keys(a || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(b || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(keys).forEach(function (k) {
      var v = (a && a[k]) || (b && b[k]);
      if (v) merged[k] = v;
    });
    return merged;
  }

  // Tri-state version of mergeActionMap: spreadsheetLogged needs to carry
  // an explicit false (overriding isOrderLogged()'s threshold default for
  // one particular order), which a plain "OR the truthy keys" merge would
  // silently drop — a bare false and an absent key are otherwise
  // indistinguishable once merged. An explicit true from either side wins
  // outright (never lose a real positive to a race), then an explicit
  // false from either side, then the key is simply left out (same as
  // never having been touched, still governed by the threshold default).
  function mergeLoggedMap(a, b) {
    var merged = {};
    var keys = {};
    Object.keys(a || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(b || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(keys).forEach(function (k) {
      var av = a ? a[k] : undefined;
      var bv = b ? b[k] : undefined;
      if (av === true || bv === true) { merged[k] = true; return; }
      if (av === false || bv === false) { merged[k] = false; return; }
    });
    return merged;
  }

  function pushOrderActions() {
    postJSON("/api/pick-state?key=actions", {
      driveThruSent: driveThruSent, feedbackSent: feedbackSent, pickupScheduled: pickupScheduled,
      boxChoice: boxChoice, spreadsheetLogged: spreadsheetLogged,
    })
      .catch(function () { /* offline — ignore, same as picks */ });
  }

  var orderActionsSyncPromise = null;
  function syncOrderActionsFromRemote() {
    orderActionsSyncPromise = fetchJSON("/api/pick-state?key=actions")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var mergedDriveThru = mergeActionMap(driveThruSent, remote.driveThruSent);
          var mergedFeedback = mergeActionMap(feedbackSent, remote.feedbackSent);
          var mergedPickup = mergeActionMap(pickupScheduled, remote.pickupScheduled);
          var mergedBoxChoice = mergeChoiceMap(boxChoice, remote.boxChoice);
          var mergedLogged = mergeLoggedMap(spreadsheetLogged, remote.spreadsheetLogged);
          var remoteNeedsUpdate = JSON.stringify(mergedDriveThru) !== JSON.stringify(remote.driveThruSent || {})
            || JSON.stringify(mergedFeedback) !== JSON.stringify(remote.feedbackSent || {})
            || JSON.stringify(mergedPickup) !== JSON.stringify(remote.pickupScheduled || {})
            || JSON.stringify(mergedBoxChoice) !== JSON.stringify(remote.boxChoice || {})
            || JSON.stringify(mergedLogged) !== JSON.stringify(remote.spreadsheetLogged || {});
          driveThruSent = mergedDriveThru;
          feedbackSent = mergedFeedback;
          pickupScheduled = mergedPickup;
          boxChoice = mergedBoxChoice;
          spreadsheetLogged = mergedLogged;
          if (remoteNeedsUpdate) pushOrderActions();
          if (currentView === "orders") renderOrdersList();
          // Stats' box-choices tally reads boxChoice directly too — needs
          // the same re-render nudge once a remote sync actually changes
          // it, same as the orders list above.
          if (currentView === "stats") renderStatsView();
          // Order Lookup cards show the same logged-badge/yellow-tint
          // treatment, so a remote sync landing while it's open needs the
          // same nudge.
          if (currentView === "order-lookup") renderOrderLookupResults();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return orderActionsSyncPromise;
  }

  // A pick's raw stored value is either the original boolean (true/false
  // — every pick before qty>1 counting existed, and still every qty-1
  // item today), or {n, of} for a qty>1 item being tapped up piece by
  // piece. "Fully picked" needs to understand both shapes; keeping that
  // logic in one place is what stops pickedCountFromState, isPicked, and
  // the sync merge below from quietly disagreeing about what "done"
  // means for a numeric value.
  function isRawPickFull(v) {
    if (v === true) return true;
    if (v && typeof v === "object") return v.n >= v.of;
    return false;
  }

  function isPicked(orderId, key) {
    return isRawPickFull(state[orderId] && state[orderId][key]);
  }

  // For a qty>1 item's own mini progress bar. qty is the fallback target
  // when nothing's been tapped yet (no stored value to read "of" from).
  function pickProgress(orderId, key, qty) {
    var v = state[orderId] && state[orderId][key];
    if (v === true) return { n: qty, of: qty };
    if (v && typeof v === "object") return { n: v.n, of: v.of };
    return { n: 0, of: qty };
  }

  // Picked count straight from saved state, with no dependency on that
  // order's items being fetched. The orders list needs this: itemsCache
  // only has an order's items once you've opened it in this session, so
  // relying on it there made every card read "0 picked" right after a
  // fresh launch — even though the real picks were sitting in state the
  // whole time (confirmed correct once you opened the order itself).
  function pickedCountFromState(orderId) {
    var picks = state[orderId];
    if (!picks) return 0;
    var n = 0;
    Object.keys(picks).forEach(function (k) { if (isRawPickFull(picks[k])) n++; });
    return n;
  }

  // qty<=1 items keep the original single-tap toggle exactly as before.
  // qty>1 items count taps instead — one tap per physical piece, the way
  // Ryan actually wants to verify a multi-piece lot: tapping increments
  // a per-lot counter, wrapping back to 0 once it reaches qty (a
  // deliberate "start the count over" rather than picking past the end).
  function togglePicked(orderId, key, qty) {
    if (!state[orderId]) state[orderId] = {};
    if (qty > 1) {
      var current = state[orderId][key];
      var n = current === true ? qty : (current && typeof current === "object" ? current.n : 0);
      n = (n >= qty) ? 0 : n + 1;
      state[orderId][key] = { n: n, of: qty };
    } else {
      state[orderId][key] = !state[orderId][key];
    }
    saveState();
  }

  function resetOrder(orderId) {
    state[orderId] = {};
    saveState();
  }

  function selectAllOrder(orderId, items) {
    var picks = {};
    computeItemKeys(items).forEach(function (key) { picks[key] = true; });
    state[orderId] = picks;
    saveState();
  }

  function pickedCount(orderId, items) {
    var keys = computeItemKeys(items);
    var n = 0;
    for (var i = 0; i < keys.length; i++) {
      if (isPicked(orderId, keys[i])) n++;
    }
    return n;
  }

  // Updates the in-page "X of Y lots picked" line and the sticky header
  // progress bar directly, without touching any other DOM — called after
  // every single pick toggle, so it has to stay cheap and can't re-render
  // the item list (see the item-row click handler in renderOrderDetail).
  function updatePickedProgress(order, items) {
    var picked = pickedCount(order.orderId, items);
    var total = items.length;
    var allDone = total > 0 && picked === total;
    var pct = total > 0 ? Math.round((picked / total) * 100) : 0;

    var inlineCount = document.getElementById("pickedCountText");
    if (inlineCount) {
      inlineCount.innerHTML = "<strong>" + picked + " of " + total + "</strong> lots picked" + (allDone ? " — ready to pack" : "");
    }

    topbarProgressFill.style.width = pct + "%";
    topbarProgressFill.classList.toggle("done", allDone);
    topbarProgressLabel.textContent = picked + "/" + total;
  }

  // Keys a pick by the item's content (number + color + condition) rather
  // than its position in the list, so picks survive BrickLink returning an
  // order's items in a different sequence on a later fetch (which is what
  // happens every time the app is reopened, since the in-memory items
  // cache doesn't survive a reload). The trailing occurrence count only
  // matters when the exact same item/color/condition is split across
  // multiple batches within one order.
  function computeItemKeys(items) {
    var seen = {};
    return items.map(function (item) {
      var sig = item.itemNo + "|" + item.colorId + "|" + item.newOrUsed;
      var occurrence = seen[sig] || 0;
      seen[sig] = occurrence + 1;
      return sig + "|" + occurrence;
    });
  }

  // One-time upgrade for picks saved before keys were content-based (when
  // they were just the item's array index, e.g. "0", "1", ...). Remaps
  // them onto the current fetch's content-based keys so existing progress
  // isn't lost the first time an order is reopened after this change.
  function migrateOrderState(orderId, items) {
    var saved = state[orderId];
    if (!saved) return;
    var isLegacyIndexKeyed = Object.keys(saved).every(function (k) { return /^\d+$/.test(k); });
    if (!isLegacyIndexKeyed) return;

    var keys = computeItemKeys(items);
    var migrated = {};
    Object.keys(saved).forEach(function (idxStr) {
      var key = keys[Number(idxStr)];
      if (key && saved[idxStr]) migrated[key] = true;
    });
    state[orderId] = migrated;
    saveState();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // BrickLink's catalog text (item names, descriptions, remarks) sometimes
  // has HTML entities already baked in verbatim (e.g. "&#40;" for "("), a
  // quirk of their data source. Decoding them first means escapeHtml can
  // safely re-escape from there without turning "&#40;" into the literal
  // text "&amp;#40;" in the page.
  var entityDecoder = document.createElement("textarea");
  function decodeHtmlEntities(s) {
    if (!s) return s;
    entityDecoder.innerHTML = s;
    return entityDecoder.value;
  }

  // A few real BrickLink shipping names come back ALL CAPS (however the
  // buyer happened to type their address) — title-cased here for
  // readability, on both the orders list buyer line and the order detail
  // page's own Ship to block/copy text, since they all read off the same
  // contact.name. Only touches a name that's entirely uppercase; a name
  // that's already mixed case (e.g. a nickname in quotes, like
  // Jane "JJ" Doe) is left exactly as typed — blindly re-casing every
  // word would also lowercase a legitimate all-caps initialism such as
  // "JJ" inside an otherwise normally-cased name.
  function titleCaseName(name) {
    if (!name || name !== name.toUpperCase()) return name;
    return name.toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
  }

  // BrickLink has a real, non-zero-id color literally named "Not
  // Applicable" (used for colorless items — minifigs, sets,
  // instructions, ...), so filtering on colorId truthiness alone never
  // catches it. A previous fix filtered the exact string "Not
  // Applicable", but Ryan's real data still showed the tag afterward for
  // minifigs, sets, AND instructions — a wider miss than one exact
  // string would explain, so rather than guess at the precise wording/
  // punctuation BrickLink actually sends (parens? a trailing period? a
  // different case?), this matches on the substring "applicable"
  // instead — no genuine BrickLink color name (Trans-Light Blue, Dark
  // Bluish Gray, ...) would ever contain that word, so it's a safe,
  // punctuation-proof catch-all. Shared by every screen that shows a
  // color name, so there's one guard to fix instead of three copies
  // quietly drifting out of sync with each other (which is exactly how
  // this slipped through the first time).
  function isRealColorName(name) {
    if (!name) return false;
    var normalized = name.trim().toLowerCase();
    return normalized !== "" && normalized.indexOf("applicable") === -1;
  }

  // BrickLink's timestamps are logically always UTC, but not every field
  // actually carries a timezone marker (a trailing Z or +/-HH:MM offset)
  // confirming that — date_rated on a Feedback entry is the one caught
  // live doing this (no marker), and without one the browser's Date
  // parser treats the string as already being in local time instead of
  // converting it from UTC. That silently shifts the displayed date by
  // the local UTC offset — confirmed live as a buyer's feedback reading
  // "Oct 1" at 9:33pm CDT on Sep 30 (CDT is UTC-5, so a date_rated of
  // "...T02:33:00" with no Z, read as UTC, is actually 9:33pm Sep 30
  // local — exactly matching real time — but read as already-local
  // shows the UTC digits unshifted, a full day ahead). Normalizing a
  // marker-less string to explicit UTC before parsing fixes this without
  // touching any timestamp that already carries its own marker (order
  // dates, which have never shown this symptom, pass through unchanged).
  function formatDate(iso) {
    if (!iso) return "";
    var normalized = /[zZ]|[+-]\d{2}:?\d{2}$/.test(iso) ? iso : iso.replace(" ", "T") + "Z";
    var d = new Date(normalized);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  var CURRENCY_SYMBOLS = { USD: "$", CAD: "$", AUD: "$", NZD: "$", GBP: "£", EUR: "€", JPY: "¥" };

  function formatCurrency(amount, code) {
    if (amount === null || amount === undefined || amount === "") return "";
    var num = Number(amount);
    if (isNaN(num)) return "";
    var symbol = CURRENCY_SYMBOLS[code];
    if (symbol) return symbol + num.toFixed(2);
    return (code ? code + " " : "") + num.toFixed(2);
  }

  // BrickLink's own unit_price comes back with an extra trailing zero
  // (e.g. "0.1500") — real precision only ever goes to three decimal
  // places (tenths of a cent, a real BrickLink convention for common
  // parts priced in bulk, e.g. $0.015 each across a 1000-piece lot), not
  // two — rounding to two would silently truncate a real sub-cent price.
  // Used wherever a row's unitPrice is set from a raw BrickLink/CSV/
  // price-guide value, so the field itself (not just formatCurrency's
  // 2-decimal display-only output, which is for rounded dollar totals,
  // not a per-item price) never shows that extra zero.
  function formatPriceInput(value) {
    if (value === null || value === undefined || value === "") return "";
    var num = Number(value);
    if (isNaN(num)) return String(value);
    return num.toFixed(3);
  }

  // BrickLink's order weight is grams (confirmed against Ryan's real
  // orders — matched a manual per-item weight × quantity sum exactly);
  // Ryan wants it read as pounds/ounces, the units he actually thinks
  // in for picking a shipping box. 1 lb = 453.592 g, 1 oz = 28.3495 g.
  // Most orders here are under a pound, so "0 lb" is dropped rather
  // than always showing both units.
  function formatWeightLbOz(grams) {
    if (grams === null || grams === undefined || isNaN(grams)) return "";
    var totalOz = grams / 28.3495;
    var lb = Math.floor(totalOz / 16);
    var oz = totalOz - lb * 16;
    // Three decimal places, not one — a light single item can otherwise
    // round straight down to "0.0 oz" and look weightless, which loses
    // exactly the resolution the box-choice weight data collection needs
    // most for its lightest packages.
    if (oz.toFixed(3) === "16.000") { lb += 1; oz = 0; }
    return (lb > 0 ? lb + " lb " : "") + oz.toFixed(3) + " oz";
  }

  // tone: fresh = needs picking, packed = picked & boxed, done = shipped/received,
  // waiting = before payment, problem = cancelled/non-paying/etc, complete =
  // fully done (a separate, deliberately neutral-gray tone from "waiting" —
  // same visual color, but a different status entirely, so they're not
  // conflated just because they happen to render the same).
  var STATUS_META = {
    PENDING: { label: "Pending", tone: "waiting" },
    UPDATED: { label: "Updated", tone: "waiting" },
    PROCESSING: { label: "Processing", tone: "waiting" },
    READY: { label: "Ready", tone: "waiting" },
    PAID: { label: "Paid", tone: "fresh" },
    PACKED: { label: "Packed", tone: "done" },
    SHIPPED: { label: "Shipped", tone: "packed" },
    RECEIVED: { label: "Received", tone: "done" },
    COMPLETED: { label: "Complete", tone: "complete" },
    CANCELLED: { label: "Cancelled", tone: "problem" },
    PURGED: { label: "Purged", tone: "problem" },
    NPB: { label: "NPB", tone: "problem" },
    NRS: { label: "NRS", tone: "problem" },
    NSS: { label: "NSS", tone: "problem" }
  };

  function statusBadgeHtml(status) {
    if (!status) return "";
    var meta = STATUS_META[status] || { label: status, tone: "waiting" };
    return '<span class="status-badge tone-' + meta.tone + '">' + escapeHtml(meta.label) + '</span>';
  }

  async function fetchJSON(url) {
    var res = await fetch(url);
    if (res.status === 401) {
      showLoginGate("Your session needs to be refreshed — log in again. Whatever you were working on is still here once you're back in.");
      throw new Error("Session expired — please log in again.");
    }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

  async function postJSON(url, payload) {
    var res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (res.status === 401) {
      showLoginGate("Your session needs to be refreshed — log in again. Whatever you were working on is still here once you're back in.");
      throw new Error("Session expired — please log in again.");
    }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

  function getColors() {
    if (colorsMap) return Promise.resolve(colorsMap);
    try {
      var cached = window.localStorage.getItem(COLORS_CACHE_KEY);
      if (cached) {
        colorsMap = JSON.parse(cached);
        return Promise.resolve(colorsMap);
      }
    } catch (e) { /* ignore, fall through to fetch */ }

    return fetchJSON("/api/colors").then(function (colors) {
      var map = {};
      (colors || []).forEach(function (c) { map[c.colorId] = c.colorName; });
      colorsMap = map;
      try { window.localStorage.setItem(COLORS_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
      return map;
    });
  }

  function getCategories() {
    if (categoriesById) return Promise.resolve(categoriesById);
    try {
      var cached = window.localStorage.getItem(CATEGORIES_CACHE_KEY);
      if (cached) {
        categoriesById = JSON.parse(cached);
        return Promise.resolve(categoriesById);
      }
    } catch (e) { /* ignore, fall through to fetch */ }

    return fetchJSON("/api/categories").then(function (categories) {
      var map = {};
      (categories || []).forEach(function (c) {
        map[c.categoryId] = { name: c.categoryName, parentId: c.parentId };
      });
      categoriesById = map;
      try { window.localStorage.setItem(CATEGORIES_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
      return map;
    });
  }

  // Walks a leaf category up its parent chain (parentId 0 = root) to find
  // the top-level category — the closest BrickLink's category tree comes
  // to a "theme" (e.g. a Set's leaf category might be "Star Wars > Ships",
  // this returns "Star Wars"). Parts mostly don't have a real theme, so
  // this just surfaces their top-level physical category instead (e.g.
  // "Bricks", "Plates") — still a useful grouping, just not a LEGO theme.
  var topCategoryCache = {};
  function topCategoryId(categoryId, categories) {
    if (topCategoryCache[categoryId] !== undefined) return topCategoryCache[categoryId];
    var id = categoryId;
    var seen = {};
    while (categories[id] && categories[id].parentId && !seen[id]) {
      seen[id] = true;
      id = categories[id].parentId;
    }
    topCategoryCache[categoryId] = id;
    return id;
  }
  function categoryDisplayNameById(id) {
    if (!id) return "Uncategorized";
    return (categoriesById && categoriesById[id] && categoriesById[id].name) || "Uncategorized";
  }

  // BrickLink names every minifig-component category "Minifigure, <part>"
  // (Head, Torso Assembly, Legs, Headgear, Hair, Utensil, Weapon,
  // Accessory, ...) — checking for that substring anywhere up a part's
  // category chain (not just its own leaf category) is what lets
  // orderTypeSummaryHtml split "parts" into fig-related vs. general
  // misc, the dollar-value distinction Ryan already tracks in his own
  // spreadsheet, without hardcoding an exhaustive categoryId whitelist
  // that'd go stale if BrickLink's catalog changes.
  function isFigPartCategory(categoryId, categories) {
    if (!categoryId || !categories) return false;
    var id = categoryId;
    var seen = {};
    while (id && categories[id] && !seen[id]) {
      seen[id] = true;
      if (/minifig/i.test(categories[id].name || "")) return true;
      id = categories[id].parentId;
    }
    return false;
  }

  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lightboxClose = document.getElementById("lightboxClose");

  // Custom pinch/pan/double-tap zoom, independent of the browser's native
  // zoom — the page disables native pinch-zoom site-wide (to avoid
  // accidental zooming while picking), and toggling that dynamically to
  // re-enable it is unreliable on iOS, which only honors the viewport
  // meta tag's zoom bounds as computed at initial page load.
  var zoomScale = 1;
  var zoomX = 0;
  var zoomY = 0;
  var pointers = {};
  var pinchStartDist = 0;
  var pinchStartScale = 1;
  var lastTapTime = 0;
  var MAX_ZOOM = 4;

  function applyZoomTransform() {
    lightboxImg.style.transform = "translate(" + zoomX + "px, " + zoomY + "px) scale(" + zoomScale + ")";
  }

  function resetZoom() {
    zoomScale = 1;
    zoomX = 0;
    zoomY = 0;
    applyZoomTransform();
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function touchDistance(t1, t2) {
    var dx = t1.clientX - t2.clientX;
    var dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Touch Events rather than Pointer Events: iOS WebKit (which every iOS
  // browser, including Chrome, runs on) has a history of unreliable
  // multi-touch handling via Pointer Events — Touch Events are the
  // long-standing, battle-tested API there.
  //
  // Listeners are on the full-screen overlay, not the (possibly small,
  // native-resolution) image itself — a pinch's two fingers often won't
  // both land within a small image's bounds, and a touch that starts
  // outside it would never reach a listener attached to the image.
  // preventDefault is only called once we've recognized an actual pinch,
  // pan, or double-tap gesture — a plain single tap falls through so the
  // browser's synthesized click still closes the lightbox on backdrop
  // taps (see the click listener below).
  lightbox.addEventListener("touchstart", function (e) {
    if (e.target === lightboxClose) return;

    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }

    if (e.touches.length === 2) {
      e.preventDefault();
      pinchStartDist = touchDistance(e.touches[0], e.touches[1]);
      pinchStartScale = zoomScale;
    } else if (e.touches.length === 1) {
      var now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        if (zoomScale > 1) {
          resetZoom();
        } else {
          zoomScale = 2.5;
          applyZoomTransform();
        }
      }
      lastTapTime = now;
    }
  }, { passive: false });

  lightbox.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = touchDistance(e.touches[0], e.touches[1]);
      if (pinchStartDist > 0) {
        zoomScale = clamp(pinchStartScale * (dist / pinchStartDist), 1, MAX_ZOOM);
        applyZoomTransform();
      }
    } else if (e.touches.length === 1 && zoomScale > 1) {
      e.preventDefault();
      var t = e.touches[0];
      var prev = pointers[t.identifier];
      if (prev) {
        zoomX += t.clientX - prev.x;
        zoomY += t.clientY - prev.y;
        applyZoomTransform();
      }
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });

  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      delete pointers[e.changedTouches[i].identifier];
    }
    if (e.touches.length < 2) pinchStartDist = 0;
  }
  lightbox.addEventListener("touchend", endTouch);
  lightbox.addEventListener("touchcancel", endTouch);

  var lightboxHint = document.getElementById("lightboxHint");
  var currentObjectUrl = null;
  var DEFAULT_HINT = "Pinch or double-tap to zoom";

  function openLightbox(url) {
    resetZoom();
    lightboxImg.src = "";
    lightboxHint.textContent = "Loading…";
    lightbox.classList.remove("hidden");

    // Fetch via JS (rather than a plain <img src>) so we can read the
    // diagnostic headers item-image.js sets — tells us whether this photo
    // is the larger color-specific one or the small fallback, and its
    // actual byte size, without needing device devtools to check.
    fetch(url).then(function (res) {
      if (!res.ok) throw new Error("image request failed");
      var tier = res.headers.get("X-Image-Tier");
      var bytes = res.headers.get("X-Image-Bytes");
      return res.blob().then(function (blob) {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        lightboxImg.src = currentObjectUrl;
        var sizeLabel = bytes ? Math.round(bytes / 1024) + "KB" : "";
        var TIER_LABELS = { "catalog-api": "official catalog photo", "hires": "hi-res photo", "large": "BrickLink large photo", "small": "low-res photo" };
        var tierLabel = TIER_LABELS[tier] || "photo";
        lightboxHint.textContent = DEFAULT_HINT + " · " + tierLabel + (sizeLabel ? " (" + sizeLabel + ")" : "");
      });
    }).catch(function () {
      lightboxHint.textContent = "Couldn't load this photo";
    });
  }

  function closeLightbox() {
    lightbox.classList.add("hidden");
    lightboxImg.src = "";
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
    lightboxHint.textContent = DEFAULT_HINT;
    resetZoom();
  }

  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  lightboxClose.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });

  function wireThumbLinks(container) {
    container.querySelectorAll(".thumb-link").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openLightbox(el.getAttribute("data-img-url"));
      });
    });
  }

  var THUMB_MIN = 65;
  var THUMB_MAX = 108;

  // Sizes every thumbnail in the order to one shared size — the tallest
  // row's text block wins (clamped) — so photos line up consistently
  // instead of each row getting its own size based on its own text length.
  function sizeThumbsToRows(container) {
    var rows = container.querySelectorAll(".item-row");
    var tallest = 0;
    rows.forEach(function (row) {
      var body = row.querySelector(".item-body");
      if (body) tallest = Math.max(tallest, body.offsetHeight);
    });
    var size = Math.max(THUMB_MIN, Math.min(THUMB_MAX, tallest));
    rows.forEach(function (row) {
      var thumb = row.querySelector(".item-thumb");
      if (!thumb) return;
      thumb.style.width = size + "px";
      thumb.style.height = size + "px";
    });
  }

  // Same "resolve slow enrichment asynchronously, don't block the initial
  // screen" pattern as fetchAndShowBuyerRating below — the orders-LIST
