<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>BrickLink Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script type="module" src="/vendor/pdfjs/pdfjs-bridge.js"></script>
<script type="module" src="/vendor/pdf-lib/pdf-lib-bridge.js"></script>
<style>
  :root {
    --bg: #F5F3EF;
    --surface: #FFFFFF;
    --surface-alt: #ECE8E1;
    --border: #DDD7CC;
    --text: #1D1B18;
    --text-secondary: #6B6459;
    --accent: #C97A22;
    --accent-soft: #F2E2CC;
    --accent-contrast: #FFFFFF;
    --success: #2F8F5B;
    --success-bg: #E3F3EA;
    --danger: #B4483A;
    --info: #2E5FA3;
    --info-bg: #E3EAF5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161A;
      --surface: #1D2027;
      --surface-alt: #262A33;
      --border: #31353F;
      --text: #EDEBE6;
      --text-secondary: #9CA3AF;
      --accent: #F2A93B;
      --accent-soft: #3A2D14;
      --accent-contrast: #14161A;
      --success: #4FAE7B;
      --success-bg: #1C3327;
      --danger: #E0685A;
      --info: #7BB0FA;
      --info-bg: #1C2A40;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161A;
    --surface: #1D2027;
    --surface-alt: #262A33;
    --border: #31353F;
    --text: #EDEBE6;
    --text-secondary: #9CA3AF;
    --accent: #F2A93B;
    --accent-soft: #3A2D14;
    --accent-contrast: #14161A;
    --success: #4FAE7B;
    --success-bg: #1C3327;
    --danger: #E0685A;
    --info: #7BB0FA;
    --info-bg: #1C2A40;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .topbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 7px;
    font-family: inherit;
  }
  .back-btn:active { background: var(--surface-alt); }
  .back-btn svg { width: 14px; height: 14px; flex: none; }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 0;
  }
  .brand-logo {
    flex: none;
    width: 32px;
    height: 32px;
    display: block;
  }
  .brand small {
    display: block;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .refresh-btn {
    flex: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:active { background: var(--surface-alt); }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .topbar-row-nav { margin-top: 10px; display: flex; gap: 8px; }
  .nav-tab-btn {
    flex: 1;
    border: 1px dashed var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .nav-tab-btn:active { background: var(--surface-alt); }
  /* Category row (Orders/Inventory) is the persistent top-level switch —
     solid fill on whichever side is active. */
  .nav-tab-btn.active { background: var(--accent); color: var(--accent-contrast); border-style: solid; }
  /* Sub-nav is one secondary "jump to the sibling page" link, so it reads
     lighter/smaller than the two primary category buttons above it. */
  .topbar-row-subnav { margin-top: 8px; }
  .topbar-row-subnav .nav-tab-btn {
    flex: none;
    border: 1px solid var(--border);
    background: none;
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 6px;
  }
  .topbar-row-subnav .nav-tab-btn:active { background: var(--surface-alt); }

  main { flex: 1; padding: 4px 16px 32px; }

  /* ---- Status states ---- */
  .state-block {
    margin-top: 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13.5px;
    padding: 24px 12px;
  }
  .state-block.error { color: var(--danger); }
  .state-block .retry-btn {
    margin-top: 12px;
    display: inline-block;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .state-block .retry-btn:active { background: var(--surface-alt); }

  /* ---- Orders list ---- */
  .order-stats {
    margin-top: 14px;
    font-size: 13.5px;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .order-stats strong { color: var(--accent); }
  .order-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 14px;
    margin-top: 12px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
  }
  .order-card:active { background: var(--surface-alt); }
  .order-card.needs-pick { background: var(--accent-soft); }
  .order-card.needs-pick:active { background: var(--accent-soft); filter: brightness(0.94); }

  .order-status-row {
    display: flex;
    margin-top: 10px;
  }
  .status-action-btn {
    width: 100%;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .status-action-btn:active { background: var(--surface-alt); }
  .status-action-btn:disabled { opacity: 0.6; cursor: default; }
  .status-action-btn.to-packed { color: var(--info); border-color: var(--info); }
  .status-action-btn.to-shipped { color: var(--success); border-color: var(--success); }
  .status-action-btn.list-drive-thru-btn { color: var(--accent); border-color: var(--accent); }
  .status-action-btn.pickup-btn { color: var(--accent); border-color: var(--accent); }

  .pickup-reminder-row {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .order-top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .order-id { font-weight: 600; font-size: 15px; }
  .order-id-group { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .order-date { font-size: 12px; color: var(--text-secondary); flex: none; }

  .status-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    flex: none;
  }
  .status-badge.tone-fresh { color: var(--accent); background: var(--accent-soft); }
  .status-badge.tone-packed { color: var(--success); background: var(--success-bg); }
  .status-badge.tone-done { color: var(--info); background: var(--info-bg); }
  .status-badge.tone-waiting { color: var(--text-secondary); background: var(--surface-alt); }
  .status-badge.tone-problem { color: var(--danger); background: var(--surface-alt); }
  .order-buyer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .order-total {
    flex: none;
    font-weight: 600;
    color: var(--text);
  }
  .order-progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .topbar-submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }
  .topbar-submit-total { font-size: 15px; font-weight: 700; color: var(--text); }
  .progress-track {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-alt);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.2s ease;
  }
  .progress-fill.done { background: var(--success); }
  .progress-label {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* ---- Order detail ---- */
  .order-summary {
    padding-top: 10px;
  }
  .order-summary .order-id { font-size: 17px; }
  .order-summary .order-buyer { margin-top: 4px; }
  .picked-count {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .picked-count strong { color: var(--text); }

  .jump-to-items-btn {
    width: 100%;
    margin-top: 12px;
    border: 1px solid var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .jump-to-items-btn:active { background: var(--surface-alt); }

  .financial-total {
    font-weight: 700;
    font-size: 14.5px;
  }
  .financial-total .contact-label { color: var(--text); }

  .contact-section {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .contact-row {
    display: flex;
    gap: 10px;
    font-size: 13.5px;
    padding: 4px 0;
  }
  .contact-row + .contact-row { border-top: 1px solid var(--border); }
  .contact-label {
    flex: 0 0 64px;
    color: var(--text-secondary);
  }
  .contact-address { line-height: 1.4; }
  .tracking-number-link {
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }
  .tracking-number-link:active { color: var(--accent); }
  .contact-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .copy-btn {
    flex: 1;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--accent);
    cursor: pointer;
  }
  .copy-btn:active { background: var(--surface-alt); }

  .tracking-entry {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .tracking-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 13.5px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .tracking-save-btn {
    flex: 0 0 auto;
    padding: 5px 12px;
  }

  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .item-row:active { background: var(--surface-alt); }
  .item-row.picked {
    background: var(--success-bg);
    border-color: transparent;
    opacity: 0.75;
  }

  .item-thumb {
    position: relative;
    flex: none;
    width: 65px;
    height: 65px;
    border-radius: 8px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .item-thumb svg { width: 35px; height: 35px; color: var(--text-secondary); }
  .thumb-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 7px;
  }
  .item-row.picked .item-thumb { opacity: 0.6; }

  .qty-chip {
    position: absolute;
    top: -8px;
    left: -8px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-contrast);
    border: 2px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12px;
  }
  .item-row.picked .qty-chip {
    background: var(--success);
    color: #fff;
  }
  /* Multi-piece lots get a visibly bigger, bolder badge than a plain
     qty-1 item — a poka-yoke cue so a >1 lot doesn't quietly get picked
     as if it were a single piece. */
  .qty-chip.multi {
    min-width: 30px;
    height: 30px;
    top: -10px;
    left: -10px;
    border-width: 3px;
    font-size: 13.5px;
  }

  /* A multi-piece lot mid-count (tapped at least once, not yet fully
     tapped) — distinct from both "untouched" and "fully picked" (green,
     via .item-row.picked above), so a half-picked lot never looks the
     same as a done one. */
  .item-row.partial { background: var(--accent-soft); border-color: transparent; }

  .item-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .item-progress-row .progress-track { height: 5px; }
  .item-progress-row .progress-label { font-size: 11px; }

  .item-body { flex: 1; min-width: 0; }
  .item-line1 {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .item-no {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .item-line1-right {
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex: none;
  }
  .item-type-tag {
    font-size: 10.5px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    flex: none;
  }
  .item-price {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    flex: none;
  }
  .item-name {
    font-size: 14.5px;
    font-weight: 600;
    margin-top: 3px;
    line-height: 1.3;
  }
  .item-row.picked .item-name { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .item-color {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .item-remarks {
    font-size: 12px;
    color: var(--danger);
    margin-top: 5px;
    font-style: italic;
  }
  .item-bl-link {
    display: inline-block;
    font-size: 11.5px;
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
    margin-top: 5px;
  }
  .item-bl-link:active { color: var(--accent); }

  .checkmark {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .item-row.picked .checkmark {
    background: var(--success);
    border-color: var(--success);
  }
  .checkmark svg { display: none; width: 14px; height: 14px; }
  .item-row.picked .checkmark svg { display: block; }
  .checkmark svg path { stroke: #fff; }

  .reset-row, .order-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .reset-row { margin-top: 18px; }
  .order-actions { margin-top: 12px; }

  /* ---- Add Inventory ---- */
  .inventory-intro {
    padding-top: 10px;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .inventory-upload {
    margin-top: 16px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 20px 16px;
    text-align: center;
  }
  .inventory-file-input { font-size: 13.5px; font-family: inherit; }
  .label-prep-canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
  }
  .inventory-total-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 14px;
  }
  .inventory-total-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .inventory-total-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
  }
  .inventory-summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .inventory-bulk-actions { display: flex; gap: 8px; }
  .inventory-bulk-actions button, .inv-start-over-btn {
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .inventory-bulk-actions button:active, .inv-start-over-btn:active { background: var(--surface-alt); }
  .inv-start-over-btn:disabled { opacity: 0.5; cursor: default; }
  .inventory-submit-row .inv-start-over-btn { align-self: center; }

  .item-row.inventory-row { cursor: default; }
  .item-row.inventory-row:active { background: var(--surface); }
  .inventory-row.skipped { opacity: 0.45; }
  .inventory-row-check {
    flex: none;
    width: 20px;
    height: 20px;
    margin-top: 4px;
  }
  .inventory-row .item-thumb { cursor: pointer; }
  .inventory-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 8px;
    margin-top: 8px;
  }
  .inventory-field { display: flex; flex-direction: column; gap: 2px; }
  .inventory-field label {
    font-size: 10.5px;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .inventory-field label .field-hint {
    text-transform: none;
    font-weight: 400;
    letter-spacing: normal;
  }
  .inventory-field input, .inventory-field select, .inventory-field textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    width: 100%;
  }
  .inventory-field textarea {
    resize: vertical;
    min-height: 40px;
  }
  .inventory-field.remarks-field, .inventory-field.description-field { grid-column: 1 / -1; }
  .inventory-row-result {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .inventory-row-result.success { color: var(--success); }
  .inventory-row-result.error { color: var(--danger); }
  .inventory-row.result-success { opacity: 0.6; }
  .item-row.row-dirty { background: var(--accent-soft); border-color: transparent; }

  .manage-inventory-search {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    margin-top: 4px;
  }
  .manage-inventory-hint { color: var(--text-secondary); font-size: 13px; margin-top: 14px; }
  .manage-inventory-cap-note { color: var(--text-secondary); font-size: 12px; text-align: center; margin-top: 10px; }
  .manage-inventory-sort-select {

<script>
(function () {
  var STORAGE_KEY = "picklist:picked-v1";
  var COLORS_CACHE_KEY = "picklist:colors-v1";
  var CATEGORIES_CACHE_KEY = "picklist:categories-v1";
  var state = {};
  var orders = [];
  var itemsCache = {};
  var messagesCache = {};
  var contactCache = {};
  var ratingsCache = {};
  var driveThruSent = {};
  var feedbackSent = {};
  var pickupScheduled = {};
  var colorsMap = null;
  var categoriesById = null; // categoryId -> { name, parentId }

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : {};
    } catch (e) {
      state = {};
    }
  }

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable locally — the remote push below is what
         actually matters for durability (see pushRemoteState). */
    }
    pushRemoteState();
  }

  // localStorage is just a fast, offline-capable cache; /api/pick-state
  // (a Netlify Blobs store) is the durable source of truth. iOS can and
  // does evict localStorage for a home-screen web app between launches —
  // this is what actually survives a force-quit. Best-effort: on failure
  // (offline, etc.) the local write above still stands for this session,
  // and the next successful sync catches things up.
  function pushRemoteState() {
    postJSON("/api/pick-state", state).catch(function () { /* offline — ignore */ });
  }

  // Combines local and remote pick state per order by union (an item
  // counts as picked if either side has it picked). Never a blind
  // overwrite: the very first sync after this feature ships hits an empty
  // remote store, and overwriting local with that would wipe out
  // whatever's already been picked. A "Clear picks"/"Select all" is a
  // deliberate full replace of one order's picks and pushes immediately,
  // so it isn't undone by this — it only reconciles two states that both
  // grew from the same starting point.
  // Merges one key's raw pick value from each side. Naively OR-ing (the
  // original rule, back when every value was a plain boolean) would
  // silently flatten a qty>1 item's in-progress {n,of} counter into a
  // bare `true` the moment it syncs — any object is truthy in JS — which
  // would mark a 2-of-3-tapped lot as fully picked. Whichever side is
  // genuinely complete wins (a legacy `true` counts as complete); short
  // of that, the greater tap count wins, same "never lose progress"
  // philosophy as the original union, just aware of partial progress now.
  function mergePickValue(v1, v2) {
    var aFull = isRawPickFull(v1), bFull = isRawPickFull(v2);
    if (aFull || bFull) {
      if (v1 && typeof v1 === "object" && v1.n >= v1.of) return v1;
      if (v2 && typeof v2 === "object" && v2.n >= v2.of) return v2;
      return true;
    }
    var aObj = v1 && typeof v1 === "object";
    var bObj = v2 && typeof v2 === "object";
    if (aObj && bObj) return { n: Math.max(v1.n, v2.n), of: v1.of };
    if (aObj) return v1;
    if (bObj) return v2;
    return false;
  }

  function mergeStates(a, b) {
    var orderIds = {};
    Object.keys(a || {}).forEach(function (id) { orderIds[id] = true; });
    Object.keys(b || {}).forEach(function (id) { orderIds[id] = true; });

    var merged = {};
    Object.keys(orderIds).forEach(function (orderId) {
      var picksA = (a && a[orderId]) || {};
      var picksB = (b && b[orderId]) || {};
      var keys = {};
      Object.keys(picksA).forEach(function (k) { keys[k] = true; });
      Object.keys(picksB).forEach(function (k) { keys[k] = true; });
      var picks = {};
      Object.keys(keys).forEach(function (k) {
        var combined = mergePickValue(picksA[k], picksB[k]);
        if (combined) picks[k] = combined;
      });
      merged[orderId] = picks;
    });
    return merged;
  }

  // Resolves once the latest remote state has been pulled in and merged
  // (or the attempt has failed and local state is being kept as-is).
  // Callers that need up-to-date picks before rendering (opening an
  // order) await this.
  var remoteSyncPromise = null;
  function syncStateFromRemote() {
    remoteSyncPromise = fetchJSON("/api/pick-state")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var merged = mergeStates(state, remote);
          // Compare against what the REMOTE has, not what local had a
          // moment ago — that's the real question here. Comparing to the
          // old local value missed the exact case that mattered: remote
          // has nothing (e.g. it was crashing until just now) and local
          // already has everything, so the merge doesn't change local at
          // all but the remote still desperately needs that push.
          var remoteNeedsUpdate = JSON.stringify(merged) !== JSON.stringify(remote);
          state = merged;
          try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          if (remoteNeedsUpdate) pushRemoteState();
          if (currentView === "orders") renderOrdersList();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return remoteSyncPromise;
  }

  // Same durability story as picks, for "Send Drive Thru" / "Leave
  // feedback" — these used to just live in memory for the current page
  // load, so a reload showed the button/form again even though BrickLink
  // already had the action on record. Reuses /api/pick-state's Blobs
  // store under a second key ("actions") since it's the same small
  // per-order boolean-map shape, just two maps instead of one.
  function mergeActionMap(a, b) {
    var merged = {};
    Object.keys(a || {}).forEach(function (k) { if (a[k]) merged[k] = true; });
    Object.keys(b || {}).forEach(function (k) { if (b[k]) merged[k] = true; });
    return merged;
  }

  function pushOrderActions() {
    postJSON("/api/pick-state?key=actions", { driveThruSent: driveThruSent, feedbackSent: feedbackSent, pickupScheduled: pickupScheduled })
      .catch(function () { /* offline — ignore, same as picks */ });
  }

  var orderActionsSyncPromise = null;
  function syncOrderActionsFromRemote() {
    orderActionsSyncPromise = fetchJSON("/api/pick-state?key=actions")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var mergedDriveThru = mergeActionMap(driveThruSent, remote.driveThruSent);
          var mergedFeedback = mergeActionMap(feedbackSent, remote.feedbackSent);
          var mergedPickup = mergeActionMap(pickupScheduled, remote.pickupScheduled);
          var remoteNeedsUpdate = JSON.stringify(mergedDriveThru) !== JSON.stringify(remote.driveThruSent || {})
            || JSON.stringify(mergedFeedback) !== JSON.stringify(remote.feedbackSent || {})
            || JSON.stringify(mergedPickup) !== JSON.stringify(remote.pickupScheduled || {});
          driveThruSent = mergedDriveThru;
          feedbackSent = mergedFeedback;
          pickupScheduled = mergedPickup;
          if (remoteNeedsUpdate) pushOrderActions();
          if (currentView === "orders") renderOrdersList();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return orderActionsSyncPromise;
  }

  // A pick's raw stored value is either the original boolean (true/false
  // — every pick before qty>1 counting existed, and still every qty-1
  // item today), or {n, of} for a qty>1 item being tapped up piece by
  // piece. "Fully picked" needs to understand both shapes; keeping that
  // logic in one place is what stops pickedCountFromState, isPicked, and
  // the sync merge below from quietly disagreeing about what "done"
  // means for a numeric value.
  function isRawPickFull(v) {
    if (v === true) return true;
    if (v && typeof v === "object") return v.n >= v.of;
    return false;
  }

  function isPicked(orderId, key) {
    return isRawPickFull(state[orderId] && state[orderId][key]);
  }

  // For a qty>1 item's own mini progress bar. qty is the fallback target
  // when nothing's been tapped yet (no stored value to read "of" from).
  function pickProgress(orderId, key, qty) {
    var v = state[orderId] && state[orderId][key];
    if (v === true) return { n: qty, of: qty };
    if (v && typeof v === "object") return { n: v.n, of: v.of };
    return { n: 0, of: qty };
  }

  // Picked count straight from saved state, with no dependency on that
  // order's items being fetched. The orders list needs this: itemsCache
  // only has an order's items once you've opened it in this session, so
  // relying on it there made every card read "0 picked" right after a
  // fresh launch — even though the real picks were sitting in state the
  // whole time (confirmed correct once you opened the order itself).
  function pickedCountFromState(orderId) {
    var picks = state[orderId];
    if (!picks) return 0;
    var n = 0;
    Object.keys(picks).forEach(function (k) { if (isRawPickFull(picks[k])) n++; });
    return n;
  }

  // qty<=1 items keep the original single-tap toggle exactly as before.
  // qty>1 items count taps instead — one tap per physical piece, the way
  // Ryan actually wants to verify a multi-piece lot: tapping increments
  // a per-lot counter, wrapping back to 0 once it reaches qty (a
  // deliberate "start the count over" rather than picking past the end).
  function togglePicked(orderId, key, qty) {
    if (!state[orderId]) state[orderId] = {};
    if (qty > 1) {
      var current = state[orderId][key];
      var n = current === true ? qty : (current && typeof current === "object" ? current.n : 0);
      n = (n >= qty) ? 0 : n + 1;
      state[orderId][key] = { n: n, of: qty };
    } else {
      state[orderId][key] = !state[orderId][key];
    }
    saveState();
  }

  function resetOrder(orderId) {
    state[orderId] = {};
    saveState();
  }

  function selectAllOrder(orderId, items) {
    var picks = {};
    computeItemKeys(items).forEach(function (key) { picks[key] = true; });
    state[orderId] = picks;
    saveState();
  }

  function pickedCount(orderId, items) {
    var keys = computeItemKeys(items);
    var n = 0;
    for (var i = 0; i < keys.length; i++) {
      if (isPicked(orderId, keys[i])) n++;
    }
    return n;
  }

  // Updates the in-page "X of Y lots picked" line and the sticky header
  // progress bar directly, without touching any other DOM — called after
  // every single pick toggle, so it has to stay cheap and can't re-render
  // the item list (see the item-row click handler in renderOrderDetail).
  function updatePickedProgress(order, items) {
    var picked = pickedCount(order.orderId, items);
    var total = items.length;
    var allDone = total > 0 && picked === total;
    var pct = total > 0 ? Math.round((picked / total) * 100) : 0;

    var inlineCount = document.getElementById("pickedCountText");
    if (inlineCount) {
      inlineCount.innerHTML = "<strong>" + picked + " of " + total + "</strong> lots picked" + (allDone ? " — ready to pack" : "");
    }

    topbarProgressFill.style.width = pct + "%";
    topbarProgressFill.classList.toggle("done", allDone);
    topbarProgressLabel.textContent = picked + "/" + total;
  }

  // Keys a pick by the item's content (number + color + condition) rather
  // than its position in the list, so picks survive BrickLink returning an
  // order's items in a different sequence on a later fetch (which is what
  // happens every time the app is reopened, since the in-memory items
  // cache doesn't survive a reload). The trailing occurrence count only
  // matters when the exact same item/color/condition is split across
  // multiple batches within one order.
  function computeItemKeys(items) {
    var seen = {};
    return items.map(function (item) {
      var sig = item.itemNo + "|" + item.colorId + "|" + item.newOrUsed;
      var occurrence = seen[sig] || 0;
      seen[sig] = occurrence + 1;
      return sig + "|" + occurrence;
    });
  }

  // One-time upgrade for picks saved before keys were content-based (when
  // they were just the item's array index, e.g. "0", "1", ...). Remaps
  // them onto the current fetch's content-based keys so existing progress
  // isn't lost the first time an order is reopened after this change.
  function migrateOrderState(orderId, items) {
    var saved = state[orderId];
    if (!saved) return;
    var isLegacyIndexKeyed = Object.keys(saved).every(function (k) { return /^\d+$/.test(k); });
    if (!isLegacyIndexKeyed) return;

    var keys = computeItemKeys(items);
    var migrated = {};
    Object.keys(saved).forEach(function (idxStr) {
      var key = keys[Number(idxStr)];
      if (key && saved[idxStr]) migrated[key] = true;
    });
    state[orderId] = migrated;
    saveState();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

  // has HTML entities already baked in verbatim (e.g. "&#40;" for "("), a
  // quirk of their data source. Decoding them first means escapeHtml can
  // safely re-escape from there without turning "&#40;" into the literal
  // text "&amp;#40;" in the page.

  function decodeHtmlEntities(s) {

    return (code ? code + " " : "") + num.toFixed(2);

  async function fetchJSON(url) {
    var res = await fetch(url);

      throw new Error("Session expired — please log in again.");
    }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

  async function postJSON(url, payload) {
    var res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (res.status === 401) {
      showLoginGate("Your session needs to be refreshed — log in again. Whatever you were working on is still here once you're back in.");
      throw new Error("Session expired — please log in again.");
    }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

        colorsMap = JSON.parse(cached);
        return Promise.resolve(colorsMap);

    } catch (e) { /* ignore, fall through to fetch */ }

    return fetchJSON("/api/colors").then(function (colors) {

      return map;

      if (cached) {
        categoriesById = JSON.parse(cached);

    return fetchJSON("/api/categories").then(function (categories) {

  // Walks a leaf category up its parent chain (parentId 0 = root) to find
  // the top-level category — the closest BrickLink's category tree comes
  // to a "theme" (e.g. a Set's leaf category might be "Star Wars > Ships",
  // this returns "Star Wars"). Parts mostly don't have a real theme, so
  // this just surfaces their top-level physical category instead (e.g.
  // "Bricks", "Plates") — still a useful grouping, just not a LEGO theme.
  var topCategoryCache = {};
  function topCategoryId(categoryId, categories) {
    if (topCategoryCache[categoryId] !== undefined) return topCategoryCache[categoryId];
    var id = categoryId;
    var seen = {};
    while (categories[id] && categories[id].parentId && !seen[id]) {
      seen[id] = true;
      id = categories[id].parentId;
    }
    topCategoryCache[categoryId] = id;
    return id;
  }
  function categoryDisplayNameById(id) {
    if (!id) return "Uncategorized";
    return (categoriesById && categoriesById[id] && categoriesById[id].name) || "Uncategorized";
  }

  // Custom pinch/pan/double-tap zoom, independent of the browser's native
  // zoom — the page disables native pinch-zoom site-wide (to avoid
  // accidental zooming while picking), and toggling that dynamically to
  // re-enable it is unreliable on iOS, which only honors the viewport
  // meta tag's zoom bounds as computed at initial page load.
  var zoomScale = 1;
  var zoomX = 0;
  var zoomY = 0;
  var pointers = {};
  var pinchStartDist = 0;
  var pinchStartScale = 1;
  var lastTapTime = 0;
  var MAX_ZOOM = 4;

  function applyZoomTransform() {
    lightboxImg.style.transform = "translate(" + zoomX + "px, " + zoomY + "px) scale(" + zoomScale + ")";
  }

  function resetZoom() {
    zoomScale = 1;
    zoomX = 0;
    zoomY = 0;
    applyZoomTransform();
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function touchDistance(t1, t2) {
    var dx = t1.clientX - t2.clientX;
    var dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Touch Events rather than Pointer Events: iOS WebKit (which every iOS
  // browser, including Chrome, runs on) has a history of unreliable
  // multi-touch handling via Pointer Events — Touch Events are the
  // long-standing, battle-tested API there.
  //
  // Listeners are on the full-screen overlay, not the (possibly small,
  // native-resolution) image itself — a pinch's two fingers often won't
  // both land within a small image's bounds, and a touch that starts
  // outside it would never reach a listener attached to the image.
  // preventDefault is only called once we've recognized an actual pinch,
  // pan, or double-tap gesture — a plain single tap falls through so the
  // browser's synthesized click still closes the lightbox on backdrop
  // taps (see the click listener below).
  lightbox.addEventListener("touchstart", function (e) {
    if (e.target === lightboxClose) return;

    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }

    if (e.touches.length === 2) {
      e.preventDefault();
      pinchStartDist = touchDistance(e.touches[0], e.touches[1]);
      pinchStartScale = zoomScale;
    } else if (e.touches.length === 1) {
      var now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        if (zoomScale > 1) {
          resetZoom();
        } else {
          zoomScale = 2.5;
          applyZoomTransform();
        }
      }
      lastTapTime = now;
    }
  }, { passive: false });

  lightbox.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = touchDistance(e.touches[0], e.touches[1]);
      if (pinchStartDist > 0) {
        zoomScale = clamp(pinchStartScale * (dist / pinchStartDist), 1, MAX_ZOOM);
        applyZoomTransform();
      }
    } else if (e.touches.length === 1 && zoomScale > 1) {
      e.preventDefault();
      var t = e.touches[0];
      var prev = pointers[t.identifier];
      if (prev) {
        zoomX += t.clientX - prev.x;
        zoomY += t.clientY - prev.y;
        applyZoomTransform();
      }
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });

  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      delete pointers[e.changedTouches[i].identifier];
    }
    if (e.touches.length < 2) pinchStartDist = 0;
  }
  lightbox.addEventListener("touchend", endTouch);
  lightbox.addEventListener("touchcancel", endTouch);

  var lightboxHint = document.getElementById("lightboxHint");
  var currentObjectUrl = null;
  var DEFAULT_HINT = "Pinch or double-tap to zoom";

  function openLightbox(url) {
    resetZoom();
    lightboxImg.src = "";
    lightboxHint.textContent = "Loading…";
    lightbox.classList.remove("hidden");

    // Fetch via JS (rather than a plain <img src>) so we can read the
    // diagnostic headers item-image.js sets — tells us whether this photo
    // is the larger color-specific one or the small fallback, and its
    // actual byte size, without needing device devtools to check.
    fetch(url).then(function (res) {
      if (!res.ok) throw new Error("image request failed");
      var tier = res.headers.get("X-Image-Tier");
      var bytes = res.headers.get("X-Image-Bytes");
      return res.blob().then(function (blob) {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        lightboxImg.src = currentObjectUrl;
        var sizeLabel = bytes ? Math.round(bytes / 1024) + "KB" : "";
        var TIER_LABELS = { "catalog-api": "official catalog photo", "hires": "hi-res photo", "large": "BrickLink large photo", "small": "low-res photo" };
        var tierLabel = TIER_LABELS[tier] || "photo";
        lightboxHint.textContent = DEFAULT_HINT + " · " + tierLabel + (sizeLabel ? " (" + sizeLabel + ")" : "");
      });
    }).catch(function () {
      lightboxHint.textContent = "Couldn't load this photo";
    });
  }

  function closeLightbox() {
    lightbox.classList.add("hidden");
    lightboxImg.src = "";
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
    lightboxHint.textContent = DEFAULT_HINT;
    resetZoom();
  }

  function sizeThumbsToRows(container) {
    var rows = container.querySelectorAll(".item-row");

    rows.forEach(function (row) {
      var body = row.querySelector(".item-body");
      if (body) tallest = Math.max(tallest, body.offsetHeight);

    var size = Math.max(THUMB_MIN, Math.min(THUMB_MAX, tallest));

  function renderOrdersList() {

      ordersView.innerHTML = '<div class="state-block">No open orders right now.</div>';
      return;

    var toShipCount = orders.filter(function (o) { return o.status === "PACKED"; }).length;

    // where pickup happens to fall in Ryan's picking workflow (it varies
    // day to day). Tracked per order, same durable-sync pattern as Drive

    // even after an earlier batch's pickup was already confirmed.
    var ordersAwaitingPickup = orders.filter(function (o) { return o.status === "PACKED" && !pickupScheduled[o.orderId]; });

    var inProcessOrders = orders.filter(function (o) {
      var meta = STATUS_META[o.status];
      return o.orderTotal && (!meta || meta.tone !== "problem");
    });
    var inProcessCurrency = inProcessOrders.length ? inProcessOrders[0].currencyCode : null;
    var inProcessTotal = null;
    if (inProcessOrders.length) {

      }
      html += ""
        + '<div class="order-card' + (needsPick ? ' needs-pick' : '') + '" role="button" tabindex="0" data-order="' + escapeHtml(order.orderId) + '">'
        + '<div class="order-top-row">'
        + '<span class="order-id-group">'
        + '<span class="order-id mono">#' + escapeHtml(order.orderId) + '</span>'
        + statusBadgeHtml(order.status)
        + '</span>'
        + '<span class="order-date">' + escapeHtml(formatDate(order.date)) + '</span>'
        + '</div>'
        + '<div class="order-buyer">'
        + '<span>' + escapeHtml(order.buyer || "") + ' · ' + lineCount + ' lots · ' + total + ' items</span>'
        + (order.orderTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(order.orderTotal, order.currencyCode)) + '</span>' : '')
        + '</div>'
        + '<div class="order-progress-row">'
        + '<div class="progress-track"><div class="progress-fill' + (done ? ' done' : '') + '" style="width:' + pct + '%"></div></div>'

        + (statusAction ? '<div class="order-status-row">' + statusAction + '</div>' : '')
        + '</div>';
    });
    ordersView.innerHTML = html;

    ordersView.querySelectorAll(".order-card").forEach(function (card) {
      card.addEventListener("click", function () {
        openOrder(card.getAttribute("data-order"));
      });
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openOrder(card.getAttribute("data-order"));
        }
      });
    });

    ordersView.querySelectorAll(".status-action-btn:not(.list-drive-thru-btn):not(.pickup-btn)").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleStatusChange(btn);
      });
    });

    ordersView.querySelectorAll(".list-drive-thru-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleListDriveThru(btn);
      });
    });

    var pickupBtn = document.getElementById("pickupScheduledBtn");
    if (pickupBtn) {
      pickupBtn.addEventListener("click", function () {
        ordersAwaitingPickup.forEach(function (o) { pickupScheduled[o.orderId] = true; });
        pushOrderActions();
        renderOrdersList();
      });
    }
  }

  function handleStatusChange(btn) {
    var orderId = btn.getAttribute("data-order");
    var targetStatus = btn.getAttribute("data-target-status");
    var label = targetStatus === "PACKED" ? "Packed" : "Shipped";

    if (!window.confirm("Mark order #" + orderId + " as " + label + " on BrickLink?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Updating…";

    postJSON("/api/update-order-status", { orderId: orderId, status: targetStatus })
      .then(function () {
        var order = orders.find(function (o) { return o.orderId === orderId; });
        if (order) order.status = targetStatus;
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't update order #" + orderId + ": " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  // Same action as the order detail page's Drive Thru button (and shares
  // its durable "sent" tracking), just reachable straight from the list —
  // the natural next tap right after marking an order shipped, so there's
  // no separate trip into the order to send it.
  function handleListDriveThru(btn) {
    var orderId = btn.getAttribute("data-order");
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + orderId + "?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: orderId })
      .then(function () {
        driveThruSent[orderId] = true;
        pushOrderActions();
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  function setOrdersLoading() {
    ordersView.innerHTML = '<div class="state-block">Loading orders…</div>';
  }

  function setOrdersError(message) {
    ordersView.innerHTML = ''
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="ordersRetryBtn">Try again</button></div>';
    var btn = document.getElementById("ordersRetryBtn");
    if (btn) btn.addEventListener("click", function () { loadOrders(); });
  }

  async function loadOrders() {
    setOrdersLoading();
    setRefreshing(true);
    try {
      orders = await fetchJSON("/api/orders");
      // Newest first, matching BrickLink's own Orders Received page.
      orders.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      if (currentView === "orders") renderOrdersList();
    } catch (err) {
      if (currentView === "orders") setOrdersError(err.message);
    } finally {
      setRefreshing(false);
    }
  }

  function setRefreshing(isRefreshing) {
    refreshBtn.disabled = isRefreshing;
    refreshBtn.classList.toggle("spinning", isRefreshing);
  }

  function checkSvg() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // Fallback art for when the live catalog photo hotlink fails to load.
  function thumbSvg(type) {
    if (type === "MINIFIG") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="8" y="2.5" width="8" height="6" rx="2.5"/>'
        + '<path d="M6.5 10h11l-1 6.5a2 2 0 0 1-2 1.5h-5a2 2 0 0 1-2-1.5L6.5 10z"/>'
        + '<path d="M9 18v3.5M15 18v3.5"/>'
        + '</svg>';
    }
    if (type === "SET") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="3" y="7" width="18" height="13" rx="1.5"/>'
        + '<path d="M3 7l3-4h12l3 4"/>'
        + '</svg>';
    }
    // PART and everything else: simple brick
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<rect x="3" y="9" width="18" height="10" rx="1.5"/>'
      + '<circle cx="8" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '<circle cx="16" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '</svg>';
  }

  function catalogImageUrl(item) {
    return "/api/item-image?type=" + encodeURIComponent(item.type)
      + "&no=" + encodeURIComponent(item.itemNo)
      + "&color=" + encodeURIComponent(item.colorId || 0)
      + "&nu=" + encodeURIComponent(item.newOrUsed === "U" ? "U" : "N");
  }

  function thumbHtml(item) {
    var url = catalogImageUrl(item);
    return '<span class="thumb-link" data-img-url="' + escapeHtml(url) + '">'
      + '<span class="thumb-fallback">' + thumbSvg(item.type) + '</span>'
      + '<img src="' + escapeHtml(url) + '" alt="" referrerpolicy="no-referrer" style="display:none" '
      + 'onload="this.previousElementSibling.style.display=\'none\'; this.style.display=\'block\';" '
      + 'onerror="this.remove();">'
      + '</span>';
  }

  // A qty>1 item's own mini progress bar — fills in as it gets tapped,
  // separate from (and in addition to) the enlarged qty badge and the
  // row's own background tint, per Ryan's own suggestion for confirming
  // a multi-piece lot is fully counted out rather than just "touched".
  function itemProgressRowHtml(progress) {
    var pct = progress.of > 0 ? Math.round((progress.n / progress.of) * 100) : 0;
    var done = progress.n >= progress.of;
    return '<div class="item-progress-row">'
      + '<div class="progress-track"><div class="progress-fill' + (done ? ' done' : '') + '" style="width:' + pct + '%"></div></div>'
      + '<span class="progress-label">' + progress.n + '/' + progress.of + '</span>'
      + '</div>';
  }

  function renderOrderDetail(order, items, messages, contact) {
    messages = messages || [];
    var picked = pickedCount(order.orderId, items);
    var allDone = items.length > 0 && picked === items.length;
    var itemKeys = computeItemKeys(items);
    var canSendDriveThru = order.status === "SHIPPED";
    var canLeaveFeedback = ["PACKED", "SHIPPED", "RECEIVED", "COMPLETED"].indexOf(order.status) !== -1;
    var detailStatusAction = "";
    if (order.status === "PAID") {
      detailStatusAction = '<button class="status-action-btn to-packed" id="detailStatusBtn" data-target-status="PACKED">Mark as packed</button>';
    } else if (order.status === "PACKED") {
      detailStatusAction = '<button class="status-action-btn to-shipped" id="detailStatusBtn" data-target-status="SHIPPED">Mark as shipped</button>';
    }

    var rows = items.map(function (item, idx) {
      var isDone = isPicked(order.orderId, itemKeys[idx]);
      var isMulti = item.qty > 1;
      var progress = isMulti ? pickProgress(order.orderId, itemKeys[idx], item.qty) : null;
      var isPartial = isMulti && !isDone && progress.n > 0;
      var rowClass = isDone ? ' picked' : (isPartial ? ' partial' : '');
      return ""
        + '<div class="item-row' + rowClass + '" data-key="' + escapeHtml(itemKeys[idx]) + '" data-qty="' + item.qty + '">'
        + '<div class="item-thumb">' + thumbHtml(item) + '<span class="qty-chip' + (isMulti ? ' multi' : '') + '">' + item.qty + '</span></div>'
        + '<div class="item-body">'
        + '<div class="item-line1">'
        + '<span class="item-no mono">' + escapeHtml(item.itemNo) + '</span>'
        + '<span class="item-line1-right">'
        + '<span class="item-type-tag">' + escapeHtml(item.type) + '</span>'
        + (item.unitPrice ? '<span class="item-price mono">' + escapeHtml(formatCurrency(item.unitPrice, order.currencyCode)) + '</span>' : '')
        + '</span>'
        + '</div>'
        + (isMulti ? itemProgressRowHtml(progress) : '')
        + '<div class="item-name">' + escapeHtml(item.name) + '</div>'
        + (item.colorName && item.colorName.trim().toLowerCase() !== "not applicable" ? '<div class="item-color">' + escapeHtml(item.colorName) + '</div>' : '')
        + (item.description ? '<div class="item-color">' + escapeHtml(item.description) + '</div>' : '')
        + (item.remarks ? '<div class="item-remarks">' + escapeHtml(item.remarks) + '</div>' : '')
        + '<a class="item-bl-link" href="' + escapeHtml(bricklinkCatalogUrl(item, item.newOrUsed === "U" ? "U" : "N")) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View on BrickLink ↗</a>'
        + '</div>'
        + '<div class="checkmark">' + checkSvg() + '</div>'
        + '</div>';
    }).join("");

    orderView.innerHTML = ""
      + '<div class="order-summary">'
      + '<div class="order-id-group">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + statusBadgeHtml(order.status)
      + '</div>'
      + '<div class="order-buyer">'
      + '<span>' + escapeHtml(order.buyer || "") + ' · ' + escapeHtml(formatDate(order.date)) + ' <span class="buyer-rating" id="buyerRatingBadge"></span></span>'
      + (order.orderTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(order.orderTotal, order.currencyCode)) + '</span>' : '')
      + '</div>'
      + '<div class="picked-count" id="pickedCountText"><strong>' + picked + ' of ' + items.length + '</strong> lots picked' + (allDone ? ' — ready to pack' : '') + '</div>'
      + (detailStatusAction ? '<div class="drive-thru-row">' + detailStatusAction + '</div>' : '')
      + (canSendDriveThru ? '<div class="drive-thru-row">'
        + '<button class="drive-thru-btn" id="driveThruBtn"' + (driveThruSent[order.orderId] ? " disabled" : "") + '>' + (driveThruSent[order.orderId] ? "Drive Thru Sent" : "Send Drive Thru") + '</button>'
        + '</div>' : '')
      + '</div>'
      + (items.length ? '<button class="jump-to-items-btn" id="jumpToItemsBtn">Jump to items ↓</button>' : '')
      + renderContactSection(contact)
      + renderFinancialSection(contact, order)
      + renderMessagesSection(messages)
      + (canLeaveFeedback ? renderFeedbackSection(order) : '')
      + (items.length ? '<div class="order-actions">'
        + '<button class="select-all-btn">Select all as picked</button>'
        + '<button class="reset-btn">Clear picks for this order</button>'
        + '</div>' : '')
      + '<div id="orderItemsAnchor"></div>'
      + (items.length ? rows : '<div class="state-block">This order has no line items.</div>')
      + '<div class="reset-row">'
      + '<button class="bottom-back-btn" id="bottomBackBtn">&#8592; All orders</button>'
      + (items.length ? '<button class="select-all-btn">Select all as picked</button>'
        + '<button class="reset-btn">Clear picks for this order</button>' : '')
      + '</div>';

    wireThumbLinks(orderView);
    sizeThumbsToRows(orderView);

    // A full renderOrderDetail() re-render on every single pick toggle
    // used to rebuild the entire item list — including re-running
    // sizeThumbsToRows()'s per-row layout measurement — on every tap.
    // Harmless-looking on desktop, but caused a real bug on iOS: tapping
    // an item near the bottom of a long list would visibly "jump" to a
    // different scroll position, almost certainly WebKit's scroll
    // position heuristics getting confused by the wholesale DOM
    // replacement. Toggling the "picked" class directly on just the
    // tapped row (all its visual states are pure CSS, no layout-affecting
    // properties — see .item-row.picked) avoids the rebuild entirely.
    orderView.querySelectorAll(".item-row").forEach(function (row) {
      row.addEventListener("click", function () {
        var key = row.getAttribute("data-key");
        var qty = parseInt(row.getAttribute("data-qty"), 10) || 1;
        togglePicked(order.orderId, key, qty);

        var isDone = isPicked(order.orderId, key);
        var isMulti = qty > 1;
        var progress = isMulti ? pickProgress(order.orderId, key, qty) : null;
        row.classList.toggle("picked", isDone);
        row.classList.toggle("partial", isMulti && !isDone && progress.n > 0);

        var progressEl = row.querySelector(".item-progress-row");
        if (progressEl) progressEl.outerHTML = itemProgressRowHtml(progress);

        updatePickedProgress(order, items);
      });
    });
    updatePickedProgress(order, items);

    orderView.querySelectorAll(".reset-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        resetOrder(order.orderId);
        renderOrderDetail(order, items, messages, contact);
      });
    });

    orderView.querySelectorAll(".select-all-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        selectAllOrder(order.orderId, items);
        renderOrderDetail(order, items, messages, contact);
      });
    });

    var detailStatusBtn = document.getElementById("detailStatusBtn");
    if (detailStatusBtn) {
      detailStatusBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var targetStatus = detailStatusBtn.getAttribute("data-target-status");
        var label = targetStatus === "PACKED" ? "Packed" : "Shipped";
        if (!window.confirm("Mark order #" + order.orderId + " as " + label + " on BrickLink?")) return;

        var originalText = detailStatusBtn.textContent;
        detailStatusBtn.disabled = true;
        detailStatusBtn.textContent = "Updating…";

        postJSON("/api/update-order-status", { orderId: order.orderId, status: targetStatus })
          .then(function () {
            // order is the same object referenced from the orders array
            // (openOrder finds it there, not a copy), so this mutation
            // also updates what the orders list shows once you go back.
            order.status = targetStatus;
            renderOrderDetail(order, items, messages, contact);
          })
          .catch(function (err) {
            window.alert("Couldn't update order #" + order.orderId + ": " + err.message);
            detailStatusBtn.disabled = false;
            detailStatusBtn.textContent = originalText;
          });
      });
    }

    var driveThruBtn = document.getElementById("driveThruBtn");
    if (driveThruBtn) {
      driveThruBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleSendDriveThru(order, items, messages, contact);
      });
    }

    var copyAddressBtn = document.getElementById("copyAddressBtn");
    if (copyAddressBtn) {
      copyAddressBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var originalText = copyAddressBtn.textContent;
        copyToClipboard(contactAddressLines(contact).join("\n"))
          .then(function () { flashCopied(copyAddressBtn, originalText); })
          .catch(function () { window.alert("Couldn't copy — select and copy manually."); });
      });
    }
    var copyEmailBtn = document.getElementById("copyEmailBtn");
    if (copyEmailBtn) {
      copyEmailBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var originalText = copyEmailBtn.textContent;
        copyToClipboard(contact.email)
          .then(function () { flashCopied(copyEmailBtn, originalText); })
          .catch(function () { window.alert("Couldn't copy — select and copy manually."); });
      });
    }

    var saveTrackingBtn = document.getElementById("saveTrackingBtn");
    if (saveTrackingBtn) {
      saveTrackingBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var input = document.getElementById("trackingInput");
        var trackingNo = input.value.trim();
        if (!trackingNo) { window.alert("Enter a tracking number first."); return; }

        saveTrackingBtn.disabled = true;
        saveTrackingBtn.textContent = "Saving…";

        postJSON("/api/update-tracking", { orderId: order.orderId, trackingNo: trackingNo })
          .then(function () {
            contact.trackingNo = trackingNo;
            contactCache[order.orderId] = contact;
            renderOrderDetail(order, items, messages, contact);
          })
          .catch(function (err) {
            window.alert("Couldn't save tracking number: " + err.message);
            saveTrackingBtn.disabled = false;
            saveTrackingBtn.textContent = "Save";
          });
      });
    }

    var jumpToItemsBtn = document.getElementById("jumpToItemsBtn");
    if (jumpToItemsBtn) {
      jumpToItemsBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var anchor = document.getElementById("orderItemsAnchor");
        var header = document.querySelector(".topbar");
        if (!anchor) return;
        // scrollIntoView's block:"start" aligns the anchor with the very
        // top of the viewport, but the header is position:sticky and
        // overlaps that same space — without correcting for its height,
        // the anchor (and the first item right after it) lands partly
        // hidden underneath it, which is what looked like landing
        // "midway through the first item" instead of at its top.
        var headerHeight = header ? header.getBoundingClientRect().height : 0;
        var targetY = anchor.getBoundingClientRect().top + window.scrollY - headerHeight - 12;
        window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
      });
    }

    wireFeedbackForm(order, items, messages, contact);
    fetchAndShowBuyerRating(order.buyer);

    document.getElementById("bottomBackBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      goToOrders();
    });
  }

  // Country line is skipped for US addresses — that matches how a
  // standard domestic USPS-style name/address block reads, and is what
  // gets pasted into PirateShip's address fields.
  function contactAddressLines(contact) {
    if (!contact) return [];
    var lines = [];
    if (contact.name) lines.push(contact.name);
    if (contact.address1) lines.push(contact.address1);
    if (contact.address2) lines.push(contact.address2);
    var cityStateZip = [contact.city, contact.state].filter(Boolean).join(", ") + (contact.postalCode ? " " + contact.postalCode : "");
    cityStateZip = cityStateZip.trim();
    if (cityStateZip) lines.push(cityStateZip);
    if (contact.countryCode && contact.countryCode !== "US") lines.push(contact.countryCode);
    return lines;
  }

  // UPS numbers always start "1Z"; USPS numbers are purely numeric and
  // long (tracking numbers range ~20-22 digits across their various
  // service prefixes — 9300/9400/9205/9407/etc — so matching "all
  // digits, long enough to be a real tracking number" catches those
  // without hardcoding one specific prefix). Anything else (FedEx,
  // DHL, a typo) is left as plain text rather than guessing a carrier
  // and linking to the wrong one.
  function trackingUrl(trackingNo) {
    var clean = (trackingNo || "").replace(/\s+/g, "");
    if (/^1Z/i.test(clean)) {
      return "https://www.ups.com/track?tracknum=" + encodeURIComponent(clean);
    }
    if (/^\d{10,}$/.test(clean)) {
      return "https://tools.usps.com/go/TrackConfirmAction?tLabels=" + encodeURIComponent(clean);
    }
    return null;
  }

  function renderTrackingRow(contact) {
    if (contact.trackingNo) {
      var url = trackingUrl(contact.trackingNo);
      var valueHtml = url
        ? '<a class="mono tracking-number-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(contact.trackingNo) + '</a>'
        : '<span class="mono">' + escapeHtml(contact.trackingNo) + '</span>';
      return '<div class="contact-row"><span class="contact-label">Tracking</span>' + valueHtml + '</div>';
    }
    return ""
      + '<div class="contact-row">'
      + '<span class="contact-label">Tracking</span>'
      + '<span class="tracking-entry">'
      + '<input type="text" class="tracking-input" id="trackingInput" placeholder="Enter tracking number" autocomplete="off">'
      + '<button class="copy-btn tracking-save-btn" id="saveTrackingBtn">Save</button>'
      + '</span>'
      + '</div>';
  }

  function renderContactSection(contact) {
    if (!contact || (!contact.email && !contact.address1)) return "";
    var lines = contactAddressLines(contact);
    return ""
      + '<div class="contact-section">'
      + (lines.length ? '<div class="contact-row"><span class="contact-label">Ship to</span><span class="contact-address">' + lines.map(escapeHtml).join("<br>") + '</span></div>' : '')
      + (contact.email ? '<div class="contact-row"><span class="contact-label">Email</span><span>' + escapeHtml(contact.email) + '</span></div>' : '')
      + renderTrackingRow(contact)
      + '<div class="contact-actions">'
      + (lines.length ? '<button class="copy-btn" id="copyAddressBtn">Copy name &amp; address</button>' : '')
      + (contact.email ? '<button class="copy-btn" id="copyEmailBtn">Copy email</button>' : '')
      + '</div>'
      + '</div>';
  }

  // Payment method lives here now (moved out of the contact/address block)
  // alongside the full cost breakdown — all sourced from the same order
  // detail fetch, just grouped by what it's about rather than where it
  // came from. Optional charge rows (insurance/etc1/etc2/credit/coupon)
  // only show when BrickLink actually returned a non-zero value, so a
  // typical order isn't cluttered with a wall of "$0.00" rows.
  function financialRow(label, amount, currencyCode) {
    var num = Number(amount);
    if (!amount || isNaN(num) || num === 0) return "";
    return '<div class="contact-row"><span class="contact-label">' + escapeHtml(label) + '</span><span>' + escapeHtml(formatCurrency(amount, currencyCode)) + '</span></div>';
  }

  function renderFinancialSection(contact, order) {
    if (!contact) return "";
    var cost = contact.cost || {};
    var currencyCode = cost.currencyCode || order.currencyCode;
    var grandTotal = cost.grandTotal || order.orderTotal;
    if (!contact.paymentMethod && !grandTotal) return "";
    return ""
      + '<div class="contact-section">'
      + (contact.paymentMethod ? '<div class="contact-row"><span class="contact-label">Payment</span><span>' + escapeHtml(contact.paymentMethod) + '</span></div>' : '')
      + financialRow("Subtotal", cost.subtotal, currencyCode)
      + financialRow("Shipping", cost.shipping, currencyCode)
      + financialRow("Insurance", cost.insurance, currencyCode)
      + financialRow("Tax", cost.tax, currencyCode)
      + financialRow("Other", cost.etc1, currencyCode)
      + financialRow("Other", cost.etc2, currencyCode)
      + financialRow("Credit", cost.credit, currencyCode)
      + financialRow("Coupon", cost.coupon, currencyCode)
      + (grandTotal ? '<div class="contact-row financial-total"><span class="contact-label">Total</span><span>' + escapeHtml(formatCurrency(grandTotal, currencyCode)) + '</span></div>' : '')
      + '</div>';
  }

  // navigator.clipboard needs a secure context (fine — this app is always
  // served over HTTPS) but isn't available in every embedded webview, so
  // this falls back to the older execCommand("copy") dance via a hidden
  // textarea rather than just failing silently there.
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve(); else reject(new Error("Copy failed"));
      } catch (e) { reject(e); }
    });
  }

  function flashCopied(btn, originalText) {
    btn.textContent = "Copied!";
    setTimeout(function () { btn.textContent = originalText; }, 1500);
  }

  function renderMessagesSection(messages) {
    if (!messages || !messages.length) return "";
    var cards = messages.map(function (m) {
      return ""
        + '<div class="message-card">'
        + '<div class="message-meta"><span>' + escapeHtml(m.from || "") + '</span><span>' + escapeHtml(formatDate(m.dateSent)) + '</span></div>'
        + (m.subject ? '<div class="message-subject">' + escapeHtml(m.subject) + '</div>' : '')
        + '<div class="message-body">' + escapeHtml(m.body || "") + '</div>'
        + '</div>';
    }).join("");
    return '<div class="messages-section"><div class="messages-heading">Messages</div>' + cards + '</div>';
  }

  var RATING_OPTIONS = [
    { value: "Praise", label: "Praise", cls: "praise" },
    { value: "Neutral", label: "Neutral", cls: "neutral" },
    { value: "Complaint", label: "Complaint", cls: "complaint" }
  ];

  var DEFAULT_FEEDBACK_COMMENT = "A+ buyer! Thanks for your order with The Brick Stud, come back again soon :)";

  function renderFeedbackSection(order) {
    if (feedbackSent[order.orderId]) {
      return '<div class="feedback-section"><div class="feedback-sent-msg">Feedback sent — thanks!</div></div>';
    }
    var ratingBtns = RATING_OPTIONS.map(function (opt) {
      return '<button type="button" class="rating-btn ' + opt.cls + '" data-rating="' + opt.value + '">' + opt.label + '</button>';
    }).join("");
    return ""
      + '<div class="feedback-section">'
      + '<div class="feedback-heading">Leave feedback for buyer</div>'
      + '<div class="feedback-rating-row">' + ratingBtns + '</div>'
      + '<textarea class="feedback-textarea" id="feedbackComment" maxlength="500">' + escapeHtml(DEFAULT_FEEDBACK_COMMENT) + '</textarea>'
      + '<button class="feedback-submit-btn" id="feedbackSubmitBtn" disabled>Submit feedback</button>'
      + '</div>';
  }

  function wireFeedbackForm(order, items, messages, contact) {
    var section = orderView.querySelector(".feedback-section");
    if (!section || feedbackSent[order.orderId]) return;

    var selectedRating = null;
    var ratingBtns = section.querySelectorAll(".rating-btn");
    var commentEl = section.querySelector("#feedbackComment");
    var submitBtn = section.querySelector("#feedbackSubmitBtn");

    function updateSubmitState() {
      submitBtn.disabled = !selectedRating || !commentEl.value.trim();
    }

    ratingBtns.forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        selectedRating = btn.getAttribute("data-rating");
        ratingBtns.forEach(function (b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        updateSubmitState();
      });
    });

    commentEl.addEventListener("click", function (e) { e.stopPropagation(); });
    commentEl.addEventListener("input", updateSubmitState);

    submitBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var comment = commentEl.value.trim();
      if (!selectedRating || !comment) return;
      if (!window.confirm("Post " + selectedRating + " feedback for order #" + order.orderId + "? This is public and visible to the buyer.")) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      postJSON("/api/feedback", { orderId: order.orderId, rating: selectedRating, comment: comment })
        .then(function () {
          feedbackSent[order.orderId] = true;
          pushOrderActions();
          renderOrderDetail(order, items, messages, contact);
        })
        .catch(function (err) {
          window.alert("Couldn't post feedback: " + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit feedback";
        });
    });
  }

  function handleSendDriveThru(order, items, messages, contact) {
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + order.orderId + "?")) return;

    var btn = document.getElementById("driveThruBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: order.orderId })
      .then(function () {
        driveThruSent[order.orderId] = true;
        pushOrderActions();
        renderOrderDetail(order, items, messages, contact);
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = "Send Drive Thru";
      });
  }

  // Confirmed against a live response: GET /members/{username}/ratings
  // returns { user_name, rating: { PRAISE, NEUTRAL, COMPLAINT } } — counts,
  // not an overall score — e.g. {"PRAISE":1,"NEUTRAL":0,"COMPLAINT":0}.
  function fetchAndShowBuyerRating(username) {
    var badge = document.getElementById("buyerRatingBadge");
    if (!badge || !username) return;

    if (ratingsCache[username]) {
      renderRatingBadge(badge, ratingsCache[username]);
      return;
    }

    fetchJSON("/api/member-rating?username=" + encodeURIComponent(username))
      .then(function (rating) {
        ratingsCache[username] = rating;
        var stillThere = document.getElementById("buyerRatingBadge");
        if (stillThere) renderRatingBadge(stillThere, rating);
      })
      .catch(function () { /* rating just won't show */ });
  }

  function renderRatingBadge(badge, rating) {
    if (!rating || !rating.rating || typeof rating.rating !== "object") return;
    var counts = rating.rating;
    var praise = Number(counts.PRAISE) || 0;
    var neutral = Number(counts.NEUTRAL) || 0;
    var complaint = Number(counts.COMPLAINT) || 0;
    var total = praise + neutral + complaint;
    if (total === 0) return;
    // One decimal place so e.g. 1835/1842 shows as 99.6%, not a
    // misleadingly-rounded 100% when there are some non-praise ratings.
    var pct = Math.round((praise / total) * 1000) / 10;
    badge.textContent = "★ " + total + " (" + pct + "%)";
  }

  function setOrderLoading(order) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '<div class="order-buyer">' + escapeHtml(order.buyer || "") + '</div>'
      + '</div>'
      + '<div class="state-block">Loading items…</div>';
  }

  function setOrderError(order, message) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '</div>'
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="orderRetryBtn">Try again</button></div>'
      + '<div class="reset-row"><button class="bottom-back-btn" id="bottomBackBtnErr">&#8592; All orders</button></div>';
    var retryBtn = document.getElementById("orderRetryBtn");
    if (retryBtn) retryBtn.addEventListener("click", function () { openOrder(order.orderId, true); });
    var backBtnErr = document.getElementById("bottomBackBtnErr");
    if (backBtnErr) backBtnErr.addEventListener("click", goToOrders);
  }

  async function openOrder(orderId, forceReload) {
    var order = orders.filter(function (o) { return o.orderId === orderId; })[0];
    if (!order) return;

    currentView = "order";
    ordersView.classList.add("hidden");
    orderView.classList.remove("hidden");
    inventoryView.classList.add("hidden");
    backBtn.style.display = "inline-flex";
    topbarCategoryRow.style.display = "none";
    topbarSubNavRow.style.display = "none";
    topbarProgressRow.classList.remove("hidden");
    brandSub.textContent = "Order #" + order.orderId;

    // Make sure picks (and Drive Thru/feedback completion) reflect the
    // durable remote state before showing anything — this is what makes
    // a force-quit not look like a reset. Usually already resolved by
    // the time someone taps in, so this rarely adds a visible delay.
    setOrderLoading(order);
    if (remoteSyncPromise) {
      try { await remoteSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (orderActionsSyncPromise) {
      try { await orderActionsSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (currentView !== "order" || order.orderId !== orderId) return;

    if (forceReload) { delete itemsCache[orderId]; delete messagesCache[orderId]; delete contactCache[orderId]; }

    var cached = itemsCache[orderId];
    if (cached) {
      renderOrderDetail(order, cached, messagesCache[orderId] || [], contactCache[orderId] || null);
      return;
    }

    setOrderLoading(order);
    try {
      var colors = await getColors();
      var items = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/items");
      items.forEach(function (item) {
        item.colorName = item.colorId ? (colors[item.colorId] || null) : null;
        item.name = decodeHtmlEntities(item.name);
        item.description = decodeHtmlEntities(item.description);
        item.remarks = decodeHtmlEntities(item.remarks);
      });
      itemsCache[orderId] = items;
      migrateOrderState(orderId, items);

      // Messages are a nice-to-have, not core to picking — a failure here
      // shouldn't block the order view from showing.
      var messages = [];
      try {
        messages = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/messages");
        messages.forEach(function (m) {
          m.subject = decodeHtmlEntities(m.subject);
          m.body = decodeHtmlEntities(m.body);
        });
      } catch (e) { /* ignore — just show the order without messages */ }
      messagesCache[orderId] = messages;

      // Payment method/address/email — also a nice-to-have, not core to
      // picking, so a failure here shouldn't block the order view either.
      var contact = null;
      try {
        contact = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/contact");
        contact.name = decodeHtmlEntities(contact.name);
      } catch (e) { /* ignore — just show the order without the contact block */ }
      contactCache[orderId] = contact;

      // Catches "already done directly on BrickLink" — only ever adds
      // true, never overrides a locally-tracked true back to false, and
      // any failure here just leaves things as they were.
      try {
        var statusCheck = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/status-check?buyer=" + encodeURIComponent(order.buyer || ""));
        var actionsChanged = false;
        if (statusCheck && statusCheck.driveThruSent && !driveThruSent[orderId]) {
          driveThruSent[orderId] = true;
          actionsChanged = true;
        }
        if (statusCheck && statusCheck.feedbackAlreadyPosted && !feedbackSent[orderId]) {
          feedbackSent[orderId] = true;
          actionsChanged = true;
        }
        if (actionsChanged) pushOrderActions();
      } catch (e) { /* ignore — just show whatever's already tracked locally */ }

      if (currentView === "order" && order.orderId === orderId) {
        renderOrderDetail(order, items, messages, contact);
      }
    } catch (err) {
      if (currentView === "order" && order.orderId === orderId) {
        setOrderError(order, err.message);
      }
