      ? '<button type="button" class="set-fig-manage-btn" data-itemno="' + escapeHtml(e.itemNo) + '">Manage in Inventory →</button>'
      : '';
    return '<div class="item-row set-fig-match-row' + ((reallyOwned || manuallyOwned) ? ' owned' : '') + (manuallyOwned ? ' manual-owned' : '') + '">'
      + '<div class="item-thumb">' + thumbHtml(pseudoItem) + '<span class="qty-chip">' + e.quantity + '</span></div>'
      + '<div class="item-body">'
      + '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(e.itemNo) + '</span>'
      + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(e.type) + '</span></span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(decodeHtmlEntities(e.name || "")) + '</div>'
      + (isRealColorName(colorName) ? '<div class="item-color">' + escapeHtml(colorName) + '</div>' : '')
      + '<div class="item-stock-count">Needs ' + e.quantity + stockLine + '</div>'
      + setFigLookupAvgCostHtml(e)
      + drillBtnHtml
      + manageBtnHtml
      + manualFieldHtml
      + wantedBankBtnHtml
      + '</div>'
      // e doubles as the "row" the shared price-guide helpers expect —
      // it already carries type/itemNo/colorId/key/priceExpanded, same
      // fields they read off a manageInventoryRows row.
      + '<div class="inventory-price-guide-block">'
      + '<div class="price-guide-header-row">'
      + viewOnBricklinkLinkHtml(e)
      + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(e.key) + '">' + (e.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
      + '</div>'
      + renderPriceGuidePanel(e, true)
      + '</div>'
      + '</div>';
  }

  function findSetFigLookupEntry(entryKey) {
    var state = setFigLookupActiveKey && setFigLookupCache[setFigLookupActiveKey];
    if (!state) return null;
    if (state.item && state.item.key === entryKey) return state.item;
    if (!state.entries) return null;
    for (var i = 0; i < state.entries.length; i++) {
      if (state.entries[i].key === entryKey) return state.entries[i];
    }
    return null;
  }

  // The set/fig being looked up, not one of its parts — same card shell as
  // a match row minus the owned/needed stock line, same shared price-guide
  // helpers (item doubles as the "row" they expect, same as a subset entry
  // does in setFigLookupRowHtml). Also gets the same "~avg · cheapest N US
  // listings" line the part/fig rows below it already show — previously
  // missing here, so the set itself was the only card in this list with a
  // price panel but no rolled-up average once it'd been opened.
  function setFigLookupHeaderCardHtml(item) {
    var pseudoItem = { type: item.type, itemNo: item.itemNo, colorId: 0, newOrUsed: "N" };
    return '<div class="item-row set-fig-header-card">'
      + '<div class="item-thumb">' + thumbHtml(pseudoItem) + '</div>'
      + '<div class="item-body">'
      + '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(item.itemNo) + '</span>'
      + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(item.type) + '</span></span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(decodeHtmlEntities(item.name) || "(name unknown)") + '</div>'
      + setFigLookupAvgCostHtml(item)
      // Up beside the picture, under the title, rather than on a row of its own.
      + (item.type === "SET"
        ? '<button type="button" class="reset-btn sort-list-add-btn" data-setno="' + escapeHtml(item.itemNo) + '" data-name="' + escapeHtml(item.name || "") + '"'
          + '>' + (sortListCopyCount(item.itemNo) ? '+ Add another copy (' + sortListCopyCount(item.itemNo) + ' on sort list)' : '+ Add to sort list') + '</button>'
        : '')
      + '</div>'
      + '<div class="inventory-price-guide-block">'
      + '<div class="price-guide-header-row">'
      + viewOnBricklinkLinkHtml(item)
      + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(item.key) + '">' + (item.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
      + '</div>'
      + renderPriceGuidePanel(item, true)
      + '</div>'
      + '</div>';
  }

  function renderSetFigLookupMatches(container, item, entries, colorsMap) {
    var headerHtml = item ? setFigLookupHeaderCardHtml(item) : "";
    if (!entries.length) {
      container.innerHTML = headerHtml + '<div class="state-block">No parts found for that number.</div>';
      wireThumbLinks(container);
      sizeThumbsToRows(container);
      wireSetFigLookupPriceGuideHandlers(container);
      return;
    }

    // A SET's subset list can include loose minifigs alongside ordinary
    // parts — BrickLink returns them as one flat list, typed PART/MINIFIG.
    // When both are present, split them into their own Minifigs/Parts tabs
    // — fully separate In-stock/Not-in-stock sections and "Add all to
    // wanted list" buttons, not just reordered within one list — so each
    // half gets the same standalone treatment the figs-only lookup page
    // already has. A lookup whose entries are all one type (a MINIFIG's
    // own parts breakdown, or a parts-only set) has nothing to split, so
    // it falls through to the single-list behavior this always had.
    var figEntries = entries.filter(function (e) { return e.type === "MINIFIG"; });
    var partEntries = entries.filter(function (e) { return e.type !== "MINIFIG"; });
    var hasSplit = figEntries.length > 0 && partEntries.length > 0;
    var activeEntries = hasSplit ? (setFigResultsSubView === "PARTS" ? partEntries : figEntries) : entries;
    var activeLabel = hasSplit ? (setFigResultsSubView === "PARTS" ? "parts" : "minifigs") : "parts/figs";

    // Minifigs sit on the left/default tab — the more valuable, easier-
    // to-overlook half of a set's BOM next to a long list of ordinary
    // parts, and setFigResultsSubView already opens here on a fresh submit.
    var subViewHtml = hasSplit
      ? '<div class="set-fig-lookup-type-row">'
        + '<button type="button" class="set-fig-subview-btn' + (setFigResultsSubView !== "PARTS" ? " active" : "") + '" data-subview="FIGS">Minifigs (' + figEntries.length + ')</button>'
        + '<button type="button" class="set-fig-subview-btn' + (setFigResultsSubView === "PARTS" ? " active" : "") + '" data-subview="PARTS">Parts (' + partEntries.length + ')</button>'
        + '</div>'
      : '';

    var owned = [];
    var missing = [];
    activeEntries.forEach(function (e) {
      var bucket = setFigLookupMatch(e);
      // A manual "temp add to stock" quantity counts as in-stock here same
      // as a real inventory match — it moves the row into the In-stock
      // section, counts toward the summary, and drops out of `missing`
      // (so it's skipped by "Add all to wanted list" below) — but it's
      // never written to Ryan's actual BrickLink inventory, purely a
      // client-side/session note.
      (bucket.haveQty > 0 || e.manualQty > 0 ? owned : missing).push(bucket);
    });

    function rowHtml(bucket) { return setFigLookupRowHtml(bucket, colorsMap); }

    // Source label travels with each item into the bank so it still makes
    // sense on the Wanted List page, pulled in from however many other
    // lookups by then. Computed up front so both the per-row button and
    // the "Add all" bulk button below can share it.
    var sourceLabel = item ? (item.itemNo + (item.name ? " " + decodeHtmlEntities(item.name) : "")) : "";
    var allMissingAdded = missing.length > 0 && missing.every(function (bucket) { return bucket.entry.wantedBankAdded; });

    container.innerHTML = headerHtml
      + subViewHtml
      + '<div class="inventory-summary-row"><span>' + owned.length + ' of ' + activeEntries.length + ' ' + activeLabel + ' in stock</span></div>'
      + (owned.length ? '<div class="manage-inventory-hint">In stock</div>' + owned.map(rowHtml).join("") : '')
      + (missing.length
        ? '<div class="manage-inventory-hint set-fig-missing-hint"><span>Not in stock</span><button type="button" class="reset-btn" id="setFigAddAllWantedBtn"' + (allMissingAdded ? ' disabled' : '') + '>' + (allMissingAdded ? '✓ All added to wanted list' : 'Add all to wanted list') + '</button></div>' + missing.map(rowHtml).join("")
        : '');

    // Switches which half of the split shows below — the rest of this
    // function already works off `activeEntries`/`owned`/`missing`, which
    // were computed for the tab active when this render started, so a
    // click here just re-renders from scratch against the new tab.
    container.querySelectorAll(".set-fig-subview-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        setFigResultsSubView = el.getAttribute("data-subview");
        renderSetFigLookupResults();
      });
    });

    // Adds every not-yet-added row below in one tap — skips any row already
    // in the bank (e.g. added individually, or left over from a previous
    // tap of this same button) rather than double-adding its quantity.
    var addAllBtn = document.getElementById("setFigAddAllWantedBtn");
    if (addAllBtn) {
      addAllBtn.addEventListener("click", function () {
        missing.forEach(function (bucket) {
          var entry = bucket.entry;
          if (entry.wantedBankAdded) return;
          addToWantedListBank({
            type: entry.type, itemNo: entry.itemNo, colorId: entry.colorId,
            name: decodeHtmlEntities(entry.name || ""), quantity: entry.quantity,
          }, sourceLabel);
          entry.wantedBankAdded = true;
        });
        renderSetFigLookupResults();
      });
    }

    // Toggles 0 <-> the full needed quantity — the primary on/off gesture,
    // same as "Add to wanted list" below. The qty field (qty-1 needs don't
    // get one) can still dial back to a partial amount afterward; its own
    // "change" handler sets entry.manualQty directly, which this button's
    // own label/active-state picks up again on the next render either way.
    container.querySelectorAll(".set-fig-manual-owned-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        entry.manualQty = entry.manualQty > 0 ? 0 : entry.quantity;
        renderSetFigLookupResults();
      });
    });
    container.querySelectorAll(".set-fig-manual-qty-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        var raw = parseInt(el.value, 10) || 0;
        entry.manualQty = Math.max(0, Math.min(entry.quantity, raw));
        renderSetFigLookupResults();
      });
    });
    container.querySelectorAll(".set-fig-wanted-bank-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        var bankEntry = {
          type: entry.type, itemNo: entry.itemNo, colorId: entry.colorId,
          name: decodeHtmlEntities(entry.name || ""), quantity: entry.quantity,
        };
        if (entry.wantedBankAdded) {
          removeRowFromWantedListBank(bankEntry, sourceLabel);
        } else {
          addToWantedListBank(bankEntry, sourceLabel);
        }
        entry.wantedBankAdded = !entry.wantedBankAdded;
        renderSetFigLookupResults();
      });
    });
    container.querySelectorAll(".set-fig-drill-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        drillIntoSetFigEntry(entry);
      });
    });
    container.querySelectorAll(".set-fig-manage-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        manageInventorySearchQuery = el.getAttribute("data-itemno") || "";
        manageInventoryCameFromSetFigLookup = true;
        manageInventoryCameFromSort = false;
        goToManageInventory();
      });
    });

    wireSetFigLookupPriceGuideHandlers(container);
    wireThumbLinks(container);
    sizeThumbsToRows(container);
  }

  // Shared by both renderSetFigLookupMatches branches (the header card's
  // own toggle shows up whether or not the set/fig has any subset entries)
  // — same "See active US listings" toggle/collapse wiring Manage Inventory
  // uses, just looking entries (and the header item) up via
  // findSetFigLookupEntry instead of findManageInventoryRow.
  function wireSetFigLookupPriceGuideHandlers(container) {
    container.querySelectorAll(".sort-list-add-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        el.disabled = true;
        el.textContent = "Adding…";
        addToSortList(el.getAttribute("data-setno"), el.getAttribute("data-name")).then(function (res) {
          el.textContent = "✓ Added to sort list";
        }).catch(function (err) {
          el.disabled = false;
          el.textContent = "+ Add to sort list";
          window.alert("Couldn’t add it: " + err.message);
        });
      });
    });
    container.querySelectorAll(".price-guide-toggle-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        entry.priceExpanded = !entry.priceExpanded;
        if (entry.priceExpanded) fetchPriceGuide(entry, renderSetFigLookupResults);
        renderSetFigLookupResults();
      });
    });
    container.querySelectorAll(".price-guide-collapse-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        entry.priceExpanded = false;
        renderSetFigLookupResults();
      });
    });
  }

  function renderSetFigLookupResults() {
    var container = document.getElementById("setFigLookupResults");
    if (!container) return;
    if (!setFigLookupActiveKey) { container.innerHTML = ""; return; }
    var state = setFigLookupCache[setFigLookupActiveKey];
    if (!state || state.loading) {
      container.innerHTML = '<div class="state-block">Loading parts list…</div>';
      return;
    }
    if (state.error) {
      container.innerHTML = '<div class="state-block error">' + escapeHtml(state.error) + '<br><button class="reset-btn" id="setFigLookupRetryBtn">Retry</button></div>';
      var retryBtn = document.getElementById("setFigLookupRetryBtn");
      if (retryBtn) retryBtn.addEventListener("click", function () {
        delete setFigLookupCache[setFigLookupActiveKey];
        runSetFigLookup();
      });
      return;
    }
    var entries = state.entries;
    Promise.all([ensureManageInventoryLoaded(), getColors()]).then(function (results) {
      var colorsMap = results[1];
      var resultsEl = document.getElementById("setFigLookupResults");
      if (currentView !== "set-fig-lookup" || !resultsEl) return;
      renderSetFigLookupMatches(resultsEl, state.item, entries, colorsMap);
    }).catch(function (err) {
      container.innerHTML = '<div class="state-block error">Couldn’t load your inventory to match against: ' + escapeHtml(err.message) + '</div>';
    });
  }

  // ---- Wanted List Bank ----

  // A running, cross-lookup "cart" of not-in-stock parts/figs — the actual
  // point being going through a whole lot's worth of partial minifigs one
  // at a time, adding each one's missing pieces here, then placing one
  // combined BrickLink order at the end (fewer sellers to buy from than
  // ordering separately per minifig). Durable across reloads (see
  // pushWantedBankState/syncWantedBankFromRemote below) — keyed by
  // type+itemNo+colorId so the same part pulled in from two different
  // lookups sums into one line instead of listing it twice.
  var wantedListBank = {}; // key -> { type, itemNo, colorId, name, quantity, sources: [label, ...] }

  // Set on a failed import (bad file, nothing recognizable in it) so the
  // Wanted List page can show why, cleared on the next render once the
  // message has been shown — not persisted past that, same lifetime as
  // every other transient error block in this file.
  var wantedBankImportError = null;

  // Non-null while the quick "add a single item by number" form is mid-
  // entry — set once an item number's been typed and "Add" tapped, which
  // expands the form to also ask for type/color/qty (plus name, looked up
  // automatically — see lookupManualItemName) before the item actually
  // lands in the bank. Cleared back to null on confirm or cancel, same
  // transient-UI-state lifetime as wantedBankImportError above.
  var wantedManualDraft = null;

  // Bumped on every name lookup kicked off for the manual add form, so a
  // slow/late response for an item number Ryan's since changed or typed
  // over doesn't land on top of whatever's current — only the response
  // matching the latest-issued id is applied.
  var wantedManualLookupSeq = 0;

  function wantedListBankKey(type, itemNo, colorId) {
    return type + ":" + itemNo + ":" + (colorId || 0);
  }

  function updateWantedListBadge() {
    var n = Object.keys(wantedListBank).length;
    wantedListBadge.textContent = String(n);
    wantedListBadge.classList.toggle("hidden", n === 0);
  }

  // sourceLabel identifies which set/fig lookup this came from (e.g.
  // "75192-1 Millennium Falcon") — carried onto the bank entry so a part
  // pulled in from several different lots still makes sense out of
  // context on the Wanted List page, same reasoning as the per-lookup
  // XML export's REMARKS field.
  function addToWantedListBank(entry, sourceLabel) {
    var key = wantedListBankKey(entry.type, entry.itemNo, entry.colorId || 0);
    var existing = wantedListBank[key];
    if (existing) {
      existing.quantity += entry.quantity;
      if (sourceLabel && existing.sources.indexOf(sourceLabel) === -1) existing.sources.push(sourceLabel);
    } else {
      wantedListBank[key] = {
        type: entry.type, itemNo: entry.itemNo, colorId: entry.colorId || 0,
        name: entry.name || "", quantity: entry.quantity,
        sources: sourceLabel ? [sourceLabel] : [],
      };
    }
    updateWantedListBadge();
    pushWantedBankState();
  }

  // Full removal — used by the Wanted List page's own Remove button,
  // where each row already represents one whole bank line, so deleting
  // it outright is unambiguous.
  function removeFromWantedListBank(key) {
    delete wantedListBank[key];
    updateWantedListBadge();
    pushWantedBankState();
  }

  // Partial removal — undoes exactly one Set/Fig Lookup row's own
  // contribution (its quantity and source label) rather than wiping the
  // whole bank line, since the same item/color can be fed in by more
  // than one row (the same part missing from two different lookups) and
  // un-adding one shouldn't erase what the other contributed.
  function removeRowFromWantedListBank(entry, sourceLabel) {
    var key = wantedListBankKey(entry.type, entry.itemNo, entry.colorId || 0);
    var existing = wantedListBank[key];
    if (!existing) return;
    existing.quantity -= entry.quantity;
    var idx = existing.sources.indexOf(sourceLabel);
    if (idx !== -1) existing.sources.splice(idx, 1);
    if (existing.quantity <= 0 || !existing.sources.length) {
      delete wantedListBank[key];
    }
    updateWantedListBadge();
    pushWantedBankState();
  }

  function wantedListBankEntries() {
    return Object.keys(wantedListBank).map(function (k) { return { key: k, entry: wantedListBank[k] }; });
  }

  // Durability, same story and same backend as picks/order-actions (see
  // pushRemoteState/syncStateFromRemote above): reuses /api/pick-state's
  // Blobs store under a third key ("wantedListBank") rather than standing
  // up a whole separate endpoint for one more small JSON blob. No
  // localStorage mirror here (unlike picks) — this one follows the
  // simpler order-actions precedent of remote-plus-in-memory-only, which
  // is already what makes driveThruSent/feedbackSent survive a reload.
  // Best-effort: a failed push just means the next successful one (the
  // very next mutation, typically) catches it up.
  function pushWantedBankState() {
    postJSON("/api/pick-state?key=wantedListBank", wantedListBank).catch(function () { /* offline — ignore */ });
  }

  // Union by key, same "never lose progress" philosophy as mergeStates
  // above — an item counts as still wanted if either side has it. Two
  // conflicting quantities (this device edited one qty field while
  // another sync was still pending) take the larger one rather than
  // picking a side outright, so a stale remote value can't quietly
  // undercut a quantity Ryan just raised; sources from both sides are
  // combined so the "From:" line never drops a lot it was really pulled
  // in from.
  function mergeWantedBankEntries(a, b) {
    var keys = {};
    Object.keys(a || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(b || {}).forEach(function (k) { keys[k] = true; });
    var merged = {};
    Object.keys(keys).forEach(function (k) {
      var ea = a && a[k], eb = b && b[k];
      if (ea && eb) {
        var sources = (ea.sources || []).slice();
        (eb.sources || []).forEach(function (s) { if (sources.indexOf(s) === -1) sources.push(s); });
        merged[k] = {
          type: ea.type, itemNo: ea.itemNo, colorId: ea.colorId,
          name: ea.name || eb.name || "",
          quantity: Math.max(ea.quantity, eb.quantity),
          sources: sources,
        };
      } else {
        merged[k] = ea || eb;
      }
    });
    return merged;
  }

  // Pulled once on app start (see startApp), same point pick-state and
  // order-actions sync — reconciles whatever's survived in memory this
  // session (normally nothing, on a fresh launch) against the durable
  // remote copy, so jumping out of the app and back in later doesn't
  // reset the bank back to empty.
  var wantedBankSyncPromise = null;
  function syncWantedBankFromRemote() {
    wantedBankSyncPromise = fetchJSON("/api/pick-state?key=wantedListBank")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var merged = mergeWantedBankEntries(wantedListBank, remote);
          var remoteNeedsUpdate = JSON.stringify(merged) !== JSON.stringify(remote);
          wantedListBank = merged;
          updateWantedListBadge();
          if (remoteNeedsUpdate) pushWantedBankState();
          if (currentView === "wanted-list") renderWantedListView();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return wantedBankSyncPromise;
  }

  // Combining lists from elsewhere — a BrickScan CSV export (same
  // ITEMTYPE/ITEMID/COLOR/ITEMNAME/QTY columns csvObjToInventoryRow
  // already parses for Add Inventory, just read as "how many wanted"
  // instead of "how many owned") or a wanted-list XML (the same shape
  // buildWantedListBankXml below exports, so a file Ryan exported from
  // here earlier, or from BrickScan/BrickStock's own wanted-list export,
  // comes back in the same way). Both funnel into addToWantedListBank
  // exactly like a Set/Fig Lookup "+ Add to wanted list" tap would,
  // merging with whatever's already in the bank rather than replacing it.
  function csvObjToWantedListEntry(obj) {
    var itemNo = (obj.ITEMID || "").trim();
    if (!itemNo) return null;
    return {
      type: inventoryTypeWord(obj.ITEMTYPE),
      itemNo: itemNo,
      colorId: parseInt(obj.COLOR, 10) || 0,
      name: decodeHtmlEntities(obj.ITEMNAME || ""),
      quantity: parseInt(obj.QTY, 10) || 1,
    };
  }

  function parseWantedListCsv(text) {
    return csvTextToObjects(text)
      .map(csvObjToWantedListEntry)
      .filter(function (e) { return e !== null; });
  }

  // MINQTY is the wanted-list field (what buildWantedListBankXml writes);
  // QTY is tolerated too in case a plain inventory-style XML gets dropped
  // in here instead. No ITEMNAME in this format, so imported rows start
  // with a blank name — same as any row would until BrickLink enriches it;
  // item number/color/thumbnail still identify it fine on its own.
  function parseWantedListXml(text) {
    var doc = new DOMParser().parseFromString(text, "text/xml");
    if (doc.querySelector("parsererror")) return [];
    var entries = [];
    doc.querySelectorAll("ITEM").forEach(function (item) {
      var itemIdEl = item.querySelector("ITEMID");
      var itemNo = itemIdEl ? itemIdEl.textContent.trim() : "";
      if (!itemNo) return;
      var typeEl = item.querySelector("ITEMTYPE");
      var colorEl = item.querySelector("COLOR");
      var qtyEl = item.querySelector("MINQTY") || item.querySelector("QTY");
      entries.push({
        type: inventoryTypeWord(typeEl ? typeEl.textContent : ""),
        itemNo: itemNo,
        colorId: colorEl ? (parseInt(colorEl.textContent, 10) || 0) : 0,
        name: "",
        quantity: qtyEl ? (parseInt(qtyEl.textContent, 10) || 1) : 1,
      });
    });
    return entries;
  }

  // Sniffs by extension first, content second (a renamed or extension-
  // less file still parses as whichever it actually is) — same forgiving
  // approach as csvTextToObjects not caring what the file was called.
  function handleWantedBankImportFile(file, colorsMap) {
    file.text().then(function (text) {
      var isXml = /\.xml$/i.test(file.name) || /^\s*</.test(text);
      var entries = isXml ? parseWantedListXml(text) : parseWantedListCsv(text);
      if (!entries.length) {
        wantedBankImportError = "Couldn’t find any items in “" + file.name + "” — check it’s a BrickScan CSV export or a wanted-list XML file.";
        renderWantedListResults(colorsMap);
        return;
      }
      // No sourceLabel here (unlike a Set/Fig Lookup add) — every BrickScan
      // export shares the same file name, so "Imported: <name>" told
      // nothing a plain list of items didn't already say.
      entries.forEach(function (e) { addToWantedListBank(e); });
      wantedBankImportError = null;
      renderWantedListResults(colorsMap);
    }).catch(function (err) {
      wantedBankImportError = "Couldn’t read “" + file.name + "”: " + err.message;
      renderWantedListResults(colorsMap);
    });
  }

  // Friendly labels for a manual quick-add's Type select — shared by the
  // Wanted List's and Add Inventory's own add-by-number forms (same words
  // INVENTORY_TYPE_CODE_TO_WORD already maps BrickScan's single-letter
  // codes to, just Title Cased for display; Part/Minifig/Set first since
  // those are what Ryan's actually typing in here day to day).
  var MANUAL_ADD_TYPE_OPTIONS = [
    ["PART", "Part"], ["MINIFIG", "Minifig"], ["SET", "Set"], ["BOOK", "Book"],
    ["GEAR", "Gear"], ["CATALOG", "Catalog"], ["INSTRUCTION", "Instructions"],
    ["ORIGINAL_BOX", "Original Box"], ["UNSORTED_LOT", "Unsorted Lot"],
  ];

  // A letter-led item number is reliably a minifig on BrickLink (sw0359,
  // col001, njo123, ...) — confirmed against every minifig number seen in
  // this codebase's real fixtures, none of them bare digits. A purely
  // numeric number is ambiguous on its own (a Part and a Set both look
  // like "3001"/"75192" — and Ryan doesn't bother typing BrickLink's own
  // "-1" set-number suffix, so that can't be used as a tiebreaker either),
  // so callers supply fallbackType for that case based on what's actually
  // likely in their own context (Add Inventory/Wanted List default to
  // "PART", Set/Fig Lookup — which only ever deals in Sets and Minifigs,
  // no Parts — defaults to "SET"). Shared by all three forms' add-by-
  // number flows so a fig number doesn't quietly get searched as a part
  // (or a set searched as a minifig) just because nobody told it which
  // type it was.
  function guessManualAddType(no, fallbackType) {
    return /^[A-Za-z]/.test((no || "").trim()) ? "MINIFIG" : fallbackType;
  }

  // Color names, not IDs, in a manual add-by-number form — Ryan doesn't
  // have BrickLink's numeric color IDs memorized, but he does know "Dark
  // Bluish Gray" when he sees it. "No color" (id 0) always leads the list
  // for parts/sets that aren't colored; real colors are sorted
  // alphabetically after it. isRealColorName filters out colorsMap's own
  // placeholder entry (id 0, "Not Applicable") so it isn't listed twice.
  // Shared by the Wanted List's and Add Inventory's own add-by-number forms.
  function manualAddColorOptionsHtml(colorsMap, selectedColorId) {
    var entries = Object.keys(colorsMap || {})
      .map(function (id) { return { id: parseInt(id, 10), name: colorsMap[id] }; })
      .filter(function (c) { return isRealColorName(c.name); })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
    var options = '<option value="0"' + (!selectedColorId ? ' selected' : '') + '>No color</option>';
    options += entries.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === selectedColorId ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
    }).join("");
    return options;
  }

  // Quick add-by-number, for a part Ryan already knows he needs rather
  // than one surfaced by a Set/Fig Lookup — just an item-number field and
  // an Add button until that's filled in, then expands (via
  // wantedManualDraft) to ask for type/color/qty before it actually lands
  // in the bank, since a bare item number alone isn't enough to place a
  // real BrickLink order with.
  function wantedManualAddHtml(colorsMap) {
    var draft = wantedManualDraft;
    var html = '<div class="wanted-manual-add">'
      + '<div class="wanted-manual-itemno-row">'
      + '<input type="text" class="wanted-manual-itemno-input" id="wantedManualItemNoInput" placeholder="Add a part/set/fig by number" value="' + escapeHtml(draft ? draft.itemNo : "") + '">'
      + '<button type="button" class="reset-btn" id="wantedManualAddBtn">Add</button>'
      + '</div>';
    if (draft) {
      // Read-only — not a field Ryan fills in, just the looked-up catalog
      // name shown back so he can see what's about to be added (same text
      // that'll appear as the row's own .item-name once confirmed). While
      // it's resolving, Confirm is disabled rather than letting the add go
      // through with a name that hasn't loaded yet.
      var namePreviewText = draft.nameLoading ? "Looking up name…" : (draft.name || "Name not found — will add without one");
      html += '<div class="inventory-fields wanted-manual-fields">'
        + '<div class="inventory-field"><label>Type</label><select id="wantedManualTypeSelect">'
        + MANUAL_ADD_TYPE_OPTIONS.map(function (opt) {
            return '<option value="' + opt[0] + '"' + (draft.type === opt[0] ? ' selected' : '') + '>' + opt[1] + '</option>';
          }).join("")
        + '</select></div>'
        + '<div class="inventory-field"><label>Color</label><select id="wantedManualColorInput">' + manualAddColorOptionsHtml(colorsMap, draft.colorId) + '</select></div>'
        + '<div class="inventory-field"><label>Qty</label><input type="number" min="1" id="wantedManualQtyInput" value="' + draft.quantity + '"></div>'
        + '</div>'
        + '<div class="item-name wanted-manual-name-preview">' + escapeHtml(namePreviewText) + '</div>'
        + '<div class="wanted-manual-actions">'
        + '<button type="button" class="reset-btn" id="wantedManualConfirmBtn"' + (draft.nameLoading ? ' disabled' : '') + '>+ Add to wanted list</button>'
        + '<button type="button" class="reset-btn" id="wantedManualCancelBtn">Cancel</button>'
        + '</div>';
    }
    return html + '</div>';
  }

  // Shared by both the empty and populated Wanted List states — importing
  // (and now the manual add-by-number form below it) is how a list can
  // start in the first place, not just something to do once it already
  // has Set/Fig Lookup entries in it.
  function wantedBankImportHtml(colorsMap) {
    return '<div class="inventory-upload wanted-bank-import">'
      + '<div class="inventory-intro">Combine another list in: import a BrickScan CSV export or a wanted-list XML file and it merges into the list below.</div>'
      + '<input type="file" accept=".csv,.xml,text/csv,text/xml" class="inventory-file-input" id="wantedBankImportInput">'
      + '</div>'
      + (wantedBankImportError ? '<div class="state-block error">' + escapeHtml(wantedBankImportError) + '</div>' : '')
      + wantedManualAddHtml(colorsMap);
  }

  function wireWantedBankImport(colorsMap) {
    var importInput = document.getElementById("wantedBankImportInput");
    if (importInput) {
      importInput.addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        handleWantedBankImportFile(file, colorsMap);
        e.target.value = ""; // lets the same filename be picked again later
      });
    }

    // Looks up a typed-in item's catalog name (same Get Item BrickLink
    // call item-subsets.js already makes for a set/fig's own header card)
    // so a manually-added row ends up looking like any other row instead
    // of sitting there with a blank name. Guarded by wantedManualLookupSeq
    // so a slow response for an item number Ryan's since changed or typed
    // over doesn't clobber what's current. A miss (typo, or a real
    // BrickLink 404) just leaves the name blank — it's never a reason the
    // item can't still be added. Confirm is disabled while this is in
    // flight (see wantedManualAddHtml), so the entry's name is always
    // whatever's settled here, never a half-loaded value.
    function lookupManualItemName(itemNo, type) {
      var requestId = ++wantedManualLookupSeq;
      if (wantedManualDraft) {
        wantedManualDraft.nameLoading = true;
        renderWantedListResults(colorsMap);
      }
      fetchJSON("/api/item-lookup?type=" + encodeURIComponent(type) + "&no=" + encodeURIComponent(itemNo))
        .then(function (data) {
          if (requestId !== wantedManualLookupSeq || !wantedManualDraft) return;
          wantedManualDraft.name = (data && data.item && data.item.name) || "";
          wantedManualDraft.nameLoading = false;
          renderWantedListResults(colorsMap);
        })
        .catch(function () {
          if (requestId !== wantedManualLookupSeq || !wantedManualDraft) return;
          wantedManualDraft.nameLoading = false;
          renderWantedListResults(colorsMap);
        });
    }

    var manualItemNoInput = document.getElementById("wantedManualItemNoInput");
    var manualAddBtn = document.getElementById("wantedManualAddBtn");
    if (manualItemNoInput && manualAddBtn) {
      // Reads whatever's currently in the expanded fields (if they're
      // showing) rather than always resetting to defaults, so re-tapping
      // Add to fix a typo in the item number doesn't also wipe out a
      // color/qty already filled in. Only re-triggers the name lookup when
      // the item number or type actually changed, so fixing a qty typo
      // doesn't re-fire it pointlessly.
      var startOrSyncManualDraft = function () {
        var itemNo = manualItemNoInput.value.trim();
        if (!itemNo) return;
        var typeSelect = document.getElementById("wantedManualTypeSelect");
        var colorInput = document.getElementById("wantedManualColorInput");
        var qtyInput = document.getElementById("wantedManualQtyInput");
        var prevItemNo = wantedManualDraft && wantedManualDraft.itemNo;
        var prevType = wantedManualDraft && wantedManualDraft.type;
        var type = typeSelect ? typeSelect.value : (prevType || guessManualAddType(itemNo, "PART"));
        wantedManualDraft = {
          itemNo: itemNo,
          type: type,
          colorId: colorInput ? (parseInt(colorInput.value, 10) || 0) : ((wantedManualDraft && wantedManualDraft.colorId) || 0),
          quantity: qtyInput ? Math.max(1, parseInt(qtyInput.value, 10) || 1) : ((wantedManualDraft && wantedManualDraft.quantity) || 1),
          name: (wantedManualDraft && wantedManualDraft.name) || "",
        };
        renderWantedListResults(colorsMap);
        if (itemNo !== prevItemNo || type !== prevType) lookupManualItemName(itemNo, type);
      };
      manualAddBtn.addEventListener("click", startOrSyncManualDraft);
      manualItemNoInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); startOrSyncManualDraft(); }
      });
    }

    var manualTypeSelect = document.getElementById("wantedManualTypeSelect");
    if (manualTypeSelect) {
      // Re-looks-up on a type change too (same item number can be a PART
      // in one type and genuinely not exist as a SET, or vice versa) —
      // without this, picking the right type after Add already fired the
      // first lookup would leave a stale or blank name sitting there.
      manualTypeSelect.addEventListener("change", function () {
        if (!wantedManualDraft) return;
        wantedManualDraft.type = manualTypeSelect.value;
        lookupManualItemName(wantedManualDraft.itemNo, wantedManualDraft.type);
      });
    }

    var manualConfirmBtn = document.getElementById("wantedManualConfirmBtn");
    if (manualConfirmBtn) {
      manualConfirmBtn.addEventListener("click", function () {
        // Belt-and-suspenders against the button's own disabled state —
        // never add with a name lookup still in flight, since that's
        // exactly the half-loaded value this button being disabled while
        // loading is meant to prevent.
        if (!wantedManualDraft || wantedManualDraft.nameLoading) return;
        var itemNo = document.getElementById("wantedManualItemNoInput").value.trim();
        if (!itemNo) return;
        var typeSelect = document.getElementById("wantedManualTypeSelect");
        var colorInput = document.getElementById("wantedManualColorInput");
        var qtyInput = document.getElementById("wantedManualQtyInput");
        // No sourceLabel — a manual add has no "lot" it came from, same
        // reasoning as dropping the imported-file label above.
        addToWantedListBank({
          type: typeSelect.value,
          itemNo: itemNo,
          colorId: parseInt(colorInput.value, 10) || 0,
          name: wantedManualDraft.name || "",
          quantity: Math.max(1, parseInt(qtyInput.value, 10) || 1),
        });
        wantedManualDraft = null;
        renderWantedListResults(colorsMap);
      });
    }

    var manualCancelBtn = document.getElementById("wantedManualCancelBtn");
    if (manualCancelBtn) {
      manualCancelBtn.addEventListener("click", function () {
        wantedManualDraft = null;
        renderWantedListResults(colorsMap);
      });
    }
  }

  // A source label logged before CSV/XML imports (and manual adds) stopped
  // attaching one — see handleWantedBankImportFile and the manual add
  // confirm handler above, both of which used to stamp "Imported:
  // <filename>" on every row (every BrickScan export shares the same file
  // name, so it was pure noise). Entries added back then can still carry
  // that label in their stored sources array; filtering it out here at
  // display/export time (rather than needing a one-time migration of
  // whatever's already saved) keeps both the Wanted List page and the
  // exported/emailed XML's REMARKS free of it, while still showing a real
  // Set/Fig Lookup source label (a set/minifig name — genuinely useful)
  // exactly as before.
  function realSources(entry) {
    return (entry.sources || []).filter(function (s) { return !/^Imported:/.test(s); });
  }

  // BrickLink's classic Wanted List XML import format — same ITEMTYPE
  // single-letter codes as the BrickScan inventory-upload format already
  // parsed elsewhere in this file (INVENTORY_TYPE_WORD_TO_CODE). REMARKS
  // joins every source lot an item was pulled in from, since a bank line
  // can merge the same part from several different lookups.
  function buildWantedListBankXml() {
    var items = wantedListBankEntries().map(function (r) {
      var e = r.entry;
      var typeCode = INVENTORY_TYPE_WORD_TO_CODE[e.type] || "P";
      var remarks = realSources(e).join(", ");
      return '<ITEM>'
        + '<ITEMTYPE>' + typeCode + '</ITEMTYPE>'
        + '<ITEMID>' + escapeHtml(e.itemNo) + '</ITEMID>'
        + (e.colorId ? '<COLOR>' + e.colorId + '</COLOR>' : '')
        + '<MINQTY>' + e.quantity + '</MINQTY>'
        + '<CONDITION>N</CONDITION>'
        + (remarks ? '<REMARKS>' + escapeHtml(remarks) + '</REMARKS>' : '')
        + '<NOTIFY>Y</NOTIFY>'
        + '</ITEM>';
    }).join("\n");
    return '<INVENTORY>\n' + items + '\n</INVENTORY>\n';
  }

  function downloadWantedListBankXml() {
    var xml = buildWantedListBankXml();
    var blob = new Blob([xml], { type: "text/xml" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "wanted-list-" + new Date().toISOString().slice(0, 10) + ".xml";
    link.target = "_blank";
    link.rel = "noopener";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  // mailto: rather than a real backend send — no email API/secrets to set
  // up, and it covers what was actually asked for: the body is the same
  // XML Export downloads, and BrickLink's own Wanted List upload page
  // takes pasted XML text as an alternative to a file, so the email body
  // can be copied straight into it. The one real tradeoff is mailto's
  // practical body-length ceiling (varies by mail client, roughly a few
  // thousand characters) — fine for a sitting's worth of lots, but a very
  // long list is more reliably sent via Export XML instead.
  function wantedListBankEmailHref() {
    var xml = buildWantedListBankXml();
    var subject = "BrickLink Wanted List - " + new Date().toLocaleDateString();
    return "mailto:thabrickstud@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + mailtoBody(xml);
  }

  function wantedListBankRowHtml(key, entry, colorsMap) {
    var pseudoItem = { type: entry.type, itemNo: entry.itemNo, colorId: entry.colorId, newOrUsed: "N" };
    var colorName = entry.colorId ? (colorsMap[entry.colorId] || null) : null;
    var sources = realSources(entry);
    return '<div class="item-row wanted-bank-row">'
      + '<div class="item-thumb">' + thumbHtml(pseudoItem) + '<span class="qty-chip">' + entry.quantity + '</span></div>'
      + '<div class="item-body">'
      + '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(entry.itemNo) + '</span>'
      + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(entry.type) + '</span></span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(entry.name || "") + '</div>'
      + (isRealColorName(colorName) ? '<div class="item-color">' + escapeHtml(colorName) + '</div>' : '')
      + (sources.length ? '<div class="item-color">From: ' + escapeHtml(sources.join(", ")) + '</div>' : '')
      + '<label class="wanted-bank-qty-field"><span>Qty</span><input type="number" class="wanted-bank-qty-input" data-key="' + escapeHtml(key) + '" min="1" value="' + entry.quantity + '"></label>'
      + '</div>'
      + '<div class="inventory-row-actions">'
      + '<button type="button" class="delete-row-btn" data-key="' + escapeHtml(key) + '">Remove</button>'
      + '</div>'
      + '</div>';
  }

  function renderWantedListResults(colorsMap) {
    var rows = wantedListBankEntries();
    if (!rows.length) {
      wantedListView.innerHTML = '<div class="set-fig-lookup-intro">Nothing in your wanted list yet. From Set/Fig Lookup, tap “+ Add to wanted list” on anything not in stock — it collects here across as many lookups as you need, so you can place one combined BrickLink order instead of one per set or minifig.</div>'
        + wantedBankImportHtml(colorsMap);
      wireWantedBankImport(colorsMap);
      return;
    }
    var totalQty = rows.reduce(function (sum, r) { return sum + r.entry.quantity; }, 0);
    wantedListView.innerHTML = ''
      + '<div class="set-fig-lookup-intro">Everything added from Set/Fig Lookup — or imported below — across every lot gone through so far. Adjust quantities here if needed, then export or email the combined list to place one order.</div>'
      + wantedBankImportHtml(colorsMap)
      + '<div class="inventory-summary-row"><span>' + rows.length + ' part' + (rows.length === 1 ? '' : 's') + '/figs · ' + totalQty + ' total pieces</span></div>'
      + '<div class="wanted-bank-actions">'
      + '<button type="button" class="reset-btn" id="wantedBankExportBtn">Export wanted list XML</button>'
      + '<a class="reset-btn wanted-bank-email-link" id="wantedBankEmailLink" href="' + escapeHtml(wantedListBankEmailHref()) + '">Email list</a>'
      + '<button type="button" class="reset-btn wanted-bank-clear-btn" id="wantedBankClearBtn">Clear all</button>'
      + '</div>'
      + rows.map(function (r) { return wantedListBankRowHtml(r.key, r.entry, colorsMap); }).join("");

    wireWantedBankImport(colorsMap);
    document.getElementById("wantedBankExportBtn").addEventListener("click", downloadWantedListBankXml);
    document.getElementById("wantedBankClearBtn").addEventListener("click", function () {
      if (!window.confirm("Clear all " + rows.length + " item" + (rows.length === 1 ? "" : "s") + " from your wanted list?")) return;
      wantedListBank = {};
      updateWantedListBadge();
      pushWantedBankState();
      renderWantedListResults(colorsMap);
    });

    wantedListView.querySelectorAll(".delete-row-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        removeFromWantedListBank(el.getAttribute("data-key"));
        renderWantedListResults(colorsMap);
      });
    });
    wantedListView.querySelectorAll(".wanted-bank-qty-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var entry = wantedListBank[el.getAttribute("data-key")];
        if (!entry) return;
        entry.quantity = Math.max(1, parseInt(el.value, 10) || 1);
        pushWantedBankState();
        renderWantedListResults(colorsMap);
      });
    });

    wireThumbLinks(wantedListView);
    sizeThumbsToRows(wantedListView);
  }

  // ---- Sort List ----
  //
  // For triaging acquired lots of sets: per set, enter what you paid, how
  // complete/clean it is, box + manual ratings and which of its minifigs you
  // actually have, and get a rough "what should I do with this" verdict with
  // the cost-benefit math behind it. Three routes are compared per set:
  //   - Sell as set: the set's sold-price value, adjusted for completeness,
  //     quality and box/manual, buying whatever minifigs are missing — unless
  //     they'd cost more than the skip-threshold share of the set's value, in
  //     which case it's sold without them.
  //   - Part out: the figs you have sold individually (never worth less
  //     than their weight at the fig-parts $/lb), plus the leftover non-fig
  //     weight to bulk — mostly general parts, with a per-fig allowance of
  //     loose accessories priced at the fig-parts $/lb.
  // Each set also carries a Decision (sell as set / part out), which the
  // lists at the bottom of the page are built from.
  // Everything adjustable lives in sortSettings. Selling fees and time spent
  // are deliberately not modeled — fees apply to every route, and this is a
  // hobby where time is Ryan's own call.
  //
  // "Completeness" here means the pieces other than minifigs — figs are
  // tracked separately, one by one.

  var SORT_DEFAULTS = {
    genRate: 7.34,          // $/lb, general parts
    figRate: 369.83,        // $/lb, fig parts
    accessoryG: 4,          // g of loose fig accessories (hair, hats, tools…) per fig in the set, in the leftover
    skipPct: 35,            // missing figs costing more than this % of the set's value aren't bought
    boxPremiumPct: 15,      // value added by a perfect (10/10) box
    manualPremiumPct: 5,    // value added by a perfect (10/10) manual
    qualityFloorPct: 60,    // share of value kept by a 0/10-quality set
    condGood: 100,          // % of a fig's market value by condition
    condFair: 80,
    condPoor: 60,
    demandWeightPct: 20,    // how far demand can tip a route's value: ±this % at the extremes (0 = ignore demand)
  };
  var SORT_SETTING_FIELDS = [
    { key: "genRate", label: "General parts", suffix: "$/lb", step: "0.01" },
    { key: "figRate", label: "Fig parts", suffix: "$/lb", step: "0.01" },
    { key: "accessoryG", label: "Loose accessories per fig", suffix: "g", step: "0.1" },
    { key: "skipPct", label: "Don't buy missing figs above", suffix: "% of set value", step: "1" },
    { key: "boxPremiumPct", label: "Box premium at 10/10", suffix: "%", step: "1" },
    { key: "manualPremiumPct", label: "Manual premium at 10/10", suffix: "%", step: "1" },
    { key: "qualityFloorPct", label: "Value kept at quality 0", suffix: "%", step: "1" },
    { key: "condGood", label: "Fig worth, Good", suffix: "%", step: "1" },
    { key: "condFair", label: "Fig worth, Fair", suffix: "%", step: "1" },
    { key: "condPoor", label: "Fig worth, Poor", suffix: "%", step: "1" },
    { key: "demandWeightPct", label: "Demand tips the pick by up to", suffix: "% of a route’s value", step: "1" },
  ];
  var SORT_RANKS = [
    { key: "newest", label: "Newest first" },

    { key: "profit", label: "Profit" },
    { key: "value", label: "Total value" },

  // What Ryan has settled on for a set — the lists at the bottom of the page

  var SORT_DECISIONS = [
    { key: "", label: "Decision…" },
    { key: "set", label: "Sell as set" },
    { key: "part", label: "Part out" },
    { key: "hold", label: "Save for later" },

  var GRAMS_PER_LB = 453.592;
  // Ryan's two-letter theme codes, as used in his spreadsheet (code → the

  var SORT_THEMES = [
    ["DS", "Adventure Desert"],

  var SORT_FALLBACK_THEME = "GE";
  // First match wins, tested against a set's whole BrickLink category path
  // ("star wars > episode iv"). Best guesses from BrickLink's category
  // names — wrong ones are just edited on the card.
  var SORT_THEME_RULES = [
    ["star wars", "SW"], ["harry potter", "HP"], ["ninjago", "NJ"], ["marvel", "MV"],
    ["pirates", "PI"], ["time cruisers", "TC"], ["aquazone", "SE"],

  var SORT_CITY_RULES = [

    ["harbor", "CS"], ["coast guard", "CS"], ["train", "CT"], ["railway", "CT"],
    ["vehicle", "CV"], ["emergency", "CE"], ["hospital", "CE"], ["rescue", "CE"],
