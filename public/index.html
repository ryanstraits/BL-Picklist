<script>
(function () {
  var STORAGE_KEY = "picklist:picked-v1";
  var COLORS_CACHE_KEY = "picklist:colors-v1";
  var CATEGORIES_CACHE_KEY = "picklist:categories-v1";
  var state = {};
  var orders = [];
  var itemsCache = {};
  var messagesCache = {};
  var contactCache = {};
  // orderId -> {rating, comment, dateRated} | null. Populated once per
  // non-cached order-detail load (same lifecycle as messagesCache/
  // contactCache — reused on a cached revisit, cleared on forceReload),
  // from the same status-check call that already reconciles Drive
  // Thru/feedback-sent state on open.
  var buyerFeedbackCache = {};
  var ratingsCache = {};
  var driveThruSent = {};
  var feedbackSent = {};
  // orderId -> {rating, comment, dateRated} | undefined. A live mirror of
  // BrickLink's own feedback data (via /api/feedback-list), refreshed on
  // every orders-list load — never locally authored, so unlike
  // feedbackSent/driveThruSent it doesn't go through the durable
  // pick-state actions sync.
  var feedbackReceived = {};
  var pickupScheduled = {};
  // orderId -> "large" | "medium" | "small" | "mailer". Manual for now —
  // Ryan records which box/mailer he actually used per order so this
  // becomes a real dataset (cross-referenced against each order's
  // pieces/weight/value) to eventually replace with an automatic
  // suggestion.
  var boxChoice = {};
  // orderId -> true | false | undefined. Whether Ryan's logged an order in
  // his own bookkeeping spreadsheet, tracked here so Order Lookup can flag
  // whichever old orders he hasn't gotten to yet. undefined (never
  // explicitly touched) falls back to isOrderLogged()'s threshold default
  // below rather than meaning "not logged" outright — that's what lets an
  // explicit false override that default for one particular older order
  // without every other untouched order older than it silently flipping
  // too.
  var spreadsheetLogged = {};
  // Every order at or before this id was already logged in Ryan's
  // spreadsheet before this feature existed — pre-checked so backfilling
  // is "uncheck the exceptions" rather than "check thousands of orders."
  var SPREADSHEET_LOGGED_THRESHOLD = 3256335;
  function isOrderLogged(orderId) {
    var explicit = spreadsheetLogged[orderId];
    if (explicit !== undefined) return !!explicit;
    var n = parseInt(orderId, 10);
    return !isNaN(n) && n <= SPREADSHEET_LOGGED_THRESHOLD;
  }
  var colorsMap = null;
  var categoriesById = null; // categoryId -> { name, parentId }

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : {};
    } catch (e) {
      state = {};
    }
  }

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable locally — the remote push below is what
         actually matters for durability (see pushRemoteState). */
    }
    pushRemoteState();
  }

  // localStorage is just a fast, offline-capable cache; /api/pick-state
  // (a Netlify Blobs store) is the durable source of truth. iOS can and
  // does evict localStorage for a home-screen web app between launches —
  // this is what actually survives a force-quit. Best-effort: on failure
  // (offline, etc.) the local write above still stands for this session,
  // and the next successful sync catches things up.
  function pushRemoteState() {
    postJSON("/api/pick-state", state).catch(function () { /* offline — ignore */ });
  }

  // Combines local and remote pick state per order by union (an item
  // counts as picked if either side has it picked). Never a blind
  // overwrite: the very first sync after this feature ships hits an empty
  // remote store, and overwriting local with that would wipe out
  // whatever's already been picked. A "Clear picks"/"Select all" is a
  // deliberate full replace of one order's picks and pushes immediately,
  // so it isn't undone by this — it only reconciles two states that both
  // grew from the same starting point.
  // Merges one key's raw pick value from each side. Naively OR-ing (the
  // original rule, back when every value was a plain boolean) would
  // silently flatten a qty>1 item's in-progress {n,of} counter into a
  // bare `true` the moment it syncs — any object is truthy in JS — which
  // would mark a 2-of-3-tapped lot as fully picked. Whichever side is
  // genuinely complete wins (a legacy `true` counts as complete); short
  // of that, the greater tap count wins, same "never lose progress"
  // philosophy as the original union, just aware of partial progress now.
  function mergePickValue(v1, v2) {
    var aFull = isRawPickFull(v1), bFull = isRawPickFull(v2);
    if (aFull || bFull) {
      if (v1 && typeof v1 === "object" && v1.n >= v1.of) return v1;
      if (v2 && typeof v2 === "object" && v2.n >= v2.of) return v2;
      return true;
    }
    var aObj = v1 && typeof v1 === "object";
    var bObj = v2 && typeof v2 === "object";
    if (aObj && bObj) return { n: Math.max(v1.n, v2.n), of: v1.of };
    if (aObj) return v1;
    if (bObj) return v2;
    return false;
  }

  function mergeStates(a, b) {
    var orderIds = {};
    Object.keys(a || {}).forEach(function (id) { orderIds[id] = true; });
    Object.keys(b || {}).forEach(function (id) { orderIds[id] = true; });

    var merged = {};
    Object.keys(orderIds).forEach(function (orderId) {
      var picksA = (a && a[orderId]) || {};
      var picksB = (b && b[orderId]) || {};
      var keys = {};
      Object.keys(picksA).forEach(function (k) { keys[k] = true; });
      Object.keys(picksB).forEach(function (k) { keys[k] = true; });
      var picks = {};
      Object.keys(keys).forEach(function (k) {
        var combined = mergePickValue(picksA[k], picksB[k]);
        if (combined) picks[k] = combined;
      });
      merged[orderId] = picks;
    });
    return merged;
  }

  // Resolves once the latest remote state has been pulled in and merged
  // (or the attempt has failed and local state is being kept as-is).
  // Callers that need up-to-date picks before rendering (opening an
  // order) await this.
  var remoteSyncPromise = null;
  function syncStateFromRemote() {
    remoteSyncPromise = fetchJSON("/api/pick-state")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var merged = mergeStates(state, remote);
          // Compare against what the REMOTE has, not what local had a
          // moment ago — that's the real question here. Comparing to the
          // old local value missed the exact case that mattered: remote
          // has nothing (e.g. it was crashing until just now) and local
          // already has everything, so the merge doesn't change local at
          // all but the remote still desperately needs that push.
          var remoteNeedsUpdate = JSON.stringify(merged) !== JSON.stringify(remote);
          state = merged;
          try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          if (remoteNeedsUpdate) pushRemoteState();
          if (currentView === "orders") renderOrdersList();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return remoteSyncPromise;
  }

  // Same durability story as picks, for "Send Drive Thru" / "Leave
  // feedback" — these used to just live in memory for the current page
  // load, so a reload showed the button/form again even though BrickLink
  // already had the action on record. Reuses /api/pick-state's Blobs
  // store under a second key ("actions") since it's the same small
  // per-order boolean-map shape, just two maps instead of one.
  function mergeActionMap(a, b) {
    var merged = {};
    Object.keys(a || {}).forEach(function (k) { if (a[k]) merged[k] = true; });
    Object.keys(b || {}).forEach(function (k) { if (b[k]) merged[k] = true; });
    return merged;
  }

  // Same idea as mergeActionMap but for a per-order *value* (which box)
  // rather than a plain boolean flag — an OR doesn't mean anything for
  // two different box choices, so this just prefers whichever side
  // actually has a value, local first (a fresh tap on this device is
  // more likely to be the intended one than a stale remote value).
  function mergeChoiceMap(a, b) {
    var merged = {};
    var keys = {};
    Object.keys(a || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(b || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(keys).forEach(function (k) {
      var v = (a && a[k]) || (b && b[k]);
      if (v) merged[k] = v;
    });
    return merged;
  }

  // Tri-state version of mergeActionMap: spreadsheetLogged needs to carry
  // an explicit false (overriding isOrderLogged()'s threshold default for
  // one particular order), which a plain "OR the truthy keys" merge would
  // silently drop — a bare false and an absent key are otherwise
  // indistinguishable once merged. An explicit true from either side wins
  // outright (never lose a real positive to a race), then an explicit
  // false from either side, then the key is simply left out (same as
  // never having been touched, still governed by the threshold default).
  function mergeLoggedMap(a, b) {
    var merged = {};
    var keys = {};
    Object.keys(a || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(b || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(keys).forEach(function (k) {
      var av = a ? a[k] : undefined;
      var bv = b ? b[k] : undefined;
      if (av === true || bv === true) { merged[k] = true; return; }
      if (av === false || bv === false) { merged[k] = false; return; }
    });
    return merged;
  }

  function pushOrderActions() {
    postJSON("/api/pick-state?key=actions", {
      driveThruSent: driveThruSent, feedbackSent: feedbackSent, pickupScheduled: pickupScheduled,
      boxChoice: boxChoice, spreadsheetLogged: spreadsheetLogged,
    })
      .catch(function () { /* offline — ignore, same as picks */ });
  }

  var orderActionsSyncPromise = null;
  function syncOrderActionsFromRemote() {
    orderActionsSyncPromise = fetchJSON("/api/pick-state?key=actions")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var mergedDriveThru = mergeActionMap(driveThruSent, remote.driveThruSent);
          var mergedFeedback = mergeActionMap(feedbackSent, remote.feedbackSent);
          var mergedPickup = mergeActionMap(pickupScheduled, remote.pickupScheduled);
          var mergedBoxChoice = mergeChoiceMap(boxChoice, remote.boxChoice);
          var mergedLogged = mergeLoggedMap(spreadsheetLogged, remote.spreadsheetLogged);
          var remoteNeedsUpdate = JSON.stringify(mergedDriveThru) !== JSON.stringify(remote.driveThruSent || {})
            || JSON.stringify(mergedFeedback) !== JSON.stringify(remote.feedbackSent || {})
            || JSON.stringify(mergedPickup) !== JSON.stringify(remote.pickupScheduled || {})
            || JSON.stringify(mergedBoxChoice) !== JSON.stringify(remote.boxChoice || {})
            || JSON.stringify(mergedLogged) !== JSON.stringify(remote.spreadsheetLogged || {});
          driveThruSent = mergedDriveThru;
          feedbackSent = mergedFeedback;
          pickupScheduled = mergedPickup;
          boxChoice = mergedBoxChoice;
          spreadsheetLogged = mergedLogged;
          if (remoteNeedsUpdate) pushOrderActions();
          if (currentView === "orders") renderOrdersList();
          // Stats' box-choices tally reads boxChoice directly too — needs
          // the same re-render nudge once a remote sync actually changes
          // it, same as the orders list above.
          if (currentView === "stats") renderStatsView();
          // Order Lookup cards show the same logged-badge/yellow-tint
          // treatment, so a remote sync landing while it's open needs the
          // same nudge.
          if (currentView === "order-lookup") renderOrderLookupResults();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return orderActionsSyncPromise;
  }

  // A pick's raw stored value is either the original boolean (true/false
  // — every pick before qty>1 counting existed, and still every qty-1
  // item today), or {n, of} for a qty>1 item being tapped up piece by
  // piece. "Fully picked" needs to understand both shapes; keeping that
  // logic in one place is what stops pickedCountFromState, isPicked, and
  // the sync merge below from quietly disagreeing about what "done"
  // means for a numeric value.
  function isRawPickFull(v) {
    if (v === true) return true;
    if (v && typeof v === "object") return v.n >= v.of;
    return false;
  }

  function isPicked(orderId, key) {
    return isRawPickFull(state[orderId] && state[orderId][key]);
  }

  // For a qty>1 item's own mini progress bar. qty is the fallback target
  // when nothing's been tapped yet (no stored value to read "of" from).
  function pickProgress(orderId, key, qty) {
    var v = state[orderId] && state[orderId][key];
    if (v === true) return { n: qty, of: qty };
    if (v && typeof v === "object") return { n: v.n, of: v.of };
    return { n: 0, of: qty };
  }

  // Picked count straight from saved state, with no dependency on that
  // order's items being fetched. The orders list needs this: itemsCache
  // only has an order's items once you've opened it in this session, so
  // relying on it there made every card read "0 picked" right after a
  // fresh launch — even though the real picks were sitting in state the
  // whole time (confirmed correct once you opened the order itself).
  function pickedCountFromState(orderId) {
    var picks = state[orderId];
    if (!picks) return 0;
    var n = 0;
    Object.keys(picks).forEach(function (k) { if (isRawPickFull(picks[k])) n++; });
    return n;
  }

  // qty<=1 items keep the original single-tap toggle exactly as before.
  // qty>1 items count taps instead — one tap per physical piece, the way
  // Ryan actually wants to verify a multi-piece lot: tapping increments
  // a per-lot counter, wrapping back to 0 once it reaches qty (a
  // deliberate "start the count over" rather than picking past the end).
  function togglePicked(orderId, key, qty) {
    if (!state[orderId]) state[orderId] = {};
    if (qty > 1) {
      var current = state[orderId][key];
      var n = current === true ? qty : (current && typeof current === "object" ? current.n : 0);
      n = (n >= qty) ? 0 : n + 1;
      state[orderId][key] = { n: n, of: qty };
    } else {
      state[orderId][key] = !state[orderId][key];
    }
    saveState();
  }

  function resetOrder(orderId) {
    state[orderId] = {};
    saveState();
  }

  function selectAllOrder(orderId, items) {
    var picks = {};
    computeItemKeys(items).forEach(function (key) { picks[key] = true; });
    state[orderId] = picks;
    saveState();
  }

  function pickedCount(orderId, items) {
    var keys = computeItemKeys(items);
    var n = 0;
    for (var i = 0; i < keys.length; i++) {
      if (isPicked(orderId, keys[i])) n++;
    }
    return n;
  }

  // Updates the in-page "X of Y lots picked" line and the sticky header
  // progress bar directly, without touching any other DOM — called after
  // every single pick toggle, so it has to stay cheap and can't re-render
  // the item list (see the item-row click handler in renderOrderDetail).
  function updatePickedProgress(order, items) {
    var picked = pickedCount(order.orderId, items);
    var total = items.length;
    var allDone = total > 0 && picked === total;
    var pct = total > 0 ? Math.round((picked / total) * 100) : 0;

    var inlineCount = document.getElementById("pickedCountText");
    if (inlineCount) {
      inlineCount.innerHTML = "<strong>" + picked + " of " + total + "</strong> lots picked" + (allDone ? " — ready to pack" : "");
    }

    topbarProgressFill.style.width = pct + "%";
    topbarProgressFill.classList.toggle("done", allDone);
    topbarProgressLabel.textContent = picked + "/" + total;
  }

  // Keys a pick by the item's content (number + color + condition) rather
  // than its position in the list, so picks survive BrickLink returning an
  // order's items in a different sequence on a later fetch (which is what
  // happens every time the app is reopened, since the in-memory items
  // cache doesn't survive a reload). The trailing occurrence count only
  // matters when the exact same item/color/condition is split across
  // multiple batches within one order.
  function computeItemKeys(items) {
    var seen = {};
    return items.map(function (item) {
      var sig = item.itemNo + "|" + item.colorId + "|" + item.newOrUsed;
      var occurrence = seen[sig] || 0;
      seen[sig] = occurrence + 1;
      return sig + "|" + occurrence;
    });
  }

  // One-time upgrade for picks saved before keys were content-based (when
  // they were just the item's array index, e.g. "0", "1", ...). Remaps
  // them onto the current fetch's content-based keys so existing progress
  // isn't lost the first time an order is reopened after this change.
  function migrateOrderState(orderId, items) {
    var saved = state[orderId];
    if (!saved) return;
    var isLegacyIndexKeyed = Object.keys(saved).every(function (k) { return /^\d+$/.test(k); });
    if (!isLegacyIndexKeyed) return;

    var keys = computeItemKeys(items);
    var migrated = {};
    Object.keys(saved).forEach(function (idxStr) {
      var key = keys[Number(idxStr)];
      if (key && saved[idxStr]) migrated[key] = true;
    });
    state[orderId] = migrated;
    saveState();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // BrickLink's catalog text (item names, descriptions, remarks) sometimes
  // has HTML entities already baked in verbatim (e.g. "&#40;" for "("), a
  // quirk of their data source. Decoding them first means escapeHtml can
  // safely re-escape from there without turning "&#40;" into the literal
  // text "&amp;#40;" in the page.
  var entityDecoder = document.createElement("textarea");
  function decodeHtmlEntities(s) {
    if (!s) return s;
    entityDecoder.innerHTML = s;
    return entityDecoder.value;
  }

  // A few real BrickLink shipping names come back ALL CAPS (however the
  // buyer happened to type their address) — title-cased here for
  // readability, on both the orders list buyer line and the order detail
  // page's own Ship to block/copy text, since they all read off the same
  // contact.name. Only touches a name that's entirely uppercase; a name
  // that's already mixed case (e.g. a nickname in quotes, like
  // Jane "JJ" Doe) is left exactly as typed — blindly re-casing every
  // word would also lowercase a legitimate all-caps initialism such as
  // "JJ" inside an otherwise normally-cased name.
  function titleCaseName(name) {
    if (!name || name !== name.toUpperCase()) return name;
    return name.toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
  }

  // BrickLink has a real, non-zero-id color literally named "Not
  // Applicable" (used for colorless items — minifigs, sets,
  // instructions, ...), so filtering on colorId truthiness alone never
  // catches it. A previous fix filtered the exact string "Not
  // Applicable", but Ryan's real data still showed the tag afterward for
  // minifigs, sets, AND instructions — a wider miss than one exact
  // string would explain, so rather than guess at the precise wording/
  // punctuation BrickLink actually sends (parens? a trailing period? a
  // different case?), this matches on the substring "applicable"
  // instead — no genuine BrickLink color name (Trans-Light Blue, Dark
  // Bluish Gray, ...) would ever contain that word, so it's a safe,
  // punctuation-proof catch-all. Shared by every screen that shows a
  // color name, so there's one guard to fix instead of three copies
  // quietly drifting out of sync with each other (which is exactly how
  // this slipped through the first time).
  function isRealColorName(name) {
    if (!name) return false;
    var normalized = name.trim().toLowerCase();
    return normalized !== "" && normalized.indexOf("applicable") === -1;
  }

  // BrickLink's timestamps are logically always UTC, but not every field
  // actually carries a timezone marker (a trailing Z or +/-HH:MM offset)
  // confirming that — date_rated on a Feedback entry is the one caught
  // live doing this (no marker), and without one the browser's Date
  // parser treats the string as already being in local time instead of
  // converting it from UTC. That silently shifts the displayed date by
  // the local UTC offset — confirmed live as a buyer's feedback reading
  // "Oct 1" at 9:33pm CDT on Sep 30 (CDT is UTC-5, so a date_rated of
  // "...T02:33:00" with no Z, read as UTC, is actually 9:33pm Sep 30
  // local — exactly matching real time — but read as already-local
  // shows the UTC digits unshifted, a full day ahead). Normalizing a
  // marker-less string to explicit UTC before parsing fixes this without
  // touching any timestamp that already carries its own marker (order
  // dates, which have never shown this symptom, pass through unchanged).
  function formatDate(iso) {
    if (!iso) return "";
    // A bare YYYY-MM-DD (e.g. straight off a <input type="date">, like
    // activeSale.endsAt) has no time component to normalize — pin it to
    // midnight UTC directly instead of falling into the "+Z" branch
    // below, which turns it into the unparseable "2026-10-31Z".
    var normalized = /^\d{4}-\d{2}-\d{2}$/.test(iso)
      ? iso + "T00:00:00Z"
      : (/[zZ]|[+-]\d{2}:?\d{2}$/.test(iso) ? iso : iso.replace(" ", "T") + "Z");
    var d = new Date(normalized);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  var CURRENCY_SYMBOLS = { USD: "$", CAD: "$", AUD: "$", NZD: "$", GBP: "£", EUR: "€", JPY: "¥" };

  function formatCurrency(amount, code) {
    if (amount === null || amount === undefined || amount === "") return "";
    var num = Number(amount);
    if (isNaN(num)) return "";
    var symbol = CURRENCY_SYMBOLS[code];
    if (symbol) return symbol + num.toFixed(2);
    return (code ? code + " " : "") + num.toFixed(2);
  }

  // BrickLink's own unit_price comes back with an extra trailing zero
  // (e.g. "0.1500") — real precision only ever goes to three decimal
  // places (tenths of a cent, a real BrickLink convention for common
  // parts priced in bulk, e.g. $0.015 each across a 1000-piece lot), not
  // two — rounding to two would silently truncate a real sub-cent price.
  // Used wherever a row's unitPrice is set from a raw BrickLink/CSV/
  // price-guide value, so the field itself (not just formatCurrency's
  // 2-decimal display-only output, which is for rounded dollar totals,
  // not a per-item price) never shows that extra zero.
  // A mailto: body's line breaks are meant to be CRLF (%0D%0A, RFC 6068). A
  // bare LF (%0A) is dropped by some mail apps — the Gmail iPhone app ran a
  // whole fig log together onto one line — so every body goes through this.
  function mailtoBody(text) {
    return encodeURIComponent(String(text).replace(/\r?\n/g, "\r\n"));
  }

  function formatPriceInput(value) {
    if (value === null || value === undefined || value === "") return "";
    var num = Number(value);
    if (isNaN(num)) return String(value);
    return num.toFixed(3);
  }

  // BrickLink's order weight is grams (confirmed against Ryan's real
  // orders — matched a manual per-item weight × quantity sum exactly);
  // Ryan wants it read as pounds/ounces, the units he actually thinks
  // in for picking a shipping box. 1 lb = 453.592 g, 1 oz = 28.3495 g.
  // Most orders here are under a pound, so "0 lb" is dropped rather
  // than always showing both units.
  function formatWeightLbOz(grams) {
    if (grams === null || grams === undefined || isNaN(grams)) return "";
    var totalOz = grams / 28.3495;
    var lb = Math.floor(totalOz / 16);
    var oz = totalOz - lb * 16;
    // Three decimal places, not one — a light single item can otherwise
    // round straight down to "0.0 oz" and look weightless, which loses
    // exactly the resolution the box-choice weight data collection needs
    // most for its lightest packages.
    if (oz.toFixed(3) === "16.000") { lb += 1; oz = 0; }
    return (lb > 0 ? lb + " lb " : "") + oz.toFixed(3) + " oz";
  }

  // tone: fresh = needs picking, packed = picked & boxed, done = shipped/received,
  // waiting = before payment, problem = cancelled/non-paying/etc, complete =
  // fully done (a separate, deliberately neutral-gray tone from "waiting" —
  // same visual color, but a different status entirely, so they're not
  // conflated just because they happen to render the same).
  var STATUS_META = {
    PENDING: { label: "Pending", tone: "waiting" },
    UPDATED: { label: "Updated", tone: "waiting" },
    PROCESSING: { label: "Processing", tone: "waiting" },
    READY: { label: "Ready", tone: "waiting" },
    PAID: { label: "Paid", tone: "fresh" },
    PACKED: { label: "Packed", tone: "done" },
    SHIPPED: { label: "Shipped", tone: "packed" },
    RECEIVED: { label: "Received", tone: "done" },
    COMPLETED: { label: "Complete", tone: "complete" },
    CANCELLED: { label: "Cancelled", tone: "problem" },
    PURGED: { label: "Purged", tone: "problem" },
    NPB: { label: "NPB", tone: "problem" },
    NRS: { label: "NRS", tone: "problem" },
    NSS: { label: "NSS", tone: "problem" }
  };

  function statusBadgeHtml(status) {
    if (!status) return "";
    var meta = STATUS_META[status] || { label: status, tone: "waiting" };
    return '<span class="status-badge tone-' + meta.tone + '">' + escapeHtml(meta.label) + '</span>';
  }

  async function fetchJSON(url) {
    var res = await fetch(url);
    if (res.status === 401) {
      showLoginGate("Your session needs to be refreshed — log in again. Whatever you were working on is still here once you're back in.");
      throw new Error("Session expired — please log in again.");
    }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

  async function postJSON(url, payload) {
    var res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (res.status === 401) {
      showLoginGate("Your session needs to be refreshed — log in again. Whatever you were working on is still here once you're back in.");
      throw new Error("Session expired — please log in again.");
    }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

  function getColors() {
    if (colorsMap) return Promise.resolve(colorsMap);
    try {
      var cached = window.localStorage.getItem(COLORS_CACHE_KEY);
      if (cached) {
        colorsMap = JSON.parse(cached);
        return Promise.resolve(colorsMap);
      }
    } catch (e) { /* ignore, fall through to fetch */ }

    return fetchJSON("/api/colors").then(function (colors) {
      var map = {};
      (colors || []).forEach(function (c) { map[c.colorId] = c.colorName; });
      colorsMap = map;
      try { window.localStorage.setItem(COLORS_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
      return map;
    });
  }

  function categoriesFromList(categories) {
    var map = {};
    (categories || []).forEach(function (c) {
      map[c.categoryId] = { name: c.categoryName, parentId: c.parentId };
    });
    return map;
  }

  // Never remembers an empty list: if BrickLink ever returned nothing (e.g.
  // during maintenance) and that were cached, every category lookup — the
  // Manage Inventory themes, the Sort page's theme codes — would stay blank
  // until the cache was cleared by hand.
  function getCategories() {
    if (categoriesById) return Promise.resolve(categoriesById);
    try {
      var cached = window.localStorage.getItem(CATEGORIES_CACHE_KEY);
      if (cached) {
        var parsed = JSON.parse(cached);
        if (parsed && Object.keys(parsed).length) {
          categoriesById = parsed;
          return Promise.resolve(categoriesById);
        }
      }
    } catch (e) { /* ignore, fall through to fetch */ }

    return fetchJSON("/api/categories").then(function (categories) {
      var map = categoriesFromList(categories);
      categoriesById = map;
      if (Object.keys(map).length) {
        try { window.localStorage.setItem(CATEGORIES_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
      }
      return map;
    });
  }

  // Re-asks the server, bypassing what's remembered — for when a category
  // the page needs isn't in the list it has (a stale copy).
  function refreshCategories() {
    return fetchJSON("/api/categories").then(function (categories) {
      var map = categoriesFromList(categories);
      if (Object.keys(map).length) {
        categoriesById = map;
        topCategoryCache = {};
        try { window.localStorage.setItem(CATEGORIES_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
      }
      return categoriesById || map;
    });
  }

  // Walks a leaf category up its parent chain (parentId 0 = root) to find
  // the top-level category — the closest BrickLink's category tree comes
  // to a "theme" (e.g. a Set's leaf category might be "Star Wars > Ships",
  // this returns "Star Wars"). Parts mostly don't have a real theme, so
  // this just surfaces their top-level physical category instead (e.g.
  // "Bricks", "Plates") — still a useful grouping, just not a LEGO theme.
  var topCategoryCache = {};
  function topCategoryId(categoryId, categories) {
    if (topCategoryCache[categoryId] !== undefined) return topCategoryCache[categoryId];
    var id = categoryId;
    var seen = {};
    while (categories[id] && categories[id].parentId && !seen[id]) {
      seen[id] = true;
      id = categories[id].parentId;
    }
    topCategoryCache[categoryId] = id;
    return id;
  }
  function categoryDisplayNameById(id) {
    if (!id) return "Uncategorized";
    return (categoriesById && categoriesById[id] && categoriesById[id].name) || "Uncategorized";
  }

  // BrickLink names every minifig-component category "Minifigure, <part>"
  // (Head, Torso Assembly, Legs, Headgear, Hair, Utensil, Weapon,
  // Accessory, ...) — checking for that substring anywhere up a part's
  // category chain (not just its own leaf category) is what lets
  // orderTypeSummaryHtml split "parts" into fig-related vs. general
  // misc, the dollar-value distinction Ryan already tracks in his own
  // spreadsheet, without hardcoding an exhaustive categoryId whitelist
  // that'd go stale if BrickLink's catalog changes.
  function isFigPartCategory(categoryId, categories) {
    if (!categoryId || !categories) return false;
    var id = categoryId;
    var seen = {};
    while (id && categories[id] && !seen[id]) {
      seen[id] = true;
      if (/minifig/i.test(categories[id].name || "")) return true;
      id = categories[id].parentId;
    }
    return false;
  }

  // Custom pinch/pan/double-tap zoom, independent of the browser's native
  // zoom — the page disables native pinch-zoom site-wide (to avoid
  // accidental zooming while picking), and toggling that dynamically to
  // re-enable it is unreliable on iOS, which only honors the viewport
  // meta tag's zoom bounds as computed at initial page load.
  var zoomScale = 1;
  var zoomX = 0;
  var zoomY = 0;
  var pointers = {};
  var pinchStartDist = 0;
  var pinchStartScale = 1;
  var lastTapTime = 0;
  var MAX_ZOOM = 4;

  function applyZoomTransform() {
    lightboxImg.style.transform = "translate(" + zoomX + "px, " + zoomY + "px) scale(" + zoomScale + ")";
  }

  function resetZoom() {
    zoomScale = 1;
    zoomX = 0;
    zoomY = 0;
    applyZoomTransform();
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function touchDistance(t1, t2) {
    var dx = t1.clientX - t2.clientX;
    var dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Touch Events rather than Pointer Events: iOS WebKit (which every iOS
  // browser, including Chrome, runs on) has a history of unreliable
  // multi-touch handling via Pointer Events — Touch Events are the
  // long-standing, battle-tested API there.
  //
  // Listeners are on the full-screen overlay, not the (possibly small,
  // native-resolution) image itself — a pinch's two fingers often won't
  // both land within a small image's bounds, and a touch that starts
  // outside it would never reach a listener attached to the image.
  // preventDefault is only called once we've recognized an actual pinch,
  // pan, or double-tap gesture — a plain single tap falls through so the
  // browser's synthesized click still closes the lightbox on backdrop
  // taps (see the click listener below).
  lightbox.addEventListener("touchstart", function (e) {
    if (e.target === lightboxClose) return;

    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }

    if (e.touches.length === 2) {
      e.preventDefault();
      pinchStartDist = touchDistance(e.touches[0], e.touches[1]);
      pinchStartScale = zoomScale;
    } else if (e.touches.length === 1) {
      var now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        if (zoomScale > 1) {
          resetZoom();
        } else {
          zoomScale = 2.5;
          applyZoomTransform();
        }
      }
      lastTapTime = now;
    }
  }, { passive: false });

  lightbox.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = touchDistance(e.touches[0], e.touches[1]);
      if (pinchStartDist > 0) {
        zoomScale = clamp(pinchStartScale * (dist / pinchStartDist), 1, MAX_ZOOM);
        applyZoomTransform();
      }
    } else if (e.touches.length === 1 && zoomScale > 1) {
      e.preventDefault();
      var t = e.touches[0];
      var prev = pointers[t.identifier];
      if (prev) {
        zoomX += t.clientX - prev.x;
        zoomY += t.clientY - prev.y;
        applyZoomTransform();
      }
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });

  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      delete pointers[e.changedTouches[i].identifier];
    }
    if (e.touches.length < 2) pinchStartDist = 0;
  }
  lightbox.addEventListener("touchend", endTouch);
  lightbox.addEventListener("touchcancel", endTouch);

  var lightboxHint = document.getElementById("lightboxHint");
  var currentObjectUrl = null;
  var DEFAULT_HINT = "Pinch or double-tap to zoom";

  function openLightbox(url) {
    resetZoom();
    lightboxImg.src = "";
    lightboxHint.textContent = "Loading…";
    lightbox.classList.remove("hidden");

    // Fetch via JS (rather than a plain <img src>) so we can read the
    // diagnostic headers item-image.js sets — tells us whether this photo
    // is the larger color-specific one or the small fallback, and its
    // actual byte size, without needing device devtools to check.
    fetch(url).then(function (res) {
      if (!res.ok) throw new Error("image request failed");
      var tier = res.headers.get("X-Image-Tier");
      var bytes = res.headers.get("X-Image-Bytes");
      return res.blob().then(function (blob) {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        lightboxImg.src = currentObjectUrl;
        var sizeLabel = bytes ? Math.round(bytes / 1024) + "KB" : "";
        var TIER_LABELS = { "catalog-api": "official catalog photo", "hires": "hi-res photo", "large": "BrickLink large photo", "small": "low-res photo" };
        var tierLabel = TIER_LABELS[tier] || "photo";
        lightboxHint.textContent = DEFAULT_HINT + " · " + tierLabel + (sizeLabel ? " (" + sizeLabel + ")" : "");
      });
    }).catch(function () {
      lightboxHint.textContent = "Couldn't load this photo";
    });
  }

  function closeLightbox() {
    lightbox.classList.add("hidden");
    lightboxImg.src = "";
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
    lightboxHint.textContent = DEFAULT_HINT;
    resetZoom();
  }

  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  lightboxClose.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });

  function wireThumbLinks(container) {
    container.querySelectorAll(".thumb-link").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openLightbox(el.getAttribute("data-img-url"));
      });
    });
  }

  var THUMB_MIN = 65;
  var THUMB_MAX = 108;

  // Sizes every thumbnail in the order to one shared size — the tallest
  // row's text block wins (clamped) — so photos line up consistently
  // instead of each row getting its own size based on its own text length.
  function sizeThumbsToRows(container) {
    var rows = container.querySelectorAll(".item-row");
    var tallest = 0;
    rows.forEach(function (row) {
      var body = row.querySelector(".item-body");
      if (body) tallest = Math.max(tallest, body.offsetHeight);
    });
    var size = Math.max(THUMB_MIN, Math.min(THUMB_MAX, tallest));
    rows.forEach(function (row) {
      var thumb = row.querySelector(".item-thumb");
      if (!thumb) return;
      thumb.style.width = size + "px";
      thumb.style.height = size + "px";
    });
  }

  // Same "resolve slow enrichment asynchronously, don't block the initial
  // screen" pattern as fetchAndShowBuyerRating below — the orders-LIST
  // endpoint doesn't carry the shipping address name the way the
  // per-order detail call does (confirmed earlier, see order-contact.js
  // and README), so getting the buyer's real name onto every card here
  // means a background contact fetch per order rather than something
  // bundled into the one list response. Reuses contactCache (the same
  // cache openOrder() already fills), so once an order's been seen here
  // — or opened directly — it's free on every later render or Refresh;
  // only genuinely new orders cost a fetch.
  function buyerRealNameHtml(orderId) {
    var cached = contactCache[orderId];
    return '<span class="buyer-real-name" data-order="' + escapeHtml(orderId) + '">'
      + (cached && cached.name ? ' (' + escapeHtml(cached.name) + ')' : '')
      + '</span>';
  }

  // Two small icons, same idea as the feedback icons on BrickLink's own
  // Orders Received page: a check for "you left feedback" (feedbackSent,
  // reconciled from the bulk /api/feedback-list call in loadOrders() the
  // same way it already was per-order via status-check), and a star for
  // "buyer left feedback" (feedbackReceived, populated the same way),
  // tinted by the buyer's actual rating so a Complaint reads distinctly
  // from a Praise rather than just "feedback exists".
  function feedbackIconsHtml(orderId) {
    var icons = "";
    if (feedbackSent[orderId]) {
      icons += '<span class="feedback-icon given" title="You left feedback">✓</span>';
    }
    var received = feedbackReceived[orderId];
    if (received) {
      var tone = received.rating === "Complaint" ? "complaint" : received.rating === "Neutral" ? "neutral" : "praise";
      icons += '<span class="feedback-icon received-' + tone + '" title="Buyer left feedback: ' + escapeHtml(received.rating || "feedback") + '">★</span>';
    }
    icons += loggedIconHtml(orderId);
    return icons ? '<span class="feedback-icons">' + icons + '</span>' : "";
  }

  // Square, not round — same ✓ glyph and gold tint as "you left feedback"
  // above, but .logged's border-radius keeps it from reading as a second
  // feedback mark at a glance (Ryan's own ask). Split out from
  // feedbackIconsHtml (which calls this) purely for that visual distinction
  // — feedbackSent/feedbackReceived/isOrderLogged are all populated by the
  // same account-wide bulk calls (feedback-list, order-actions) regardless
  // of which view they're first needed in, so there's no data-completeness
  // reason left to keep logged-only separate from the full icon set.
  function loggedIconHtml(orderId) {
    return isOrderLogged(orderId) ? '<span class="feedback-icon logged" title="Logged in spreadsheet">✓</span>' : "";
  }

  function fetchMissingBuyerRealNames(orderList, container) {
    container = container || ordersView;
    orderList.forEach(function (order) {
      // undefined = never attempted. null or a resolved object both mean
      // "already attempted" (even a nameless result), so a single order
      // with no shipping name on file doesn't get refetched every render.
      if (contactCache[order.orderId] !== undefined) return;
      // Claim it synchronously, before the fetch even starts — renderOrdersList()
      // fires again in quick succession during initial load (remote sync
      // re-renders), and without this, a second call landing before the
      // first fetch resolves would still see undefined here and kick off
      // a duplicate request for the same order.
      contactCache[order.orderId] = null;
      fetchJSON("/api/orders/" + encodeURIComponent(order.orderId) + "/contact")
        .then(function (contact) {
          contact.name = titleCaseName(decodeHtmlEntities(contact.name));
          contactCache[order.orderId] = contact;
          if (!contact.name) return;
          var el = container.querySelector('.order-card[data-order="' + order.orderId + '"] .buyer-real-name');
          if (el) el.textContent = " (" + contact.name + ")";
        })
        .catch(function () { /* already claimed null above */ });
    });
  }

  // Same "picked vs. known total" math each order card already renders its
  // own progress bar from — pulled out so the "to pick" stat and the cards
  // agree on what "done" means instead of each computing it separately.
  // Falls back to pickedCountFromState()/order.uniqueCount when the order's
  // items haven't been fetched yet in this session (same fallback the card
  // itself already uses before it's been opened). That fallback counts every
  // locally-saved "picked" key regardless of whether it still matches a real
  // item in the order, so it can run ahead of knownTotal if a lot was
  // combined/cancelled/edited on BrickLink's side after it had already been
  // picked (observed live as a card reading "33/32"). Capped here rather
  // than solved at the source, since there's no way to tell which saved key
  // went stale without the real item list — which is exactly what isn't
  // fetched yet on this path.
  function orderPickProgress(order) {
    var items = itemsCache[order.orderId];
    var picked = items ? pickedCount(order.orderId, items) : pickedCountFromState(order.orderId);
    var knownTotal = items ? items.length : (order.uniqueCount || 0);
    if (knownTotal > 0 && picked > knownTotal) picked = knownTotal;
    return { items: items, picked: picked, knownTotal: knownTotal, done: knownTotal > 0 && picked === knownTotal };
  }

  // Shared by the list card and detail page's own File order button —
  // order.filed (Order Lookup's snapshot, corrected live by
  // refreshOrderStatusCheck() the same way order.status is) means
  // BrickLink already has this filed, whether that happened by tapping
  // File order here or directly on BrickLink's own site, so there's
  // nothing left for a fresh tap to do. Disabled rather than omitted —
  // same "still there, just done" treatment Drive Thru Sent gets, not a
  // silent gap where the button used to be.
  function fileOrderActionHtml(order) {
    return order.filed
      ? '<button class="status-action-btn file-order-btn" disabled>Filed</button>'
      : '<button class="status-action-btn file-order-btn" id="detailFileBtn">File order</button>';
  }
  function listFileActionHtml(order) {
    return order.filed
      ? '<button class="status-action-btn list-file-btn" disabled>Filed</button>'
      : '<button class="status-action-btn list-file-btn" data-order="' + escapeHtml(order.orderId) + '">File order</button>';
  }

  function renderOrdersList() {
    if (!orders.length) {
      ordersView.innerHTML = '<div class="state-block">No open orders right now.</div>';
      return;
    }

    // "To pick" used to just mean "sitting in PAID status" — Ryan pointed
    // out that's not actually what he wants to know: an order he's already
    // picked every item on (just hasn't tapped "Mark as packed" yet) isn't
    // really left to pick anymore, and this missed that distinction
    // entirely. COMPLETED/problem-status orders are excluded regardless of
    // their own local pick state (same reasoning as inProcessOrders below)
    // — those are done or dead, never "still needs picking", even if this
    // app never happened to record picks for one (e.g. it was fulfilled
    // before this app existed, or outside it).
    var toPickCount = orders.filter(function (o) {
      var meta = STATUS_META[o.status];
      if (o.status === "COMPLETED" || (meta && meta.tone === "problem")) return false;
      return !orderPickProgress(o).done;
    }).length;
    // "To ship" used to only count PACKED — but a PAID order that hasn't
    // been packed yet still needs to ship just as much, it just has one
    // more step first. Count any status earlier than SHIPPED in
    // BrickLink's own pipeline (PENDING/UPDATED/PROCESSING/READY/PAID/
    // PACKED), same exclusion of problem statuses (Cancelled/NPB/NRS/NSS)
    // as toPickCount above — those were never really "to ship" either.
    var PRE_SHIP_STATUSES = { PENDING: true, UPDATED: true, PROCESSING: true, READY: true, PAID: true, PACKED: true };
    var toShipCount = orders.filter(function (o) { return !!PRE_SHIP_STATUSES[o.status]; }).length;

    // Manual "mental note" reminder, not tied to any single order or to
    // where pickup happens to fall in Ryan's picking workflow (it varies
    // day to day). Tracked per order, same durable-sync pattern as Drive
    // Thru/feedback, so a newly-packed order surfaces the reminder again
    // even after an earlier batch's pickup was already confirmed.
    var ordersAwaitingPickup = orders.filter(function (o) { return o.status === "PACKED" && !pickupScheduled[o.orderId]; });

    // COMPLETED orders stick around in this list until filed now (so Ryan
    // can catch anything the buyer flags, for as long as he wants), but
    // their money isn't "in process" anymore — excluded here the same way
    // a cancelled/problem order already was, so the stat doesn't inflate
    // once completed orders started actually showing up in this array.
    var inProcessOrders = orders.filter(function (o) {
      var meta = STATUS_META[o.status];
      return o.orderTotal && o.status !== "COMPLETED" && (!meta || meta.tone !== "problem");
    });
    var inProcessCurrency = inProcessOrders.length ? inProcessOrders[0].currencyCode : null;
    var inProcessTotal = null;
    if (inProcessOrders.length) {
      inProcessTotal = inProcessOrders.reduce(function (sum, o) {
        if (o.currencyCode !== inProcessCurrency) return sum;
        return sum + Number(o.orderTotal);
      }, 0);
    }

    var html = ""
      + '<div class="stats-summary">'
      + '<div class="stats-summary-tile"><strong>' + toPickCount + '</strong><span>to pick</span></div>'
      + '<div class="stats-summary-tile"><strong>' + toShipCount + '</strong><span>to ship</span></div>'
      + (inProcessTotal !== null ? '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(inProcessTotal, inProcessCurrency)) + '</strong><span>in process</span></div>' : '')
      + '</div>'
      + (ordersAwaitingPickup.length ? '<div class="pickup-reminder-row">'
        + '<span>' + ordersAwaitingPickup.length + ' order' + (ordersAwaitingPickup.length === 1 ? '' : 's') + ' packed, ready for USPS pickup</span>'
        + '<button class="status-action-btn pickup-btn" id="pickupScheduledBtn">I’ve scheduled pickup</button>'
        + '</div>' : '');
    orders.forEach(function (order) {
      var total = order.totalCount || 0;
      var lineCount = order.uniqueCount || 0;
      var progress = orderPickProgress(order);
      var items = progress.items;
      var picked = progress.picked;
      var knownTotal = progress.knownTotal;
      var done = progress.done;
      var pct = knownTotal > 0 ? Math.round((picked / knownTotal) * 100) : 0;
      var meta = STATUS_META[order.status];
      var needsPick = meta && meta.tone === "fresh";
      var needsLog = !isOrderLogged(order.orderId);
      var isComplete = order.status === "COMPLETED";
      var statusAction = "";
      if (order.status === "PAID") {
        statusAction = '<button class="status-action-btn to-packed" data-order="' + escapeHtml(order.orderId) + '" data-target-status="PACKED">Mark as packed</button>';
      } else if (order.status === "PACKED") {
        statusAction = '<button class="status-action-btn to-shipped" data-order="' + escapeHtml(order.orderId) + '" data-target-status="SHIPPED">Mark as shipped</button>';
      } else if (order.status === "SHIPPED" && !driveThruSent[order.orderId]) {
        statusAction = '<button class="status-action-btn list-drive-thru-btn" data-order="' + escapeHtml(order.orderId) + '">Send Drive Thru</button>';
      } else if (order.status === "SHIPPED" || order.status === "RECEIVED") {
        statusAction = '<button class="status-action-btn to-completed" data-order="' + escapeHtml(order.orderId) + '" data-target-status="COMPLETED">Mark as completed</button>';
        // Once the buyer marks an order Received (this app never sets that
        // status itself — see ALLOWED_STATUSES in update-order-status.js —
        // so a RECEIVED order always got there via the buyer or BrickLink,
        // never through here), BrickLink often won't let the seller push it
        // to Completed at all — grayed out on BrickLink's own Orders page
        // too, confirmed against a real rejected attempt (order #32601986,
        // RESOURCE_UPDATE_NOT_ALLOWED / NOT_IN_UPDATABLE_STATUS). There's no
        // API field that says in advance whether a given order is locked
        // this way, and Ryan's said it isn't *always* locked, so rather than
        // guess, filing is offered right alongside — is_filed is a plain
        // boolean on Update Order with no status prerequisite, so it works
        // whether or not the completed transition does.
        if (order.status === "RECEIVED") {
          statusAction += listFileActionHtml(order);
        }
      } else if (order.status === "COMPLETED") {
        statusAction = listFileActionHtml(order);
      }
      html += ""
        + '<div class="order-card' + (needsPick ? ' needs-pick' : '') + (needsLog ? ' needs-log' : '') + (isComplete ? ' is-complete' : '') + '" role="button" tabindex="0" data-order="' + escapeHtml(order.orderId) + '">'
        + '<div class="order-top-row">'
        + '<span class="order-id-group">'
        + '<span class="order-id mono">#' + escapeHtml(order.orderId) + '</span>'
        + statusBadgeHtml(order.status)
        + feedbackIconsHtml(order.orderId)
        + '</span>'
        + '<span class="order-date">' + escapeHtml(formatDate(order.date)) + '</span>'
        + '</div>'
        + '<div class="order-buyer">'
        + '<span>' + escapeHtml(order.buyer || "") + buyerRealNameHtml(order.orderId) + '</span>'
        + (order.orderTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(order.orderTotal, order.currencyCode)) + '</span>' : '')
        + '</div>'
        + '<div class="order-lots-items">' + lineCount + ' lots · ' + total + ' items</div>'
        + '<div class="order-progress-row">'
        + '<div class="progress-track"><div class="progress-fill' + (done ? ' done' : '') + '" style="width:' + pct + '%"></div></div>'
        + '<span class="progress-label">' + picked + '/' + knownTotal + '</span>'
        + '</div>'
        + (statusAction ? '<div class="order-status-row">' + statusAction + '</div>' : '')
        + '</div>';
    });
    ordersView.innerHTML = html;
    fetchMissingBuyerRealNames(orders);

    ordersView.querySelectorAll(".order-card").forEach(function (card) {
      card.addEventListener("click", function () {
        openOrder(card.getAttribute("data-order"));
      });
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openOrder(card.getAttribute("data-order"));
        }
      });
    });

    ordersView.querySelectorAll(".status-action-btn:not(.list-drive-thru-btn):not(.pickup-btn):not(.list-file-btn)").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleStatusChange(btn);
      });
    });

    ordersView.querySelectorAll(".list-drive-thru-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleListDriveThru(btn);
      });
    });

    ordersView.querySelectorAll(".list-file-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleListFileOrder(btn);
      });
    });

    var pickupBtn = document.getElementById("pickupScheduledBtn");
    if (pickupBtn) {
      pickupBtn.addEventListener("click", function () {
        ordersAwaitingPickup.forEach(function (o) { pickupScheduled[o.orderId] = true; });
        pushOrderActions();
        renderOrdersList();
      });
    }
  }

  // BrickLink rejects "mark as Completed" for some RECEIVED orders with
  // RESOURCE_UPDATE_NOT_ALLOWED / NOT_IN_UPDATABLE_STATUS — confirmed live
  // (order #32601986) as BrickLink's own "only the buyer (or BrickLink's
  // timer) can complete this from here" rule once the buyer's marked it
  // received, same as it shows grayed out on BrickLink's own Orders page.
  // There's no field on the order that predicts this in advance, so rather
  // than a raw API error, name what actually happened and point at filing
  // — the alternative offered right alongside this button — as the way
  // forward.
  function statusUpdateErrorMessage(orderId, targetStatus, err) {
    if (targetStatus === "COMPLETED" && /NOT_IN_UPDATABLE_STATUS/.test(err.message)) {
      return "BrickLink won't let order #" + orderId + " be marked Completed from here — once the buyer marks an order Received, only they (or BrickLink's own automatic timer) can complete it from there. You can still file the order away with the File order button.";
    }
    return "Couldn't update order #" + orderId + ": " + err.message;
  }

  // Both status-change paths below (list card + order detail) mutate the
  // `orders` array in place, which is enough for the main Orders list to
  // immediately reflect the change on its own. Order Lookup reads from
  // its own separate statsRows snapshot though (its own /api/order-stats
  // fetch, not derived from `orders` — see statsRows below), and an order
  // opened from Order Lookup gets a throwaway fallback object built fresh
  // from a statsRows row each time (openLookupOrder), not a reference
  // back into statsRows itself. Without this, Order Lookup keeps showing
  // the pre-change status for the rest of the session, since statsRows is
  // only ever fetched once per session — confirmed live as two orders
  // still reading "Shipped" there after confirming "Mark as completed"
  // from an order opened through Order Lookup.
  function syncStatsRowStatus(orderId, status) {
    if (!statsRows) return;
    var row = statsRows.filter(function (r) { return r.orderId === orderId; })[0];
    if (row) row.status = status;
  }

  function handleStatusChange(btn) {
    var orderId = btn.getAttribute("data-order");
    var targetStatus = btn.getAttribute("data-target-status");
    var label = STATUS_META[targetStatus].label;

    if (!window.confirm("Mark order #" + orderId + " as " + label + " on BrickLink?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Updating…";

    postJSON("/api/update-order-status", { orderId: orderId, status: targetStatus })
      .then(function () {
        var order = orders.find(function (o) { return o.orderId === orderId; });
        if (order) order.status = targetStatus;
        syncStatsRowStatus(orderId, targetStatus);
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert(statusUpdateErrorMessage(orderId, targetStatus, err));
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  // Same action as the order detail page's Drive Thru button (and shares
  // its durable "sent" tracking), just reachable straight from the list —
  // the natural next tap right after marking an order shipped, so there's
  // no separate trip into the order to send it.
  function handleListDriveThru(btn) {
    var orderId = btn.getAttribute("data-order");
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + orderId + "?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: orderId })
      .then(function () {
        driveThruSent[orderId] = true;
        pushOrderActions();
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  // Filing sets the same is_filed flag BrickLink itself flips when Ryan
  // files an order from the Orders Received page — either way, the next
  // /api/orders fetch (which never passes filed=true) won't include it
  // again, so it's removed from the local `orders` array right away rather
  // than waiting on a refetch to notice it's gone.
  function handleListFileOrder(btn) {
    var orderId = btn.getAttribute("data-order");
    if (!window.confirm("File order #" + orderId + " on BrickLink? It'll no longer show up here or on your BrickLink Orders Received page.")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Filing…";

    postJSON("/api/file-order", { orderId: orderId })
      .then(function () {
        orders = orders.filter(function (o) { return o.orderId !== orderId; });
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't file order #" + orderId + ": " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  function setOrdersLoading() {
    ordersView.innerHTML = '<div class="state-block">Loading orders…</div>';
  }

  function setOrdersError(message) {
    ordersView.innerHTML = ''
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="ordersRetryBtn">Try again</button></div>';
    var btn = document.getElementById("ordersRetryBtn");
    if (btn) btn.addEventListener("click", function () { loadOrders(); });
  }

  async function loadOrders() {
    setOrdersLoading();
    setRefreshing(true);
    try {
      orders = await fetchJSON("/api/orders");
      // Newest first, matching BrickLink's own Orders Received page.
      orders.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

      // A single bulk call (not one per order) for BrickLink's own
      // feedback truth — same icons BrickLink's own Orders Received page
      // shows for "you left feedback" / "buyer left feedback". Best-effort:
      // a failure here just means the icons don't show this refresh,
      // same fail-safe posture as the rest of this app's enrichment calls.
      try {
        var feedbackList = await fetchJSON("/api/feedback-list");
        feedbackReceived = (feedbackList && feedbackList.received) || {};
        var actionsChanged = false;
        Object.keys((feedbackList && feedbackList.given) || {}).forEach(function (orderId) {
          if (!feedbackSent[orderId]) {
            feedbackSent[orderId] = true;
            actionsChanged = true;
          }
        });
        if (actionsChanged) pushOrderActions();
      } catch (e) { /* icons just won't show this refresh */ }

      if (currentView === "orders") renderOrdersList();
    } catch (err) {
      if (currentView === "orders") setOrdersError(err.message);
    } finally {
      setRefreshing(false);
    }
  }

  function setRefreshing(isRefreshing) {
    refreshBtn.disabled = isRefreshing;
    refreshBtn.classList.toggle("spinning", isRefreshing);
  }

  function checkSvg() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // Fallback art for when the live catalog photo hotlink fails to load.
  function thumbSvg(type) {
    if (type === "MINIFIG") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="8" y="2.5" width="8" height="6" rx="2.5"/>'
        + '<path d="M6.5 10h11l-1 6.5a2 2 0 0 1-2 1.5h-5a2 2 0 0 1-2-1.5L6.5 10z"/>'
        + '<path d="M9 18v3.5M15 18v3.5"/>'
        + '</svg>';
    }
    if (type === "SET") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="3" y="7" width="18" height="13" rx="1.5"/>'
        + '<path d="M3 7l3-4h12l3 4"/>'
        + '</svg>';
    }
    // PART and everything else: simple brick
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<rect x="3" y="9" width="18" height="10" rx="1.5"/>'
      + '<circle cx="8" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '<circle cx="16" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '</svg>';
  }

  // v2 busts every cache layer (Netlify's own edge, not just the
  // browser) for item-image URLs cached before the color-priority fix —
  // Cache-Control: public on that response means *any* intermediate
  // cache was allowed to store the old wrong-color bytes under this
  // exact URL, not just the browser, so a client-side cache clear alone
  // doesn't reach it. Bump this again if item-image.js's selection logic
  // ever changes in a way that could flip an already-cached answer.
  function catalogImageUrl(item) {
    return "/api/item-image?type=" + encodeURIComponent(item.type)
      + "&no=" + encodeURIComponent(item.itemNo)
      + "&color=" + encodeURIComponent(item.colorId || 0)
      + "&nu=" + encodeURIComponent(item.newOrUsed === "U" ? "U" : "N")
      + "&v=2";
  }

  function thumbHtml(item) {
    var url = catalogImageUrl(item);
    return '<span class="thumb-link" data-img-url="' + escapeHtml(url) + '">'
      + '<span class="thumb-fallback">' + thumbSvg(item.type) + '</span>'
      + '<img src="' + escapeHtml(url) + '" alt="" referrerpolicy="no-referrer" style="display:none" '
      + 'onload="this.previousElementSibling.style.display=\'none\'; this.style.display=\'block\';" '
      + 'onerror="this.remove();">'
      + '</span>';
  }

  // A qty>1 item's own mini progress bar — fills in as it gets tapped,
  // separate from (and in addition to) the enlarged qty badge and the
  // row's own background tint, per Ryan's own suggestion for confirming
  // a multi-piece lot is fully counted out rather than just "touched".
  function itemProgressRowHtml(progress) {
    var pct = progress.of > 0 ? Math.round((progress.n / progress.of) * 100) : 0;
    var done = progress.n >= progress.of;
    return '<div class="item-progress-row">'
      + '<div class="progress-track"><div class="progress-fill' + (done ? ' done' : '') + '" style="width:' + pct + '%"></div></div>'
      + '<span class="progress-label">' + progress.n + '/' + progress.of + '</span>'
      + '</div>';
  }

  // Renders filled in immediately if manageInventoryRows is already warm
  // this session (e.g. Manage Inventory was visited earlier, or an order
  // or an earlier Add Inventory CSV already triggered the same lazy
  // load); otherwise an empty placeholder — same reserved-space-now,
  // filled-in-shortly-after approach as buyerRealNameHtml — patched by
  // patchItemStockCounts() below once the background fetch resolves.
  function itemStockCountHtml(item) {
    var count = manageInventoryRows ? inventoryStockCount(item.itemNo, item.colorId) : "";
    var priceSummary = (count && manageInventoryRows) ? inventoryStockPriceSummary(item.itemNo, item.colorId) : "";
    // Already having some on hand is worth noticing — "0 in inventory" and
    // "12 in inventory" used to look identical (both plain gray), easy to
    // read past on a long list.
    return '<div class="item-stock-count' + (count ? ' has-stock' : '') + '" data-item-no="' + escapeHtml(item.itemNo) + '" data-color-id="' + escapeHtml(item.colorId) + '">'
      + (count !== "" ? count + ' in inventory' + (priceSummary ? ' (listed at ' + escapeHtml(priceSummary) + ')' : '') : '')
      + '</div>';
  }

  // Shared by the order detail page and Add Inventory's review list —
  // both leave itemStockCountHtml()'s placeholder in place when the
  // count isn't ready yet, then call this once ensureManageInventoryLoaded()
  // resolves to fill in every such placeholder currently in the DOM under
  // the given container. A later re-render (editing a field, tapping a
  // checkbox) doesn't need this again — by then manageInventoryRows is
  // warm, so itemStockCountHtml() renders the real count synchronously
  // the next time it's called.
  function patchItemStockCounts(container) {
    container.querySelectorAll(".item-stock-count[data-item-no]").forEach(function (el) {
      var itemNo = el.getAttribute("data-item-no");
      var colorId = parseInt(el.getAttribute("data-color-id"), 10) || 0;
      var count = inventoryStockCount(itemNo, colorId);
      var priceSummary = count ? inventoryStockPriceSummary(itemNo, colorId) : "";
      el.textContent = count + " in inventory" + (priceSummary ? " (listed at " + priceSummary + ")" : "");
      el.classList.toggle("has-stock", !!count);
    });
  }

  var ITEM_TYPE_LABELS = {
    MINIFIG: ["minifig", "minifigs"],
    PART: ["part", "parts"],
    PART_FIG: ["fig part", "fig parts"],
    PART_GEN: ["gen part", "gen parts"],
    SET: ["set", "sets"],
    BOOK: ["book", "books"],
    GEAR: ["gear", "gear"],
    CATALOG: ["catalog", "catalogs"],
    INSTRUCTION: ["instruction", "instructions"],
    ORIGINAL_BOX: ["box", "boxes"],
    UNSORTED_LOT: ["lot", "lots"],
  };

  // A quick "what's actually in here" glance at the top of the order
  // detail page, e.g. "5 gen parts (1 lb 2.000 oz) · 2 fig parts (3.500
  // oz) · 1 minifig" — Ryan wanted this specifically so he doesn't have
  // to open every item row just to see the mix. Sums quantity per
  // BrickLink item type (not lot/line count — "2 minifigs" should mean
  // two physical minifigs, whether that's two separate 1-qty lots or one
  // 2-qty lot), sorted by count descending so the most common type in
  // the order leads. Deliberately only on the detail page, never on any
  // list/card view — Ryan explicitly didn't want more crowding there,
  // where several cards are already stacked and busy; the detail page
  // only ever shows one order at a time, so there's room for it here
  // that there isn't there.
  //
  // PART splits further into fig-related vs. general ("gen", matching
  // the label Ryan already uses in his own spreadsheet) — that
  // distinction matters to him since fig parts (torsos, heads, legs,
  // accessories) run a noticeably different dollar value than general
  // parts. Needs categoriesById loaded (see openOrder) to tell the two
  // apart; falls back to the old unsplit "parts" bucket (no weight
  // shown, since that fallback can't tell which of the two it's
  // summing) if categories haven't loaded for some reason, rather than
  // guessing.
  //
  // Only the two PART buckets get a weight alongside their count — Ryan
  // uses part weight to track cost/lb for piece lots, not for minifigs,
  // sets, or anything else summarized here, so a weight on those would
  // just be noise. item.weight is BrickLink's per-unit gram weight (see
  // formatWeightLbOz's own comment on how that's been confirmed against
  // real orders), so it's multiplied by qty before summing across a
  // multi-unit lot.
  function orderTypeSummaryHtml(items) {
    var counts = {};
    var weights = {};
    items.forEach(function (item) {
      var bucket = item.type;
      if (bucket === "PART" && categoriesById) {
        bucket = isFigPartCategory(item.categoryId, categoriesById) ? "PART_FIG" : "PART_GEN";
      }
      counts[bucket] = (counts[bucket] || 0) + (item.qty || 0);
      if (bucket === "PART_FIG" || bucket === "PART_GEN") {
        weights[bucket] = (weights[bucket] || 0) + (parseFloat(item.weight) || 0) * (item.qty || 0);
      }
    });
    var types = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    if (!types.length) return "";
    var parts = types.map(function (type) {
      var labels = ITEM_TYPE_LABELS[type] || [type.toLowerCase(), type.toLowerCase() + "s"];
      var n = counts[type];
      var text = n + " " + (n === 1 ? labels[0] : labels[1]);
      if (weights[type] !== undefined) text += " (" + formatWeightLbOz(weights[type]) + ")";
      return text;
    });
    return '<div class="order-type-summary">' + escapeHtml(parts.join(" · ")) + '</div>';
  }

  function renderOrderDetail(order, items, messages, contact) {
    messages = messages || [];
    var readOnly = orderDetailReadOnly;
    var picked = pickedCount(order.orderId, items);
    var allDone = items.length > 0 && picked === items.length;
    var itemKeys = computeItemKeys(items);
    var canSendDriveThru = order.status === "SHIPPED";
    var canLeaveFeedback = ["PACKED", "SHIPPED", "RECEIVED", "COMPLETED"].indexOf(order.status) !== -1;
    var detailStatusAction = "";
    if (order.status === "PAID") {
      detailStatusAction = '<button class="status-action-btn to-packed" id="detailStatusBtn" data-target-status="PACKED">Mark as packed</button>';
    } else if (order.status === "PACKED") {
      detailStatusAction = '<button class="status-action-btn to-shipped" id="detailStatusBtn" data-target-status="SHIPPED">Mark as shipped</button>';
    } else if (order.status === "SHIPPED" || order.status === "RECEIVED") {
      detailStatusAction = '<button class="status-action-btn to-completed" id="detailStatusBtn" data-target-status="COMPLETED">Mark as completed</button>';
      // See the matching comment in renderOrdersList() — RECEIVED can't be
      // told apart in advance whether the seller is actually allowed to
      // push it to Completed, so File order (no status prerequisite) is
      // offered right alongside rather than only once Completed is reached.
      if (order.status === "RECEIVED") {
        detailStatusAction += fileOrderActionHtml(order);
      }
    } else if (order.status === "COMPLETED") {
      detailStatusAction = fileOrderActionHtml(order);
    }

    // What the buyer actually pays: the line's final price when BrickLink
    // reports one lower than the listed price (a sale or discount), with the
    // listed price struck through beside it and the percentage off.
    function orderItemPriceHtml(item, currency) {
      var listed = parseFloat(item.unitPrice), final = parseFloat(item.unitPriceFinal);
      if (!(listed > 0)) return "";
      if (final > 0 && final < listed - 0.0005) {
        var pct = Math.round((1 - final / listed) * 100);
        return '<span class="item-price mono">' + escapeHtml(formatCurrency(final, currency)) + '</span>';
      }
      return '<span class="item-price mono">' + escapeHtml(formatCurrency(listed, currency)) + '</span>';
    }

    // The sale details go on their own line under the item number, so the
    // top line (number, type, price) keeps its width beside the checkmark.
    function orderItemSaleLineHtml(item, currency) {
      var listed = parseFloat(item.unitPrice), final = parseFloat(item.unitPriceFinal);
      if (!(listed > 0 && final > 0 && final < listed - 0.0005)) return "";
      var pct = Math.round((1 - final / listed) * 100);
      return '<div class="item-sale-line"><span class="item-type-tag sale-tag">' + (pct > 0 ? pct + '% off' : 'sale') + '</span>'
        + '<span>was <s class="mono">' + escapeHtml(formatCurrency(listed, currency)) + '</s></span></div>';
    }

    var rows = items.map(function (item, idx) {
      var isDone = !readOnly && isPicked(order.orderId, itemKeys[idx]);
      var isMulti = item.qty > 1;
      var progress = (!readOnly && isMulti) ? pickProgress(order.orderId, itemKeys[idx], item.qty) : null;
      var isPartial = !readOnly && isMulti && !isDone && progress.n > 0;
      var rowClass = isDone ? ' picked' : (isPartial ? ' partial' : '');
      return ""
        + '<div class="item-row' + rowClass + '" data-key="' + escapeHtml(itemKeys[idx]) + '" data-qty="' + item.qty + '">'
        + '<div class="item-thumb">' + thumbHtml(item) + '<span class="qty-chip' + (isMulti ? ' multi' : '') + '">' + item.qty + '</span></div>'
        + '<div class="item-body">'
        + '<div class="item-line1">'
        + '<span class="item-no mono">' + escapeHtml(item.itemNo) + '</span>'
        + '<span class="item-line1-right">'
        + '<span class="item-type-tag">' + escapeHtml(item.type) + '</span>'
        + orderItemPriceHtml(item, order.currencyCode)
        + '</span>'
        + '</div>'
        + orderItemSaleLineHtml(item, order.currencyCode)
        + (!readOnly && isMulti ? itemProgressRowHtml(progress) : '')
        + '<div class="item-name">' + escapeHtml(item.name) + '</div>'
        + (isRealColorName(item.colorName) ? '<div class="item-color">' + escapeHtml(item.colorName) + '</div>' : '')
        + (item.description ? '<div class="item-color">' + escapeHtml(item.description) + '</div>' : '')
        + (item.remarks ? '<div class="item-remarks">' + escapeHtml(item.remarks) + '</div>' : '')
        + itemStockCountHtml(item)
        + '<a class="item-bl-link" href="' + escapeHtml(bricklinkCatalogUrl(item, item.newOrUsed === "U" ? "U" : "N")) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View on BrickLink ↗</a>'
        + '</div>'
        + (readOnly ? '' : '<div class="checkmark">' + checkSvg() + '</div>')
        + '</div>';
    }).join("");

    var actionRowHtml = '<div class="order-action-row">'
      + detailStatusAction
      + (canSendDriveThru ? '<button class="drive-thru-btn" id="driveThruBtn"' + (driveThruSent[order.orderId] ? " disabled" : "") + '>' + (driveThruSent[order.orderId] ? "Drive Thru Sent" : "Send Drive Thru") + '</button>' : '')
      + renderSpreadsheetLoggedAction(order)
      + (items.length ? '<button class="jump-to-items-btn" id="jumpToItemsBtn">Jump to items ↓</button>' : '')
      + '</div>';

    orderView.innerHTML = ""
      // Sticky only in read-only (Order Lookup) detail views — Ryan's own
      // ask, scoped there specifically. Breaks right above the action
      // row (File/Log/Jump to items/...), which stays in normal flow and
      // scrolls away with the rest of the page; only the id/status/buyer/
      // weight/type-summary block above it pins in place. A sticky
      // element only stays stuck for as long as there's more content
      // below it inside its own PARENT — so this block has to be a
      // direct child of orderView (a sibling of the action row, item
      // list, etc.), not nested inside the small .order-summary box the
      // non-readOnly path keeps using, which is barely taller than the
      // sticky content itself and would make it unstick almost
      // immediately. The main pick list's own order detail has the
      // picked-count line and nothing to scroll past before the item
      // list anyway, and pinning the same block there wasn't asked for,
      // so it's left exactly as before (action row stays inside
      // .order-summary there, same as pre-existing behavior).
      + '<div class="order-summary' + (readOnly ? ' order-sticky-top' : '') + '"' + (readOnly ? ' id="orderStickyTop"' : '') + '>'
      + '<div class="order-id-group">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + statusBadgeHtml(order.status)
      + '</div>'
      + '<div class="order-buyer">'
      + '<span>' + escapeHtml(order.buyer || "") + ' · ' + escapeHtml(formatDate(order.date)) + ' <span class="buyer-rating" id="buyerRatingBadge"></span></span>'
      + (order.orderTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(order.orderTotal, order.currencyCode)) + '</span>' : '')
      + '</div>'
      + previousOrdersHtml(order)
      + (contact && contact.weightG ? '<div class="order-weight mono">' + escapeHtml(formatWeightLbOz(contact.weightG)) + '</div>' : '')
      + orderTypeSummaryHtml(items)
      + (readOnly ? '' : '<div class="picked-count" id="pickedCountText"><strong>' + picked + ' of ' + items.length + '</strong> lots picked' + (allDone ? ' — ready to pack' : '') + '</div>')
      + (readOnly ? '' : actionRowHtml)
      + '</div>'
      + (readOnly ? actionRowHtml : '')
      + renderBoxChoiceSection(order)
      + renderContactSection(contact)
      + renderFinancialSection(contact, order)
      + renderMessagesSection(messages)
      + renderBuyerFeedbackSection(order)
      + (canLeaveFeedback ? renderFeedbackSection(order) : '')
      + (items.length && !readOnly ? '<div class="order-actions">'
        + '<button class="select-all-btn">Select all as picked</button>'
        + '<button class="reset-btn">Clear picks for this order</button>'
        + '</div>' : '')
      + '<div id="orderItemsAnchor"></div>'
      + (items.length ? rows : '<div class="state-block">This order has no line items.</div>')
      + '<div class="reset-row">'
      + '<button class="bottom-back-btn" id="bottomBackBtn">&#8592; ' + (readOnly ? "Order Lookup" : "All orders") + '</button>'
      + (items.length && !readOnly ? '<button class="select-all-btn">Select all as picked</button>'
        + '<button class="reset-btn">Clear picks for this order</button>' : '')
      + '</div>';

    if (readOnly) {
      var orderStickyTop = document.getElementById("orderStickyTop");
      var topbarEl = document.querySelector(".topbar");
      if (orderStickyTop && topbarEl) {
        orderStickyTop.style.top = topbarEl.getBoundingClientRect().height + "px";
      }
    }

    wireThumbLinks(orderView);
    sizeThumbsToRows(orderView);

    // A full renderOrderDetail() re-render on every single pick toggle
    // used to rebuild the entire item list — including re-running
    // sizeThumbsToRows()'s per-row layout measurement — on every tap.
