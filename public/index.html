    }
  }

  // ---- Add Inventory (BrickScan CSV import) ----

  // Matches item-image.js's TYPE_LETTERS map, inverted — the single-letter
  // codes BrickScan's export (and BrickLink's own classic upload format)
  // use for ITEMTYPE aren't what the rest of this app works with; every
  // other item shown here (order items, thumbHtml/catalogImageUrl) uses
  // BrickLink's full-word type ("MINIFIG", "PART", ...), confirmed against
  // real order data. Converting up front means thumbHtml can be reused
  // as-is for the review cards.
  var INVENTORY_TYPE_CODE_TO_WORD = {
    P: "PART", S: "SET", M: "MINIFIG", B: "BOOK", G: "GEAR",
    C: "CATALOG", I: "INSTRUCTION", O: "ORIGINAL_BOX", U: "UNSORTED_LOT"
  };
  function inventoryTypeWord(code) {
    return INVENTORY_TYPE_CODE_TO_WORD[(code || "").trim().toUpperCase()] || "PART";
  }

  // Minimal RFC 4180 CSV parser — BrickScan's export quotes any field
  // containing a comma (e.g. item names like "Colonel Ward - Sand Green
  // Jacket, Reddish Brown Legs"), so a naive split(",") would misalign
  // every column after the first quoted field in a row.
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else {
          field += c;
        }
        continue;
      }
      if (c === '"') { inQuotes = true; continue; }
      if (c === ",") { row.push(field); field = ""; continue; }
      if (c === "\r") { continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; continue; }
      field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function csvTextToObjects(text) {
    var rows = parseCSV(text).filter(function (r) { return r.length > 1 || (r.length === 1 && r[0] !== ""); });
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).map(function (r) {
      var obj = {};
      headers.forEach(function (h, idx) { obj[h] = r[idx] !== undefined ? r[idx].trim() : ""; });
      return obj;
    });
  }

  var inventoryRowCounter = 0;

  // Default condition write-up text, seeded per-row below into BOTH
  // Description and Remarks, each only when BrickScan's own column for
  // it comes through blank — never overwrites text Ryan (or BrickScan)
  // already set. Still editable afterward via either field on the
  // review card.
  var DEFAULT_REMARKS_USED = "Typical light play wear, otherwise excellent condition. No cracks or scratches. Fast shipping!";
  var DEFAULT_REMARKS_NEW = "Taken straight out of packaging. Fast shipping!";

  // Maps one BrickScan CSV row to this app's internal shape. Column names
  // (ITEMTYPE/ITEMID/COLOR/REMARKS/DESCRIPTION/QTY/CONDITION/PRICE) match
  // BrickLink's own classic inventory-upload format exactly — confirmed
  // against a real BrickScan export — plus BrickScan's own extra columns
  // (ITEMNAME/COLORNAME/...) used here only for display, never sent to
  // BrickLink. type/itemNo/colorId/newOrUsed are named to match thumbHtml's
  // and catalogImageUrl's existing field expectations directly.
  function csvObjToInventoryRow(obj) {
    var newOrUsed = (obj.CONDITION || "").trim().toUpperCase() === "U" ? "U" : "N";
    var defaultText = newOrUsed === "U" ? DEFAULT_REMARKS_USED : DEFAULT_REMARKS_NEW;
    var remarks = obj.REMARKS || "";
    if (!remarks.trim()) remarks = defaultText;
    var description = obj.DESCRIPTION || "";
    if (!description.trim()) description = defaultText;
    return {
      key: "inv-" + (inventoryRowCounter++),
      include: true,
      type: inventoryTypeWord(obj.ITEMTYPE),
      itemNo: obj.ITEMID || "",
      colorId: parseInt(obj.COLOR, 10) || 0,
      colorName: obj.COLORNAME || "",
      name: decodeHtmlEntities(obj.ITEMNAME || ""),
      quantity: parseInt(obj.QTY, 10) || 1,
      newOrUsed: newOrUsed,
      unitPrice: obj.PRICE || "",
      description: description,
      remarks: remarks,
      location: obj.LOCATION || "",
      stockRoomId: "",
      result: null,
      priceExpanded: false,
    };
  }

  // Keyed on item/color/condition. Takes an explicit cond ("N"/"U") rather
  // than reading row.newOrUsed — the panel now always shows both New and
  // Used listings regardless of which condition the row itself is set to,
  // so each row needs two independent cache entries, not one keyed off its
  // own Condition dropdown.
  function priceGuideKey(row, cond) {
    return row.type + ":" + row.itemNo + ":" + (row.colorId || 0) + ":" + cond;
  }

  var priceGuideCache = {};

  // Fetches both New and Used listings for a row — always both, since
  // Ryan wants to compare pricing across conditions regardless of what
  // condition the item's actually being listed as.
  function fetchPriceGuide(row) {
    var needsRender = false;
    ["N", "U"].forEach(function (cond) {
      var key = priceGuideKey(row, cond);
      if (priceGuideCache[key]) return; // already loading, loaded, or failed for this combo
      priceGuideCache[key] = { loading: true, data: null, error: null };
      needsRender = true;

      var qs = "type=" + encodeURIComponent(row.type) + "&no=" + encodeURIComponent(row.itemNo)
        + "&condition=" + encodeURIComponent(cond)
        + (row.colorId ? "&color=" + encodeURIComponent(row.colorId) : "");

      fetchJSON("/api/price-guide?" + qs).then(function (data) {
        priceGuideCache[key] = { loading: false, data: data, error: null };
        renderInventoryReview();
      }).catch(function (err) {
        priceGuideCache[key] = { loading: false, data: null, error: err.message };
        renderInventoryReview();
      });
    });
    if (needsRender) renderInventoryReview();
  }

  // Reverses INVENTORY_TYPE_CODE_TO_WORD (already confirmed against a real
  // BrickScan export) to get back BrickLink's single-letter item-type code
  // — cross-confirmed as the right code to use here too, since a real
  // captured catalogitem.page URL for a minifig (sw1528) used "M=sw1528",
  // matching this table's M: "MINIFIG" exactly.
  var INVENTORY_TYPE_WORD_TO_CODE = {};
  Object.keys(INVENTORY_TYPE_CODE_TO_WORD).forEach(function (code) {
    INVENTORY_TYPE_WORD_TO_CODE[INVENTORY_TYPE_CODE_TO_WORD[code]] = code;
  });

  // Deep-links to BrickLink's own catalog page, pre-filtered to this row's
  // color (if any), condition, and US-only listings. The #T=S&...&O={...}
  // fragment is copied verbatim (as a literal template, not re-built with
  // encodeURIComponent) from two real URLs captured live off bricklink.com
  // — its "O" param is oddly encoded (only { } " are percent-escaped; :
  // and , are left raw), so matching it exactly avoids guessing at whether
  // a "cleaner" encoding would still parse the same way. Confirmed shapes:
  //   no color (sw1528, New, US):
  //     ...?M=sw1528#T=S&O={"cond":"N","loc":"US","iconly":0}
  //   with color (3001 in Blue/7, New, US):
  //     ...?P=3001#T=S&C=7&O={"color":"7","cond":"N","loc":"US","iconly":0}
  // Color shows up twice — once as its own C= fragment param, once as a
  // string inside O — so both are included when row.colorId is set.
  function bricklinkCatalogUrl(row, cond) {
    var typeCode = INVENTORY_TYPE_WORD_TO_CODE[row.type] || "P";
    var base = "https://www.bricklink.com/v2/catalog/catalogitem.page?" + typeCode + "=" + encodeURIComponent(row.itemNo);
    if (row.colorId) {
      return base + "#T=S&C=" + row.colorId
        + "&O=%7B%22color%22:%22" + row.colorId + "%22,%22cond%22:%22" + cond + "%22,%22loc%22:%22US%22,%22iconly%22:0%7D";
    }
    return base + "#T=S&O=%7B%22cond%22:%22" + cond + "%22,%22loc%22:%22US%22,%22iconly%22:0%7D";
  }

  // Renders one condition's block (New or Used) — always both, regardless
  // of the row's own Condition dropdown, so Ryan can compare pricing
  // across conditions before deciding how to list an item.
  function renderPriceGuideSection(row, cond) {
    var label = cond === "U" ? "Used" : "New";
    var viewOnBricklink = '<a class="price-guide-view-link" href="' + escapeHtml(bricklinkCatalogUrl(row, cond)) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View on BrickLink ↗</a>';
    var state = priceGuideCache[priceGuideKey(row, cond)];
    if (!state || state.loading) {
      return '<div class="price-guide-panel">' + label + ' — Loading active US listings… ' + viewOnBricklink + '</div>';
    }
    if (state.error) {
      return '<div class="price-guide-panel error">' + label + ' — Couldn’t load listings: ' + escapeHtml(state.error) + ' ' + viewOnBricklink + '</div>';
    }
    var data = state.data;
    if (!data.listings.length) {
      return '<div class="price-guide-panel">' + label + ' — No active US listings found. ' + viewOnBricklink + '</div>';
    }
    var statsLine = label
      + " · Min " + formatCurrency(data.minPrice, data.currencyCode)
      + " · Avg " + formatCurrency(data.avgPrice, data.currencyCode)
      + " · Max " + formatCurrency(data.maxPrice, data.currencyCode)
      + " · " + data.totalQuantity + " for sale";
    var rows = data.listings.map(function (l, idx) {
      return '<div class="price-guide-row" data-key="' + escapeHtml(row.key) + '" data-price="' + escapeHtml(l.unitPrice) + '" data-condition="' + cond + '">'
        + '<span class="price-guide-rank">' + (idx + 1) + '</span>'
        + '<span class="price-guide-qty">×' + l.quantity + '</span>'
        + '<span class="price-guide-price mono">' + escapeHtml(formatCurrency(l.unitPrice, data.currencyCode)) + '</span>'
        + (l.shippingAvailable ? '' : '<span class="price-guide-noship">no ship</span>')
        + '</div>';
    }).join("");
    return '<div class="price-guide-panel">'
      + '<div class="price-guide-stats">' + escapeHtml(statsLine) + ' ' + viewOnBricklink + '</div>'
      + '<div class="price-guide-hint">Tap a listing to use its price (also sets Condition)</div>'
      + rows
      + '</div>';
  }

  function renderPriceGuidePanel(row) {
    if (!row.priceExpanded) return "";
    return renderPriceGuideSection(row, "N") + renderPriceGuideSection(row, "U");
  }

  // null = show the upload screen; an array (even empty after filtering)
  // = show the review screen. Persists across navigating away and back
  // (not cleared until "Start over"), same reasoning as itemsCache.
  var inventoryRows = null;
  var inventorySubmitting = false;

  function renderInventoryView() {
    if (!inventoryRows) {
      renderInventoryUpload(null);
    } else {
      renderInventoryReview();
    }
  }

  function renderInventoryUpload(errorMessage) {
    // Nothing to submit yet at this step (also covers "Start over",
    // which returns here without a setTopbarNav call to hide it for us).
    topbarInventorySubmitRow.classList.add("hidden");
    inventoryView.innerHTML = ""
      + '<div class="inventory-intro">Upload a BrickScan CSV export to review items before adding them to your BrickLink inventory. Nothing is sent to BrickLink until you approve it on the next screen.</div>'
      + '<div class="inventory-upload">'
      + '<input type="file" accept=".csv,text/csv" class="inventory-file-input" id="inventoryFileInput">'
      + '</div>'
      + (errorMessage ? '<div class="state-block error">' + escapeHtml(errorMessage) + '</div>' : '');
    document.getElementById("inventoryFileInput").addEventListener("change", handleInventoryFileChange);
  }

  function handleInventoryFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    file.text().then(function (text) {
      var objs = csvTextToObjects(text);
      if (!objs.length) { renderInventoryUpload("No rows found in that file."); return; }
      inventoryRows = objs.map(csvObjToInventoryRow);
      renderInventoryView();
    }).catch(function (err) {
      renderInventoryUpload("Couldn't read that file: " + err.message);
    });
  }

  function computeInventoryTotal() {
    return inventoryRows.filter(function (r) { return r.include; }).reduce(function (sum, r) {
      var price = parseFloat(r.unitPrice);
      var qty = parseInt(r.quantity, 10);
      if (isNaN(price) || isNaN(qty)) return sum;
      return sum + price * qty;
    }, 0);
  }

  function inventorySummaryText() {
    var includedCount = inventoryRows.filter(function (r) { return r.include; }).length;
    return includedCount + " of " + inventoryRows.length + " selected";
  }

  function inventoryTotalText() {
    return formatCurrency(computeInventoryTotal(), "USD");
  }

  function renderInventoryReview() {
    var includedCount = inventoryRows.filter(function (r) { return r.include; }).length;
    var pendingCount = inventoryRows.filter(function (r) { return r.include && !(r.result && r.result.success); }).length;

    var cards = inventoryRows.map(function (row) {
      var locked = !!(row.result && row.result.success);
      var resultHtml = "";
      if (row.result) {
        resultHtml = row.result.success
          ? '<div class="inventory-row-result success">Added to inventory (ID ' + escapeHtml(row.result.inventoryId) + ')</div>'
          : '<div class="inventory-row-result error">' + escapeHtml(row.result.error) + '</div>';
      }
      return ""
        + '<div class="item-row inventory-row' + (!row.include ? ' skipped' : '') + (locked ? ' result-success' : '') + '" data-key="' + escapeHtml(row.key) + '">'
        + '<input type="checkbox" class="inventory-row-check" data-key="' + escapeHtml(row.key) + '"' + (row.include ? ' checked' : '') + (locked ? ' disabled' : '') + '>'
        + '<div class="item-thumb">' + thumbHtml(row) + '<span class="qty-chip">' + row.quantity + '</span></div>'
        + '<div class="item-body">'
        + '<div class="item-line1">'
        + '<span class="item-no mono">' + escapeHtml(row.itemNo) + '</span>'
        + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(row.type) + '</span></span>'
        + '</div>'
        + '<div class="item-name">' + escapeHtml(row.name || "(name unknown)") + '</div>'
        + (row.colorName && row.colorName.trim().toLowerCase() !== "not applicable" ? '<div class="item-color">' + escapeHtml(row.colorName) + '</div>' : '')
        + (row.location ? '<div class="item-color">Bin: ' + escapeHtml(row.location) + '</div>' : '')
        + '<div class="inventory-fields">'
        + '<div class="inventory-field"><label>Qty</label><input type="number" min="1" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="quantity" value="' + escapeHtml(row.quantity) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field"><label>Price</label><input type="text" inputmode="decimal" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="unitPrice" value="' + escapeHtml(row.unitPrice) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field"><label>Condition</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="newOrUsed"' + (locked ? ' disabled' : '') + '>'
        + '<option value="N"' + (row.newOrUsed === "N" ? ' selected' : '') + '>New</option>'
        + '<option value="U"' + (row.newOrUsed === "U" ? ' selected' : '') + '>Used</option>'
        + '</select></div>'
        + '<div class="inventory-field"><label>Color ID</label><input type="number" min="0" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="colorId" value="' + escapeHtml(row.colorId) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field"><label>Stock Room</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="stockRoomId"' + (locked ? ' disabled' : '') + '>'
        + '<option value=""' + (row.stockRoomId === "" ? ' selected' : '') + '>No</option>'
        + '<option value="A"' + (row.stockRoomId === "A" ? ' selected' : '') + '>A</option>'
        + '<option value="B"' + (row.stockRoomId === "B" ? ' selected' : '') + '>B</option>'
        + '<option value="C"' + (row.stockRoomId === "C" ? ' selected' : '') + '>C</option>'
        + '</select></div>'
        + '<div class="inventory-field description-field"><label>Description <span class="field-hint">(shown to buyer)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="description"' + (locked ? ' disabled' : '') + '>' + escapeHtml(row.description) + '</textarea></div>'
        + '<div class="inventory-field remarks-field"><label>Remarks <span class="field-hint">(private, only you see this)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="remarks"' + (locked ? ' disabled' : '') + '>' + escapeHtml(row.remarks) + '</textarea></div>'
        + '</div>'
        + resultHtml
        + '</div>'
        + '<div class="inventory-price-guide-block">'
        + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(row.key) + '">' + (row.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
        + renderPriceGuidePanel(row)
        + '</div>'
        + '</div>';
    }).join("");

    var submitLabel;
    if (inventorySubmitting) {
      submitLabel = "Submitting…";
    } else if (includedCount === 0) {
      submitLabel = "Nothing selected";
    } else if (pendingCount === 0) {
      submitLabel = "All items added";
    } else {
      submitLabel = "Submit " + pendingCount + " item" + (pendingCount === 1 ? "" : "s") + " to BrickLink";
    }

    inventoryView.innerHTML = ""
      + '<div class="inventory-intro">Review each item before it goes live on BrickLink. Uncheck anything you don’t want to add yet, edit price/qty/condition as needed, then submit.</div>'
      + '<div class="inventory-total-row"><span class="inventory-total-label">Total</span><span class="inventory-total-value mono" id="inventoryTotalValue">' + escapeHtml(inventoryTotalText()) + '</span></div>'
      + '<div class="inventory-summary-row">'
      + '<span id="inventorySummaryText">' + escapeHtml(inventorySummaryText()) + '</span>'
      + '<div class="inventory-bulk-actions">'
      + '<button type="button" id="invSelectAllBtn">Select all</button>'
      + '<button type="button" class="inv-start-over-btn">Start over</button>'
      + '</div>'
      + '</div>'
      + cards
      + '<div class="inventory-submit-row">'
      + '<button class="inventory-submit-btn" id="inventorySubmitBtn"' + (pendingCount === 0 || inventorySubmitting ? ' disabled' : '') + '>'
      + submitLabel
      + '</button>'
      + '<button type="button" class="inv-start-over-btn">Start over</button>'
      + '</div>';

    // Mirrors the total + submit button into the sticky topbar so both
    // stay reachable while scrolling a long review list — the in-page
    // ones at top/bottom of the list stay too, same dual pattern as the
    // order-detail page's sticky pick-progress bar.
    topbarInventorySubmitRow.classList.remove("hidden");
    topbarInventoryTotalValue.textContent = inventoryTotalText();
    topbarInventorySubmitBtn.textContent = submitLabel;
    topbarInventorySubmitBtn.disabled = pendingCount === 0 || inventorySubmitting;

    wireThumbLinks(inventoryView);
    sizeThumbsToRows(inventoryView);

    inventoryView.querySelectorAll(".inventory-row-check").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (row) row.include = el.checked;
        renderInventoryReview();
      });
    });

    inventoryView.querySelectorAll(".inv-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        var field = el.getAttribute("data-field");
        if (field === "quantity" || field === "colorId") {
          row[field] = parseInt(el.value, 10) || 0;
        } else {
          row[field] = el.value;
        }
        // colorId changes which item+color the price guide looks up (a
        // different cache key) — re-fetch if that panel is open. newOrUsed
        // no longer affects the panel at all (both conditions are always
        // fetched), so it needs no re-fetch or re-render. Other fields
        // don't need a re-render either; doing one on every
        // keystroke-triggering "change" would drop focus mid-edit for no
        // benefit, since qty/price/remarks don't affect anything else shown.
        if (field === "colorId") {
          if (row.priceExpanded) fetchPriceGuide(row); else renderInventoryReview();
        } else if (field === "quantity" || field === "unitPrice") {
          // Keep the running total live without a full re-render, which
          // would otherwise drop focus mid-edit (see comment above).
          var totalEl = document.getElementById("inventoryTotalValue");
          if (totalEl) totalEl.textContent = inventoryTotalText();
          topbarInventoryTotalValue.textContent = inventoryTotalText();
        }
      });
    });

    inventoryView.querySelectorAll(".price-guide-toggle-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.priceExpanded = !row.priceExpanded;
        if (row.priceExpanded) fetchPriceGuide(row);
        renderInventoryReview();
      });
    });

    inventoryView.querySelectorAll(".price-guide-row").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.unitPrice = el.getAttribute("data-price");
        // Tapping a Used-section listing while the row's still set to New
        // (or vice versa) would otherwise leave the price and the declared
        // Condition mismatched — syncing them here keeps a tapped price
        // honest about which condition it actually came from.
        row.newOrUsed = el.getAttribute("data-condition") === "U" ? "U" : "N";
        renderInventoryReview();
      });
    });

    var selectAllBtn = document.getElementById("invSelectAllBtn");
    if (selectAllBtn) {
      selectAllBtn.addEventListener("click", function () {
        var allIncluded = inventoryRows.every(function (r) { return r.include || (r.result && r.result.success); });
        inventoryRows.forEach(function (r) { if (!(r.result && r.result.success)) r.include = !allIncluded; });
        renderInventoryReview();
      });
    }

    inventoryView.querySelectorAll(".inv-start-over-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!window.confirm("Discard this list and upload a different file?")) return;
        inventoryRows = null;
        renderInventoryView();
      });
    });

    var submitBtn = document.getElementById("inventorySubmitBtn");
    if (submitBtn) {
      submitBtn.addEventListener("click", handleInventorySubmit);
    }
  }

  function findInventoryRow(key) {
    return inventoryRows.filter(function (r) { return r.key === key; })[0] || null;
  }

  function handleInventorySubmit() {
    var toSubmit = inventoryRows.filter(function (r) { return r.include && !(r.result && r.result.success); });
    if (!toSubmit.length) return;
    if (!window.confirm("Add " + toSubmit.length + " item" + (toSubmit.length === 1 ? "" : "s") + " to your live BrickLink inventory? This makes them visible/purchasable on your store right away.")) return;

    inventorySubmitting = true;
    renderInventoryReview();

    postJSON("/api/inventory-create", {
      items: toSubmit.map(function (r) {
        return {
          key: r.key, type: r.type, itemNo: r.itemNo, colorId: r.colorId,
          quantity: r.quantity, newOrUsed: r.newOrUsed, unitPrice: r.unitPrice,
          description: r.description, remarks: r.remarks, stockRoomId: r.stockRoomId,
        };
      }),
    }).then(function (res) {
      // A 200 response with no (or a malformed) results array shouldn't
      // be possible per inventory-create.js's own code, but silently
      // no-op'ing here if it ever happened would look exactly like
      // nothing-happened-at-all from the review screen — surfacing it as
      // a real error instead means a genuine bug never goes unnoticed.
      if (!res || !Array.isArray(res.results)) {
        throw new Error("Got an unexpected response from the server — nothing was confirmed added. Please try again.");
      }
      res.results.forEach(function (result) {
        var row = findInventoryRow(result.key);
        if (row) row.result = result;
      });
    }).catch(function (err) {
      window.alert("Couldn't reach the server to submit these items: " + err.message);
    }).finally(function () {
      inventorySubmitting = false;
      renderInventoryReview();
    });
  }

  // ---- Label Prep ----
  // Shrinks a 4x6 Pirate Ship shipping label PDF/image to half size,
  // rotates it, and places it in one corner of a fresh 4x6 canvas — the
  // blank remainder doubles as tape for small-box orders. Rotation/
  // position are a one-time setting (persisted to localStorage), not a
  // per-label adjustment: Ryan dials them in once for how he actually
  // tapes boxes, and every label after that gets the same treatment.
  var LABEL_DPI = 300;
  var LABEL_CANVAS_W = 4 * LABEL_DPI;
  var LABEL_CANVAS_H = 6 * LABEL_DPI;
  var LABEL_PREP_SETTINGS_KEY = "labelPrepSettings";

  // Locked in from real-world testing with an actual Pirate Ship label
  // (not a slider anymore — Ryan dialed this in once and it's fixed now).
  // 67% filled the corner correctly but left content sitting flush
  // against — or, at 90°/270°, briefly overflowing past — the canvas
  // edges it's anchored to. Sized down slightly to 64% so the footprint
  // (including the 90° case, where the label's own height becomes the
  // on-canvas width) actually fits inside the canvas with room for
  // LABEL_EDGE_BUFFER on every edge it touches, not just flush/clipped.
  var LABEL_SCALE = 0.64;
  var LABEL_EDGE_BUFFER = LABEL_CANVAS_W * 0.02;

  function loadLabelPrepSettings() {
    var defaults = { rotation: 90, position: "top-right" };
    try {
      var raw = window.localStorage.getItem(LABEL_PREP_SETTINGS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        return {
          rotation: parsed.rotation || defaults.rotation,
          position: parsed.position || defaults.position,
        };
      }
    } catch (e) { /* fall through to defaults */ }
    return defaults;
  }
  function saveLabelPrepSettings() {
    try { window.localStorage.setItem(LABEL_PREP_SETTINGS_KEY, JSON.stringify(labelPrepSettings)); } catch (e) { /* best-effort */ }
  }

  var labelPrepSettings = loadLabelPrepSettings();
  var labelPrepSource = null; // { el: <img|canvas>, naturalWidth, naturalHeight }
  var labelPrepFileName = "";
  var labelPrepError = "";
  var labelPrepLoading = false;

  var LABEL_PREP_POSITIONS = [
    ["top-left", "Top-left"],
    ["top-right", "Top-right"],
    ["bottom-left", "Bottom-left"],
    ["bottom-right", "Bottom-right"],
    ["center", "Center"],
  ];

  function renderLabelPrepView() {
    labelPrepView.innerHTML = ""
      + '<div class="inventory-intro">Shrink a 4×6 Pirate Ship shipping label, rotate it, and tuck it into one corner — the blank remainder doubles as tape for small-box orders. Rotation and position are remembered, so you only need to set them once.</div>'
      + '<div class="inventory-upload"><input type="file" accept="application/pdf,image/*" class="inventory-file-input" id="labelPrepFileInput"></div>'
      + '<div class="inventory-fields">'
      + '<div class="inventory-field"><label>Rotation</label><select id="labelPrepRotation">'
      + [0, 90, 180, 270].map(function (deg) {
          return '<option value="' + deg + '"' + (labelPrepSettings.rotation === deg ? ' selected' : '') + '>' + deg + '°</option>';
        }).join('')
      + '</select></div>'
      + '<div class="inventory-field"><label>Position</label><select id="labelPrepPosition">'
      + LABEL_PREP_POSITIONS.map(function (p) {
          return '<option value="' + p[0] + '"' + (labelPrepSettings.position === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
        }).join('')
      + '</select></div>'
      + '</div>'
      + (labelPrepLoading ? '<div class="state-block">Loading label…</div>' : '')
      + (labelPrepError ? '<div class="state-block error">' + escapeHtml(labelPrepError) + '</div>' : '')
      + (labelPrepSource ? '<canvas id="labelPrepCanvas" class="label-prep-canvas"></canvas>' : '')
      + (labelPrepSource ? '<div class="inventory-submit-row"><button type="button" class="inventory-submit-btn" id="labelPrepDownloadBtn">Download PDF</button></div>' : '');

    document.getElementById("labelPrepFileInput").addEventListener("change", handleLabelPrepFile);

    document.getElementById("labelPrepRotation").addEventListener("change", function (e) {
      labelPrepSettings.rotation = parseInt(e.target.value, 10);
      saveLabelPrepSettings();
      drawLabelPrepOutput();
    });

    document.getElementById("labelPrepPosition").addEventListener("change", function (e) {
      labelPrepSettings.position = e.target.value;
      saveLabelPrepSettings();
      drawLabelPrepOutput();
    });

    if (labelPrepSource) {
      drawLabelPrepOutput();
      document.getElementById("labelPrepDownloadBtn").addEventListener("click", downloadLabelPrepPdf);
    }
  }

  function handleLabelPrepFile(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    labelPrepError = "";
    labelPrepSource = null;
    labelPrepLoading = true;
    labelPrepFileName = file.name || "label";
    renderLabelPrepView();

    var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
    var loadPromise = isPdf ? loadLabelPrepFromPdf(file) : loadLabelPrepFromImage(file);

    loadPromise.then(function (source) {
      labelPrepSource = source;
      labelPrepLoading = false;
      renderLabelPrepView();
    }).catch(function (err) {
      labelPrepError = "Couldn't read that file: " + err.message;
      labelPrepLoading = false;
      renderLabelPrepView();
    });
  }

  function loadLabelPrepFromImage(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        resolve({ el: img, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight });
      };
      img.onerror = function () { reject(new Error("Not a readable image file")); };
      img.src = URL.createObjectURL(file);
    });
  }

  // Renders the PDF's first page to an offscreen canvas at LABEL_DPI, so
  // the rest of the pipeline treats a PDF upload exactly like an image
  // upload — just another drawable source with a known pixel size.
  function loadLabelPrepFromPdf(file) {
    if (!window.pdfjsLib) return Promise.reject(new Error("PDF support is still loading — try again in a second"));
    return file.arrayBuffer().then(function (buf) {
      return window.pdfjsLib.getDocument({
        data: buf,
        standardFontDataUrl: "/vendor/pdfjs/standard_fonts/",
      }).promise;
    }).then(function (pdf) {
      return pdf.getPage(1);
    }).then(function (page) {
      // Page geometry is in points (1/72in) — scale to LABEL_DPI for a
      // print-quality raster, whatever the label's actual page size is.
      var viewport = page.getViewport({ scale: LABEL_DPI / 72 });
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      var ctx = canvas.getContext("2d");
      return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
        return { el: canvas, naturalWidth: canvas.width, naturalHeight: canvas.height };
      });
    });
  }

  function drawLabelPrepOutput() {
    if (!labelPrepSource) return;
    var canvas = document.getElementById("labelPrepCanvas");
    if (!canvas) return;
    canvas.width = LABEL_CANVAS_W;
    canvas.height = LABEL_CANVAS_H;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, LABEL_CANVAS_W, LABEL_CANVAS_H);

    var scaledW = labelPrepSource.naturalWidth * LABEL_SCALE;
    var scaledH = labelPrepSource.naturalHeight * LABEL_SCALE;

    var angle = labelPrepSettings.rotation;
    var angleRad = angle * Math.PI / 180;
    // A 90°/270° rotation swaps which of the scaled label's own
    // dimensions determines the on-canvas footprint's width vs height.
    var rotated = angle === 90 || angle === 270;
    var footprintW = rotated ? scaledH : scaledW;
    var footprintH = rotated ? scaledW : scaledH;

    // Every non-center position insets from the two canvas edges it's
    // anchored to by LABEL_EDGE_BUFFER, so content never sits flush
    // against — or, worse, overflows past — the physical label edge.
    var x, y;
    switch (labelPrepSettings.position) {
      case "top-right": x = LABEL_CANVAS_W - footprintW - LABEL_EDGE_BUFFER; y = LABEL_EDGE_BUFFER; break;
      case "bottom-left": x = LABEL_EDGE_BUFFER; y = LABEL_CANVAS_H - footprintH - LABEL_EDGE_BUFFER; break;
      case "bottom-right": x = LABEL_CANVAS_W - footprintW - LABEL_EDGE_BUFFER; y = LABEL_CANVAS_H - footprintH - LABEL_EDGE_BUFFER; break;
      case "center": x = (LABEL_CANVAS_W - footprintW) / 2; y = (LABEL_CANVAS_H - footprintH) / 2; break;
      default: x = LABEL_EDGE_BUFFER; y = LABEL_EDGE_BUFFER; // top-left
    }

    // Rotating around the block's own center (after translating to where
    // that center should land) correctly handles all four angles and all
    // five position presets through one code path, rather than
    // special-casing each rotation's placement math separately.
    ctx.save();
    ctx.translate(x + footprintW / 2, y + footprintH / 2);
    ctx.rotate(angleRad);
    ctx.drawImage(labelPrepSource.el, -scaledW / 2, -scaledH / 2, scaledW, scaledH);
    ctx.restore();
  }

  // Builds a PDF (not just a PNG) so the output can carry the label's own
  // physical page size, and hands it off as a Blob URL rather than a data:
  // URL — the old data:-URL `<a download>` click silently did nothing on
  // iOS Safari/WebKit (Ryan's "Chrome on iOS", same underlying engine
  // that mishandled Set-Cookie from fetch() earlier in this app): WebKit
  // doesn't reliably honor the download attribute for data: URLs. A Blob
  // URL either downloads directly (desktop browsers) or opens in Safari's
  // own PDF viewer, which has a working Share/Save-to-Files button either
  // way, so it degrades gracefully instead of doing nothing.
  function downloadLabelPrepPdf() {
    var canvas = document.getElementById("labelPrepCanvas");
    if (!canvas || !window.PDFLib) return;
    var base = (labelPrepFileName || "label").replace(/\.[^.]+$/, "");
    var pageWidthPt = (LABEL_CANVAS_W / LABEL_DPI) * 72;
    var pageHeightPt = (LABEL_CANVAS_H / LABEL_DPI) * 72;
    canvas.toBlob(function (pngBlob) {
      if (!pngBlob) return;
      pngBlob.arrayBuffer().then(function (pngBytes) {
        return window.PDFLib.PDFDocument.create().then(function (pdfDoc) {
          return pdfDoc.embedPng(pngBytes).then(function (pngImage) {
            var page = pdfDoc.addPage([pageWidthPt, pageHeightPt]);
            page.drawImage(pngImage, { x: 0, y: 0, width: pageWidthPt, height: pageHeightPt });
            return pdfDoc.save();
          });
        });
      }).then(function (pdfBytes) {
        var blob = new Blob([pdfBytes], { type: "application/pdf" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = base + "-2x3.pdf";
        link.target = "_blank";
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      });
    }, "image/png");
  }

  // ---- Manage Inventory ----
  // Edits Ryan's *existing* live BrickLink listings (hundreds of parts,
  // figs, and sets) — a different job from Add Inventory, which only
  // stages brand-new rows for a one-time bulk create. Search-first by
  // design: GET /inventories returns all ~800+ rows in one unpaginated
  // call, so the page fetches once and filters client-side rather than
  // rendering everything at once, which would be slow on a phone and
  // mostly useless to scroll through. Color and the item itself aren't
  // editable here — both are part of a listing's identity, not something
  // you'd change after the fact — and there's no Bin field, because
  // BrickLink's own inventory data has no such concept; the Bin shown on
  // Add Inventory comes entirely from Ryan's own CSV export.
  //
  // Edits are staged locally (a "Review, then submit" batch, same model
  // as Add Inventory) rather than auto-saved per field — dirty rows are
  // tracked against a snapshot of what was actually loaded from
  // BrickLink, survive switching searches, and only reach BrickLink when
  // Submit is tapped and confirmed.
  var manageInventoryRows = null; // null = not fetched yet
  var manageInventoryLoading = false;
  var manageInventoryError = "";
  var manageInventorySearchQuery = "";
  var manageInventorySubmitting = false;
  var manageInventorySearchDebounceTimer = null;
  var MANAGE_INVENTORY_RESULT_CAP = 50;
  // Browse-by-type-then-theme navigation, shown when the search box is
  // empty. browseType null = showing the type breakdown; set = showing
  // that type's theme/category breakdown (browseCategory null) or that
  // type+category's item list (browseCategory set, "" means "all items
  // of this type, uncategorized by theme").
  var manageInventoryBrowseType = null;
  var manageInventoryBrowseCategory = null;
  var manageInventoryBrowseRecent = false;
  var manageInventoryCategoriesLoading = false;
  var manageInventorySortKey = "itemNoAsc"; // itemNoAsc | itemNoDesc | newest | oldest
  var manageInventoryRecentDays = 30; // 15 | 30
  // Whether any row actually came back with a dateCreated — BrickLink's
  // date_created field isn't confirmed against a real response the way
  // the rest of this shape is (see inventory-list.js), so the
  // newest/oldest sort options and the Recently Added browse entry both
  // check this and quietly hide themselves if it's not really there,
  // rather than offering a feature that can't work.
  var manageInventoryHasDates = false;

  function fetchManageInventory() {
    manageInventoryLoading = true;
    manageInventoryError = "";
    renderManageInventoryView();

    fetchJSON("/api/inventory-list").then(function (res) {
      // BrickLink's catalog text sometimes carries raw HTML entities
      // (e.g. "&#40;" for "(") — same quirk decoded for order items and
      // CSV-imported inventory names elsewhere in this app.
      manageInventoryRows = (res.items || []).map(function (item) {
        var description = decodeHtmlEntities(item.description);
        var remarks = decodeHtmlEntities(item.remarks);
        var snapshot = {
          quantity: item.quantity, newOrUsed: item.newOrUsed, unitPrice: item.unitPrice,
          description: description, remarks: remarks,
        };
        return {
          key: item.key,
          inventoryId: item.inventoryId,
          itemNo: item.itemNo,
          type: item.type,
          categoryId: item.categoryId || 0,
          name: decodeHtmlEntities(item.name),
          colorId: item.colorId,
          colorName: item.colorName,
          quantity: item.quantity,
          newOrUsed: item.newOrUsed,
          unitPrice: item.unitPrice,
          description: description,
          remarks: remarks,
          dateCreated: item.dateCreated || null,
          orig: snapshot,
          result: null,
        };
      });
      manageInventoryHasDates = manageInventoryRows.some(function (r) { return !!r.dateCreated; });
    }).catch(function (err) {
      manageInventoryError = "Couldn't load your inventory: " + err.message;
    }).finally(function () {
      manageInventoryLoading = false;
      renderManageInventoryView();
    });
  }

  function findManageInventoryRow(key) {
    return (manageInventoryRows || []).filter(function (r) { return r.key === key; })[0] || null;
  }

  function isManageInventoryRowDirty(row) {
    return row.quantity !== row.orig.quantity
      || row.newOrUsed !== row.orig.newOrUsed
      || String(row.unitPrice) !== String(row.orig.unitPrice)
      || row.description !== row.orig.description
      || row.remarks !== row.orig.remarks;
  }

  // BrickLink item numbers mix pure-digit ("3001") and letter-prefixed
  // ("sw0359") forms — { numeric: true } makes localeCompare treat the
  // digit runs in each as numbers rather than comparing them character
  // by character, so "87079" correctly sorts after "3001" instead of
  // before it.
  function compareManageInventoryItemNo(a, b) {
    return (a.itemNo || "").localeCompare(b.itemNo || "", undefined, { numeric: true, sensitivity: "base" });
  }
  function compareManageInventoryDate(a, b) {
    var ta = a.dateCreated ? new Date(a.dateCreated).getTime() : 0;
    var tb = b.dateCreated ? new Date(b.dateCreated).getTime() : 0;
    return ta - tb;
  }
  function manageInventorySortRows(rows) {
    var key = manageInventorySortKey;
    var sorted = rows.slice();
    sorted.sort(function (a, b) {
      if (key === "itemNoDesc") return compareManageInventoryItemNo(b, a);
      if (key === "newest") return compareManageInventoryDate(b, a);
      if (key === "oldest") return compareManageInventoryDate(a, b);
      return compareManageInventoryItemNo(a, b);
    });
    return sorted;
  }
  function manageInventorySortSelectHtml() {
    var dateOptions = manageInventoryHasDates
      ? '<option value="newest"' + (manageInventorySortKey === "newest" ? ' selected' : '') + '>Newest first</option>'
        + '<option value="oldest"' + (manageInventorySortKey === "oldest" ? ' selected' : '') + '>Oldest first</option>'
      : '';
    return '<select class="manage-inventory-sort-select" id="manageInventorySortSelect">'
      + '<option value="itemNoAsc"' + (manageInventorySortKey === "itemNoAsc" ? ' selected' : '') + '>Item # (low→high)</option>'
      + '<option value="itemNoDesc"' + (manageInventorySortKey === "itemNoDesc" ? ' selected' : '') + '>Item # (high→low)</option>'
      + dateOptions
      + '</select>';
  }

  function manageInventoryRecentRows(days) {
    var cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
    return (manageInventoryRows || []).filter(function (r) {
      if (!r.dateCreated) return false;
      var t = new Date(r.dateCreated).getTime();
      return !isNaN(t) && t >= cutoff;
    });
  }

  // Lots = distinct listings/rows (BrickLink's own unit — one row per
  // item+color+condition combo); items = total pieces (sum of
  // quantities across those lots) — the two numbers differ any time a
  // lot has quantity > 1, and conflating them ("N items" meaning "N
  // rows") is exactly the mislabeling this replaces.
  function manageInventoryStats(rows) {
    var items = 0, value = 0;
    rows.forEach(function (r) {
      var qty = parseInt(r.quantity, 10) || 0;
      var price = parseFloat(r.unitPrice) || 0;
      items += qty;
      value += qty * price;
    });
    return { lots: rows.length, items: items, value: value };
  }
  function manageInventoryStatsHtml(stats) {
    return '<div class="manage-inventory-stats">'
      + '<span class="manage-inventory-stat"><strong>' + stats.lots + '</strong> lot' + (stats.lots === 1 ? '' : 's') + '</span>'
      + '<span class="manage-inventory-stat"><strong>' + stats.items + '</strong> item' + (stats.items === 1 ? '' : 's') + '</span>'
      + '<span class="manage-inventory-stat"><strong>' + escapeHtml(formatCurrency(stats.value, "USD")) + '</strong>Total value</span>'
      + '</div>';
  }

  function manageInventoryTypeCounts() {
    var counts = {};
    (manageInventoryRows || []).forEach(function (r) {
      counts[r.type] = (counts[r.type] || 0) + 1;
    });
    return counts;
  }

  function manageInventoryThemeCounts(type) {
    var counts = {}; // topCategoryId (string) -> { name, count }
    (manageInventoryRows || []).forEach(function (r) {
      if (r.type !== type) return;
      var topId = r.categoryId ? topCategoryId(r.categoryId, categoriesById) : 0;
      var key = String(topId || 0);
      if (!counts[key]) counts[key] = { name: categoryDisplayNameById(topId), count: 0 };
      counts[key].count++;
    });
    return counts;
  }

  function manageInventoryBreadcrumb() {
    var parts = ['<button type="button" class="browse-crumb" data-browse-reset="type">All types</button>'];
    if (manageInventoryBrowseRecent) {
      parts.push('<span class="browse-crumb-current">Recently Added</span>');
    } else if (manageInventoryBrowseType) {
      if (manageInventoryBrowseCategory !== null) {
        parts.push('<button type="button" class="browse-crumb" data-browse-reset="category">' + escapeHtml(manageInventoryBrowseType) + '</button>');
        parts.push('<span class="browse-crumb-current">' + escapeHtml(categoryDisplayNameById(manageInventoryBrowseCategory)) + '</span>');
      } else {
        parts.push('<span class="browse-crumb-current">' + escapeHtml(manageInventoryBrowseType) + '</span>');
      }
    }
    return '<div class="browse-breadcrumb">' + parts.join('<span class="browse-crumb-sep">›</span>') + '</div>';
  }

  // The navigation screen shown when the search box is empty: item type
  // breakdown → theme/category breakdown within that type → flat item
  // list within that theme. Reuses manageInventoryCardHtml for the final
  // list so editing works exactly like a search result.
  function manageInventoryBrowseHtml(dirtyCount) {
    var hint = dirtyCount
      ? '<div class="manage-inventory-hint">You have ' + dirtyCount + ' unsaved change' + (dirtyCount === 1 ? '' : 's') + ' — browsing won’t lose them.</div>'
      : '';

    if (manageInventoryBrowseRecent) {
      var recentRows = manageInventorySortRows(manageInventoryRecentRows(manageInventoryRecentDays));
      var cappedRecent = recentRows.slice(0, MANAGE_INVENTORY_RESULT_CAP);
      return hint
        + manageInventoryBreadcrumb()
        + manageInventoryStatsHtml(manageInventoryStats(recentRows))
        + '<div class="manage-inventory-sort-row">'
        + '<select class="manage-inventory-sort-select" id="manageInventoryRecentWindowSelect">'
        + '<option value="15"' + (manageInventoryRecentDays === 15 ? ' selected' : '') + '>Last 15 days</option>'
        + '<option value="30"' + (manageInventoryRecentDays === 30 ? ' selected' : '') + '>Last 30 days</option>'
        + '</select>'
        + manageInventorySortSelectHtml()
        + '</div>'
        + cappedRecent.map(manageInventoryCardHtml).join("")
        + (recentRows.length > cappedRecent.length ? '<div class="manage-inventory-cap-note">Showing the first ' + cappedRecent.length + ' of ' + recentRows.length + ' items — search above to find a specific one.</div>' : '');
    }

    if (!manageInventoryBrowseType) {
      var typeCounts = manageInventoryTypeCounts();
      var types = Object.keys(typeCounts).sort(function (a, b) { return typeCounts[b] - typeCounts[a]; });
      var typeTiles = types.map(function (t) {
        return '<button type="button" class="browse-tile" data-browse-type="' + escapeHtml(t) + '">'
          + '<span class="browse-tile-name">' + escapeHtml(t) + '</span>'
          + '<span class="browse-tile-count">' + typeCounts[t] + '</span>'
          + '</button>';
      }).join("");
      var recentTile = manageInventoryHasDates
        ? '<button type="button" class="browse-tile browse-tile-recent" data-browse-recent="1">'
          + '<span class="browse-tile-name">Recently Added</span>'
          + '<span class="browse-tile-count">' + manageInventoryRecentRows(manageInventoryRecentDays).length + '</span>'
          + '</button>'
        : '';
      return hint
        + manageInventoryStatsHtml(manageInventoryStats(manageInventoryRows || []))
        + '<div class="manage-inventory-hint">Browse by item type, or search above by name or item number.</div>'
        + '<div class="browse-tile-list">' + recentTile + typeTiles + '</div>';
    }

    if (!categoriesById) {
      if (!manageInventoryCategoriesLoading) {
        manageInventoryCategoriesLoading = true;
        getCategories().then(function () {
          manageInventoryCategoriesLoading = false;
          renderManageInventoryResults();
        }).catch(function () {
          manageInventoryCategoriesLoading = false;
          renderManageInventoryResults();
        });
      }
      return hint + manageInventoryBreadcrumb() + '<div class="state-block">Loading themes…</div>';
    }

    if (manageInventoryBrowseCategory === null) {
      var themeCounts = manageInventoryThemeCounts(manageInventoryBrowseType);
      var themeIds = Object.keys(themeCounts).sort(function (a, b) { return themeCounts[b].count - themeCounts[a].count; });
      var themeTiles = themeIds.map(function (id) {
        var t = themeCounts[id];
        return '<button type="button" class="browse-tile" data-browse-category="' + escapeHtml(id) + '">'
          + '<span class="browse-tile-name">' + escapeHtml(t.name) + '</span>'
          + '<span class="browse-tile-count">' + t.count + '</span>'
          + '</button>';
      }).join("");
      var typeRows = (manageInventoryRows || []).filter(function (r) { return r.type === manageInventoryBrowseType; });
      return hint
        + manageInventoryBreadcrumb()
        + manageInventoryStatsHtml(manageInventoryStats(typeRows))
        + '<div class="manage-inventory-hint">Browse ' + escapeHtml(manageInventoryBrowseType) + ' by theme/category.'
        + (manageInventoryBrowseType === 'PART' ? ' (Parts mostly don’t have a real theme — this is BrickLink’s physical category tree instead, e.g. Bricks, Plates.)' : '')
        + '</div>'
        + '<div class="browse-tile-list">' + themeTiles + '</div>';
    }

    var catId = manageInventoryBrowseCategory;
    var filtered = manageInventorySortRows((manageInventoryRows || []).filter(function (r) {
      if (r.type !== manageInventoryBrowseType) return false;
      var topId = r.categoryId ? topCategoryId(r.categoryId, categoriesById) : 0;
      return String(topId || 0) === catId;
    }));
    var capped = filtered.slice(0, MANAGE_INVENTORY_RESULT_CAP);
    return hint
      + manageInventoryBreadcrumb()
      + manageInventoryStatsHtml(manageInventoryStats(filtered))
      + '<div class="manage-inventory-sort-row">' + manageInventorySortSelectHtml() + '</div>'
      + capped.map(manageInventoryCardHtml).join("")
      + (filtered.length > capped.length ? '<div class="manage-inventory-cap-note">Showing the first ' + capped.length + ' of ' + filtered.length + ' items — search above to find a specific one.</div>' : '');
  }

  function manageInventoryMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q || !manageInventoryRows) return [];
    return manageInventoryRows.filter(function (r) {
      return (r.itemNo && r.itemNo.toLowerCase().indexOf(q) !== -1)
        || (r.name && r.name.toLowerCase().indexOf(q) !== -1);
    });
  }

  function manageInventoryCardHtml(row) {
    var resultHtml = "";
    if (row.result) {
      resultHtml = row.result.success
        ? '<div class="inventory-row-result success">Updated on BrickLink</div>'
        : '<div class="inventory-row-result error">' + escapeHtml(row.result.error) + '</div>';
    }
    return ""
      + '<div class="item-row inventory-row' + (isManageInventoryRowDirty(row) ? ' row-dirty' : '') + '" data-key="' + escapeHtml(row.key) + '">'
      + '<div class="item-thumb">' + thumbHtml(row) + '<span class="qty-chip">' + row.quantity + '</span></div>'
      + '<div class="item-body">'
      + '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(row.itemNo) + '</span>'
      + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(row.type) + '</span></span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(row.name || "(name unknown)") + '</div>'
      + (row.colorName && row.colorName.trim().toLowerCase() !== "not applicable" ? '<div class="item-color">' + escapeHtml(row.colorName) + '</div>' : '')
      + '<div class="inventory-fields">'
      + '<div class="inventory-field"><label>Qty</label><input type="number" min="1" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="quantity" value="' + escapeHtml(row.quantity) + '"></div>'
      + '<div class="inventory-field"><label>Price</label><input type="text" inputmode="decimal" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="unitPrice" value="' + escapeHtml(row.unitPrice) + '"></div>'
      + '<div class="inventory-field"><label>Condition</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="newOrUsed">'
      + '<option value="N"' + (row.newOrUsed === "N" ? ' selected' : '') + '>New</option>'
      + '<option value="U"' + (row.newOrUsed === "U" ? ' selected' : '') + '>Used</option>'
      + '</select></div>'
      + '<div class="inventory-field description-field"><label>Description <span class="field-hint">(shown to buyer)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="description">' + escapeHtml(row.description) + '</textarea></div>'
      + '<div class="inventory-field remarks-field"><label>Remarks <span class="field-hint">(private, only you see this)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="remarks">' + escapeHtml(row.remarks) + '</textarea></div>'
      + '</div>'
      + '<a class="item-bl-link" href="' + escapeHtml(bricklinkCatalogUrl(row, row.newOrUsed === "U" ? "U" : "N")) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View on BrickLink ↗</a>'
      + resultHtml
      + '</div>'
      + '</div>';
  }

  // Recomputes the dirty count and updates just the persistent submit bar
  // in place (text, disabled state, show/hide) — not a full results
  // re-render, so a field's own "change" handler never yanks focus
  // elsewhere on the page the way re-rendering the whole card list would.
  function updateManageInventorySubmitBar() {
    var dirtyCount = (manageInventoryRows || []).filter(isManageInventoryRowDirty).length;
    var label = manageInventorySubmitting ? "Submitting…" : "Submit " + dirtyCount + " change" + (dirtyCount === 1 ? "" : "s") + " to BrickLink";
    var disabled = dirtyCount === 0 || manageInventorySubmitting;

    var row = document.getElementById("manageInventorySubmitRow");
    var btn = document.getElementById("manageInventorySubmitBtn");
    var cancelBtn = document.getElementById("manageInventoryCancelBtn");
    if (row && btn) {
      row.style.display = dirtyCount ? "" : "none";
      btn.textContent = label;
      btn.disabled = disabled;
    }
    if (cancelBtn) cancelBtn.disabled = disabled;

    // Sticky topbar mirror — a static node outside the re-rendered
    // results area, so it's kept in sync here too rather than only in
    // the innerHTML string above (same dual pattern as Add Inventory's
    // topbarInventorySubmitRow).
    topbarManageSubmitRow.classList.toggle("hidden", !dirtyCount);
    topbarManageSubmitBtn.textContent = label;
    topbarManageSubmitBtn.disabled = disabled;
    topbarManageCancelBtn.disabled = disabled;
  }

  // Rebuilds only the results area below the search box, leaving the
  // search <input> itself untouched — recreating it on every keystroke
  // (even debounced) would steal focus/cursor position right back out
  // from under whatever Ryan just typed.
  function renderManageInventoryResults() {
    var container = document.getElementById("manageInventoryResults");
    if (!container) return;
    var query = manageInventorySearchQuery.trim();
    var dirtyCount = manageInventoryRows ? manageInventoryRows.filter(isManageInventoryRowDirty).length : 0;

    var body = "";
    if (manageInventoryLoading) {
      body = '<div class="state-block">Loading your inventory…</div>';
    } else if (manageInventoryError) {
      body = '<div class="state-block error">' + escapeHtml(manageInventoryError) + '</div>'
        + '<div class="inventory-submit-row"><button type="button" class="inventory-submit-btn" id="manageInventoryRetryBtn">Retry</button></div>';
    } else if (!manageInventoryRows) {
      body = "";
    } else if (!query) {
      body = manageInventoryBrowseHtml(dirtyCount);
    } else {
      var matches = manageInventoryMatches(query);
      var capped = matches.slice(0, MANAGE_INVENTORY_RESULT_CAP);
      body = '<div class="inventory-summary-row">'
        + '<span>' + matches.length + ' match' + (matches.length === 1 ? '' : 'es') + '</span>'
        + '<div class="inventory-bulk-actions"><button type="button" id="manageInventoryRefreshBtn">Refresh</button></div>'
        + '</div>'
        + capped.map(manageInventoryCardHtml).join("")
        + (matches.length > capped.length ? '<div class="manage-inventory-cap-note">Showing the first ' + capped.length + ' of ' + matches.length + ' matches — refine your search to see the rest.</div>' : '');
    }

    // Always present once rows are loaded (even with 0 matches or an
    // empty search), just hidden when nothing's dirty — so field edits
    // can show/update it via updateManageInventorySubmitBar() without
    // needing to insert or remove it from the DOM.
    if (manageInventoryRows && !manageInventoryLoading) {
      body += '<div class="inventory-submit-row" id="manageInventorySubmitRow" style="display:' + (dirtyCount ? '' : 'none') + '">'
        + '<button class="inventory-submit-btn" id="manageInventorySubmitBtn"' + (dirtyCount === 0 || manageInventorySubmitting ? ' disabled' : '') + '>'
        + (manageInventorySubmitting ? "Submitting…" : "Submit " + dirtyCount + " change" + (dirtyCount === 1 ? "" : "s") + " to BrickLink")
        + '</button>'
        + '<button type="button" class="inv-start-over-btn" id="manageInventoryCancelBtn"' + (dirtyCount === 0 || manageInventorySubmitting ? ' disabled' : '') + '>Cancel changes</button>'
        + '</div>';
    }

    container.innerHTML = body;
    updateManageInventorySubmitBar();

    wireThumbLinks(container);
    sizeThumbsToRows(container);

    container.querySelectorAll(".inv-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findManageInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        var field = el.getAttribute("data-field");
        row[field] = field === "quantity" ? (parseInt(el.value, 10) || 0) : el.value;
        row.result = null;
        var rowEl = el.closest(".item-row");
        if (rowEl) rowEl.classList.toggle("row-dirty", isManageInventoryRowDirty(row));
        updateManageInventorySubmitBar();
      });
    });

    container.querySelectorAll("[data-browse-type]").forEach(function (el) {
      el.addEventListener("click", function () {
        manageInventoryBrowseType = el.getAttribute("data-browse-type");
        manageInventoryBrowseCategory = null;
        manageInventoryBrowseRecent = false;
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll("[data-browse-category]").forEach(function (el) {
      el.addEventListener("click", function () {
        manageInventoryBrowseCategory = el.getAttribute("data-browse-category");
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll("[data-browse-recent]").forEach(function (el) {
      el.addEventListener("click", function () {
        manageInventoryBrowseRecent = true;
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll("[data-browse-reset]").forEach(function (el) {
      el.addEventListener("click", function () {
        var level = el.getAttribute("data-browse-reset");
        if (level === "type") { manageInventoryBrowseType = null; manageInventoryBrowseRecent = false; }
        manageInventoryBrowseCategory = null;
        renderManageInventoryResults();
      });
    });

    var sortSelectEl = document.getElementById("manageInventorySortSelect");
    if (sortSelectEl) {
      sortSelectEl.addEventListener("change", function () {
        manageInventorySortKey = sortSelectEl.value;
        renderManageInventoryResults();
      });
    }
    var recentWindowSelectEl = document.getElementById("manageInventoryRecentWindowSelect");
    if (recentWindowSelectEl) {
      recentWindowSelectEl.addEventListener("change", function () {
        manageInventoryRecentDays = parseInt(recentWindowSelectEl.value, 10) || 30;
        renderManageInventoryResults();
      });
    }

    var retryBtn = document.getElementById("manageInventoryRetryBtn");
    if (retryBtn) retryBtn.addEventListener("click", fetchManageInventory);

    var refreshBtnEl = document.getElementById("manageInventoryRefreshBtn");
    if (refreshBtnEl) {
      refreshBtnEl.addEventListener("click", function () {
        var pendingCount = (manageInventoryRows || []).filter(isManageInventoryRowDirty).length;
        if (pendingCount && !window.confirm("Refresh from BrickLink? This discards " + pendingCount + " unsaved change" + (pendingCount === 1 ? "" : "s") + ".")) return;
        fetchManageInventory();
      });
    }

    var submitBtnEl = document.getElementById("manageInventorySubmitBtn");
    if (submitBtnEl) submitBtnEl.addEventListener("click", handleManageInventorySubmit);
    var cancelBtnEl = document.getElementById("manageInventoryCancelBtn");
    if (cancelBtnEl) cancelBtnEl.addEventListener("click", handleManageInventoryCancel);
  }

  function renderManageInventoryView() {
    manageInventoryView.innerHTML = ""
      + '<div class="inventory-intro">Search your live BrickLink inventory to edit price, quantity, condition, description, or remarks. Changes are staged here — nothing updates on BrickLink until you submit.</div>'
      + '<input type="search" class="manage-inventory-search" id="manageInventorySearchInput" placeholder="Search by item name or number…" value="' + escapeHtml(manageInventorySearchQuery) + '" autocomplete="off">'
      + '<div id="manageInventoryResults"></div>';

    document.getElementById("manageInventorySearchInput").addEventListener("input", function (e) {
      manageInventorySearchQuery = e.target.value;
      clearTimeout(manageInventorySearchDebounceTimer);
      manageInventorySearchDebounceTimer = setTimeout(renderManageInventoryResults, 150);
    });

    renderManageInventoryResults();
  }

  function handleManageInventorySubmit() {
    var dirtyRows = (manageInventoryRows || []).filter(isManageInventoryRowDirty);
    if (!dirtyRows.length) return;
    if (!window.confirm("Push " + dirtyRows.length + " change" + (dirtyRows.length === 1 ? "" : "s") + " live to BrickLink now?")) return;

    manageInventorySubmitting = true;
    updateManageInventorySubmitBar();

    postJSON("/api/inventory-update", {
      items: dirtyRows.map(function (r) {
        return {
          key: r.key, inventoryId: r.inventoryId, quantity: r.quantity, newOrUsed: r.newOrUsed,
          unitPrice: r.unitPrice, description: r.description, remarks: r.remarks,
        };
      }),
    }).then(function (res) {
      (res.results || []).forEach(function (result) {
        var row = findManageInventoryRow(result.key);
        if (!row) return;
        if (result.success) {
          row.orig = {
            quantity: row.quantity, newOrUsed: row.newOrUsed, unitPrice: row.unitPrice,
            description: row.description, remarks: row.remarks,
          };
          row.result = { success: true };
        } else {
          row.result = { success: false, error: result.error };
        }
      });
    }).catch(function (err) {
      window.alert("Couldn't reach the server to submit these changes: " + err.message);
    }).finally(function () {
      manageInventorySubmitting = false;
      renderManageInventoryResults();
    });
  }

  // Reverts every dirty row back to its loaded snapshot — nothing has
  // reached BrickLink yet at this point, so this is purely local (no
  // API call), unlike handleManageInventorySubmit.
  function handleManageInventoryCancel() {
    var dirtyRows = (manageInventoryRows || []).filter(isManageInventoryRowDirty);
    if (!dirtyRows.length) return;
    if (!window.confirm("Discard " + dirtyRows.length + " unsaved change" + (dirtyRows.length === 1 ? "" : "s") + "?")) return;
    dirtyRows.forEach(function (row) {
      row.quantity = row.orig.quantity;
      row.newOrUsed = row.orig.newOrUsed;
      row.unitPrice = row.orig.unitPrice;
      row.description = row.orig.description;
      row.remarks = row.orig.remarks;
    });
    renderManageInventoryResults();
  }

  function goToOrders() {
    currentView = "orders";
    orderView.classList.add("hidden");
    inventoryView.classList.add("hidden");
    labelPrepView.classList.add("hidden");
    manageInventoryView.classList.add("hidden");
    ordersView.classList.remove("hidden");
    backBtn.style.display = "none";
    setTopbarNav("orders", "Label Prep", goToLabelPrep);
    refreshBtn.style.display = "";
    brandSub.textContent = "Open BrickLink orders";
    renderOrdersList();
  }

  function goToInventory() {
    currentView = "inventory";
    ordersView.classList.add("hidden");
    orderView.classList.add("hidden");
    labelPrepView.classList.add("hidden");
    manageInventoryView.classList.add("hidden");
    inventoryView.classList.remove("hidden");
    backBtn.style.display = "none";
    setTopbarNav("inventory", "Manage Inventory", goToManageInventory);
    // Refresh only ever reloads Orders data (orders list, order items,
    // pick-state) — nothing on this screen, so hide it here rather than
    // leave a button that looks live but silently does nothing visible.
    refreshBtn.style.display = "none";
    brandSub.textContent = "Add Inventory";
    renderInventoryView();
  }

  function goToLabelPrep() {
    currentView = "label-prep";
    ordersView.classList.add("hidden");
    orderView.classList.add("hidden");
    inventoryView.classList.add("hidden");
    manageInventoryView.classList.add("hidden");
    labelPrepView.classList.remove("hidden");
    backBtn.style.display = "none";
    setTopbarNav("orders", "Order List", goToOrders);
    refreshBtn.style.display = "none";
    brandSub.textContent = "Label Prep";
    renderLabelPrepView();
  }

  function goToManageInventory() {
    currentView = "manage-inventory";
    ordersView.classList.add("hidden");
    orderView.classList.add("hidden");
    inventoryView.classList.add("hidden");
    labelPrepView.classList.add("hidden");
    manageInventoryView.classList.remove("hidden");
    backBtn.style.display = "none";
    setTopbarNav("inventory", "+ Add Inventory", goToInventory);
    refreshBtn.style.display = "none";
    brandSub.textContent = "Manage Inventory";
    renderManageInventoryView();
    if (!manageInventoryRows) fetchManageInventory();
  }

  backBtn.addEventListener("click", goToOrders);
  // Wired once here rather than per-render like the in-page submit
  // buttons — these topbar mirrors are static DOM nodes that live inside
  // <header>, never rebuilt by innerHTML, so a listener attached once
  // never needs re-attaching (and re-attaching on every render would
  // stack duplicate listeners).
  topbarInventorySubmitBtn.addEventListener("click", handleInventorySubmit);
  topbarManageSubmitBtn.addEventListener("click", handleManageInventorySubmit);
  topbarManageCancelBtn.addEventListener("click", handleManageInventoryCancel);
  categoryOrdersBtn.addEventListener("click", goToOrders);
  categoryInventoryBtn.addEventListener("click", goToManageInventory);
  refreshBtn.addEventListener("click", function () {
    itemsCache = {};
    loadOrders();
    syncStateFromRemote();
    syncOrderActionsFromRemote();
  });

  // App-level password gate — Netlify's own visitor-access-control isn't
  // available on this team's plan (confirmed: the API rejects every
  // variant with a 422), so this substitutes for it: every /api/* function
  // rejects unauthenticated requests with 401 (see lib/site-auth.js), and
  // this is the frontend half — nothing here renders real data until a
  // session cookie is established via /api/site-login.
  // Tracks whether this is the very first time the app's shown itself
  // (fresh page load) vs. coming back from an interrupted mid-session
  // login — e.g. a request 401'd partway through something. The first
  // time, there's nothing to resume, so the orders list is exactly
  // right (and is already the visible section by default in the static
  // markup). Any time after that, jumping back to Orders instead of
  // wherever the user actually was is how a session hiccup mid-Add-
  // Inventory-submit could silently swallow a reviewed-but-unsubmitted
  // batch from view — the data was still sitting in memory the whole
  // time, just not visible anywhere obvious.
  var appStarted = false;
  function startApp() {
    appEl.classList.remove("hidden");
    if (appStarted) {
      resumeCurrentView();
    } else {
      appStarted = true;
      // The topbar's category/sub-nav state is dynamic (subNavBtn starts
      // with no label at all) — needs an explicit call here, not just
      // from the goTo* functions, to be correct on this first load.
      setTopbarNav("orders", "Label Prep", goToLabelPrep);
    }
    loadState();
    loadOrders();
    syncStateFromRemote();
    syncOrderActionsFromRemote();
  }

  function resumeCurrentView() {
    if (currentView === "inventory") goToInventory();
    else if (currentView === "label-prep") goToLabelPrep();
    else if (currentView === "manage-inventory") goToManageInventory();
    else goToOrders();
  }

  function showLoginGate(message) {
    appEl.classList.add("hidden");
    loginGate.classList.remove("hidden");
    if (message) {
      loginGateError.textContent = message;
      loginGateError.classList.remove("hidden");
    }
    loginGatePassword.focus();
  }

  function hideLoginGate() {
    loginGate.classList.add("hidden");
    loginGateError.classList.add("hidden");
    loginGatePassword.value = "";
  }

  loginGateForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = loginGatePassword.value;
    if (!password) return;
    loginGateSubmit.disabled = true;
    loginGateSubmit.textContent = "Checking…";
    loginGateError.classList.add("hidden");
    fetch("/api/site-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password }),
    }).then(function (res) {
      if (!res.ok) throw new Error("wrong");
      return res.json();
    }).then(function (data) {
      // Setting the cookie here ourselves, not relying on the response's
      // Set-Cookie header, is the actual fix for a real bug: on "Chrome"
      // on iOS (which is Safari's WebKit engine under the hood — Apple
      // requires every iOS browser to use it), Set-Cookie from a fetch()
      // response wasn't reliably landing in the cookie jar in time for
      // the very next request, which then 401'd and bounced back to this
      // screen. document.cookie is a far older, more reliable API.
      document.cookie = data.cookieName + "=" + encodeURIComponent(data.token)
        + "; Path=/; Max-Age=" + data.maxAge + "; SameSite=Lax"
        + (window.location.protocol === "https:" ? "; Secure" : "");
      hideLoginGate();
      startApp();
    }).catch(function () {
      loginGateError.textContent = "Incorrect password. Try again.";
      loginGateError.classList.remove("hidden");
      loginGatePassword.value = "";
      loginGatePassword.focus();
    }).finally(function () {
      loginGateSubmit.disabled = false;
      loginGateSubmit.textContent = "Unlock";
    });
  });

  // Checks for an existing valid session cookie before deciding whether
  // to show the app or the password prompt — avoids a pointless flash of
  // loading state (and a guaranteed 401 from loadOrders()) for a
  // first-time or expired visitor.
  fetch("/api/site-session").then(function (res) {
    if (res.ok) { startApp(); } else { showLoginGate(); }
  }).catch(function () { showLoginGate(); });
})();
</script>
</body>
</html>
