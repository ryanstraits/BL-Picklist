<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>BrickLink Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EF;
    --surface: #FFFFFF;
    --surface-alt: #ECE8E1;
    --border: #DDD7CC;
    --text: #1D1B18;
    --text-secondary: #6B6459;
    --accent: #C97A22;
    --accent-soft: #F2E2CC;
    --accent-contrast: #FFFFFF;
    --success: #2F8F5B;
    --success-bg: #E3F3EA;
    --danger: #B4483A;
    --info: #2E5FA3;
    --info-bg: #E3EAF5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161A;
      --surface: #1D2027;
      --surface-alt: #262A33;
      --border: #31353F;
      --text: #EDEBE6;
      --text-secondary: #9CA3AF;
      --accent: #F2A93B;
      --accent-soft: #3A2D14;
      --accent-contrast: #14161A;
      --success: #4FAE7B;
      --success-bg: #1C3327;
      --danger: #E0685A;
      --info: #7BB0FA;
      --info-bg: #1C2A40;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161A;
    --surface: #1D2027;
    --surface-alt: #262A33;
    --border: #31353F;
    --text: #EDEBE6;
    --text-secondary: #9CA3AF;
    --accent: #F2A93B;
    --accent-soft: #3A2D14;
    --accent-contrast: #14161A;
    --success: #4FAE7B;
    --success-bg: #1C3327;
    --danger: #E0685A;
    --info: #7BB0FA;
    --info-bg: #1C2A40;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .topbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 7px;
    font-family: inherit;
  }
  .back-btn:active { background: var(--surface-alt); }
  .back-btn svg { width: 14px; height: 14px; flex: none; }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 0;
  }
  .brand-logo {
    flex: none;
    width: 32px;
    height: 32px;
    display: block;
  }
  .brand small {
    display: block;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .refresh-btn {
    flex: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:active { background: var(--surface-alt); }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .topbar-row-nav { margin-top: 10px; }
  .nav-tab-btn {
    width: 100%;
    border: 1px dashed var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .nav-tab-btn:active { background: var(--surface-alt); }

  main { flex: 1; padding: 4px 16px 32px; }

  /* ---- Status states ---- */
  .state-block {
    margin-top: 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13.5px;
    padding: 24px 12px;
  }
  .state-block.error { color: var(--danger); }
  .state-block .retry-btn {
    margin-top: 12px;
    display: inline-block;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .state-block .retry-btn:active { background: var(--surface-alt); }

  /* ---- Orders list ---- */
  .order-stats {
    margin-top: 14px;
    font-size: 13.5px;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .order-stats strong { color: var(--accent); }
  .export-row { margin-top: 10px; }
  .export-btn {
    width: 100%;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--info);
    border-color: var(--info);
    cursor: pointer;
  }
  .export-btn:active { background: var(--surface-alt); }
  .export-btn:disabled { opacity: 0.6; cursor: default; }
  .order-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 14px;
    margin-top: 12px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
  }
  .order-card:active { background: var(--surface-alt); }
  .order-card.needs-pick { background: var(--accent-soft); }
  .order-card.needs-pick:active { background: var(--accent-soft); filter: brightness(0.94); }

  .order-status-row {
    display: flex;
    margin-top: 10px;
  }
  .status-action-btn {
    width: 100%;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .status-action-btn:active { background: var(--surface-alt); }
  .status-action-btn:disabled { opacity: 0.6; cursor: default; }
  .status-action-btn.to-packed { color: var(--info); border-color: var(--info); }
  .status-action-btn.to-shipped { color: var(--success); border-color: var(--success); }
  .status-action-btn.list-drive-thru-btn { color: var(--accent); border-color: var(--accent); }
  .order-top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .order-id { font-weight: 600; font-size: 15px; }
  .order-id-group { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .order-date { font-size: 12px; color: var(--text-secondary); flex: none; }

  .status-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    flex: none;
  }
  .status-badge.tone-fresh { color: var(--accent); background: var(--accent-soft); }
  .status-badge.tone-packed { color: var(--success); background: var(--success-bg); }
  .status-badge.tone-done { color: var(--info); background: var(--info-bg); }
  .status-badge.tone-waiting { color: var(--text-secondary); background: var(--surface-alt); }
  .status-badge.tone-problem { color: var(--danger); background: var(--surface-alt); }
  .order-buyer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .order-total {
    flex: none;
    font-weight: 600;
    color: var(--text);
  }
  .order-progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-alt);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.2s ease;
  }
  .progress-fill.done { background: var(--success); }
  .progress-label {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* ---- Order detail ---- */
  .order-summary {
    padding-top: 10px;
  }
  .order-summary .order-id { font-size: 17px; }
  .order-summary .order-buyer { margin-top: 4px; }
  .picked-count {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .picked-count strong { color: var(--text); }

  .jump-to-items-btn {
    width: 100%;
    margin-top: 12px;
    border: 1px solid var(--accent);
    background: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .jump-to-items-btn:active { background: var(--surface-alt); }

  .financial-total {
    font-weight: 700;
    font-size: 14.5px;
  }
  .financial-total .contact-label { color: var(--text); }

  .contact-section {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .contact-row {
    display: flex;
    gap: 10px;
    font-size: 13.5px;
    padding: 4px 0;
  }
  .contact-row + .contact-row { border-top: 1px solid var(--border); }
  .contact-label {
    flex: 0 0 64px;
    color: var(--text-secondary);
  }
  .contact-address { line-height: 1.4; }
  .tracking-number-link {
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }
  .tracking-number-link:active { color: var(--accent); }
  .contact-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .copy-btn {
    flex: 1;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--accent);
    cursor: pointer;
  }
  .copy-btn:active { background: var(--surface-alt); }

  .tracking-entry {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .tracking-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 13.5px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .tracking-save-btn {
    flex: 0 0 auto;
    padding: 5px 12px;
  }

  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .item-row:active { background: var(--surface-alt); }
  .item-row.picked {
    background: var(--success-bg);
    border-color: transparent;
    opacity: 0.75;
  }

  .item-thumb {
    position: relative;
    flex: none;
    width: 65px;
    height: 65px;
    border-radius: 8px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .item-thumb svg { width: 35px; height: 35px; color: var(--text-secondary); }
  .thumb-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 7px;
  }
  .item-row.picked .item-thumb { opacity: 0.6; }

  .qty-chip {
    position: absolute;
    top: -8px;
    left: -8px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-contrast);
    border: 2px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12px;
  }
  .item-row.picked .qty-chip {
    background: var(--success);
    color: #fff;
  }

  .item-body { flex: 1; min-width: 0; }
  .item-line1 {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .item-no {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .item-line1-right {
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex: none;
  }
  .item-type-tag {
    font-size: 10.5px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    flex: none;
  }
  .item-price {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    flex: none;
  }
  .item-name {
    font-size: 14.5px;
    font-weight: 600;
    margin-top: 3px;
    line-height: 1.3;
  }
  .item-row.picked .item-name { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .item-color {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .item-remarks {
    font-size: 12px;
    color: var(--danger);
    margin-top: 5px;
    font-style: italic;
  }

  .checkmark {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .item-row.picked .checkmark {
    background: var(--success);
    border-color: var(--success);
  }
  .checkmark svg { display: none; width: 14px; height: 14px; }
  .item-row.picked .checkmark svg { display: block; }
  .checkmark svg path { stroke: #fff; }

  .reset-row, .order-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .reset-row { margin-top: 18px; }
  .order-actions { margin-top: 12px; }

  /* ---- Add Inventory ---- */
  .inventory-intro {
    padding-top: 10px;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .inventory-upload {
    margin-top: 16px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 20px 16px;
    text-align: center;
  }
  .inventory-file-input { font-size: 13.5px; font-family: inherit; }
  .inventory-summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .inventory-bulk-actions { display: flex; gap: 8px; }
  .inventory-bulk-actions button, .inv-start-over-btn {
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .inventory-bulk-actions button:active, .inv-start-over-btn:active { background: var(--surface-alt); }
  .inventory-submit-row .inv-start-over-btn { align-self: center; }

  .item-row.inventory-row { cursor: default; }
  .item-row.inventory-row:active { background: var(--surface); }
  .inventory-row.skipped { opacity: 0.45; }
  .inventory-row-check {
    flex: none;
    width: 20px;
    height: 20px;
    margin-top: 4px;
  }
  .inventory-row .item-thumb { cursor: pointer; }
  .inventory-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 8px;
    margin-top: 8px;
  }
  .inventory-field { display: flex; flex-direction: column; gap: 2px; }
  .inventory-field label {
    font-size: 10.5px;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .inventory-field label .field-hint {
    text-transform: none;
    font-weight: 400;
    letter-spacing: normal;
  }
  .inventory-field input, .inventory-field select, .inventory-field textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    width: 100%;
  }
  .inventory-field textarea {
    resize: vertical;
    min-height: 40px;
  }
  .inventory-field.remarks-field, .inventory-field.description-field { grid-column: 1 / -1; }
  .inventory-row-result {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .inventory-row-result.success { color: var(--success); }
  .inventory-row-result.error { color: var(--danger); }
  .inventory-row.result-success { opacity: 0.6; }

  .inventory-submit-row {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .inventory-submit-btn {
    width: 100%;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .inventory-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .inventory-submit-btn:active { filter: brightness(0.94); }

  .item-row.inventory-row { flex-wrap: wrap; }
  .inventory-price-guide-block { flex: 1 1 100%; min-width: 0; }
  .price-guide-toggle-btn {
    display: block;
    margin-top: 10px;
    border: none;
    background: none;
    color: var(--info);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 0;
    cursor: pointer;
  }
  .price-guide-panel {
    margin-top: 6px;
    background: var(--surface-alt);
    border-radius: 8px;
    padding: 10px;
    font-size: 12.5px;
  }
  .price-guide-panel.error { color: var(--danger); }
  .price-guide-stats {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .price-guide-view-link {
    flex: none;
    font-weight: 400;
    font-size: 11.5px;
    white-space: nowrap;
    color: var(--info);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }
  .price-guide-view-link:active { color: var(--accent); }
  .price-guide-hint {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
    margin-bottom: 6px;
  }
  .price-guide-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .price-guide-row:active { background: var(--surface); }
  .price-guide-row + .price-guide-row { border-top: 1px solid var(--border); }
  .price-guide-rank {
    flex: none;
    width: 18px;
    color: var(--text-secondary);
    font-size: 11px;
  }
  .price-guide-qty {
    flex: none;
    width: 30px;
    color: var(--text-secondary);
  }
  .price-guide-price { flex: 1; font-weight: 600; }
  .price-guide-noship {
    flex: none;
    font-size: 10.5px;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .reset-btn, .bottom-back-btn, .select-all-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .reset-btn:active, .bottom-back-btn:active, .select-all-btn:active { background: var(--surface-alt); }
  .bottom-back-btn { color: var(--text); font-weight: 600; }
  .select-all-btn { color: var(--success); border-color: var(--success); }

  .buyer-rating {
    color: var(--text-secondary);
    font-size: 12px;
  }

  /* ---- Drive Thru ---- */
  .drive-thru-row { margin-top: 12px; }
  .drive-thru-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--info);
    color: var(--info);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .drive-thru-btn:active { background: var(--surface-alt); }
  .drive-thru-btn:disabled {
    color: var(--text-secondary);
    border-color: var(--border);
    background: var(--surface-alt);
    cursor: default;
  }

  /* ---- Order messages ---- */
  .messages-section { margin-top: 16px; }
  .messages-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }
  .message-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
  }
  .message-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .message-subject { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .message-body { font-size: 13px; color: var(--text); white-space: pre-wrap; }

  /* ---- Feedback ---- */
  .feedback-section {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .feedback-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .feedback-rating-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .rating-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .rating-btn.selected.praise { color: var(--success); border-color: var(--success); background: var(--success-bg); }
  .rating-btn.selected.neutral { color: var(--info); border-color: var(--info); background: var(--info-bg); }
  .rating-btn.selected.complaint { color: var(--danger); border-color: var(--danger); background: var(--surface-alt); }
  .feedback-textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    resize: vertical;
    min-height: 60px;
    margin-bottom: 10px;
  }
  .feedback-submit-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .feedback-submit-btn:disabled { opacity: 0.5; cursor: default; }
  .feedback-sent-msg { font-size: 13px; color: var(--success); font-weight: 600; }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow: hidden;
    touch-action: none;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .lightbox-hint {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    pointer-events: none;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  .login-gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-gate-card {
    width: 100%;
    max-width: 320px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    text-align: center;
  }
  .login-gate-logo { width: 44px; height: 44px; border-radius: 10px; }
  .login-gate-card h1 {
    margin: 12px 0 4px;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }
  .login-gate-card p {
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .login-gate-card input {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    text-align: center;
    box-sizing: border-box;
  }
  .login-gate-card button {
    width: 100%;
    margin-top: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .login-gate-card button:disabled { opacity: 0.6; cursor: default; }
  .login-gate-card button:active { filter: brightness(0.94); }
  .login-gate-error {
    margin-top: 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--danger);
  }
</style>
</head>
<body>
<div class="login-gate hidden" id="loginGate">
  <div class="login-gate-card">
    <img class="login-gate-logo" src="/logo.png" alt="">
    <h1>BrickLink Assistant</h1>
    <p>Enter the site password to continue.</p>
    <form id="loginGateForm">
      <input type="password" id="loginGatePassword" placeholder="Password" autocomplete="current-password">
      <button type="submit" id="loginGateSubmit">Unlock</button>
    </form>
    <div class="login-gate-error hidden" id="loginGateError"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <button class="back-btn" id="backBtn" aria-label="Back to all orders">
        <svg viewBox="0 0 16 16" fill="none"><path d="M9.5 3L4.5 8L9.5 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        All orders
      </button>
      <div class="brand" id="brandBlock">
        <img class="brand-logo" src="/logo.png" alt="" width="32" height="32">
        <div class="brand-text">
          BrickLink Assistant
          <small id="brandSub">Open BrickLink orders</small>
        </div>
      </div>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh orders">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3.3h-3.3"/></svg>
        Refresh
      </button>
    </div>
    <div class="topbar-row topbar-row-nav" id="topbarNavRow">
      <button class="nav-tab-btn" id="inventoryNavBtn">+ Add Inventory</button>
    </div>
  </header>

  <main>
    <section id="view-orders"></section>
    <section id="view-order" class="hidden"></section>
    <section id="view-inventory" class="hidden"></section>
  </main>
</div>

<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close photo">&times;</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-hint" id="lightboxHint">Pinch or double-tap to zoom</div>
</div>

<script>
(function () {
  var STORAGE_KEY = "picklist:picked-v1";
  var COLORS_CACHE_KEY = "picklist:colors-v1";
  var state = {};
  var orders = [];
  var itemsCache = {};
  var messagesCache = {};
  var contactCache = {};
  var ratingsCache = {};
  var driveThruSent = {};
  var feedbackSent = {};
  var pirateshipExported = {};
  var colorsMap = null;

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : {};
    } catch (e) {
      state = {};
    }
  }

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable locally — the remote push below is what
         actually matters for durability (see pushRemoteState). */
    }
    pushRemoteState();
  }

  // localStorage is just a fast, offline-capable cache; /api/pick-state
  // (a Netlify Blobs store) is the durable source of truth. iOS can and
  // does evict localStorage for a home-screen web app between launches —
  // this is what actually survives a force-quit. Best-effort: on failure
  // (offline, etc.) the local write above still stands for this session,
  // and the next successful sync catches things up.
  function pushRemoteState() {
    postJSON("/api/pick-state", state).catch(function () { /* offline — ignore */ });
  }

  // Combines local and remote pick state per order by union (an item
  // counts as picked if either side has it picked). Never a blind
  // overwrite: the very first sync after this feature ships hits an empty
  // remote store, and overwriting local with that would wipe out
  // whatever's already been picked. A "Clear picks"/"Select all" is a
  // deliberate full replace of one order's picks and pushes immediately,
  // so it isn't undone by this — it only reconciles two states that both
  // grew from the same starting point.
  function mergeStates(a, b) {
    var orderIds = {};
    Object.keys(a || {}).forEach(function (id) { orderIds[id] = true; });
    Object.keys(b || {}).forEach(function (id) { orderIds[id] = true; });

    var merged = {};
    Object.keys(orderIds).forEach(function (orderId) {
      var picksA = (a && a[orderId]) || {};
      var picksB = (b && b[orderId]) || {};
      var picks = {};
      Object.keys(picksA).forEach(function (k) { if (picksA[k]) picks[k] = true; });
      Object.keys(picksB).forEach(function (k) { if (picksB[k]) picks[k] = true; });
      merged[orderId] = picks;
    });
    return merged;
  }

  // Resolves once the latest remote state has been pulled in and merged
  // (or the attempt has failed and local state is being kept as-is).
  // Callers that need up-to-date picks before rendering (opening an
  // order) await this.
  var remoteSyncPromise = null;
  function syncStateFromRemote() {
    remoteSyncPromise = fetchJSON("/api/pick-state")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var merged = mergeStates(state, remote);
          // Compare against what the REMOTE has, not what local had a
          // moment ago — that's the real question here. Comparing to the
          // old local value missed the exact case that mattered: remote
          // has nothing (e.g. it was crashing until just now) and local
          // already has everything, so the merge doesn't change local at
          // all but the remote still desperately needs that push.
          var remoteNeedsUpdate = JSON.stringify(merged) !== JSON.stringify(remote);
          state = merged;
          try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          if (remoteNeedsUpdate) pushRemoteState();
          if (currentView === "orders") renderOrdersList();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return remoteSyncPromise;
  }

  // Same durability story as picks, for "Send Drive Thru" / "Leave
  // feedback" — these used to just live in memory for the current page
  // load, so a reload showed the button/form again even though BrickLink
  // already had the action on record. Reuses /api/pick-state's Blobs
  // store under a second key ("actions") since it's the same small
  // per-order boolean-map shape, just two maps instead of one.
  function mergeActionMap(a, b) {
    var merged = {};
    Object.keys(a || {}).forEach(function (k) { if (a[k]) merged[k] = true; });
    Object.keys(b || {}).forEach(function (k) { if (b[k]) merged[k] = true; });
    return merged;
  }

  function pushOrderActions() {
    postJSON("/api/pick-state?key=actions", { driveThruSent: driveThruSent, feedbackSent: feedbackSent, pirateshipExported: pirateshipExported })
      .catch(function () { /* offline — ignore, same as picks */ });
  }

  var orderActionsSyncPromise = null;
  function syncOrderActionsFromRemote() {
    orderActionsSyncPromise = fetchJSON("/api/pick-state?key=actions")
      .then(function (remote) {
        if (remote && typeof remote === "object") {
          var mergedDriveThru = mergeActionMap(driveThruSent, remote.driveThruSent);
          var mergedFeedback = mergeActionMap(feedbackSent, remote.feedbackSent);
          var mergedExported = mergeActionMap(pirateshipExported, remote.pirateshipExported);
          var remoteNeedsUpdate = JSON.stringify(mergedDriveThru) !== JSON.stringify(remote.driveThruSent || {})
            || JSON.stringify(mergedFeedback) !== JSON.stringify(remote.feedbackSent || {})
            || JSON.stringify(mergedExported) !== JSON.stringify(remote.pirateshipExported || {});
          driveThruSent = mergedDriveThru;
          feedbackSent = mergedFeedback;
          pirateshipExported = mergedExported;
          if (remoteNeedsUpdate) pushOrderActions();
          if (currentView === "orders") renderOrdersList();
        }
      })
      .catch(function () { /* offline or first run — keep whatever's local */ });
    return orderActionsSyncPromise;
  }

  function isPicked(orderId, key) {
    return !!(state[orderId] && state[orderId][key]);
  }

  // Picked count straight from saved state, with no dependency on that
  // order's items being fetched. The orders list needs this: itemsCache
  // only has an order's items once you've opened it in this session, so
  // relying on it there made every card read "0 picked" right after a
  // fresh launch — even though the real picks were sitting in state the
  // whole time (confirmed correct once you opened the order itself).
  function pickedCountFromState(orderId) {
    var picks = state[orderId];
    if (!picks) return 0;
    var n = 0;
    Object.keys(picks).forEach(function (k) { if (picks[k]) n++; });
    return n;
  }

  function togglePicked(orderId, key) {
    if (!state[orderId]) state[orderId] = {};
    state[orderId][key] = !state[orderId][key];
    saveState();
  }

  function resetOrder(orderId) {
    state[orderId] = {};
    saveState();
  }

  function selectAllOrder(orderId, items) {
    var picks = {};
    computeItemKeys(items).forEach(function (key) { picks[key] = true; });
    state[orderId] = picks;
    saveState();
  }

  function pickedCount(orderId, items) {
    var keys = computeItemKeys(items);
    var n = 0;
    for (var i = 0; i < keys.length; i++) {
      if (isPicked(orderId, keys[i])) n++;
    }
    return n;
  }

  // Keys a pick by the item's content (number + color + condition) rather
  // than its position in the list, so picks survive BrickLink returning an
  // order's items in a different sequence on a later fetch (which is what
  // happens every time the app is reopened, since the in-memory items
  // cache doesn't survive a reload). The trailing occurrence count only
  // matters when the exact same item/color/condition is split across
  // multiple batches within one order.
  function computeItemKeys(items) {
    var seen = {};
    return items.map(function (item) {
      var sig = item.itemNo + "|" + item.colorId + "|" + item.newOrUsed;
      var occurrence = seen[sig] || 0;
      seen[sig] = occurrence + 1;
      return sig + "|" + occurrence;
    });
  }

  // One-time upgrade for picks saved before keys were content-based (when
  // they were just the item's array index, e.g. "0", "1", ...). Remaps
  // them onto the current fetch's content-based keys so existing progress
  // isn't lost the first time an order is reopened after this change.
  function migrateOrderState(orderId, items) {
    var saved = state[orderId];
    if (!saved) return;
    var isLegacyIndexKeyed = Object.keys(saved).every(function (k) { return /^\d+$/.test(k); });
    if (!isLegacyIndexKeyed) return;

    var keys = computeItemKeys(items);
    var migrated = {};
    Object.keys(saved).forEach(function (idxStr) {
      var key = keys[Number(idxStr)];
      if (key && saved[idxStr]) migrated[key] = true;
    });
    state[orderId] = migrated;
    saveState();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // BrickLink's catalog text (item names, descriptions, remarks) sometimes
  // has HTML entities already baked in verbatim (e.g. "&#40;" for "("), a
  // quirk of their data source. Decoding them first means escapeHtml can
  // safely re-escape from there without turning "&#40;" into the literal
  // text "&amp;#40;" in the page.
  var entityDecoder = document.createElement("textarea");
  function decodeHtmlEntities(s) {
    if (!s) return s;
    entityDecoder.innerHTML = s;
    return entityDecoder.value;
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  var CURRENCY_SYMBOLS = { USD: "$", CAD: "$", AUD: "$", NZD: "$", GBP: "£", EUR: "€", JPY: "¥" };

  function formatCurrency(amount, code) {
    if (amount === null || amount === undefined || amount === "") return "";
    var num = Number(amount);
    if (isNaN(num)) return "";
    var symbol = CURRENCY_SYMBOLS[code];
    if (symbol) return symbol + num.toFixed(2);
    return (code ? code + " " : "") + num.toFixed(2);
  }

  // tone: fresh = needs picking, packed = picked & boxed, done = shipped/received,
  // waiting = before payment, problem = cancelled/non-paying/etc.
  var STATUS_META = {
    PENDING: { label: "Pending", tone: "waiting" },
    UPDATED: { label: "Updated", tone: "waiting" },
    PROCESSING: { label: "Processing", tone: "waiting" },
    READY: { label: "Ready", tone: "waiting" },
    PAID: { label: "Paid", tone: "fresh" },
    PACKED: { label: "Packed", tone: "done" },
    SHIPPED: { label: "Shipped", tone: "packed" },
    RECEIVED: { label: "Received", tone: "done" },
    CANCELLED: { label: "Cancelled", tone: "problem" },
    PURGED: { label: "Purged", tone: "problem" },
    NPB: { label: "NPB", tone: "problem" },
    NRS: { label: "NRS", tone: "problem" },
    NSS: { label: "NSS", tone: "problem" }
  };

  function statusBadgeHtml(status) {
    if (!status) return "";
    var meta = STATUS_META[status] || { label: status, tone: "waiting" };
    return '<span class="status-badge tone-' + meta.tone + '">' + escapeHtml(meta.label) + '</span>';
  }

  async function fetchJSON(url) {
    var res = await fetch(url);
    if (res.status === 401) { showLoginGate(); throw new Error("Session expired — please log in again."); }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

  async function postJSON(url, payload) {
    var res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (res.status === 401) { showLoginGate(); throw new Error("Session expired — please log in again."); }
    var body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) {
      throw new Error((body && body.error) || ("Request failed (" + res.status + ")"));
    }
    return body;
  }

  function getColors() {
    if (colorsMap) return Promise.resolve(colorsMap);
    try {
      var cached = window.localStorage.getItem(COLORS_CACHE_KEY);
      if (cached) {
        colorsMap = JSON.parse(cached);
        return Promise.resolve(colorsMap);
      }
    } catch (e) { /* ignore, fall through to fetch */ }

    return fetchJSON("/api/colors").then(function (colors) {
      var map = {};
      (colors || []).forEach(function (c) { map[c.colorId] = c.colorName; });
      colorsMap = map;
      try { window.localStorage.setItem(COLORS_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
      return map;
    });
  }

  var ordersView = document.getElementById("view-orders");
  var orderView = document.getElementById("view-order");
  var inventoryView = document.getElementById("view-inventory");
  var backBtn = document.getElementById("backBtn");
  var brandSub = document.getElementById("brandSub");
  var refreshBtn = document.getElementById("refreshBtn");
  var topbarNavRow = document.getElementById("topbarNavRow");
  var inventoryNavBtn = document.getElementById("inventoryNavBtn");
  var currentView = "orders";

  var appEl = document.getElementById("app");
  var loginGate = document.getElementById("loginGate");
  var loginGateForm = document.getElementById("loginGateForm");
  var loginGatePassword = document.getElementById("loginGatePassword");
  var loginGateSubmit = document.getElementById("loginGateSubmit");
  var loginGateError = document.getElementById("loginGateError");

  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lightboxClose = document.getElementById("lightboxClose");

  // Custom pinch/pan/double-tap zoom, independent of the browser's native
  // zoom — the page disables native pinch-zoom site-wide (to avoid
  // accidental zooming while picking), and toggling that dynamically to
  // re-enable it is unreliable on iOS, which only honors the viewport
  // meta tag's zoom bounds as computed at initial page load.
  var zoomScale = 1;
  var zoomX = 0;
  var zoomY = 0;
  var pointers = {};
  var pinchStartDist = 0;
  var pinchStartScale = 1;
  var lastTapTime = 0;
  var MAX_ZOOM = 4;

  function applyZoomTransform() {
    lightboxImg.style.transform = "translate(" + zoomX + "px, " + zoomY + "px) scale(" + zoomScale + ")";
  }

  function resetZoom() {
    zoomScale = 1;
    zoomX = 0;
    zoomY = 0;
    applyZoomTransform();
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function touchDistance(t1, t2) {
    var dx = t1.clientX - t2.clientX;
    var dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Touch Events rather than Pointer Events: iOS WebKit (which every iOS
  // browser, including Chrome, runs on) has a history of unreliable
  // multi-touch handling via Pointer Events — Touch Events are the
  // long-standing, battle-tested API there.
  //
  // Listeners are on the full-screen overlay, not the (possibly small,
  // native-resolution) image itself — a pinch's two fingers often won't
  // both land within a small image's bounds, and a touch that starts
  // outside it would never reach a listener attached to the image.
  // preventDefault is only called once we've recognized an actual pinch,
  // pan, or double-tap gesture — a plain single tap falls through so the
  // browser's synthesized click still closes the lightbox on backdrop
  // taps (see the click listener below).
  lightbox.addEventListener("touchstart", function (e) {
    if (e.target === lightboxClose) return;

    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }

    if (e.touches.length === 2) {
      e.preventDefault();
      pinchStartDist = touchDistance(e.touches[0], e.touches[1]);
      pinchStartScale = zoomScale;
    } else if (e.touches.length === 1) {
      var now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        if (zoomScale > 1) {
          resetZoom();
        } else {
          zoomScale = 2.5;
          applyZoomTransform();
        }
      }
      lastTapTime = now;
    }
  }, { passive: false });

  lightbox.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = touchDistance(e.touches[0], e.touches[1]);
      if (pinchStartDist > 0) {
        zoomScale = clamp(pinchStartScale * (dist / pinchStartDist), 1, MAX_ZOOM);
        applyZoomTransform();
      }
    } else if (e.touches.length === 1 && zoomScale > 1) {
      e.preventDefault();
      var t = e.touches[0];
      var prev = pointers[t.identifier];
      if (prev) {
        zoomX += t.clientX - prev.x;
        zoomY += t.clientY - prev.y;
        applyZoomTransform();
      }
      pointers[t.identifier] = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });

  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      delete pointers[e.changedTouches[i].identifier];
    }
    if (e.touches.length < 2) pinchStartDist = 0;
  }
  lightbox.addEventListener("touchend", endTouch);
  lightbox.addEventListener("touchcancel", endTouch);

  var lightboxHint = document.getElementById("lightboxHint");
  var currentObjectUrl = null;
  var DEFAULT_HINT = "Pinch or double-tap to zoom";

  function openLightbox(url) {
    resetZoom();
    lightboxImg.src = "";
    lightboxHint.textContent = "Loading…";
    lightbox.classList.remove("hidden");

    // Fetch via JS (rather than a plain <img src>) so we can read the
    // diagnostic headers item-image.js sets — tells us whether this photo
    // is the larger color-specific one or the small fallback, and its
    // actual byte size, without needing device devtools to check.
    fetch(url).then(function (res) {
      if (!res.ok) throw new Error("image request failed");
      var tier = res.headers.get("X-Image-Tier");
      var bytes = res.headers.get("X-Image-Bytes");
      return res.blob().then(function (blob) {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        lightboxImg.src = currentObjectUrl;
        var sizeLabel = bytes ? Math.round(bytes / 1024) + "KB" : "";
        var TIER_LABELS = { "catalog-api": "official catalog photo", "hires": "hi-res photo", "large": "BrickLink large photo", "small": "low-res photo" };
        var tierLabel = TIER_LABELS[tier] || "photo";
        lightboxHint.textContent = DEFAULT_HINT + " · " + tierLabel + (sizeLabel ? " (" + sizeLabel + ")" : "");
      });
    }).catch(function () {
      lightboxHint.textContent = "Couldn't load this photo";
    });
  }

  function closeLightbox() {
    lightbox.classList.add("hidden");
    lightboxImg.src = "";
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
    lightboxHint.textContent = DEFAULT_HINT;
    resetZoom();
  }

  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  lightboxClose.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });

  function wireThumbLinks(container) {
    container.querySelectorAll(".thumb-link").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openLightbox(el.getAttribute("data-img-url"));
      });
    });
  }

  var THUMB_MIN = 65;
  var THUMB_MAX = 108;

  // Sizes every thumbnail in the order to one shared size — the tallest
  // row's text block wins (clamped) — so photos line up consistently
  // instead of each row getting its own size based on its own text length.
  function sizeThumbsToRows(container) {
    var rows = container.querySelectorAll(".item-row");
    var tallest = 0;
    rows.forEach(function (row) {
      var body = row.querySelector(".item-body");
      if (body) tallest = Math.max(tallest, body.offsetHeight);
    });
    var size = Math.max(THUMB_MIN, Math.min(THUMB_MAX, tallest));
    rows.forEach(function (row) {
      var thumb = row.querySelector(".item-thumb");
      if (!thumb) return;
      thumb.style.width = size + "px";
      thumb.style.height = size + "px";
    });
  }

  function renderOrdersList() {
    if (!orders.length) {
      ordersView.innerHTML = '<div class="state-block">No open orders right now.</div>';
      return;
    }

    var toPickCount = orders.filter(function (o) { return o.status === "PAID"; }).length;
    var toShipCount = orders.filter(function (o) { return o.status === "PACKED"; }).length;

    var inProcessOrders = orders.filter(function (o) {
      var meta = STATUS_META[o.status];
      return o.orderTotal && (!meta || meta.tone !== "problem");
    });
    var inProcessCurrency = inProcessOrders.length ? inProcessOrders[0].currencyCode : null;
    var inProcessTotal = null;
    if (inProcessOrders.length) {
      inProcessTotal = inProcessOrders.reduce(function (sum, o) {
        if (o.currencyCode !== inProcessCurrency) return sum;
        return sum + Number(o.orderTotal);
      }, 0);
    }

    var html = ""
      + '<div class="order-stats">'
      + '<div>Total orders to be picked: <strong>' + toPickCount + '</strong></div>'
      + '<div>Total orders to be shipped: <strong>' + toShipCount + '</strong></div>'
      + (inProcessTotal !== null ? '<div>Total value of orders in process: <strong>' + escapeHtml(formatCurrency(inProcessTotal, inProcessCurrency)) + '</strong></div>' : '')
      + '</div>'
      + '<div class="export-row"><button class="export-btn" id="exportPirateshipBtn">Export to PirateShip</button></div>';
    orders.forEach(function (order) {
      var total = order.totalCount || 0;
      var lineCount = order.uniqueCount || 0;
      var items = itemsCache[order.orderId];
      var picked = items ? pickedCount(order.orderId, items) : pickedCountFromState(order.orderId);
      var knownTotal = items ? items.length : lineCount;
      var done = knownTotal > 0 && picked === knownTotal;
      var pct = knownTotal > 0 ? Math.round((picked / knownTotal) * 100) : 0;
      var meta = STATUS_META[order.status];
      var needsPick = meta && meta.tone === "fresh";
      var statusAction = "";
      if (order.status === "PAID") {
        statusAction = '<button class="status-action-btn to-packed" data-order="' + escapeHtml(order.orderId) + '" data-target-status="PACKED">Mark as packed</button>';
      } else if (order.status === "PACKED") {
        statusAction = '<button class="status-action-btn to-shipped" data-order="' + escapeHtml(order.orderId) + '" data-target-status="SHIPPED">Mark as shipped</button>';
      } else if (order.status === "SHIPPED" && !driveThruSent[order.orderId]) {
        statusAction = '<button class="status-action-btn list-drive-thru-btn" data-order="' + escapeHtml(order.orderId) + '">Send Drive Thru</button>';
      }
      html += ""
        + '<div class="order-card' + (needsPick ? ' needs-pick' : '') + '" role="button" tabindex="0" data-order="' + escapeHtml(order.orderId) + '">'
        + '<div class="order-top-row">'
        + '<span class="order-id-group">'
        + '<span class="order-id mono">#' + escapeHtml(order.orderId) + '</span>'
        + statusBadgeHtml(order.status)
        + '</span>'
        + '<span class="order-date">' + escapeHtml(formatDate(order.date)) + '</span>'
        + '</div>'
        + '<div class="order-buyer">'
        + '<span>' + escapeHtml(order.buyer || "") + ' · ' + lineCount + ' lots · ' + total + ' items</span>'
        + (order.orderTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(order.orderTotal, order.currencyCode)) + '</span>' : '')
        + '</div>'
        + '<div class="order-progress-row">'
        + '<div class="progress-track"><div class="progress-fill' + (done ? ' done' : '') + '" style="width:' + pct + '%"></div></div>'
        + '<span class="progress-label">' + picked + '/' + knownTotal + '</span>'
        + '</div>'
        + (statusAction ? '<div class="order-status-row">' + statusAction + '</div>' : '')
        + '</div>';
    });
    ordersView.innerHTML = html;

    ordersView.querySelectorAll(".order-card").forEach(function (card) {
      card.addEventListener("click", function () {
        openOrder(card.getAttribute("data-order"));
      });
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openOrder(card.getAttribute("data-order"));
        }
      });
    });

    ordersView.querySelectorAll(".status-action-btn:not(.list-drive-thru-btn)").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleStatusChange(btn);
      });
    });

    ordersView.querySelectorAll(".list-drive-thru-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleListDriveThru(btn);
      });
    });

    var exportBtn = document.getElementById("exportPirateshipBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportPirateshipCsv);
  }

  // CSV field-quoting per RFC 4180: only quote a field when it actually
  // needs it, but always escape internal quotes when it does.
  function csvField(value) {
    var s = value === null || value === undefined ? "" : String(value);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  var PIRATESHIP_HEADERS = ["Email", "Name", "Company", "Address", "Address Line 2", "City", "State", "Zipcode", "Country", "Order ID", "Order Items", "Pounds", "Length", "Width", "Height"];

  // Weight/dimensions are deliberately left blank — BrickLink's total_weight
  // field has no confirmed unit for this account (grams vs oz vs lbs), and
  // guessing wrong here would produce a wrong postage cost/label. Fill
  // those in on PirateShip's side same as always.
  function pirateshipRowToCsv(row) {
    var itemsSummary = row.uniqueCount + " lot" + (row.uniqueCount === 1 ? "" : "s") + ", " + row.totalCount + " item" + (row.totalCount === 1 ? "" : "s");
    return [row.email, row.name, "", row.address1, row.address2, row.city, row.state, row.postalCode, row.countryCode, row.orderId, itemsSummary, "", "", "", ""]
      .map(csvField).join(",");
  }

  function downloadTextFile(filename, text) {
    var blob = new Blob([text], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportPirateshipCsv() {
    var btn = document.getElementById("exportPirateshipBtn");
    if (btn) { btn.disabled = true; btn.textContent = "Exporting…"; }

    fetchJSON("/api/pirateship-export")
      .then(function (rows) {
        var newRows = (rows || []).filter(function (r) { return !pirateshipExported[r.orderId]; });
        if (!newRows.length) {
          window.alert("No new Stripe-paid orders ready to export.");
          return;
        }

        var csv = [PIRATESHIP_HEADERS.map(csvField).join(",")]
          .concat(newRows.map(pirateshipRowToCsv))
          .join("\r\n");
        downloadTextFile("pirateship-export-" + Date.now() + ".csv", csv);

        newRows.forEach(function (r) { pirateshipExported[r.orderId] = true; });
        pushOrderActions();
      })
      .catch(function (err) {
        window.alert("Couldn't build the PirateShip export: " + err.message);
      })
      .finally(function () {
        if (btn) { btn.disabled = false; btn.textContent = "Export to PirateShip"; }
      });
  }

  function handleStatusChange(btn) {
    var orderId = btn.getAttribute("data-order");
    var targetStatus = btn.getAttribute("data-target-status");
    var label = targetStatus === "PACKED" ? "Packed" : "Shipped";

    if (!window.confirm("Mark order #" + orderId + " as " + label + " on BrickLink?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Updating…";

    postJSON("/api/update-order-status", { orderId: orderId, status: targetStatus })
      .then(function () {
        var order = orders.find(function (o) { return o.orderId === orderId; });
        if (order) order.status = targetStatus;
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't update order #" + orderId + ": " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  // Same action as the order detail page's Drive Thru button (and shares
  // its durable "sent" tracking), just reachable straight from the list —
  // the natural next tap right after marking an order shipped, so there's
  // no separate trip into the order to send it.
  function handleListDriveThru(btn) {
    var orderId = btn.getAttribute("data-order");
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + orderId + "?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: orderId })
      .then(function () {
        driveThruSent[orderId] = true;
        pushOrderActions();
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  function setOrdersLoading() {
    ordersView.innerHTML = '<div class="state-block">Loading orders…</div>';
  }

  function setOrdersError(message) {
    ordersView.innerHTML = ''
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="ordersRetryBtn">Try again</button></div>';
    var btn = document.getElementById("ordersRetryBtn");
    if (btn) btn.addEventListener("click", function () { loadOrders(); });
  }

  async function loadOrders() {
    setOrdersLoading();
    setRefreshing(true);
    try {
      orders = await fetchJSON("/api/orders");
      // Newest first, matching BrickLink's own Orders Received page.
      orders.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      if (currentView === "orders") renderOrdersList();
    } catch (err) {
      if (currentView === "orders") setOrdersError(err.message);
    } finally {
      setRefreshing(false);
    }
  }

  function setRefreshing(isRefreshing) {
    refreshBtn.disabled = isRefreshing;
    refreshBtn.classList.toggle("spinning", isRefreshing);
  }

  function checkSvg() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // Fallback art for when the live catalog photo hotlink fails to load.
  function thumbSvg(type) {
    if (type === "MINIFIG") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="8" y="2.5" width="8" height="6" rx="2.5"/>'
        + '<path d="M6.5 10h11l-1 6.5a2 2 0 0 1-2 1.5h-5a2 2 0 0 1-2-1.5L6.5 10z"/>'
        + '<path d="M9 18v3.5M15 18v3.5"/>'
        + '</svg>';
    }
    if (type === "SET") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="3" y="7" width="18" height="13" rx="1.5"/>'
        + '<path d="M3 7l3-4h12l3 4"/>'
        + '</svg>';
    }
    // PART and everything else: simple brick
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<rect x="3" y="9" width="18" height="10" rx="1.5"/>'
      + '<circle cx="8" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '<circle cx="16" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '</svg>';
  }

  function catalogImageUrl(item) {
    return "/api/item-image?type=" + encodeURIComponent(item.type)
      + "&no=" + encodeURIComponent(item.itemNo)
      + "&color=" + encodeURIComponent(item.colorId || 0)
      + "&nu=" + encodeURIComponent(item.newOrUsed === "U" ? "U" : "N");
  }

  function thumbHtml(item) {
    var url = catalogImageUrl(item);
    return '<span class="thumb-link" data-img-url="' + escapeHtml(url) + '">'
      + '<span class="thumb-fallback">' + thumbSvg(item.type) + '</span>'
      + '<img src="' + escapeHtml(url) + '" alt="" referrerpolicy="no-referrer" style="display:none" '
      + 'onload="this.previousElementSibling.style.display=\'none\'; this.style.display=\'block\';" '
      + 'onerror="this.remove();">'
      + '</span>';
  }

  function renderOrderDetail(order, items, messages, contact) {
    messages = messages || [];
    var picked = pickedCount(order.orderId, items);
    var allDone = items.length > 0 && picked === items.length;
    var itemKeys = computeItemKeys(items);
    var canSendDriveThru = order.status === "SHIPPED";
    var canLeaveFeedback = ["PACKED", "SHIPPED", "RECEIVED", "COMPLETED"].indexOf(order.status) !== -1;
    var detailStatusAction = "";
    if (order.status === "PAID") {
      detailStatusAction = '<button class="status-action-btn to-packed" id="detailStatusBtn" data-target-status="PACKED">Mark as packed</button>';
    } else if (order.status === "PACKED") {
      detailStatusAction = '<button class="status-action-btn to-shipped" id="detailStatusBtn" data-target-status="SHIPPED">Mark as shipped</button>';
    }

    var rows = items.map(function (item, idx) {
      var isDone = isPicked(order.orderId, itemKeys[idx]);
      return ""
        + '<div class="item-row' + (isDone ? ' picked' : '') + '" data-key="' + escapeHtml(itemKeys[idx]) + '">'
        + '<div class="item-thumb">' + thumbHtml(item) + '<span class="qty-chip">' + item.qty + '</span></div>'
        + '<div class="item-body">'
        + '<div class="item-line1">'

        + '<span class="item-type-tag">' + escapeHtml(item.type) + '</span>'

        + '</div>' : '')
      + '</div>'
      + (items.length ? '<button class="jump-to-items-btn" id="jumpToItemsBtn">Jump to items ↓</button>' : '')

      + (items.length ? '<div class="order-actions">'
        + '<button class="select-all-btn">Select all as picked</button>'

    var detailStatusBtn = document.getElementById("detailStatusBtn");
