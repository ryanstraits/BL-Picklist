  // endpoint doesn't carry the shipping address name the way the
  // per-order detail call does (confirmed earlier, see order-contact.js
  // and README), so getting the buyer's real name onto every card here
  // means a background contact fetch per order rather than something
  // bundled into the one list response. Reuses contactCache (the same
  // cache openOrder() already fills), so once an order's been seen here
  // — or opened directly — it's free on every later render or Refresh;
  // only genuinely new orders cost a fetch.
  function buyerRealNameHtml(orderId) {
    var cached = contactCache[orderId];
    return '<span class="buyer-real-name" data-order="' + escapeHtml(orderId) + '">'
      + (cached && cached.name ? ' (' + escapeHtml(cached.name) + ')' : '')
      + '</span>';
  }

  // Two small icons, same idea as the feedback icons on BrickLink's own
  // Orders Received page: a check for "you left feedback" (feedbackSent,
  // reconciled from the bulk /api/feedback-list call in loadOrders() the
  // same way it already was per-order via status-check), and a star for
  // "buyer left feedback" (feedbackReceived, populated the same way),
  // tinted by the buyer's actual rating so a Complaint reads distinctly
  // from a Praise rather than just "feedback exists".
  function feedbackIconsHtml(orderId) {
    var icons = "";
    if (feedbackSent[orderId]) {
      icons += '<span class="feedback-icon given" title="You left feedback">✓</span>';
    }
    var received = feedbackReceived[orderId];
    if (received) {
      var tone = received.rating === "Complaint" ? "complaint" : received.rating === "Neutral" ? "neutral" : "praise";
      icons += '<span class="feedback-icon received-' + tone + '" title="Buyer left feedback: ' + escapeHtml(received.rating || "feedback") + '">★</span>';
    }
    icons += loggedIconHtml(orderId);
    return icons ? '<span class="feedback-icons">' + icons + '</span>' : "";
  }

  // Square, not round — same ✓ glyph and gold tint as "you left feedback"
  // above, but .logged's border-radius keeps it from reading as a second
  // feedback mark at a glance (Ryan's own ask). Split out from
  // feedbackIconsHtml (which calls this) purely for that visual distinction
  // — feedbackSent/feedbackReceived/isOrderLogged are all populated by the
  // same account-wide bulk calls (feedback-list, order-actions) regardless
  // of which view they're first needed in, so there's no data-completeness
  // reason left to keep logged-only separate from the full icon set.
  function loggedIconHtml(orderId) {
    return isOrderLogged(orderId) ? '<span class="feedback-icon logged" title="Logged in spreadsheet">✓</span>' : "";
  }

  function fetchMissingBuyerRealNames(orderList, container) {
    container = container || ordersView;
    orderList.forEach(function (order) {
      // undefined = never attempted. null or a resolved object both mean
      // "already attempted" (even a nameless result), so a single order
      // with no shipping name on file doesn't get refetched every render.
      if (contactCache[order.orderId] !== undefined) return;
      // Claim it synchronously, before the fetch even starts — renderOrdersList()
      // fires again in quick succession during initial load (remote sync
      // re-renders), and without this, a second call landing before the
      // first fetch resolves would still see undefined here and kick off
      // a duplicate request for the same order.
      contactCache[order.orderId] = null;
      fetchJSON("/api/orders/" + encodeURIComponent(order.orderId) + "/contact")
        .then(function (contact) {
          contact.name = titleCaseName(decodeHtmlEntities(contact.name));
          contactCache[order.orderId] = contact;
          if (!contact.name) return;
          var el = container.querySelector('.order-card[data-order="' + order.orderId + '"] .buyer-real-name');
          if (el) el.textContent = " (" + contact.name + ")";
        })
        .catch(function () { /* already claimed null above */ });
    });
  }

  // Same "picked vs. known total" math each order card already renders its
  // own progress bar from — pulled out so the "to pick" stat and the cards
  // agree on what "done" means instead of each computing it separately.
  // Falls back to pickedCountFromState()/order.uniqueCount when the order's
  // items haven't been fetched yet in this session (same fallback the card
  // itself already uses before it's been opened). That fallback counts every
  // locally-saved "picked" key regardless of whether it still matches a real
  // item in the order, so it can run ahead of knownTotal if a lot was
  // combined/cancelled/edited on BrickLink's side after it had already been
  // picked (observed live as a card reading "33/32"). Capped here rather
  // than solved at the source, since there's no way to tell which saved key
  // went stale without the real item list — which is exactly what isn't
  // fetched yet on this path.
  function orderPickProgress(order) {
    var items = itemsCache[order.orderId];
    var picked = items ? pickedCount(order.orderId, items) : pickedCountFromState(order.orderId);
    var knownTotal = items ? items.length : (order.uniqueCount || 0);
    if (knownTotal > 0 && picked > knownTotal) picked = knownTotal;
    return { items: items, picked: picked, knownTotal: knownTotal, done: knownTotal > 0 && picked === knownTotal };
  }

  // Shared by the list card and detail page's own File order button —
  // order.filed (Order Lookup's snapshot, corrected live by
  // refreshOrderStatusCheck() the same way order.status is) means
  // BrickLink already has this filed, whether that happened by tapping
  // File order here or directly on BrickLink's own site, so there's
  // nothing left for a fresh tap to do. Disabled rather than omitted —
  // same "still there, just done" treatment Drive Thru Sent gets, not a
  // silent gap where the button used to be.
  function fileOrderActionHtml(order) {
    return order.filed
      ? '<button class="status-action-btn file-order-btn" disabled>Filed</button>'
      : '<button class="status-action-btn file-order-btn" id="detailFileBtn">File order</button>';
  }
  function listFileActionHtml(order) {
    return order.filed
      ? '<button class="status-action-btn list-file-btn" disabled>Filed</button>'
      : '<button class="status-action-btn list-file-btn" data-order="' + escapeHtml(order.orderId) + '">File order</button>';
  }

  function renderOrdersList() {
    if (!orders.length) {
      ordersView.innerHTML = '<div class="state-block">No open orders right now.</div>';
      return;
    }

    // "To pick" used to just mean "sitting in PAID status" — Ryan pointed
    // out that's not actually what he wants to know: an order he's already
    // picked every item on (just hasn't tapped "Mark as packed" yet) isn't
    // really left to pick anymore, and this missed that distinction
    // entirely. COMPLETED/problem-status orders are excluded regardless of
    // their own local pick state (same reasoning as inProcessOrders below)
    // — those are done or dead, never "still needs picking", even if this
    // app never happened to record picks for one (e.g. it was fulfilled
    // before this app existed, or outside it).
    var toPickCount = orders.filter(function (o) {
      var meta = STATUS_META[o.status];
      if (o.status === "COMPLETED" || (meta && meta.tone === "problem")) return false;
      return !orderPickProgress(o).done;
    }).length;
    // "To ship" used to only count PACKED — but a PAID order that hasn't
    // been packed yet still needs to ship just as much, it just has one
    // more step first. Count any status earlier than SHIPPED in
    // BrickLink's own pipeline (PENDING/UPDATED/PROCESSING/READY/PAID/
    // PACKED), same exclusion of problem statuses (Cancelled/NPB/NRS/NSS)
    // as toPickCount above — those were never really "to ship" either.
    var PRE_SHIP_STATUSES = { PENDING: true, UPDATED: true, PROCESSING: true, READY: true, PAID: true, PACKED: true };
    var toShipCount = orders.filter(function (o) { return !!PRE_SHIP_STATUSES[o.status]; }).length;

    // Manual "mental note" reminder, not tied to any single order or to
    // where pickup happens to fall in Ryan's picking workflow (it varies
    // day to day). Tracked per order, same durable-sync pattern as Drive
    // Thru/feedback, so a newly-packed order surfaces the reminder again
    // even after an earlier batch's pickup was already confirmed.
    var ordersAwaitingPickup = orders.filter(function (o) { return o.status === "PACKED" && !pickupScheduled[o.orderId]; });

    // COMPLETED orders stick around in this list until filed now (so Ryan
    // can catch anything the buyer flags, for as long as he wants), but
    // their money isn't "in process" anymore — excluded here the same way
    // a cancelled/problem order already was, so the stat doesn't inflate
    // once completed orders started actually showing up in this array.
    var inProcessOrders = orders.filter(function (o) {
      var meta = STATUS_META[o.status];
      return o.orderTotal && o.status !== "COMPLETED" && (!meta || meta.tone !== "problem");
    });
    var inProcessCurrency = inProcessOrders.length ? inProcessOrders[0].currencyCode : null;
    var inProcessTotal = null;
    if (inProcessOrders.length) {
      inProcessTotal = inProcessOrders.reduce(function (sum, o) {
        if (o.currencyCode !== inProcessCurrency) return sum;
        return sum + Number(o.orderTotal);
      }, 0);
    }

    var html = ""
      + '<div class="stats-summary">'
      + '<div class="stats-summary-tile"><strong>' + toPickCount + '</strong><span>to pick</span></div>'
      + '<div class="stats-summary-tile"><strong>' + toShipCount + '</strong><span>to ship</span></div>'
      + (inProcessTotal !== null ? '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(inProcessTotal, inProcessCurrency)) + '</strong><span>in process</span></div>' : '')
      + '</div>'
      + (ordersAwaitingPickup.length ? '<div class="pickup-reminder-row">'
        + '<span>' + ordersAwaitingPickup.length + ' order' + (ordersAwaitingPickup.length === 1 ? '' : 's') + ' packed, ready for USPS pickup</span>'
        + '<button class="status-action-btn pickup-btn" id="pickupScheduledBtn">I’ve scheduled pickup</button>'
        + '</div>' : '');
    orders.forEach(function (order) {
      var total = order.totalCount || 0;
      var lineCount = order.uniqueCount || 0;
      var progress = orderPickProgress(order);
      var items = progress.items;
      var picked = progress.picked;
      var knownTotal = progress.knownTotal;
      var done = progress.done;
      var pct = knownTotal > 0 ? Math.round((picked / knownTotal) * 100) : 0;
      var meta = STATUS_META[order.status];
      var needsPick = meta && meta.tone === "fresh";
      var needsLog = !isOrderLogged(order.orderId);
      var isComplete = order.status === "COMPLETED";
      var statusAction = "";
      if (order.status === "PAID") {
        statusAction = '<button class="status-action-btn to-packed" data-order="' + escapeHtml(order.orderId) + '" data-target-status="PACKED">Mark as packed</button>';
      } else if (order.status === "PACKED") {
        statusAction = '<button class="status-action-btn to-shipped" data-order="' + escapeHtml(order.orderId) + '" data-target-status="SHIPPED">Mark as shipped</button>';
      } else if (order.status === "SHIPPED" && !driveThruSent[order.orderId]) {
        statusAction = '<button class="status-action-btn list-drive-thru-btn" data-order="' + escapeHtml(order.orderId) + '">Send Drive Thru</button>';
      } else if (order.status === "SHIPPED" || order.status === "RECEIVED") {
        statusAction = '<button class="status-action-btn to-completed" data-order="' + escapeHtml(order.orderId) + '" data-target-status="COMPLETED">Mark as completed</button>';
        // Once the buyer marks an order Received (this app never sets that
        // status itself — see ALLOWED_STATUSES in update-order-status.js —
        // so a RECEIVED order always got there via the buyer or BrickLink,
        // never through here), BrickLink often won't let the seller push it
        // to Completed at all — grayed out on BrickLink's own Orders page
        // too, confirmed against a real rejected attempt (order #32601986,
        // RESOURCE_UPDATE_NOT_ALLOWED / NOT_IN_UPDATABLE_STATUS). There's no
        // API field that says in advance whether a given order is locked
        // this way, and Ryan's said it isn't *always* locked, so rather than
        // guess, filing is offered right alongside — is_filed is a plain
        // boolean on Update Order with no status prerequisite, so it works
        // whether or not the completed transition does.
        if (order.status === "RECEIVED") {
          statusAction += listFileActionHtml(order);
        }
      } else if (order.status === "COMPLETED") {
        statusAction = listFileActionHtml(order);
      }
      html += ""
        + '<div class="order-card' + (needsPick ? ' needs-pick' : '') + (needsLog ? ' needs-log' : '') + (isComplete ? ' is-complete' : '') + '" role="button" tabindex="0" data-order="' + escapeHtml(order.orderId) + '">'
        + '<div class="order-top-row">'
        + '<span class="order-id-group">'
        + '<span class="order-id mono">#' + escapeHtml(order.orderId) + '</span>'
        + statusBadgeHtml(order.status)
        + feedbackIconsHtml(order.orderId)
        + '</span>'
        + '<span class="order-date">' + escapeHtml(formatDate(order.date)) + '</span>'
        + '</div>'
        + '<div class="order-buyer">'
        + '<span>' + escapeHtml(order.buyer || "") + buyerRealNameHtml(order.orderId) + '</span>'
        + (order.orderTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(order.orderTotal, order.currencyCode)) + '</span>' : '')
        + '</div>'
        + '<div class="order-lots-items">' + lineCount + ' lots · ' + total + ' items</div>'
        + '<div class="order-progress-row">'
        + '<div class="progress-track"><div class="progress-fill' + (done ? ' done' : '') + '" style="width:' + pct + '%"></div></div>'
        + '<span class="progress-label">' + picked + '/' + knownTotal + '</span>'
        + '</div>'
        + (statusAction ? '<div class="order-status-row">' + statusAction + '</div>' : '')
        + '</div>';
    });
    ordersView.innerHTML = html;
    fetchMissingBuyerRealNames(orders);

    ordersView.querySelectorAll(".order-card").forEach(function (card) {
      card.addEventListener("click", function () {
        openOrder(card.getAttribute("data-order"));
      });
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openOrder(card.getAttribute("data-order"));
        }
      });
    });

    ordersView.querySelectorAll(".status-action-btn:not(.list-drive-thru-btn):not(.pickup-btn):not(.list-file-btn)").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleStatusChange(btn);
      });
    });

    ordersView.querySelectorAll(".list-drive-thru-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleListDriveThru(btn);
      });
    });

    ordersView.querySelectorAll(".list-file-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleListFileOrder(btn);
      });
    });

    var pickupBtn = document.getElementById("pickupScheduledBtn");
    if (pickupBtn) {
      pickupBtn.addEventListener("click", function () {
        ordersAwaitingPickup.forEach(function (o) { pickupScheduled[o.orderId] = true; });
        pushOrderActions();
        renderOrdersList();
      });
    }
  }

  // BrickLink rejects "mark as Completed" for some RECEIVED orders with
  // RESOURCE_UPDATE_NOT_ALLOWED / NOT_IN_UPDATABLE_STATUS — confirmed live
  // (order #32601986) as BrickLink's own "only the buyer (or BrickLink's
  // timer) can complete this from here" rule once the buyer's marked it
  // received, same as it shows grayed out on BrickLink's own Orders page.
  // There's no field on the order that predicts this in advance, so rather
  // than a raw API error, name what actually happened and point at filing
  // — the alternative offered right alongside this button — as the way
  // forward.
  function statusUpdateErrorMessage(orderId, targetStatus, err) {
    if (targetStatus === "COMPLETED" && /NOT_IN_UPDATABLE_STATUS/.test(err.message)) {
      return "BrickLink won't let order #" + orderId + " be marked Completed from here — once the buyer marks an order Received, only they (or BrickLink's own automatic timer) can complete it from there. You can still file the order away with the File order button.";
    }
    return "Couldn't update order #" + orderId + ": " + err.message;
  }

  // Both status-change paths below (list card + order detail) mutate the
  // `orders` array in place, which is enough for the main Orders list to
  // immediately reflect the change on its own. Order Lookup reads from
  // its own separate statsRows snapshot though (its own /api/order-stats
  // fetch, not derived from `orders` — see statsRows below), and an order
  // opened from Order Lookup gets a throwaway fallback object built fresh
  // from a statsRows row each time (openLookupOrder), not a reference
  // back into statsRows itself. Without this, Order Lookup keeps showing
  // the pre-change status for the rest of the session, since statsRows is
  // only ever fetched once per session — confirmed live as two orders
  // still reading "Shipped" there after confirming "Mark as completed"
  // from an order opened through Order Lookup.
  function syncStatsRowStatus(orderId, status) {
    if (!statsRows) return;
    var row = statsRows.filter(function (r) { return r.orderId === orderId; })[0];
    if (row) row.status = status;
  }

  function handleStatusChange(btn) {
    var orderId = btn.getAttribute("data-order");
    var targetStatus = btn.getAttribute("data-target-status");
    var label = STATUS_META[targetStatus].label;

    if (!window.confirm("Mark order #" + orderId + " as " + label + " on BrickLink?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Updating…";

    postJSON("/api/update-order-status", { orderId: orderId, status: targetStatus })
      .then(function () {
        var order = orders.find(function (o) { return o.orderId === orderId; });
        if (order) order.status = targetStatus;
        syncStatsRowStatus(orderId, targetStatus);
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert(statusUpdateErrorMessage(orderId, targetStatus, err));
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  // Same action as the order detail page's Drive Thru button (and shares
  // its durable "sent" tracking), just reachable straight from the list —
  // the natural next tap right after marking an order shipped, so there's
  // no separate trip into the order to send it.
  function handleListDriveThru(btn) {
    var orderId = btn.getAttribute("data-order");
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + orderId + "?")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: orderId })
      .then(function () {
        driveThruSent[orderId] = true;
        pushOrderActions();
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  // Filing sets the same is_filed flag BrickLink itself flips when Ryan
  // files an order from the Orders Received page — either way, the next
  // /api/orders fetch (which never passes filed=true) won't include it
  // again, so it's removed from the local `orders` array right away rather
  // than waiting on a refetch to notice it's gone.
  function handleListFileOrder(btn) {
    var orderId = btn.getAttribute("data-order");
    if (!window.confirm("File order #" + orderId + " on BrickLink? It'll no longer show up here or on your BrickLink Orders Received page.")) return;

    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Filing…";

    postJSON("/api/file-order", { orderId: orderId })
      .then(function () {
        orders = orders.filter(function (o) { return o.orderId !== orderId; });
        renderOrdersList();
      })
      .catch(function (err) {
        window.alert("Couldn't file order #" + orderId + ": " + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  function setOrdersLoading() {
    ordersView.innerHTML = '<div class="state-block">Loading orders…</div>';
  }

  function setOrdersError(message) {
    ordersView.innerHTML = ''
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="ordersRetryBtn">Try again</button></div>';
    var btn = document.getElementById("ordersRetryBtn");
    if (btn) btn.addEventListener("click", function () { loadOrders(); });
  }

  async function loadOrders() {
    setOrdersLoading();
    setRefreshing(true);
    try {
      orders = await fetchJSON("/api/orders");
      // Newest first, matching BrickLink's own Orders Received page.
      orders.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

      // A single bulk call (not one per order) for BrickLink's own
      // feedback truth — same icons BrickLink's own Orders Received page
      // shows for "you left feedback" / "buyer left feedback". Best-effort:
      // a failure here just means the icons don't show this refresh,
      // same fail-safe posture as the rest of this app's enrichment calls.
      try {
        var feedbackList = await fetchJSON("/api/feedback-list");
        feedbackReceived = (feedbackList && feedbackList.received) || {};
        var actionsChanged = false;
        Object.keys((feedbackList && feedbackList.given) || {}).forEach(function (orderId) {
          if (!feedbackSent[orderId]) {
            feedbackSent[orderId] = true;
            actionsChanged = true;
          }
        });
        if (actionsChanged) pushOrderActions();
      } catch (e) { /* icons just won't show this refresh */ }

      if (currentView === "orders") renderOrdersList();
    } catch (err) {
      if (currentView === "orders") setOrdersError(err.message);
    } finally {
      setRefreshing(false);
    }
  }

  function setRefreshing(isRefreshing) {
    refreshBtn.disabled = isRefreshing;
    refreshBtn.classList.toggle("spinning", isRefreshing);
  }

  function checkSvg() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // Fallback art for when the live catalog photo hotlink fails to load.
  function thumbSvg(type) {
    if (type === "MINIFIG") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="8" y="2.5" width="8" height="6" rx="2.5"/>'
        + '<path d="M6.5 10h11l-1 6.5a2 2 0 0 1-2 1.5h-5a2 2 0 0 1-2-1.5L6.5 10z"/>'
        + '<path d="M9 18v3.5M15 18v3.5"/>'
        + '</svg>';
    }
    if (type === "SET") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="3" y="7" width="18" height="13" rx="1.5"/>'
        + '<path d="M3 7l3-4h12l3 4"/>'
        + '</svg>';
    }
    // PART and everything else: simple brick
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<rect x="3" y="9" width="18" height="10" rx="1.5"/>'
      + '<circle cx="8" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '<circle cx="16" cy="9" r="1.6" fill="currentColor" stroke="none"/>'
      + '</svg>';
  }

  // v2 busts every cache layer (Netlify's own edge, not just the
  // browser) for item-image URLs cached before the color-priority fix —
  // Cache-Control: public on that response means *any* intermediate
  // cache was allowed to store the old wrong-color bytes under this
  // exact URL, not just the browser, so a client-side cache clear alone
  // doesn't reach it. Bump this again if item-image.js's selection logic
  // ever changes in a way that could flip an already-cached answer.
  function catalogImageUrl(item) {
    return "/api/item-image?type=" + encodeURIComponent(item.type)
      + "&no=" + encodeURIComponent(item.itemNo)
      + "&color=" + encodeURIComponent(item.colorId || 0)
      + "&nu=" + encodeURIComponent(item.newOrUsed === "U" ? "U" : "N")
      + "&v=2";
  }

  function thumbHtml(item) {
    var url = catalogImageUrl(item);
    return '<span class="thumb-link" data-img-url="' + escapeHtml(url) + '">'
      + '<span class="thumb-fallback">' + thumbSvg(item.type) + '</span>'
      + '<img src="' + escapeHtml(url) + '" alt="" referrerpolicy="no-referrer" style="display:none" '
      + 'onload="this.previousElementSibling.style.display=\'none\'; this.style.display=\'block\';" '
      + 'onerror="this.remove();">'
      + '</span>';
  }

  // A qty>1 item's own mini progress bar — fills in as it gets tapped,
  // separate from (and in addition to) the enlarged qty badge and the
  // row's own background tint, per Ryan's own suggestion for confirming
  // a multi-piece lot is fully counted out rather than just "touched".
  function itemProgressRowHtml(progress) {
    var pct = progress.of > 0 ? Math.round((progress.n / progress.of) * 100) : 0;
    var done = progress.n >= progress.of;
    return '<div class="item-progress-row">'
      + '<div class="progress-track"><div class="progress-fill' + (done ? ' done' : '') + '" style="width:' + pct + '%"></div></div>'
      + '<span class="progress-label">' + progress.n + '/' + progress.of + '</span>'
      + '</div>';
  }

  // Renders filled in immediately if manageInventoryRows is already warm
  // this session (e.g. Manage Inventory was visited earlier, or an order
  // or an earlier Add Inventory CSV already triggered the same lazy
  // load); otherwise an empty placeholder — same reserved-space-now,
  // filled-in-shortly-after approach as buyerRealNameHtml — patched by
  // patchItemStockCounts() below once the background fetch resolves.
  function itemStockCountHtml(item) {
    var count = manageInventoryRows ? inventoryStockCount(item.itemNo, item.colorId) : "";
    return '<div class="item-stock-count" data-item-no="' + escapeHtml(item.itemNo) + '" data-color-id="' + escapeHtml(item.colorId) + '">'
      + (count !== "" ? count + ' in inventory' : '') + '</div>';
  }

  // Shared by the order detail page and Add Inventory's review list —
  // both leave itemStockCountHtml()'s placeholder in place when the
  // count isn't ready yet, then call this once ensureManageInventoryLoaded()
  // resolves to fill in every such placeholder currently in the DOM under
  // the given container. A later re-render (editing a field, tapping a
  // checkbox) doesn't need this again — by then manageInventoryRows is
  // warm, so itemStockCountHtml() renders the real count synchronously
  // the next time it's called.
  function patchItemStockCounts(container) {
    container.querySelectorAll(".item-stock-count[data-item-no]").forEach(function (el) {
      var itemNo = el.getAttribute("data-item-no");
      var colorId = parseInt(el.getAttribute("data-color-id"), 10) || 0;
      el.textContent = inventoryStockCount(itemNo, colorId) + " in inventory";
    });
  }

  var ITEM_TYPE_LABELS = {
    MINIFIG: ["minifig", "minifigs"],
    PART: ["part", "parts"],
    PART_FIG: ["fig part", "fig parts"],
    PART_GEN: ["gen part", "gen parts"],
    SET: ["set", "sets"],
    BOOK: ["book", "books"],
    GEAR: ["gear", "gear"],
    CATALOG: ["catalog", "catalogs"],
    INSTRUCTION: ["instruction", "instructions"],
    ORIGINAL_BOX: ["box", "boxes"],
    UNSORTED_LOT: ["lot", "lots"],
  };

  // A quick "what's actually in here" glance at the top of the order
  // detail page, e.g. "5 gen parts (1 lb 2.000 oz) · 2 fig parts (3.500
  // oz) · 1 minifig" — Ryan wanted this specifically so he doesn't have
  // to open every item row just to see the mix. Sums quantity per
  // BrickLink item type (not lot/line count — "2 minifigs" should mean
  // two physical minifigs, whether that's two separate 1-qty lots or one
  // 2-qty lot), sorted by count descending so the most common type in
  // the order leads. Deliberately only on the detail page, never on any
  // list/card view — Ryan explicitly didn't want more crowding there,
  // where several cards are already stacked and busy; the detail page
  // only ever shows one order at a time, so there's room for it here
  // that there isn't there.
  //
  // PART splits further into fig-related vs. general ("gen", matching
  // the label Ryan already uses in his own spreadsheet) — that
  // distinction matters to him since fig parts (torsos, heads, legs,
  // accessories) run a noticeably different dollar value than general
  // parts. Needs categoriesById loaded (see openOrder) to tell the two
  // apart; falls back to the old unsplit "parts" bucket (no weight
  // shown, since that fallback can't tell which of the two it's
  // summing) if categories haven't loaded for some reason, rather than
  // guessing.
  //
  // Only the two PART buckets get a weight alongside their count — Ryan
  // uses part weight to track cost/lb for piece lots, not for minifigs,
  // sets, or anything else summarized here, so a weight on those would
  // just be noise. item.weight is BrickLink's per-unit gram weight (see
  // formatWeightLbOz's own comment on how that's been confirmed against
  // real orders), so it's multiplied by qty before summing across a
  // multi-unit lot.
  function orderTypeSummaryHtml(items) {
    var counts = {};
    var weights = {};
    items.forEach(function (item) {
      var bucket = item.type;
      if (bucket === "PART" && categoriesById) {
        bucket = isFigPartCategory(item.categoryId, categoriesById) ? "PART_FIG" : "PART_GEN";
      }
      counts[bucket] = (counts[bucket] || 0) + (item.qty || 0);
      if (bucket === "PART_FIG" || bucket === "PART_GEN") {
        weights[bucket] = (weights[bucket] || 0) + (parseFloat(item.weight) || 0) * (item.qty || 0);
      }
    });
    var types = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    if (!types.length) return "";
    var parts = types.map(function (type) {
      var labels = ITEM_TYPE_LABELS[type] || [type.toLowerCase(), type.toLowerCase() + "s"];
      var n = counts[type];
      var text = n + " " + (n === 1 ? labels[0] : labels[1]);
      if (weights[type] !== undefined) text += " (" + formatWeightLbOz(weights[type]) + ")";
      return text;
    });
    return '<div class="order-type-summary">' + escapeHtml(parts.join(" · ")) + '</div>';
  }

  function renderOrderDetail(order, items, messages, contact) {
    messages = messages || [];
    var readOnly = orderDetailReadOnly;
    var picked = pickedCount(order.orderId, items);
    var allDone = items.length > 0 && picked === items.length;
    var itemKeys = computeItemKeys(items);
    var canSendDriveThru = order.status === "SHIPPED";
    var canLeaveFeedback = ["PACKED", "SHIPPED", "RECEIVED", "COMPLETED"].indexOf(order.status) !== -1;
    var detailStatusAction = "";
    if (order.status === "PAID") {
      detailStatusAction = '<button class="status-action-btn to-packed" id="detailStatusBtn" data-target-status="PACKED">Mark as packed</button>';
    } else if (order.status === "PACKED") {
      detailStatusAction = '<button class="status-action-btn to-shipped" id="detailStatusBtn" data-target-status="SHIPPED">Mark as shipped</button>';
    } else if (order.status === "SHIPPED" || order.status === "RECEIVED") {
      detailStatusAction = '<button class="status-action-btn to-completed" id="detailStatusBtn" data-target-status="COMPLETED">Mark as completed</button>';
      // See the matching comment in renderOrdersList() — RECEIVED can't be
      // told apart in advance whether the seller is actually allowed to
      // push it to Completed, so File order (no status prerequisite) is
      // offered right alongside rather than only once Completed is reached.
      if (order.status === "RECEIVED") {
        detailStatusAction += fileOrderActionHtml(order);
      }
    } else if (order.status === "COMPLETED") {
      detailStatusAction = fileOrderActionHtml(order);
    }

    var rows = items.map(function (item, idx) {
      var isDone = !readOnly && isPicked(order.orderId, itemKeys[idx]);
      var isMulti = item.qty > 1;
      var progress = (!readOnly && isMulti) ? pickProgress(order.orderId, itemKeys[idx], item.qty) : null;
      var isPartial = !readOnly && isMulti && !isDone && progress.n > 0;
      var rowClass = isDone ? ' picked' : (isPartial ? ' partial' : '');
      return ""
        + '<div class="item-row' + rowClass + '" data-key="' + escapeHtml(itemKeys[idx]) + '" data-qty="' + item.qty + '">'
        + '<div class="item-thumb">' + thumbHtml(item) + '<span class="qty-chip' + (isMulti ? ' multi' : '') + '">' + item.qty + '</span></div>'
        + '<div class="item-body">'
        + '<div class="item-line1">'
        + '<span class="item-no mono">' + escapeHtml(item.itemNo) + '</span>'
        + '<span class="item-line1-right">'
        + '<span class="item-type-tag">' + escapeHtml(item.type) + '</span>'
        + (item.unitPrice ? '<span class="item-price mono">' + escapeHtml(formatCurrency(item.unitPrice, order.currencyCode)) + '</span>' : '')
        + '</span>'
        + '</div>'
        + (!readOnly && isMulti ? itemProgressRowHtml(progress) : '')
        + '<div class="item-name">' + escapeHtml(item.name) + '</div>'
        + (isRealColorName(item.colorName) ? '<div class="item-color">' + escapeHtml(item.colorName) + '</div>' : '')
        + (item.description ? '<div class="item-color">' + escapeHtml(item.description) + '</div>' : '')
        + (item.remarks ? '<div class="item-remarks">' + escapeHtml(item.remarks) + '</div>' : '')
        + itemStockCountHtml(item)
        + '<a class="item-bl-link" href="' + escapeHtml(bricklinkCatalogUrl(item, item.newOrUsed === "U" ? "U" : "N")) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View on BrickLink ↗</a>'
        + '</div>'
        + (readOnly ? '' : '<div class="checkmark">' + checkSvg() + '</div>')
        + '</div>';
    }).join("");

    var actionRowHtml = '<div class="order-action-row">'
      + detailStatusAction
      + (canSendDriveThru ? '<button class="drive-thru-btn" id="driveThruBtn"' + (driveThruSent[order.orderId] ? " disabled" : "") + '>' + (driveThruSent[order.orderId] ? "Drive Thru Sent" : "Send Drive Thru") + '</button>' : '')
      + renderSpreadsheetLoggedAction(order)
      + (items.length ? '<button class="jump-to-items-btn" id="jumpToItemsBtn">Jump to items ↓</button>' : '')
      + '</div>';

    orderView.innerHTML = ""
      // Sticky only in read-only (Order Lookup) detail views — Ryan's own
      // ask, scoped there specifically. Breaks right above the action
      // row (File/Log/Jump to items/...), which stays in normal flow and
      // scrolls away with the rest of the page; only the id/status/buyer/
      // weight/type-summary block above it pins in place. A sticky
      // element only stays stuck for as long as there's more content
      // below it inside its own PARENT — so this block has to be a
      // direct child of orderView (a sibling of the action row, item
      // list, etc.), not nested inside the small .order-summary box the
      // non-readOnly path keeps using, which is barely taller than the
      // sticky content itself and would make it unstick almost
      // immediately. The main pick list's own order detail has the
      // picked-count line and nothing to scroll past before the item
      // list anyway, and pinning the same block there wasn't asked for,
      // so it's left exactly as before (action row stays inside
      // .order-summary there, same as pre-existing behavior).
      + '<div class="order-summary' + (readOnly ? ' order-sticky-top' : '') + '"' + (readOnly ? ' id="orderStickyTop"' : '') + '>'
      + '<div class="order-id-group">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + statusBadgeHtml(order.status)
      + '</div>'
      + '<div class="order-buyer">'
      + '<span>' + escapeHtml(order.buyer || "") + ' · ' + escapeHtml(formatDate(order.date)) + ' <span class="buyer-rating" id="buyerRatingBadge"></span></span>'
      + (order.orderTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(order.orderTotal, order.currencyCode)) + '</span>' : '')
      + '</div>'
      + previousOrdersHtml(order)
      + (contact && contact.weightG ? '<div class="order-weight mono">' + escapeHtml(formatWeightLbOz(contact.weightG)) + '</div>' : '')
      + orderTypeSummaryHtml(items)
      + (readOnly ? '' : '<div class="picked-count" id="pickedCountText"><strong>' + picked + ' of ' + items.length + '</strong> lots picked' + (allDone ? ' — ready to pack' : '') + '</div>')
      + (readOnly ? '' : actionRowHtml)
      + '</div>'
      + (readOnly ? actionRowHtml : '')
      + renderBoxChoiceSection(order)
      + renderContactSection(contact)
      + renderFinancialSection(contact, order)
      + renderMessagesSection(messages)
      + renderBuyerFeedbackSection(order)
      + (canLeaveFeedback ? renderFeedbackSection(order) : '')
      + (items.length && !readOnly ? '<div class="order-actions">'
        + '<button class="select-all-btn">Select all as picked</button>'
        + '<button class="reset-btn">Clear picks for this order</button>'
        + '</div>' : '')
      + '<div id="orderItemsAnchor"></div>'
      + (items.length ? rows : '<div class="state-block">This order has no line items.</div>')
      + '<div class="reset-row">'
      + '<button class="bottom-back-btn" id="bottomBackBtn">&#8592; ' + (readOnly ? "Order Lookup" : "All orders") + '</button>'
      + (items.length && !readOnly ? '<button class="select-all-btn">Select all as picked</button>'
        + '<button class="reset-btn">Clear picks for this order</button>' : '')
      + '</div>';

    if (readOnly) {
      var orderStickyTop = document.getElementById("orderStickyTop");
      var topbarEl = document.querySelector(".topbar");
      if (orderStickyTop && topbarEl) {
        orderStickyTop.style.top = topbarEl.getBoundingClientRect().height + "px";
      }
    }

    wireThumbLinks(orderView);
    sizeThumbsToRows(orderView);

    // A full renderOrderDetail() re-render on every single pick toggle
    // used to rebuild the entire item list — including re-running
    // sizeThumbsToRows()'s per-row layout measurement — on every tap.
    // Harmless-looking on desktop, but caused a real bug on iOS: tapping
    // an item near the bottom of a long list would visibly "jump" to a
    // different scroll position, almost certainly WebKit's scroll
    // position heuristics getting confused by the wholesale DOM
    // replacement. Toggling the "picked" class directly on just the
    // tapped row (all its visual states are pure CSS, no layout-affecting
    // properties — see .item-row.picked) avoids the rebuild entirely.
    // None of this wiring exists in read-only mode (Order Lookup) — there's
    // no picked-count line, no select-all/reset buttons, and item rows
    // render with no picked/partial class or checkmark to toggle anyway.
    if (!readOnly) {
      orderView.querySelectorAll(".item-row").forEach(function (row) {
        row.addEventListener("click", function () {
          var key = row.getAttribute("data-key");
          var qty = parseInt(row.getAttribute("data-qty"), 10) || 1;
          togglePicked(order.orderId, key, qty);

          var isDone = isPicked(order.orderId, key);
          var isMulti = qty > 1;
          var progress = isMulti ? pickProgress(order.orderId, key, qty) : null;
          row.classList.toggle("picked", isDone);
          row.classList.toggle("partial", isMulti && !isDone && progress.n > 0);

          var progressEl = row.querySelector(".item-progress-row");
          if (progressEl) progressEl.outerHTML = itemProgressRowHtml(progress);

          updatePickedProgress(order, items);
        });
      });
      updatePickedProgress(order, items);

      orderView.querySelectorAll(".reset-btn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          resetOrder(order.orderId);
          renderOrderDetail(order, items, messages, contact);
        });
      });

      orderView.querySelectorAll(".select-all-btn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          selectAllOrder(order.orderId, items);
          renderOrderDetail(order, items, messages, contact);
        });
      });
    }

    var detailStatusBtn = document.getElementById("detailStatusBtn");
    if (detailStatusBtn) {
      detailStatusBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var targetStatus = detailStatusBtn.getAttribute("data-target-status");
        var label = STATUS_META[targetStatus].label;
        if (!window.confirm("Mark order #" + order.orderId + " as " + label + " on BrickLink?")) return;

        var originalText = detailStatusBtn.textContent;
        detailStatusBtn.disabled = true;
        detailStatusBtn.textContent = "Updating…";

        postJSON("/api/update-order-status", { orderId: order.orderId, status: targetStatus })
          .then(function () {
            // order is the same object referenced from the orders array
            // (openOrder finds it there, not a copy) when reached from the
            // main list, so this mutation also updates what the orders
            // list shows once you go back. When reached from Order Lookup
            // instead, order is a throwaway fallback object (see
            // openLookupOrder) — syncStatsRowStatus is what keeps that
            // path's own statsRows snapshot in sync too.
            order.status = targetStatus;
            syncStatsRowStatus(order.orderId, targetStatus);
            renderOrderDetail(order, items, messages, contact);
          })
          .catch(function (err) {
            window.alert(statusUpdateErrorMessage(order.orderId, targetStatus, err));
            detailStatusBtn.disabled = false;
            detailStatusBtn.textContent = originalText;
          });
      });
    }

    // Same action and "drops out of the default filed=false /api/orders
    // fetch" reasoning as the list's own File order button — from the
    // detail page there's nowhere left to view once it's filed, so this
    // goes back to the orders list on success rather than re-rendering
    // this same (now stale) order.
    var detailFileBtn = document.getElementById("detailFileBtn");
    if (detailFileBtn) {
      detailFileBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (!window.confirm("File order #" + order.orderId + " on BrickLink? It'll no longer show up here or on your BrickLink Orders Received page.")) return;

        var originalText = detailFileBtn.textContent;
        detailFileBtn.disabled = true;
        detailFileBtn.textContent = "Filing…";

        postJSON("/api/file-order", { orderId: order.orderId })
          .then(function () {
            orders = orders.filter(function (o) { return o.orderId !== order.orderId; });
            // Filing doesn't remove an order from statsRows (order-stats
            // covers filed and unfiled alike) — it stays findable in Order
            // Lookup, same as before, just no longer in the main list.
            if (readOnly) goToOrderLookup(); else goToOrders();
          })
          .catch(function (err) {
            window.alert("Couldn't file order #" + order.orderId + ": " + err.message);
            detailFileBtn.disabled = false;
            detailFileBtn.textContent = originalText;
          });
      });
    }

    var driveThruBtn = document.getElementById("driveThruBtn");
    if (driveThruBtn) {
      driveThruBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleSendDriveThru(order, items, messages, contact);
      });
    }

    orderView.querySelectorAll(".box-choice-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var value = btn.getAttribute("data-box");
        boxChoice[order.orderId] = boxChoice[order.orderId] === value ? "" : value;
        pushOrderActions();
        orderView.querySelectorAll(".box-choice-btn").forEach(function (b) {
          b.classList.toggle("selected", b.getAttribute("data-box") === boxChoice[order.orderId]);
        });
      });
    });

    wireSpreadsheetLoggedAction(order);

    var copyAddressBtn = document.getElementById("copyAddressBtn");
    if (copyAddressBtn) {
      copyAddressBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var originalText = copyAddressBtn.textContent;
        copyToClipboard(contactAddressLines(contact).join("\n"))
          .then(function () { flashCopied(copyAddressBtn, originalText); })
          .catch(function () { window.alert("Couldn't copy — select and copy manually."); });
      });
    }
    var copyEmailBtn = document.getElementById("copyEmailBtn");
    if (copyEmailBtn) {
      copyEmailBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var originalText = copyEmailBtn.textContent;
        copyToClipboard(contact.email)
          .then(function () { flashCopied(copyEmailBtn, originalText); })
          .catch(function () { window.alert("Couldn't copy — select and copy manually."); });
      });
    }

    var saveTrackingBtn = document.getElementById("saveTrackingBtn");
    if (saveTrackingBtn) {
      saveTrackingBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var input = document.getElementById("trackingInput");
        var trackingNo = input.value.trim();
        if (!trackingNo) { window.alert("Enter a tracking number first."); return; }

        saveTrackingBtn.disabled = true;
        saveTrackingBtn.textContent = "Saving…";

        postJSON("/api/update-tracking", { orderId: order.orderId, trackingNo: trackingNo })
          .then(function () {
            contact.trackingNo = trackingNo;
            contactCache[order.orderId] = contact;
            renderOrderDetail(order, items, messages, contact);
          })
          .catch(function (err) {
            window.alert("Couldn't save tracking number: " + err.message);
            saveTrackingBtn.disabled = false;
            saveTrackingBtn.textContent = "Save";
          });
      });
    }

    var jumpToItemsBtn = document.getElementById("jumpToItemsBtn");
    if (jumpToItemsBtn) {
      jumpToItemsBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var anchor = document.getElementById("orderItemsAnchor");
        var header = document.querySelector(".topbar");
        if (!anchor) return;
        // scrollIntoView's block:"start" aligns the anchor with the very
        // top of the viewport, but the header is position:sticky and
        // overlaps that same space — without correcting for its height,
        // the anchor (and the first item right after it) lands partly
        // hidden underneath it, which is what looked like landing
        // "midway through the first item" instead of at its top.
        var headerHeight = header ? header.getBoundingClientRect().height : 0;
        var targetY = anchor.getBoundingClientRect().top + window.scrollY - headerHeight - 12;
        window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
      });
    }

    wireFeedbackForm(order, items, messages, contact);
    fetchAndShowBuyerRating(order.buyer);

    document.getElementById("bottomBackBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (readOnly) goToOrderLookup(); else goToOrders();
    });
  }

  // Country line is skipped for US addresses — that matches how a
  // standard domestic USPS-style name/address block reads, and is what
  // gets pasted into PirateShip's address fields.
  function contactAddressLines(contact) {
    if (!contact) return [];
    var lines = [];
    if (contact.name) lines.push(contact.name);
    if (contact.address1) lines.push(contact.address1);
    if (contact.address2) lines.push(contact.address2);
    var cityStateZip = [contact.city, contact.state].filter(Boolean).join(", ") + (contact.postalCode ? " " + contact.postalCode : "");
    cityStateZip = cityStateZip.trim();
    if (cityStateZip) lines.push(cityStateZip);
    if (contact.countryCode && contact.countryCode !== "US") lines.push(contact.countryCode);
    return lines;
  }

  // UPS numbers always start "1Z"; USPS numbers are purely numeric and
  // long (tracking numbers range ~20-22 digits across their various
  // service prefixes — 9300/9400/9205/9407/etc — so matching "all
  // digits, long enough to be a real tracking number" catches those
  // without hardcoding one specific prefix). Anything else (FedEx,
  // DHL, a typo) is left as plain text rather than guessing a carrier
  // and linking to the wrong one.
  function trackingUrl(trackingNo) {
    var clean = (trackingNo || "").replace(/\s+/g, "");
    if (/^1Z/i.test(clean)) {
      return "https://www.ups.com/track?tracknum=" + encodeURIComponent(clean);
    }
    if (/^\d{10,}$/.test(clean)) {
      return "https://tools.usps.com/go/TrackConfirmAction?tLabels=" + encodeURIComponent(clean);
    }
    return null;
  }

  function renderTrackingRow(contact) {
    if (contact.trackingNo) {
      var url = trackingUrl(contact.trackingNo);
      var valueHtml = url
        ? '<a class="mono tracking-number-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(contact.trackingNo) + '</a>'
        : '<span class="mono">' + escapeHtml(contact.trackingNo) + '</span>';
      return '<div class="contact-row"><span class="contact-label">Tracking</span>' + valueHtml + '</div>';
    }
    return ""
      + '<div class="contact-row">'
      + '<span class="contact-label">Tracking</span>'
      + '<span class="tracking-entry">'
      + '<input type="text" class="tracking-input" id="trackingInput" placeholder="Enter tracking number" autocomplete="off">'
      + '<button class="copy-btn tracking-save-btn" id="saveTrackingBtn">Save</button>'
      + '</span>'
      + '</div>';
  }

  // Reuses Order Lookup/Sales Stats' already-fetched statsRows (full order
  // history, filed and unfiled alike), lazily topped up by
  // ensureStatsLoaded() if neither of those pages has been visited yet
  // this session — openOrder() kicks that off in the background (see
  // refreshPreviousOrders() there) and patches #buyerPreviousOrders in
  // place once it resolves, same deferred-fill pattern as the buyer
  // rating badge, rather than this function itself ever blocking the
  // order detail page on a fetch. Counts every other order from the same
  // buyer regardless of status (a cancelled or problem order still means
  // "this isn't their first time ordering"), matched case-insensitively
  // since BrickLink usernames aren't case-sensitive identifiers. Hidden
  // entirely for a first-time buyer rather than printing "Previous
  // orders: 0" — there's nothing useful to say about a buyer with no
  // history yet.
  function previousOrdersText(order) {
    if (!statsRows || !order.buyer) return "";
    var buyerLower = order.buyer.toLowerCase();
    var others = statsRows.filter(function (r) {
      return r.orderId !== order.orderId && r.buyer && r.buyer.toLowerCase() === buyerLower;
    });
    if (!others.length) return "";
    var mostRecent = others.reduce(function (latest, r) {
      return (!latest || new Date(r.date) > new Date(latest.date)) ? r : latest;
    }, null);
    return "Previous orders: " + others.length
      + (mostRecent ? " (most recent " + formatDate(mostRecent.date) + ")" : "");
  }

  function previousOrdersHtml(order) {
    return '<div class="buyer-previous-orders" id="buyerPreviousOrders">' + escapeHtml(previousOrdersText(order)) + '</div>';
  }

  function refreshPreviousOrdersLine(order) {
    var el = document.getElementById("buyerPreviousOrders");
    if (el) el.textContent = previousOrdersText(order);
  }

  function renderContactSection(contact) {
    if (!contact || (!contact.email && !contact.address1)) return "";
    var lines = contactAddressLines(contact);
    return ""
      + '<div class="contact-section">'
      + (lines.length ? '<div class="contact-row"><span class="contact-label">Ship to</span><span class="contact-address">' + lines.map(escapeHtml).join("<br>") + '</span></div>' : '')
      + (contact.email ? '<div class="contact-row"><span class="contact-label">Email</span><span>' + escapeHtml(contact.email) + '</span></div>' : '')
      + renderTrackingRow(contact)
      + '<div class="contact-actions">'
      + (lines.length ? '<button class="copy-btn" id="copyAddressBtn">Copy name &amp; address</button>' : '')
      + (contact.email ? '<button class="copy-btn" id="copyEmailBtn">Copy email</button>' : '')
      + '</div>'
      + '</div>';
  }

  // Payment method lives here now (moved out of the contact/address block)
  // alongside the full cost breakdown — all sourced from the same order
  // detail fetch, just grouped by what it's about rather than where it
  // came from. Optional charge rows (insurance/etc1/etc2/credit/coupon)
  // only show when BrickLink actually returned a non-zero value, so a
  // typical order isn't cluttered with a wall of "$0.00" rows.
  function financialRow(label, amount, currencyCode) {
    var num = Number(amount);
    if (!amount || isNaN(num) || num === 0) return "";
    return '<div class="contact-row"><span class="contact-label">' + escapeHtml(label) + '</span><span>' + escapeHtml(formatCurrency(amount, currencyCode)) + '</span></div>';
  }

  function renderFinancialSection(contact, order) {
    if (!contact) return "";
    var cost = contact.cost || {};
    var currencyCode = cost.currencyCode || order.currencyCode;
    var grandTotal = cost.grandTotal || order.orderTotal;
    if (!contact.paymentMethod && !grandTotal) return "";
    return ""
      + '<div class="contact-section">'
      + (contact.paymentMethod ? '<div class="contact-row"><span class="contact-label">Payment</span><span>' + escapeHtml(contact.paymentMethod) + '</span></div>' : '')
      + financialRow("Subtotal", cost.subtotal, currencyCode)
      + financialRow("Shipping", cost.shipping, currencyCode)
      + financialRow("Insurance", cost.insurance, currencyCode)
      + financialRow("Tax", cost.tax, currencyCode)
      + financialRow("Other", cost.etc1, currencyCode)
      + financialRow("Other", cost.etc2, currencyCode)
      + financialRow("Credit", cost.credit, currencyCode)
      + financialRow("Coupon", cost.coupon, currencyCode)
      + (grandTotal ? '<div class="contact-row financial-total"><span class="contact-label">Total</span><span>' + escapeHtml(formatCurrency(grandTotal, currencyCode)) + '</span></div>' : '')
      + '</div>';
  }

  // navigator.clipboard needs a secure context (fine — this app is always
  // served over HTTPS) but isn't available in every embedded webview, so
  // this falls back to the older execCommand("copy") dance via a hidden
  // textarea rather than just failing silently there.
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve(); else reject(new Error("Copy failed"));
      } catch (e) { reject(e); }
    });
  }

  function flashCopied(btn, originalText) {
    btn.textContent = "Copied!";
    setTimeout(function () { btn.textContent = originalText; }, 1500);
  }

  function renderMessagesSection(messages) {
    if (!messages || !messages.length) return "";
    var cards = messages.map(function (m) {
      return ""
        + '<div class="message-card">'
        + '<div class="message-meta"><span>' + escapeHtml(m.from || "") + '</span><span>' + escapeHtml(formatDate(m.dateSent)) + '</span></div>'
        + (m.subject ? '<div class="message-subject">' + escapeHtml(m.subject) + '</div>' : '')
        + '<div class="message-body">' + escapeHtml(m.body || "") + '</div>'
        + '</div>';
    }).join("");
    return '<div class="messages-section"><div class="messages-heading">Messages</div>' + cards + '</div>';
  }

  var RATING_OPTIONS = [
    { value: "Praise", label: "Praise", cls: "praise" },
    { value: "Neutral", label: "Neutral", cls: "neutral" },
    { value: "Complaint", label: "Complaint", cls: "complaint" }
  ];

  var DEFAULT_FEEDBACK_COMMENT = "A+ buyer! Thanks for your order with The Brick Stud, come back again soon :)";

  // Manual for now — Ryan records which box/mailer he actually used per
  // order so this becomes a real dataset (cross-referenced against each
  // order's pieces/weight/value) to eventually replace with an automatic
  // suggestion. Sizes match his actual boxes: Large 6x4x3, Medium 4x4x2,
  // Small 4x3x2, Mailer ~4x6 (used for small/individual parts).
  var BOX_OPTIONS = [
    { value: "large", label: "Large" },
    { value: "medium", label: "Medium" },
    { value: "small", label: "Small" },
    { value: "mailer", label: "Mailer" }
  ];

  function renderBoxChoiceSection(order) {
    var current = boxChoice[order.orderId] || "";
    var btns = BOX_OPTIONS.map(function (opt) {
      return '<button type="button" class="box-choice-btn' + (current === opt.value ? ' selected' : '') + '" data-box="' + opt.value + '">' + opt.label + '</button>';
    }).join("");
    return ""
      + '<div class="box-choice-section">'
      + '<div class="box-choice-heading">Box used</div>'
      + '<div class="box-choice-row">' + btns + '</div>'
      + '</div>';
  }

  // Not gated by readOnly, same as box choice above — this is bookkeeping,
  // not picking, so it belongs on every order's detail page (old orders
  // reached through Order Lookup, and new ones as they come in through the
  // main list) rather than only where Order Lookup happens to be open.
  // Started as a checkbox; switched to match the status-action-btn
  // style everything else in this row already uses (Mark as packed/
  // shipped/completed, File order, Send Drive Thru), with the
  // button disappearing into a sent-style confirmation line once logged,
  // same as feedback's "Feedback sent — thanks!" — per Ryan's own ask
  // after using the checkbox live. The confirmation line stays tappable
  // to undo, unlike feedback's (which can't be un-sent) — the only way
  // left to fix a wrongly threshold-defaulted older order, now that
  // there's no persistent checkbox to uncheck.
  function renderSpreadsheetLoggedAction(order) {
    if (isOrderLogged(order.orderId)) {
      return '<div class="spreadsheet-logged-msg" id="spreadsheetLoggedMsg" title="Tap to undo">Logged ✓</div>';
    }
    return '<button class="status-action-btn to-logged" id="spreadsheetLoggedBtn">Log in spreadsheet</button>';
  }

  function wireSpreadsheetLoggedAction(order) {
    var btn = document.getElementById("spreadsheetLoggedBtn");
    if (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        spreadsheetLogged[order.orderId] = true;
        pushOrderActions();
        refreshSpreadsheetLoggedAction(order);
      });
    }
    var msg = document.getElementById("spreadsheetLoggedMsg");
    if (msg) {
      msg.addEventListener("click", function (e) {
        e.stopPropagation();
        spreadsheetLogged[order.orderId] = false;
        pushOrderActions();
        refreshSpreadsheetLoggedAction(order);
      });
    }
  }

  function refreshSpreadsheetLoggedAction(order) {
    var row = document.getElementById("spreadsheetLoggedBtn") || document.getElementById("spreadsheetLoggedMsg");
    if (!row) return;
    row.outerHTML = renderSpreadsheetLoggedAction(order);
    wireSpreadsheetLoggedAction(order);
  }

  // Read-only display of the buyer's own feedback, once they've left it —
  // populated from buyerFeedbackCache (see openOrder()'s status-check
  // call), independent of whether Ryan has left his own feedback yet
  // (renderFeedbackSection below is the separate "leave feedback" form/
  // confirmation). Self-gating: returns "" until there's actually
  // something to show, so it's safe to call unconditionally.
  function renderBuyerFeedbackSection(order) {
    var fb = buyerFeedbackCache[order.orderId];
    if (!fb) return "";
    var tone = fb.rating === "Complaint" ? "complaint" : fb.rating === "Neutral" ? "neutral" : "praise";
    return ""
      + '<div class="buyer-feedback-section ' + tone + '">'
      + '<div class="buyer-feedback-heading">Buyer left feedback' + (fb.rating ? ': ' + escapeHtml(fb.rating) : '') + '</div>'
      + (fb.comment ? '<div class="buyer-feedback-comment">' + escapeHtml(fb.comment) + '</div>' : '')
      + (fb.dateRated ? '<div class="buyer-feedback-date">' + escapeHtml(formatDate(fb.dateRated)) + '</div>' : '')
      + '</div>';
  }

  function renderFeedbackSection(order) {
    if (feedbackSent[order.orderId]) {
      return '<div class="feedback-section"><div class="feedback-sent-msg">Feedback sent — thanks!</div></div>';
    }
    var ratingBtns = RATING_OPTIONS.map(function (opt) {
      return '<button type="button" class="rating-btn ' + opt.cls + '" data-rating="' + opt.value + '">' + opt.label + '</button>';
    }).join("");
    return ""
      + '<div class="feedback-section">'
      + '<div class="feedback-heading">Leave feedback for buyer</div>'
      + '<div class="feedback-rating-row">' + ratingBtns + '</div>'
      + '<textarea class="feedback-textarea" id="feedbackComment" maxlength="500">' + escapeHtml(DEFAULT_FEEDBACK_COMMENT) + '</textarea>'
      + '<button class="feedback-submit-btn" id="feedbackSubmitBtn" disabled>Submit feedback</button>'
      + '</div>';
  }

  function wireFeedbackForm(order, items, messages, contact) {
    var section = orderView.querySelector(".feedback-section");
    if (!section || feedbackSent[order.orderId]) return;

    var selectedRating = null;
    var ratingBtns = section.querySelectorAll(".rating-btn");
    var commentEl = section.querySelector("#feedbackComment");
    var submitBtn = section.querySelector("#feedbackSubmitBtn");

    function updateSubmitState() {
      submitBtn.disabled = !selectedRating || !commentEl.value.trim();
    }

    ratingBtns.forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        selectedRating = btn.getAttribute("data-rating");
        ratingBtns.forEach(function (b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        updateSubmitState();
      });
    });

    commentEl.addEventListener("click", function (e) { e.stopPropagation(); });
    commentEl.addEventListener("input", updateSubmitState);

    submitBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var comment = commentEl.value.trim();
      if (!selectedRating || !comment) return;
      if (!window.confirm("Post " + selectedRating + " feedback for order #" + order.orderId + "? This is public and visible to the buyer.")) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      postJSON("/api/feedback", { orderId: order.orderId, rating: selectedRating, comment: comment })
        .then(function () {
          feedbackSent[order.orderId] = true;
          pushOrderActions();
          renderOrderDetail(order, items, messages, contact);
        })
        .catch(function (err) {
          window.alert("Couldn't post feedback: " + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit feedback";
        });
    });
  }

  function handleSendDriveThru(order, items, messages, contact) {
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + order.orderId + "?")) return;

    var btn = document.getElementById("driveThruBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: order.orderId })
      .then(function () {
        driveThruSent[order.orderId] = true;
        pushOrderActions();
        renderOrderDetail(order, items, messages, contact);
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = "Send Drive Thru";
      });
  }

  // Confirmed against a live response: GET /members/{username}/ratings
  // returns { user_name, rating: { PRAISE, NEUTRAL, COMPLAINT } } — counts,
  // not an overall score — e.g. {"PRAISE":1,"NEUTRAL":0,"COMPLAINT":0}.
  function fetchAndShowBuyerRating(username) {
    var badge = document.getElementById("buyerRatingBadge");
    if (!badge || !username) return;

    if (ratingsCache[username]) {
      renderRatingBadge(badge, ratingsCache[username]);
      return;
    }

    fetchJSON("/api/member-rating?username=" + encodeURIComponent(username))
      .then(function (rating) {
        ratingsCache[username] = rating;
        var stillThere = document.getElementById("buyerRatingBadge");
        if (stillThere) renderRatingBadge(stillThere, rating);
      })
      .catch(function () { /* rating just won't show */ });
  }

  function renderRatingBadge(badge, rating) {
    if (!rating || !rating.rating || typeof rating.rating !== "object") return;
    var counts = rating.rating;
    var praise = Number(counts.PRAISE) || 0;
    var neutral = Number(counts.NEUTRAL) || 0;
    var complaint = Number(counts.COMPLAINT) || 0;
    var total = praise + neutral + complaint;
    if (total === 0) return;
    // One decimal place so e.g. 1835/1842 shows as 99.6%, not a
    // misleadingly-rounded 100% when there are some non-praise ratings.
    var pct = Math.round((praise / total) * 1000) / 10;
    badge.textContent = "★ " + total + " (" + pct + "%)";
  }

  function setOrderLoading(order) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '<div class="order-buyer">' + escapeHtml(order.buyer || "") + '</div>'
      + '</div>'
      + '<div class="state-block">Loading items…</div>';
  }

  function setOrderError(order, message) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '</div>'
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="orderRetryBtn">Try again</button></div>'
      + '<div class="reset-row"><button class="bottom-back-btn" id="bottomBackBtnErr">&#8592; ' + (orderDetailReadOnly ? "Order Lookup" : "All orders") + '</button></div>';
    var retryBtn = document.getElementById("orderRetryBtn");
    // Passing `order` as the fallback unconditionally is harmless when it
    // came from the main list too — openOrder() only falls back to it if
    // the order isn't found in `orders`.
    if (retryBtn) retryBtn.addEventListener("click", function () { openOrder(order.orderId, true, order); });
    var backBtnErr = document.getElementById("bottomBackBtnErr");
    if (backBtnErr) backBtnErr.addEventListener("click", function () { if (orderDetailReadOnly) goToOrderLookup(); else goToOrders(); });
  }

  // fallbackOrder: passed only by openLookupOrder() below, for an order
  // Order Lookup found that isn't in the main (unfiled-only) `orders`
  // array — its presence is also what flips orderDetailReadOnly on, since
  // an order reached this way never goes through the normal PAID→PACKED→
  // SHIPPED pick workflow this app's checkboxes track.
  // Runs every time an order's detail view opens, cached items or not —
  // status can change on BrickLink's side independent of the item list,
  // so this can't be skipped just because itemsCache already has a hit.
  // Only ever adds true (driveThruSent/feedbackAlreadyPosted) or corrects
  // order.status to what BrickLink's own /orders/{id} call reports right
  // now; any failure here just leaves things as they were.
  async function refreshOrderStatusCheck(order) {
    try {
      var statusCheck = await fetchJSON("/api/orders/" + encodeURIComponent(order.orderId) + "/status-check?buyer=" + encodeURIComponent(order.buyer || ""));
      var actionsChanged = false;
      if (statusCheck && statusCheck.driveThruSent && !driveThruSent[order.orderId]) {
        driveThruSent[order.orderId] = true;
        actionsChanged = true;
      }
      if (statusCheck && statusCheck.feedbackAlreadyPosted && !feedbackSent[order.orderId]) {
        feedbackSent[order.orderId] = true;
        actionsChanged = true;
      }
      if (actionsChanged) pushOrderActions();
      buyerFeedbackCache[order.orderId] = (statusCheck && statusCheck.buyerFeedback) || null;
      // Corrects a stale status before it's ever rendered — the main
      // orders list only refreshes on demand (Refresh button), and Order
      // Lookup's statsRows is a once-per-session snapshot (see below), so
      // either can still show e.g. RECEIVED for an order BrickLink (or
      // the buyer) has already moved to COMPLETED since. Rendering the
      // right action button for the real current status heads off a
      // confusing RESOURCE_UPDATE_NOT_ALLOWED / NOT_IN_UPDATABLE_STATUS
      // rejection from attempting a transition that's no longer valid —
      // this is the same `order` object referenced from the orders array
      // for a main-list order, so the correction shows there too once
      // back navigates to it, not just on this detail view.
      if (statusCheck && statusCheck.status && statusCheck.status !== order.status) {
        order.status = statusCheck.status;
      }
      // Same idea, for is_filed — catches an order filed directly on
      // BrickLink (bypassing this app) since Order Lookup's snapshot was
      // taken, or even since this same order was last opened this
      // session, so "File order" doesn't stay offered once it no longer
      // does anything. Only ever flips false -> true here, never true ->
      // false — this app is never the one that would know an order got
      // un-filed (there's no such action anywhere, on BrickLink or here).
      if (statusCheck && statusCheck.filed && !order.filed) {
        order.filed = true;
      }
    } catch (e) { /* ignore — just show whatever's already tracked locally */ }
  }

  async function openOrder(orderId, forceReload, fallbackOrder) {
    var order = orders.filter(function (o) { return o.orderId === orderId; })[0] || fallbackOrder;
    if (!order) return;
    orderDetailReadOnly = !!fallbackOrder;

    currentView = "order";
    ordersView.classList.add("hidden");
    orderView.classList.remove("hidden");
    inventoryView.classList.add("hidden");
    orderLookupView.classList.add("hidden");
    backBtn.style.display = "inline-flex";
    topbarCategoryRow.style.display = "none";
    topbarSubNavRow.style.display = "none";
    if (orderDetailReadOnly) {
      topbarProgressRow.classList.add("hidden");
    } else {
      topbarProgressRow.classList.remove("hidden");
    }
    brandSub.textContent = "Order #" + order.orderId;

    // Make sure picks (and Drive Thru/feedback completion) reflect the
    // durable remote state before showing anything — this is what makes
    // a force-quit not look like a reset. Usually already resolved by
    // the time someone taps in, so this rarely adds a visible delay.
    setOrderLoading(order);
    if (remoteSyncPromise) {
      try { await remoteSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (orderActionsSyncPromise) {
      try { await orderActionsSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (currentView !== "order" || order.orderId !== orderId) return;

    if (forceReload) { delete itemsCache[orderId]; delete messagesCache[orderId]; delete contactCache[orderId]; delete buyerFeedbackCache[orderId]; }

    // Best-effort, fire-and-forget — never awaited, so a first-ever load
    // this session (the only time it isn't already cached) never delays
    // the order detail page itself from showing.
    function refreshItemStockCounts() {
      ensureManageInventoryLoaded().then(function () {
        if (currentView !== "order" || order.orderId !== orderId) return;
        patchItemStockCounts(orderView);
      }).catch(function () { /* ignore — lines just stay blank */ });
    }

    // Same best-effort, fire-and-forget shape as refreshItemStockCounts()
    // above — loads the buyer's order history in the background (unless
    // Order Lookup/Stats already warmed it up this session) and patches
    // the "Previous orders" line in place once it lands, rather than
    // making every order open wait on an extra fetch.
    function refreshPreviousOrders() {
      ensureStatsLoaded().then(function () {
        if (currentView !== "order" || order.orderId !== orderId) return;
        refreshPreviousOrdersLine(order);
      }).catch(function () { /* ignore — line just stays hidden */ });
    }

    // Best-effort — only used to split the type summary's "parts" bucket
    // into fig/misc (see isFigPartCategory); a failure here just means
    // that split falls back to the old unsplit "parts" label, not that
    // the order fails to open.
    try { await getCategories(); } catch (e) { /* summary falls back to unsplit "parts" */ }

    var cached = itemsCache[orderId];
    if (cached) {
      await refreshOrderStatusCheck(order);
      if (currentView === "order" && order.orderId === orderId) {
        renderOrderDetail(order, cached, messagesCache[orderId] || [], contactCache[orderId] || null);
        refreshItemStockCounts();
        refreshPreviousOrders();
      }
      return;
    }

    setOrderLoading(order);
    try {
      var colors = await getColors();
      var items = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/items");
      items.forEach(function (item) {
        item.colorName = item.colorId ? (colors[item.colorId] || null) : null;
        item.name = decodeHtmlEntities(item.name);
        item.description = decodeHtmlEntities(item.description);
        item.remarks = decodeHtmlEntities(item.remarks);
      });
      itemsCache[orderId] = items;
      migrateOrderState(orderId, items);

      // Messages are a nice-to-have, not core to picking — a failure here
      // shouldn't block the order view from showing.
      var messages = [];
      try {
        messages = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/messages");
        messages.forEach(function (m) {
          m.subject = decodeHtmlEntities(m.subject);
          m.body = decodeHtmlEntities(m.body);
        });
      } catch (e) { /* ignore — just show the order without messages */ }
      messagesCache[orderId] = messages;

      // Payment method/address/email — also a nice-to-have, not core to
      // picking, so a failure here shouldn't block the order view either.
      var contact = null;
      try {
        contact = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/contact");
        contact.name = titleCaseName(decodeHtmlEntities(contact.name));
      } catch (e) { /* ignore — just show the order without the contact block */ }
      contactCache[orderId] = contact;

      await refreshOrderStatusCheck(order);

      if (currentView === "order" && order.orderId === orderId) {
        renderOrderDetail(order, items, messages, contact);
        refreshItemStockCounts();
        refreshPreviousOrders();
      }
    } catch (err) {
      if (currentView === "order" && order.orderId === orderId) {
        setOrderError(order, err.message);
      }
    }
  }

  // ---- Add Inventory (BrickScan CSV import) ----

  // Matches item-image.js's TYPE_LETTERS map, inverted — the single-letter
  // codes BrickScan's export (and BrickLink's own classic upload format)
  // use for ITEMTYPE aren't what the rest of this app works with; every
  // other item shown here (order items, thumbHtml/catalogImageUrl) uses
  // BrickLink's full-word type ("MINIFIG", "PART", ...), confirmed against
  // real order data. Converting up front means thumbHtml can be reused
  // as-is for the review cards.
  var INVENTORY_TYPE_CODE_TO_WORD = {
    P: "PART", S: "SET", M: "MINIFIG", B: "BOOK", G: "GEAR",
    C: "CATALOG", I: "INSTRUCTION", O: "ORIGINAL_BOX", U: "UNSORTED_LOT"
  };
  function inventoryTypeWord(code) {
    return INVENTORY_TYPE_CODE_TO_WORD[(code || "").trim().toUpperCase()] || "PART";
  }

  // Minimal RFC 4180 CSV parser — BrickScan's export quotes any field
  // containing a comma (e.g. item names like "Colonel Ward - Sand Green
  // Jacket, Reddish Brown Legs"), so a naive split(",") would misalign
  // every column after the first quoted field in a row.
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else {
          field += c;
        }
        continue;
      }
      if (c === '"') { inQuotes = true; continue; }
      if (c === ",") { row.push(field); field = ""; continue; }
      if (c === "\r") { continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; continue; }
      field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function csvTextToObjects(text) {
    var rows = parseCSV(text).filter(function (r) { return r.length > 1 || (r.length === 1 && r[0] !== ""); });
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).map(function (r) {
      var obj = {};
      headers.forEach(function (h, idx) { obj[h] = r[idx] !== undefined ? r[idx].trim() : ""; });
      return obj;
    });
  }

  var inventoryRowCounter = 0;

  // Default condition write-up text, seeded per-row below into BOTH
  // Description and Remarks, each only when BrickScan's own column for
  // it comes through blank — never overwrites text Ryan (or BrickScan)
  // already set. Still editable afterward via either field on the
  // review card.
