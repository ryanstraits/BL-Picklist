        + '<div class="item-thumb">' + thumbHtml(row) + '<span class="qty-chip' + (isMulti ? ' multi' : '') + '">' + row.quantity + '</span></div>'
        + '<div class="item-body">'
        + '<div class="item-line1">'
        + '<span class="item-no mono">' + escapeHtml(row.itemNo) + '</span>'
        + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(row.type) + '</span></span>'
        + '</div>'
        + '<div class="item-name">' + escapeHtml(row.name || "(name unknown)") + '</div>'
        + (isRealColorName(row.colorName) ? '<div class="item-color">' + escapeHtml(row.colorName) + '</div>' : '')
        + itemStockCountHtml(row)
        + '<div class="inventory-fields">'
        + '<div class="inventory-field"><label>Qty</label><input type="number" min="1" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="quantity" value="' + escapeHtml(row.quantity) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field"><label>Price</label><input type="text" inputmode="decimal" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="unitPrice" value="' + escapeHtml(row.unitPrice) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field"><label>Condition</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="newOrUsed"' + (locked ? ' disabled' : '') + '>'
        + '<option value="N"' + (row.newOrUsed === "N" ? ' selected' : '') + '>New</option>'
        + '<option value="U"' + (row.newOrUsed === "U" ? ' selected' : '') + '>Used</option>'
        + '</select></div>'
        // Name dropdown, not a bare numeric ID — same reasoning and same
        // helper (manualAddColorOptionsHtml) as the manual add-by-number
        // form's own Color field: Ryan doesn't have BrickLink's color IDs
        // memorized, and a CSV-imported row's COLOR column is just as
        // opaque a number as one typed in by hand.
        + '<div class="inventory-field"><label>Color</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="colorId"' + (locked ? ' disabled' : '') + '>' + manualAddColorOptionsHtml(colorsMap, row.colorId) + '</select></div>'
        // BrickLink's own Set-only "completeness" field (Complete/
        // Incomplete/Sealed) — separate from the New/Used Condition above,
        // and only meaningful (BrickLink rejects it otherwise) when the
        // row's actually a SET.
        + (row.type === "SET"
          ? '<div class="inventory-field"><label>Sub-Condition</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="completeness"' + (locked ? ' disabled' : '') + '>'
            + '<option value="C"' + (row.completeness === "C" ? ' selected' : '') + '>Complete</option>'
            + '<option value="B"' + (row.completeness === "B" ? ' selected' : '') + '>Incomplete</option>'
            + '<option value="S"' + (row.completeness === "S" ? ' selected' : '') + '>Sealed</option>'
            + '</select></div>'
          : '')
        // Ryan's own spreadsheet shorthand for a fig's condition — not a
        // BrickLink field at all, just carried along on the row so it can
        // ride into the fig log email at submit time. Used figs only —
        // a New one just gets the standard description, nothing to log.
        + (row.type === "MINIFIG" && row.newOrUsed === "U"
          ? '<div class="inventory-field"><label>Designation</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="designation"' + (locked ? ' disabled' : '') + '>'
            + FIG_DESIGNATION_OPTIONS.map(function (code) {
                return '<option value="' + code + '"' + (row.designation === code ? ' selected' : '') + '>' + code + '</option>';
              }).join("")
            + '</select></div>'
          : '')
        + '<div class="inventory-field"><label>Stock Room</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="stockRoomId"' + (locked ? ' disabled' : '') + '>'
        + '<option value=""' + (row.stockRoomId === "" ? ' selected' : '') + '>No</option>'
        + '<option value="A"' + (row.stockRoomId === "A" ? ' selected' : '') + '>A</option>'
        + '<option value="B"' + (row.stockRoomId === "B" ? ' selected' : '') + '>B</option>'
        + '<option value="C"' + (row.stockRoomId === "C" ? ' selected' : '') + '>C</option>'
        + '</select></div>'
        + '<div class="inventory-field description-field"><label>Description <span class="field-hint">(shown to buyer)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="description"' + (locked ? ' disabled' : '') + '>' + escapeHtml(row.description) + '</textarea></div>'
        + '<div class="inventory-field remarks-field"><label>Remarks <span class="field-hint">(private, only you see this)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="remarks"' + (locked ? ' disabled' : '') + '>' + escapeHtml(row.remarks) + '</textarea></div>'
        + '</div>'
        + resultHtml
        + '</div>'
        + '<div class="inventory-price-guide-block">'
        + '<div class="price-guide-header-row">'
        + viewOnBricklinkLinkHtml(row)
        + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(row.key) + '">' + (row.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
        + '</div>'
        + renderPriceGuidePanel(row)
        + '</div>'
        + '</div>';
    }).join("");

    var submitLabel = computeInventorySubmitLabel().label;

    inventoryView.innerHTML = ""
      + '<div class="inventory-intro">Review each item before it goes live on BrickLink. Uncheck anything you don’t want to add yet, edit price/qty/condition as needed, then submit.</div>'
      + figLogBannerHtml()
      + inventoryManualAddHtml()
      + '<div class="inventory-total-row"><span class="inventory-total-label">Total</span><span class="inventory-total-value mono" id="inventoryTotalValue">' + escapeHtml(inventoryTotalText()) + '</span></div>'
      + '<div class="inventory-summary-row">'
      + '<span id="inventorySummaryText">' + escapeHtml(inventorySummaryText()) + '</span>'
      + '<div class="inventory-bulk-actions">'
      + '<button type="button" id="invSelectAllBtn">Select all</button>'
      + '<button type="button" class="inv-start-over-btn">Start over</button>'
      + '</div>'
      + '</div>'
      + cards
      + '<div class="inventory-submit-row">'
      + '<button class="inventory-submit-btn" id="inventorySubmitBtn"' + (pendingCount === 0 || inventorySubmitting ? ' disabled' : '') + '>'
      + submitLabel
      + '</button>'
      + '<button type="button" class="inv-start-over-btn">Start over</button>'
      + '</div>';

    // Mirrors the total + submit button into the sticky topbar so both
    // stay reachable while scrolling a long review list — the in-page
    // ones at top/bottom of the list stay too, same dual pattern as the
    // order-detail page's sticky pick-progress bar.
    topbarInventorySubmitRow.classList.remove("hidden");
    topbarInventoryTotalValue.textContent = inventoryTotalText();
    topbarInventorySubmitBtn.textContent = submitLabel;
    topbarInventorySubmitBtn.disabled = pendingCount === 0 || inventorySubmitting;
    patchInventoryReviewProgress();

    wireThumbLinks(inventoryView);
    sizeThumbsToRows(inventoryView);
    wireInventoryManualAdd();

    inventoryView.querySelectorAll(".inventory-row-check").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (row) row.include = el.checked;
        renderInventoryReview();
      });
    });

    inventoryView.querySelectorAll(".inv-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        var field = el.getAttribute("data-field");
        if (field === "quantity" || field === "colorId") {
          row[field] = parseInt(el.value, 10) || 0;
        } else {
          row[field] = el.value;
        }
        // colorId changes which item+color the price guide looks up (a
        // different cache key) — re-fetch if that panel is open. newOrUsed
        // no longer affects the panel at all (both conditions are always
        // fetched), so it needs no re-fetch there. It does need a full
        // re-render on a MINIFIG row, though: the Designation field (and
        // its value) only makes sense for Used, so flipping Condition has
        // to show/hide it and keep row.designation in step — cleared on
        // New, freshly guessed on Used (the Description text alone won't
        // have changed, but re-running the guess here is cheap and keeps
        // this the one place that logic lives). Other fields don't need a
        // re-render either; doing one on every keystroke-triggering
        // "change" would drop focus mid-edit for no benefit, since
        // price/remarks don't affect anything else shown.
        if (field === "colorId") {
          if (row.priceExpanded) fetchPriceGuide(row, renderInventoryReview); else renderInventoryReview();
        } else if (field === "newOrUsed" && row.type === "MINIFIG") {
          row.designation = row.newOrUsed === "U" ? guessFigDesignation(row.description) : "";
          renderInventoryReview();
        } else if (field === "quantity" || field === "unitPrice") {
          // Keep the running total live without a full re-render, which
          // would otherwise drop focus mid-edit (see comment above).
          var totalEl = document.getElementById("inventoryTotalValue");
          if (totalEl) totalEl.textContent = inventoryTotalText();
          topbarInventoryTotalValue.textContent = inventoryTotalText();
          if (field === "quantity") {
            // Qty also drives the submit button's lots-vs-items wording and
            // this row's own >1 badge — both need the same live patch, not
            // just the total, or they'd silently go stale until some other
            // action happened to trigger a full re-render.
            patchInventorySubmitChrome();
            var rowEl = el.closest(".item-row");
            var chip = rowEl ? rowEl.querySelector(".qty-chip") : null;
            if (chip) {
              chip.textContent = row.quantity;
              chip.classList.toggle("multi", row.quantity > 1);
            }
          } else if (field === "unitPrice" && !row.priceReviewed) {
            // First touch of this row's own Price field counts as "Ryan
            // looked at this" — clears its border and counts toward the
            // topbar progress bar, same live-patch approach as Qty above.
            row.priceReviewed = true;
            var priceRowEl = el.closest(".item-row");
            if (priceRowEl) priceRowEl.classList.remove("needs-review");
            patchInventoryReviewProgress();
          }
        }
      });
    });

    inventoryView.querySelectorAll(".price-guide-toggle-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.priceExpanded = !row.priceExpanded;
        if (row.priceExpanded) fetchPriceGuide(row, renderInventoryReview);
        renderInventoryReview();
      });
    });

    inventoryView.querySelectorAll(".price-guide-collapse-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.priceExpanded = false;
        renderInventoryReview();
      });
    });

    inventoryView.querySelectorAll(".price-guide-row").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.unitPrice = formatPriceInput(el.getAttribute("data-price"));
        // Tapping a Used-section listing while the row's still set to New
        // (or vice versa) would otherwise leave the price and the declared
        // Condition mismatched — syncing them here keeps a tapped price
        // honest about which condition it actually came from.
        row.newOrUsed = el.getAttribute("data-condition") === "U" ? "U" : "N";
        renderInventoryReview();
      });
    });

    var selectAllBtn = document.getElementById("invSelectAllBtn");
    if (selectAllBtn) {
      selectAllBtn.addEventListener("click", function () {
        var allIncluded = inventoryRows.every(function (r) { return r.include || (r.result && r.result.success); });
        inventoryRows.forEach(function (r) { if (!(r.result && r.result.success)) r.include = !allIncluded; });
        renderInventoryReview();
      });
    }

    inventoryView.querySelectorAll(".inv-start-over-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!window.confirm("Discard this list and upload a different file?")) return;
        inventoryRows = null;
        renderInventoryView();
      });
    });

    var submitBtn = document.getElementById("inventorySubmitBtn");
    if (submitBtn) {
      submitBtn.addEventListener("click", handleInventorySubmit);
    }
  }

  function findInventoryRow(key) {
    return inventoryRows.filter(function (r) { return r.key === key; })[0] || null;
  }

  function handleInventorySubmit() {
    var toSubmit = inventoryRows.filter(function (r) { return r.include && !(r.result && r.result.success); });
    if (!toSubmit.length) return;
    // Same lots-vs-pieces distinction as the submit button itself
    // (computeInventorySubmitLabel) — this confirm was still only ever
    // counting rows, so it could say "18 items" for a batch that was
    // actually about to add 19 physical pieces.
    var toSubmitPieces = toSubmit.reduce(function (sum, r) { return sum + (parseInt(r.quantity, 10) || 0); }, 0);
    var confirmCountText = toSubmitPieces === toSubmit.length
      ? toSubmit.length + " item" + (toSubmit.length === 1 ? "" : "s")
      : toSubmit.length + " lot" + (toSubmit.length === 1 ? "" : "s") + " (" + toSubmitPieces + " item" + (toSubmitPieces === 1 ? "" : "s") + ")";
    if (!window.confirm("Add " + confirmCountText + " to your live BrickLink inventory? This makes them visible/purchasable on your store right away.")) return;

    inventorySubmitting = true;
    renderInventoryReview();

    postJSON("/api/inventory-create", {
      items: toSubmit.map(function (r) {
        return {
          key: r.key, type: r.type, itemNo: r.itemNo, colorId: r.colorId,
          quantity: r.quantity, newOrUsed: r.newOrUsed, unitPrice: r.unitPrice,
          description: r.description, remarks: r.remarks, stockRoomId: r.stockRoomId,
          completeness: r.completeness,
        };
      }),
    }).then(function (res) {
      // A 200 response with no (or a malformed) results array shouldn't
      // be possible per inventory-create.js's own code, but silently
      // no-op'ing here if it ever happened would look exactly like
      // nothing-happened-at-all from the review screen — surfacing it as
      // a real error instead means a genuine bug never goes unnoticed.
      if (!res || !Array.isArray(res.results)) {
        throw new Error("Got an unexpected response from the server — nothing was confirmed added. Please try again.");
      }
      res.results.forEach(function (result) {
        var row = findInventoryRow(result.key);
        if (row) row.result = result;
      });
    }).catch(function (err) {
      window.alert("Couldn't reach the server to submit these items: " + err.message);
    }).finally(function () {
      inventorySubmitting = false;
      renderInventoryReview();
    });
  }

  // ---- Label Prep ----
  // Shrinks a 4x6 Pirate Ship shipping label PDF/image to half size,
  // rotates it, and places it in one corner of a fresh 4x6 canvas — the
  // blank remainder doubles as tape for small-box orders. Rotation/
  // position are a one-time setting (persisted to localStorage), not a
  // per-label adjustment: Ryan dials them in once for how he actually
  // tapes boxes, and every label after that gets the same treatment.
  var LABEL_DPI = 300;
  var LABEL_CANVAS_W = 4 * LABEL_DPI;
  var LABEL_CANVAS_H = 6 * LABEL_DPI;
  var LABEL_PREP_SETTINGS_KEY = "labelPrepSettings";

  // Locked in from real-world testing with an actual Pirate Ship label
  // (not a slider anymore — Ryan dialed this in once and it's fixed now).
  // 67% filled the corner correctly but left content sitting flush
  // against — or, at 90°/270°, briefly overflowing past — the canvas
  // edges it's anchored to. Sized down slightly to 64% so the footprint
  // (including the 90° case, where the label's own height becomes the
  // on-canvas width) actually fits inside the canvas with room for
  // LABEL_EDGE_BUFFER on every edge it touches, not just flush/clipped.
  var LABEL_SCALE = 0.64;
  var LABEL_EDGE_BUFFER = LABEL_CANVAS_W * 0.02;

  function loadLabelPrepSettings() {
    var defaults = { rotation: 90, position: "top-right" };
    try {
      var raw = window.localStorage.getItem(LABEL_PREP_SETTINGS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        return {
          rotation: parsed.rotation || defaults.rotation,
          position: parsed.position || defaults.position,
        };
      }
    } catch (e) { /* fall through to defaults */ }
    return defaults;
  }
  function saveLabelPrepSettings() {
    try { window.localStorage.setItem(LABEL_PREP_SETTINGS_KEY, JSON.stringify(labelPrepSettings)); } catch (e) { /* best-effort */ }
  }

  var labelPrepSettings = loadLabelPrepSettings();
  var labelPrepSource = null; // { el: <img|canvas>, naturalWidth, naturalHeight }
  var labelPrepFileName = "";
  var labelPrepError = "";
  var labelPrepLoading = false;

  var LABEL_PREP_POSITIONS = [
    ["top-left", "Top-left"],
    ["top-right", "Top-right"],
    ["bottom-left", "Bottom-left"],
    ["bottom-right", "Bottom-right"],
    ["center", "Center"],
  ];

  function renderLabelPrepView() {
    labelPrepView.innerHTML = ""
      + '<div class="inventory-intro">Shrink a 4×6 Pirate Ship shipping label, rotate it, and tuck it into one corner — the blank remainder doubles as tape for small-box orders. Rotation and position are remembered, so you only need to set them once.</div>'
      + '<div class="inventory-upload"><input type="file" accept="application/pdf,image/*" class="inventory-file-input" id="labelPrepFileInput"></div>'
      + '<div class="inventory-fields">'
      + '<div class="inventory-field"><label>Rotation</label><select id="labelPrepRotation">'
      + [0, 90, 180, 270].map(function (deg) {
          return '<option value="' + deg + '"' + (labelPrepSettings.rotation === deg ? ' selected' : '') + '>' + deg + '°</option>';
        }).join('')
      + '</select></div>'
      + '<div class="inventory-field"><label>Position</label><select id="labelPrepPosition">'
      + LABEL_PREP_POSITIONS.map(function (p) {
          return '<option value="' + p[0] + '"' + (labelPrepSettings.position === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
        }).join('')
      + '</select></div>'
      + '</div>'
      + (labelPrepLoading ? '<div class="state-block">Loading label…</div>' : '')
      + (labelPrepError ? '<div class="state-block error">' + escapeHtml(labelPrepError) + '</div>' : '')
      + (labelPrepSource ? '<canvas id="labelPrepCanvas" class="label-prep-canvas"></canvas>' : '')
      + (labelPrepSource ? '<div class="inventory-submit-row"><button type="button" class="inventory-submit-btn" id="labelPrepDownloadBtn">Download PDF</button></div>' : '');

    document.getElementById("labelPrepFileInput").addEventListener("change", handleLabelPrepFile);

    document.getElementById("labelPrepRotation").addEventListener("change", function (e) {
      labelPrepSettings.rotation = parseInt(e.target.value, 10);
      saveLabelPrepSettings();
      drawLabelPrepOutput();
    });

    document.getElementById("labelPrepPosition").addEventListener("change", function (e) {
      labelPrepSettings.position = e.target.value;
      saveLabelPrepSettings();
      drawLabelPrepOutput();
    });

    if (labelPrepSource) {
      drawLabelPrepOutput();
      document.getElementById("labelPrepDownloadBtn").addEventListener("click", downloadLabelPrepPdf);
    }
  }

  function handleLabelPrepFile(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    labelPrepError = "";
    labelPrepSource = null;
    labelPrepLoading = true;
    labelPrepFileName = file.name || "label";
    renderLabelPrepView();

    var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
    var loadPromise = isPdf ? loadLabelPrepFromPdf(file) : loadLabelPrepFromImage(file);

    loadPromise.then(function (source) {
      labelPrepSource = source;
      labelPrepLoading = false;
      renderLabelPrepView();
    }).catch(function (err) {
      labelPrepError = "Couldn't read that file: " + err.message;
      labelPrepLoading = false;
      renderLabelPrepView();
    });
  }

  function loadLabelPrepFromImage(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        resolve({ el: img, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight });
      };
      img.onerror = function () { reject(new Error("Not a readable image file")); };
      img.src = URL.createObjectURL(file);
    });
  }

  // Renders the PDF's first page to an offscreen canvas at LABEL_DPI, so
  // the rest of the pipeline treats a PDF upload exactly like an image
  // upload — just another drawable source with a known pixel size.
  function loadLabelPrepFromPdf(file) {
    if (!window.pdfjsLib) return Promise.reject(new Error("PDF support is still loading — try again in a second"));
    return file.arrayBuffer().then(function (buf) {
      return window.pdfjsLib.getDocument({
        data: buf,
        standardFontDataUrl: "/vendor/pdfjs/standard_fonts/",
      }).promise;
    }).then(function (pdf) {
      return pdf.getPage(1);
    }).then(function (page) {
      // Page geometry is in points (1/72in) — scale to LABEL_DPI for a
      // print-quality raster, whatever the label's actual page size is.
      var viewport = page.getViewport({ scale: LABEL_DPI / 72 });
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      var ctx = canvas.getContext("2d");
      return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
        return { el: canvas, naturalWidth: canvas.width, naturalHeight: canvas.height };
      });
    });
  }

  function drawLabelPrepOutput() {
    if (!labelPrepSource) return;
    var canvas = document.getElementById("labelPrepCanvas");
    if (!canvas) return;
    canvas.width = LABEL_CANVAS_W;
    canvas.height = LABEL_CANVAS_H;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, LABEL_CANVAS_W, LABEL_CANVAS_H);

    var scaledW = labelPrepSource.naturalWidth * LABEL_SCALE;
    var scaledH = labelPrepSource.naturalHeight * LABEL_SCALE;

    var angle = labelPrepSettings.rotation;
    var angleRad = angle * Math.PI / 180;
    // A 90°/270° rotation swaps which of the scaled label's own
    // dimensions determines the on-canvas footprint's width vs height.
    var rotated = angle === 90 || angle === 270;
    var footprintW = rotated ? scaledH : scaledW;
    var footprintH = rotated ? scaledW : scaledH;

    // Every non-center position insets from the two canvas edges it's
    // anchored to by LABEL_EDGE_BUFFER, so content never sits flush
    // against — or, worse, overflows past — the physical label edge.
    var x, y;
    switch (labelPrepSettings.position) {
      case "top-right": x = LABEL_CANVAS_W - footprintW - LABEL_EDGE_BUFFER; y = LABEL_EDGE_BUFFER; break;
      case "bottom-left": x = LABEL_EDGE_BUFFER; y = LABEL_CANVAS_H - footprintH - LABEL_EDGE_BUFFER; break;
      case "bottom-right": x = LABEL_CANVAS_W - footprintW - LABEL_EDGE_BUFFER; y = LABEL_CANVAS_H - footprintH - LABEL_EDGE_BUFFER; break;
      case "center": x = (LABEL_CANVAS_W - footprintW) / 2; y = (LABEL_CANVAS_H - footprintH) / 2; break;
      default: x = LABEL_EDGE_BUFFER; y = LABEL_EDGE_BUFFER; // top-left
    }

    // Rotating around the block's own center (after translating to where
    // that center should land) correctly handles all four angles and all
    // five position presets through one code path, rather than
    // special-casing each rotation's placement math separately.
    ctx.save();
    ctx.translate(x + footprintW / 2, y + footprintH / 2);
    ctx.rotate(angleRad);
    ctx.drawImage(labelPrepSource.el, -scaledW / 2, -scaledH / 2, scaledW, scaledH);
    ctx.restore();
  }

  // Builds a PDF (not just a PNG) so the output can carry the label's own
  // physical page size, and hands it off as a Blob URL rather than a data:
  // URL — the old data:-URL `<a download>` click silently did nothing on
  // iOS Safari/WebKit (Ryan's "Chrome on iOS", same underlying engine
  // that mishandled Set-Cookie from fetch() earlier in this app): WebKit
  // doesn't reliably honor the download attribute for data: URLs. A Blob
  // URL either downloads directly (desktop browsers) or opens in Safari's
  // own PDF viewer, which has a working Share/Save-to-Files button either
  // way, so it degrades gracefully instead of doing nothing.
  function downloadLabelPrepPdf() {
    var canvas = document.getElementById("labelPrepCanvas");
    if (!canvas || !window.PDFLib) return;
    var base = (labelPrepFileName || "label").replace(/\.[^.]+$/, "");
    var pageWidthPt = (LABEL_CANVAS_W / LABEL_DPI) * 72;
    var pageHeightPt = (LABEL_CANVAS_H / LABEL_DPI) * 72;
    canvas.toBlob(function (pngBlob) {
      if (!pngBlob) return;
      pngBlob.arrayBuffer().then(function (pngBytes) {
        return window.PDFLib.PDFDocument.create().then(function (pdfDoc) {
          return pdfDoc.embedPng(pngBytes).then(function (pngImage) {
            var page = pdfDoc.addPage([pageWidthPt, pageHeightPt]);
            page.drawImage(pngImage, { x: 0, y: 0, width: pageWidthPt, height: pageHeightPt });
            return pdfDoc.save();
          });
        });
      }).then(function (pdfBytes) {
        var blob = new Blob([pdfBytes], { type: "application/pdf" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = base + "-2x3.pdf";
        link.target = "_blank";
        link.rel = "noopener";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      });
    }, "image/png");
  }

  // ---- Manage Inventory ----
  // Edits Ryan's *existing* live BrickLink listings (hundreds of parts,
  // figs, and sets) — a different job from Add Inventory, which only
  // stages brand-new rows for a one-time bulk create. Search-first by
  // design: GET /inventories returns all ~800+ rows in one unpaginated
  // call, so the page fetches once and filters client-side rather than
  // rendering everything at once, which would be slow on a phone and
  // mostly useless to scroll through. Color and the item itself aren't
  // editable here — both are part of a listing's identity, not something
  // you'd change after the fact — and there's no Bin field, because
  // BrickLink's own inventory data has no such concept; the Bin shown on
  // Add Inventory comes entirely from Ryan's own CSV export.
  //
  // Edits are staged locally (a "Review, then submit" batch, same model
  // as Add Inventory) rather than auto-saved per field — dirty rows are
  // tracked against a snapshot of what was actually loaded from
  // BrickLink, survive switching searches, and only reach BrickLink when
  // Submit is tapped and confirmed.
  var manageInventoryRows = null; // null = not fetched yet
  var manageInventoryLoading = false;
  var manageInventoryError = "";
  var manageInventorySearchQuery = "";
  // True only when Manage Inventory was opened via the "Manage in
  // Inventory →" jump link from Set/Fig Lookup — shows the shared topbar
  // back button so Ryan can return to exactly where he left the lookup
  // (its own state — query, drill-in, tab — is never touched by this
  // flag or by leaving the view, so there's nothing to restore by hand).
  var manageInventoryCameFromSetFigLookup = false;
  var manageInventoryCameFromSort = false;
  var sortReturnScrollY = 0;
  var manageInventorySubmitting = false;
  var manageInventorySearchDebounceTimer = null;
  var MANAGE_INVENTORY_RESULT_CAP = 50;
  // Browse-by-type-then-theme navigation, shown when the search box is
  // empty. browseType null = showing the type breakdown; set = showing
  // that type's theme/category breakdown (browseCategory null) or that
  // type+category's item list (browseCategory set, "" means "all items
  // of this type, uncategorized by theme").
  var manageInventoryBrowseType = null;
  var manageInventoryBrowseCategory = null;
  // manageInventoryBrowseCategory's sentinel for "every theme of this type
  // at once" (the All tile) — "" already means uncategorized, so it needs
  // its own value.
  var MANAGE_INVENTORY_ALL = "*";
  // How many cards the category/All item list currently shows; grows by one
  // page per "Show more" tap and resets whenever the browse level changes.
  var manageInventoryListLimit = 50;
  var manageInventoryBrowseRecent = false;
  var manageInventoryCategoriesLoading = false;
  var manageInventorySortKey = "newest"; // itemNoAsc | itemNoDesc | newest | oldest | priceDesc | priceAsc | qtyDesc
  var manageInventoryRecentDays = 30; // 15 | 30
  // Whether any row actually came back with a dateCreated — BrickLink's
  // date_created field isn't confirmed against a real response the way
  // the rest of this shape is (see inventory-list.js), so the
  // newest/oldest sort options and the Recently Added browse entry both
  // check this and quietly hide themselves if it's not really there,
  // rather than offering a feature that can't work.
  var manageInventoryHasDates = false;

  // ---- Bulk Sale ----
  // null = not fetched yet from the Blobs store; [] once fetched with
  // nothing running; otherwise an array of concurrently running sales,
  // each { id, active: true, mode: "rate", label, discountPct, startedAt,
  // endsAt, items: { [row.key]: { itemNo, colorId, name } } }.
  // A sale is BrickLink's own per-listing sale percentage (sale_rate) set
  // on each item — unit_price is never touched — so this record only
  // remembers which items are in it, plus its label and end date; the
  // percentage itself lives on the listings (row.saleRate).
  // Several sales can run at once (e.g. one per category) as long as
  // they don't share an item — starting a new one filters out anything
  // already in another active sale's items (see
  // itemKeysInAnyActiveSale() below), or already carrying a sale rate.
  var activeSales = null;
  var activeSalesLoadPromise = null;
  // The in-progress "Start Sale" form: { rows, pct, endsAt, label,
  // excludedCount } once Ryan's picked a segment (a theme/category list
  // or a search result list) to put on sale, else null. excludedCount is
  // how many of that segment's otherwise-eligible rows got left out
  // because they're already in a different running sale.
  var saleDraft = null;
  var saleSubmitting = false;
  // Which running sale's "End Sale Now" is currently in flight (its id),
  // or null — only one revert at a time, same as starting a sale.
  var saleEndingId = null;
  // Multi-select mode for staging a sale across several types/themes at
  // once before committing to any of them — see toggleSaleSelectScope
  // below. Off by default; toggled on by its own entry button rather
  // than being how Browse always works, so the common single-theme case
  // (startSaleDraft, unaffected by any of this) stays a one-tap action.
  var saleSelectMode = false;
  // scopeKey -> { type, catId (null = the whole type), label }. Explicit
  // picks only — checking a type doesn't auto-check/uncheck its themes
  // or vice versa; saleSelectedScopeRows() below dedupes by row key at
  // resolution time, so picking both "all PART" and "PART > Bricks"
  // doesn't double an item into the sale twice.
  var saleSelectedScopes = {};
  // The "Put aged inventory on sale" threshold picker: { type, beforeDate
  // (YYYY-MM-DD) } once open, else null. A separate, inventory-wide scope
  // alongside the theme/category ones above — picking it resolves to a
  // row list the same way any other scope does, then hands off to the
  // same startSaleDraft(rows)/saleDraft confirm panel every other sale
  // entry point already uses.
  var saleAgeDraft = null;
  // Whether the idle "Bulk Sale" entry box is expanded to show its
  // buttons, or collapsed to a single out-of-the-way line — the default
  // everywhere, since most browsing has nothing to do with starting a
  // sale. Reset to false (back to collapsed) whenever a sale flow
  // actually ends, cancelled or completed — only "I tapped it open and
  // haven't acted yet" keeps it expanded.
  var saleAreaExpanded = false;

  // Raw fetch-and-cache, pulled out of fetchManageInventory() so a
  // read-only consumer that has nothing to do with Manage Inventory's own
  // page (the order detail stock count below) can trigger and reuse the
  // exact same cached manageInventoryRows without touching
  // manageInventoryLoading/Error or calling renderManageInventoryView() —
  // both of which would be meaningless (or actively wrong, re-rendering a
  // view that isn't even open) from an order detail page.
  function loadManageInventoryRows() {
    return fetchJSON("/api/inventory-list").then(function (res) {
      // BrickLink's catalog text sometimes carries raw HTML entities
      // (e.g. "&#40;" for "(") — same quirk decoded for order items and
      // CSV-imported inventory names elsewhere in this app.
      manageInventoryRows = (res.items || []).map(function (item) {
        var description = decodeHtmlEntities(item.description);
        var remarks = decodeHtmlEntities(item.remarks);
        var unitPrice = formatPriceInput(item.unitPrice);
        var snapshot = {
          quantity: item.quantity, newOrUsed: item.newOrUsed, unitPrice: unitPrice,
          description: description, remarks: remarks, stockRoomId: item.stockRoomId || "",
          saleRate: Number(item.saleRate) || 0,
        };
        return {
          key: item.key,
          inventoryId: item.inventoryId,
          itemNo: item.itemNo,
          type: item.type,
          categoryId: item.categoryId || 0,
          name: decodeHtmlEntities(item.name),
          colorId: item.colorId,
          colorName: item.colorName,
          quantity: item.quantity,
          newOrUsed: item.newOrUsed,
          unitPrice: unitPrice,
          description: description,
          remarks: remarks,
          stockRoomId: item.stockRoomId || "",
          dateCreated: item.dateCreated || null,
          saleRate: Number(item.saleRate) || 0,
          orig: snapshot,
          result: null,
          markedForDelete: false,
          priceExpanded: false,
        };
      });
      manageInventoryHasDates = manageInventoryRows.some(function (r) { return !!r.dateCreated; });
      return manageInventoryRows;
    });
  }

  // setRefreshing() here spins/disables the same shared topbar button
  // Orders uses — it's only ever visible on this page while Manage
  // Inventory is the active view, so there's no risk of it spinning while
  // looking at something unrelated. Every path that forces a real re-fetch
  // (the topbar button, the search-scoped Refresh, Retry-on-error) goes
  // through here, so all three stay in sync with it for free.
  function fetchManageInventory() {
    manageInventoryLoading = true;
    manageInventoryError = "";
    setRefreshing(true);
    renderManageInventoryView();

    return loadManageInventoryRows().catch(function (err) {
      manageInventoryError = "Couldn't load your inventory: " + err.message;
    }).finally(function () {
      manageInventoryLoading = false;
      setRefreshing(false);
      renderManageInventoryView();
    });
  }

  // Lazy, cached, session-lifetime load for read-only consumers — same
  // "fetch once, reuse forever this session" pattern as getColors().
  // Explicit Refresh/Retry on the Manage Inventory page itself still goes
  // through fetchManageInventory() -> loadManageInventoryRows() directly,
  // which always re-fetches regardless of what's already cached; this
  // only ever fills the cache if nothing's there yet, never forces a
  // refetch of data that's merely gone stale.
  var manageInventoryLazyLoadPromise = null;
  function ensureManageInventoryLoaded() {
    if (manageInventoryRows) return Promise.resolve(manageInventoryRows);
    if (!manageInventoryLazyLoadPromise) {
      manageInventoryLazyLoadPromise = loadManageInventoryRows().catch(function (err) {
        manageInventoryLazyLoadPromise = null; // let a later call retry rather than caching the failure forever
        throw err;
      });
    }
    return manageInventoryLazyLoadPromise;
  }

  // Sums every non-deleted inventory lot matching this exact item+color —
  // condition (New/Used) isn't part of the match, since "how many more of
  // the same piece do I have" is about the piece, not which condition it's
  // currently listed in. BrickLink's own inventory listings are separate
  // from order line items (a sold lot is decremented/removed from
  // inventory, not still counted as "in stock"), so no need to subtract
  // anything this order itself already accounts for.
  function inventoryStockCount(itemNo, colorId) {
    var total = 0;
    manageInventoryRows.forEach(function (r) {
      if (r.itemNo === itemNo && r.colorId === colorId && !r.markedForDelete) total += Number(r.quantity) || 0;
    });
    return total;
  }

  // "X in inventory" told Ryan he already has some, but not at what price
  // — so matching a new listing's price to his existing ones meant going
  // to look them up separately. Each *distinct* price among the matching
  // lots, not a blended average — the point is picking one to match, and
  // an average isn't a price anyone's actually listed at. Summed quantity
  // per price (not lot count) so two lots at the same price don't show
  // that price twice.
  function inventoryStockPriceSummary(itemNo, colorId) {
    var qtyByPrice = {};
    manageInventoryRows.forEach(function (r) {
      if (r.itemNo !== itemNo || r.colorId !== colorId || r.markedForDelete) return;
      var price = parseFloat(r.unitPrice);
      if (isNaN(price)) return;
      var key = price.toFixed(2);
      qtyByPrice[key] = (qtyByPrice[key] || 0) + (parseInt(r.quantity, 10) || 0);
    });
    var prices = Object.keys(qtyByPrice).sort(function (a, b) { return Number(a) - Number(b); });
    if (!prices.length) return "";
    return prices.map(function (p) { return formatCurrency(p, "USD") + " ×" + qtyByPrice[p]; }).join(", ");
  }

  function findManageInventoryRow(key) {
    return (manageInventoryRows || []).filter(function (r) { return r.key === key; })[0] || null;
  }

  function isManageInventoryRowDirty(row) {
    return row.markedForDelete
      || row.quantity !== row.orig.quantity
      || row.newOrUsed !== row.orig.newOrUsed
      || String(row.unitPrice) !== String(row.orig.unitPrice)
      || row.description !== row.orig.description
      || row.remarks !== row.orig.remarks
      || row.stockRoomId !== row.orig.stockRoomId
      || row.saleRate !== row.orig.saleRate;
  }

  // BrickLink item numbers mix pure-digit ("3001") and letter-prefixed
  // ("sw0359") forms — { numeric: true } makes localeCompare treat the
  // digit runs in each as numbers rather than comparing them character
  // by character, so "87079" correctly sorts after "3001" instead of
  // before it.
  function compareManageInventoryItemNo(a, b) {
    return (a.itemNo || "").localeCompare(b.itemNo || "", undefined, { numeric: true, sensitivity: "base" });
  }
  function compareManageInventoryDate(a, b) {
    var ta = a.dateCreated ? new Date(a.dateCreated).getTime() : 0;
    var tb = b.dateCreated ? new Date(b.dateCreated).getTime() : 0;
    return ta - tb;
  }
  function manageInventorySortRows(rows) {
    var key = manageInventorySortKey;
    var sorted = rows.slice();
    sorted.sort(function (a, b) {
      if (key === "itemNoDesc") return compareManageInventoryItemNo(b, a);
      if (key === "newest") return compareManageInventoryDate(b, a);
      if (key === "oldest") return compareManageInventoryDate(a, b);
      if (key === "qtyDesc") return (Number(b.quantity) || 0) - (Number(a.quantity) || 0) || compareManageInventoryItemNo(a, b);
      // Per-piece listing price (the Price box), ties by item number.
      if (key === "priceDesc") return (parseFloat(b.unitPrice) || 0) - (parseFloat(a.unitPrice) || 0) || compareManageInventoryItemNo(a, b);
      if (key === "priceAsc") return (parseFloat(a.unitPrice) || 0) - (parseFloat(b.unitPrice) || 0) || compareManageInventoryItemNo(a, b);
      return compareManageInventoryItemNo(a, b);
    });
    return sorted;
  }
  function manageInventorySortSelectHtml() {
    var dateOptions = manageInventoryHasDates
      ? '<option value="newest"' + (manageInventorySortKey === "newest" ? ' selected' : '') + '>Newest first</option>'
        + '<option value="oldest"' + (manageInventorySortKey === "oldest" ? ' selected' : '') + '>Oldest first</option>'
      : '';
    return '<select class="manage-inventory-sort-select" id="manageInventorySortSelect">'
      + '<option value="itemNoAsc"' + (manageInventorySortKey === "itemNoAsc" ? ' selected' : '') + '>Item # (low→high)</option>'
      + '<option value="itemNoDesc"' + (manageInventorySortKey === "itemNoDesc" ? ' selected' : '') + '>Item # (high→low)</option>'
      + dateOptions
      + '<option value="priceDesc"' + (manageInventorySortKey === "priceDesc" ? ' selected' : '') + '>Price (high→low)</option>'
      + '<option value="priceAsc"' + (manageInventorySortKey === "priceAsc" ? ' selected' : '') + '>Price (low→high)</option>'
      + '<option value="qtyDesc"' + (manageInventorySortKey === "qtyDesc" ? ' selected' : '') + '>Quantity (high→low)</option>'
      + '</select>';
  }

  function manageInventoryRecentRows(days) {
    var cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
    return (manageInventoryRows || []).filter(function (r) {
      if (!r.dateCreated) return false;
      var t = new Date(r.dateCreated).getTime();
      return !isNaN(t) && t >= cutoff;
    });
  }

  // The inverse of manageInventoryRecentRows — stale listings rather than
  // fresh ones, for the aged-inventory sale picker. A row with no
  // dateCreated (BrickLink doesn't always return one) can't be judged
  // against a threshold, so it's left out rather than guessed at — same
  // call manageInventoryRecentRows already makes the other direction.
  // typeFilter is "" for all types, else an exact row.type match.
  function isoDateDaysAgo(days) {
    var d = new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    return d.toISOString().slice(0, 10);
  }
  function manageInventoryAgedRows(beforeDate, typeFilter) {
    var cutoff = new Date(beforeDate + "T23:59:59").getTime();
    return (manageInventoryRows || []).filter(function (r) {
      if (typeFilter && r.type !== typeFilter) return false;
      // Stock room inventory is held back on purpose, not just sitting
      // unsold — an age threshold shouldn't sweep it into a sale just
      // because it's been there a while.
      if (r.stockRoomId) return false;
      if (!r.dateCreated) return false;
      var t = new Date(r.dateCreated).getTime();
      return !isNaN(t) && t <= cutoff;
    });
  }

  // Lots = distinct listings/rows (BrickLink's own unit — one row per
  // item+color+condition combo); items = total pieces (sum of
  // quantities across those lots) — the two numbers differ any time a
  // lot has quantity > 1, and conflating them ("N items" meaning "N
  // rows") is exactly the mislabeling this replaces.
  // avgPrice is per-piece (value / items, not value / lots) — the same
  // basis Ryan already thinks in for cost/lb on parts, so it's directly
  // comparable rather than mixing two different units of "average."
  //
  // No weight here — BrickLink's Inventory List endpoint doesn't embed
  // catalog weight the way Order Items does (confirmed against a real
  // raw row: its item sub-object is just {no, name, type, category_id},
  // and the only weight-shaped field present, my_weight, is a seller-set
  // per-listing override that defaults to "0.0000" and reads as 0 for
  // virtually every real row). Getting the real figure would mean a
  // separate catalog lookup per distinct item number — Ryan opted to
  // drop weight from this feature rather than take on that cost.
  function manageInventoryStats(rows) {
    var items = 0, value = 0;
    rows.forEach(function (r) {
      var qty = parseInt(r.quantity, 10) || 0;
      var price = parseFloat(r.unitPrice) || 0;
      items += qty;
      value += qty * price;
    });
    return { lots: rows.length, items: items, value: value, avgPrice: items > 0 ? value / items : 0 };
  }
  function manageInventoryStatsHtml(stats) {
    return '<div class="stats-summary manage-inventory-stats">'
      + '<div class="stats-summary-tile"><strong>' + stats.lots + '</strong><span>lots</span></div>'
      + '<div class="stats-summary-tile"><strong>' + stats.items + '</strong><span>items</span></div>'
      + '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(stats.value, "USD")) + '</strong><span>total value</span></div>'
      + '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(stats.avgPrice, "USD")) + '</strong><span>avg price</span></div>'
      + '</div>';
  }

  // Right-aligned, stacked stat block shared by every browse-tile (type,
  // theme/category, and Recently Added) — count pill on top (unchanged),
  // then total value and avg price each in their own boxed chip below it,
  // sized down from the tile's base font since some category names (the
  // part-category tree especially, e.g. "Minifigure, Torso Assembly")
  // already run long and need the room on the left. "avg" trails the
  // number (not "avg $X") to match how the number itself reads first.
  function browseTileStatsHtml(stats) {
    return '<span class="browse-tile-stats">'
      + '<span class="browse-tile-count">' + stats.lots + '</span>'
      + '<span class="browse-tile-value-box">' + escapeHtml(formatCurrency(stats.value, "USD")) + '</span>'
      + '<span class="browse-tile-avg-box">' + escapeHtml(formatCurrency(stats.avgPrice, "USD")) + ' avg</span>'
      + '</span>';
  }

  // type -> full manageInventoryStats() shape (lots/items/value/avgPrice),
  // not just a lot count — so each type tile can show the same rollup the
  // page-level summary does, without re-deriving it per row at render time.
  function manageInventoryTypeCounts() {
    var groups = {};
    (manageInventoryRows || []).forEach(function (r) {
      (groups[r.type] = groups[r.type] || []).push(r);
    });
    var counts = {};
    Object.keys(groups).forEach(function (t) { counts[t] = manageInventoryStats(groups[t]); });
    return counts;
  }

  // topCategoryId (string) -> manageInventoryStats() shape plus `name`.
  function manageInventoryThemeCounts(type) {
    var groups = {}; // topCategoryId (string) -> { name, rows }
    (manageInventoryRows || []).forEach(function (r) {
      if (r.type !== type) return;
      var topId = r.categoryId ? topCategoryId(r.categoryId, categoriesById) : 0;
      var key = String(topId || 0);
      if (!groups[key]) groups[key] = { name: categoryDisplayNameById(topId), rows: [] };
      groups[key].rows.push(r);
    });
    var counts = {};
    Object.keys(groups).forEach(function (id) {
      var stats = manageInventoryStats(groups[id].rows);
      stats.name = groups[id].name;
      counts[id] = stats;
    });
    return counts;
  }

  function manageInventoryBreadcrumb() {
    var parts = ['<button type="button" class="browse-crumb" data-browse-reset="type">All types</button>'];
    if (manageInventoryBrowseRecent) {
      parts.push('<span class="browse-crumb-current">Recently Added</span>');
    } else if (manageInventoryBrowseType) {
      if (manageInventoryBrowseCategory !== null) {
        parts.push('<button type="button" class="browse-crumb" data-browse-reset="category">' + escapeHtml(manageInventoryBrowseType) + '</button>');
        parts.push('<span class="browse-crumb-current">' + escapeHtml(manageInventoryBrowseCategory === MANAGE_INVENTORY_ALL ? "All" : categoryDisplayNameById(manageInventoryBrowseCategory)) + '</span>');
      } else {
        parts.push('<span class="browse-crumb-current">' + escapeHtml(manageInventoryBrowseType) + '</span>');
      }
    }
    return '<div class="browse-breadcrumb">' + parts.join('<span class="browse-crumb-sep">›</span>') + '</div>';
  }

  // Pulled out of manageInventoryBrowseHtml's own theme/category list so
  // the "Put on sale" trigger (wired separately, after the button it sits
  // next to is rendered) can re-derive the exact same row set that list
  // is currently showing, without duplicating the filter logic.
  function manageInventoryCategoryRows(type, catId) {
    return (manageInventoryRows || []).filter(function (r) {
      if (r.type !== type) return false;
      if (catId === MANAGE_INVENTORY_ALL) return true;
      var topId = r.categoryId ? topCategoryId(r.categoryId, categoriesById) : 0;
      return String(topId || 0) === catId;
    });
  }

  // Same reasoning as manageInventoryCategoryRows, one level up — every
  // row of a type regardless of theme, for the "Put on sale" trigger on
  // the theme-breakdown screen (put the whole type on sale without
  // drilling into any one theme first).
  function manageInventoryTypeRows(type) {
    return (manageInventoryRows || []).filter(function (r) { return r.type === type; });
  }

  function saleScopeKey(type, catId) {
    return (catId === null || catId === undefined) ? "T:" + type : "C:" + type + ":" + catId;
  }

  function toggleSaleSelectScope(type, catId, label) {
    var key = saleScopeKey(type, catId);
    if (saleSelectedScopes[key]) {
      delete saleSelectedScopes[key];
    } else {
      saleSelectedScopes[key] = { type: type, catId: (catId === undefined ? null : catId), label: label };
    }
    renderManageInventoryResults();
  }

  // Union of every checked scope's rows, deduped by row key (see the
  // saleSelectedScopes comment above for why that dedup matters).
  function saleSelectedScopeRows() {
    var seen = {};
    var rows = [];
    Object.keys(saleSelectedScopes).forEach(function (key) {
      var scope = saleSelectedScopes[key];
      var scopeRows = scope.catId === null ? manageInventoryTypeRows(scope.type) : manageInventoryCategoryRows(scope.type, scope.catId);
      scopeRows.forEach(function (r) {
        if (seen[r.key]) return;
        seen[r.key] = true;
        rows.push(r);
      });
    });
    return rows;
  }

  function startSaleSelectMode() {
    saleSelectMode = true;
    saleSelectedScopes = {};
    renderManageInventoryResults();
  }

  function cancelSaleSelectMode() {
    saleSelectMode = false;
    saleSelectedScopes = {};
    saleAreaExpanded = false;
    renderManageInventoryResults();
  }

  function confirmSaleSelectMode() {
    var rows = saleSelectedScopeRows();
    if (!rows.length) {
      window.alert("Check at least one type or theme first.");
      return;
    }
    saleSelectMode = false;
    saleSelectedScopes = {};
    startSaleDraft(rows);
  }

  function saleSelectToolbarHtml() {
    if (!saleSelectMode) return "";
    var labels = Object.keys(saleSelectedScopes).map(function (key) { return saleSelectedScopes[key].label; });
    return '<div class="sale-select-toolbar">'
      + '<div class="sale-select-toolbar-text">'
      + (labels.length
        ? '<strong>' + labels.length + ' selected</strong><span>' + escapeHtml(labels.join(", ")) + '</span>'
        : '<strong>Check off the types/themes to include below</strong>')
      + '</div>'
      + '<div class="wanted-manual-actions">'
      + '<button type="button" class="reset-btn" id="saleSelectConfirmBtn"' + (labels.length ? '' : ' disabled') + '>Put on sale</button>'
      + '<button type="button" class="reset-btn" id="saleSelectCancelBtn">Cancel</button>'
      + '</div>'
      + '</div>';
  }

  // The single "Bulk Sale" slot a screen gets, one call per screen,
  // always in the same spot in the layout — never a second box stacked
  // somewhere else on the page. Any running sales' banners always render
  // here first (any number of them can be active at once, on different
  // categories), followed by whatever's actually in progress (a chosen
  // scope being confirmed, the age-threshold picker, multi-select mode);
  // with nothing in progress it's either the bare "▸ Bulk Sale" line
  // (the default — out of the way until tapped) or, once tapped, the
  // idle box with this screen's own entry buttons (idleBodyHtml;
  // idleDescHtml is optional context text, "" to skip it) — starting
  // another sale here is always available, even while others are
  // running elsewhere. A screen with nothing to offer here (idleBodyHtml
  // "") renders just the banners (if any) unless a flow started
  // elsewhere is still in progress — e.g. drilling into a theme while
  // multi-select is on.
  function saleAreaHtml(idleDescHtml, idleBodyHtml) {
    var bannersHtml = activeSalesBannerHtml();
    if (saleDraft) return bannersHtml + saleDraftHtml();
    if (saleAgeDraft) return bannersHtml + saleAgeDraftHtml();
    if (saleSelectMode) return bannersHtml + saleSelectToolbarHtml();
    if (!idleBodyHtml) return bannersHtml;
    if (!saleAreaExpanded) {
      return bannersHtml + '<button type="button" class="sale-area-collapsed-btn" id="saleAreaExpandBtn">▸ Bulk Sale</button>';
    }
    return bannersHtml + '<div class="sale-draft-panel">'
      + '<button type="button" class="sale-area-collapse-btn" id="saleAreaCollapseBtn">▾ Bulk Sale</button>'
      + (idleDescHtml ? '<div class="sale-tools-box-desc">' + idleDescHtml + '</div>' : '')
      + idleBodyHtml
      + '</div>';
  }

  // One browse tile — a plain single-button tile when Ryan isn't
  // multi-selecting (click navigates, same as always), or a checkbox
  // alongside a separate nav button once saleSelectMode is on, so
  // checking "include everything here" and drilling in to refine further
  // are two different taps instead of one tap doing both.
  function browseTileHtml(navAttr, navValue, name, statsHtml, selType, selCat, selLabel) {
    if (!saleSelectMode) {
      return '<button type="button" class="browse-tile" ' + navAttr + '="' + escapeHtml(navValue) + '">'
        + '<span class="browse-tile-name">' + escapeHtml(name) + '</span>'
        + statsHtml
        + '</button>';
    }
    var checked = !!saleSelectedScopes[saleScopeKey(selType, selCat)];
    return '<div class="browse-tile browse-tile-select">'
      + '<label class="browse-tile-checkbox"><input type="checkbox" data-select-type="' + escapeHtml(selType) + '" data-select-cat="' + escapeHtml(selCat === null ? "" : selCat) + '" data-select-label="' + escapeHtml(selLabel) + '"' + (checked ? ' checked' : '') + '></label>'
      + '<button type="button" class="browse-tile-nav" ' + navAttr + '="' + escapeHtml(navValue) + '">'
      + '<span class="browse-tile-name">' + escapeHtml(name) + '</span>'
      + statsHtml
      + '</button>'
      + '</div>';
  }

  // The navigation screen shown when the search box is empty: item type
  // breakdown → theme/category breakdown within that type → flat item
  // list within that theme. Reuses manageInventoryCardHtml for the final
  // list so editing works exactly like a search result.
  function manageInventoryBrowseHtml(dirtyCount) {
    var hint = dirtyCount
      ? '<div class="manage-inventory-hint">You have ' + dirtyCount + ' unsaved change' + (dirtyCount === 1 ? '' : 's') + ' — browsing won’t lose them.</div>'
      : '';

    if (manageInventoryBrowseRecent) {
      var recentRows = manageInventorySortRows(manageInventoryRecentRows(manageInventoryRecentDays));
      var cappedRecent = recentRows.slice(0, MANAGE_INVENTORY_RESULT_CAP);
      return hint
        + manageInventoryBreadcrumb()
        + manageInventoryStatsHtml(manageInventoryStats(recentRows))
        // No entry point of its own here (Recently Added is a date
        // grouping, not a sale scope) — this only ever renders something
        // if a flow started on another screen is still in progress.
        + saleAreaHtml('', '')
        + '<div class="manage-inventory-sort-row">'
        + '<select class="manage-inventory-sort-select" id="manageInventoryRecentWindowSelect">'
        + '<option value="15"' + (manageInventoryRecentDays === 15 ? ' selected' : '') + '>Last 15 days</option>'
        + '<option value="30"' + (manageInventoryRecentDays === 30 ? ' selected' : '') + '>Last 30 days</option>'
        + '</select>'
        + manageInventorySortSelectHtml()
        + '</div>'
        + cappedRecent.map(manageInventoryCardHtml).join("")
        + (recentRows.length > cappedRecent.length ? '<div class="manage-inventory-cap-note">Showing the first ' + cappedRecent.length + ' of ' + recentRows.length + ' items — search above to find a specific one.</div>' : '');
    }

    if (!manageInventoryBrowseType) {
      var typeCounts = manageInventoryTypeCounts();
      var types = Object.keys(typeCounts).sort(function (a, b) { return typeCounts[b].lots - typeCounts[a].lots; });
      var typeTiles = types.map(function (t) {
        return browseTileHtml('data-browse-type', t, t, browseTileStatsHtml(typeCounts[t]), t, null, t);
      }).join("");
      // Recently Added is a date grouping, not a type/theme — it has no
      // scope of its own, so it stays a plain nav tile even in select mode.
      var recentTile = manageInventoryHasDates
        ? '<button type="button" class="browse-tile browse-tile-recent" data-browse-recent="1">'
          + '<span class="browse-tile-name">Recently Added</span>'
          + browseTileStatsHtml(manageInventoryStats(manageInventoryRecentRows(manageInventoryRecentDays)))
          + '</button>'
        : '';
      return hint
        + manageInventoryStatsHtml(manageInventoryStats(manageInventoryRows || []))
        + saleAreaHtml('Discount a theme or category, or inventory that has sat unsold too long.',
          '<div class="manage-inventory-sort-row">'
          + '<button type="button" class="inv-start-over-btn" id="manageInventorySelectModeBtn">Select categories/themes…</button>'
          + '<button type="button" class="inv-start-over-btn" id="manageInventoryStartSaleAgeBtn">Put aged inventory on sale…</button>'
          + '</div>')
        + '<div class="manage-inventory-hint">Browse by item type, or search above by name or item number.</div>'
        + '<div class="browse-tile-list">' + recentTile + typeTiles + '</div>';
    }

    if (!categoriesById) {
      if (!manageInventoryCategoriesLoading) {
        manageInventoryCategoriesLoading = true;
        getCategories().then(function () {
          manageInventoryCategoriesLoading = false;
          renderManageInventoryResults();
        }).catch(function () {
          manageInventoryCategoriesLoading = false;
          renderManageInventoryResults();
        });
      }
      return hint + manageInventoryBreadcrumb() + '<div class="state-block">Loading themes…</div>';
    }

    if (manageInventoryBrowseCategory === null) {
      var themeCounts = manageInventoryThemeCounts(manageInventoryBrowseType);
      var themeIds = Object.keys(themeCounts).sort(function (a, b) { return themeCounts[b].lots - themeCounts[a].lots; });
      var themeTiles = themeIds.map(function (id) {
        var t = themeCounts[id];
        return browseTileHtml('data-browse-category', id, t.name, browseTileStatsHtml(t), manageInventoryBrowseType, id, manageInventoryBrowseType + ' › ' + t.name);
      }).join("");
      var typeRows = manageInventoryTypeRows(manageInventoryBrowseType);
      // Every theme at once — a plain nav tile (like Recently Added), never a
      // sale-select checkbox: "all of this type" already has its own checkbox row.
      var allTile = typeRows.length
        ? '<button type="button" class="browse-tile browse-tile-recent browse-tile-all" data-browse-category="' + MANAGE_INVENTORY_ALL + '">'
          + '<span class="browse-tile-name">All ' + escapeHtml(manageInventoryBrowseType) + '</span>'
          + browseTileStatsHtml(manageInventoryStats(typeRows))
          + '</button>'
        : '';
      var wholeTypeKey = saleScopeKey(manageInventoryBrowseType, null);
      // Only the multi-select checkbox case lives inline with the tile
      // list itself — the idle "Put all X on sale"/"Select themes…"
      // buttons now live in the one saleAreaHtml slot below instead.
      var wholeTypeCheckboxRow = (typeRows.length && saleSelectMode)
        ? '<label class="sale-select-whole-row"><input type="checkbox" data-select-type="' + escapeHtml(manageInventoryBrowseType) + '" data-select-cat="" data-select-label="' + escapeHtml(manageInventoryBrowseType) + '"' + (saleSelectedScopes[wholeTypeKey] ? ' checked' : '') + '> All of ' + escapeHtml(manageInventoryBrowseType) + ' (' + typeRows.length + ' lots)</label>'
        : '';
      var typeIdleBody = typeRows.length
        ? '<div class="manage-inventory-sort-row">'
          + '<button type="button" class="inv-start-over-btn" id="manageInventoryStartSaleBtn">Put all ' + escapeHtml(manageInventoryBrowseType) + ' on sale</button>'
          + '<button type="button" class="inv-start-over-btn" id="manageInventorySelectModeBtn">Select themes…</button>'
          + '</div>'
        : '';
      return hint
        + manageInventoryBreadcrumb()
        + manageInventoryStatsHtml(manageInventoryStats(typeRows))
        + saleAreaHtml('', typeIdleBody)
        + '<div class="manage-inventory-hint">Browse ' + escapeHtml(manageInventoryBrowseType) + ' by theme/category.'
        + (manageInventoryBrowseType === 'PART' ? ' (Parts mostly don’t have a real theme — this is BrickLink’s physical category tree instead, e.g. Bricks, Plates.)' : '')
        + '</div>'
        + wholeTypeCheckboxRow
        + '<div class="browse-tile-list">' + allTile + themeTiles + '</div>';
    }

    var catId = manageInventoryBrowseCategory;
    var filtered = manageInventorySortRows(manageInventoryCategoryRows(manageInventoryBrowseType, catId));
    var capped = filtered.slice(0, manageInventoryListLimit);
    return hint
      + manageInventoryBreadcrumb()
      + manageInventoryStatsHtml(manageInventoryStats(filtered))
      + saleAreaHtml('', filtered.length ? '<button type="button" class="inv-start-over-btn" id="manageInventoryStartSaleBtn">Put on sale</button>' : '')
      + '<div class="manage-inventory-sort-row">' + manageInventorySortSelectHtml() + '</div>'
      + capped.map(manageInventoryCardHtml).join("")
      + (filtered.length > capped.length
        ? '<div class="manage-inventory-cap-note">Showing ' + capped.length + ' of ' + filtered.length + ' items.</div>'
          + '<div class="manage-inventory-sort-row"><button type="button" class="inv-start-over-btn" id="manageInventoryShowMoreBtn">Show ' + Math.min(MANAGE_INVENTORY_RESULT_CAP, filtered.length - capped.length) + ' more</button></div>'
        : '');
  }

  function manageInventoryMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q || !manageInventoryRows) return [];
    return manageInventoryRows.filter(function (r) {
      return (r.itemNo && r.itemNo.toLowerCase().indexOf(q) !== -1)
        || (r.name && r.name.toLowerCase().indexOf(q) !== -1);
    });
  }

  // The text beside a card's Sale % box: what buyers pay at the typed
  // percentage (unit_price less that %), or a plain "not on sale" at 0.
  function inventorySaleNoteText(row) {
    return row.saleRate > 0
      ? "buyers pay ≈ " + formatCurrency(roundSalePrice(row.unitPrice, row.saleRate), "USD")
      : "not on sale";
  }

  function manageInventoryCardHtml(row) {
    var resultHtml = "";
    if (row.result) {
      resultHtml = row.result.success
        ? '<div class="inventory-row-result success">Updated on BrickLink' + (row.result.note ? ' — ' + escapeHtml(row.result.note) : '') + '</div>'
        : '<div class="inventory-row-result error">' + escapeHtml(row.result.error) + '</div>';
    }
    var marked = row.markedForDelete;
    var fieldsDisabled = marked ? ' disabled' : '';
    return ""
      + '<div class="item-row inventory-row' + (isManageInventoryRowDirty(row) ? ' row-dirty' : '') + (marked ? ' marked-for-delete' : '') + (row.stockRoomId ? ' in-stock-room' : '') + '" data-key="' + escapeHtml(row.key) + '">'
      + '<div class="item-thumb">' + thumbHtml(row) + '<span class="qty-chip">' + row.quantity + '</span></div>'
      + '<div class="item-body">'
      + '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(row.itemNo) + '</span>'
      + '<span class="item-line1-right">' + (row.orig.saleRate > 0 ? '<span class="item-type-tag sale-tag">' + row.orig.saleRate + '% off</span>' : '') + '<span class="item-type-tag">' + escapeHtml(row.type) + '</span></span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(row.name || "(name unknown)") + '</div>'
      + (isRealColorName(row.colorName) ? '<div class="item-color">' + escapeHtml(row.colorName) + '</div>' : '')
      + (row.dateCreated ? '<div class="item-color">Listed ' + escapeHtml(formatDate(row.dateCreated)) + '</div>' : '')
      + (marked ? '<div class="delete-pending-note">Marked for deletion — submit to remove from BrickLink</div>' : '')
      + '<div class="inventory-fields">'
      + '<div class="inventory-field"><label>Qty</label><input type="number" min="1" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="quantity" value="' + escapeHtml(row.quantity) + '"' + fieldsDisabled + '></div>'
      + '<div class="inventory-field"><label>Price</label><input type="text" inputmode="decimal" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="unitPrice" value="' + escapeHtml(row.unitPrice) + '"' + fieldsDisabled + '></div>'
      + '<div class="inventory-field"><label>Condition</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="newOrUsed"' + fieldsDisabled + '>'
      + '<option value="N"' + (row.newOrUsed === "N" ? ' selected' : '') + '>New</option>'
      + '<option value="U"' + (row.newOrUsed === "U" ? ' selected' : '') + '>Used</option>'
      + '</select></div>'
      + '<div class="inventory-field"><label>Stock Room</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="stockRoomId"' + fieldsDisabled + '>'
      + '<option value=""' + (row.stockRoomId === "" ? ' selected' : '') + '>No</option>'
      + '<option value="A"' + (row.stockRoomId === "A" ? ' selected' : '') + '>A</option>'
      + '<option value="B"' + (row.stockRoomId === "B" ? ' selected' : '') + '>B</option>'
      + '<option value="C"' + (row.stockRoomId === "C" ? ' selected' : '') + '>C</option>'
      + '</select></div>'
      + '<div class="inventory-field sale-field"><label>Sale % off <span class="field-hint">(0 = none)</span></label>'
      + '<div class="sale-field-row"><input type="number" min="0" max="99" step="1" inputmode="numeric" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="saleRate" value="' + escapeHtml(row.saleRate) + '"' + fieldsDisabled + '>'
      + '<span class="sale-note">' + escapeHtml(inventorySaleNoteText(row)) + '</span></div></div>'
      + '<div class="inventory-field description-field"><label>Description <span class="field-hint">(shown to buyer)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="description"' + fieldsDisabled + '>' + escapeHtml(row.description) + '</textarea></div>'
      + '<div class="inventory-field remarks-field"><label>Remarks <span class="field-hint">(private, only you see this)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="remarks"' + fieldsDisabled + '>' + escapeHtml(row.remarks) + '</textarea></div>'
      + '</div>'
      + resultHtml
      + '</div>'
      + '<div class="inventory-price-guide-block">'
      + '<div class="price-guide-header-row">'
      + viewOnBricklinkLinkHtml(row)
      + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(row.key) + '">' + (row.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
      + '</div>'
      + renderPriceGuidePanel(row)
      + '</div>'
      + '<div class="inventory-row-actions">'
      + '<button type="button" class="delete-row-btn' + (marked ? ' marked' : '') + '" data-key="' + escapeHtml(row.key) + '">' + (marked ? 'Undo delete' : 'Delete') + '</button>'
      + '</div>'
      + '</div>';
  }

  // Recomputes the dirty count and updates just the persistent submit bar
  // in place (text, disabled state, show/hide) — not a full results
  // re-render, so a field's own "change" handler never yanks focus
  // elsewhere on the page the way re-rendering the whole card list would.
  function updateManageInventorySubmitBar() {
    var dirtyCount = (manageInventoryRows || []).filter(isManageInventoryRowDirty).length;
    var label = manageInventorySubmitting ? "Submitting…" : "Submit " + dirtyCount + " change" + (dirtyCount === 1 ? "" : "s") + " to BrickLink";
    var disabled = dirtyCount === 0 || manageInventorySubmitting;

    var row = document.getElementById("manageInventorySubmitRow");
    var btn = document.getElementById("manageInventorySubmitBtn");
    var cancelBtn = document.getElementById("manageInventoryCancelBtn");
    if (row && btn) {
      row.style.display = dirtyCount ? "" : "none";
      btn.textContent = label;
      btn.disabled = disabled;
    }
    if (cancelBtn) cancelBtn.disabled = disabled;

    // Sticky topbar mirror — a static node outside the re-rendered
    // results area, so it's kept in sync here too rather than only in
    // the innerHTML string above (same dual pattern as Add Inventory's
    // topbarInventorySubmitRow).
    topbarManageSubmitRow.classList.toggle("hidden", !dirtyCount);
    topbarManageSubmitBtn.textContent = label;
    topbarManageSubmitBtn.disabled = disabled;
    topbarManageCancelBtn.disabled = disabled;
  }

  // Rebuilds only the results area below the search box, leaving the
  // search <input> itself untouched — recreating it on every keystroke
  // (even debounced) would steal focus/cursor position right back out
  // from under whatever Ryan just typed.
  function renderManageInventoryResults() {
    var container = document.getElementById("manageInventoryResults");
    if (!container) return;
    var query = manageInventorySearchQuery.trim();
    var dirtyCount = manageInventoryRows ? manageInventoryRows.filter(isManageInventoryRowDirty).length : 0;

    var body = "";
    if (manageInventoryLoading) {
      body = '<div class="state-block">Loading your inventory…</div>';
    } else if (manageInventoryError) {
      body = '<div class="state-block error">' + escapeHtml(manageInventoryError) + '</div>'
        + '<div class="inventory-submit-row"><button type="button" class="inventory-submit-btn" id="manageInventoryRetryBtn">Retry</button></div>';
    } else if (!manageInventoryRows) {
      body = "";
    } else if (!query) {
      body = manageInventoryBrowseHtml(dirtyCount);
    } else {
      var matches = manageInventoryMatches(query);
      var capped = matches.slice(0, MANAGE_INVENTORY_RESULT_CAP);
      body = '<div class="inventory-summary-row">'
        + '<span>' + matches.length + ' match' + (matches.length === 1 ? '' : 'es') + '</span>'
        + '<div class="inventory-bulk-actions">'
        + '<button type="button" id="manageInventoryRefreshBtn">Refresh</button>'
        + '</div>'
        + '</div>'
        + manageInventoryStatsHtml(manageInventoryStats(matches))
        + saleAreaHtml('', matches.length ? '<button type="button" class="inv-start-over-btn" id="manageInventoryStartSaleBtn">Put on sale</button>' : '')
        + capped.map(manageInventoryCardHtml).join("")
        + (matches.length > capped.length ? '<div class="manage-inventory-cap-note">Showing the first ' + capped.length + ' of ' + matches.length + ' matches — refine your search to see the rest.</div>' : '');
    }

    // Always present once rows are loaded (even with 0 matches or an
    // empty search), just hidden when nothing's dirty — so field edits
    // can show/update it via updateManageInventorySubmitBar() without
    // needing to insert or remove it from the DOM.
    if (manageInventoryRows && !manageInventoryLoading) {
      body += '<div class="inventory-submit-row" id="manageInventorySubmitRow" style="display:' + (dirtyCount ? '' : 'none') + '">'
        + '<button class="inventory-submit-btn" id="manageInventorySubmitBtn"' + (dirtyCount === 0 || manageInventorySubmitting ? ' disabled' : '') + '>'
        + (manageInventorySubmitting ? "Submitting…" : "Submit " + dirtyCount + " change" + (dirtyCount === 1 ? "" : "s") + " to BrickLink")
        + '</button>'
        + '<button type="button" class="inv-start-over-btn" id="manageInventoryCancelBtn"' + (dirtyCount === 0 || manageInventorySubmitting ? ' disabled' : '') + '>Cancel changes</button>'
        + '</div>';
    }

    container.innerHTML = body;
    updateManageInventorySubmitBar();

    wireThumbLinks(container);
    sizeThumbsToRows(container);

    container.querySelectorAll(".inv-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findManageInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        var field = el.getAttribute("data-field");
        if (field === "saleRate") {
          // BrickLink's sale percentage is a whole number 0-99 (0 = not on sale).
          row.saleRate = Math.min(99, Math.max(0, Math.round(parseFloat(el.value) || 0)));
          el.value = row.saleRate;
        } else {
          row[field] = field === "quantity" ? (parseInt(el.value, 10) || 0) : el.value;
        }
        row.result = null;
        var rowEl = el.closest(".item-row");
        var saleNoteEl = rowEl && rowEl.querySelector(".sale-note");
        if (saleNoteEl) saleNoteEl.textContent = inventorySaleNoteText(row);
        if (rowEl) {
          rowEl.classList.toggle("row-dirty", isManageInventoryRowDirty(row));
          rowEl.classList.toggle("in-stock-room", !!row.stockRoomId);
        }
        updateManageInventorySubmitBar();
      });
    });

    container.querySelectorAll(".delete-row-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findManageInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.markedForDelete = !row.markedForDelete;
        renderManageInventoryResults();
      });
    });

    // Same "See active US listings" panel Add Inventory uses — the cache
    // is keyed on item/color/condition, not on which page asked, so a
    // lookup already done in Add Inventory (or for another row of the
    // same item/color here) is reused for free.
    container.querySelectorAll(".price-guide-toggle-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findManageInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.priceExpanded = !row.priceExpanded;
        if (row.priceExpanded) fetchPriceGuide(row, renderManageInventoryResults);
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll(".price-guide-collapse-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findManageInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.priceExpanded = false;
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll(".price-guide-row").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findManageInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.unitPrice = formatPriceInput(el.getAttribute("data-price"));
        row.newOrUsed = el.getAttribute("data-condition") === "U" ? "U" : "N";
        row.result = null;
        renderManageInventoryResults();
      });
    });

    // Each of these navigates to a different screen, which also collapses
    // the idle Bulk Sale box back down (saleAreaExpanded) — it was
    // expanded for whatever buttons the PREVIOUS screen offered, which
    // don't carry over, so showing it already-open here would just be
    // the "barely want to see them" default silently broken by moving
    // around. An in-progress flow (saleDraft/saleAgeDraft/saleSelectMode)
    // takes priority over this regardless, so this never hides work
    // Ryan's mid-way through.
    container.querySelectorAll("[data-browse-type]").forEach(function (el) {
      el.addEventListener("click", function () {
        manageInventoryBrowseType = el.getAttribute("data-browse-type");
        manageInventoryBrowseCategory = null;
        manageInventoryBrowseRecent = false;
        manageInventoryListLimit = MANAGE_INVENTORY_RESULT_CAP;
        saleAreaExpanded = false;
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll("[data-browse-category]").forEach(function (el) {
      el.addEventListener("click", function () {
        manageInventoryBrowseCategory = el.getAttribute("data-browse-category");
        manageInventoryListLimit = MANAGE_INVENTORY_RESULT_CAP;
        saleAreaExpanded = false;
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll("[data-browse-recent]").forEach(function (el) {
      el.addEventListener("click", function () {
        manageInventoryBrowseRecent = true;
        saleAreaExpanded = false;
        renderManageInventoryResults();
      });
    });
    container.querySelectorAll("[data-browse-reset]").forEach(function (el) {
      el.addEventListener("click", function () {
        var level = el.getAttribute("data-browse-reset");
        if (level === "type") { manageInventoryBrowseType = null; manageInventoryBrowseRecent = false; }
        manageInventoryBrowseCategory = null;
        manageInventoryListLimit = MANAGE_INVENTORY_RESULT_CAP;
        saleAreaExpanded = false;
        renderManageInventoryResults();
      });
    });

    var showMoreBtnEl = document.getElementById("manageInventoryShowMoreBtn");
    if (showMoreBtnEl) {
      showMoreBtnEl.addEventListener("click", function () {
        manageInventoryListLimit += MANAGE_INVENTORY_RESULT_CAP;
        renderManageInventoryResults();
      });
    }

    var sortSelectEl = document.getElementById("manageInventorySortSelect");
    if (sortSelectEl) {
      sortSelectEl.addEventListener("change", function () {
        manageInventorySortKey = sortSelectEl.value;
