        renderManageInventoryResults();
      });
    }
    var recentWindowSelectEl = document.getElementById("manageInventoryRecentWindowSelect");
    if (recentWindowSelectEl) {
      recentWindowSelectEl.addEventListener("change", function () {
        manageInventoryRecentDays = parseInt(recentWindowSelectEl.value, 10) || 30;
        renderManageInventoryResults();
      });
    }

    var retryBtn = document.getElementById("manageInventoryRetryBtn");
    if (retryBtn) retryBtn.addEventListener("click", fetchManageInventory);

    // Scoped to the current search's results only — the topbar's own
    // Refresh button (wired once near the other topbar controls) is the
    // one that covers the whole page, browsing included, matching the
    // Orders page's button; this one's just a quick re-fetch without
    // needing to clear out of a search first.
    var refreshBtnEl = document.getElementById("manageInventoryRefreshBtn");
    if (refreshBtnEl) {
      refreshBtnEl.addEventListener("click", function () {
        var pendingCount = (manageInventoryRows || []).filter(isManageInventoryRowDirty).length;
        if (pendingCount && !window.confirm("Refresh from BrickLink? This discards " + pendingCount + " unsaved change" + (pendingCount === 1 ? "" : "s") + ".")) return;
        fetchManageInventory();
      });
    }

    var submitBtnEl = document.getElementById("manageInventorySubmitBtn");
    if (submitBtnEl) submitBtnEl.addEventListener("click", handleManageInventorySubmit);
    var cancelBtnEl = document.getElementById("manageInventoryCancelBtn");
    if (cancelBtnEl) cancelBtnEl.addEventListener("click", handleManageInventoryCancel);

    // One shared id/handler for the trigger — only one of the browse
    // screens (type tiles, theme tiles, the theme's flat item list) or
    // the search-results body is ever rendered at a time, so re-deriving
    // "whichever row list is currently on screen" here (rather than
    // threading the exact list through as a DOM attribute) stays correct
    // even as Ryan sorts/re-browses before clicking it.
    var startSaleBtnEl = document.getElementById("manageInventoryStartSaleBtn");
    if (startSaleBtnEl) {
      startSaleBtnEl.addEventListener("click", function () {
        var q = manageInventorySearchQuery.trim();
        var rows;
        if (q) {
          rows = manageInventoryMatches(q);
        } else if (manageInventoryBrowseType && manageInventoryBrowseCategory !== null) {
          rows = manageInventoryCategoryRows(manageInventoryBrowseType, manageInventoryBrowseCategory);
        } else if (manageInventoryBrowseType) {
          // One level up — no theme picked yet, so the whole type.
          rows = manageInventoryTypeRows(manageInventoryBrowseType);
        } else {
          rows = [];
        }
        startSaleDraft(rows);
      });
    }
    var saleDraftConfirmBtnEl = document.getElementById("saleDraftConfirmBtn");
    if (saleDraftConfirmBtnEl) saleDraftConfirmBtnEl.addEventListener("click", handleStartSaleConfirm);
    var saleDraftCancelBtnEl = document.getElementById("saleDraftCancelBtn");
    if (saleDraftCancelBtnEl) saleDraftCancelBtnEl.addEventListener("click", cancelSaleDraft);
    // Updates on change (not every keystroke) so the preview list's
    // "current → new price" column tracks whatever % is currently typed.
    var saleDraftPctInputEl = document.getElementById("saleDraftPctInput");
    if (saleDraftPctInputEl) {
      saleDraftPctInputEl.addEventListener("change", function () {
        saleDraft.pct = saleDraftPctInputEl.value;
        updateSaleDraftPreview();
      });
    }
    var saleDraftSortSelectEl = document.getElementById("saleDraftSortSelect");
    if (saleDraftSortSelectEl) {
      saleDraftSortSelectEl.addEventListener("change", function () {
        saleDraft.sortKey = saleDraftSortSelectEl.value;
        renderManageInventoryResults();
      });
    }
    container.querySelectorAll(".sale-preview-remove-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        handleSaleDraftRemoveRow(el.getAttribute("data-key"));
      });
    });
    container.querySelectorAll(".sale-end-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        handleEndSaleNow(el.getAttribute("data-sale-id"));
      });
    });

    var selectModeBtnEl = document.getElementById("manageInventorySelectModeBtn");
    if (selectModeBtnEl) selectModeBtnEl.addEventListener("click", startSaleSelectMode);
    var saleSelectConfirmBtnEl = document.getElementById("saleSelectConfirmBtn");
    if (saleSelectConfirmBtnEl) saleSelectConfirmBtnEl.addEventListener("click", confirmSaleSelectMode);
    var saleSelectCancelBtnEl = document.getElementById("saleSelectCancelBtn");
    if (saleSelectCancelBtnEl) saleSelectCancelBtnEl.addEventListener("click", cancelSaleSelectMode);
    container.querySelectorAll("[data-select-type]").forEach(function (el) {
      el.addEventListener("change", function () {
        var type = el.getAttribute("data-select-type");
        var catAttr = el.getAttribute("data-select-cat");
        var catId = catAttr === "" ? null : catAttr;
        var label = el.getAttribute("data-select-label") || type;
        toggleSaleSelectScope(type, catId, label);
      });
    });

    var startSaleAgeBtnEl = document.getElementById("manageInventoryStartSaleAgeBtn");
    if (startSaleAgeBtnEl) startSaleAgeBtnEl.addEventListener("click", startSaleAgeDraft);
    var saleAreaExpandBtnEl = document.getElementById("saleAreaExpandBtn");
    if (saleAreaExpandBtnEl) {
      saleAreaExpandBtnEl.addEventListener("click", function () {
        saleAreaExpanded = true;
        renderManageInventoryResults();
      });
    }
    var saleAreaCollapseBtnEl = document.getElementById("saleAreaCollapseBtn");
    if (saleAreaCollapseBtnEl) {
      saleAreaCollapseBtnEl.addEventListener("click", function () {
        saleAreaExpanded = false;
        renderManageInventoryResults();
      });
    }
    var saleAgeTypeSelectEl = document.getElementById("saleAgeTypeSelect");
    if (saleAgeTypeSelectEl) {
      saleAgeTypeSelectEl.addEventListener("change", function () {
        saleAgeDraft.type = saleAgeTypeSelectEl.value;
        renderManageInventoryResults();
      });
    }
    var saleAgeDateInputEl = document.getElementById("saleAgeDateInput");
    if (saleAgeDateInputEl) {
      saleAgeDateInputEl.addEventListener("change", function () {
        // A cleared/invalid date field falls back to today rather than
        // feeding an empty string into the cutoff math below.
        saleAgeDraft.beforeDate = saleAgeDateInputEl.value || isoDateDaysAgo(0);
        renderManageInventoryResults();
      });
    }
    container.querySelectorAll("[data-age-days]").forEach(function (el) {
      el.addEventListener("click", function () {
        saleAgeDraft.beforeDate = isoDateDaysAgo(parseInt(el.getAttribute("data-age-days"), 10));
        renderManageInventoryResults();
      });
    });
    var saleAgePreviewBtnEl = document.getElementById("saleAgePreviewBtn");
    if (saleAgePreviewBtnEl) {
      saleAgePreviewBtnEl.addEventListener("click", function () {
        var rows = manageInventoryAgedRows(saleAgeDraft.beforeDate, saleAgeDraft.type);
        saleAgeDraft = null;
        startSaleDraft(rows);
      });
    }
    var saleAgeCancelBtnEl = document.getElementById("saleAgeCancelBtn");
    if (saleAgeCancelBtnEl) saleAgeCancelBtnEl.addEventListener("click", cancelSaleAgeDraft);
  }

  function renderManageInventoryView() {
    // Lazy-warm, same pattern as colorsMap elsewhere — doesn't block this
    // page's own load, just re-renders (picking up the banner) once it
    // resolves.
    if (!activeSales) ensureActiveSalesLoaded();

    manageInventoryView.innerHTML = ""
      + '<input type="search" class="manage-inventory-search" id="manageInventorySearchInput" placeholder="Search by item name or number…" value="' + escapeHtml(manageInventorySearchQuery) + '" autocomplete="off">'
      + '<div id="manageInventoryResults"></div>';

    document.getElementById("manageInventorySearchInput").addEventListener("input", function (e) {
      manageInventorySearchQuery = e.target.value;
      saleAreaExpanded = false;
      clearTimeout(manageInventorySearchDebounceTimer);
      manageInventorySearchDebounceTimer = setTimeout(renderManageInventoryResults, 150);
    });

    renderManageInventoryResults();
  }

  function handleManageInventorySubmit() {
    var dirtyRows = (manageInventoryRows || []).filter(isManageInventoryRowDirty);
    if (!dirtyRows.length) return;
    var toDelete = dirtyRows.filter(function (r) { return r.markedForDelete; });
    var toUpdate = dirtyRows.filter(function (r) { return !r.markedForDelete; });

    var confirmMsg;
    if (toUpdate.length && toDelete.length) {
      confirmMsg = "Push " + toUpdate.length + " change" + (toUpdate.length === 1 ? "" : "s")
        + " and delete " + toDelete.length + " listing" + (toDelete.length === 1 ? "" : "s")
        + " on BrickLink now? Deleted listings can't be recovered.";
    } else if (toDelete.length) {
      confirmMsg = "Delete " + toDelete.length + " listing" + (toDelete.length === 1 ? "" : "s")
        + " from BrickLink now? This can't be recovered.";
    } else {
      confirmMsg = "Push " + toUpdate.length + " change" + (toUpdate.length === 1 ? "" : "s") + " live to BrickLink now?";
    }
    if (!window.confirm(confirmMsg)) return;

    manageInventorySubmitting = true;
    updateManageInventorySubmitBar();

    // Two separate live-write endpoints (Update Inventory vs Delete
    // Inventory are different BrickLink API calls), run in parallel —
    // each item still only ever hits the one endpoint it actually needs.
    var requests = [];
    if (toUpdate.length) {
      requests.push(postJSON("/api/inventory-update", {
        items: toUpdate.map(function (r) {
          var item = inventoryUpdateItem(r);
          // Only when it was actually edited — an untouched rate is left alone on BrickLink.
          if (r.saleRate !== r.orig.saleRate) item.saleRate = r.saleRate;
          return item;
        }),
      }));
    }
    if (toDelete.length) {
      requests.push(postJSON("/api/inventory-delete", {
        items: toDelete.map(function (r) { return { key: r.key, inventoryId: r.inventoryId }; }),
      }));
    }

    Promise.all(requests).then(function (responses) {
      var allResults = [];
      responses.forEach(function (res) { allResults = allResults.concat((res && res.results) || []); });
      allResults.forEach(function (result) {
        var row = findManageInventoryRow(result.key);
        if (!row) return;
        if (!result.success) {
          row.result = { success: false, error: result.error };
          return;
        }
        if (row.markedForDelete) {
          // Gone from BrickLink for real — drop it from the list rather
          // than showing a lingering "deleted" success state for a row
          // that no longer exists to edit or delete again.
          manageInventoryRows = manageInventoryRows.filter(function (r) { return r.key !== row.key; });
        } else {
          var typedQty = row.quantity;
          var qtyDiffers = applyInventoryResultQuantity(row, result);
          row.orig = {
            quantity: row.quantity, newOrUsed: row.newOrUsed, unitPrice: row.unitPrice,
            description: row.description, remarks: row.remarks, stockRoomId: row.stockRoomId,
            saleRate: row.saleRate,
          };
          row.result = { success: true };
          if (qtyDiffers) row.result.note = "BrickLink now shows quantity " + row.quantity + " (you entered " + typedQty + ")";
        }
      });
    }).catch(function (err) {
      window.alert("Couldn't reach the server to submit these changes: " + err.message);
    }).finally(function () {
      manageInventorySubmitting = false;
      renderManageInventoryResults();
    });
  }

  // Reverts every dirty row back to its loaded snapshot — nothing has
  // reached BrickLink yet at this point, so this is purely local (no
  // API call), unlike handleManageInventorySubmit.
  function handleManageInventoryCancel() {
    var dirtyRows = (manageInventoryRows || []).filter(isManageInventoryRowDirty);
    if (!dirtyRows.length) return;
    if (!window.confirm("Discard " + dirtyRows.length + " unsaved change" + (dirtyRows.length === 1 ? "" : "s") + "?")) return;
    dirtyRows.forEach(function (row) {
      row.quantity = row.orig.quantity;
      row.newOrUsed = row.orig.newOrUsed;
      row.unitPrice = row.orig.unitPrice;
      row.description = row.orig.description;
      row.remarks = row.orig.remarks;
      row.stockRoomId = row.orig.stockRoomId;
      row.saleRate = row.orig.saleRate;
      row.markedForDelete = false;
    });
    renderManageInventoryResults();
  }

  // ---- Bulk Sale ----

  // Lazy, cached, session-lifetime load — same "fetch once, reuse
  // forever this session" pattern as colorsMap/manageInventoryRows.
  // Explicit re-renders on landing so a page that opened before this
  // resolved (the banner needs it) picks it up once it does.
  // Only sale-percentage ("rate") sales are understood; anything else in
  // the stored value (an empty object from a fresh store, or a record from
  // the earlier price-lowering sales, all ended by now) is ignored.
  function normalizeActiveSales(remote) {
    var all = Array.isArray(remote) ? remote : [];
    var rate = all.filter(function (s) { return s && s.mode === "rate"; });
    if (rate.length !== all.length) console.warn("Ignored " + (all.length - rate.length) + " stored sale record(s) that aren't sale-percentage sales.");
    return rate;
  }

  function ensureActiveSalesLoaded() {
    if (activeSales) return Promise.resolve(activeSales);
    if (!activeSalesLoadPromise) {
      activeSalesLoadPromise = fetchJSON("/api/pick-state?key=activeSale").then(function (remote) {
        activeSales = normalizeActiveSales(remote);
        if (currentView === "manage-inventory") renderManageInventoryView();
        return activeSales;
      }).catch(function () {
        activeSales = []; // offline/first-run — try again next visit
        return activeSales;
      });
    }
    return activeSalesLoadPromise;
  }

  function pushActiveSales() {
    // Unlike other pick-state writes this one can't be silently dropped:
    // without it a sale that's live on BrickLink would vanish from here on
    // reload, and End Sale Now would have nothing to end.
    postJSON("/api/pick-state?key=activeSale", activeSales).catch(function (err) {
      window.alert("Couldn't save the sale list (" + err.message + "). Don't reload this page — the sale is live on BrickLink but not recorded yet.");
    });
  }

  // Every item key currently inside ANY running sale — used to keep
  // concurrent sales from double-discounting (or double-owning the
  // "what was the original price" record for) the same listing.
  function itemKeysInAnyActiveSale() {
    var set = {};
    (activeSales || []).forEach(function (sale) {
      Object.keys(sale.items || {}).forEach(function (key) { set[key] = true; });
    });
    return set;
  }

  function roundSalePrice(unitPrice, pct) {
    var discounted = (parseFloat(unitPrice) || 0) * (1 - pct / 100);
    return formatPriceInput(Math.max(0.01, discounted));
  }

  // Same payload shape handleManageInventorySubmit sends for an update —
  // shared here so starting/ending a sale goes through the exact same
  // live-write path as a manual field edit, not a second one that could
  // drift out of sync with it.
  // One row's payload for /api/inventory-update. BrickLink's update takes a
  // quantity DIFFERENCE, not a total (see inventory-update.js), so this sends
  // how far the row's quantity has moved from what was loaded — 0 for every
  // edit except a deliberate quantity change. (It used to send the full
  // quantity, which added it to the listing again on every write.)
  function inventoryUpdateItem(r) {
    return {
      key: r.key, inventoryId: r.inventoryId, quantityChange: (Number(r.quantity) || 0) - (Number(r.orig.quantity) || 0),
      newOrUsed: r.newOrUsed, unitPrice: r.unitPrice, description: r.description, remarks: r.remarks, stockRoomId: r.stockRoomId,
    };
  }

  // After a successful write BrickLink reports the listing's resulting
  // quantity; take that as the truth rather than assuming what was typed.
  // Returns true when it differs from what the row held.
  function applyInventoryResultQuantity(row, result) {
    if (!row || typeof result.quantity !== "number") return false;
    var differs = result.quantity !== row.quantity;
    row.quantity = result.quantity;
    row.orig.quantity = result.quantity;
    return differs;
  }

  // saleRate (optional): BrickLink's per-listing sale percentage — a whole
  // number, 0 to clear. Left out entirely for ordinary edits.
  function postInventoryPriceUpdates(rows, saleRate) {
    return postJSON("/api/inventory-update", {
      items: rows.map(function (r) {
        var item = inventoryUpdateItem(r);
        if (saleRate !== undefined) item.saleRate = saleRate;
        return item;
      }),
    });
  }

  // Rows with nothing to discount (no price yet, already queued for
  // delete, or no quantity left to sell) are silently dropped from the
  // segment rather than surfaced as an error — a sale on "this theme"
  // naturally only applies to listings that have a price and stock to
  // begin with. The inventoryId check guards the same BrickLink data
  // quirk that can leave a listing with quantity 0 — without it, one bad
  // row in a large scope would make the live-write endpoint reject the
  // entire batch (see inventory-update.js), silently blocking every
  // other item in the sale along with it.
  //
  // Stock room listings are never eligible, from any way of starting a sale
  // (a theme, a whole type, a search, multi-select, the age picker): they
  // aren't live for sale, so a sale has no business touching them. Checked
  // against both the live value and any unsaved edit, so neither a listing
  // BrickLink has in a stock room nor one just moved into one on its card
  // gets swept in.
  function saleRowInStockRoom(r) {
    return !!(r.stockRoomId || (r.orig && r.orig.stockRoomId));
  }
  function eligibleSaleRows(rows) {
    return rows.filter(function (r) {
      return !r.markedForDelete && parseFloat(r.unitPrice) > 0 && parseFloat(r.quantity) > 0 && !!r.inventoryId
        && !saleRowInStockRoom(r);
    });
  }

  function startSaleAgeDraft() {
    // The outer "Bulk Sale" entry is already the thing Ryan deliberately
    // tapped to get here — once open, this panel shows every control
    // right away rather than nesting a second collapse/expand inside it.
    saleAgeDraft = { type: "", beforeDate: isoDateDaysAgo(60) };
    renderManageInventoryResults();
  }

  function cancelSaleAgeDraft() {
    saleAgeDraft = null;
    saleAreaExpanded = false;
    renderManageInventoryResults();
  }

  var SALE_AGE_QUICK_DAYS = [30, 60, 90, 180];

  function saleAgeDraftHtml() {
    var d = saleAgeDraft;
    if (!d) return "";
    var matchCount = eligibleSaleRows(manageInventoryAgedRows(d.beforeDate, d.type)).length;
    var daysAgo = Math.round((Date.now() - new Date(d.beforeDate + "T23:59:59").getTime()) / (24 * 60 * 60 * 1000));
    return '<div class="sale-draft-panel">'
      + '<div class="sale-draft-title">Put aged inventory on sale</div>'
      + '<div class="inventory-fields wanted-manual-fields sale-fields-row">'
      + '<div class="inventory-field"><label>Item type</label><select id="saleAgeTypeSelect">'
      + '<option value=""' + (d.type === "" ? ' selected' : '') + '>All types</option>'
      + '<option value="MINIFIG"' + (d.type === "MINIFIG" ? ' selected' : '') + '>Figs only</option>'
      + '<option value="PART"' + (d.type === "PART" ? ' selected' : '') + '>Parts only</option>'
      + '</select></div>'
      + '<div class="inventory-field date-field"><label>Listed on or before</label><input type="date" id="saleAgeDateInput" value="' + escapeHtml(d.beforeDate) + '"></div>'
      + '</div>'
      + '<div class="sale-age-quick-row">'
      + SALE_AGE_QUICK_DAYS.map(function (n) {
          return '<button type="button" class="inv-start-over-btn" data-age-days="' + n + '">' + n + '+ days</button>';
        }).join("")
      + '</div>'
      + '<div class="manage-inventory-hint">' + matchCount + ' item' + (matchCount === 1 ? '' : 's') + (daysAgo > 0 ? ', listed ' + daysAgo + '+ days ago,' : '') + ' with a price to discount.</div>'
      + '<div class="wanted-manual-actions">'
      + '<button type="button" class="reset-btn" id="saleAgePreviewBtn"' + (matchCount ? '' : ' disabled') + '>Review Sale…</button>'
      + '<button type="button" class="reset-btn" id="saleAgeCancelBtn">Cancel</button>'
      + '</div>'
      + '</div>';
  }

  // Figs, then parts, then sets — Ryan's own stated priority order, not
  // alphabetical. Anything else (BOOK, GEAR, ...) sorts after all three.
  var SALE_DRAFT_TYPE_ORDER = { MINIFIG: 0, PART: 1, SET: 2 };
  function saleDraftRowValue(row) {
    return (parseFloat(row.unitPrice) || 0) * (parseInt(row.quantity, 10) || 0);
  }
  function compareSaleDraftRows(a, b, key) {
    if (key === "valueAsc") return saleDraftRowValue(a) - saleDraftRowValue(b);
    if (key === "type") {
      var ta = SALE_DRAFT_TYPE_ORDER.hasOwnProperty(a.type) ? SALE_DRAFT_TYPE_ORDER[a.type] : 99;
      var tb = SALE_DRAFT_TYPE_ORDER.hasOwnProperty(b.type) ? SALE_DRAFT_TYPE_ORDER[b.type] : 99;
      // Highest value first within a type group too, same as the
      // standalone value sort's default direction.
      return ta !== tb ? ta - tb : saleDraftRowValue(b) - saleDraftRowValue(a);
    }
    return saleDraftRowValue(b) - saleDraftRowValue(a); // valueDesc — the default
  }
  function sortSaleDraftRows(rows, key) {
    var sorted = rows.slice();
    sorted.sort(function (a, b) { return compareSaleDraftRows(a, b, key); });
    return sorted;
  }

  function startSaleDraft(rows) {
    var eligible = eligibleSaleRows(rows);
    var stockRoomCount = rows.filter(saleRowInStockRoom).length;
    var onSale = itemKeysInAnyActiveSale();
    // Also left out: anything BrickLink already shows a sale percentage on,
    // whether from another sale here or set on BrickLink directly.
    var openRows = eligible.filter(function (r) { return !onSale[r.key] && !(r.orig.saleRate > 0); });
    if (!openRows.length) {
      window.alert(eligible.length
        ? "Every eligible item here is already in another active sale."
        : stockRoomCount
          ? "Everything here is in a stock room, so there's nothing live to put on sale."
          : "None of these items have a price to discount.");
      return;
    }
    saleDraft = { rows: openRows, pct: "20", endsAt: "", label: "", excludedCount: eligible.length - openRows.length, stockRoomCount: stockRoomCount, sortKey: "valueDesc" };
    renderManageInventoryResults();
  }

  function cancelSaleDraft() {
    saleDraft = null;
    saleAreaExpanded = false;
    renderManageInventoryResults();
  }

  // One line of the before-you-accept summary list — current price vs.
  // what it becomes at the %-off currently typed in, so Ryan can see
  // exactly which items and prices are about to go live before he hits
  // Start Sale, not just a bare count. validPct is false while the %
  // field is empty/out of range, which shows the current price only
  // rather than a misleading "→ $0.00".
  function saleDraftPreviewRowHtml(row, pct, validPct) {
    var newPriceHtml = validPct
      ? ' → <strong>' + escapeHtml(formatCurrency(roundSalePrice(row.unitPrice, pct), "USD")) + '</strong>'
      : '';
    return '<div class="sale-preview-row">'
      + '<span class="item-no mono">' + escapeHtml(row.itemNo) + '</span>'
      + '<span class="item-type-tag">' + escapeHtml(row.type) + '</span>'
      + '<span class="sale-preview-name">' + escapeHtml(row.name || "(name unknown)") + (isRealColorName(row.colorName) ? ' · ' + escapeHtml(row.colorName) : '') + '</span>'
      + '<span class="sale-preview-qty">×' + escapeHtml(row.quantity) + '</span>'
      + '<span class="sale-preview-price-row">'
      + '<span class="sale-preview-price">' + escapeHtml(formatCurrency(row.unitPrice, "USD")) + newPriceHtml + '</span>'
      + '<button type="button" class="sale-preview-remove-btn" data-key="' + escapeHtml(row.key) + '" aria-label="Remove ' + escapeHtml(row.itemNo) + ' from this sale" title="Remove from sale">✕</button>'
      + '</span>'
      + '</div>';
  }

  // Drops one row out of the draft before it ever reaches BrickLink —
  // a plain button click, not a text-field blur, so there's no risk of
  // the updateSaleDraftPreview-style mid-click re-render race; a full
  // re-render is safe here and also picks up the title's item count and
  // the "+N more" cap note, not just the list itself. Removing the last
  // row closes the draft the same way Cancel would — there's nothing
  // left to put on sale.
  function handleSaleDraftRemoveRow(key) {
    if (!saleDraft) return;
    saleDraft.rows = saleDraft.rows.filter(function (r) { return r.key !== key; });
    if (!saleDraft.rows.length) {
      cancelSaleDraft();
      return;
    }
    renderManageInventoryResults();
  }

  // Patches just the preview rows' prices in place when the % field
  // changes, rather than re-rendering the whole results container (and
  // with it the Start Sale/Cancel buttons themselves). That re-render
  // used to run from the %-input's own change handler — which fires on
  // blur, so clicking Start Sale right after editing the % blurred the
  // field first, tore out and replaced the button the same click was
  // already mid-dispatch on, and ate the click. Updating only the list
  // leaves the rest of the panel, and its listeners, untouched.
  function updateSaleDraftPreview() {
    var listEl = document.getElementById("saleDraftPreviewList");
    if (!listEl || !saleDraft) return;
    var pct = parseFloat(saleDraft.pct);
    var validPct = pct > 0 && pct < 100;
    // No cap here — unlike the browse/search lists, these rows are plain
    // text (no photos, no editable inputs), so even a few hundred of them
    // render cheaply, and Ryan explicitly wants to be able to scan the
    // whole set before committing to a sale, not just the first 50.
    var sortedRows = sortSaleDraftRows(saleDraft.rows, saleDraft.sortKey);
    listEl.innerHTML = sortedRows.map(function (r) { return saleDraftPreviewRowHtml(r, pct, validPct); }).join("");
    // The rest of the panel's listeners survive this patch untouched, but
    // the remove buttons are themselves part of what just got replaced —
    // without re-wiring them here, the ✕ silently stops doing anything
    // the moment the % field is ever changed.
    listEl.querySelectorAll(".sale-preview-remove-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        handleSaleDraftRemoveRow(el.getAttribute("data-key"));
      });
    });
  }

  function saleDraftSortSelectHtml(sortKey) {
    return '<div class="manage-inventory-sort-row">'
      + '<select class="manage-inventory-sort-select" id="saleDraftSortSelect">'
      + '<option value="valueDesc"' + (sortKey === "valueDesc" ? ' selected' : '') + '>Value (highest first)</option>'
      + '<option value="valueAsc"' + (sortKey === "valueAsc" ? ' selected' : '') + '>Value (lowest first)</option>'
      + '<option value="type"' + (sortKey === "type" ? ' selected' : '') + '>Type (figs, parts, sets)</option>'
      + '</select>'
      + '</div>';
  }

  function saleDraftHtml() {
    var d = saleDraft;
    if (!d) return "";
    var pct = parseFloat(d.pct);
    var validPct = pct > 0 && pct < 100;
    var sortedRows = sortSaleDraftRows(d.rows, d.sortKey);
    return '<div class="sale-draft-panel">'
      + '<div class="sale-draft-title">Put ' + d.rows.length + ' item' + (d.rows.length === 1 ? '' : 's') + ' on sale</div>'
      + (d.excludedCount ? '<div class="sale-tools-box-desc">' + d.excludedCount + ' item' + (d.excludedCount === 1 ? '' : 's') + ' already in another sale ' + (d.excludedCount === 1 ? 'was' : 'were') + ' left out.</div>' : '')
      + (d.stockRoomCount ? '<div class="sale-tools-box-desc">' + d.stockRoomCount + ' stock room item' + (d.stockRoomCount === 1 ? '' : 's') + ' left out — a sale only covers live listings.</div>' : '')
      + '<div class="inventory-fields wanted-manual-fields sale-fields-row">'
      + '<div class="inventory-field"><label>% off</label><input type="number" min="1" max="99" id="saleDraftPctInput" value="' + escapeHtml(d.pct) + '"></div>'
      + '<div class="inventory-field date-field"><label>Ends <span class="field-hint">(optional)</span></label><input type="date" id="saleDraftEndsInput" value="' + escapeHtml(d.endsAt) + '"></div>'
      + '<div class="inventory-field description-field"><label>Label <span class="field-hint">(optional, just for your reference)</span></label><input type="text" id="saleDraftLabelInput" value="' + escapeHtml(d.label) + '" placeholder="e.g. Star Wars 20% off"></div>'
      + '</div>'
      + saleDraftSortSelectHtml(d.sortKey)
      + '<div class="sale-preview-list" id="saleDraftPreviewList">'
      + sortedRows.map(function (r) { return saleDraftPreviewRowHtml(r, pct, validPct); }).join("")
      + '</div>'
      + '<div class="wanted-manual-actions">'
      + '<button type="button" class="reset-btn" id="saleDraftConfirmBtn"' + (saleSubmitting ? ' disabled' : '') + '>' + (saleSubmitting ? "Starting…" : "Start Sale") + '</button>'
      + '<button type="button" class="reset-btn" id="saleDraftCancelBtn"' + (saleSubmitting ? ' disabled' : '') + '>Cancel</button>'
      + '</div>'
      + '</div>';
  }

  // Sales run on BrickLink's own per-listing sale percentage (sale_rate):
  // unit_price stays the real price and BrickLink shows buyers the
  // discounted one, so starting a sale is one field per listing, ending it
  // is setting that field back to 0, and there's no pre-sale price record
  // to lose.
  function handleStartSaleConfirm() {
    if (!saleDraft || saleSubmitting) return;
    var pctInput = document.getElementById("saleDraftPctInput");
    var endsInput = document.getElementById("saleDraftEndsInput");
    var labelInput = document.getElementById("saleDraftLabelInput");
    var pct = parseFloat(pctInput.value);
    if (!(pct >= 1 && pct <= 99 && pct === Math.floor(pct))) {
      window.alert("BrickLink's sale percentage has to be a whole number from 1 to 99.");
      return;
    }
    // Last line of defense: drop anything that's been put in a stock room
    // since the draft was built.
    var rows = saleDraft.rows.filter(function (r) { return !saleRowInStockRoom(r); });
    if (!rows.length) {
      window.alert("Everything in this sale is now in a stock room, so there's nothing live to put on sale.");
      return;
    }
    if (!window.confirm("Put " + rows.length + " item" + (rows.length === 1 ? "" : "s") + " on sale at " + pct + "% off on BrickLink now? Their listed prices stay as they are.")) return;

    rows.forEach(function (r) { r.result = null; });
    saleSubmitting = true;
    renderManageInventoryResults();

    postInventoryPriceUpdates(rows, pct).then(function (res) {
      var results = (res && res.results) || [];
      var items = {};
      results.forEach(function (result) {
        var row = findManageInventoryRow(result.key);
        if (!row) return;
        if (result.success) {
          applyInventoryResultQuantity(row, result);
          row.saleRate = pct;
          row.orig.saleRate = pct;
          row.result = { success: true };
          items[row.key] = { itemNo: row.itemNo, colorId: row.colorId, name: row.name };
        } else {
          row.result = { success: false, error: result.error };
        }
      });

      var itemCount = Object.keys(items).length;
      saleDraft = null;
      saleAreaExpanded = false;
      if (!itemCount) {
        window.alert("BrickLink rejected every item — sale not started. See the error on each row below.");
        return;
      }

      activeSales = (activeSales || []).concat([{
        id: "sale-" + Math.random().toString(36).slice(2, 10),
        active: true,
        mode: "rate",
        label: (labelInput.value || "").trim(),
        discountPct: pct,
        startedAt: new Date().toISOString(),
        endsAt: endsInput.value || "",
        items: items,
      }]);
      pushActiveSales();

      if (itemCount < rows.length) {
        var failedCount = rows.length - itemCount;
        window.alert(failedCount + " item" + (failedCount === 1 ? "" : "s") + " couldn't be put on sale — see the error on those rows. The sale is active for the other " + itemCount + ".");
      }
    }).catch(function (err) {
      window.alert("Couldn't reach the server to start the sale: " + err.message);
    }).finally(function () {
      saleSubmitting = false;
      renderManageInventoryResults();
    });
  }

  function activeSaleBannerHtml(sale) {
    var itemCount = Object.keys(sale.items || {}).length;
    var ended = sale.endsAt && new Date(sale.endsAt + "T23:59:59").getTime() < Date.now();
    var title = sale.label || (sale.discountPct + "% off");
    var detail = itemCount + " item" + (itemCount === 1 ? "" : "s") + " · started " + escapeHtml(formatDate(sale.startedAt))
      + (sale.endsAt ? " · " + (ended ? "sale period ended " : "ends ") + escapeHtml(formatDate(sale.endsAt)) : "");
    var ending = saleEndingId === sale.id;
    return '<div class="sale-banner' + (ended ? ' sale-banner-ended' : '') + '">'
      + '<div class="sale-banner-text"><strong>' + escapeHtml(title) + '</strong><span>' + detail + '</span></div>'
      + '<button type="button" class="reset-btn sale-end-btn" data-sale-id="' + escapeHtml(sale.id) + '"' + (ending ? ' disabled' : '') + '>' + (ending ? "Ending…" : "End Sale Now") + '</button>'
      + '</div>';
  }

  // One banner per running sale, stacked in the one Bulk Sale slot —
  // there's no cap on how many can be active at once.
  function activeSalesBannerHtml() {
    return (activeSales || []).map(activeSaleBannerHtml).join("");
  }

  function handleEndSaleNow(saleId) {
    if (saleEndingId) return;
    var sale = null;
    (activeSales || []).forEach(function (s) { if (s.id === saleId) sale = s; });
    if (!sale) return;
    var itemKeys = Object.keys(sale.items || {});
    if (!window.confirm("End the sale and take " + itemKeys.length + " item" + (itemKeys.length === 1 ? "" : "s") + " off sale on BrickLink now?")) return;

    saleEndingId = saleId;
    renderManageInventoryResults();

    ensureManageInventoryLoaded().then(function () {
      var toRevert = [];
      var missingKeys = [];
      itemKeys.forEach(function (key) {
        var row = findManageInventoryRow(key);
        if (!row) { missingKeys.push(key); return; } // listing's gone (deleted/sold out) — nothing left to revert on BrickLink
        row.result = null;
        toRevert.push(row);
      });

      if (!toRevert.length) {
        activeSales = activeSales.filter(function (s) { return s.id !== saleId; });
        pushActiveSales();
        return;
      }

      return postInventoryPriceUpdates(toRevert, 0).then(function (res) {
        var results = (res && res.results) || [];
        // Anything BrickLink didn't confirm stays in the sale record
        // rather than being dropped — a failed revert is still visible
        // and retryable via End Sale Now again, instead of quietly
        // vanishing while the listing is still discounted on BrickLink.
        var remainingItems = {};
        Object.keys(sale.items).forEach(function (key) { remainingItems[key] = sale.items[key]; });
        missingKeys.forEach(function (key) { delete remainingItems[key]; });
        results.forEach(function (result) {
          var row = findManageInventoryRow(result.key);
          if (result.success) {
            if (row) {
              applyInventoryResultQuantity(row, result);
              row.saleRate = 0;
              row.orig = {
                quantity: row.quantity, newOrUsed: row.newOrUsed, unitPrice: row.unitPrice,
                description: row.description, remarks: row.remarks, stockRoomId: row.stockRoomId,
                saleRate: 0,
              };
              row.result = { success: true };
            }
            delete remainingItems[result.key];
          } else if (row) {
            row.result = { success: false, error: result.error };
          }
        });

        var remainingCount = Object.keys(remainingItems).length;
        if (remainingCount) {
          activeSales = activeSales.map(function (s) {
            if (s.id !== saleId) return s;
            return {
              id: s.id, active: true, mode: "rate", label: s.label, discountPct: s.discountPct,
              startedAt: s.startedAt, endsAt: s.endsAt, items: remainingItems,
            };
          });
          window.alert(remainingCount + " item" + (remainingCount === 1 ? "" : "s") + " couldn't be reverted — see the error on those rows. The sale stays active for just those; try End Sale Now again once fixed.");
        } else {
          activeSales = activeSales.filter(function (s) { return s.id !== saleId; });
        }
        pushActiveSales();
      });
    }).catch(function (err) {
      window.alert("Couldn't reach the server to end the sale: " + err.message);
    }).finally(function () {
      saleEndingId = null;
      renderManageInventoryResults();
    });
  }

  // ---- Sales Stats ----

  // null = not yet fetched. An array (even empty) = loaded. Persists
  // across navigating away and back within the session (same reasoning
  // as manageInventoryRows) — only a real page reload re-fetches, since
  // this is "quick reference" historical data, not something that needs
  // to reflect a brand-new order the instant it comes in.
  var statsRows = null;
  var statsError = null;

  // Lazy, cached, session-lifetime load for read-only consumers (the
  // order detail page's "Previous orders" line) that want this same
  // history without forcing Ryan to visit Order Lookup/Stats first —
  // same "fetch once, reuse forever this session" pattern as
  // ensureManageInventoryLoaded(). Explicit Retry on the Stats/Order
  // Lookup pages themselves still goes through fetchStats() directly,
  // which always re-fetches regardless of what's already cached.
  var statsLazyLoadPromise = null;
  function ensureStatsLoaded() {
    if (statsRows) return Promise.resolve(statsRows);
    if (!statsLazyLoadPromise) {
      statsLazyLoadPromise = fetchJSON("/api/order-stats").then(function (rows) {
        statsRows = rows || [];
        return statsRows;
      }).catch(function (err) {
        statsLazyLoadPromise = null; // let a later call retry rather than caching the failure forever
        throw err;
      });
    }
    return statsLazyLoadPromise;
  }

  // Order Lookup (see below) reuses this same fetch and statsRows/
  // statsError rather than issuing its own — it's the same full order
  // history (filed and unfiled alike) either way, just used to search
  // instead of aggregate.
  function fetchStats() {
    statsError = null;
    fetchJSON("/api/order-stats")
      .then(function (rows) {
        statsRows = rows || [];
        if (currentView === "stats") renderStatsView();
        if (currentView === "order-lookup") renderOrderLookupResults();
      })
      .catch(function (err) {
        statsError = err.message;
        if (currentView === "stats") renderStatsView();
        if (currentView === "order-lookup") renderOrderLookupResults();
      });
  }

  var STATS_MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  // Pure aggregation over the raw per-order rows /api/order-stats
  // returns — same "backend fetches, frontend rolls up" split already
  // used for Manage Inventory's stats banner. Only sums revenue in
  // whichever currency shows up first (matching the same defensive
  // single-currency assumption the orders list's own "in process" total
  // already makes) — a mismatched-currency order still counts toward
  // orders/items, just not toward the $ total, and is called out via
  // otherCurrencyCount so it's not just silently dropped.
  function computeOrderStats(rows) {
    var currencyCode = null;
    var otherCurrencyCount = 0;
    var byYear = {}; // year -> { year, orders, items, revenue, months: { 0..11 -> {orders, items, revenue} } }

    rows.forEach(function (row) {
      var d = row.date ? new Date(row.date) : null;
      if (!d || isNaN(d.getTime())) return;
      var year = d.getFullYear();
      var month = d.getMonth();

      if (!byYear[year]) {
        byYear[year] = { year: year, orders: 0, items: 0, revenue: 0, months: {} };
      }
      if (!byYear[year].months[month]) {
        byYear[year].months[month] = { month: month, orders: 0, items: 0, revenue: 0 };
      }

      var total = Number(row.grandTotal);
      var countsTowardRevenue = !isNaN(total);
      if (countsTowardRevenue) {
        if (!currencyCode) currencyCode = row.currencyCode;
        if (row.currencyCode !== currencyCode) {
          countsTowardRevenue = false;
          otherCurrencyCount++;
        }
      }

      byYear[year].orders++;
      byYear[year].items += row.totalCount || 0;
      byYear[year].months[month].orders++;
      byYear[year].months[month].items += row.totalCount || 0;
      if (countsTowardRevenue) {
        byYear[year].revenue += total;
        byYear[year].months[month].revenue += total;
      }
    });

    var years = Object.keys(byYear).map(function (y) { return byYear[y]; }).sort(function (a, b) { return b.year - a.year; });
    years.forEach(function (y) {
      y.months = Object.keys(y.months).map(function (m) { return y.months[m]; }).sort(function (a, b) { return b.month - a.month; });
      // Same orders-divided-into-revenue formula as allTimeAvgOrderValue
      // below, applied per year/month — a mismatched-currency order still
      // counts toward `orders` but not `revenue` (see countsTowardRevenue
      // above), so this understates slightly in a month/year that has one,
      // same known tradeoff the all-time figure already accepts.
      y.avgOrderValue = y.orders ? y.revenue / y.orders : 0;
      y.months.forEach(function (m) {
        m.avgOrderValue = m.orders ? m.revenue / m.orders : 0;
      });
    });

    var allTimeOrders = years.reduce(function (sum, y) { return sum + y.orders; }, 0);
    var allTimeRevenue = years.reduce(function (sum, y) { return sum + y.revenue; }, 0);

    return {
      currencyCode: currencyCode,
      otherCurrencyCount: otherCurrencyCount,
      allTimeOrders: allTimeOrders,
      allTimeRevenue: allTimeRevenue,
      allTimeAvgOrderValue: allTimeOrders ? allTimeRevenue / allTimeOrders : 0,
      years: years,
    };
  }

  // ---- Box choices tally ----
  //
  // boxChoice itself (orderId -> "large"|"medium"|"small"|"mailer") never
  // expires — it's a durable per-order tag, kept even once an order's
  // filed away, and filing an order only ever affects what /api/orders
  // (unfiled-only) returns, never the Blobs store this reads from. So a
  // filed order's tag was never actually lost — the earlier version of
  // this just failed to look anywhere else for its pieces/weight once it
  // dropped out of the unfiled `orders` array. Fixed by sourcing pieces
  // from `statsRows` instead (already fetched via /api/order-stats, which
  // explicitly pulls both filed=true and filed=false and covers an
  // order's full history), and by having fetchMissingBoxWeights() below
  // fetch weight for every tagged order directly by ID rather than only
  // ones still in the unfiled list — a per-ID GET /orders/{id} call works
  // the same regardless of filed status. missingPieces tracks the one
  // remaining, rare gap: an orderId BrickLink's own order history no
  // longer has any record of at all.
  function boxChoiceStats() {
    var bySize = {};
    BOX_OPTIONS.forEach(function (opt) { bySize[opt.value] = { count: 0, pieces: [], weightsG: [] }; });

    var totalCountById = {};
    (statsRows || []).forEach(function (r) { totalCountById[r.orderId] = r.totalCount; });

    var taggedIds = Object.keys(boxChoice).filter(function (id) { return boxChoice[id]; });
    var missingPieces = 0;
    taggedIds.forEach(function (orderId) {
      var bucket = bySize[boxChoice[orderId]];
      if (!bucket) return; // defensive — an old/unrecognized box value
      bucket.count++;
      var totalCount = totalCountById[orderId];
      if (totalCount) {
        bucket.pieces.push(totalCount);
      } else {
        missingPieces++;
      }
      var contact = contactCache[orderId];
      if (contact && contact.weightG) bucket.weightsG.push(contact.weightG);
    });

    return { total: taggedIds.length, missingPieces: missingPieces, bySize: bySize };
  }

  // Same race-safe "claim null before the fetch starts" pattern as
  // fetchMissingBuyerRealNames, but over every tagged orderId rather than
  // just the currently-open (unfiled) orders list — a filed order's
  // contact is still fetchable by ID, this just wasn't asking for it
  // before. In practice contactCache is often already warm for a
  // still-unfiled tagged order by the time Stats is opened (the orders
  // list's own fetchMissingBuyerRealNames call fills it for every visible
  // order, and tagging a box only ever happens from an order's detail
  // page, which fetches its own contact too) — this mainly ends up
  // covering filed orders, plus whatever else that missed, e.g. Stats
  // opened before Orders ever rendered this session.
  function fetchMissingBoxWeights() {
    Object.keys(boxChoice).forEach(function (orderId) {
      if (!boxChoice[orderId]) return;
      if (contactCache[orderId] !== undefined) return;
      contactCache[orderId] = null;
      fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/contact")
        .then(function (contact) {
          contactCache[orderId] = contact;
          if (currentView === "stats") renderStatsView();
        })
        .catch(function () { /* already claimed null above */ });
    });
  }

  // A single-sample bucket would otherwise show a "range" like "12.0 oz–12.0
  // oz" — collapses to just the one value instead.
  function rangeText(values, formatFn) {
    if (!values.length) return "";
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    return min === max ? formatFn(min) : formatFn(min) + '–' + formatFn(max);
  }

  function boxStatsSectionHtml() {
    var stats = boxChoiceStats();
    var rows = BOX_OPTIONS.map(function (opt) {
      var b = stats.bySize[opt.value];
      if (!b.count) return "";
      var pieces = b.pieces.length ? rangeText(b.pieces, function (n) { return String(n); }) + ' pieces' : "";
      var weights = b.weightsG.length ? rangeText(b.weightsG, formatWeightLbOz) : "";
      var detail = [pieces, weights].filter(function (s) { return s; }).join(' · ');
      return '<div class="box-stats-row">'
        + '<span class="box-stats-label">' + escapeHtml(opt.label) + '</span>'
        + '<span class="box-stats-count">' + b.count + '</span>'
        + '<span class="box-stats-range">' + escapeHtml(detail) + '</span>'
        + '</div>';
    }).join("");

    return ""
      + '<div class="stats-year-block box-stats-block">'
      + '<div class="stats-year-heading">'
      + '<span class="stats-year-label">Box choices logged</span>'
      + '<span class="stats-year-orders">' + stats.total + ' order' + (stats.total === 1 ? "" : "s") + '</span>'
      + '</div>'
      + (rows || '<div class="state-block">No box choices tagged yet — pick a box on an order’s detail page to start building this out.</div>')
      + (stats.missingPieces ? '<div class="box-stats-footnote">' + stats.missingPieces + ' tagged order' + (stats.missingPieces === 1 ? " has" : "s have") + " no matching record in this account's order history anymore, so " + (stats.missingPieces === 1 ? "it isn't" : "they aren't") + ' reflected in the ranges above.</div>' : '')
      + '</div>';
  }

  function renderStatsView() {
    if (statsError) {
      statsView.innerHTML = '<div class="state-block error">' + escapeHtml(statsError) + '<br><button class="reset-btn" id="statsRetryBtn">Retry</button></div>';
      var retryBtn = document.getElementById("statsRetryBtn");
      if (retryBtn) retryBtn.addEventListener("click", fetchStats);
      return;
    }
    if (!statsRows) {
      statsView.innerHTML = '<div class="state-block">Loading order history…</div>';
      fetchStats();
      return;
    }

    var stats = computeOrderStats(statsRows);

    var yearBlocks = stats.years.map(function (y) {
      var monthRows = y.months.map(function (m) {
        return ""
          + '<div class="stats-month-row">'
          + '<span class="stats-month-label">' + STATS_MONTH_NAMES[m.month] + '</span>'
          + '<span class="stats-month-orders">' + m.orders + ' order' + (m.orders === 1 ? "" : "s") + '</span>'
          + '<span class="stats-month-avg mono">avg ' + escapeHtml(formatCurrency(m.avgOrderValue, stats.currencyCode)) + '</span>'
          + '<span class="stats-month-revenue mono">' + escapeHtml(formatCurrency(m.revenue, stats.currencyCode)) + '</span>'
          + '</div>';
      }).join("");
      return ""
        + '<div class="stats-year-block">'
        + '<div class="stats-year-heading">'
        + '<span class="stats-year-label">' + y.year + '</span>'
        + '<span class="stats-year-orders">' + y.orders + ' order' + (y.orders === 1 ? "" : "s") + '</span>'
        + '<span class="stats-year-avg mono">avg ' + escapeHtml(formatCurrency(y.avgOrderValue, stats.currencyCode)) + '</span>'
        + '<span class="stats-year-revenue mono">' + escapeHtml(formatCurrency(y.revenue, stats.currencyCode)) + '</span>'
        + '</div>'
        + monthRows
        + '</div>';
    }).join("");

    fetchMissingBoxWeights();

    statsView.innerHTML = ""
      + '<div class="stats-summary">'
      + '<div class="stats-summary-tile"><strong>' + stats.allTimeOrders + '</strong><span>orders</span></div>'
      + '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(stats.allTimeAvgOrderValue, stats.currencyCode)) + '</strong><span>avg order</span></div>'
      + '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(stats.allTimeRevenue, stats.currencyCode)) + '</strong><span>total sales</span></div>'
      + '</div>'
      + (stats.otherCurrencyCount ? '<div class="stats-footnote">' + stats.otherCurrencyCount + ' order' + (stats.otherCurrencyCount === 1 ? "" : "s") + ' in a different currency excluded from the $ totals (still counted in orders/items).</div>' : '')
      + (yearBlocks || '<div class="state-block">No order history found.</div>')
      + boxStatsSectionHtml();
  }

  // ---- Order Lookup ----
  //
  // Finds any order regardless of status or filed state — unlike the main
  // orders list (deliberately unfiled-only, see orders.js), this searches
  // statsRows, the same full-history fetch Sales Stats already uses. An
  // order found here opens the normal order-detail page, just in
  // read-only mode (see orderDetailReadOnly/openOrder) — no pick
  // checkboxes or progress bar, since a looked-up order (often old,
  // filed, or already shipped) isn't what Ryan's actually out picking
  // right now; everything else (contact info, financials, messages,
  // feedback, box choice, status actions) stays fully usable.
  //
  // With an empty search box this doubles as a browsable recent-orders
  // list — Ryan asked for this after using Order Lookup for a while and
  // wanting to just glance at recent orders too, not only search for a
  // specific one, "combining the two" rather than adding a separate
  // button/page. Mirrors Manage Inventory's own "Recently Added" browse
  // view exactly: a date-range select (15/30/365 days, or all time) plus
  // a newest/oldest sort, both shown only while browsing — search itself
  // always covers full history regardless of the range selected (an
  // active search narrowing to "only recent" would be surprising the one
  // time it matters most: finding an older order the range would
  // otherwise hide) and stays fixed newest-first, same as Manage
  // Inventory's own search results are never independently sortable.
  var orderLookupQuery = "";
  var orderLookupSearchDebounceTimer = null;
  var orderLookupRangeDays = 30; // 15 | 30 | 365 | Infinity ("all time")
  var orderLookupSortKey = "newest"; // "newest" | "oldest"
  var ORDER_LOOKUP_RESULT_CAP = 40;

  function orderLookupMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q || !statsRows) return [];
    return statsRows.filter(function (o) {
      return (o.orderId && o.orderId.toLowerCase().indexOf(q) !== -1)
        || (o.buyer && o.buyer.toLowerCase().indexOf(q) !== -1)
        || (o.date && o.date.toLowerCase().indexOf(q) !== -1)
        || (o.date && formatDate(o.date).toLowerCase().indexOf(q) !== -1);
    }).sort(function (a, b) {
      var da = a.date ? new Date(a.date).getTime() : -Infinity;
      var db = b.date ? new Date(b.date).getTime() : -Infinity;
      return db - da;
    });
  }

  // orderLookupRangeDays as Infinity for "all time" makes the cutoff math
  // fall out naturally: Date.now() - Infinity = -Infinity, and every valid
  // date is >= that, so no special case is needed for "no limit" here.
  function orderLookupBrowseRows() {
    var cutoff = Date.now() - orderLookupRangeDays * 24 * 60 * 60 * 1000;
    var rows = statsRows.filter(function (o) {
      var t = o.date ? new Date(o.date).getTime() : NaN;
      return !isNaN(t) && t >= cutoff;
    });
    rows.sort(function (a, b) {
      var da = new Date(a.date).getTime();
      var db = new Date(b.date).getTime();
      return orderLookupSortKey === "oldest" ? da - db : db - da;
    });
    return rows;
  }

  function orderLookupCardHtml(o) {
    var needsLog = !isOrderLogged(o.orderId);
    return '<div class="order-card' + (needsLog ? ' needs-log' : '') + '" role="button" tabindex="0" data-order="' + escapeHtml(o.orderId) + '">'
      + '<div class="order-top-row">'
      + '<span class="order-id-group">'
      + '<span class="order-id mono">#' + escapeHtml(o.orderId) + '</span>'
      + statusBadgeHtml(o.status)
      + feedbackIconsHtml(o.orderId)
      + '</span>'
      + '<span class="order-date">' + escapeHtml(formatDate(o.date)) + '</span>'
      + '</div>'
      + '<div class="order-buyer">'
      + '<span>' + escapeHtml(o.buyer || "") + buyerRealNameHtml(o.orderId) + '</span>'
      + (o.grandTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(o.grandTotal, o.currencyCode)) + '</span>' : '')
      + '</div>'
      + '<div class="order-lots-items">' + (o.uniqueCount || 0) + ' lots · ' + (o.totalCount || 0) + ' items</div>'
      + '</div>';
  }

  // Maps a statsRows row (orderId/status/buyer/date/totalCount/
  // uniqueCount/grandTotal/currencyCode) to the shape openOrder()/
  // renderOrderDetail() expect (orderTotal instead of grandTotal — kept
  // separate names in order-stats.js itself since Sales Stats' own
  // aggregation already reads `grandTotal` there and renaming it would
  // ripple through that unrelated code for no reason).
  function openLookupOrder(row) {
    openOrder(row.orderId, false, {
      orderId: row.orderId,
      status: row.status,
      buyer: row.buyer,
      date: row.date,
      totalCount: row.totalCount,
      uniqueCount: row.uniqueCount,
      orderTotal: row.grandTotal,
      currencyCode: row.currencyCode,
      filed: row.filed,
    });
  }

  // Rebuilds only the results area below the search box, same "leave the
  // <input> itself alone" reasoning as renderManageInventoryResults.
  function renderOrderLookupResults() {
    var container = document.getElementById("orderLookupResults");
    if (!container) return;
    var query = orderLookupQuery.trim();
    var browsing = !query;

    var body = "";
    var visibleRows = [];
    if (statsError) {
      body = '<div class="state-block error">' + escapeHtml(statsError) + '<br><button class="reset-btn" id="orderLookupRetryBtn">Retry</button></div>';
    } else if (!statsRows) {
      body = '<div class="state-block">Loading order history…</div>';
    } else if (!browsing) {
      var matches = orderLookupMatches(query);
      var capped = matches.slice(0, ORDER_LOOKUP_RESULT_CAP);
      visibleRows = capped;
      body = '<div class="inventory-summary-row"><span>' + matches.length + ' match' + (matches.length === 1 ? '' : 'es') + '</span></div>'
        + (capped.length ? capped.map(orderLookupCardHtml).join("") : '<div class="state-block">No orders found.</div>')
        + (matches.length > capped.length ? '<div class="manage-inventory-cap-note">Showing the first ' + capped.length + ' of ' + matches.length + ' matches — refine your search to see the rest.</div>' : '');
    } else {
      var rows = orderLookupBrowseRows();
      var cappedRows = rows.slice(0, ORDER_LOOKUP_RESULT_CAP);
      visibleRows = cappedRows;
      body = '<div class="order-lookup-sort-row">'
        + '<select class="order-lookup-sort-select" id="orderLookupRangeSelect">'
        + '<option value="15"' + (orderLookupRangeDays === 15 ? ' selected' : '') + '>Last 15 days</option>'
        + '<option value="30"' + (orderLookupRangeDays === 30 ? ' selected' : '') + '>Last 30 days</option>'
        + '<option value="365"' + (orderLookupRangeDays === 365 ? ' selected' : '') + '>Last year</option>'
        + '<option value="all"' + (orderLookupRangeDays === Infinity ? ' selected' : '') + '>All time</option>'
        + '</select>'
        + '<select class="order-lookup-sort-select" id="orderLookupSortSelect">'
        + '<option value="newest"' + (orderLookupSortKey === "newest" ? ' selected' : '') + '>Newest first</option>'
        + '<option value="oldest"' + (orderLookupSortKey === "oldest" ? ' selected' : '') + '>Oldest first</option>'
        + '</select>'
        + '</div>'
        + '<div class="inventory-summary-row"><span>' + rows.length + ' order' + (rows.length === 1 ? '' : 's') + '</span></div>'
        + (cappedRows.length ? cappedRows.map(orderLookupCardHtml).join("") : '<div class="state-block">No orders in this range.</div>')
        + (rows.length > cappedRows.length ? '<div class="manage-inventory-cap-note">Showing the first ' + cappedRows.length + ' of ' + rows.length + ' orders — narrow the range or search above to find a specific one.</div>' : '');
    }

    container.innerHTML = body;
    fetchMissingBuyerRealNames(visibleRows, container);

    var retryBtn = document.getElementById("orderLookupRetryBtn");
    if (retryBtn) retryBtn.addEventListener("click", fetchStats);

    var rangeSelect = document.getElementById("orderLookupRangeSelect");
    if (rangeSelect) {
      rangeSelect.addEventListener("change", function (e) {
        orderLookupRangeDays = e.target.value === "all" ? Infinity : parseInt(e.target.value, 10);
        renderOrderLookupResults();
      });
    }
    var sortSelect = document.getElementById("orderLookupSortSelect");
    if (sortSelect) {
      sortSelect.addEventListener("change", function (e) {
        orderLookupSortKey = e.target.value;
        renderOrderLookupResults();
      });
    }

    container.querySelectorAll(".order-card").forEach(function (card) {
      var row = statsRows.filter(function (o) { return o.orderId === card.getAttribute("data-order"); })[0];
      if (!row) return;
      card.addEventListener("click", function () { openLookupOrder(row); });
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openLookupOrder(row);
        }
      });
    });
  }

  function renderOrderLookupView() {
    orderLookupView.innerHTML = ""
      + '<input type="search" class="order-lookup-search" id="orderLookupSearchInput" placeholder="Search by order #, name, or date…" value="' + escapeHtml(orderLookupQuery) + '" autocomplete="off">'
      + '<div id="orderLookupResults"></div>';

    document.getElementById("orderLookupSearchInput").addEventListener("input", function (e) {
      orderLookupQuery = e.target.value;
      clearTimeout(orderLookupSearchDebounceTimer);
      orderLookupSearchDebounceTimer = setTimeout(renderOrderLookupResults, 150);
    });

    renderOrderLookupResults();
  }

  // ---- Set/Fig Lookup ----

  // Type a BrickLink set or minifig number, see which of its parts/figs
  // (per BrickLink's own Get Item Subsets BOM) Ryan already has in
  // inventory — "could I build/part this out of what's on the shelf."
  // Deliberately NOT a type-as-you-go search like Order Lookup's: each
  // lookup is a real BrickLink API call (no local data to filter), so it
  // fires on explicit submit (Enter or the button), never per keystroke.
  // Results are cached per type+no for the rest of the session — same
  // {loading, data, error} shape as priceGuideCache — so re-looking-up
  // the same number (switching away and back) is free.
  var setFigLookupType = "MINIFIG"; // "SET" | "MINIFIG"
  var setFigLookupQuery = "";
  var setFigLookupCache = {};
  var setFigLookupActiveKey = null;
  // Drill-in trail — pushed to when Ryan taps "View this minifig's parts"
  // on one of a SET's own minifig rows, so "← Back" can return to the set
  // without retyping it: each entry is just enough ({type, no, query}) to
  // restore the lookup form and re-run runSetFigLookup, which is a free
  // cache hit (same key as before) rather than a new fetch. A plain stack
  // rather than a single "parent" slot so drilling in twice still unwinds
  // correctly, even though nothing here currently drills more than one
  // level deep (a minifig's own parts are PART-type, never MINIFIG).
  var setFigLookupNavStack = [];
  // True when Lookup was opened from a Sort List card — shows a "← Back to
  // Sort List" button until Ryan leaves some other way.
  var setFigLookupCameFromSort = false;
  // Which half of a SET's results is showing when it has both ordinary
  // parts and loose minifigs ("FIGS" | "PARTS") — reset to minifigs-first
  // on every new submit, same lifetime as setFigLookupActiveKey. Unused
  // (and irrelevant) for a lookup whose entries are all one type.
  var setFigResultsSubView = "FIGS";

  function setFigLookupKey(type, no) { return type + ":" + no; }

  // Bare set numbers are sold/printed without BrickLink's own "-1" variant
  // suffix (e.g. the box says "75192", BrickLink's own number is
  // "75192-1") — appended automatically so Ryan doesn't have to know or
  // type that convention. Left alone if he already typed a suffix, or for
  // a minifig number, which never takes one.
  function normalizeSetFigNo(type, raw) {
    var no = (raw || "").trim();
    if (type === "SET" && no && no.indexOf("-") === -1) no += "-1";
    return no;
  }

  // Flips the submit button's label in place (no full re-render, so focus/
  // cursor position in the field is untouched) — called right at submit
  // time, not after the fetch resolves, so it reads "Clear" immediately.
  function updateSetFigLookupSubmitBtn() {
    var btn = document.querySelector(".set-fig-lookup-btn");
    if (!btn) return;
    btn.textContent = setFigLookupActiveKey ? "Clear" : "Look up";
    btn.classList.toggle("clear", !!setFigLookupActiveKey);
  }

  function runSetFigLookup() {
    var no = normalizeSetFigNo(setFigLookupType, setFigLookupQuery);
    if (!no) return;
    var key = setFigLookupKey(setFigLookupType, no);
    setFigLookupActiveKey = key;
    setFigResultsSubView = "FIGS";
    updateSetFigLookupSubmitBtn();
    if (!setFigLookupCache[key]) {
      setFigLookupCache[key] = { loading: true, entries: null, error: null };
      fetchJSON("/api/item-subsets?type=" + encodeURIComponent(setFigLookupType) + "&no=" + encodeURIComponent(no))
        .then(function (data) {
          var entries = data.entries || [];
          // .key/.priceExpanded mirror manageInventoryRows's own fields so
          // these entries (and the set/fig's own header item, below) can be
          // handed straight to the shared price-guide helpers
          // (viewOnBricklinkLinkHtml, fetchPriceGuide, renderPriceGuidePanel)
          // as if they were ordinary rows. Assigned once here, not
          // recomputed per render, so toggling a panel open survives
          // re-renders (entries/item are cached, not rebuilt each render).
          entries.forEach(function (e, i) { e.key = key + ":" + i; e.priceExpanded = false; e.manualQty = 0; e.wantedBankAdded = false; });
          var item = data.item || { itemNo: no, name: "", type: setFigLookupType };
          item.key = key + ":item";
          item.priceExpanded = false;
          setFigLookupCache[key] = { loading: false, item: item, entries: entries, error: null };
          if (currentView === "set-fig-lookup") renderSetFigLookupResults();
        })
        .catch(function (err) {
          setFigLookupCache[key] = { loading: false, item: null, entries: null, error: err.message };
          if (currentView === "set-fig-lookup") renderSetFigLookupResults();
        });
    }
    renderSetFigLookupResults();
  }

  // Drills from a SET's own results into one of its minifigs' parts
  // breakdown — same lookup machinery a typed-in submit uses (runSetFigLookup
  // caches per type+no, so backing out and drilling into the same minifig
  // again later is still a free cache hit), just triggered by a tap instead
  // of typing the number in. Pushes where Ryan drilled in FROM onto the nav
  // stack first, so "← Back" can return to it without a re-fetch.
  function drillIntoSetFigEntry(entry) {
    setFigLookupNavStack.push({
      type: setFigLookupType,
      no: normalizeSetFigNo(setFigLookupType, setFigLookupQuery),
      query: setFigLookupQuery,
    });
    setFigLookupType = "MINIFIG";
    setFigLookupQuery = entry.itemNo;
    runSetFigLookup();
    renderSetFigLookupView();
  }

  // Label for the "← Back to ___" button — the parent's number plus its
  // cached name if the lookup that pushed it onto the stack already
  // resolved (it always will have, since drilling in is only reachable
  // from an already-loaded set). Falls back to the bare number otherwise.
  function setFigLookupBackLabel() {
    if (!setFigLookupNavStack.length) return "";
    var top = setFigLookupNavStack[setFigLookupNavStack.length - 1];
    var state = setFigLookupCache[setFigLookupKey(top.type, top.no)];
    var name = state && state.item ? decodeHtmlEntities(state.item.name || "") : "";
    return top.no + (name ? " " + name : "");
  }

  function renderSetFigLookupView() {
    var backHtml = setFigLookupNavStack.length
      ? '<button type="button" class="reset-btn set-fig-back-btn" id="setFigBackBtn">← Back to ' + escapeHtml(setFigLookupBackLabel()) + '</button>'
      : (setFigLookupCameFromSort
        ? '<button type="button" class="reset-btn set-fig-back-btn" id="setFigBackToSortBtn">← Back to Sort List</button>'
        : '');
    setFigLookupView.innerHTML = ""
      + '<div class="set-fig-lookup-intro">Enter a BrickLink set or minifig number to see which of its parts/figs you already have in inventory.</div>'
      + '<div class="set-fig-lookup-type-row">'
      + '<button type="button" class="set-fig-type-btn' + (setFigLookupType === "SET" ? " active" : "") + '" data-type="SET">Set</button>'
      + '<button type="button" class="set-fig-type-btn' + (setFigLookupType === "MINIFIG" ? " active" : "") + '" data-type="MINIFIG">Minifig</button>'
      + '</div>'
      + '<form class="set-fig-lookup-form" id="setFigLookupForm">'
      + '<input type="text" class="set-fig-lookup-search" id="setFigLookupInput" placeholder="' + (setFigLookupType === "SET" ? "e.g. 75192 or 75192-1" : "e.g. sw0359") + '" value="' + escapeHtml(setFigLookupQuery) + '" autocomplete="off">'
      + '<button type="submit" class="set-fig-lookup-btn' + (setFigLookupActiveKey ? ' clear' : '') + '">' + (setFigLookupActiveKey ? "Clear" : "Look up") + '</button>'
      + '</form>'
      + backHtml
      + '<div id="setFigLookupResults"></div>';

    var backToSortBtn = document.getElementById("setFigBackToSortBtn");
    if (backToSortBtn) {
      backToSortBtn.addEventListener("click", function () {
        setFigLookupCameFromSort = false;
        goToSortList();
      });
    }

    var backBtn = document.getElementById("setFigBackBtn");
    if (backBtn) {
      backBtn.addEventListener("click", function () {
        var prev = setFigLookupNavStack.pop();
        setFigLookupType = prev.type;
        setFigLookupQuery = prev.query;
        runSetFigLookup(); // same key as before drilling in — a cache hit, no re-fetch
        renderSetFigLookupView();
      });
    }

    setFigLookupView.querySelectorAll(".set-fig-type-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        setFigLookupType = el.getAttribute("data-type");
        // Switching Set/Minifig also resets the query/results/nav stack —
        // otherwise the box would keep showing the other type's number
        // (and the button "Clear" from its still-active lookup, and a
        // "← Back" to a set that no longer applies) instead of a fresh
        // field ready for a number of the newly-selected type.
        setFigLookupQuery = "";
        setFigLookupActiveKey = null;
        setFigLookupNavStack = [];
        setFigLookupCameFromSort = false;
        renderSetFigLookupView();
      });
    });

    // The button (and Enter in the field) does one of two things depending
    // on whether a lookup is currently active: submits the typed number, or
    // — once results are showing, button reads "Clear" — resets the field
    // and results so Ryan doesn't have to select-all/delete by hand before
    // typing the next number.
    document.getElementById("setFigLookupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (setFigLookupActiveKey) {
        clearSetFigLookup();
      } else {
        setFigLookupQuery = document.getElementById("setFigLookupInput").value;
        // Auto-corrects the Set/Minifig toggle to match what was actually
        // typed rather than requiring Ryan to click it first — a letter-
        // led number (sw0359, col001, ...) is never a BrickLink set number,
        // so this is safe to apply even if the other toggle was already
        // active (see guessManualAddType). Re-renders the whole shell
        // (not just the results) so the toggle's own active state reflects
        // the correction too.
        setFigLookupType = guessManualAddType(setFigLookupQuery, "SET");
        runSetFigLookup();
        renderSetFigLookupView();
      }
    });

    // If Ryan edits the box after a lookup's gone through (retrying past
    // an error, or just typing the next number without hitting Clear
    // first), the button shouldn't stay stuck on "Clear" — as soon as the
    // field no longer matches what was actually submitted, it reverts to
    // "Look up" so Enter/the button submits the edited text instead.
    document.getElementById("setFigLookupInput").addEventListener("input", function () {
      if (setFigLookupActiveKey && this.value !== setFigLookupQuery) {
        setFigLookupActiveKey = null;
        updateSetFigLookupSubmitBtn();
      }
    });

    renderSetFigLookupResults();
  }

  function clearSetFigLookup() {
    setFigLookupQuery = "";
    setFigLookupActiveKey = null;
    setFigLookupNavStack = [];
    setFigLookupCameFromSort = false;
    renderSetFigLookupView();
  }

  // Each subset entry's match against Ryan's own inventory — type checked
  // alongside itemNo+colorId (unlike inventoryStockCount's simpler two-
  // field match) since a PART and a MINIFIG can't collide on number but a
  // SET's subset list is exactly the case where telling them apart
  // actually matters here.
  function setFigLookupMatch(entry) {
    var rows = manageInventoryRows.filter(function (r) {
      return r.itemNo === entry.itemNo && r.colorId === (entry.colorId || 0) && r.type === entry.type && !r.markedForDelete;
    });
    var haveQty = rows.reduce(function (sum, r) { return sum + (parseInt(r.quantity, 10) || 0); }, 0);
    var totalValue = rows.reduce(function (sum, r) { return sum + (parseFloat(r.unitPrice) || 0) * (parseInt(r.quantity, 10) || 0); }, 0);
    // Qty per stock room (""  = not assigned to one) so the row can show
    // where to physically go pull it, same breakdown Manage Inventory's
    // own per-row Stock Room field already tracks.
    var roomQtys = {};
    rows.forEach(function (r) {
      var room = r.stockRoomId || "";
      roomQtys[room] = (roomQtys[room] || 0) + (parseInt(r.quantity, 10) || 0);
    });
    return { entry: entry, haveQty: haveQty, avgPrice: haveQty ? totalValue / haveQty : 0, roomQtys: roomQtys };
  }

  // "" (no stock room) isn't worth calling out — most listings don't use
  // one, and the common case needs no extra words. Only renders anything
  // once at least one matching row actually has a room set.
  function setFigLookupStockRoomHtml(roomQtys) {
    var rooms = Object.keys(roomQtys).filter(function (r) { return r !== ""; }).sort();
    if (!rooms.length) return "";
    if (rooms.length === 1 && !roomQtys[""]) {
      return ' · Stock Room ' + rooms[0];
    }
    var parts = rooms.map(function (r) { return r + ' ×' + roomQtys[r]; });
    if (roomQtys[""]) parts.push('unassigned ×' + roomQtys[""]);
    return ' · Stock Room ' + parts.join(', ');
  }

  // A rough "is it worth buying vs. parting out" signal on the row itself
  // — averages the same cheapest-25-listings list the price-guide panel
  // shows, not BrickLink's own Avg stat (which spans every listing of a
  // condition, outliers included, and isn't what anyone actually pays for
  // the cheap end of the market). Scoped to Set/Fig Lookup only, and only
  // once Ryan has expanded "See active US listings" for this row at least
  // once — fetching price data for every row on the page before that would
  // mean dozens of BrickLink API calls per lookup, risking rate-limiting.
  // Once fetched it's cached for the session (cheapestListings reads the
  // same priceGuideCache the panel does), so this line keeps showing here
  // even after the panel's collapsed again.
  function setFigLookupAvgCostHtml(row) {
    var combined = cheapestListings(row);
    if (!combined || !combined.length) return "";
    var avg = combined.reduce(function (sum, l) { return sum + Number(l.unitPrice); }, 0) / combined.length;
    return '<div class="item-avg-cost">~' + escapeHtml(formatCurrency(avg, combined[0].currencyCode)) + ' avg · cheapest ' + combined.length + ' US listing' + (combined.length === 1 ? '' : 's') + '</div>';
  }

  function setFigLookupRowHtml(bucket, colorsMap) {
    var e = bucket.entry;
    var pseudoItem = { type: e.type, itemNo: e.itemNo, colorId: e.colorId, newOrUsed: "N" };
    var colorName = e.colorId ? (colorsMap[e.colorId] || null) : null;
    // "Really" owned (a real inventory match) vs "manually" owned (Ryan
    // entered a temp-add-to-stock quantity for loose parts he hasn't
    // listed) — both land in the same In-stock section and count toward
    // the summary (any amount on hand counts as "in stock" here, same as
    // a real match for 1 of 10 needed already did — this list means "do I
    // have some," not "do I have enough," so there's no separate partial
    // bucket), but only a real match has a listed price to show, and only
    // a manual mark needs the field (a real match needs no override).
    var reallyOwned = bucket.haveQty > 0;
    var manuallyOwned = !reallyOwned && e.manualQty > 0;
    var stockLine;
    if (reallyOwned) {
      stockLine = ' · Have ' + bucket.haveQty + ' (listed at ' + escapeHtml(formatCurrency(bucket.avgPrice, "USD")) + ')' + setFigLookupStockRoomHtml(bucket.roomQtys);
    } else if (manuallyOwned) {
      stockLine = ' · Temp added ' + e.manualQty + ' (not in your listed inventory)';
    } else {
      stockLine = ' · None in stock';
    }
    // Same button look/feel as "Add to wanted list" below — a dashed
    // outline toggle that fills solid once active. Clicking it is the
    // primary on/off gesture (0 or the full needed quantity); when there's
    // more than one to count, a qty field rides alongside it so a partial
    // amount (e.g. "I have 3 of the 6 needed") is still reachable, same
    // capability the old number-input-only version had — the button just
    // replaces the checkbox a qty-1 need used to need on its own.
    var manualFieldHtml;
    if (reallyOwned) {
      manualFieldHtml = '';
    } else {
      var manualBtnLabel = manuallyOwned
        ? '✓ Temp added' + (e.quantity > 1 ? ' ' + e.manualQty : '') + ' — tap to remove'
        : '+ Temp add to stock';
      manualFieldHtml = '<button type="button" class="set-fig-manual-owned-btn' + (manuallyOwned ? ' added' : '') + '" data-key="' + escapeHtml(e.key) + '">' + manualBtnLabel + '</button>';
      if (e.quantity > 1) {
        manualFieldHtml += '<label class="wanted-bank-qty-field"><span>Qty</span><input type="number" class="set-fig-manual-qty-input" data-key="' + escapeHtml(e.key) + '" min="0" max="' + e.quantity + '" step="1" value="' + (e.manualQty || 0) + '"></label>';
      }
    }
    // Only a truly still-missing row (not reallyOwned, not temp-added) can
    // be queued for ordering — marking something "temp add to stock" says
    // "I actually have this," which isn't compatible with also wanting to
    // buy it. Tracked as a flag on the entry itself, NOT by checking
    // whether the bank already holds this item/color — the same part can
    // be missing from two different lookups (e.g. two minifigs sharing a
    // part), landing in the same bank line; checking the shared key would
    // make the second lookup's still-unclicked row read as "already
    // added" and turn its own click into an accidental remove.
    var showWantedBankBtn = !reallyOwned && !manuallyOwned;
    var inWantedBank = showWantedBankBtn && e.wantedBankAdded;
    var wantedBankBtnHtml = showWantedBankBtn
      ? '<button type="button" class="set-fig-wanted-bank-btn' + (inWantedBank ? ' added' : '') + '" data-key="' + escapeHtml(e.key) + '">' + (inWantedBank ? '✓ In wanted list — tap to remove' : '+ Add to wanted list') + '</button>'
      : '';
    // Only on a minifig — BrickLink doesn't return nested MINIFIG entries
    // inside a minifig's own parts breakdown, so there's never a second
    // level of these to drill into. Lets Ryan jump straight to, say, just
    // the torso a minifig is missing rather than buying the whole figure.
    var drillBtnHtml = e.type === "MINIFIG"
      ? '<button type="button" class="set-fig-drill-btn" data-key="' + escapeHtml(e.key) + '">View this minifig’s parts →</button>'
      : '';
    // A real inventory match (not just a temp-add) is an actual listing
    // Ryan can edit or delete — e.g. pulling a part's stock down (or
    // removing it outright) once it's gone into a set he's building, or
    // deleting a fig he's parting out. Jumps to Manage Inventory with its
    // item number already in the search box rather than duplicating any
    // edit/delete UI here — color variants (if more than one) land
    // together in that short a result list, easy to tell apart by eye.
    var manageBtnHtml = reallyOwned
