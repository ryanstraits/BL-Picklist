    var saveTrackingBtn = document.getElementById("saveTrackingBtn");
    if (saveTrackingBtn) {
      saveTrackingBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var input = document.getElementById("trackingInput");
        var trackingNo = input.value.trim();
        if (!trackingNo) { window.alert("Enter a tracking number first."); return; }

        saveTrackingBtn.disabled = true;
        saveTrackingBtn.textContent = "Saving…";

        postJSON("/api/update-tracking", { orderId: order.orderId, trackingNo: trackingNo })
          .then(function () {
            contact.trackingNo = trackingNo;
            contactCache[order.orderId] = contact;
            renderOrderDetail(order, items, messages, contact);
          })
          .catch(function (err) {
            window.alert("Couldn't save tracking number: " + err.message);
            saveTrackingBtn.disabled = false;
            saveTrackingBtn.textContent = "Save";
          });
      });
    }

    var jumpToItemsBtn = document.getElementById("jumpToItemsBtn");
    if (jumpToItemsBtn) {
      jumpToItemsBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var anchor = document.getElementById("orderItemsAnchor");
        var header = document.querySelector(".topbar");
        if (!anchor) return;
        // scrollIntoView's block:"start" aligns the anchor with the very
        // top of the viewport, but the header is position:sticky and
        // overlaps that same space — without correcting for its height,
        // the anchor (and the first item right after it) lands partly
        // hidden underneath it, which is what looked like landing
        // "midway through the first item" instead of at its top.
        var headerHeight = header ? header.getBoundingClientRect().height : 0;
        var targetY = anchor.getBoundingClientRect().top + window.scrollY - headerHeight - 12;
        window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
      });
    }

    wireFeedbackForm(order, items, messages, contact);
    fetchAndShowBuyerRating(order.buyer);

    document.getElementById("bottomBackBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      goToOrders();
    });
  }

  // Country line is skipped for US addresses — that matches how a
  // standard domestic USPS-style name/address block reads, and is what
  // gets pasted into PirateShip's address fields.
  function contactAddressLines(contact) {
    if (!contact) return [];
    var lines = [];
    if (contact.name) lines.push(contact.name);
    if (contact.address1) lines.push(contact.address1);
    if (contact.address2) lines.push(contact.address2);
    var cityStateZip = [contact.city, contact.state].filter(Boolean).join(", ") + (contact.postalCode ? " " + contact.postalCode : "");
    cityStateZip = cityStateZip.trim();
    if (cityStateZip) lines.push(cityStateZip);
    if (contact.countryCode && contact.countryCode !== "US") lines.push(contact.countryCode);
    return lines;
  }

  // UPS numbers always start "1Z"; USPS numbers are purely numeric and
  // long (tracking numbers range ~20-22 digits across their various
  // service prefixes — 9300/9400/9205/9407/etc — so matching "all
  // digits, long enough to be a real tracking number" catches those
  // without hardcoding one specific prefix). Anything else (FedEx,
  // DHL, a typo) is left as plain text rather than guessing a carrier
  // and linking to the wrong one.
  function trackingUrl(trackingNo) {
    var clean = (trackingNo || "").replace(/\s+/g, "");
    if (/^1Z/i.test(clean)) {
      return "https://www.ups.com/track?tracknum=" + encodeURIComponent(clean);
    }
    if (/^\d{10,}$/.test(clean)) {
      return "https://tools.usps.com/go/TrackConfirmAction?tLabels=" + encodeURIComponent(clean);
    }
    return null;
  }

  function renderTrackingRow(contact) {
    if (contact.trackingNo) {
      var url = trackingUrl(contact.trackingNo);
      var valueHtml = url
        ? '<a class="mono tracking-number-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(contact.trackingNo) + '</a>'
        : '<span class="mono">' + escapeHtml(contact.trackingNo) + '</span>';
      return '<div class="contact-row"><span class="contact-label">Tracking</span>' + valueHtml + '</div>';
    }
    return ""
      + '<div class="contact-row">'
      + '<span class="contact-label">Tracking</span>'
      + '<span class="tracking-entry">'
      + '<input type="text" class="tracking-input" id="trackingInput" placeholder="Enter tracking number" autocomplete="off">'
      + '<button class="copy-btn tracking-save-btn" id="saveTrackingBtn">Save</button>'
      + '</span>'
      + '</div>';
  }

  function renderContactSection(contact) {
    if (!contact || (!contact.email && !contact.address1)) return "";
    var lines = contactAddressLines(contact);
    return ""
      + '<div class="contact-section">'
      + (lines.length ? '<div class="contact-row"><span class="contact-label">Ship to</span><span class="contact-address">' + lines.map(escapeHtml).join("<br>") + '</span></div>' : '')
      + (contact.email ? '<div class="contact-row"><span class="contact-label">Email</span><span>' + escapeHtml(contact.email) + '</span></div>' : '')
      + renderTrackingRow(contact)
      + '<div class="contact-actions">'
      + (lines.length ? '<button class="copy-btn" id="copyAddressBtn">Copy name &amp; address</button>' : '')
      + (contact.email ? '<button class="copy-btn" id="copyEmailBtn">Copy email</button>' : '')
      + '</div>'
      + '</div>';
  }

  // Payment method lives here now (moved out of the contact/address block)
  // alongside the full cost breakdown — all sourced from the same order
  // detail fetch, just grouped by what it's about rather than where it
  // came from. Optional charge rows (insurance/etc1/etc2/credit/coupon)
  // only show when BrickLink actually returned a non-zero value, so a
  // typical order isn't cluttered with a wall of "$0.00" rows.
  function financialRow(label, amount, currencyCode) {
    var num = Number(amount);
    if (!amount || isNaN(num) || num === 0) return "";
    return '<div class="contact-row"><span class="contact-label">' + escapeHtml(label) + '</span><span>' + escapeHtml(formatCurrency(amount, currencyCode)) + '</span></div>';
  }

  function renderFinancialSection(contact, order) {
    if (!contact) return "";
    var cost = contact.cost || {};
    var currencyCode = cost.currencyCode || order.currencyCode;
    var grandTotal = cost.grandTotal || order.orderTotal;
    if (!contact.paymentMethod && !grandTotal) return "";
    return ""
      + '<div class="contact-section">'
      + (contact.paymentMethod ? '<div class="contact-row"><span class="contact-label">Payment</span><span>' + escapeHtml(contact.paymentMethod) + '</span></div>' : '')
      + financialRow("Subtotal", cost.subtotal, currencyCode)
      + financialRow("Shipping", cost.shipping, currencyCode)
      + financialRow("Insurance", cost.insurance, currencyCode)
      + financialRow("Tax", cost.tax, currencyCode)
      + financialRow("Other", cost.etc1, currencyCode)
      + financialRow("Other", cost.etc2, currencyCode)
      + financialRow("Credit", cost.credit, currencyCode)
      + financialRow("Coupon", cost.coupon, currencyCode)
      + (grandTotal ? '<div class="contact-row financial-total"><span class="contact-label">Total</span><span>' + escapeHtml(formatCurrency(grandTotal, currencyCode)) + '</span></div>' : '')
      + '</div>';
  }

  // navigator.clipboard needs a secure context (fine — this app is always
  // served over HTTPS) but isn't available in every embedded webview, so
  // this falls back to the older execCommand("copy") dance via a hidden
  // textarea rather than just failing silently there.
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve(); else reject(new Error("Copy failed"));
      } catch (e) { reject(e); }
    });
  }

  function flashCopied(btn, originalText) {
    btn.textContent = "Copied!";
    setTimeout(function () { btn.textContent = originalText; }, 1500);
  }

  function renderMessagesSection(messages) {
    if (!messages || !messages.length) return "";
    var cards = messages.map(function (m) {
      return ""
        + '<div class="message-card">'
        + '<div class="message-meta"><span>' + escapeHtml(m.from || "") + '</span><span>' + escapeHtml(formatDate(m.dateSent)) + '</span></div>'
        + (m.subject ? '<div class="message-subject">' + escapeHtml(m.subject) + '</div>' : '')
        + '<div class="message-body">' + escapeHtml(m.body || "") + '</div>'
        + '</div>';
    }).join("");
    return '<div class="messages-section"><div class="messages-heading">Messages</div>' + cards + '</div>';
  }

  var RATING_OPTIONS = [
    { value: "Praise", label: "Praise", cls: "praise" },
    { value: "Neutral", label: "Neutral", cls: "neutral" },
    { value: "Complaint", label: "Complaint", cls: "complaint" }
  ];

  var DEFAULT_FEEDBACK_COMMENT = "A+ buyer! Thanks for your order with The Brick Stud, come back again soon :)";

  function renderFeedbackSection(order) {
    if (feedbackSent[order.orderId]) {
      return '<div class="feedback-section"><div class="feedback-sent-msg">Feedback sent — thanks!</div></div>';
    }
    var ratingBtns = RATING_OPTIONS.map(function (opt) {
      return '<button type="button" class="rating-btn ' + opt.cls + '" data-rating="' + opt.value + '">' + opt.label + '</button>';
    }).join("");
    return ""
      + '<div class="feedback-section">'
      + '<div class="feedback-heading">Leave feedback for buyer</div>'
      + '<div class="feedback-rating-row">' + ratingBtns + '</div>'
      + '<textarea class="feedback-textarea" id="feedbackComment" maxlength="500">' + escapeHtml(DEFAULT_FEEDBACK_COMMENT) + '</textarea>'
      + '<button class="feedback-submit-btn" id="feedbackSubmitBtn" disabled>Submit feedback</button>'
      + '</div>';
  }

  function wireFeedbackForm(order, items, messages, contact) {
    var section = orderView.querySelector(".feedback-section");
    if (!section || feedbackSent[order.orderId]) return;

    var selectedRating = null;
    var ratingBtns = section.querySelectorAll(".rating-btn");
    var commentEl = section.querySelector("#feedbackComment");
    var submitBtn = section.querySelector("#feedbackSubmitBtn");

    function updateSubmitState() {
      submitBtn.disabled = !selectedRating || !commentEl.value.trim();
    }

    ratingBtns.forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        selectedRating = btn.getAttribute("data-rating");
        ratingBtns.forEach(function (b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        updateSubmitState();
      });
    });

    commentEl.addEventListener("click", function (e) { e.stopPropagation(); });
    commentEl.addEventListener("input", updateSubmitState);

    submitBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var comment = commentEl.value.trim();
      if (!selectedRating || !comment) return;
      if (!window.confirm("Post " + selectedRating + " feedback for order #" + order.orderId + "? This is public and visible to the buyer.")) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      postJSON("/api/feedback", { orderId: order.orderId, rating: selectedRating, comment: comment })
        .then(function () {
          feedbackSent[order.orderId] = true;
          pushOrderActions();
          renderOrderDetail(order, items, messages, contact);
        })
        .catch(function (err) {
          window.alert("Couldn't post feedback: " + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit feedback";
        });
    });
  }

  function handleSendDriveThru(order, items, messages, contact) {
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + order.orderId + "?")) return;

    var btn = document.getElementById("driveThruBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: order.orderId })
      .then(function () {
        driveThruSent[order.orderId] = true;
        pushOrderActions();
        renderOrderDetail(order, items, messages, contact);
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = "Send Drive Thru";
      });
  }

  // Confirmed against a live response: GET /members/{username}/ratings
  // returns { user_name, rating: { PRAISE, NEUTRAL, COMPLAINT } } — counts,
  // not an overall score — e.g. {"PRAISE":1,"NEUTRAL":0,"COMPLAINT":0}.
  function fetchAndShowBuyerRating(username) {
    var badge = document.getElementById("buyerRatingBadge");
    if (!badge || !username) return;

    if (ratingsCache[username]) {
      renderRatingBadge(badge, ratingsCache[username]);
      return;
    }

    fetchJSON("/api/member-rating?username=" + encodeURIComponent(username))
      .then(function (rating) {
        ratingsCache[username] = rating;
        var stillThere = document.getElementById("buyerRatingBadge");
        if (stillThere) renderRatingBadge(stillThere, rating);
      })
      .catch(function () { /* rating just won't show */ });
  }

  function renderRatingBadge(badge, rating) {
    if (!rating || !rating.rating || typeof rating.rating !== "object") return;
    var counts = rating.rating;
    var praise = Number(counts.PRAISE) || 0;
    var neutral = Number(counts.NEUTRAL) || 0;
    var complaint = Number(counts.COMPLAINT) || 0;
    var total = praise + neutral + complaint;
    if (total === 0) return;
    // One decimal place so e.g. 1835/1842 shows as 99.6%, not a
    // misleadingly-rounded 100% when there are some non-praise ratings.
    var pct = Math.round((praise / total) * 1000) / 10;
    badge.textContent = "★ " + total + " (" + pct + "%)";
  }

  function setOrderLoading(order) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '<div class="order-buyer">' + escapeHtml(order.buyer || "") + '</div>'
      + '</div>'
      + '<div class="state-block">Loading items…</div>';
  }

  function setOrderError(order, message) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '</div>'
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="orderRetryBtn">Try again</button></div>'
      + '<div class="reset-row"><button class="bottom-back-btn" id="bottomBackBtnErr">&#8592; All orders</button></div>';
    var retryBtn = document.getElementById("orderRetryBtn");
    if (retryBtn) retryBtn.addEventListener("click", function () { openOrder(order.orderId, true); });
    var backBtnErr = document.getElementById("bottomBackBtnErr");
    if (backBtnErr) backBtnErr.addEventListener("click", goToOrders);
  }

  async function openOrder(orderId, forceReload) {
    var order = orders.filter(function (o) { return o.orderId === orderId; })[0];
    if (!order) return;

    currentView = "order";
    ordersView.classList.add("hidden");
    orderView.classList.remove("hidden");
    inventoryView.classList.add("hidden");
    backBtn.style.display = "inline-flex";
    topbarNavRow.style.display = "none";
    brandSub.textContent = "Order #" + order.orderId;

    // Make sure picks (and Drive Thru/feedback completion) reflect the
    // durable remote state before showing anything — this is what makes
    // a force-quit not look like a reset. Usually already resolved by
    // the time someone taps in, so this rarely adds a visible delay.
    setOrderLoading(order);
    if (remoteSyncPromise) {
      try { await remoteSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (orderActionsSyncPromise) {
      try { await orderActionsSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (currentView !== "order" || order.orderId !== orderId) return;

    if (forceReload) { delete itemsCache[orderId]; delete messagesCache[orderId]; delete contactCache[orderId]; }

    var cached = itemsCache[orderId];
    if (cached) {
      renderOrderDetail(order, cached, messagesCache[orderId] || [], contactCache[orderId] || null);
      return;
    }

    setOrderLoading(order);
    try {
      var colors = await getColors();
      var items = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/items");
      items.forEach(function (item) {
        item.colorName = item.colorId ? (colors[item.colorId] || null) : null;
        item.name = decodeHtmlEntities(item.name);
        item.description = decodeHtmlEntities(item.description);
        item.remarks = decodeHtmlEntities(item.remarks);
      });
      itemsCache[orderId] = items;
      migrateOrderState(orderId, items);

      // Messages are a nice-to-have, not core to picking — a failure here
      // shouldn't block the order view from showing.
      var messages = [];
      try {
        messages = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/messages");
        messages.forEach(function (m) {
          m.subject = decodeHtmlEntities(m.subject);
          m.body = decodeHtmlEntities(m.body);
        });
      } catch (e) { /* ignore — just show the order without messages */ }
      messagesCache[orderId] = messages;

      // Payment method/address/email — also a nice-to-have, not core to
      // picking, so a failure here shouldn't block the order view either.
      var contact = null;
      try {
        contact = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/contact");
        contact.name = decodeHtmlEntities(contact.name);
      } catch (e) { /* ignore — just show the order without the contact block */ }
      contactCache[orderId] = contact;

      // Catches "already done directly on BrickLink" — only ever adds
      // true, never overrides a locally-tracked true back to false, and
      // any failure here just leaves things as they were.
      try {
        var statusCheck = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/status-check?buyer=" + encodeURIComponent(order.buyer || ""));
        var actionsChanged = false;
        if (statusCheck && statusCheck.driveThruSent && !driveThruSent[orderId]) {
          driveThruSent[orderId] = true;
          actionsChanged = true;
        }
        if (statusCheck && statusCheck.feedbackAlreadyPosted && !feedbackSent[orderId]) {
          feedbackSent[orderId] = true;
          actionsChanged = true;
        }
        if (actionsChanged) pushOrderActions();
      } catch (e) { /* ignore — just show whatever's already tracked locally */ }

      if (currentView === "order" && order.orderId === orderId) {
        renderOrderDetail(order, items, messages, contact);
      }
    } catch (err) {
      if (currentView === "order" && order.orderId === orderId) {
        setOrderError(order, err.message);
      }
    }
  }

  // ---- Add Inventory (BrickScan CSV import) ----

  // Matches item-image.js's TYPE_LETTERS map, inverted — the single-letter
  // codes BrickScan's export (and BrickLink's own classic upload format)
  // use for ITEMTYPE aren't what the rest of this app works with; every
  // other item shown here (order items, thumbHtml/catalogImageUrl) uses
  // BrickLink's full-word type ("MINIFIG", "PART", ...), confirmed against
  // real order data. Converting up front means thumbHtml can be reused
  // as-is for the review cards.
  var INVENTORY_TYPE_CODE_TO_WORD = {
    P: "PART", S: "SET", M: "MINIFIG", B: "BOOK", G: "GEAR",
    C: "CATALOG", I: "INSTRUCTION", O: "ORIGINAL_BOX", U: "UNSORTED_LOT"
  };
  function inventoryTypeWord(code) {
    return INVENTORY_TYPE_CODE_TO_WORD[(code || "").trim().toUpperCase()] || "PART";
  }

  // Minimal RFC 4180 CSV parser — BrickScan's export quotes any field
  // containing a comma (e.g. item names like "Colonel Ward - Sand Green
  // Jacket, Reddish Brown Legs"), so a naive split(",") would misalign
  // every column after the first quoted field in a row.
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else {
          field += c;
        }
        continue;
      }
      if (c === '"') { inQuotes = true; continue; }
      if (c === ",") { row.push(field); field = ""; continue; }
      if (c === "\r") { continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; continue; }
      field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function csvTextToObjects(text) {
    var rows = parseCSV(text).filter(function (r) { return r.length > 1 || (r.length === 1 && r[0] !== ""); });
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).map(function (r) {
      var obj = {};
      headers.forEach(function (h, idx) { obj[h] = r[idx] !== undefined ? r[idx].trim() : ""; });
      return obj;
    });
  }

  var inventoryRowCounter = 0;

  // Default condition write-up text, seeded per-row below into BOTH
  // Description and Remarks, each only when BrickScan's own column for
  // it comes through blank — never overwrites text Ryan (or BrickScan)
  // already set. Still editable afterward via either field on the
  // review card.
  var DEFAULT_REMARKS_USED = "Typical light play wear, otherwise excellent condition. No cracks or scratches. Fast shipping!";
  var DEFAULT_REMARKS_NEW = "Taken straight out of packaging. Fast shipping!";

  // Maps one BrickScan CSV row to this app's internal shape. Column names
  // (ITEMTYPE/ITEMID/COLOR/REMARKS/DESCRIPTION/QTY/CONDITION/PRICE) match
  // BrickLink's own classic inventory-upload format exactly — confirmed
  // against a real BrickScan export — plus BrickScan's own extra columns
  // (ITEMNAME/COLORNAME/...) used here only for display, never sent to
  // BrickLink. type/itemNo/colorId/newOrUsed are named to match thumbHtml's
  // and catalogImageUrl's existing field expectations directly.
  function csvObjToInventoryRow(obj) {
    var newOrUsed = (obj.CONDITION || "").trim().toUpperCase() === "U" ? "U" : "N";
    var defaultText = newOrUsed === "U" ? DEFAULT_REMARKS_USED : DEFAULT_REMARKS_NEW;
    var remarks = obj.REMARKS || "";
    if (!remarks.trim()) remarks = defaultText;
    var description = obj.DESCRIPTION || "";
    if (!description.trim()) description = defaultText;
    return {
      key: "inv-" + (inventoryRowCounter++),
      include: true,
      type: inventoryTypeWord(obj.ITEMTYPE),
      itemNo: obj.ITEMID || "",
      colorId: parseInt(obj.COLOR, 10) || 0,
      colorName: obj.COLORNAME || "",
      name: decodeHtmlEntities(obj.ITEMNAME || ""),
      quantity: parseInt(obj.QTY, 10) || 1,
      newOrUsed: newOrUsed,
      unitPrice: obj.PRICE || "",
      description: description,
      remarks: remarks,
      location: obj.LOCATION || "",
      result: null,
      priceExpanded: false,
    };
  }

  // Keyed on item/color/condition. Takes an explicit cond ("N"/"U") rather
  // than reading row.newOrUsed — the panel now always shows both New and
  // Used listings regardless of which condition the row itself is set to,
  // so each row needs two independent cache entries, not one keyed off its
  // own Condition dropdown.
  function priceGuideKey(row, cond) {
    return row.type + ":" + row.itemNo + ":" + (row.colorId || 0) + ":" + cond;
  }

  var priceGuideCache = {};

  // Fetches both New and Used listings for a row — always both, since
  // Ryan wants to compare pricing across conditions regardless of what
  // condition the item's actually being listed as.
  function fetchPriceGuide(row) {
    var needsRender = false;
    ["N", "U"].forEach(function (cond) {
      var key = priceGuideKey(row, cond);
      if (priceGuideCache[key]) return; // already loading, loaded, or failed for this combo
      priceGuideCache[key] = { loading: true, data: null, error: null };
      needsRender = true;

      var qs = "type=" + encodeURIComponent(row.type) + "&no=" + encodeURIComponent(row.itemNo)
        + "&condition=" + encodeURIComponent(cond)
        + (row.colorId ? "&color=" + encodeURIComponent(row.colorId) : "");

      fetchJSON("/api/price-guide?" + qs).then(function (data) {
        priceGuideCache[key] = { loading: false, data: data, error: null };
        renderInventoryReview();
      }).catch(function (err) {
        priceGuideCache[key] = { loading: false, data: null, error: err.message };
        renderInventoryReview();
      });
    });
    if (needsRender) renderInventoryReview();
  }

  // Reverses INVENTORY_TYPE_CODE_TO_WORD (already confirmed against a real
  // BrickScan export) to get back BrickLink's single-letter item-type code
  // — cross-confirmed as the right code to use here too, since a real
  // captured catalogitem.page URL for a minifig (sw1528) used "M=sw1528",
  // matching this table's M: "MINIFIG" exactly.
  var INVENTORY_TYPE_WORD_TO_CODE = {};
  Object.keys(INVENTORY_TYPE_CODE_TO_WORD).forEach(function (code) {
    INVENTORY_TYPE_WORD_TO_CODE[INVENTORY_TYPE_CODE_TO_WORD[code]] = code;
  });

  // Deep-links to BrickLink's own catalog page, pre-filtered to this row's
  // color (if any), condition, and US-only listings. The #T=S&...&O={...}
  // fragment is copied verbatim (as a literal template, not re-built with
  // encodeURIComponent) from two real URLs captured live off bricklink.com
  // — its "O" param is oddly encoded (only { } " are percent-escaped; :
  // and , are left raw), so matching it exactly avoids guessing at whether
  // a "cleaner" encoding would still parse the same way. Confirmed shapes:
  //   no color (sw1528, New, US):
  //     ...?M=sw1528#T=S&O={"cond":"N","loc":"US","iconly":0}
  //   with color (3001 in Blue/7, New, US):
  //     ...?P=3001#T=S&C=7&O={"color":"7","cond":"N","loc":"US","iconly":0}
  // Color shows up twice — once as its own C= fragment param, once as a
  // string inside O — so both are included when row.colorId is set.
  function bricklinkCatalogUrl(row, cond) {
    var typeCode = INVENTORY_TYPE_WORD_TO_CODE[row.type] || "P";
    var base = "https://www.bricklink.com/v2/catalog/catalogitem.page?" + typeCode + "=" + encodeURIComponent(row.itemNo);
    if (row.colorId) {
      return base + "#T=S&C=" + row.colorId
        + "&O=%7B%22color%22:%22" + row.colorId + "%22,%22cond%22:%22" + cond + "%22,%22loc%22:%22US%22,%22iconly%22:0%7D";
    }
    return base + "#T=S&O=%7B%22cond%22:%22" + cond + "%22,%22loc%22:%22US%22,%22iconly%22:0%7D";
  }

  // Renders one condition's block (New or Used) — always both, regardless
  // of the row's own Condition dropdown, so Ryan can compare pricing
  // across conditions before deciding how to list an item.
  function renderPriceGuideSection(row, cond) {
    var label = cond === "U" ? "Used" : "New";
    var viewOnBricklink = '<a class="price-guide-view-link" href="' + escapeHtml(bricklinkCatalogUrl(row, cond)) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View on BrickLink ↗</a>';
    var state = priceGuideCache[priceGuideKey(row, cond)];
    if (!state || state.loading) {
      return '<div class="price-guide-panel">' + label + ' — Loading active US listings… ' + viewOnBricklink + '</div>';
    }
    if (state.error) {
      return '<div class="price-guide-panel error">' + label + ' — Couldn’t load listings: ' + escapeHtml(state.error) + ' ' + viewOnBricklink + '</div>';
    }
    var data = state.data;
    if (!data.listings.length) {
      return '<div class="price-guide-panel">' + label + ' — No active US listings found. ' + viewOnBricklink + '</div>';
    }
    var statsLine = label
      + " · Min " + formatCurrency(data.minPrice, data.currencyCode)
      + " · Avg " + formatCurrency(data.avgPrice, data.currencyCode)
      + " · Max " + formatCurrency(data.maxPrice, data.currencyCode)
      + " · " + data.totalQuantity + " for sale";
    var rows = data.listings.map(function (l, idx) {
      return '<div class="price-guide-row" data-key="' + escapeHtml(row.key) + '" data-price="' + escapeHtml(l.unitPrice) + '" data-condition="' + cond + '">'
        + '<span class="price-guide-rank">' + (idx + 1) + '</span>'
        + '<span class="price-guide-qty">×' + l.quantity + '</span>'
        + '<span class="price-guide-price mono">' + escapeHtml(formatCurrency(l.unitPrice, data.currencyCode)) + '</span>'
        + (l.shippingAvailable ? '' : '<span class="price-guide-noship">no ship</span>')
        + '</div>';
    }).join("");
    return '<div class="price-guide-panel">'
      + '<div class="price-guide-stats">' + escapeHtml(statsLine) + ' ' + viewOnBricklink + '</div>'
      + '<div class="price-guide-hint">Tap a listing to use its price (also sets Condition)</div>'
      + rows
      + '</div>';
  }

  function renderPriceGuidePanel(row) {
    if (!row.priceExpanded) return "";
    return renderPriceGuideSection(row, "N") + renderPriceGuideSection(row, "U");
  }

  // null = show the upload screen; an array (even empty after filtering)
  // = show the review screen. Persists across navigating away and back
  // (not cleared until "Start over"), same reasoning as itemsCache.
  var inventoryRows = null;
  var inventorySubmitting = false;

  function renderInventoryView() {
    if (!inventoryRows) {
      renderInventoryUpload(null);
    } else {
      renderInventoryReview();
    }
  }

  function renderInventoryUpload(errorMessage) {
    inventoryView.innerHTML = ""
      + '<div class="inventory-intro">Upload a BrickScan CSV export to review items before adding them to your BrickLink inventory. Nothing is sent to BrickLink until you approve it on the next screen.</div>'
      + '<div class="inventory-upload">'
      + '<input type="file" accept=".csv,text/csv" class="inventory-file-input" id="inventoryFileInput">'
      + '</div>'
      + (errorMessage ? '<div class="state-block error">' + escapeHtml(errorMessage) + '</div>' : '');
    document.getElementById("inventoryFileInput").addEventListener("change", handleInventoryFileChange);
  }

  function handleInventoryFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    file.text().then(function (text) {
      var objs = csvTextToObjects(text);
      if (!objs.length) { renderInventoryUpload("No rows found in that file."); return; }
      inventoryRows = objs.map(csvObjToInventoryRow);
      renderInventoryView();
    }).catch(function (err) {
      renderInventoryUpload("Couldn't read that file: " + err.message);
    });
  }

  function renderInventoryReview() {
    var includedCount = inventoryRows.filter(function (r) { return r.include; }).length;

    var cards = inventoryRows.map(function (row) {
      var locked = !!(row.result && row.result.success);
      var resultHtml = "";
      if (row.result) {
        resultHtml = row.result.success
          ? '<div class="inventory-row-result success">Added to inventory (ID ' + escapeHtml(row.result.inventoryId) + ')</div>'
          : '<div class="inventory-row-result error">' + escapeHtml(row.result.error) + '</div>';
      }
      return ""
        + '<div class="item-row inventory-row' + (!row.include ? ' skipped' : '') + (locked ? ' result-success' : '') + '" data-key="' + escapeHtml(row.key) + '">'
        + '<input type="checkbox" class="inventory-row-check" data-key="' + escapeHtml(row.key) + '"' + (row.include ? ' checked' : '') + (locked ? ' disabled' : '') + '>'
        + '<div class="item-thumb">' + thumbHtml(row) + '<span class="qty-chip">' + row.quantity + '</span></div>'
        + '<div class="item-body">'
        + '<div class="item-line1">'
        + '<span class="item-no mono">' + escapeHtml(row.itemNo) + '</span>'
        + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(row.type) + '</span></span>'
        + '</div>'
        + '<div class="item-name">' + escapeHtml(row.name || "(name unknown)") + '</div>'
        + (row.colorName && row.colorName.trim().toLowerCase() !== "not applicable" ? '<div class="item-color">' + escapeHtml(row.colorName) + '</div>' : '')
        + (row.location ? '<div class="item-color">Bin: ' + escapeHtml(row.location) + '</div>' : '')
        + '<div class="inventory-fields">'
        + '<div class="inventory-field"><label>Qty</label><input type="number" min="1" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="quantity" value="' + escapeHtml(row.quantity) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field"><label>Price</label><input type="text" inputmode="decimal" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="unitPrice" value="' + escapeHtml(row.unitPrice) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field"><label>Condition</label><select class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="newOrUsed"' + (locked ? ' disabled' : '') + '>'
        + '<option value="N"' + (row.newOrUsed === "N" ? ' selected' : '') + '>New</option>'
        + '<option value="U"' + (row.newOrUsed === "U" ? ' selected' : '') + '>Used</option>'
        + '</select></div>'
        + '<div class="inventory-field"><label>Color ID</label><input type="number" min="0" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="colorId" value="' + escapeHtml(row.colorId) + '"' + (locked ? ' disabled' : '') + '></div>'
        + '<div class="inventory-field description-field"><label>Description <span class="field-hint">(shown to buyer)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="description"' + (locked ? ' disabled' : '') + '>' + escapeHtml(row.description) + '</textarea></div>'
        + '<div class="inventory-field remarks-field"><label>Remarks <span class="field-hint">(private, only you see this)</span></label><textarea rows="2" class="inv-input" data-key="' + escapeHtml(row.key) + '" data-field="remarks"' + (locked ? ' disabled' : '') + '>' + escapeHtml(row.remarks) + '</textarea></div>'
        + '</div>'
        + resultHtml
        + '</div>'
        + '<div class="inventory-price-guide-block">'
        + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(row.key) + '">' + (row.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
        + renderPriceGuidePanel(row)
        + '</div>'
        + '</div>';
    }).join("");

    inventoryView.innerHTML = ""
      + '<div class="inventory-intro">Review each item before it goes live on BrickLink. Uncheck anything you don’t want to add yet, edit price/qty/condition as needed, then submit.</div>'
      + '<div class="inventory-summary-row">'
      + '<span>' + includedCount + ' of ' + inventoryRows.length + ' selected</span>'
      + '<div class="inventory-bulk-actions">'
      + '<button type="button" id="invSelectAllBtn">Select all</button>'
      + '<button type="button" class="inv-start-over-btn">Start over</button>'
      + '</div>'
      + '</div>'
      + cards
      + '<div class="inventory-submit-row">'
      + '<button class="inventory-submit-btn" id="inventorySubmitBtn"' + (includedCount === 0 || inventorySubmitting ? ' disabled' : '') + '>'
      + (inventorySubmitting ? "Submitting…" : "Submit " + includedCount + " item" + (includedCount === 1 ? "" : "s") + " to BrickLink")
      + '</button>'
      + '<button type="button" class="inv-start-over-btn">Start over</button>'
      + '</div>';

    wireThumbLinks(inventoryView);
    sizeThumbsToRows(inventoryView);

    inventoryView.querySelectorAll(".inventory-row-check").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (row) row.include = el.checked;
        renderInventoryReview();
      });
    });

    inventoryView.querySelectorAll(".inv-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        var field = el.getAttribute("data-field");
        if (field === "quantity" || field === "colorId") {
          row[field] = parseInt(el.value, 10) || 0;
        } else {
          row[field] = el.value;
        }
        // colorId changes which item+color the price guide looks up (a
        // different cache key) — re-fetch if that panel is open. newOrUsed
        // no longer affects the panel at all (both conditions are always
        // fetched), so it needs no re-fetch or re-render. Other fields
        // don't need a re-render either; doing one on every
        // keystroke-triggering "change" would drop focus mid-edit for no
        // benefit, since qty/price/remarks don't affect anything else shown.
        if (field === "colorId") {
          if (row.priceExpanded) fetchPriceGuide(row); else renderInventoryReview();
        }
      });
    });

    inventoryView.querySelectorAll(".price-guide-toggle-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.priceExpanded = !row.priceExpanded;
        if (row.priceExpanded) fetchPriceGuide(row);
        renderInventoryReview();
      });
    });

    inventoryView.querySelectorAll(".price-guide-row").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = findInventoryRow(el.getAttribute("data-key"));
        if (!row) return;
        row.unitPrice = el.getAttribute("data-price");
        // Tapping a Used-section listing while the row's still set to New
        // (or vice versa) would otherwise leave the price and the declared
        // Condition mismatched — syncing them here keeps a tapped price
        // honest about which condition it actually came from.
        row.newOrUsed = el.getAttribute("data-condition") === "U" ? "U" : "N";
        renderInventoryReview();
      });
    });

    var selectAllBtn = document.getElementById("invSelectAllBtn");
    if (selectAllBtn) {
      selectAllBtn.addEventListener("click", function () {
        var allIncluded = inventoryRows.every(function (r) { return r.include || (r.result && r.result.success); });
        inventoryRows.forEach(function (r) { if (!(r.result && r.result.success)) r.include = !allIncluded; });
        renderInventoryReview();
      });
    }

    inventoryView.querySelectorAll(".inv-start-over-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!window.confirm("Discard this list and upload a different file?")) return;
        inventoryRows = null;
        renderInventoryView();
      });
    });

    var submitBtn = document.getElementById("inventorySubmitBtn");
    if (submitBtn) {
      submitBtn.addEventListener("click", handleInventorySubmit);
    }
  }

  function findInventoryRow(key) {
    return inventoryRows.filter(function (r) { return r.key === key; })[0] || null;
  }

  function handleInventorySubmit() {
    var toSubmit = inventoryRows.filter(function (r) { return r.include && !(r.result && r.result.success); });
    if (!toSubmit.length) return;
    if (!window.confirm("Add " + toSubmit.length + " item" + (toSubmit.length === 1 ? "" : "s") + " to your live BrickLink inventory? This makes them visible/purchasable on your store right away.")) return;

    inventorySubmitting = true;
    renderInventoryReview();

    postJSON("/api/inventory-create", {
      items: toSubmit.map(function (r) {
        return {
          key: r.key, type: r.type, itemNo: r.itemNo, colorId: r.colorId,
          quantity: r.quantity, newOrUsed: r.newOrUsed, unitPrice: r.unitPrice,
          description: r.description, remarks: r.remarks,
        };
      }),
    }).then(function (res) {
      (res.results || []).forEach(function (result) {
        var row = findInventoryRow(result.key);
        if (row) row.result = result;
      });
    }).catch(function (err) {
      window.alert("Couldn't reach the server to submit these items: " + err.message);
    }).finally(function () {
      inventorySubmitting = false;
      renderInventoryReview();
    });
  }

  function goToOrders() {
    currentView = "orders";
    orderView.classList.add("hidden");
    inventoryView.classList.add("hidden");
    ordersView.classList.remove("hidden");
    backBtn.style.display = "none";
    topbarNavRow.style.display = "";
    refreshBtn.style.display = "";
    brandSub.textContent = "Open BrickLink orders";
    renderOrdersList();
  }

  function goToInventory() {
    currentView = "inventory";
    ordersView.classList.add("hidden");
    orderView.classList.add("hidden");
    inventoryView.classList.remove("hidden");
    backBtn.style.display = "inline-flex";
    topbarNavRow.style.display = "none";
    // Refresh only ever reloads Orders data (orders list, order items,
    // pick-state) — nothing on this screen, so hide it here rather than
    // leave a button that looks live but silently does nothing visible.
    refreshBtn.style.display = "none";
    brandSub.textContent = "Add Inventory";
    renderInventoryView();
  }

  backBtn.addEventListener("click", goToOrders);
  inventoryNavBtn.addEventListener("click", goToInventory);
  refreshBtn.addEventListener("click", function () {
    itemsCache = {};
    loadOrders();
    syncStateFromRemote();
    syncOrderActionsFromRemote();
  });

  // App-level password gate — Netlify's own visitor-access-control isn't
  // available on this team's plan (confirmed: the API rejects every
  // variant with a 422), so this substitutes for it: every /api/* function
  // rejects unauthenticated requests with 401 (see lib/site-auth.js), and
  // this is the frontend half — nothing here renders real data until a
  // session cookie is established via /api/site-login.
  function startApp() {
    appEl.classList.remove("hidden");
    loadState();
    loadOrders();
    syncStateFromRemote();
    syncOrderActionsFromRemote();
  }

  function showLoginGate() {
    appEl.classList.add("hidden");
    loginGate.classList.remove("hidden");
    loginGatePassword.focus();
  }

  function hideLoginGate() {
    loginGate.classList.add("hidden");
    loginGateError.classList.add("hidden");
    loginGatePassword.value = "";
  }

  loginGateForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = loginGatePassword.value;
    if (!password) return;
    loginGateSubmit.disabled = true;
    loginGateSubmit.textContent = "Checking…";
    loginGateError.classList.add("hidden");
    fetch("/api/site-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password }),
    }).then(function (res) {
      if (!res.ok) throw new Error("wrong");
      hideLoginGate();
      startApp();
    }).catch(function () {
      loginGateError.textContent = "Incorrect password. Try again.";
      loginGateError.classList.remove("hidden");
      loginGatePassword.value = "";
      loginGatePassword.focus();
    }).finally(function () {
      loginGateSubmit.disabled = false;
      loginGateSubmit.textContent = "Unlock";
    });
  });

  // Checks for an existing valid session cookie before deciding whether
  // to show the app or the password prompt — avoids a pointless flash of
  // loading state (and a guaranteed 401 from loadOrders()) for a
  // first-time or expired visitor.
  fetch("/api/site-session").then(function (res) {
    if (res.ok) { startApp(); } else { showLoginGate(); }
  }).catch(function () { showLoginGate(); });
})();
</script>
</body>
</html>
