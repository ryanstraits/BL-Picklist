    // Harmless-looking on desktop, but caused a real bug on iOS: tapping
    // an item near the bottom of a long list would visibly "jump" to a
    // different scroll position, almost certainly WebKit's scroll
    // position heuristics getting confused by the wholesale DOM
    // replacement. Toggling the "picked" class directly on just the
    // tapped row (all its visual states are pure CSS, no layout-affecting
    // properties — see .item-row.picked) avoids the rebuild entirely.
    // None of this wiring exists in read-only mode (Order Lookup) — there's
    // no picked-count line, no select-all/reset buttons, and item rows
    // render with no picked/partial class or checkmark to toggle anyway.
    if (!readOnly) {
      orderView.querySelectorAll(".item-row").forEach(function (row) {
        row.addEventListener("click", function () {
          var key = row.getAttribute("data-key");
          var qty = parseInt(row.getAttribute("data-qty"), 10) || 1;
          togglePicked(order.orderId, key, qty);

          var isDone = isPicked(order.orderId, key);
          var isMulti = qty > 1;
          var progress = isMulti ? pickProgress(order.orderId, key, qty) : null;
          row.classList.toggle("picked", isDone);
          row.classList.toggle("partial", isMulti && !isDone && progress.n > 0);

          var progressEl = row.querySelector(".item-progress-row");
          if (progressEl) progressEl.outerHTML = itemProgressRowHtml(progress);

          updatePickedProgress(order, items);
        });
      });
      updatePickedProgress(order, items);

      orderView.querySelectorAll(".reset-btn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          resetOrder(order.orderId);
          renderOrderDetail(order, items, messages, contact);
        });
      });

      orderView.querySelectorAll(".select-all-btn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          selectAllOrder(order.orderId, items);
          renderOrderDetail(order, items, messages, contact);
        });
      });
    }

    var detailStatusBtn = document.getElementById("detailStatusBtn");
    if (detailStatusBtn) {
      detailStatusBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var targetStatus = detailStatusBtn.getAttribute("data-target-status");
        var label = STATUS_META[targetStatus].label;
        if (!window.confirm("Mark order #" + order.orderId + " as " + label + " on BrickLink?")) return;

        var originalText = detailStatusBtn.textContent;
        detailStatusBtn.disabled = true;
        detailStatusBtn.textContent = "Updating…";

        postJSON("/api/update-order-status", { orderId: order.orderId, status: targetStatus })
          .then(function () {
            // order is the same object referenced from the orders array
            // (openOrder finds it there, not a copy) when reached from the
            // main list, so this mutation also updates what the orders
            // list shows once you go back. When reached from Order Lookup
            // instead, order is a throwaway fallback object (see
            // openLookupOrder) — syncStatsRowStatus is what keeps that
            // path's own statsRows snapshot in sync too.
            order.status = targetStatus;
            syncStatsRowStatus(order.orderId, targetStatus);
            renderOrderDetail(order, items, messages, contact);
          })
          .catch(function (err) {
            window.alert(statusUpdateErrorMessage(order.orderId, targetStatus, err));
            detailStatusBtn.disabled = false;
            detailStatusBtn.textContent = originalText;
          });
      });
    }

    // Same action and "drops out of the default filed=false /api/orders
    // fetch" reasoning as the list's own File order button — from the
    // detail page there's nowhere left to view once it's filed, so this
    // goes back to the orders list on success rather than re-rendering
    // this same (now stale) order.
    var detailFileBtn = document.getElementById("detailFileBtn");
    if (detailFileBtn) {
      detailFileBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (!window.confirm("File order #" + order.orderId + " on BrickLink? It'll no longer show up here or on your BrickLink Orders Received page.")) return;

        var originalText = detailFileBtn.textContent;
        detailFileBtn.disabled = true;
        detailFileBtn.textContent = "Filing…";

        postJSON("/api/file-order", { orderId: order.orderId })
          .then(function () {
            orders = orders.filter(function (o) { return o.orderId !== order.orderId; });
            // Filing doesn't remove an order from statsRows (order-stats
            // covers filed and unfiled alike) — it stays findable in Order
            // Lookup, same as before, just no longer in the main list.
            if (readOnly) goToOrderLookup(); else goToOrders();
          })
          .catch(function (err) {
            window.alert("Couldn't file order #" + order.orderId + ": " + err.message);
            detailFileBtn.disabled = false;
            detailFileBtn.textContent = originalText;
          });
      });
    }

    var driveThruBtn = document.getElementById("driveThruBtn");
    if (driveThruBtn) {
      driveThruBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleSendDriveThru(order, items, messages, contact);
      });
    }

    orderView.querySelectorAll(".box-choice-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var value = btn.getAttribute("data-box");
        boxChoice[order.orderId] = boxChoice[order.orderId] === value ? "" : value;
        pushOrderActions();
        orderView.querySelectorAll(".box-choice-btn").forEach(function (b) {
          b.classList.toggle("selected", b.getAttribute("data-box") === boxChoice[order.orderId]);
        });
      });
    });

    wireSpreadsheetLoggedAction(order);

    var copyAddressBtn = document.getElementById("copyAddressBtn");
    if (copyAddressBtn) {
      copyAddressBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var originalText = copyAddressBtn.textContent;
        copyToClipboard(contactAddressLines(contact).join("\n"))
          .then(function () { flashCopied(copyAddressBtn, originalText); })
          .catch(function () { window.alert("Couldn't copy — select and copy manually."); });
      });
    }
    var copyEmailBtn = document.getElementById("copyEmailBtn");
    if (copyEmailBtn) {
      copyEmailBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var originalText = copyEmailBtn.textContent;
        copyToClipboard(contact.email)
          .then(function () { flashCopied(copyEmailBtn, originalText); })
          .catch(function () { window.alert("Couldn't copy — select and copy manually."); });
      });
    }

    var saveTrackingBtn = document.getElementById("saveTrackingBtn");
    if (saveTrackingBtn) {
      saveTrackingBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var input = document.getElementById("trackingInput");
        var trackingNo = input.value.trim();
        if (!trackingNo) { window.alert("Enter a tracking number first."); return; }

        saveTrackingBtn.disabled = true;
        saveTrackingBtn.textContent = "Saving…";

        postJSON("/api/update-tracking", { orderId: order.orderId, trackingNo: trackingNo })
          .then(function () {
            contact.trackingNo = trackingNo;
            contactCache[order.orderId] = contact;
            renderOrderDetail(order, items, messages, contact);
          })
          .catch(function (err) {
            window.alert("Couldn't save tracking number: " + err.message);
            saveTrackingBtn.disabled = false;
            saveTrackingBtn.textContent = "Save";
          });
      });
    }

    var jumpToItemsBtn = document.getElementById("jumpToItemsBtn");
    if (jumpToItemsBtn) {
      jumpToItemsBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var anchor = document.getElementById("orderItemsAnchor");
        var header = document.querySelector(".topbar");
        if (!anchor) return;
        // scrollIntoView's block:"start" aligns the anchor with the very
        // top of the viewport, but the header is position:sticky and
        // overlaps that same space — without correcting for its height,
        // the anchor (and the first item right after it) lands partly
        // hidden underneath it, which is what looked like landing
        // "midway through the first item" instead of at its top.
        var headerHeight = header ? header.getBoundingClientRect().height : 0;
        var targetY = anchor.getBoundingClientRect().top + window.scrollY - headerHeight - 12;
        window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
      });
    }

    wireFeedbackForm(order, items, messages, contact);
    fetchAndShowBuyerRating(order.buyer);

    document.getElementById("bottomBackBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (readOnly) goToOrderLookup(); else goToOrders();
    });
  }

  // Country line is skipped for US addresses — that matches how a
  // standard domestic USPS-style name/address block reads, and is what
  // gets pasted into PirateShip's address fields.
  function contactAddressLines(contact) {
    if (!contact) return [];
    var lines = [];
    if (contact.name) lines.push(contact.name);
    if (contact.address1) lines.push(contact.address1);
    if (contact.address2) lines.push(contact.address2);
    var cityStateZip = [contact.city, contact.state].filter(Boolean).join(", ") + (contact.postalCode ? " " + contact.postalCode : "");
    cityStateZip = cityStateZip.trim();
    if (cityStateZip) lines.push(cityStateZip);
    if (contact.countryCode && contact.countryCode !== "US") lines.push(contact.countryCode);
    return lines;
  }

  // UPS numbers always start "1Z"; USPS numbers are purely numeric and
  // long (tracking numbers range ~20-22 digits across their various
  // service prefixes — 9300/9400/9205/9407/etc — so matching "all
  // digits, long enough to be a real tracking number" catches those
  // without hardcoding one specific prefix). Anything else (FedEx,
  // DHL, a typo) is left as plain text rather than guessing a carrier
  // and linking to the wrong one.
  function trackingUrl(trackingNo) {
    var clean = (trackingNo || "").replace(/\s+/g, "");
    if (/^1Z/i.test(clean)) {
      return "https://www.ups.com/track?tracknum=" + encodeURIComponent(clean);
    }
    if (/^\d{10,}$/.test(clean)) {
      return "https://tools.usps.com/go/TrackConfirmAction?tLabels=" + encodeURIComponent(clean);
    }
    return null;
  }

  function renderTrackingRow(contact) {
    if (contact.trackingNo) {
      var url = trackingUrl(contact.trackingNo);
      var valueHtml = url
        ? '<a class="mono tracking-number-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(contact.trackingNo) + '</a>'
        : '<span class="mono">' + escapeHtml(contact.trackingNo) + '</span>';
      return '<div class="contact-row"><span class="contact-label">Tracking</span>' + valueHtml + '</div>';
    }
    return ""
      + '<div class="contact-row">'
      + '<span class="contact-label">Tracking</span>'
      + '<span class="tracking-entry">'
      + '<input type="text" class="tracking-input" id="trackingInput" placeholder="Enter tracking number" autocomplete="off">'
      + '<button class="copy-btn tracking-save-btn" id="saveTrackingBtn">Save</button>'
      + '</span>'
      + '</div>';
  }

  // Reuses Order Lookup/Sales Stats' already-fetched statsRows (full order
  // history, filed and unfiled alike), lazily topped up by
  // ensureStatsLoaded() if neither of those pages has been visited yet
  // this session — openOrder() kicks that off in the background (see
  // refreshPreviousOrders() there) and patches #buyerPreviousOrders in
  // place once it resolves, same deferred-fill pattern as the buyer
  // rating badge, rather than this function itself ever blocking the
  // order detail page on a fetch. Counts every other order from the same
  // buyer regardless of status (a cancelled or problem order still means
  // "this isn't their first time ordering"), matched case-insensitively
  // since BrickLink usernames aren't case-sensitive identifiers. Hidden
  // entirely for a first-time buyer rather than printing "Previous
  // orders: 0" — there's nothing useful to say about a buyer with no
  // history yet.
  function previousOrdersText(order) {
    if (!statsRows || !order.buyer) return "";
    var buyerLower = order.buyer.toLowerCase();
    var others = statsRows.filter(function (r) {
      return r.orderId !== order.orderId && r.buyer && r.buyer.toLowerCase() === buyerLower;
    });
    if (!others.length) return "";
    var mostRecent = others.reduce(function (latest, r) {
      return (!latest || new Date(r.date) > new Date(latest.date)) ? r : latest;
    }, null);
    return "Previous orders: " + others.length
      + (mostRecent ? " (most recent " + formatDate(mostRecent.date) + ")" : "");
  }

  function previousOrdersHtml(order) {
    return '<div class="buyer-previous-orders" id="buyerPreviousOrders">' + escapeHtml(previousOrdersText(order)) + '</div>';
  }

  function refreshPreviousOrdersLine(order) {
    var el = document.getElementById("buyerPreviousOrders");
    if (el) el.textContent = previousOrdersText(order);
  }

  function renderContactSection(contact) {
    if (!contact || (!contact.email && !contact.address1)) return "";
    var lines = contactAddressLines(contact);
    return ""
      + '<div class="contact-section">'
      + (lines.length ? '<div class="contact-row"><span class="contact-label">Ship to</span><span class="contact-address">' + lines.map(escapeHtml).join("<br>") + '</span></div>' : '')
      + (contact.email ? '<div class="contact-row"><span class="contact-label">Email</span><span>' + escapeHtml(contact.email) + '</span></div>' : '')
      + renderTrackingRow(contact)
      + '<div class="contact-actions">'
      + (lines.length ? '<button class="copy-btn" id="copyAddressBtn">Copy name &amp; address</button>' : '')
      + (contact.email ? '<button class="copy-btn" id="copyEmailBtn">Copy email</button>' : '')
      + '</div>'
      + '</div>';
  }

  // Payment method lives here now (moved out of the contact/address block)
  // alongside the full cost breakdown — all sourced from the same order
  // detail fetch, just grouped by what it's about rather than where it
  // came from. Optional charge rows (insurance/etc1/etc2/credit/coupon)
  // only show when BrickLink actually returned a non-zero value, so a
  // typical order isn't cluttered with a wall of "$0.00" rows.
  function financialRow(label, amount, currencyCode) {
    var num = Number(amount);
    if (!amount || isNaN(num) || num === 0) return "";
    return '<div class="contact-row"><span class="contact-label">' + escapeHtml(label) + '</span><span>' + escapeHtml(formatCurrency(amount, currencyCode)) + '</span></div>';
  }

  function renderFinancialSection(contact, order) {
    if (!contact) return "";
    var cost = contact.cost || {};
    var currencyCode = cost.currencyCode || order.currencyCode;
    var grandTotal = cost.grandTotal || order.orderTotal;
    if (!contact.paymentMethod && !grandTotal) return "";
    return ""
      + '<div class="contact-section">'
      + (contact.paymentMethod ? '<div class="contact-row"><span class="contact-label">Payment</span><span>' + escapeHtml(contact.paymentMethod) + '</span></div>' : '')
      + financialRow("Subtotal", cost.subtotal, currencyCode)
      + financialRow("Shipping", cost.shipping, currencyCode)
      + financialRow("Insurance", cost.insurance, currencyCode)
      + financialRow("Tax", cost.tax, currencyCode)
      + financialRow("Other", cost.etc1, currencyCode)
      + financialRow("Other", cost.etc2, currencyCode)
      + financialRow("Credit", cost.credit, currencyCode)
      + financialRow("Coupon", cost.coupon, currencyCode)
      + (grandTotal ? '<div class="contact-row financial-total"><span class="contact-label">Total</span><span>' + escapeHtml(formatCurrency(grandTotal, currencyCode)) + '</span></div>' : '')
      + '</div>';
  }

  // navigator.clipboard needs a secure context (fine — this app is always
  // served over HTTPS) but isn't available in every embedded webview, so
  // this falls back to the older execCommand("copy") dance via a hidden
  // textarea rather than just failing silently there.
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve(); else reject(new Error("Copy failed"));
      } catch (e) { reject(e); }
    });
  }

  function flashCopied(btn, originalText) {
    btn.textContent = "Copied!";
    setTimeout(function () { btn.textContent = originalText; }, 1500);
  }

  function renderMessagesSection(messages) {
    if (!messages || !messages.length) return "";
    var cards = messages.map(function (m) {
      return ""
        + '<div class="message-card">'
        + '<div class="message-meta"><span>' + escapeHtml(m.from || "") + '</span><span>' + escapeHtml(formatDate(m.dateSent)) + '</span></div>'
        + (m.subject ? '<div class="message-subject">' + escapeHtml(m.subject) + '</div>' : '')
        + '<div class="message-body">' + escapeHtml(m.body || "") + '</div>'
        + '</div>';
    }).join("");
    return '<div class="messages-section"><div class="messages-heading">Messages</div>' + cards + '</div>';
  }

  var RATING_OPTIONS = [
    { value: "Praise", label: "Praise", cls: "praise" },
    { value: "Neutral", label: "Neutral", cls: "neutral" },
    { value: "Complaint", label: "Complaint", cls: "complaint" }
  ];

  var DEFAULT_FEEDBACK_COMMENT = "A+ buyer! Thanks for your order with The Brick Stud, come back again soon :)";

  // Manual for now — Ryan records which box/mailer he actually used per
  // order so this becomes a real dataset (cross-referenced against each
  // order's pieces/weight/value) to eventually replace with an automatic
  // suggestion. Sizes match his actual boxes: Large 6x4x3, Medium 4x4x2,
  // Small 4x3x2, Mailer ~4x6 (used for small/individual parts).
  var BOX_OPTIONS = [
    { value: "large", label: "Large" },
    { value: "medium", label: "Medium" },
    { value: "small", label: "Small" },
    { value: "mailer", label: "Mailer" }
  ];

  function renderBoxChoiceSection(order) {
    var current = boxChoice[order.orderId] || "";
    var btns = BOX_OPTIONS.map(function (opt) {
      return '<button type="button" class="box-choice-btn' + (current === opt.value ? ' selected' : '') + '" data-box="' + opt.value + '">' + opt.label + '</button>';
    }).join("");
    return ""
      + '<div class="box-choice-section">'
      + '<div class="box-choice-heading">Box used</div>'
      + '<div class="box-choice-row">' + btns + '</div>'
      + '</div>';
  }

  // Not gated by readOnly, same as box choice above — this is bookkeeping,
  // not picking, so it belongs on every order's detail page (old orders
  // reached through Order Lookup, and new ones as they come in through the
  // main list) rather than only where Order Lookup happens to be open.
  // Started as a checkbox; switched to match the status-action-btn
  // style everything else in this row already uses (Mark as packed/
  // shipped/completed, File order, Send Drive Thru), with the
  // button disappearing into a sent-style confirmation line once logged,
  // same as feedback's "Feedback sent — thanks!" — per Ryan's own ask
  // after using the checkbox live. The confirmation line stays tappable
  // to undo, unlike feedback's (which can't be un-sent) — the only way
  // left to fix a wrongly threshold-defaulted older order, now that
  // there's no persistent checkbox to uncheck.
  function renderSpreadsheetLoggedAction(order) {
    if (isOrderLogged(order.orderId)) {
      return '<div class="spreadsheet-logged-msg" id="spreadsheetLoggedMsg" title="Tap to undo">Logged ✓</div>';
    }
    return '<button class="status-action-btn to-logged" id="spreadsheetLoggedBtn">Log in spreadsheet</button>';
  }

  function wireSpreadsheetLoggedAction(order) {
    var btn = document.getElementById("spreadsheetLoggedBtn");
    if (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        spreadsheetLogged[order.orderId] = true;
        pushOrderActions();
        refreshSpreadsheetLoggedAction(order);
      });
    }
    var msg = document.getElementById("spreadsheetLoggedMsg");
    if (msg) {
      msg.addEventListener("click", function (e) {
        e.stopPropagation();
        spreadsheetLogged[order.orderId] = false;
        pushOrderActions();
        refreshSpreadsheetLoggedAction(order);
      });
    }
  }

  function refreshSpreadsheetLoggedAction(order) {
    var row = document.getElementById("spreadsheetLoggedBtn") || document.getElementById("spreadsheetLoggedMsg");
    if (!row) return;
    row.outerHTML = renderSpreadsheetLoggedAction(order);
    wireSpreadsheetLoggedAction(order);
  }

  // Read-only display of the buyer's own feedback, once they've left it —
  // populated from buyerFeedbackCache (see openOrder()'s status-check
  // call), independent of whether Ryan has left his own feedback yet
  // (renderFeedbackSection below is the separate "leave feedback" form/
  // confirmation). Self-gating: returns "" until there's actually
  // something to show, so it's safe to call unconditionally.
  function renderBuyerFeedbackSection(order) {
    var fb = buyerFeedbackCache[order.orderId];
    if (!fb) return "";
    var tone = fb.rating === "Complaint" ? "complaint" : fb.rating === "Neutral" ? "neutral" : "praise";
    return ""
      + '<div class="buyer-feedback-section ' + tone + '">'
      + '<div class="buyer-feedback-heading">Buyer left feedback' + (fb.rating ? ': ' + escapeHtml(fb.rating) : '') + '</div>'
      + (fb.comment ? '<div class="buyer-feedback-comment">' + escapeHtml(fb.comment) + '</div>' : '')
      + (fb.dateRated ? '<div class="buyer-feedback-date">' + escapeHtml(formatDate(fb.dateRated)) + '</div>' : '')
      + '</div>';
  }

  function renderFeedbackSection(order) {
    if (feedbackSent[order.orderId]) {
      return '<div class="feedback-section"><div class="feedback-sent-msg">Feedback sent — thanks!</div></div>';
    }
    var ratingBtns = RATING_OPTIONS.map(function (opt) {
      return '<button type="button" class="rating-btn ' + opt.cls + '" data-rating="' + opt.value + '">' + opt.label + '</button>';
    }).join("");
    return ""
      + '<div class="feedback-section">'
      + '<div class="feedback-heading">Leave feedback for buyer</div>'
      + '<div class="feedback-rating-row">' + ratingBtns + '</div>'
      + '<textarea class="feedback-textarea" id="feedbackComment" maxlength="500">' + escapeHtml(DEFAULT_FEEDBACK_COMMENT) + '</textarea>'
      + '<button class="feedback-submit-btn" id="feedbackSubmitBtn" disabled>Submit feedback</button>'
      + '</div>';
  }

  function wireFeedbackForm(order, items, messages, contact) {
    var section = orderView.querySelector(".feedback-section");
    if (!section || feedbackSent[order.orderId]) return;

    var selectedRating = null;
    var ratingBtns = section.querySelectorAll(".rating-btn");
    var commentEl = section.querySelector("#feedbackComment");
    var submitBtn = section.querySelector("#feedbackSubmitBtn");

    function updateSubmitState() {
      submitBtn.disabled = !selectedRating || !commentEl.value.trim();
    }

    ratingBtns.forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        selectedRating = btn.getAttribute("data-rating");
        ratingBtns.forEach(function (b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        updateSubmitState();
      });
    });

    commentEl.addEventListener("click", function (e) { e.stopPropagation(); });
    commentEl.addEventListener("input", updateSubmitState);

    submitBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var comment = commentEl.value.trim();
      if (!selectedRating || !comment) return;
      if (!window.confirm("Post " + selectedRating + " feedback for order #" + order.orderId + "? This is public and visible to the buyer.")) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      postJSON("/api/feedback", { orderId: order.orderId, rating: selectedRating, comment: comment })
        .then(function () {
          feedbackSent[order.orderId] = true;
          pushOrderActions();
          renderOrderDetail(order, items, messages, contact);
        })
        .catch(function (err) {
          window.alert("Couldn't post feedback: " + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit feedback";
        });
    });
  }

  function handleSendDriveThru(order, items, messages, contact) {
    if (!window.confirm('Send the "Thank You, Drive Thru!" email for order #' + order.orderId + "?")) return;

    var btn = document.getElementById("driveThruBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";

    postJSON("/api/send-drive-thru", { orderId: order.orderId })
      .then(function () {
        driveThruSent[order.orderId] = true;
        pushOrderActions();
        renderOrderDetail(order, items, messages, contact);
      })
      .catch(function (err) {
        window.alert("Couldn't send Drive Thru: " + err.message);
        btn.disabled = false;
        btn.textContent = "Send Drive Thru";
      });
  }

  // Confirmed against a live response: GET /members/{username}/ratings
  // returns { user_name, rating: { PRAISE, NEUTRAL, COMPLAINT } } — counts,
  // not an overall score — e.g. {"PRAISE":1,"NEUTRAL":0,"COMPLAINT":0}.
  function fetchAndShowBuyerRating(username) {
    var badge = document.getElementById("buyerRatingBadge");
    if (!badge || !username) return;

    if (ratingsCache[username]) {
      renderRatingBadge(badge, ratingsCache[username]);
      return;
    }

    fetchJSON("/api/member-rating?username=" + encodeURIComponent(username))
      .then(function (rating) {
        ratingsCache[username] = rating;
        var stillThere = document.getElementById("buyerRatingBadge");
        if (stillThere) renderRatingBadge(stillThere, rating);
      })
      .catch(function () { /* rating just won't show */ });
  }

  function renderRatingBadge(badge, rating) {
    if (!rating || !rating.rating || typeof rating.rating !== "object") return;
    var counts = rating.rating;
    var praise = Number(counts.PRAISE) || 0;
    var neutral = Number(counts.NEUTRAL) || 0;
    var complaint = Number(counts.COMPLAINT) || 0;
    var total = praise + neutral + complaint;
    if (total === 0) return;
    // One decimal place so e.g. 1835/1842 shows as 99.6%, not a
    // misleadingly-rounded 100% when there are some non-praise ratings.
    var pct = Math.round((praise / total) * 1000) / 10;
    badge.textContent = "★ " + total + " (" + pct + "%)";
  }

  function setOrderLoading(order) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '<div class="order-buyer">' + escapeHtml(order.buyer || "") + '</div>'
      + '</div>'
      + '<div class="state-block">Loading items…</div>';
  }

  function setOrderError(order, message) {
    orderView.innerHTML = '<div class="order-summary">'
      + '<div class="order-id mono">Order #' + escapeHtml(order.orderId) + '</div>'
      + '</div>'
      + '<div class="state-block error">' + escapeHtml(message)
      + '<br><button class="retry-btn" id="orderRetryBtn">Try again</button></div>'
      + '<div class="reset-row"><button class="bottom-back-btn" id="bottomBackBtnErr">&#8592; ' + (orderDetailReadOnly ? "Order Lookup" : "All orders") + '</button></div>';
    var retryBtn = document.getElementById("orderRetryBtn");
    // Passing `order` as the fallback unconditionally is harmless when it
    // came from the main list too — openOrder() only falls back to it if
    // the order isn't found in `orders`.
    if (retryBtn) retryBtn.addEventListener("click", function () { openOrder(order.orderId, true, order); });
    var backBtnErr = document.getElementById("bottomBackBtnErr");
    if (backBtnErr) backBtnErr.addEventListener("click", function () { if (orderDetailReadOnly) goToOrderLookup(); else goToOrders(); });
  }

  // fallbackOrder: passed only by openLookupOrder() below, for an order
  // Order Lookup found that isn't in the main (unfiled-only) `orders`
  // array — its presence is also what flips orderDetailReadOnly on, since
  // an order reached this way never goes through the normal PAID→PACKED→
  // SHIPPED pick workflow this app's checkboxes track.
  // Runs every time an order's detail view opens, cached items or not —
  // status can change on BrickLink's side independent of the item list,
  // so this can't be skipped just because itemsCache already has a hit.
  // Only ever adds true (driveThruSent/feedbackAlreadyPosted) or corrects
  // order.status to what BrickLink's own /orders/{id} call reports right
  // now; any failure here just leaves things as they were.
  async function refreshOrderStatusCheck(order) {
    try {
      var statusCheck = await fetchJSON("/api/orders/" + encodeURIComponent(order.orderId) + "/status-check?buyer=" + encodeURIComponent(order.buyer || ""));
      var actionsChanged = false;
      if (statusCheck && statusCheck.driveThruSent && !driveThruSent[order.orderId]) {
        driveThruSent[order.orderId] = true;
        actionsChanged = true;
      }
      if (statusCheck && statusCheck.feedbackAlreadyPosted && !feedbackSent[order.orderId]) {
        feedbackSent[order.orderId] = true;
        actionsChanged = true;
      }
      if (actionsChanged) pushOrderActions();
      buyerFeedbackCache[order.orderId] = (statusCheck && statusCheck.buyerFeedback) || null;
      // Corrects a stale status before it's ever rendered — the main
      // orders list only refreshes on demand (Refresh button), and Order
      // Lookup's statsRows is a once-per-session snapshot (see below), so
      // either can still show e.g. RECEIVED for an order BrickLink (or
      // the buyer) has already moved to COMPLETED since. Rendering the
      // right action button for the real current status heads off a
      // confusing RESOURCE_UPDATE_NOT_ALLOWED / NOT_IN_UPDATABLE_STATUS
      // rejection from attempting a transition that's no longer valid —
      // this is the same `order` object referenced from the orders array
      // for a main-list order, so the correction shows there too once
      // back navigates to it, not just on this detail view.
      if (statusCheck && statusCheck.status && statusCheck.status !== order.status) {
        order.status = statusCheck.status;
      }
      // Same idea, for is_filed — catches an order filed directly on
      // BrickLink (bypassing this app) since Order Lookup's snapshot was
      // taken, or even since this same order was last opened this
      // session, so "File order" doesn't stay offered once it no longer
      // does anything. Only ever flips false -> true here, never true ->
      // false — this app is never the one that would know an order got
      // un-filed (there's no such action anywhere, on BrickLink or here).
      if (statusCheck && statusCheck.filed && !order.filed) {
        order.filed = true;
      }
    } catch (e) { /* ignore — just show whatever's already tracked locally */ }
  }

  async function openOrder(orderId, forceReload, fallbackOrder) {
    var order = orders.filter(function (o) { return o.orderId === orderId; })[0] || fallbackOrder;
    if (!order) return;
    orderDetailReadOnly = !!fallbackOrder;
    lastOpenedOrderId = orderId;

    currentView = "order";
    ordersView.classList.add("hidden");
    orderView.classList.remove("hidden");
    inventoryView.classList.add("hidden");
    orderLookupView.classList.add("hidden");
    backBtn.style.display = "inline-flex";
    backBtnLabel.textContent = "All orders";
    topbarCategoryRow.style.display = "none";
    topbarSubNavRow.style.display = "none";
    if (orderDetailReadOnly) {
      topbarProgressRow.classList.add("hidden");
    } else {
      topbarProgressRow.classList.remove("hidden");
    }
    brandSub.textContent = "Order #" + order.orderId;

    // Make sure picks (and Drive Thru/feedback completion) reflect the
    // durable remote state before showing anything — this is what makes
    // a force-quit not look like a reset. Usually already resolved by
    // the time someone taps in, so this rarely adds a visible delay.
    setOrderLoading(order);
    if (remoteSyncPromise) {
      try { await remoteSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (orderActionsSyncPromise) {
      try { await orderActionsSyncPromise; } catch (e) { /* keep going with local state */ }
    }
    if (currentView !== "order" || order.orderId !== orderId) return;

    if (forceReload) { delete itemsCache[orderId]; delete messagesCache[orderId]; delete contactCache[orderId]; delete buyerFeedbackCache[orderId]; }

    // Best-effort, fire-and-forget — never awaited, so a first-ever load
    // this session (the only time it isn't already cached) never delays
    // the order detail page itself from showing.
    function refreshItemStockCounts() {
      ensureManageInventoryLoaded().then(function () {
        if (currentView !== "order" || order.orderId !== orderId) return;
        patchItemStockCounts(orderView);
      }).catch(function () { /* ignore — lines just stay blank */ });
    }

    // Same best-effort, fire-and-forget shape as refreshItemStockCounts()
    // above — loads the buyer's order history in the background (unless
    // Order Lookup/Stats already warmed it up this session) and patches
    // the "Previous orders" line in place once it lands, rather than
    // making every order open wait on an extra fetch.
    function refreshPreviousOrders() {
      ensureStatsLoaded().then(function () {
        if (currentView !== "order" || order.orderId !== orderId) return;
        refreshPreviousOrdersLine(order);
      }).catch(function () { /* ignore — line just stays hidden */ });
    }

    // Best-effort — only used to split the type summary's "parts" bucket
    // into fig/misc (see isFigPartCategory); a failure here just means
    // that split falls back to the old unsplit "parts" label, not that
    // the order fails to open.
    try { await getCategories(); } catch (e) { /* summary falls back to unsplit "parts" */ }

    var cached = itemsCache[orderId];
    if (cached) {
      await refreshOrderStatusCheck(order);
      if (currentView === "order" && order.orderId === orderId) {
        renderOrderDetail(order, cached, messagesCache[orderId] || [], contactCache[orderId] || null);
        refreshItemStockCounts();
        refreshPreviousOrders();
      }
      return;
    }

    setOrderLoading(order);
    try {
      var colors = await getColors();
      var items = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/items");
      items.forEach(function (item) {
        item.colorName = item.colorId ? (colors[item.colorId] || null) : null;
        item.name = decodeHtmlEntities(item.name);
        item.description = decodeHtmlEntities(item.description);
        item.remarks = decodeHtmlEntities(item.remarks);
      });
      itemsCache[orderId] = items;
      migrateOrderState(orderId, items);

      // Messages are a nice-to-have, not core to picking — a failure here
      // shouldn't block the order view from showing.
      var messages = [];
      try {
        messages = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/messages");
        messages.forEach(function (m) {
          m.subject = decodeHtmlEntities(m.subject);
          m.body = decodeHtmlEntities(m.body);
        });
      } catch (e) { /* ignore — just show the order without messages */ }
      messagesCache[orderId] = messages;

      // Payment method/address/email — also a nice-to-have, not core to
      // picking, so a failure here shouldn't block the order view either.
      var contact = null;
      try {
        contact = await fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/contact");
        contact.name = titleCaseName(decodeHtmlEntities(contact.name));
      } catch (e) { /* ignore — just show the order without the contact block */ }
      contactCache[orderId] = contact;

      await refreshOrderStatusCheck(order);

      if (currentView === "order" && order.orderId === orderId) {
        renderOrderDetail(order, items, messages, contact);
        refreshItemStockCounts();
        refreshPreviousOrders();
      }
    } catch (err) {
      if (currentView === "order" && order.orderId === orderId) {
        setOrderError(order, err.message);
      }
    }
  }

  // ---- Add Inventory (BrickScan CSV import) ----

  // Matches item-image.js's TYPE_LETTERS map, inverted — the single-letter
  // codes BrickScan's export (and BrickLink's own classic upload format)
  // use for ITEMTYPE aren't what the rest of this app works with; every
  // other item shown here (order items, thumbHtml/catalogImageUrl) uses
  // BrickLink's full-word type ("MINIFIG", "PART", ...), confirmed against
  // real order data. Converting up front means thumbHtml can be reused
  // as-is for the review cards.
  var INVENTORY_TYPE_CODE_TO_WORD = {
    P: "PART", S: "SET", M: "MINIFIG", B: "BOOK", G: "GEAR",
    C: "CATALOG", I: "INSTRUCTION", O: "ORIGINAL_BOX", U: "UNSORTED_LOT"
  };
  function inventoryTypeWord(code) {
    return INVENTORY_TYPE_CODE_TO_WORD[(code || "").trim().toUpperCase()] || "PART";
  }

  // Minimal RFC 4180 CSV parser — BrickScan's export quotes any field
  // containing a comma (e.g. item names like "Colonel Ward - Sand Green
  // Jacket, Reddish Brown Legs"), so a naive split(",") would misalign
  // every column after the first quoted field in a row.
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else {
          field += c;
        }
        continue;
      }
      if (c === '"') { inQuotes = true; continue; }
      if (c === ",") { row.push(field); field = ""; continue; }
      if (c === "\r") { continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; continue; }
      field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function csvTextToObjects(text) {
    var rows = parseCSV(text).filter(function (r) { return r.length > 1 || (r.length === 1 && r[0] !== ""); });
    if (!rows.length) return [];
    var headers = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).map(function (r) {
      var obj = {};
      headers.forEach(function (h, idx) { obj[h] = r[idx] !== undefined ? r[idx].trim() : ""; });
      return obj;
    });
  }

  var inventoryRowCounter = 0;

  // Default condition write-up text, seeded into Description below only
  // when BrickScan's REMARKS column comes through blank — never overwrites
  // a condition note Ryan (or BrickScan) already wrote. Still editable
  // afterward on the review card. Remarks itself always ends up blank on
  // import (see csvObjToInventoryRow) — BrickScan's condition notes come
  // through in REMARKS, not DESCRIPTION, so that's where this app reads
  // them from, moving the cleaned-up text into Description instead.
  var DEFAULT_DESCRIPTION_USED = "Typical light playwear, otherwise excellent condition. Fast shipping!";
  var DEFAULT_DESCRIPTION_NEW = "Taken straight out of packaging. Fast shipping!";

  // Light, deterministic cleanup for a BrickScan condition note that came
  // in non-blank — not a full grammar checker, just the handful of things
  // actually worth fixing automatically on short condition write-ups:
  // collapse stray whitespace, capitalize the start of each sentence, make
  // sure it ends in terminal punctuation, then append the standard "Fast
  // shipping!" line (skipped if some form of it is already in there, so
  // re-importing an already-cleaned description doesn't double it up).
  function normalizeImportedDescription(text) {
    var s = (text || "").trim().replace(/\s+/g, " ");
    if (!s) return "";
    s = s.replace(/(^|[.!?]\s+)([a-z])/g, function (m, lead, letter) {
      return lead + letter.toUpperCase();
    });
    if (!/[.!?]$/.test(s)) s += ".";
    if (!/fast shipping/i.test(s)) s += " Fast shipping!";
    return s;
  }

  // Maps one BrickScan CSV row to this app's internal shape. Column names
  // (ITEMTYPE/ITEMID/COLOR/REMARKS/DESCRIPTION/QTY/CONDITION/PRICE) match
  // BrickLink's own classic inventory-upload format exactly — confirmed
  // against a real BrickScan export — plus BrickScan's own extra columns
  // (ITEMNAME/COLORNAME/...) used here only for display, never sent to
  // BrickLink. type/itemNo/colorId/newOrUsed are named to match thumbHtml's
  // and catalogImageUrl's existing field expectations directly. BrickScan
  // puts Ryan's condition notes in REMARKS, so those (not DESCRIPTION) are
  // what get cleaned up and moved into Description; Remarks is left blank
  // either way.
  // Ryan's own shorthand for a minifig's condition in his spreadsheet log
  // — up to two defect codes (in his fixed C/D/F/J/M/Y order), or LN/TLP
  // standing alone. Order here matches how he listed them: singles first,
  // then every two-letter combo he actually uses.
  var FIG_DESIGNATION_OPTIONS = [
    "LN", "TLP", "C", "D", "F", "J", "M", "Y",
    "CD", "CF", "CJ", "CM", "CY", "DF", "DJ", "DM", "DY", "FJ", "FM", "FY", "JM", "JY", "MY",
  ];

  // Best-effort read of the buyer-facing description Ryan writes (or
  // imports from his own BrickScan remarks) for a minifig, guessing which
  // of his designation codes it describes. Only ever called for a Used
  // row — these designations describe wear, so they don't apply to a New
  // fig at all (that just gets the standard "straight out of packaging"
  // description, no code). He only ever logs his top two defects, in the
  // order he considers them most important — so this takes the first two
  // distinct defect keywords in reading order, not just whichever two
  // happen to match, then reassembles them into his fixed C/D/F/J/M/Y
  // order to produce an actual code from his list (e.g. "scratched and
  // cracked" hits D then C by reading order, but the real designation is
  // "CD", not "DC"). LN and TLP never combine with a defect code or with
  // each other — LN (a Used fig that nonetheless looks like new) wins
  // outright on a "mint/like new" mention; with no defect keywords at
  // all, it falls back to TLP, his own stated default for Used. This is
  // a one-time guess at row-creation time, not a live re-suggestion as
  // the Description field is edited afterward.
  function guessFigDesignation(description) {
    var text = (description || "").toLowerCase();
    if (/\bmint\b|like new|pristine|no (visible )?(wear|issues|defects)/.test(text)) return "LN";

    var DEFECT_PATTERNS = [
      ["C", /crack/],
      ["D", /dent|ding|scratch/],
      ["F", /fray|torn/],
      ["M", /\bmarks?\b|print issue|mold issue/],
      ["J", /loose joint|swing wear/],
      ["Y", /yellow|dirty|grime|grimy/],
    ];
    var found = [];
    DEFECT_PATTERNS.forEach(function (pair) {
      var idx = text.search(pair[1]);
      if (idx !== -1) found.push({ code: pair[0], idx: idx });
    });
    if (!found.length) return "TLP";

    found.sort(function (a, b) { return a.idx - b.idx; });
    var codeOrder = ["C", "D", "F", "J", "M", "Y"];
    var top = found.slice(0, 2).map(function (f) { return f.code; });
    top.sort(function (a, b) { return codeOrder.indexOf(a) - codeOrder.indexOf(b); });
    return top.join("");
  }

  function csvObjToInventoryRow(obj) {
    var newOrUsed = (obj.CONDITION || "").trim().toUpperCase() === "U" ? "U" : "N";
    var rawConditionNote = (obj.REMARKS || "").trim();
    var description = rawConditionNote
      ? normalizeImportedDescription(rawConditionNote)
      : (newOrUsed === "U" ? DEFAULT_DESCRIPTION_USED : DEFAULT_DESCRIPTION_NEW);
    var remarks = "";
    return {
      key: "inv-" + (inventoryRowCounter++),
      include: true,
      type: inventoryTypeWord(obj.ITEMTYPE),
      itemNo: obj.ITEMID || "",
      colorId: parseInt(obj.COLOR, 10) || 0,
      colorName: obj.COLORNAME || "",
      name: decodeHtmlEntities(obj.ITEMNAME || ""),
      quantity: parseInt(obj.QTY, 10) || 1,
      newOrUsed: newOrUsed,
      unitPrice: formatPriceInput(obj.PRICE),
      description: description,
      remarks: remarks,
      stockRoomId: "",
      // BrickLink's completeness field — only meaningful for SET rows.
      // Default newly-imported sets to Complete; Ryan can change it in
      // the per-row card before submitting if a set's actually missing
      // pieces or still sealed.
      completeness: inventoryTypeWord(obj.ITEMTYPE) === "SET" ? "C" : "",
      // Ryan's own spreadsheet condition shorthand — minifigs only, and
      // Used only (a New fig just gets the standard description, no
      // designation — see guessFigDesignation). Guessed once here from
      // whatever description this row already has, not recomputed if he
      // edits it after.
      designation: (inventoryTypeWord(obj.ITEMTYPE) === "MINIFIG" && newOrUsed === "U") ? guessFigDesignation(description) : "",
      result: null,
      priceExpanded: false,
      // Set once Ryan's actually touched this row's Price field (see the
      // .inv-input "change" handler in renderInventoryReview) — not an
      // edit-detection flag, just "he looked at this price and moved on,"
      // even if he retyped the same number. Drives the unreviewed-row
      // border and the topbar price-review progress bar below.
      priceReviewed: false,
    };
  }

  // Keyed on item/color/condition. Takes an explicit cond ("N"/"U") rather
  // than reading row.newOrUsed — the panel now always shows both New and
  // Used listings regardless of which condition the row itself is set to,
  // so each row needs two independent cache entries, not one keyed off its
  // own Condition dropdown.
  function priceGuideKey(row, cond) {
    return row.type + ":" + row.itemNo + ":" + (row.colorId || 0) + ":" + cond;
  }

  var priceGuideCache = {};

  // Fetches both New and Used listings for a row — always both, since
  // Ryan wants to compare pricing across conditions regardless of what
  // condition the item's actually being listed as. Shared by Add
  // Inventory and Manage Inventory (the cache is keyed on item/color/
  // condition, not on which page asked, so looking a price up in one
  // page reuses the result in the other too) — `rerender` is whichever
  // page's own render function, since each has to re-render its own view
  // once the fetch lands.
  function fetchPriceGuide(row, rerender) {
    var needsRender = false;
    ["N", "U"].forEach(function (cond) {
      var key = priceGuideKey(row, cond);
      if (priceGuideCache[key]) return; // already loading, loaded, or failed for this combo
      priceGuideCache[key] = { loading: true, data: null, error: null };
      needsRender = true;

      var qs = "type=" + encodeURIComponent(row.type) + "&no=" + encodeURIComponent(row.itemNo)
        + "&condition=" + encodeURIComponent(cond)
        + (row.colorId ? "&color=" + encodeURIComponent(row.colorId) : "");

      fetchJSON("/api/price-guide?" + qs).then(function (data) {
        priceGuideCache[key] = { loading: false, data: data, error: null };
        rerender();
      }).catch(function (err) {
        priceGuideCache[key] = { loading: false, data: null, error: err.message };
        rerender();
      });
    });
    if (needsRender) rerender();
  }

  // Reverses INVENTORY_TYPE_CODE_TO_WORD (already confirmed against a real
  // BrickScan export) to get back BrickLink's single-letter item-type code
  // — cross-confirmed as the right code to use here too, since a real
  // captured catalogitem.page URL for a minifig (sw1528) used "M=sw1528",
  // matching this table's M: "MINIFIG" exactly.
  var INVENTORY_TYPE_WORD_TO_CODE = {};
  Object.keys(INVENTORY_TYPE_CODE_TO_WORD).forEach(function (code) {
    INVENTORY_TYPE_WORD_TO_CODE[INVENTORY_TYPE_CODE_TO_WORD[code]] = code;
  });

  // Deep-links to BrickLink's own catalog page, pre-filtered to this row's
  // color (if any), condition, and US-only listings. The #T=S&...&O={...}
  // fragment is copied verbatim (as a literal template, not re-built with
  // encodeURIComponent) from two real URLs captured live off bricklink.com
  // — its "O" param is oddly encoded (only { } " are percent-escaped; :
  // and , are left raw), so matching it exactly avoids guessing at whether
  // a "cleaner" encoding would still parse the same way. Confirmed shapes:
  //   no color (sw1528, New, US):
  //     ...?M=sw1528#T=S&O={"cond":"N","loc":"US","iconly":0}
  //   with color (3001 in Blue/7, New, US):
  //     ...?P=3001#T=S&C=7&O={"color":"7","cond":"N","loc":"US","iconly":0}
  // Color shows up twice — once as its own C= fragment param, once as a
  // string inside O — so both are included when row.colorId is set. `cond`
  // is optional — omit it (Add Inventory's price-guide panel does, since
  // Ryan wants one combined link rather than a separate New/Used one) to
  // drop the "cond" key from O entirely, which reads as BrickLink's own
  // catalog page does with no condition filter applied: both New and Used
  // together, still US-only.
  function bricklinkCatalogUrl(row, cond) {
    var typeCode = INVENTORY_TYPE_WORD_TO_CODE[row.type] || "P";
    var base = "https://www.bricklink.com/v2/catalog/catalogitem.page?" + typeCode + "=" + encodeURIComponent(row.itemNo);
    var condPart = cond ? "%22cond%22:%22" + cond + "%22," : "";
    if (row.colorId) {
      return base + "#T=S&C=" + row.colorId
        + "&O=%7B%22color%22:%22" + row.colorId + "%22," + condPart + "%22loc%22:%22US%22,%22iconly%22:0%7D";
    }
    return base + "#T=S&O=%7B" + condPart + "%22loc%22:%22US%22,%22iconly%22:0%7D";
  }

  // One condition's stats line (New or Used) — always both fetched,
  // regardless of the row's own Condition dropdown, so Ryan can compare
  // pricing across conditions before deciding how to list an item. Min/
  // Avg/Max/for-sale count are BrickLink's own aggregate across *all* of
  // that condition's listings, not just however many of the merged
  // cheapest-25 end up being this condition below. No per-condition
  // "View on BrickLink" link here anymore — Ryan wants just the one
  // combined link the panel already shows once, not a separate New-only
  // and Used-only link he has no use for.
  function renderPriceGuideStatsLine(row, cond) {
    var label = cond === "U" ? "Used" : "New";
    var state = priceGuideCache[priceGuideKey(row, cond)];
    if (state.error) {
      return '<div class="price-guide-stats error">' + label + ' — Couldn’t load listings: ' + escapeHtml(state.error) + '</div>';
    }
    var data = state.data;
    if (!data.listings.length) {
      return '<div class="price-guide-stats">' + label + ' — No active US listings found.</div>';
    }
    var statsLine = label
      + " · Min " + formatCurrency(data.minPrice, data.currencyCode)
      + " · Avg " + formatCurrency(data.avgPrice, data.currencyCode)
      + " · Max " + formatCurrency(data.maxPrice, data.currencyCode)
      + " · " + data.totalQuantity + " for sale";
    return '<div class="price-guide-stats">' + escapeHtml(statsLine) + '</div>';
  }

  // Both conditions, US-only (bricklinkCatalogUrl with no cond arg) — one
  // link covering what used to be a separate New-only and Used-only link.
  // Lives in the header row above the (collapsible) panel now, not inside
  // it, so it's reachable without expanding "See active US listings" —
  // Ryan asked for it moved up, the two side by side.
  function viewOnBricklinkLinkHtml(row) {
    return '<a class="price-guide-view-link" href="' + escapeHtml(bricklinkCatalogUrl(row)) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View on BrickLink ↗</a>';
  }

  // Both conditions' listings merged, cheapest-first, capped at 25 — the
  // same list the price-guide panel renders as rows, and what the Set/Fig
  // Lookup row's own "rough cost" line (setFigLookupAvgCostHtml) averages.
  // Pulled out as its own function so both read one definition of "the
  // cheapest listings" rather than risking two slightly different copies.
  // Returns null until both New and Used have finished loading (never
  // computed off just one still-incomplete condition) — the panel shows
  // its own "Loading…" placeholder on null; the row's cost line shows
  // nothing at all rather than a loading flicker on every card.
  function cheapestListings(row) {
    var stateN = priceGuideCache[priceGuideKey(row, "N")];
    var stateU = priceGuideCache[priceGuideKey(row, "U")];
    if (!stateN || !stateU || stateN.loading || stateU.loading) return null;
    var combined = [];
    ["N", "U"].forEach(function (cond) {
      var state = cond === "N" ? stateN : stateU;
      if (state.error || !state.data) return;
      state.data.listings.forEach(function (l) {
        combined.push({
          cond: cond,
          quantity: l.quantity,
          unitPrice: l.unitPrice,
          shippingAvailable: l.shippingAvailable,
          currencyCode: state.data.currencyCode,
        });
      });
    });
    combined.sort(function (a, b) { return Number(a.unitPrice) - Number(b.unitPrice); });
    return combined.slice(0, 25);
  }

  // New and Used used to render as two full, independently-scrolled lists
  // of up to 25 listings each (each with its own "View on BrickLink" link)
  // — a lot of scrolling on a phone, and two links to a page Ryan only
  // ever wants filtered to US anyway, condition included or not. Merged
  // into one list, cheapest-first across both conditions combined and
  // capped at 25 total, with each row tagged New/Used next to its price
  // instead of condition being implied by which list it's in.
  // readOnly skips the "Tap a listing to use its price" hint — true for
  // Set/Fig Lookup, which has no editable price/Condition field for a tap
  // to fill in, same panel otherwise (stats lines, listing rows, collapse).
  function renderPriceGuidePanel(row, readOnly) {
    if (!row.priceExpanded) return "";
    var combined = cheapestListings(row);
    if (combined === null) {
      return '<div class="price-guide-panel">Loading active US listings…</div>';
    }

    var rows = combined.map(function (l, idx) {
      var condLabel = l.cond === "U" ? "Used" : "New";
      var condClass = l.cond === "U" ? "used" : "new";
      return '<div class="price-guide-row" data-key="' + escapeHtml(row.key) + '" data-price="' + escapeHtml(l.unitPrice) + '" data-condition="' + l.cond + '">'
        + '<span class="price-guide-rank">' + (idx + 1) + '</span>'
        + '<span class="price-guide-cond ' + condClass + '">' + condLabel + '</span>'
        + '<span class="price-guide-qty">×' + l.quantity + '</span>'
        + '<span class="price-guide-price mono">' + escapeHtml(formatCurrency(l.unitPrice, l.currencyCode)) + '</span>'
        + (l.shippingAvailable ? '' : '<span class="price-guide-noship">no ship</span>')
        + '</div>';
    }).join("");

    return '<div class="price-guide-panel">'
      + renderPriceGuideStatsLine(row, "N")
      + renderPriceGuideStatsLine(row, "U")
      + (combined.length ? (readOnly ? '' : '<div class="price-guide-hint">Tap a listing to use its price (also sets Condition)</div>') + rows : '')
      + '<button type="button" class="price-guide-collapse-btn" data-key="' + escapeHtml(row.key) + '">▴ Collapse</button>'
      + '</div>';
  }

  // null = show the upload screen; an array (even empty after filtering)
  // = show the review screen. Persists across navigating away and back
  // (not cleared until "Start over"), same reasoning as itemsCache.
  var inventoryRows = null;
  var inventorySubmitting = false;

  // Manual add-by-number state — same shape/lifetime as the Wanted List's
  // own inventoryManualDraft (wantedManualDraft), down to the lookup-
  // sequence guard; see wireInventoryManualAdd below for why the two
  // aren't just one shared implementation despite the overlap.
  var inventoryManualDraft = null;
  var inventoryManualLookupSeq = 0;

  function renderInventoryView() {
    if (!inventoryRows) {
      renderInventoryUpload(null);
    } else {
      renderInventoryReview();
    }
  }

  // Read-only name preview + Type/Color/Qty fields, same shape and the
  // same "Confirm disabled while nameLoading" guard as the Wanted List's
  // wantedManualAddHtml — but a kept-separate implementation rather than a
  // shared one: confirming here builds a full inventory row via
  // csvObjToInventoryRow (Condition/Description/Remarks/Stock Room and
  // all), not a wanted-list bank entry, and reads the page's global
  // colorsMap directly (warmed lazily on first use below) rather than
  // taking it as a parameter the way the already-colors-gated Wanted List
  // page does.
  function inventoryManualAddHtml() {
    var draft = inventoryManualDraft;
    var html = '<div class="wanted-manual-add">'
      + '<div class="wanted-manual-itemno-row">'
      + '<input type="text" class="wanted-manual-itemno-input" id="inventoryManualItemNoInput" placeholder="Add a part/set/fig by number" value="' + escapeHtml(draft ? draft.itemNo : "") + '">'
      + '<button type="button" class="reset-btn" id="inventoryManualAddBtn">Add</button>'
      + '</div>';
    if (draft) {
      var namePreviewText = draft.nameLoading ? "Looking up name…" : (draft.name || "Name not found — will add without one");
      html += '<div class="inventory-fields wanted-manual-fields">'
        + '<div class="inventory-field"><label>Type</label><select id="inventoryManualTypeSelect">'
        + MANUAL_ADD_TYPE_OPTIONS.map(function (opt) {
            return '<option value="' + opt[0] + '"' + (draft.type === opt[0] ? ' selected' : '') + '>' + opt[1] + '</option>';
          }).join("")
        + '</select></div>'
        + '<div class="inventory-field"><label>Color</label><select id="inventoryManualColorInput">' + manualAddColorOptionsHtml(colorsMap, draft.colorId) + '</select></div>'
        + '<div class="inventory-field"><label>Qty</label><input type="number" min="1" id="inventoryManualQtyInput" value="' + draft.quantity + '"></div>'
        // Picked here (rather than left at csvObjToInventoryRow's "N"
        // default) so the row's auto-filled Description text — New vs.
        // Used wording — is right from the moment it lands in the review
        // list, not something Ryan has to notice and fix per-row after.
        + '<div class="inventory-field"><label>Condition</label><select id="inventoryManualConditionSelect">'
        + '<option value="N"' + (draft.condition === "N" ? ' selected' : '') + '>New</option>'
        + '<option value="U"' + (draft.condition === "U" ? ' selected' : '') + '>Used</option>'
        + '</select></div>'
        + (draft.type === "SET"
          ? '<div class="inventory-field"><label>Sub-Condition</label><select id="inventoryManualCompletenessSelect">'
            + '<option value="C"' + (draft.completeness === "C" ? ' selected' : '') + '>Complete</option>'
            + '<option value="B"' + (draft.completeness === "B" ? ' selected' : '') + '>Incomplete</option>'
            + '<option value="S"' + (draft.completeness === "S" ? ' selected' : '') + '>Sealed</option>'
            + '</select></div>'
          : '')
        + '</div>'
        + '<div class="item-name wanted-manual-name-preview">' + escapeHtml(namePreviewText) + '</div>'
        + '<div class="wanted-manual-actions">'
        + '<button type="button" class="reset-btn" id="inventoryManualConfirmBtn"' + (draft.nameLoading ? ' disabled' : '') + '>+ Add to review list</button>'
        + '<button type="button" class="reset-btn" id="inventoryManualCancelBtn">Cancel</button>'
        + '</div>';
    }
    return html + '</div>';
  }

  // Mirrors lookupManualItemName (Wanted List) exactly, including the
  // sequence-id guard against a slow/stale response landing after Ryan's
  // changed or typed over the item number — see that function's own
  // comment for the full reasoning.
  function lookupInventoryManualItemName(itemNo, type) {
    var requestId = ++inventoryManualLookupSeq;
    if (inventoryManualDraft) {
      inventoryManualDraft.nameLoading = true;
      renderInventoryView();
    }
    fetchJSON("/api/item-lookup?type=" + encodeURIComponent(type) + "&no=" + encodeURIComponent(itemNo))
      .then(function (data) {
        if (requestId !== inventoryManualLookupSeq || !inventoryManualDraft) return;
        inventoryManualDraft.name = (data && data.item && data.item.name) || "";
        inventoryManualDraft.nameLoading = false;
        renderInventoryView();
      })
      .catch(function () {
        if (requestId !== inventoryManualLookupSeq || !inventoryManualDraft) return;
        inventoryManualDraft.nameLoading = false;
        renderInventoryView();
      });
  }

  // Wired after every render of either Add Inventory screen (upload or
  // review — both show the manual-add form) since the form's own DOM gets
  // rebuilt each time, same pattern as wireWantedBankImport.
  function wireInventoryManualAdd() {
    var itemNoInput = document.getElementById("inventoryManualItemNoInput");
    var addBtn = document.getElementById("inventoryManualAddBtn");
    if (itemNoInput && addBtn) {
      var startOrSyncDraft = function () {
        var itemNo = itemNoInput.value.trim();
        if (!itemNo) return;
        var typeSelect = document.getElementById("inventoryManualTypeSelect");
        var colorInput = document.getElementById("inventoryManualColorInput");
        var qtyInput = document.getElementById("inventoryManualQtyInput");
        var conditionSelect = document.getElementById("inventoryManualConditionSelect");
        var completenessSelect = document.getElementById("inventoryManualCompletenessSelect");
        var prevItemNo = inventoryManualDraft && inventoryManualDraft.itemNo;
        var prevType = inventoryManualDraft && inventoryManualDraft.type;
        var type = typeSelect ? typeSelect.value : (prevType || guessManualAddType(itemNo, "PART"));
        inventoryManualDraft = {
          itemNo: itemNo,
          type: type,
          colorId: colorInput ? (parseInt(colorInput.value, 10) || 0) : ((inventoryManualDraft && inventoryManualDraft.colorId) || 0),
          quantity: qtyInput ? Math.max(1, parseInt(qtyInput.value, 10) || 1) : ((inventoryManualDraft && inventoryManualDraft.quantity) || 1),
          name: (inventoryManualDraft && inventoryManualDraft.name) || "",
          condition: conditionSelect ? conditionSelect.value : ((inventoryManualDraft && inventoryManualDraft.condition) || "N"),
          completeness: completenessSelect ? completenessSelect.value : ((inventoryManualDraft && inventoryManualDraft.completeness) || "C"),
        };
        renderInventoryView();
        if (itemNo !== prevItemNo || type !== prevType) lookupInventoryManualItemName(itemNo, type);
        // Colors are only ever needed once this form actually expands, so
        // they're warmed here rather than blocking the whole Add Inventory
        // page (which doesn't otherwise need them — a CSV import already
        // carries its own COLORNAME column) on every visit.
        if (!colorsMap) {
          getColors().then(function () {
            if (inventoryManualDraft) renderInventoryView();
          }).catch(function () { /* color dropdown just stays "No color" only — not fatal */ });
        }
      };
      addBtn.addEventListener("click", startOrSyncDraft);
      itemNoInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); startOrSyncDraft(); }
      });
    }

    var typeSelect = document.getElementById("inventoryManualTypeSelect");
    if (typeSelect) {
      typeSelect.addEventListener("change", function () {
        if (!inventoryManualDraft) return;
        inventoryManualDraft.type = typeSelect.value;
        lookupInventoryManualItemName(inventoryManualDraft.itemNo, inventoryManualDraft.type);
      });
    }

    var confirmBtn = document.getElementById("inventoryManualConfirmBtn");
    if (confirmBtn) {
      confirmBtn.addEventListener("click", function () {
        if (!inventoryManualDraft || inventoryManualDraft.nameLoading) return;
        var itemNo = document.getElementById("inventoryManualItemNoInput").value.trim();
        if (!itemNo) return;
        var typeSelect2 = document.getElementById("inventoryManualTypeSelect");
        var colorInput = document.getElementById("inventoryManualColorInput");
        var qtyInput = document.getElementById("inventoryManualQtyInput");
        var conditionSelect2 = document.getElementById("inventoryManualConditionSelect");
        var completenessSelect2 = document.getElementById("inventoryManualCompletenessSelect");
        var colorId = parseInt(colorInput.value, 10) || 0;
        // Builds the exact same shape a CSV row would (same function, same
        // defaults) — a blank REMARKS/DESCRIPTION/PRICE so the Condition-
        // based default description and blank price/remarks apply exactly
        // as they would for a CSV row that came in with those columns
        // empty, rather than re-deriving a second copy of that logic here.
        var row = csvObjToInventoryRow({
          ITEMTYPE: INVENTORY_TYPE_WORD_TO_CODE[typeSelect2.value] || "P",
          ITEMID: itemNo,
          COLOR: String(colorId),
          COLORNAME: (colorsMap && colorsMap[colorId]) || "",
          ITEMNAME: inventoryManualDraft.name || "",
          QTY: qtyInput.value,
          CONDITION: conditionSelect2 ? conditionSelect2.value : "N",
          PRICE: "",
          REMARKS: "",
          DESCRIPTION: "",
        });
        // csvObjToInventoryRow defaults a SET row's completeness to "C" —
        // override it here with whatever Ryan actually picked in the
        // Sub-Condition field.
        if (typeSelect2.value === "SET" && completenessSelect2) row.completeness = completenessSelect2.value;
        if (!inventoryRows) inventoryRows = [];
        inventoryRows.unshift(row);
        inventoryManualDraft = null;
        renderInventoryView();
        // Same best-effort stock-count warm-up a CSV import triggers.
        ensureManageInventoryLoaded().then(function () {
          if (currentView === "inventory") patchItemStockCounts(inventoryView);
        }).catch(function () { /* ignore — lines just stay blank */ });
      });
    }

    var cancelBtn = document.getElementById("inventoryManualCancelBtn");
    if (cancelBtn) {
      cancelBtn.addEventListener("click", function () {
        inventoryManualDraft = null;
        renderInventoryView();
      });
    }
  }

  function renderInventoryUpload(errorMessage) {
    // Nothing to submit (or review) yet at this step (also covers "Start
    // over", which returns here without a setTopbarNav call to hide these
    // for us).
    topbarInventorySubmitRow.classList.add("hidden");
    topbarProgressRow.classList.add("hidden");
    inventoryView.innerHTML = ""
      + '<div class="inventory-intro">Upload a BrickScan CSV export to review items before adding them to your BrickLink inventory. Nothing is sent to BrickLink until you approve it on the next screen.</div>'
      + '<div class="inventory-upload">'
      + '<input type="file" accept=".csv,text/csv" class="inventory-file-input" id="inventoryFileInput">'
      + '</div>'
      + (errorMessage ? '<div class="state-block error">' + escapeHtml(errorMessage) + '</div>' : '')
      + inventoryManualAddHtml();
    document.getElementById("inventoryFileInput").addEventListener("change", handleInventoryFileChange);
    wireInventoryManualAdd();
  }

  function handleInventoryFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    file.text().then(function (text) {
      var objs = csvTextToObjects(text);
      if (!objs.length) { renderInventoryUpload("No rows found in that file."); return; }
      inventoryRows = objs.map(csvObjToInventoryRow);
      renderInventoryView();
      // Best-effort, fire-and-forget, same reasoning as openOrder()'s own
      // call — never delays the review screen itself. A later re-render
      // from editing a field doesn't need this again: manageInventoryRows
      // is warm by then, so itemStockCountHtml() renders real counts
      // synchronously from that point on.
      ensureManageInventoryLoaded().then(function () {
        if (currentView === "inventory") patchItemStockCounts(inventoryView);
      }).catch(function () { /* ignore — lines just stay blank */ });
    }).catch(function (err) {
      renderInventoryUpload("Couldn't read that file: " + err.message);
    });
  }

  function computeInventoryTotal() {
    return inventoryRows.filter(function (r) { return r.include; }).reduce(function (sum, r) {
      var price = parseFloat(r.unitPrice);
      var qty = parseInt(r.quantity, 10);
      if (isNaN(price) || isNaN(qty)) return sum;
      return sum + price * qty;
    }, 0);
  }

  function inventorySummaryText() {
    var includedCount = inventoryRows.filter(function (r) { return r.include; }).length;
    return includedCount + " of " + inventoryRows.length + " selected";
  }

  function inventoryTotalText() {
    return formatCurrency(computeInventoryTotal(), "USD");
  }

  // BrickLink's own distinction: each row here is one "lot" (one inventory
  // listing), which can itself hold more than one physical piece via its
  // Qty field — a batch of 18 lots where one is Qty 2 is 19 pieces, not 18.
  // Calling that "18 items" was wrong, not just imprecise — Ryan's actually
  // counting individual pieces when he thinks "items," and the two numbers
  // silently diverging is exactly the kind of thing that gets a multi-piece
  // lot under-logged. Pulled out as its own function (rather than inline in
  // renderInventoryReview) so the quantity-field "change" handler below can
  // recompute just the label text after an inline edit, the same way it
  // already recomputes the running total, without a full re-render that'd
  // drop focus mid-edit.
  function computeInventorySubmitLabel() {
    var includedCount = inventoryRows.filter(function (r) { return r.include; }).length;
    var pendingRows = inventoryRows.filter(function (r) { return r.include && !(r.result && r.result.success); });
    var pendingCount = pendingRows.length;
    var pendingPieceCount = pendingRows.reduce(function (sum, r) { return sum + (parseInt(r.quantity, 10) || 0); }, 0);
    var label;
    if (inventorySubmitting) {
      label = "Submitting…";
    } else if (includedCount === 0) {
      label = "Nothing selected";
    } else if (pendingCount === 0) {
      label = "All items added";
    } else if (pendingPieceCount === pendingCount) {
      // Every pending lot is Qty 1 — lots and pieces are the same number,
      // so the simple phrasing says exactly as much as it ever did.
      label = "Submit " + pendingCount + " item" + (pendingCount === 1 ? "" : "s") + " to BrickLink";
    } else {
      label = "Submit " + pendingCount + " lot" + (pendingCount === 1 ? "" : "s")
        + " (" + pendingPieceCount + " item" + (pendingPieceCount === 1 ? "" : "s") + ") to BrickLink";
    }
    return { label: label, pendingCount: pendingCount };
  }

  // Re-reads the submit label/disabled-state into the submit button and its
  // sticky-topbar mirror without rebuilding the row list — used after an
  // inline Qty edit (see the .inv-input "change" handler), same reasoning
  // the running-total patch right below it already has.
  function patchInventorySubmitChrome() {
    var result = computeInventorySubmitLabel();
    var btn = document.getElementById("inventorySubmitBtn");
    var disabled = result.pendingCount === 0 || inventorySubmitting;
    if (btn) { btn.textContent = result.label; btn.disabled = disabled; }
    topbarInventorySubmitBtn.textContent = result.label;
    topbarInventorySubmitBtn.disabled = disabled;
  }

  // Same pending set the submit label counts (included, not already
  // successfully submitted) — "reviewed" means Ryan's touched that row's
  // Price field at least once (see .inv-input "change" handler below,
  // which sets row.priceReviewed and clears its .needs-review border).
  // Point of this, on a long list: a clean way to confirm every item
  // that's about to go live has actually had its price looked at, not
  // just whatever BrickScan guessed, before hitting Submit.
  function computeInventoryReviewProgress() {
    var pendingRows = inventoryRows.filter(function (r) { return r.include && !(r.result && r.result.success); });
    var reviewed = pendingRows.filter(function (r) { return r.priceReviewed; }).length;
    return { reviewed: reviewed, total: pendingRows.length };
  }

  // Reuses the same sticky-topbar progress bar the order-detail page's
  // pick-progress already shows (hidden here otherwise) — shown only while
  // there's something pending to review, same as the submit row below it.
  function patchInventoryReviewProgress() {
    var progress = computeInventoryReviewProgress();
    if (progress.total === 0) {
      topbarProgressRow.classList.add("hidden");
      return;
    }
    var pct = Math.round((progress.reviewed / progress.total) * 100);
    var done = progress.reviewed >= progress.total;
    topbarProgressRow.classList.remove("hidden");
    topbarProgressFill.style.width = pct + "%";
    topbarProgressFill.classList.toggle("done", done);
    topbarProgressLabel.textContent = progress.reviewed + "/" + progress.total + " priced";
  }

  // ---- Fig inventory log email ----
  // Adding from his phone, Ryan has no easy way to log what he just put
  // into inventory in his own spreadsheet — and explicitly doesn't want
  // a persistent "logged" checkbox like Orders has, just a quick way to
  // get the data itself. Minifigs only, since that's the one type he's
  // asked to track this way; a plain mailto: (same pattern as the Wanted
  // List's own "Email list") rather than a real backend send, so there's
  // no email API/secrets to wire up — the body's small enough to fit a
  // mailto: link's practical length limit. Only rows that actually went
  // live count (row.result.success) — a failed add was never really
  // entered, so it has nothing to log yet.
  function addInventoryFigLogRows() {
    return (inventoryRows || []).filter(function (r) { return r.type === "MINIFIG" && r.result && r.result.success; });
  }

  function addInventoryFigLogEmailHref() {
    var rows = addInventoryFigLogRows();
    if (!rows.length) return "";
    var dateStr = new Date().toLocaleDateString();
    // A real table needs an HTML email (a whole different send path — no
    // mailto: body is ever more than plain text), and plain-text column
    // alignment isn't reliable either, since most mail apps render a
    // mailto: body in a proportional font, not monospace. A bulleted,
    // one-item-per-block layout is the readable ceiling for mailto: —
    // each bullet gets its own blank-line-separated block instead of
    // being crammed onto one line.
    var lines = rows.map(function (r) {
      // Designation doesn't apply to a New fig at all (see
      // guessFigDesignation) — leave it off that line entirely rather
      // than printing a misleading TLP/blank.
      var designationPart = r.newOrUsed === "U" ? ("   Designation: " + (r.designation || "TLP")) : "";
      return "• " + r.itemNo + " — " + (r.name || "(name unknown)")
        + "\n  Price: $" + r.unitPrice + "   Qty: " + r.quantity + designationPart
        + "\n  Description: " + (r.description || "(none)");
    });
    var subject = "Fig inventory log - " + dateStr + " (" + rows.length + ")";
    var body = lines.join("\n\n") + "\n\nDate entered: " + dateStr;
    return "mailto:thabrickstud@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + mailtoBody(body);
  }

  function figLogBannerHtml() {
    var rows = addInventoryFigLogRows();
    if (!rows.length) return "";
    return '<div class="fig-log-banner">'
      + '<span>' + rows.length + ' fig' + (rows.length === 1 ? '' : 's') + ' added this session</span>'
      + '<a class="reset-btn wanted-bank-email-link" href="' + escapeHtml(addInventoryFigLogEmailHref()) + '">Email fig log</a>'
      + '</div>';
  }

  function renderInventoryReview() {
    // Every row's Color field is now a name dropdown (see below), not just
    // the manual-add draft's — so this view needs colorsMap warmed too,
    // not only the draft form. Lazy: don't block the page on it, just
    // re-render once real names land (rows render fine off "No color"
    // in the meantime).
    if (!colorsMap) {
      getColors().then(function () {
        if (currentView === "inventory" && inventoryRows) renderInventoryReview();
      }).catch(function () { /* dropdowns just stay "No color" only — not fatal */ });
    }
    var includedCount = inventoryRows.filter(function (r) { return r.include; }).length;
    var pendingCount = inventoryRows.filter(function (r) { return r.include && !(r.result && r.result.success); }).length;

    var cards = inventoryRows.map(function (row) {
      var locked = !!(row.result && row.result.success);
      var resultHtml = "";
      if (row.result) {
        resultHtml = row.result.success
          ? '<div class="inventory-row-result success">Added to inventory (ID ' + escapeHtml(row.result.inventoryId) + ')</div>'
          : '<div class="inventory-row-result error">' + escapeHtml(row.result.error) + '</div>';
      }
      // Same "poka-yoke" bigger/bolder badge the Order pick-list already
      // gives a >1-qty lot (see .qty-chip.multi) — here so a 2-or-more lot
      // doesn't quietly scroll by and end up only partly logged.
      var isMulti = parseInt(row.quantity, 10) > 1;
      var needsReview = row.include && !locked && !row.priceReviewed;
      return ""
        + '<div class="item-row inventory-row' + (!row.include ? ' skipped' : '') + (locked ? ' result-success' : '') + (needsReview ? ' needs-review' : '') + '" data-key="' + escapeHtml(row.key) + '">'
        + '<input type="checkbox" class="inventory-row-check" data-key="' + escapeHtml(row.key) + '"' + (row.include ? ' checked' : '') + (locked ? ' disabled' : '') + '>'
