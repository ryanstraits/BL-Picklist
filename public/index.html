  // A fig with several copies has a checkmark per copy: tapping the nth one
  // fills the row up to n, or — if it was already filled — empties it down
  // to n-1. Only that fig row and the card's numbers are redrawn.
  function handleSortFigCheck(btn) {
    var card = btn.closest(".sort-card");
    var e = card && sortFindEntry(card.getAttribute("data-id"));
    var fig = e && (e.figs || []).filter(function (f) { return f.itemNo === btn.getAttribute("data-fig"); })[0];
    if (!fig) return;
    var n = parseInt(btn.getAttribute("data-i"), 10);
    fig.have = n <= (fig.have || 0) ? n - 1 : n;
    var row = btn.closest(".sort-fig-row");
    row.querySelectorAll(".sort-check").forEach(function (b, i) { b.classList.toggle("on", i < fig.have); });
    row.classList.toggle("sort-fig-all", fig.have >= (fig.qty || 1));
    saveSortList();
    patchSortCard(e.id);
  }

  function handleSortAdd() {
    var input = document.getElementById("sortAddInput");
    if (!input || !input.value.trim()) return;
    var raw = input.value;
    input.value = "";
    addToSortList(raw).catch(function (err) {
      window.alert("Couldn’t add it: " + err.message);
    });
  }

  // One set of delegated listeners on the (permanent) view element, so
  // re-rendering the list never needs re-wiring.
  function wireSortListView() {
    sortListView.addEventListener("click", function (ev) {
      var t = ev.target.closest("button");
      if (!t) return;
      if (t.id === "sortAddBtn") { handleSortAdd(); return; }
      if (t.id === "sortRefreshAllBtn") { refreshAllSortPrices(); return; }
      if (t.id === "sortBuyWantedBtn") { handleSortBuyWanted(); return; }
      if (t.id === "sortMoveBtn") { handleSortMoveToStock(); return; }
      if (t.id === "sortToInventoryBtn") { handleSortToInventory(); return; }
      if (t.id === "sortRetryBtn") { sortLoadError = null; renderSortView(); return; }
      if (t.classList.contains("sort-check")) { handleSortFigCheck(t); return; }
      var act = t.getAttribute("data-act");
      if (!act) return;
      if (act === "figinv") {
        // Open this fig in Manage Inventory, with a button there to come back.
        sortReturnScrollY = window.scrollY;
        manageInventorySearchQuery = t.getAttribute("data-fig") || "";
        manageInventoryCameFromSetFigLookup = false;
        manageInventoryCameFromSort = true;
        goToManageInventory();
        return;
      }
      var e = sortFindEntry(t.getAttribute("data-id"));
      if (!e) return;
      if (act === "lookup") {
        // Open this set in Lookup, with a button there to come back here.
        setFigLookupType = "SET";
        setFigLookupQuery = e.setNo;
        setFigLookupNavStack = [];
        setFigLookupCameFromSort = true;
        runSetFigLookup();
        goToSetFigLookup();
        return;
      }
      if (act === "toggle") {
        if (sortExpanded[e.id]) flushSortList(); // Save: write immediately, then close the card
        sortExpanded[e.id] = !sortExpanded[e.id];
        renderSortList();
        if (sortExpanded[e.id] && !manageInventoryRows) refreshSortFigStock();
      } else if (act === "remove") {
        if (!window.confirm("Remove " + (sortIdComplete(e) ? sortEntryId(e) : e.setNo) + (e.name ? " " + e.name : "") + " from your sort list?")) return;
        sortList = sortList.filter(function (x) { return x.id !== e.id; });
        delete sortExpanded[e.id];
        saveSortList();
        renderSortList();
      }
    });
    sortListView.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && ev.target.id === "sortAddInput") { ev.preventDefault(); handleSortAdd(); }
    });
    sortListView.addEventListener("change", function (ev) {
      var el = ev.target;
      if (el.id === "sortRankSelect") { sortRankKey = el.value; renderSortList(); return; }
      if (el.id === "sortStockRoomSelect") { sortStockRoom = el.value; return; }
      var setting = el.getAttribute("data-setting");
      if (setting) {
        var n = parseFloat(el.value);
        sortSettings[setting] = isNaN(n) || n < 0 ? SORT_DEFAULTS[setting] : n;
        el.value = sortSettings[setting];
        saveSortSettings();
        sortList.forEach(function (x) { patchSortCard(x.id); });
        return;
      }
      var card = el.closest(".sort-card");
      var e = card && sortFindEntry(card.getAttribute("data-id"));
      if (!e) return;
      var field = el.getAttribute("data-sortf");
      if (field) {
        if (field === "paid") {
          e.paid = el.value === "" ? null : Math.max(0, sortNum(el.value));
        } else if (field === "copyNo") {
          e.copyNo = el.value === "" ? null : Math.max(1, Math.round(sortNum(el.value)));
          el.value = e.copyNo === null ? "" : e.copyNo;
        } else if (field === "theme") {
          e.theme = el.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 2);
          e.themeAuto = false; // a hand-picked code is never overwritten by the category guess
          el.value = e.theme;
        } else if (field === "decision") {
          e.decision = el.value === "set" || el.value === "part" || el.value === "hold" || el.value === "keep" ? el.value : "";
        } else if (field === "completeness") {
          e.completeness = sortClamp(Math.round(sortNum(el.value)), 0, 100);
        } else {
          e[field] = sortClamp(Math.round(sortNum(el.value)), 0, 10);
        }
        if (field !== "paid" && field !== "copyNo" && field !== "theme" && field !== "decision") el.value = e[field];
      } else if (el.getAttribute("data-figf")) {
        var fig = (e.figs || []).filter(function (f) { return f.itemNo === el.getAttribute("data-fig"); })[0];
        if (!fig) return;
        if (el.getAttribute("data-figf") === "buyCost") {
          var cost = parseFloat(el.value);
          fig.buyCost = cost > 0 ? Math.round(cost * 100) / 100 : null;
          el.value = fig.buyCost === null ? "" : fig.buyCost;
        } else {
          fig.cond = el.value;
        }
      } else {
        return;
      }
      saveSortList();
      // An ID change can create or clear a clash on a different card too.
      if (field === "copyNo" || field === "theme") sortList.forEach(function (x) { patchSortCard(x.id); });
      else patchSortCard(e.id);
    });
  }

    backBtn.style.display = "none";
    setTopbarNav("inventory");
    refreshBtn.style.display = "none";
    brandSub.textContent = "Wanted List";
    renderWantedListView();
  }

  function goToSortList() {
    currentView = "sort-list";
    ordersView.classList.add("hidden");
    orderView.classList.add("hidden");
    inventoryView.classList.add("hidden");
    labelPrepView.classList.add("hidden");
    manageInventoryView.classList.add("hidden");
    statsView.classList.add("hidden");
    orderLookupView.classList.add("hidden");
    setFigLookupView.classList.add("hidden");
    wantedListView.classList.add("hidden");
    sortListView.classList.remove("hidden");
    backBtn.style.display = "none";
    setTopbarNav("inventory");
    refreshBtn.style.display = "none";
    brandSub.textContent = "Sort List";
    renderSortView();
  }

  backBtn.addEventListener("click", function () {
    if (currentView === "order" && orderDetailReadOnly) goToOrderLookup();
    else if (currentView === "manage-inventory" && manageInventoryCameFromSort) {
      manageInventoryCameFromSort = false;
      goToSortList();
      restoreScrollPosition(sortReturnScrollY);
    } else if (currentView === "manage-inventory" && manageInventoryCameFromSetFigLookup) {
      manageInventoryCameFromSetFigLookup = false;
      goToSetFigLookup();
    } else goToOrders();
  });
  orderListBtn.addEventListener("click", goToOrders);
  orderLookupBtn.addEventListener("click", goToOrderLookup);
  labelPrepBtn.addEventListener("click", goToLabelPrep);
  // A direct tap on the Manage Inventory nav button (rather than the
  // jump link from Set/Fig Lookup) means Ryan isn't mid-lookup — don't
  // leave a stale back-to-lookup button showing from an earlier jump.
  function goToManageInventoryFresh() {
    manageInventoryCameFromSetFigLookup = false;
    manageInventoryCameFromSort = false;
    goToManageInventory();
  }
  manageInventoryBtn.addEventListener("click", goToManageInventoryFresh);
  setFigLookupBtn.addEventListener("click", function () {
    setFigLookupCameFromSort = false; // a direct tap on the tab is a fresh visit, not "from Sort"
    goToSetFigLookup();
  });
  wantedListBtn.addEventListener("click", goToWantedList);
  sortListBtn.addEventListener("click", goToSortList);
  wireSortListView();
  addInventoryBtn.addEventListener("click", goToInventory);
  // Wired once here rather than per-render like the in-page submit
  // buttons — these topbar mirrors are static DOM nodes that live inside
  // <header>, never rebuilt by innerHTML, so a listener attached once
  // never needs re-attaching (and re-attaching on every render would
  // stack duplicate listeners).
  topbarInventorySubmitBtn.addEventListener("click", handleInventorySubmit);
  topbarManageSubmitBtn.addEventListener("click", handleManageInventorySubmit);
  topbarManageCancelBtn.addEventListener("click", handleManageInventoryCancel);
  categoryOrdersBtn.addEventListener("click", goToOrders);
  categoryInventoryBtn.addEventListener("click", goToManageInventoryFresh);
  categoryStatsBtn.addEventListener("click", goToStats);
  // Same button, same spinning/disabled treatment either way — just a
  // different underlying refresh depending on which page it's showing on
  // (only ever one of the two, per goToOrders()/goToManageInventory()
  // toggling its visibility). Manage Inventory's own dirty-change guard
  // applies here too, same as its page-local Refresh.
  refreshBtn.addEventListener("click", function () {
    if (currentView === "manage-inventory") {
      var pendingCount = (manageInventoryRows || []).filter(isManageInventoryRowDirty).length;
      if (pendingCount && !window.confirm("Refresh from BrickLink? This discards " + pendingCount + " unsaved change" + (pendingCount === 1 ? "" : "s") + ".")) return;
      fetchManageInventory();
      return;
    }
    itemsCache = {};
    loadOrders();
    syncStateFromRemote();
    syncOrderActionsFromRemote();
  });

  // App-level password gate — Netlify's own visitor-access-control isn't
  // available on this team's plan (confirmed: the API rejects every
  // variant with a 422), so this substitutes for it: every /api/* function
  // rejects unauthenticated requests with 401 (see lib/site-auth.js), and
  // this is the frontend half — nothing here renders real data until a
  // session cookie is established via /api/site-login.
  // Tracks whether this is the very first time the app's shown itself
  // (fresh page load) vs. coming back from an interrupted mid-session
  // login — e.g. a request 401'd partway through something. The first
  // time, there's nothing to resume, so the orders list is exactly
  // right (and is already the visible section by default in the static
  // markup). Any time after that, jumping back to Orders instead of
  // wherever the user actually was is how a session hiccup mid-Add-
  // Inventory-submit could silently swallow a reviewed-but-unsubmitted
  // batch from view — the data was still sitting in memory the whole
  // time, just not visible anywhere obvious.
  var appStarted = false;
  function startApp() {
    appEl.classList.remove("hidden");
    if (appStarted) {
      resumeCurrentView();
    } else {
      appStarted = true;
      // The topbar's category/sub-nav state is dynamic — needs an
      // explicit call here, not just from the goTo* functions, to be
      // correct on this first load.
      setTopbarNav("orders");
      // Opening the site with ?fresh skips (and forgets) the saved position —
      // an escape hatch should restoring ever misbehave.
      if (/[?&]fresh\b/.test(window.location.search)) clearUiSnapshot();
      else restoreSnapshot = readUiSnapshot();
    }
    loadState();
    var ordersLoaded = loadOrders();
    syncStateFromRemote();
    syncOrderActionsFromRemote();
    syncWantedBankFromRemote();
    ensureSortLoaded().catch(function () { /* the Sort page shows its own error */ });
    // A fresh launch (iOS dropped the page while it was in the background)
    // goes back to where Ryan was instead of the Orders list.
    if (restoreSnapshot) {
      var snap = restoreSnapshot;
      restoreSnapshot = null;
      try {
        applyUiSnapshot(snap, ordersLoaded);
      } catch (err) {
        // Whatever the saved position was, it can't be restored: forget it
        // and land on the Orders list rather than a half-built page.
        console.error("Couldn't restore the saved position:", err);
        uiRestoreInFlight = false;
        clearUiSnapshot();
        goToOrders();
      }
    }
  }

  // ---- Remember where you were ----
  //
  // iOS drops a page it's kept in the background for a while (a home-screen
  // icon is no different from a Safari tab in that), and the app then loads
  // from scratch — where every bit of "which page am I on" used to be lost,
  // because it only lived in memory, so it always opened on Orders. The
  // moment the app goes to the background (visibilitychange/pagehide — the
  // last chance iOS reliably gives a page) it now writes a small snapshot of
  // the page and the handful of things that decide what that page shows;
  // the next fresh launch reads it back once. Deliberately small: unsaved
  // edits, open sale drafts and the like aren't kept. localStorage can be
  // cleared by iOS for home-screen apps, in which case there's simply no
  // snapshot and the app opens on Orders as before.
  var UI_SNAPSHOT_KEY = "bl-assistant-ui-snapshot-v1";
  var UI_SNAPSHOT_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;
  var lastOpenedOrderId = null;
  var restoreSnapshot = null;
  var uiRestoreInFlight = false; // an order is still being reopened — don't overwrite the snapshot with "Orders"

  function takeUiSnapshot() {
    var view = currentView;
    var orderId = null;
    if (view === "order") {
      // A read-only order (opened from Order Lookup) isn't in the open list,
      // so it comes back as the Order Lookup page instead.
      if (orderDetailReadOnly || !lastOpenedOrderId) view = orderDetailReadOnly ? "order-lookup" : "orders";
      else orderId = lastOpenedOrderId;
    }
    return {
      savedAt: Date.now(),
      view: view,
      orderId: orderId,
      scrollY: Math.round(window.scrollY || 0),
      manage: {
        type: manageInventoryBrowseType, category: manageInventoryBrowseCategory, recent: manageInventoryBrowseRecent,
        recentDays: manageInventoryRecentDays, sort: manageInventorySortKey, search: manageInventorySearchQuery,
      },
      lookup: { type: setFigLookupType, query: setFigLookupActiveKey ? setFigLookupQuery : "" },
      orderLookupQuery: orderLookupQuery,
      sortRank: sortRankKey,
      sortExpanded: Object.keys(sortExpanded).filter(function (id) { return sortExpanded[id]; }),
    };
  }

  function saveUiSnapshot() {
    // Not while the login screen is up (nothing real to remember), and not
    // while a restore is still in flight (it would record the interim page).
    if (!appStarted || uiRestoreInFlight) return;
    try { window.localStorage.setItem(UI_SNAPSHOT_KEY, JSON.stringify(takeUiSnapshot())); } catch (e) { /* best-effort */ }
  }

  function clearUiSnapshot() {
    try { window.localStorage.removeItem(UI_SNAPSHOT_KEY); } catch (e) { /* nothing to clear */ }
  }

  function readUiSnapshot() {
    try {
      var snap = JSON.parse(window.localStorage.getItem(UI_SNAPSHOT_KEY) || "null");
      if (!snap || typeof snap !== "object" || Date.now() - snap.savedAt > UI_SNAPSHOT_MAX_AGE_MS) return null;
      return snap;
    } catch (e) { return null; }
  }

  // After the page's own content has had a moment to load, scroll back to
  // where it was. Gives up after a few seconds, or the moment Ryan touches
  // the screen, so it never fights him.
  function restoreScrollPosition(y) {
    if (!(y > 40)) return;
    var tries = 0, cancelled = false;
    var cancel = function () { cancelled = true; };
    window.addEventListener("touchstart", cancel, { once: true, passive: true });
    window.addEventListener("wheel", cancel, { once: true, passive: true });
    var timer = setInterval(function () {
      if (cancelled || ++tries > 30) { clearInterval(timer); return; }
      if (document.documentElement.scrollHeight - window.innerHeight >= y) {
        window.scrollTo(0, y);
        clearInterval(timer);
      }
    }, 150);
  }

  function applyUiSnapshot(snap, ordersLoaded) {
    var m = snap.manage || {};
    if (m.type === null || typeof m.type === "string") manageInventoryBrowseType = m.type;
    if (m.category === null || typeof m.category === "string") manageInventoryBrowseCategory = m.category;
    manageInventoryBrowseRecent = !!m.recent;
    if (m.recentDays === 15 || m.recentDays === 30) manageInventoryRecentDays = m.recentDays;
    if (typeof m.sort === "string") manageInventorySortKey = m.sort;
    if (typeof m.search === "string") manageInventorySearchQuery = m.search;
    if (typeof snap.orderLookupQuery === "string") orderLookupQuery = snap.orderLookupQuery;
    if (SORT_RANKS.some(function (r) { return r.key === snap.sortRank; })) sortRankKey = snap.sortRank;
    (snap.sortExpanded || []).forEach(function (id) { sortExpanded[id] = true; });

    var after = function () { restoreScrollPosition(snap.scrollY); };
    switch (snap.view) {
      case "order":
        // The order list has to be loaded before one of its orders can open.
        uiRestoreInFlight = true;
        ordersLoaded.then(function () {
          if (currentView === "orders" && snap.orderId) return openOrder(snap.orderId);
        }).catch(function () { /* stay on the Orders list */ }).then(function () {
          uiRestoreInFlight = false;
          after();
        });
        break;
      case "inventory": goToInventory(); break;
      case "label-prep": goToLabelPrep(); break;
      case "manage-inventory": manageInventoryCameFromSetFigLookup = false; manageInventoryCameFromSort = false; goToManageInventory(); after(); break;
      case "stats": goToStats(); after(); break;
      case "order-lookup": goToOrderLookup(); after(); break;
      case "wanted-list": goToWantedList(); after(); break;
      case "sort-list": goToSortList(); after(); break;
      case "set-fig-lookup":
        if (snap.lookup && snap.lookup.query) {
          setFigLookupType = snap.lookup.type === "SET" ? "SET" : "MINIFIG";
          setFigLookupQuery = String(snap.lookup.query);
          setFigLookupNavStack = [];
          setFigLookupCameFromSort = false;
          runSetFigLookup();
        }
        goToSetFigLookup();
        after();
        break;
      default: after(); // the Orders list
    }
  }

  window.addEventListener("pagehide", saveUiSnapshot);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveUiSnapshot();
  });

  function resumeCurrentView() {
    if (currentView === "inventory") goToInventory();
    else if (currentView === "label-prep") goToLabelPrep();
    else if (currentView === "manage-inventory") goToManageInventory();
    else if (currentView === "stats") goToStats();
    else if (currentView === "order-lookup") goToOrderLookup();
    else if (currentView === "set-fig-lookup") goToSetFigLookup();
    else if (currentView === "wanted-list") goToWantedList();
    else if (currentView === "sort-list") goToSortList();
    else goToOrders();
  }

  function showLoginGate(message) {
    appEl.classList.add("hidden");
    loginGate.classList.remove("hidden");
    if (message) {
      loginGateError.textContent = message;
      loginGateError.classList.remove("hidden");
    }
    loginGatePassword.focus();
  }

  function hideLoginGate() {
    loginGate.classList.add("hidden");
    loginGateError.classList.add("hidden");
    loginGatePassword.value = "";
  }

  loginGateForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = loginGatePassword.value;
    if (!password) return;
    loginGateSubmit.disabled = true;
    loginGateSubmit.textContent = "Checking…";
    loginGateError.classList.add("hidden");
    fetch("/api/site-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password }),
    }).then(function (res) {
      if (res.status === 401) throw new Error("wrong");
      if (!res.ok) throw new Error("server " + res.status);
      return res.json();
    }).then(function (data) {
      // Setting the cookie here ourselves, not relying on the response's
      // Set-Cookie header, is the actual fix for a real bug: on "Chrome"
      // on iOS (which is Safari's WebKit engine under the hood — Apple
      // requires every iOS browser to use it), Set-Cookie from a fetch()
      // response wasn't reliably landing in the cookie jar in time for
      // the very next request, which then 401'd and bounced back to this
      // screen. document.cookie is a far older, more reliable API.
      document.cookie = data.cookieName + "=" + encodeURIComponent(data.token)
        + "; Path=/; Max-Age=" + data.maxAge + "; SameSite=Lax"
        + (window.location.protocol === "https:" ? "; Secure" : "");
      hideLoginGate();
      startApp();
    }).catch(function (err) {
      // Only a real 401 means the password was wrong — anything else is the
      // server or the connection, and saying "incorrect" would send you
      // chasing the wrong problem.
      loginGateError.textContent = err && err.message === "wrong" ? "Incorrect password. Try again."
        : "Couldn’t check the password (" + ((err && err.message) || "network error") + "). Try again.";
      loginGateError.classList.remove("hidden");
      loginGatePassword.value = "";
      loginGatePassword.focus();
    }).finally(function () {
      loginGateSubmit.disabled = false;
      loginGateSubmit.textContent = "Unlock";
    });
  });

  // Checks for an existing valid session cookie before deciding whether
  // to show the app or the password prompt — avoids a pointless flash of
  // loading state (and a guaranteed 401 from loadOrders()) for a
  // first-time or expired visitor.
  fetch("/api/site-session").then(function (res) {
    if (res.ok) { startApp(); } else { showLoginGate(); }
  }).catch(function () { showLoginGate(); });
})();
</script>
</body>
</html>
