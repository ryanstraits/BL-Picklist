  var sortSettings = null;
  var sortList = null; // newest first
  var sortLoadPromise = null;
  var sortLoadError = null;
  var sortRankKey = "newest";
  var sortExpanded = {}; // id -> true
  var sortSaveTimer = null;
  var sortSavePending = false; // an edit is waiting out the short save delay
  var sortSaveStatus = "";
  var sortFigCache = {}; // minifig itemNo -> { name, weightG, soldAvg, soldCount, stockMin, stockAvg25, stockN } — this page load only

  // Ryan's spreadsheet ID for an owned set: the set number without its "-1"
  // variant, then "-" and which copy he owns (1st, 2nd, ...), then "_" and
  // the theme code — e.g. set 75342-1, 3rd copy, Star Wars → 75342-3_SW.
  function sortSetBase(setNo) {
    return String(setNo || "").replace(/-\d+$/, "");
  }
  function sortEntryId(e) {
    var id = sortSetBase(e.setNo);
    if (e.copyNo > 0) id += "-" + e.copyNo;
    if (e.theme) id += "_" + e.theme;
    return id;
  }
  function sortIdComplete(e) {
    return e.copyNo > 0 && !!e.theme;
  }
  // Another entry already carrying the same ID.
  function sortIdClash(e) {
    if (!sortIdComplete(e)) return false;
    var id = sortEntryId(e);
    return sortList.some(function (x) { return x !== e && sortIdComplete(x) && sortEntryId(x) === id; });
  }
  function sortCategoryPath(categoryId, cats) {
    var names = [];
    var id = categoryId;
    for (var guard = 0; id && cats[id] && guard < 12; guard++) {
      names.unshift(cats[id].name);
      id = cats[id].parentId;
    }
    return names;
  }
  function sortGuessTheme(pathNames) {
    var path = pathNames.join(" > ").toLowerCase();
    var i;
    for (i = 0; i < SORT_THEME_RULES.length; i++) if (path.indexOf(SORT_THEME_RULES[i][0]) !== -1) return SORT_THEME_RULES[i][1];
    if (/\b(city|town)\b/.test(path)) {
      for (i = 0; i < SORT_CITY_RULES.length; i++) if (path.indexOf(SORT_CITY_RULES[i][0]) !== -1) return SORT_CITY_RULES[i][1];
      return "CI";
    }
    return SORT_FALLBACK_THEME;
  }
  var sortCategoriesRefreshed = false; // at most one forced refresh per page load

  // Works out a set's BrickLink category path (kept on the card so it can be
  // shown) and, unless Ryan has set the code himself, the theme code from it.
  // If the category isn't in the list this page has — a stale remembered
  // copy — the list is re-fetched once before giving up and using GE.
  function applySortThemeGuess(e) {
    return getCategories().then(function (cats) {
      if (cats[e.categoryId] || sortCategoriesRefreshed) return cats;
      sortCategoriesRefreshed = true;
      return refreshCategories();
    }).then(function (cats) {
      var names = sortCategoryPath(e.categoryId, cats);
      e.categoryPath = names.join(" › ");
      if (e.themeAuto) e.theme = sortGuessTheme(names);
    });
  }

  // Entries already on the list that still have an automatic code get it
  // worked out again when the page opens (they may have been added while the
  // category list was unavailable).
  function reguessSortThemes() {
    var todo = (sortList || []).filter(function (e) { return e.categoryId && (e.themeAuto || !e.categoryPath); });
    if (!todo.length) return;
    var before = todo.map(function (e) { return e.theme + "|" + e.categoryPath; });
    todo.reduce(function (chain, e) { return chain.then(function () { return applySortThemeGuess(e); }); }, Promise.resolve())
      .then(function () {
        var changed = todo.some(function (e, i) { return (e.theme + "|" + e.categoryPath) !== before[i]; });
        if (!changed) return;
        saveSortList();
        renderSortList();
      }).catch(function () { /* leave the codes as they are */ });
  }

  function sortNextCopyNo(setNo) {
    var max = 0;
    sortList.forEach(function (x) { if (x.setNo.toLowerCase() === setNo.toLowerCase() && x.copyNo > max) max = x.copyNo; });
    return max + 1;
  }

  function sortNum(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  function sortMoney(n) {
    return (n < 0 ? "−" : "") + "$" + Math.abs(n).toFixed(2);
  }
  function sortClamp(v, lo, hi) {
    return Math.min(hi, Math.max(lo, v));
  }

  function ensureSortLoaded() {
    if (sortLoadPromise) return sortLoadPromise;
    sortLoadError = null;
    sortLoadPromise = Promise.all([
      fetchJSON("/api/pick-state?key=sortList"),
      fetchJSON("/api/pick-state?key=sortSettings"),
    ]).then(function (res) {
      var list = Array.isArray(res[0]) ? res[0] : [];
      list.forEach(function (e) {
        // A price fetch that was cut off by a reload can't be resumed.
        if (e.status === "loading") { e.status = "error"; e.error = "Price fetch was interrupted — tap Refresh prices."; }
      });
      sortList = list;
      updateSortListBadge();
      var saved = res[1] && typeof res[1] === "object" ? res[1] : {};
      sortSettings = {};
      Object.keys(SORT_DEFAULTS).forEach(function (k) {
        sortSettings[k] = typeof saved[k] === "number" ? saved[k] : SORT_DEFAULTS[k];
      });
    }).catch(function (err) {
      // Never fall back to an empty list here: the next save would then
      // overwrite the real one.
      sortLoadError = err.message;
      sortLoadPromise = null;
      throw err;
    });
    return sortLoadPromise;
  }

  // The round count bubble on the Sort tab — same look as the Wanted tab's.
  function updateSortListBadge() {
    var badge = document.getElementById("sortListBadge");
    if (!badge) return;
    var n = sortList ? sortList.length : 0;
    badge.textContent = String(n);
    badge.classList.toggle("hidden", n === 0);
  }

  function updateSortSaveStatus() {
    var el = document.getElementById("sortSaveStatus");
    if (el) el.textContent = sortSaveStatus;
  }

  function writeSortList() {
    sortSavePending = false;
    return postJSON("/api/pick-state?key=sortList", sortList).then(function () {
      sortSaveStatus = "Saved";
      updateSortSaveStatus();
    }).catch(function (err) {
      sortSaveStatus = "Couldn’t save: " + err.message + " — don’t reload yet.";
      updateSortSaveStatus();
    });
  }

  function saveSortList() {
    if (!sortList) return;
    updateSortListBadge();
    clearTimeout(sortSaveTimer);
    sortSavePending = true;
    sortSaveStatus = "Saving…";
    updateSortSaveStatus();
    sortSaveTimer = setTimeout(writeSortList, 500);
  }

  // Leaving or reloading the page while an edit is still waiting out the
  // save delay would drop it, so send it right then — a beacon survives the
  // page going away where an ordinary request may not.
  function flushPendingSortSaveOnExit() {
    if (!sortSavePending || !sortList) return;
    sortSavePending = false;
    clearTimeout(sortSaveTimer);
    try {
      navigator.sendBeacon("/api/pick-state?key=sortList", new Blob([JSON.stringify(sortList)], { type: "application/json" }));
    } catch (err) { /* nothing more can be done as the page closes */ }
  }
  window.addEventListener("pagehide", flushPendingSortSaveOnExit);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushPendingSortSaveOnExit();
  });

  // The Save button: write now instead of waiting out the short delay.
  function flushSortList() {
    if (!sortList) return Promise.resolve();
    clearTimeout(sortSaveTimer);
    sortSaveStatus = "Saving…";
    updateSortSaveStatus();
    return writeSortList();
  }

  function saveSortSettings() {
    sortSaveStatus = "Saving…";
    updateSortSaveStatus();
    postJSON("/api/pick-state?key=sortSettings", sortSettings).then(function () {
      sortSaveStatus = "Saved";
      updateSortSaveStatus();
    }).catch(function (err) {
      sortSaveStatus = "Couldn’t save settings: " + err.message;
      updateSortSaveStatus();
    });
  }

  // ---- Analysis ----

  function sortFigUnitValue(f) {
    if (f.soldAvg > 0) return f.soldAvg;
    if (f.stockMin > 0) return f.stockMin;
    return 0;
  }

  function sortCondFactor(cond, st) {
    return (cond === "poor" ? st.condPoor : cond === "fair" ? st.condFair : st.condGood) / 100;
  }

  // The copies of a fig Ryan already owns in his own BrickLink inventory:
  // how many sit in a stock room (not for sale, so pulling one gives up
  // nothing) and the price of each live listing (ascending, after any sale
  // percentage). One entry per copy, capped so a huge lot can't balloon this.
  function sortOwnFigUnits(itemNo) {
    var out = { free: 0, live: [] };
    if (!manageInventoryRows) return out;
    manageInventoryRows.forEach(function (r) {
      if (r.type !== "MINIFIG" || r.itemNo !== itemNo || r.markedForDelete) return;
      var qty = parseInt(r.quantity, 10) || 0;
      if (qty <= 0) return;
      if (r.stockRoomId || (r.orig && r.orig.stockRoomId)) { out.free += qty; return; }
      var price = parseFloat(r.unitPrice) || 0;
      var rate = (r.orig && r.orig.saleRate) || 0;
      if (rate > 0) price = price * (1 - rate / 100);
      for (var i = 0; i < Math.min(qty, 20); i++) out.live.push(price);
    });
    out.live.sort(function (a, b) { return a - b; });
    return out;
  }

  // What it takes to fill `miss` empty spots for one fig. Each spot costs the
  // cheaper of buying one on BrickLink — the average of its 25 cheapest
  // current listings (not just the single cheapest) — and using one of
  // Ryan's own: a live listing costs what it would have sold for (the sale
  // he gives up — his price, not what he paid), and a stock room copy costs
  // nothing since it isn't on the market. Stock room copies go first.
  function sortMissingFigCost(f, miss, unit) {
    // A price Ryan typed in for this set (a listing he found) replaces the
    // estimate and means he's buying those copies — none of his own get used.
    if (f.buyCost > 0) return { total: miss * f.buyCost, ownLive: 0, ownFree: 0 };
    var buy = f.stockAvg25 > 0 ? f.stockAvg25 : (f.stockMin > 0 ? f.stockMin : unit);
    var own = sortOwnFigUnits(f.itemNo);
    var total = 0, usedLive = 0, usedFree = 0;
    for (var i = 0; i < miss; i++) {
      if (usedFree < own.free) { usedFree++; continue; }
      var livePrice = own.live[usedLive];
      if (livePrice !== undefined && !(buy > 0 && buy < livePrice)) { total += livePrice; usedLive++; }
      else total += buy;
    }
    return { total: total, ownLive: usedLive, ownFree: usedFree };
  }

  function analyzeSortEntry(e, st) {
    var lb = function (g) { return g / GRAMS_PER_LB; };
    var figs = e.figs || [];
    var setValue = e.setSoldAvg > 0 ? e.setSoldAvg : (e.setStockAvg > 0 ? e.setStockAvg : 0);
    var figsAll = 0, figsWeightG = 0;
    var ownedValue = 0, ownedWeightG = 0, ownedCount = 0, partOutFigs = 0;
    var missingCount = 0, missingValue = 0, missingBuy = 0, missingNoPrice = 0, ownLiveUsed = 0, ownFreeUsed = 0;
    figs.forEach(function (f) {
      var unit = sortFigUnitValue(f);
      var qty = f.qty || 1;
      var have = sortClamp(f.have || 0, 0, qty);
      var miss = qty - have;
      var cf = sortCondFactor(f.cond, st);
      figsAll += unit * qty;
      figsWeightG += (f.weightG || 0) * qty;
      ownedValue += have * unit * cf;
      ownedWeightG += have * (f.weightG || 0);
      ownedCount += have;
      // Sold singly, a fig is never worth less than its parts by weight.
      partOutFigs += have * Math.max(unit * cf, lb(f.weightG || 0) * st.figRate);
      if (miss) {
        missingCount += miss;
        missingValue += miss * unit;
        var fill = sortMissingFigCost(f, miss, unit);
        missingBuy += fill.total;
        ownLiveUsed += fill.ownLive;
        ownFreeUsed += fill.ownFree;
        if (!(unit > 0)) missingNoPrice += miss;
      }
    });

    var completeness = sortClamp(sortNum(e.completeness), 0, 100);
    var quality = sortClamp(sortNum(e.quality), 0, 10);
    var floor = st.qualityFloorPct / 100;
    var qualityF = floor + (1 - floor) * (quality / 10);
    var premium = 1 + (sortClamp(sortNum(e.box), 0, 10) / 10) * (st.boxPremiumPct / 100)
      + (sortClamp(sortNum(e.manual), 0, 10) / 10) * (st.manualPremiumPct / 100);
    // The set's market value minus what its figs account for is the
    // brick-and-everything-else share; completeness, quality and box/manual
    // adjust that share (figs carry their own per-fig condition).
    var brickFull = Math.max(setValue - figsAll, 0);
    var brickAdj = brickFull * (completeness / 100) * qualityF * premium;

    // Route 1 — sell as a set
    var completeValue = brickAdj + ownedValue + missingValue;
    var shareMissing = completeValue > 0 ? missingBuy / completeValue : 0;
    var buyMissing = missingCount > 0 && shareMissing <= st.skipPct / 100;
    var setRoute;
    if (missingCount === 0 || buyMissing) {
      setRoute = {
        key: "set", label: missingCount ? "Sell as set + buy figs" : "Sell as set",
        value: completeValue, cost: buyMissing ? missingBuy : 0,
        net: completeValue - (buyMissing ? missingBuy : 0),
      };
    } else {
      var asIs = brickAdj + ownedValue;
      setRoute = { key: "set", label: "Sell set, skip missing figs", value: asIs, cost: 0, net: asIs };
    }

    // Route 2 — figs listed singly, everything else to bulk. The set's
    // weight has no per-part breakdown, so the loose fig accessories in the
    // leftover are an allowance per fig; the rest is general parts.
    var remainderG = Math.max((e.setWeightG || 0) - figsWeightG, 0) * (completeness / 100);
    var figCount = figs.reduce(function (n, f) { return n + (f.qty || 1); }, 0);
    var figPartsG = Math.min(remainderG, figCount * st.accessoryG);
    var generalG = remainderG - figPartsG;
    var bulkParts = lb(generalG) * st.genRate + lb(figPartsG) * st.figRate;
    var partRoute = {
      key: "part", label: "Part out", value: partOutFigs + bulkParts, cost: 0,
      net: partOutFigs + bulkParts, figsValue: partOutFigs, bulkValue: bulkParts,
    };

    var paidKnown = e.paid !== null && e.paid !== undefined && e.paid !== "";
    var paid = paidKnown ? sortNum(e.paid) : 0;
    var routes = [setRoute, partRoute];
    routes.forEach(function (r) {
      r.profit = r.net - paid;
    });
    // The set as it stands today vs. complete with every missing fig bought
    // (whether or not the skip threshold would actually buy them).
    var asIsNet = brickAdj + ownedValue;
    var fullNet = completeValue - missingBuy;
    var scenario = function (net) {
      return { net: net, profit: net - paid, roi: paidKnown && paid > 0 ? (net - paid) / paid : null };
    };
    var nowCase = scenario(asIsNet), completeCase = scenario(fullNet);
    // The pick leans toward the route with the stronger demand: a route's
    // value is scaled by up to ±demandWeightPct% (set demand for selling
    // complete; the rarity of the figs you actually have for the fig part
    // of parting out, bulk untouched). Unknown demand is neutral (50). The
    // numbers shown stay the real ones — this only decides which route wins.
    var wPct = (st.demandWeightPct || 0) / 100;
    var lean = function (d) { return 1 + wPct * ((d === null ? 50 : d) - 50) / 50; };
    var ownRar = 0, ownW = 0;
    figs.forEach(function (f) {
      var have = sortClamp(f.have || 0, 0, f.qty || 1), r = sortFigRarity(f);
      if (!have || r === null) return;
      var w = (sortFigUnitValue(f) * have) || 1;
      ownRar += r * w; ownW += w;
    });
    var setDem = sortSetDemand(e), figDem = ownW > 0 ? ownRar / ownW : null;
    setRoute.score = setRoute.net * lean(setDem) - paid;
    partRoute.score = partRoute.figsValue * lean(figDem) + partRoute.bulkValue - paid;
    // Ties go to the earlier route (sell as set, then part out).
    var best = routes.reduce(function (top, r) { return r.score > top.score ? r : top; }, routes[0]);
    var plainBest = routes.reduce(function (top, r) { return r.profit > top.profit ? r : top; }, routes[0]);

    var hasData = setValue > 0 || figs.some(function (f) { return sortFigUnitValue(f) > 0; });
    var flags = [];
    if (e.status === "ready" && !hasData) flags.push("No price data.");
    if (!paidKnown) flags.push("Add Paid for profit & ROI.");
    if (missingCount > 0 && !buyMissing) flags.push("Cost to buy the " + missingCount + " missing fig" + (missingCount === 1 ? "" : "s") + ": " + sortMoney(missingBuy) + " — " + Math.round(shareMissing * 100) + "% of the set’s value (limit " + st.skipPct + "%), so not bought.");
    if (missingCount > 0 && buyMissing) flags.push("Cost to buy the " + missingCount + " missing fig" + (missingCount === 1 ? "" : "s") + ": " + sortMoney(missingBuy) + " (" + Math.round(shareMissing * 100) + "% of the set’s value)" + (ownLiveUsed + ownFreeUsed ? ", using " + (ownLiveUsed + ownFreeUsed) + " of your own" : "") + ".");
    if (ownedCount > 0) flags.push("Value of the " + ownedCount + " fig" + (ownedCount === 1 ? "" : "s") + " you have: " + sortMoney(ownedValue) + " if sold singly.");
    if (missingNoPrice > 0) flags.push(missingNoPrice + " missing fig" + (missingNoPrice === 1 ? "" : "s") + ": no price.");
    if (ownedValue > brickAdj && ownedCount > 0) flags.push("Figs > Set");
    if (!(e.setWeightG > 0) && e.status === "ready") flags.push("No set weight — bulk $0.");
    if (best !== plainBest) {
      flags.push("Demand tips this to " + best.label + " (set demand " + (setDem === null ? "unknown" : Math.round(setDem)) + " vs. rarity of the figs you have " + (figDem === null ? "unknown" : Math.round(figDem)) + "); on profit alone it would be " + plainBest.label + ".");
    }
    if (sortNum(e.manual) === 0) flags.push("No manual — you likely won’t sell it as a set.");

    return {
      routes: routes, best: best, paid: paid, paidKnown: paidKnown, now: nowCase, complete: completeCase,
      profit: best.profit, roi: paidKnown && paid > 0 ? best.profit / paid : null,
      value: best.net,
      flags: flags, hasData: hasData,
      parts: { setValue: setValue, figsAll: figsAll, brickFull: brickFull, brickAdj: brickAdj, qualityF: qualityF, premium: premium,
        ownedValue: ownedValue, ownedCount: ownedCount, missingCount: missingCount, missingBuy: missingBuy, missingValue: missingValue, remainderG: remainderG, generalG: generalG, figPartsG: figPartsG, bulkParts: bulkParts },
    };
  }

  function sortRankValue(a, key) {
    if (key === "roi") return a.roi === null ? -Infinity : a.roi;
    if (key === "profit") return a.profit;
    if (key === "value") return a.value;
    return 0;
  }

  // How fast a set should get from the pile to sold, 0–100 (higher = quicker):
  //   25  completeness (nothing to hunt down)
  //   25  share of its figs on hand (nothing to buy or wait for)
  //   20  fewer pieces (less to sort, count and photograph) — log scale from
  //       50 pieces (full marks) to 3,000 (none). The piece count comes from
  //       BrickLink's parts list; a set not refreshed since that was added
  //       falls back to its weight (about 0.55 g a piece), and with neither
  //       gets half marks.
  //   10  manual (Ryan won't sell sets without one, so none costs all 10)
  //   10  quality (cleaner = less cleaning)
  //    5  box
  //    5  demand — how many sold lately
  // The ranking is by this score alone, highest first; value only breaks ties.
  function sortPieceCount(e) {
    if (e.pieces > 0) return e.pieces;
    return e.setWeightG > 0 ? e.setWeightG / 0.55 : 0;
  }
  function sortQuickTurn(e) {
    var completeness = sortClamp(sortNum(e.completeness), 0, 100) / 100;
    var figs = e.figs || [];
    var need = 0, have = 0;
    figs.forEach(function (f) { var q = f.qty || 1; need += q; have += sortClamp(f.have || 0, 0, q); });
    // A set whose figs never loaded isn't "nothing to find" — neutral, not full marks.
    var figShare = need ? have / need : (e.status === "ready" ? 1 : 0.5);
    var pieces = sortPieceCount(e);
    var pieceScore = pieces > 0 ? sortClamp(1 - Math.log(pieces / 50) / Math.log(3000 / 50), 0, 1) : 0.5;
    var parts = {
      completeness: 25 * completeness, figs: 25 * figShare, pieces: 20 * pieceScore,
      manual: 10 * (sortClamp(sortNum(e.manual), 0, 10) / 10),
      quality: 10 * (sortClamp(sortNum(e.quality), 0, 10) / 10), box: 5 * (sortClamp(sortNum(e.box), 0, 10) / 10),
      demand: 5 * sortClamp((e.setSoldCount || 0) / 20, 0, 1),
    };
    var score = parts.completeness + parts.figs + parts.pieces + parts.manual + parts.quality + parts.box + parts.demand;
    var a = analyzeSortEntry(e, sortSettings);
    var rank = score + sortClamp(a.value, 0, 10000) / 1e6;
    return { score: score, rank: rank, pieces: pieces, parts: parts, figs: have + " of " + need };
  }

  function sortedSortList() {
    var arr = sortList.slice();
    if (sortRankKey === "newest") return arr;
    if (sortRankKey === "setno") {
      // Lowest set number first (numerically, so 9999 comes before 10000),
      // and copies of the same set in copy order.
      return arr.sort(function (x, y) {
        return x.setNo.localeCompare(y.setNo, undefined, { numeric: true, sensitivity: "base" })
          || (sortNum(x.copyNo) - sortNum(y.copyNo));
      });
    }
    var scored = arr.map(function (e) {
      var v;
      if (sortRankKey === "quick") v = sortQuickTurn(e).rank;
      else if (sortRankKey === "demand") { var d = sortDemand(e); v = d ? d.score : -1; }
      else v = sortRankValue(analyzeSortEntry(e, sortSettings), sortRankKey);
      return { e: e, v: v };
    });
    scored.sort(function (x, y) { return y.v - x.v; });
    return scored.map(function (s) { return s.e; });
  }

  // ---- Fetching ----

  function runPool(tasks, limit) {
    return new Promise(function (resolve) {
      if (!tasks.length) { resolve(); return; }
      var i = 0, active = 0, done = 0;
      function next() {
        while (active < limit && i < tasks.length) {
          (function (task) {
            active++;
            task().catch(function () { /* each task records its own failure */ }).then(function () {
              active--; done++;
              if (done === tasks.length) resolve(); else next();
            });
          })(tasks[i++]);
        }
      }
      next();
    });
  }

  function sortPriceFetch(type, no, guide) {
    return fetchJSON("/api/price-guide?type=" + type + "&no=" + encodeURIComponent(no) + "&condition=U"
      + (guide === "sold" ? "&guide=sold" : "") + (guide === "stock-all" ? "&scope=all" : ""));
  }

  function sortFindEntry(id) {
    return (sortList || []).filter(function (e) { return e.id === id; })[0] || null;
  }

  function loadSortEntryData(e) {
    e.status = "loading";
    e.error = "";
    e.progress = { done: 0, total: 3 };
    patchSortCard(e.id);
    var tick = function () { e.progress.done++; patchSortCard(e.id); };
    var warnings = 0;

    return fetchJSON("/api/item-lookup?type=SET&no=" + encodeURIComponent(e.setNo)).then(function (r) {
      var item = (r && r.item) || {};
      if (item.name) e.name = decodeHtmlEntities(item.name);
      e.setWeightG = item.weightG || 0;
      e.categoryId = item.categoryId || 0;
      tick();
      // Fill in the theme code from the set's BrickLink category — unless
      // Ryan has already set one himself. A failed category load just
      // leaves the GE fallback.
      var themeStep = e.categoryId
        ? applySortThemeGuess(e).then(function () {
            sortList.forEach(function (x) { patchSortCard(x.id); });
          }).catch(function () { /* keep the fallback */ })
        : Promise.resolve();
      return themeStep.then(function () {
        return fetchJSON("/api/item-subsets?type=SET&no=" + encodeURIComponent(e.setNo));
      });
    }).then(function (data) {
      var old = {};
      (e.figs || []).forEach(function (f) { old[f.itemNo] = f; });
      var byNo = {};
      var pieces = 0;
      ((data && data.entries) || []).forEach(function (x) {
        if (x.type === "PART" && !x.isAlternate && !x.isCounterpart) pieces += x.quantity || 0;
        if (x.type !== "MINIFIG" || x.isAlternate || x.isCounterpart) return;
        if (byNo[x.itemNo]) { byNo[x.itemNo].qty += x.quantity || 1; return; }
        var prev = old[x.itemNo] || {};
        byNo[x.itemNo] = {
          itemNo: x.itemNo, name: decodeHtmlEntities(x.name || ""), qty: x.quantity || 1,
          have: prev.have || 0, cond: prev.cond || "good", buyCost: prev.buyCost > 0 ? prev.buyCost : null,
          soldAvg: 0, soldCount: 0, stockMin: 0, stockAvg25: 0, stockN: 0, weightG: 0,
        };
      });
      e.figs = Object.keys(byNo).map(function (k) { return byNo[k]; });
      if (pieces > 0) e.pieces = pieces;
      tick();

      var tasks = [];
      // The set itself: what it sold for, with current listings as a fallback.
      tasks.push(function () {
        return sortPriceFetch("SET", e.setNo, "sold").then(function (p) {
          e.setSoldAvg = Number(p.qtyAvgPrice || p.avgPrice) || 0;
          e.setSoldCount = p.unitQuantity || 0;
          e.setSoldQty = p.totalQuantity || 0;
        }).catch(function () { warnings++; }).then(tick);
      });
      // Everything listed worldwide, to set against what sold (also worldwide).
      tasks.push(function () {
        return sortPriceFetch("SET", e.setNo, "stock-all").then(function (p) {
          e.setListedAll = p.totalQuantity || 0;
        }).catch(function () { warnings++; }).then(tick);
      });
      tasks.push(function () {
        return sortPriceFetch("SET", e.setNo, "stock").then(function (p) {
          e.setStockAvg = Number(p.avgPrice) || 0;
          e.setStockQty = p.totalQuantity || 0;
        }).catch(function () { warnings++; }).then(tick);
      });
      e.figs.forEach(function (f) {
        var cached = sortFigCache[f.itemNo];
        if (cached) {
          f.soldAvg = cached.soldAvg; f.soldCount = cached.soldCount; f.soldQty = cached.soldQty; f.stockQty = cached.stockQty; f.yearReleased = cached.yearReleased; f.setCount = cached.setCount; f.stockMin = cached.stockMin; f.stockAvg25 = cached.stockAvg25; f.stockN = cached.stockN; f.weightG = cached.weightG;
          if (!f.name && cached.name) f.name = cached.name;
          return;
        }
        var c = sortFigCache[f.itemNo] = { name: "", weightG: 0, soldAvg: 0, soldCount: 0, soldQty: 0, stockQty: 0, yearReleased: 0, setCount: null, stockMin: 0, stockAvg25: 0, stockN: 0 };
        tasks.push(function () {
          return fetchJSON("/api/item-lookup?type=MINIFIG&sets=1&no=" + encodeURIComponent(f.itemNo)).then(function (r) {
            c.weightG = (r.item && r.item.weightG) || 0;
            c.yearReleased = (r.item && r.item.yearReleased) || 0;
            c.setCount = r.item && r.item.setCount > 0 ? r.item.setCount : null;
            if (r.item && r.item.name) c.name = decodeHtmlEntities(r.item.name);
          }).catch(function () { warnings++; }).then(function () { f.weightG = c.weightG; f.yearReleased = c.yearReleased; f.setCount = c.setCount; if (!f.name) f.name = c.name; tick(); });
        });
        tasks.push(function () {
          return sortPriceFetch("MINIFIG", f.itemNo, "sold").then(function (p) {
            c.soldAvg = Number(p.qtyAvgPrice || p.avgPrice) || 0;
            c.soldCount = p.unitQuantity || 0;
            c.soldQty = p.totalQuantity || 0;
          }).catch(function () { warnings++; }).then(function () { f.soldAvg = c.soldAvg; f.soldCount = c.soldCount; f.soldQty = c.soldQty; tick(); });
        });
        tasks.push(function () {
          return sortPriceFetch("MINIFIG", f.itemNo, "stock").then(function (p) {
            c.stockMin = Number(p.minPrice) || 0;
            // The server already returns just the 25 cheapest current US used
            // listings, cheapest first — their plain average is what it would
            // realistically cost to buy one.
            var prices = (p.listings || []).map(function (l) { return Number(l.unitPrice); }).filter(function (n) { return n > 0; });
            c.stockN = prices.length;
            c.stockQty = p.totalQuantity || 0;
            c.stockAvg25 = prices.length ? prices.reduce(function (a, b) { return a + b; }, 0) / prices.length : 0;
          }).catch(function () { warnings++; }).then(function () { f.stockMin = c.stockMin; f.stockAvg25 = c.stockAvg25; f.stockN = c.stockN; f.stockQty = c.stockQty; tick(); });
        });
      });
      e.progress.total = e.progress.done + tasks.length;
      patchSortCard(e.id, true); // the fig checklist can be filled in now; prices follow
      return runPool(tasks, 3);
    }).then(function () {
      e.status = "ready";
      e.fetchedAt = new Date().toISOString();
      if (!manageInventoryRows) refreshSortFigStock();
      if (warnings) e.error = warnings + " price lookup" + (warnings === 1 ? "" : "s") + " failed — tap Refresh prices to retry.";
      // A failed lookup shouldn't be cached as a real zero.
      (e.figs || []).forEach(function (f) { if (warnings && !(f.soldAvg > 0) && !(f.stockMin > 0) && !(f.stockAvg25 > 0)) delete sortFigCache[f.itemNo]; });
      saveSortList();
      patchSortCard(e.id, true);
    }).catch(function (err) {
      e.status = "error";
      e.error = "Couldn’t load that set: " + err.message;
      saveSortList();
      patchSortCard(e.id, true);
    });
  }

  // ---- Adding ----

  function addToSortList(rawSetNo, knownName) {
    var setNo = normalizeSetFigNo("SET", rawSetNo);
    if (!setNo) return Promise.resolve({ added: false });
    return ensureSortLoaded().then(function () {
      // Owning several copies of one set is normal here, so there's no
      // duplicate check — the copy number just counts up.
      var e = {
        id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        setNo: setNo, name: knownName ? decodeHtmlEntities(knownName) : "", addedAt: new Date().toISOString(),
        copyNo: sortNextCopyNo(setNo), theme: SORT_FALLBACK_THEME, themeAuto: true,
        paid: null, completeness: 100, quality: 7, box: 0, manual: 0,
        figs: [], setSoldAvg: 0, setSoldCount: 0, setStockAvg: 0, setWeightG: 0,
        status: "loading", error: "", progress: { done: 0, total: 3 },
      };
      sortList.unshift(e);
      sortExpanded[e.id] = true;
      saveSortList();
      if (currentView === "sort-list") renderSortList();
      loadSortEntryData(e);
      return { added: true, entry: e };
    });
  }

  function sortListCopyCount(rawSetNo) {
    if (!sortList) return 0;
    var lower = normalizeSetFigNo("SET", rawSetNo).toLowerCase();
    return sortList.filter(function (x) { return x.setNo.toLowerCase() === lower; }).length;
  }

  // ---- Rendering ----

  function sortVerdictHtml(e, a) {
    if (e.status === "loading") return '<span class="item-type-tag sort-verdict sort-verdict-wait">Fetching…</span>';
    if (e.status === "error") return '<span class="item-type-tag sort-verdict sort-verdict-warn">Error</span>';
    if (!a.hasData) return '<span class="item-type-tag sort-verdict sort-verdict-warn">Needs data</span>';
    var cls = a.best.key === "set" ? "sort-verdict-sell" : "sort-verdict-part";
    return '<span class="item-type-tag sort-verdict ' + cls + '">' + escapeHtml(a.best.key === "set" ? "Sell as set" : "Part out") + '</span>';
  }

  // Figs checked off out of figs needed, right under the verdict badge.
  function sortFigCountHtml(e) {
    var need = 0, have = 0;
    (e.figs || []).forEach(function (f) {
      var qty = f.qty || 1;
      need += qty;
      have += sortClamp(f.have || 0, 0, qty);
    });
    if (!need) return "";
    return '<span class="sort-fig-count' + (have >= need ? ' all' : '') + '">' + have + '/' + need + ' figs</span>';
  }

  // ---- Card front ----
  // A featured tile for whatever the list is ranked by (with a few short
  // words on why), and the other numbers as a grid of small tiles beneath.
  var SORT_FEATURE_FOR_RANK = { roi: "roi", profit: "profit", quick: "qt", demand: "demand", value: "value", newest: "value", setno: "value" };
  var SORT_TILE_ORDER = ["value", "profit", "roi", "demand", "qt"];

  function sortDemandWord(n, hi, lo) { return n >= 60 ? hi : n >= 35 ? "steady" : lo; }

  // Short phrases, not sentences.
  function sortFeatureSub(e, a, key) {
    var lines = [];
    if (key === "demand") {
      var d = sortDemand(e);
      if (!d) return ["No data yet"];
      if (d.setD !== null) {
        var sold = e.setSoldQty > 0 ? e.setSoldQty : (e.setSoldCount || 0);
        var listed = e.setListedAll > 0 ? e.setListedAll : (e.setStockQty || 0);
        lines.push("Set " + sortDemandWord(d.setD, "hot", "slow") + " · " + sold + " sold / " + listed + " listed");
      }
      if (d.figD !== null) lines.push("Figs " + sortDemandWord(d.figD, "rare", "common") + " · rarity " + Math.round(d.figD));
    } else if (key === "roi") {
      lines.push(a.paidKnown ? "Profit " + sortMoney(a.profit) + " · paid " + sortMoney(a.paid) : "Add Paid");
      if (a.parts.missingCount > 0 && a.paidKnown && a.now.roi !== null && a.complete.roi !== null) {
        lines.push("As is " + Math.round(a.now.roi * 100) + "% → complete " + Math.round(a.complete.roi * 100) + "%");
      }
    } else if (key === "profit") {
      lines.push(a.paidKnown ? "ROI " + (a.roi === null ? "—" : Math.round(a.roi * 100) + "%") + " · paid " + sortMoney(a.paid) : "Add Paid");
      lines.push(a.best.label);
    } else if (key === "qt") {
      var q = sortQuickTurn(e);
      lines.push(Math.round(sortClamp(sortNum(e.completeness), 0, 100)) + "% complete · figs " + q.figs.replace(" of ", "/"));
      lines.push("Manual " + sortClamp(sortNum(e.manual), 0, 10) + "/10" + (q.pieces > 0 ? " · " + Math.round(q.pieces) + " pcs" : ""));
    } else {
      lines.push(a.best.label);
      if (a.parts.missingCount > 0) lines.push(a.parts.missingCount + " fig" + (a.parts.missingCount === 1 ? "" : "s") + " to buy · " + sortMoney(a.parts.missingBuy));
    }
    return lines;
  }

  function sortFrontHtml(e, a) {
    var roiTxt = a.roi === null ? "—" : Math.round(a.roi * 100) + "%";
    var d = sortDemand(e);
    var dn = d ? Math.round(d.score) : null;
    var metrics = {
      value: { label: "Value", text: sortMoney(a.value), cls: "" },
      profit: { label: "Profit", text: a.paidKnown ? sortMoney(a.profit) : "—", cls: !a.paidKnown ? "" : a.profit < 0 ? "sort-neg" : "sort-pos" },
      roi: { label: "ROI", text: roiTxt, cls: a.roi === null ? "" : a.roi < 0 ? "sort-neg" : "sort-pos" },
      demand: { label: "Demand", text: dn === null ? "—" : String(dn), cls: dn === null ? "" : dn >= 60 ? "sort-demand-high" : dn >= 35 ? "sort-demand-mid" : "" },
      qt: { label: "QT Score", text: String(Math.round(sortQuickTurn(e).score)), cls: "" },
    };
    var key = SORT_FEATURE_FOR_RANK[sortRankKey] || "value";
    var m = metrics[key];
    return '<div class="sort-feature"><div class="sort-feature-label">' + m.label + '</div>'
      + '<div class="sort-feature-num ' + m.cls + '">' + m.text + '</div>'
      + sortFeatureSub(e, a, key).map(function (l) { return '<div class="sort-feature-sub">' + escapeHtml(l) + '</div>'; }).join("")
      + '</div>'
      + '<div class="sort-tiles">' + SORT_TILE_ORDER.filter(function (k) { return k !== key; }).map(function (k) {
        return '<div class="sort-tile"><div class="sort-tile-label">' + metrics[k].label + '</div><div class="sort-tile-val ' + metrics[k].cls + '">' + metrics[k].text + '</div></div>';
      }).join("") + '</div>';
  }

  function sortHeadBodyHtml(e) {
    var a = analyzeSortEntry(e, sortSettings);
    var summary;
    if (e.status === "loading") {
      summary = '<div class="sort-summary">Fetching prices… ' + (e.progress ? e.progress.done + '/' + e.progress.total : '') + '</div>';
    } else if (e.status === "error" && !(e.figs && e.figs.length)) {
      summary = '<div class="sort-summary sort-neg">' + escapeHtml(e.error || "Couldn’t load this set.") + '</div>';
    } else {
      var roiTxt = a.roi === null ? "—" : Math.round(a.roi * 100) + "%";
      // The list shows the bare numbers; the full wording is for the edit view.
      var expanded = !!sortExpanded[e.id];
      var figBits = [];
      if (a.parts.missingCount > 0) figBits.push('Figs to buy <b>' + sortMoney(a.parts.missingBuy) + '</b>');
      if (a.parts.ownedCount > 0) figBits.push('Figs on hand <b>' + sortMoney(a.parts.ownedValue) + '</b>');
      var caseBit = function (label, c) {
        return '<span>' + label + ' <b class="' + (a.paidKnown && c.profit < 0 ? 'sort-neg' : '') + '">'
          + (a.paidKnown ? sortMoney(c.profit) + (c.roi === null ? '' : ' · ' + Math.round(c.roi * 100) + '%') : sortMoney(c.net)) + '</b></span>';
      };
      var gapLine = a.parts.missingCount > 0
        ? '<div class="sort-summary">' + caseBit('As is', a.now) + caseBit('Complete', a.complete) + '<span>' + (a.paidKnown ? '(profit · ROI)' : '(value)') + '</span></div>'
        : '';
      // Front of the card: just the numbers that decide where a set sits.
      // Everything else (route, paid, as-is vs complete, fig money, demand
      // detail, notes) shows once the card is opened for editing.
      summary = sortFrontHtml(e, a)
        + (e.error ? '<div class="sort-flag sort-neg">' + escapeHtml(e.error) + '</div>' : '')
        + (expanded
          ? '<div class="sort-detail">'
            + '<div class="sort-summary"><span><b>' + escapeHtml(a.best.label) + '</b></span><span>Paid <b>' + (a.paidKnown ? sortMoney(a.paid) : "—") + '</b></span></div>'
            + gapLine
            + (figBits.length ? '<div class="sort-summary">' + figBits.map(function (b) { return '<span>' + b + '</span>'; }).join("") + '</div>' : '')
            + sortDemandLine(e)
            + a.flags.map(function (f) { return '<div class="sort-flag">' + escapeHtml(f) + '</div>'; }).join("")
            + '</div>'
          : "");
    }
    return '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(sortIdComplete(e) ? sortEntryId(e) : e.setNo) + '</span>'
      + '<span class="item-line1-right sort-right-stack">' + sortVerdictHtml(e, a) + sortFigCountHtml(e) + '</span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(e.name || "(name loading…)") + '</div>'
      + (sortExpanded[e.id] ? '<button type="button" class="sort-lookup-link" data-act="lookup" data-id="' + escapeHtml(e.id) + '">Look up set ›</button>' : '')
      + (sortIdClash(e) ? '<div class="sort-flag sort-neg">Duplicate ID ' + escapeHtml(sortEntryId(e)) + '</div>' : '')
      + (!sortIdComplete(e) && sortExpanded[e.id] ? '<div class="sort-flag">Add copy # & theme for its ID.</div>' : '')
      + summary;
  }

  function sortBreakdownLine(label, value) {
    return '<div class="sort-breakdown-line"><span>' + label + '</span><b>' + value + '</b></div>';
  }

  function sortDemandBreakdownHtml(e) {
    var d = sortDemand(e);
    if (!d) return "";
    var sold = e.setSoldQty > 0 ? e.setSoldQty : (e.setSoldCount || 0);
    var listed = e.setListedAll > 0 ? e.setListedAll : (e.setStockQty || 0);
    return '<div class="sort-breakdown">'
      + sortBreakdownLine('<b>Demand</b>', Math.round(d.score) + '/100')
      + (d.setD !== null ? sortBreakdownLine('Set: ' + sold + ' sold vs ' + listed + ' listed', Math.round(d.setD)) : '')
      + (d.figD !== null ? sortBreakdownLine('Figs: rarity, by value', Math.round(d.figD)) : '')
      + (d.setD !== null && d.figD !== null ? sortBreakdownLine('Blend weights (rest / figs)', sortMoney(d.wSet) + ' / ' + sortMoney(d.wFig)) : '')
      + '</div>';
  }

  // Where the Quick turn score comes from, point by point.
  function sortQuickBreakdownHtml(e) {
    var q = sortQuickTurn(e), p = q.parts;
    var pts = function (v, of) { return v.toFixed(1) + '/' + of; };
    return '<div class="sort-breakdown">'
      + sortBreakdownLine('<b>QT Score</b>', Math.round(q.score) + '/100')
      + sortBreakdownLine('Completeness', pts(p.completeness, 25))
      + sortBreakdownLine('Figs on hand (' + q.figs + ')', pts(p.figs, 25))
      + sortBreakdownLine('Pieces (' + (q.pieces > 0 ? Math.round(q.pieces) : 'unknown') + ')', pts(p.pieces, 20))
      + sortBreakdownLine('Manual', pts(p.manual, 10))
      + sortBreakdownLine('Quality', pts(p.quality, 10))
      + sortBreakdownLine('Box', pts(p.box, 5))
      + sortBreakdownLine('Demand (' + (e.setSoldCount || 0) + ' sales)', pts(p.demand, 5))
      + '</div>';
  }

  function sortMathHtml(e) {
    var a = analyzeSortEntry(e, sortSettings);
    var p = a.parts;
    var rows = a.routes.map(function (r) {
      return '<tr' + (r === a.best ? ' class="sort-best"' : '') + '>'
        + '<td>' + escapeHtml(r.label) + '</td>'
        + '<td>' + sortMoney(r.value) + '</td>'
        + '<td>' + (r.cost > 0 ? sortMoney(r.cost) : "—") + '</td>'
        + '<td>' + (a.paidKnown ? sortMoney(r.profit) : "—") + '</td>'
        + '</tr>';
    }).join("");
    return '<table class="sort-math-table"><thead><tr><th>Route</th><th>Sells for</th><th>Fig cost</th><th>Profit</th></tr></thead><tbody>' + rows + '</tbody></table>'
      + '<div class="sort-breakdown">'
      + sortBreakdownLine('Set value', sortMoney(p.setValue) + (e.setSoldCount ? ' (' + e.setSoldCount + ' sales)' : ''))
      + (e.setSoldQty > 0 || e.setStockQty > 0 ? sortBreakdownLine('Set demand (6 mo)', (e.setSoldQty || 0) + ' sold · ' + (e.setStockQty || 0) + ' listed (US)') : '')
      + sortBreakdownLine('Figs', sortMoney(p.figsAll))
      + sortBreakdownLine('Rest of set', sortMoney(p.brickFull))
      + sortBreakdownLine('Condition factor', '×' + p.qualityF.toFixed(2))
      + sortBreakdownLine('Box/manual factor', '×' + p.premium.toFixed(2))
      + sortBreakdownLine('Rest, adjusted', sortMoney(p.brickAdj))
      + '</div>'
      + sortDemandBreakdownHtml(e)
      + sortQuickBreakdownHtml(e);
  }

  // Whether this fig is already in Ryan's own BrickLink inventory, and at
  // what price(s) — the same matching and wording the Lookup page uses
  // (quantity on hand, each distinct listed price, any stock room). Blank
  // until the inventory has loaded; refreshSortFigStock() fills it in then.
  function sortFigStockHtml(f) {
    if (!manageInventoryRows) return "";
    var m = setFigLookupMatch({ itemNo: f.itemNo, colorId: 0, type: "MINIFIG" });
    if (!m.haveQty) return '<div class="item-color sort-fig-stock">Not in your inventory</div>';
    return '<button type="button" class="item-color sort-fig-stock have sort-fig-stock-link" data-act="figinv" data-fig="' + escapeHtml(f.itemNo) + '">In your inventory: ×' + m.haveQty + ' · '
      + escapeHtml(inventoryStockPriceSummary(f.itemNo, 0)) + setFigLookupStockRoomHtml(m.roomQtys) + ' ›</button>';
  }

  // Loads the inventory (once per session — Manage Inventory and Lookup share
  // it) and redraws the fig lists of any open cards with the stock lines.
  function refreshSortFigStock() {
    ensureManageInventoryLoaded().then(function () {
      if (currentView !== "sort-list") return;
      (sortList || []).forEach(function (e) { patchSortCard(e.id, true); });
    }).catch(function () { /* the fig rows just show no stock line */ });
  }

  function sortFigChecksHtml(f) {
    var qty = f.qty || 1;
    var have = sortClamp(f.have || 0, 0, qty);
    var out = "";
    for (var i = 0; i < qty; i++) {
      out += '<button type="button" class="sort-check' + (i < have ? ' on' : '') + '" data-fig="' + escapeHtml(f.itemNo) + '" data-i="' + (i + 1) + '" aria-label="Have ' + (i + 1) + ' of ' + qty + '">' + checkSvg() + '</button>';
    }
    return out;
  }

  // The estimate used for a missing fig when no price has been typed in.
  function sortFigBuyEstimate(f) {
    return f.stockAvg25 > 0 ? f.stockAvg25 : (f.stockMin > 0 ? f.stockMin : sortFigUnitValue(f));
  }

  // ---- Demand (0–100, higher = more in demand) ----
  // One scale for sets and figs, both of the form x / (x + 1) — the same
  // shape as Ryan's spreadsheet's wanted / (wanted + owned):
  //   Set: sold / (sold + listed) — what sold in the price-guide window
  //        against everything listed for sale now (BrickLink's API has no
  //        want/own counts, so sell-through stands in for them).
  //   Fig: his rarity index, age / sets-it-comes-in, squashed the same way
  //        (age = years since release, at least 1).
  // A card's number blends the two, weighted by how much of the set's value
  // each is — the rest of the set vs. its figs.
  function sortSetDemand(e) {
    var sold = e.setSoldQty > 0 ? e.setSoldQty : (e.setSoldCount || 0);
    var listed = e.setListedAll > 0 ? e.setListedAll : (e.setStockQty || 0);
    if (!(sold + listed > 0)) return null;
    return 100 * sold / (sold + listed);
  }
  function sortFigRarity(f) {
    if (!(f.yearReleased > 0) || !(f.setCount > 0)) return null;
    var age = Math.max(1, new Date().getFullYear() - f.yearReleased);
    var x = age / f.setCount;
    return 100 * x / (x + 1);
  }
  function sortDemand(e) {
    if (e.status !== "ready") return null;
    var setD = sortSetDemand(e);
    var figD = null, wSum = 0, dSum = 0, figsValue = 0;
    (e.figs || []).forEach(function (f) {
      var r = sortFigRarity(f);
      if (r === null) return;
      var w = sortFigUnitValue(f) * (f.qty || 1);
      figsValue += w;
      wSum += w || 1; dSum += r * (w || 1);
    });
    if (wSum > 0) figD = dSum / wSum;
    if (setD === null && figD === null) return null;
    var a = analyzeSortEntry(e, sortSettings);
    var wSet = a.parts.brickFull, wFig = a.parts.figsAll;
    var score;
    if (setD === null) score = figD;
    else if (figD === null) score = setD;
    else if (wSet + wFig > 0) score = (setD * wSet + figD * wFig) / (wSet + wFig);
    else score = (setD + figD) / 2;
    return { score: score, setD: setD, figD: figD, wSet: wSet, wFig: wFig };
  }
  function sortDemandPillHtml(e) {
    var d = sortDemand(e);
    if (!d) return "";
    var n = Math.round(d.score);
    return '<span class="sort-demand ' + (n >= 60 ? 'high' : n >= 35 ? 'mid' : 'low') + '">Demand ' + n + '</span>';
  }

  // How many of a fig sold over BrickLink's price-guide window (about six
  // months): pieces if reported, else the number of sales.
  function sortFigSold(f) {
    return f.soldQty > 0 ? f.soldQty : (f.soldCount || 0);
  }

  // One line of demand numbers, set vs figs, to weigh selling complete
  // against parting out.
  function sortDemandLine(e) {
    var bits = [];
    var setSold = e.setSoldQty > 0 ? e.setSoldQty : (e.setSoldCount || 0);
    if (setSold > 0) bits.push('set <b>' + setSold + '</b>');
    var figs = (e.figs || []).map(sortFigSold);
    if (figs.some(function (n) { return n > 0; })) {
      var avg = Math.round(figs.reduce(function (a, b) { return a + b; }, 0) / figs.length);
      bits.push('figs avg <b>' + avg + '</b>, low <b>' + Math.min.apply(null, figs) + '</b>');
    }
    return bits.length ? '<div class="sort-summary"><span>Sold (6 mo):</span>' + bits.map(function (b) { return '<span>' + b + '</span>'; }).join("") + '</div>' : '';
  }

  function sortFigRowHtml(f) {
    var qty = f.qty || 1;
    var unit = sortFigUnitValue(f);
    var priceTxt = unit > 0
      ? (f.soldAvg > 0 ? 'sold avg ' + sortMoney(f.soldAvg) : 'no sales')
        + (f.stockAvg25 > 0 ? ' · low-' + f.stockN + ' avg ' + sortMoney(f.stockAvg25) : (f.stockMin > 0 ? ' · cheapest ' + sortMoney(f.stockMin) : ''))
      : 'no price data';
    return '<div class="item-row sort-fig-row' + ((f.have || 0) >= qty ? ' sort-fig-all' : '') + '" data-fig="' + escapeHtml(f.itemNo) + '">'
      + '<div class="item-thumb">' + thumbHtml({ type: "MINIFIG", itemNo: f.itemNo, colorId: 0, newOrUsed: "U" }) + '</div>'
      + '<div class="item-body">'
      + '<div class="item-line1"><span class="item-no mono">' + escapeHtml(f.itemNo) + '</span><span class="item-line1-right">×' + qty + '</span></div>'
      + '<div class="item-name">' + escapeHtml(f.name || "") + '</div>'
      + '<div class="item-color">' + escapeHtml(priceTxt) + '</div>'
      + (sortFigSold(f) > 0 || f.stockQty > 0
        ? '<div class="item-color">' + escapeHtml('Demand: ' + sortFigSold(f) + ' sold (6 mo)' + (f.soldCount && f.soldQty && f.soldCount !== f.soldQty ? ' in ' + f.soldCount + ' sales' : '')
          + (f.stockQty > 0 ? ' · ' + f.stockQty + ' listed (US)' : '')) + '</div>'
        : '')
      + (sortFigRarity(f) !== null
        ? '<div class="item-color">' + escapeHtml('Rarity ' + Math.round(sortFigRarity(f)) + ' (' + Math.max(1, new Date().getFullYear() - f.yearReleased) + ' yrs, in ' + f.setCount + ' set' + (f.setCount === 1 ? '' : 's') + ')') + '</div>'
        : '')
      + sortFigStockHtml(f)
      + '<div class="sort-fig-buy"><label>Your cost to buy, each ($)</label>'
      + '<input type="number" inputmode="decimal" min="0" step="0.01" data-fig="' + escapeHtml(f.itemNo) + '" data-figf="buyCost" placeholder="est. ' + sortMoney(sortFigBuyEstimate(f)).replace("$", "") + '" value="' + (f.buyCost > 0 ? escapeHtml(f.buyCost) : '') + '"></div>'
      + '<div class="sort-fig-controls">'
      + '<div class="sort-checks">' + sortFigChecksHtml(f) + '</div>'
      + '<select class="sort-fig-cond" data-fig="' + escapeHtml(f.itemNo) + '" data-figf="cond" aria-label="Condition">'
      + '<option value="good"' + (f.cond === "good" ? ' selected' : '') + '>Good</option>'
      + '<option value="fair"' + (f.cond === "fair" ? ' selected' : '') + '>Fair</option>'
      + '<option value="poor"' + (f.cond === "poor" ? ' selected' : '') + '>Poor</option>'
      + '</select>'
      + '</div>'
      + '</div>'
      + '</div>';
  }

  function sortCategoryHintText(e) {
    return e.categoryPath ? "BrickLink category: " + escapeHtml(e.categoryPath) : "";
  }

  function sortFigsHtml(e) {
    var figs = (e.figs || []).slice().sort(function (x, y) { return sortFigUnitValue(y) - sortFigUnitValue(x); });
    if (figs.length) return '<div class="manage-inventory-hint">Figs — tap the ones you have</div>' + figs.map(sortFigRowHtml).join("");
    return e.status === "ready" ? '<div class="manage-inventory-hint">BrickLink lists no minifigs for this set.</div>' : '';
  }

  function sortNumberField(label, field, value, min, max, step) {
    return '<div class="inventory-field"><label>' + label + '</label><input type="number" inputmode="decimal" min="' + min + '" max="' + max + '" step="' + step + '" data-sortf="' + field + '" value="' + escapeHtml(value === null || value === undefined ? "" : value) + '"></div>';
  }

  function sortCardHtml(e) {
    // A set that couldn't be found has nothing to edit or compute.
    var failed = e.status === "error" && !(e.figs && e.figs.length);
    var expanded = !!sortExpanded[e.id] && !failed;
    var body = "";
    if (expanded) {
      body = '<div class="sort-card-extra">'
        + '<div class="inventory-fields">'
        + sortNumberField("Copy # (1st, 2nd…)", "copyNo", e.copyNo, 1, 999, "1")
        + '<div class="inventory-field"><label>Theme code</label><input type="text" maxlength="2" autocapitalize="characters" autocomplete="off" list="sortThemeCodes" data-sortf="theme" value="' + escapeHtml(e.theme || "") + '"></div>'
        + sortNumberField("Paid ($)", "paid", e.paid, 0, 100000, "0.01")
        + sortNumberField("Completeness (%)", "completeness", e.completeness, 0, 100, "1")
        + sortNumberField("Quality (0–10)", "quality", e.quality, 0, 10, "1")
        + sortNumberField("Box (0–10, 0 = none)", "box", e.box, 0, 10, "1")
        + sortNumberField("Manual (0–10, 0 = none)", "manual", e.manual, 0, 10, "1")
        + '</div>'
        + '<div class="sort-flag sort-cat-hint">' + sortCategoryHintText(e) + '</div>'
        + '<div class="sort-figs">' + sortFigsHtml(e) + '</div>'
        + '<div class="sort-math">' + sortMathHtml(e) + '</div>'
        + '</div>';
    }
    return '<div class="item-row sort-card" data-id="' + escapeHtml(e.id) + '">'
      + '<div class="item-thumb">' + thumbHtml({ type: "SET", itemNo: e.setNo, colorId: 0, newOrUsed: "U" }) + '</div>'
      + '<div class="item-body sort-head-body">' + sortHeadBodyHtml(e) + '</div>'
      + body
      + '<div class="sort-card-actions">'
      + (failed ? '' : '<button type="button" class="reset-btn" data-act="toggle" data-id="' + escapeHtml(e.id) + '">' + (expanded ? "Save" : "Edit") + '</button>')
      + (failed ? '' : '<select class="manage-inventory-sort-select sort-decision" data-sortf="decision" aria-label="Decision">'
        + SORT_DECISIONS.map(function (d) { return '<option value="' + d.key + '"' + ((e.decision || "") === d.key ? ' selected' : '') + '>' + escapeHtml(d.label) + '</option>'; }).join("")
        + '</select>')
      + (expanded || failed ? '<button type="button" class="delete-row-btn" data-act="remove" data-id="' + escapeHtml(e.id) + '">Remove</button>' : '')
      + '</div>'
      + '</div>';
  }

  // Re-draws just a card's summary and math, leaving its input fields (and
  // whatever's being typed in them) alone.
  // withFigs also re-draws the minifig checklist — only done when the fig
  // list or its prices actually changed, never on an ordinary edit.
  function patchSortCard(id, withFigs) {
    var e = sortFindEntry(id);
    var card = sortListView.querySelector('.sort-card[data-id="' + id + '"]');
    if (!e || !card) return;
    var head = card.querySelector(".sort-head-body");
    if (head) head.innerHTML = sortHeadBodyHtml(e);
    var math = card.querySelector(".sort-math");
    if (math) math.innerHTML = sortMathHtml(e);
    // The theme box (and its category note) follow an automatic guess as it
    // lands — but never while it's being typed in.
    var themeInput = card.querySelector('[data-sortf="theme"]');
    if (themeInput && document.activeElement !== themeInput) themeInput.value = e.theme || "";
    var catHint = card.querySelector(".sort-cat-hint");
    if (catHint) catHint.innerHTML = sortCategoryHintText(e);
    var figsEl = card.querySelector(".sort-figs");
    if (figsEl && withFigs) {
      figsEl.innerHTML = sortFigsHtml(e);
      wireThumbLinks(figsEl);
    }
    scheduleSortOutputs();
  }

  // ---- Output lists ----
  //
  // Built from each set's Decision (not the app's recommendation): sets
  // going out whole, the figs still to buy for them, the live listings of
  // your own that would be pulled into them, and the sets headed to bulk.
  // Missing figs are filled the same way the per-set math does it — a stock
  // room copy first (free), then one of your live listings if that beats
  // buying — but with one pool of your copies shared across every set, so
  // the same listing is never promised twice.

  function sortSetLabel(e) {
    return sortIdComplete(e) ? sortEntryId(e) : e.setNo;
  }

  function sortPlan() {
    var plan = { ready: [], waiting: 0, buy: [], pull: [], bulk: [], hold: [], keep: [], decided: 0 };
    var buyMap = {}, pullMap = {}, pools = {};
    function bump(map, f, label) {
      var row = map[f.itemNo] || (map[f.itemNo] = { itemNo: f.itemNo, name: f.name || "", qty: 0, free: 0, live: [], price: 0, total: 0, sets: {} });
      row.sets[label] = (row.sets[label] || 0) + 1;
      return row;
    }
    (sortList || []).forEach(function (e) {
      if (e.decision !== "set" && e.decision !== "part" && e.decision !== "hold" && e.decision !== "keep") return;
      if (e.decision === "keep") {
        // Staying in Ryan's own collection — complete or not, one copy or
        // several. Not for sale, so it feeds none of the sell lists.
        var need = 0, got = 0;
        (e.figs || []).forEach(function (f) { var q = f.qty || 1; need += q; got += sortClamp(f.have || 0, 0, q); });
        plan.decided++;
        plan.keep.push({ label: sortSetLabel(e), name: e.name || "", got: got, need: need, paid: e.paid === null || e.paid === undefined || e.paid === "" ? null : sortNum(e.paid) });
        return;
      }
      var usable = e.status === "ready" || (e.figs && e.figs.length);
      if (e.status === "loading" || !usable) return;
      plan.decided++;
      var label = sortSetLabel(e);
      var a = analyzeSortEntry(e, sortSettings);
      var figs = e.figs || [];
      if (e.decision === "hold") {
        // Kept as is, waiting for a missing fig to turn up in some future lot.
        var missing = [];
        figs.forEach(function (f) {
          var miss = (f.qty || 1) - sortClamp(f.have || 0, 0, f.qty || 1);
          if (miss) missing.push({ itemNo: f.itemNo, name: f.name || "", qty: miss });
        });
        plan.hold.push({ label: label, name: e.name || "", missing: missing });
      } else if (e.decision === "set") {
        var incomplete = false;
        figs.forEach(function (f) {
          var qty = f.qty || 1;
          var miss = qty - sortClamp(f.have || 0, 0, qty);
          if (!miss) return;
          incomplete = true;
          var unit = sortFigUnitValue(f);
          var buyPrice = f.stockAvg25 > 0 ? f.stockAvg25 : (f.stockMin > 0 ? f.stockMin : unit);
          var pool = pools[f.itemNo] || (pools[f.itemNo] = { own: sortOwnFigUnits(f.itemNo), free: 0, live: 0 });
          for (var i = 0; i < miss; i++) {
            if (f.buyCost > 0) {
              var own = bump(buyMap, f, label);
              own.qty++;
              own.total += f.buyCost;
              continue;
            }
            if (pool.free < pool.own.free) {
              pool.free++;
              bump(pullMap, f, label).free++;
              continue;
            }
            var livePrice = pool.own.live[pool.live];
            if (livePrice !== undefined && !(buyPrice > 0 && buyPrice < livePrice)) {
              pool.live++;
              bump(pullMap, f, label).live.push(livePrice);
            } else {
              var b = bump(buyMap, f, label);
              b.qty++;
              b.total += buyPrice;
            }
          }
        });
        if (!incomplete && e.status === "ready") {
          plan.ready.push({ label: label, name: e.name || "", value: a.routes[0].net, paid: a.paidKnown ? a.paid : null });
        } else {
          plan.waiting++;
        }
      } else {
        var listed = [];
        figs.forEach(function (f) {
          var have = sortClamp(f.have || 0, 0, f.qty || 1);
          if (!have) return;
          listed.push({ itemNo: f.itemNo, name: f.name || "", qty: have, cond: f.cond || "good", unit: sortFigUnitValue(f), value: sortFigUnitValue(f) * sortCondFactor(f.cond, sortSettings) });
        });
        plan.bulk.push({
          label: label, name: e.name || "", figs: listed,
          generalLb: a.parts.generalG / GRAMS_PER_LB, figPartsLb: a.parts.figPartsG / GRAMS_PER_LB,
          hasWeight: e.setWeightG > 0,
        });
      }
    });
    function toList(map) {
      return Object.keys(map).map(function (k) { return map[k]; }).sort(function (x, y) { return x.itemNo < y.itemNo ? -1 : x.itemNo > y.itemNo ? 1 : 0; });
    }
    plan.buy = toList(buyMap);
    plan.buy.forEach(function (r) { r.price = r.qty ? r.total / r.qty : 0; });
    plan.pull = toList(pullMap);
    return plan;
  }

  function sortLbs(n) { return n.toFixed(2) + " lb"; }

  function sortSetsText(sets) {
    return Object.keys(sets).map(function (k) { return k + (sets[k] > 1 ? " ×" + sets[k] : ""); }).join(", ");
  }

  function sortBuyTotal(plan) {
    return plan.buy.reduce(function (sum, r) { return sum + r.total; }, 0);
  }

  // The same lists as plain text, for the email button.
  function sortPlanText(plan) {
    var out = [];
    out.push("READY TO SELL (" + plan.ready.length + ")");
    plan.ready.forEach(function (r) { out.push(r.label + " " + r.name + " - est " + sortMoney(r.value)); });
    if (plan.waiting) out.push("(" + plan.waiting + " more waiting on figs)");
    out.push("");
    out.push("FIGS TO BUY (" + plan.buy.reduce(function (n, r) { return n + r.qty; }, 0) + ", est " + sortMoney(sortBuyTotal(plan)) + ")");
    plan.buy.forEach(function (r) {
      out.push(r.itemNo + " x" + r.qty + " " + r.name + " - est " + sortMoney(r.price) + " ea - for " + sortSetsText(r.sets));
    });
    out.push("");
    out.push("PULL FROM YOUR INVENTORY");
    plan.pull.forEach(function (r) {
      out.push(r.itemNo + " " + r.name + " - " + (r.live.length ? r.live.length + " live listing" + (r.live.length === 1 ? "" : "s") : "") + (r.live.length && r.free ? ", " : "")
        + (r.free ? r.free + " already in stock room" : "") + " - for " + sortSetsText(r.sets));
    });
    out.push("");
    out.push("SETS GOING TO BULK (" + plan.bulk.length + ")");
    var gen = 0, fp = 0;
    plan.bulk.forEach(function (b) {
      gen += b.generalLb; fp += b.figPartsLb;
      out.push(b.label + " " + b.name + " - general parts " + sortLbs(b.generalLb) + ", fig parts " + sortLbs(b.figPartsLb));
      b.figs.forEach(function (f) { out.push("   list: " + f.itemNo + " x" + f.qty + " " + f.name + " (" + f.cond + ")"); });
    });
    if (plan.bulk.length) out.push("TOTAL BULK: general parts " + sortLbs(gen) + ", fig parts " + sortLbs(fp));
    if (plan.keep.length) {
      out.push("");
      out.push("IN YOUR COLLECTION (" + plan.keep.length + ")");
      plan.keep.forEach(function (k) { out.push(k.label + " " + k.name + (k.need ? " - " + k.got + "/" + k.need + " figs" : "")); });
    }
    if (plan.hold.length) {
      out.push("");
      out.push("SAVING FOR LATER (" + plan.hold.length + ")");
      plan.hold.forEach(function (h) {
        out.push(h.label + " " + h.name + " - " + (h.missing.length ? "missing " + h.missing.map(function (m) { return m.itemNo + " x" + m.qty; }).join(", ") : "no figs missing"));
      });
    }
    return out.join("\n");
  }

  function sortPlanEmailHref(plan) {
    var subject = "Sort List - " + new Date().toLocaleDateString();
    return "mailto:thabrickstud@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + mailtoBody(sortPlanText(plan));
  }

  var SORT_STOCK_ROOMS = ["A", "B", "C"];
  var sortStockRoom = "A";
  var sortMoveBusy = false;
  var sortBuyAddedSig = "";
  function sortBuySig(plan) {
    return plan.buy.map(function (r) { return r.itemNo + ":" + r.qty; }).join(",");
  }

  function sortOutRow(left, right, sub) {
    return '<div class="sort-out-row"><div class="sort-out-main"><span>' + left + '</span>' + (right ? '<b>' + right + '</b>' : '') + '</div>'
      + (sub ? '<div class="sort-out-sub">' + sub + '</div>' : '') + '</div>';
  }

  function sortOutputsHtml() {
    var plan = sortPlan();
    if (!plan.decided) {
      return '<div class="sort-out"><div class="manage-inventory-hint">Pick a Decision on a set and its lists will build here.</div></div>';
    }
    var html = '<div class="sort-out">';
    // Ready to sell
    html += '<h3 class="sort-out-title">Ready to sell (' + plan.ready.length + ' · ' + sortMoney(plan.ready.reduce(function (n, r) { return n + r.value; }, 0)) + ')</h3>';
    html += plan.ready.length ? plan.ready.map(function (r) {
      return sortOutRow('<span class="mono">' + escapeHtml(r.label) + '</span> ' + escapeHtml(r.name), sortMoney(r.value),
        r.paid !== null ? 'paid ' + sortMoney(r.paid) : "");
    }).join("") : '<div class="sort-out-sub">None yet.</div>';
    if (plan.waiting) html += '<div class="sort-out-sub">' + plan.waiting + ' more “Sell as set” waiting on figs.</div>';
    // Figs to buy
    var buyQty = plan.buy.reduce(function (n, r) { return n + r.qty; }, 0);
    html += '<h3 class="sort-out-title">Figs to buy (' + buyQty + ' · ' + sortMoney(sortBuyTotal(plan)) + ')</h3>';
    if (plan.buy.length) {
      html += plan.buy.map(function (r) {
        return sortOutRow('<span class="mono">' + escapeHtml(r.itemNo) + '</span> ×' + r.qty + ' ' + escapeHtml(r.name),
          r.price > 0 ? sortMoney(r.total) : "no price", (r.price > 0 ? '~' + sortMoney(r.price) + ' ea · ' : '') + 'for ' + escapeHtml(sortSetsText(r.sets)));
      }).join("");
      var added = sortBuyAddedSig === sortBuySig(plan);
      html += '<button type="button" class="reset-btn sort-out-btn" id="sortBuyWantedBtn"' + (added ? ' disabled' : '') + '>'
        + (added ? 'Added to Wanted ✓' : 'Add all to Wanted list') + '</button>';
    } else html += '<div class="sort-out-sub">Nothing to buy.</div>';
    // Pull from inventory
    var liveTotal = plan.pull.reduce(function (n, r) { return n + r.live.reduce(function (a, b) { return a + b; }, 0); }, 0);
    html += '<h3 class="sort-out-title">Pull from your inventory (' + plan.pull.reduce(function (n, r) { return n + r.live.length + r.free; }, 0) + (liveTotal > 0 ? ' · ' + sortMoney(liveTotal) + ' live' : '') + ')</h3>';
    html += plan.pull.length ? plan.pull.map(function (r) {
      var bits = [];
      if (r.live.length) bits.push(r.live.length + ' live (' + r.live.map(sortMoney).join(', ') + ')');
      if (r.free) bits.push(r.free + ' already in stock room');
      return sortOutRow('<span class="mono">' + escapeHtml(r.itemNo) + '</span> ' + escapeHtml(r.name), "", escapeHtml(bits.join(' · ')) + ' · for ' + escapeHtml(sortSetsText(r.sets)));
    }).join("") : '<div class="sort-out-sub">None.</div>';
    if (plan.pull.some(function (r) { return r.live.length; })) {
      html += '<div class="sort-out-actions"><select class="manage-inventory-sort-select" id="sortStockRoomSelect" aria-label="Stock room">'
        + SORT_STOCK_ROOMS.map(function (l) { return '<option value="' + l + '"' + (l === sortStockRoom ? ' selected' : '') + '>Stock Room ' + l + '</option>'; }).join("")
        + '</select><button type="button" class="reset-btn" id="sortMoveBtn"' + (sortMoveBusy ? ' disabled' : '') + '>' + (sortMoveBusy ? 'Moving…' : 'Move live ones to stock room…') + '</button></div>';
    }
    // Sets going to bulk
    var gen = 0, fp = 0;
    plan.bulk.forEach(function (b) { gen += b.generalLb; fp += b.figPartsLb; });
    html += '<h3 class="sort-out-title">Sets going to bulk (' + plan.bulk.length + (plan.bulk.length ? ' · ' + sortLbs(gen + fp) : '') + ')</h3>';
    html += plan.bulk.length ? plan.bulk.map(function (b) {
      var figLines = b.figs.length
        ? b.figs.map(function (f) { return '<div class="sort-out-sub">List: <span class="mono">' + escapeHtml(f.itemNo) + '</span> ×' + f.qty + ' ' + escapeHtml(f.name) + '</div>'; }).join("")
        : '<div class="sort-out-sub">No figs checked off.</div>';
      return '<div class="sort-out-row"><div class="sort-out-main"><span><span class="mono">' + escapeHtml(b.label) + '</span> ' + escapeHtml(b.name) + '</span></div>'
        + '<div class="sort-out-sub">General parts ' + sortLbs(b.generalLb) + ' · fig parts ' + sortLbs(b.figPartsLb) + (b.hasWeight ? '' : ' (no set weight)') + '</div>'
        + figLines + '</div>';
    }).join("") + '<div class="sort-out-row"><div class="sort-out-main"><span>Total to bulk</span><b>' + sortLbs(gen) + ' general · ' + sortLbs(fp) + ' fig parts</b></div></div>'
      : '<div class="sort-out-sub">None.</div>';
    if (plan.keep.length) {
      var paidTotal = plan.keep.reduce(function (n, k) { return n + (k.paid || 0); }, 0);
      html += '<h3 class="sort-out-title">In your collection (' + plan.keep.length + (paidTotal > 0 ? ' · ' + sortMoney(paidTotal) + ' paid' : '') + ')</h3>' + plan.keep.map(function (k) {
        return sortOutRow('<span class="mono">' + escapeHtml(k.label) + '</span> ' + escapeHtml(k.name), k.need ? k.got + '/' + k.need + ' figs' : '', k.paid !== null ? 'paid ' + sortMoney(k.paid) : '');
      }).join("");
    }
    if (plan.hold.length) {
      html += '<h3 class="sort-out-title">Saving for later (' + plan.hold.length + ')</h3>' + plan.hold.map(function (h) {
        return sortOutRow('<span class="mono">' + escapeHtml(h.label) + '</span> ' + escapeHtml(h.name), "",
          h.missing.length ? 'Missing: ' + escapeHtml(h.missing.map(function (m) { return m.itemNo + (m.qty > 1 ? ' ×' + m.qty : '') + ' ' + m.name; }).join(', ')) : 'No figs missing');
      }).join("");
    }
    if (plan.bulk.some(function (b) { return b.figs.length; })) {
      html += '<button type="button" class="reset-btn sort-out-btn" id="sortToInventoryBtn">Send figs to Add Inventory…</button> ';
    }
    html += '<a class="reset-btn sort-out-btn" id="sortEmailBtn" href="' + escapeHtml(sortPlanEmailHref(plan)) + '">Email these lists</a>';
    html += '</div>';
    return html;
  }

  // The card at the top: every set counted under what it's decided on, or —
  // until it is — what the app suggests. Sets still fetching, failed, or with
  // no price data yet aren't counted.
  function sortTally() {
    var t = { sets: { n: 0, decided: 0, value: 0 }, part: { n: 0, decided: 0 }, figs: { n: 0, value: 0 }, bulk: { lbs: 0, value: 0 }, hold: 0, keep: 0, skipped: 0 };
    (sortList || []).forEach(function (e) {
      if (e.decision === "keep") { t.keep++; return; }
      if (e.status === "loading" || (e.status === "error" && !(e.figs && e.figs.length))) { t.skipped++; return; }
      if (e.decision === "hold") { t.hold++; return; }
      var a = analyzeSortEntry(e, sortSettings);
      var decided = e.decision === "set" || e.decision === "part";
      if (!decided && !a.hasData) { t.skipped++; return; }
      var key = decided ? e.decision : a.best.key;
      if (key === "set") {
        t.sets.n++; t.sets.value += a.routes[0].net;
        if (decided) t.sets.decided++;
      } else {
        var r = a.routes[1];
        t.part.n++; t.figs.n += a.parts.ownedCount; t.figs.value += r.figsValue; t.bulk.value += r.bulkValue;
        t.bulk.lbs += (a.parts.generalG + a.parts.figPartsG) / GRAMS_PER_LB;
        if (decided) t.part.decided++;
      }
    });
    return t;
  }

  function sortTallyHtml() {
    var t = sortTally();
    var cell = function (label, main, sub) {
      return '<div class="sort-tally-cell"><div class="sort-tally-label">' + label + '</div><div class="sort-tally-main">' + main + '</div>'
        + (sub ? '<div class="sort-tally-sub">' + sub + '</div>' : '') + '</div>';
    };
    var decidedTxt = function (d, n) { return d + ' of ' + n + ' decided'; };
    var foot = [];
    if (t.keep) foot.push(t.keep + ' in your collection');
    if (t.hold) foot.push(t.hold + ' saved for later');
    if (t.skipped) foot.push(t.skipped + ' not counted yet (no prices)');
    return '<div class="sort-tally">'
      + '<div class="sort-tally-grid">'
      + cell('Complete sets', t.sets.n + ' · ' + sortMoney(t.sets.value), decidedTxt(t.sets.decided, t.sets.n))
      + cell('Part out', t.part.n + ' set' + (t.part.n === 1 ? '' : 's') + ' · ' + sortMoney(t.figs.value + t.bulk.value), decidedTxt(t.part.decided, t.part.n))
      + cell('Figs to sell', t.figs.n + ' · ' + sortMoney(t.figs.value), 'from part-outs')
      + cell('Bulk', sortLbs(t.bulk.lbs) + ' · ' + sortMoney(t.bulk.value), 'from part-outs')
      + '</div>'
      + (foot.length ? '<div class="sort-tally-sub">' + foot.join(' · ') + '</div>' : '')
      + '<div class="sort-tally-sub">Undecided sets count under the app’s suggestion.</div>'
      + '</div>';

  function renderSortTally() {
    var el = document.getElementById("sortTally");
    if (!el || currentView !== "sort-list") return;

  var sortOutputsTimer = null;
  function renderSortOutputs() {
    renderSortTally();
    var el = document.getElementById("sortOutputs");

  // Cards patch themselves one at a time (sometimes all of them in a row),
  // so the lists below are rebuilt once, just after the dust settles.
  function scheduleSortOutputs() {
    clearTimeout(sortOutputsTimer);
    sortOutputsTimer = setTimeout(renderSortOutputs, 60);
  }

  // Which of Ryan's live fig lots would be touched to pull the figs the plan
  // promises from his own listings: cheapest (after any sale %) first, the
  // same order the per-set math prices them in. A lot taken whole just flips
  // into the stock room; a lot taken in part is split — its quantity drops
  // and a new stock room listing holds the pulled copies.
  function sortMovePlan(plan, room) {
    var steps = [];
    if (!manageInventoryRows) return { steps: steps, problem: "Your inventory hasn’t loaded yet — try again in a moment." };
    if (manageInventoryRows.some(isManageInventoryRowDirty)) {
      return { steps: steps, problem: "You have unsaved edits in Manage Inventory. Save or cancel them there first." };
    }
    plan.pull.forEach(function (r) {
      var need = r.live.length;
      if (!need) return;
      var lots = manageInventoryRows.filter(function (x) {
        return x.type === "MINIFIG" && x.itemNo === r.itemNo && !x.markedForDelete && !saleRowInStockRoom(x) && (parseInt(x.quantity, 10) || 0) > 0;
      }).sort(function (a, b) {
        var pa = (parseFloat(a.unitPrice) || 0) * (1 - (a.orig.saleRate || 0) / 100);
        var pb = (parseFloat(b.unitPrice) || 0) * (1 - (b.orig.saleRate || 0) / 100);
        return pa - pb;
      });
      lots.forEach(function (lot) {
        if (need <= 0) return;
        var qty = parseInt(lot.quantity, 10) || 0;
        var take = Math.min(qty, need);
        need -= take;
        steps.push({ row: lot, itemNo: r.itemNo, name: r.name, take: take, whole: take === qty });
      });
    });
    var bad = steps.filter(function (st) { return !st.row.inventoryId; })[0];
    if (bad) return { steps: [], problem: bad.itemNo + " has a listing with no BrickLink id, so it can’t be changed from here." };
    return { steps: steps };
  }

  function sortMoveStepText(st, room) {
    var price = sortMoney(parseFloat(st.row.unitPrice) || 0);
    var qty = parseInt(st.row.quantity, 10) || 0;
    return st.itemNo + " " + st.name + " — "
      + (st.whole
        ? "whole listing ×" + qty + " at " + price + " goes to Stock Room " + room
        : "×" + st.take + " of your ×" + qty + " at " + price + ": live listing drops to ×" + (qty - st.take) + ", new Stock Room " + room + " listing ×" + st.take);
  }

  function handleSortMoveToStock() {
    if (sortMoveBusy) return;
    var room = sortStockRoom;
    var mv = sortMovePlan(sortPlan(), room);
    if (mv.problem) { window.alert(mv.problem); return; }
    if (!mv.steps.length) { window.alert("Nothing live to move."); return; }
    var ok = window.confirm("This changes your live BrickLink listings:\n\n"
      + mv.steps.map(function (st) { return "• " + sortMoveStepText(st, room); }).join("\n")
      + "\n\nMove them?");
    if (!ok) return;
    sortMoveBusy = true;
    renderSortOutputs();
    var report = [];
    function failed(res) { return !res || !res.results || !res.results[0] || !res.results[0].success; }
    function why(res, err) { return err ? err.message : ((res && res.results && res.results[0] && res.results[0].error) || "no result from BrickLink"); }
    mv.steps.reduce(function (chain, st) {
      return chain.then(function () {
        var r = st.row, o = r.orig;
        var base = { key: r.key, inventoryId: r.inventoryId, newOrUsed: o.newOrUsed, unitPrice: o.unitPrice, description: o.description, remarks: o.remarks };
        if (st.whole) {
          return postJSON("/api/inventory-update", { items: [Object.assign({ quantityChange: 0, stockRoomId: room }, base)] }).then(function (res) {
            report.push((failed(res) ? "FAILED " : "Moved ") + st.itemNo + (failed(res) ? " — " + why(res) : " ×" + st.take));
          }, function (err) { report.push("FAILED " + st.itemNo + " — " + why(null, err)); });
        }
        // Split: lower the live lot first, so a failure can never leave the
        // same figs listed twice.
        return postJSON("/api/inventory-update", { items: [Object.assign({ quantityChange: -st.take, stockRoomId: "" }, base)] }).then(function (res) {
          if (failed(res)) { report.push("FAILED " + st.itemNo + " — " + why(res)); return; }
          return postJSON("/api/inventory-create", { items: [{
            key: r.key + "-room", itemNo: r.itemNo, type: "MINIFIG", colorId: r.colorId || 0, quantity: st.take,
            newOrUsed: o.newOrUsed, unitPrice: o.unitPrice, description: o.description, remarks: o.remarks, stockRoomId: room,
          }] }).then(function (cres) {
            report.push(failed(cres)
              ? "PARTLY DONE " + st.itemNo + " — live listing lowered by " + st.take + " but the Stock Room listing wasn’t created (" + why(cres) + "). Add ×" + st.take + " to Stock Room " + room + " by hand."
              : "Split " + st.itemNo + " — ×" + st.take + " to Stock Room " + room);
          }, function (err) {
            report.push("PARTLY DONE " + st.itemNo + " — live listing lowered by " + st.take + " but the Stock Room listing wasn’t created (" + why(null, err) + "). Add ×" + st.take + " to Stock Room " + room + " by hand.");
          });
        }, function (err) { report.push("FAILED " + st.itemNo + " — " + why(null, err)); });
      });
    }, Promise.resolve()).then(function () {
      return loadManageInventoryRows().catch(function () { report.push("Couldn’t reload your inventory — refresh it in Manage Inventory."); });
    }).then(function () {
      sortMoveBusy = false;
      if (currentView === "sort-list") { renderSortList(); renderSortOutputs(); }
      window.alert(report.join("\n"));
    });
  }

  // Figs from the sets going to bulk, as rows waiting in Add Inventory for
  // Ryan to review (price, condition, description) — nothing reaches
  // BrickLink until he submits there. Figs already handed over aren't added
  // twice.
  function handleSortToInventory() {
    var plan = sortPlan();
    var byFig = {};
    plan.bulk.forEach(function (b) {
      b.figs.forEach(function (f) {
        var row = byFig[f.itemNo] || (byFig[f.itemNo] = { itemNo: f.itemNo, name: f.name, qty: 0, unit: f.unit });
        row.qty += f.qty;
      });
    });
    var waiting = {};
    (inventoryRows || []).forEach(function (r) { if (r.fromSort) waiting[r.itemNo] = true; });
    var fresh = Object.keys(byFig).filter(function (k) { return !waiting[k]; }).map(function (k) { return byFig[k]; });
    if (!fresh.length) {
      window.alert("Those figs are already waiting in Add Inventory.");
      goToInventory();
      return;
    }
    var pieces = fresh.reduce(function (n, f) { return n + f.qty; }, 0);
    if (!window.confirm("Add " + fresh.length + " fig" + (fresh.length === 1 ? "" : "s") + " (" + pieces + " total) to Add Inventory for review?\nNothing goes to BrickLink until you submit there.")) return;
    if (!inventoryRows) inventoryRows = [];
    fresh.slice().reverse().forEach(function (f) {
      var row = csvObjToInventoryRow({
        ITEMTYPE: "M", ITEMID: f.itemNo, COLOR: "0", COLORNAME: "", ITEMNAME: f.name, QTY: String(f.qty),
        CONDITION: "U", PRICE: f.unit > 0 ? f.unit : "", REMARKS: "", DESCRIPTION: "",
      });
      row.fromSort = true;
      inventoryRows.unshift(row);
    });
    goToInventory();
    ensureManageInventoryLoaded().then(function () {
      if (currentView === "inventory") patchItemStockCounts(inventoryView);
    }).catch(function () { /* lines just stay blank */ });
  }

  // The top-of-list Refresh prices button: re-fetches every set's prices, one
  // set at a time (each already makes a batch of BrickLink calls), starting
  // from a clean slate so the fig prices really are fresh, not this page
  // load's remembered ones.
  var sortRefreshAll = null; // { done, total } while running

    var btn = document.getElementById("sortRefreshAllBtn");

    updateSortRefreshAllBtn();
    entries.reduce(function (chain, e) {
      return chain.then(function () { return loadSortEntryData(e); }).then(function () {
        sortRefreshAll.done++;
        updateSortRefreshAllBtn();
      });
    }, Promise.resolve()).catch(function () { /* each set records its own failure */ }).then(function () {

  function sortSettingsHtml() {

      + SORT_SETTING_FIELDS.map(function (f) {

            + '<input type="number" inputmode="decimal" step="' + f.step + '" min="0" data-setting="' + f.key + '" value="' + escapeHtml(sortSettings[f.key]) + '"></div>';
        }).join("")

      + '<p>Part out: figs sold singly (never worth less than their weight at the fig-parts rate), plus the leftover weight to bulk — general parts at the general rate, and the loose-accessories allowance per fig at the fig-parts rate.</p>'
