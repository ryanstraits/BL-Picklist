      if (!byYear[year]) {
        byYear[year] = { year: year, orders: 0, items: 0, revenue: 0, months: {} };
      }
      if (!byYear[year].months[month]) {
        byYear[year].months[month] = { month: month, orders: 0, items: 0, revenue: 0 };
      }

      var total = Number(row.grandTotal);
      var countsTowardRevenue = !isNaN(total);
      if (countsTowardRevenue) {
        if (!currencyCode) currencyCode = row.currencyCode;
        if (row.currencyCode !== currencyCode) {
          countsTowardRevenue = false;
          otherCurrencyCount++;
        }
      }

      byYear[year].orders++;
      byYear[year].items += row.totalCount || 0;
      byYear[year].months[month].orders++;
      byYear[year].months[month].items += row.totalCount || 0;
      if (countsTowardRevenue) {
        byYear[year].revenue += total;
        byYear[year].months[month].revenue += total;
      }
    });

    var years = Object.keys(byYear).map(function (y) { return byYear[y]; }).sort(function (a, b) { return b.year - a.year; });
    years.forEach(function (y) {
      y.months = Object.keys(y.months).map(function (m) { return y.months[m]; }).sort(function (a, b) { return b.month - a.month; });
      // Same orders-divided-into-revenue formula as allTimeAvgOrderValue
      // below, applied per year/month — a mismatched-currency order still
      // counts toward `orders` but not `revenue` (see countsTowardRevenue
      // above), so this understates slightly in a month/year that has one,
      // same known tradeoff the all-time figure already accepts.
      y.avgOrderValue = y.orders ? y.revenue / y.orders : 0;
      y.months.forEach(function (m) {
        m.avgOrderValue = m.orders ? m.revenue / m.orders : 0;
      });
    });

    var allTimeOrders = years.reduce(function (sum, y) { return sum + y.orders; }, 0);
    var allTimeRevenue = years.reduce(function (sum, y) { return sum + y.revenue; }, 0);

    return {
      currencyCode: currencyCode,
      otherCurrencyCount: otherCurrencyCount,
      allTimeOrders: allTimeOrders,
      allTimeRevenue: allTimeRevenue,
      allTimeAvgOrderValue: allTimeOrders ? allTimeRevenue / allTimeOrders : 0,
      years: years,
    };
  }

  // ---- Box choices tally ----
  //
  // boxChoice itself (orderId -> "large"|"medium"|"small"|"mailer") never
  // expires — it's a durable per-order tag, kept even once an order's
  // filed away, and filing an order only ever affects what /api/orders
  // (unfiled-only) returns, never the Blobs store this reads from. So a
  // filed order's tag was never actually lost — the earlier version of
  // this just failed to look anywhere else for its pieces/weight once it
  // dropped out of the unfiled `orders` array. Fixed by sourcing pieces
  // from `statsRows` instead (already fetched via /api/order-stats, which
  // explicitly pulls both filed=true and filed=false and covers an
  // order's full history), and by having fetchMissingBoxWeights() below
  // fetch weight for every tagged order directly by ID rather than only
  // ones still in the unfiled list — a per-ID GET /orders/{id} call works
  // the same regardless of filed status. missingPieces tracks the one
  // remaining, rare gap: an orderId BrickLink's own order history no
  // longer has any record of at all.
  function boxChoiceStats() {
    var bySize = {};
    BOX_OPTIONS.forEach(function (opt) { bySize[opt.value] = { count: 0, pieces: [], weightsG: [] }; });

    var totalCountById = {};
    (statsRows || []).forEach(function (r) { totalCountById[r.orderId] = r.totalCount; });

    var taggedIds = Object.keys(boxChoice).filter(function (id) { return boxChoice[id]; });
    var missingPieces = 0;
    taggedIds.forEach(function (orderId) {
      var bucket = bySize[boxChoice[orderId]];
      if (!bucket) return; // defensive — an old/unrecognized box value
      bucket.count++;
      var totalCount = totalCountById[orderId];
      if (totalCount) {
        bucket.pieces.push(totalCount);
      } else {
        missingPieces++;
      }
      var contact = contactCache[orderId];
      if (contact && contact.weightG) bucket.weightsG.push(contact.weightG);
    });

    return { total: taggedIds.length, missingPieces: missingPieces, bySize: bySize };
  }

  // Same race-safe "claim null before the fetch starts" pattern as
  // fetchMissingBuyerRealNames, but over every tagged orderId rather than
  // just the currently-open (unfiled) orders list — a filed order's
  // contact is still fetchable by ID, this just wasn't asking for it
  // before. In practice contactCache is often already warm for a
  // still-unfiled tagged order by the time Stats is opened (the orders
  // list's own fetchMissingBuyerRealNames call fills it for every visible
  // order, and tagging a box only ever happens from an order's detail
  // page, which fetches its own contact too) — this mainly ends up
  // covering filed orders, plus whatever else that missed, e.g. Stats
  // opened before Orders ever rendered this session.
  function fetchMissingBoxWeights() {
    Object.keys(boxChoice).forEach(function (orderId) {
      if (!boxChoice[orderId]) return;
      if (contactCache[orderId] !== undefined) return;
      contactCache[orderId] = null;
      fetchJSON("/api/orders/" + encodeURIComponent(orderId) + "/contact")
        .then(function (contact) {
          contactCache[orderId] = contact;
          if (currentView === "stats") renderStatsView();
        })
        .catch(function () { /* already claimed null above */ });
    });
  }

  // A single-sample bucket would otherwise show a "range" like "12.0 oz–12.0
  // oz" — collapses to just the one value instead.
  function rangeText(values, formatFn) {
    if (!values.length) return "";
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    return min === max ? formatFn(min) : formatFn(min) + '–' + formatFn(max);
  }

  function boxStatsSectionHtml() {
    var stats = boxChoiceStats();
    var rows = BOX_OPTIONS.map(function (opt) {
      var b = stats.bySize[opt.value];
      if (!b.count) return "";
      var pieces = b.pieces.length ? rangeText(b.pieces, function (n) { return String(n); }) + ' pieces' : "";
      var weights = b.weightsG.length ? rangeText(b.weightsG, formatWeightLbOz) : "";
      var detail = [pieces, weights].filter(function (s) { return s; }).join(' · ');
      return '<div class="box-stats-row">'
        + '<span class="box-stats-label">' + escapeHtml(opt.label) + '</span>'
        + '<span class="box-stats-count">' + b.count + '</span>'
        + '<span class="box-stats-range">' + escapeHtml(detail) + '</span>'
        + '</div>';
    }).join("");

    return ""
      + '<div class="stats-year-block box-stats-block">'
      + '<div class="stats-year-heading">'
      + '<span class="stats-year-label">Box choices logged</span>'
      + '<span class="stats-year-orders">' + stats.total + ' order' + (stats.total === 1 ? "" : "s") + '</span>'
      + '</div>'
      + (rows || '<div class="state-block">No box choices tagged yet — pick a box on an order’s detail page to start building this out.</div>')
      + (stats.missingPieces ? '<div class="box-stats-footnote">' + stats.missingPieces + ' tagged order' + (stats.missingPieces === 1 ? " has" : "s have") + " no matching record in this account's order history anymore, so " + (stats.missingPieces === 1 ? "it isn't" : "they aren't") + ' reflected in the ranges above.</div>' : '')
      + '</div>';
  }

  function renderStatsView() {
    if (statsError) {
      statsView.innerHTML = '<div class="state-block error">' + escapeHtml(statsError) + '<br><button class="reset-btn" id="statsRetryBtn">Retry</button></div>';
      var retryBtn = document.getElementById("statsRetryBtn");
      if (retryBtn) retryBtn.addEventListener("click", fetchStats);
      return;
    }
    if (!statsRows) {
      statsView.innerHTML = '<div class="state-block">Loading order history…</div>';
      fetchStats();
      return;
    }

    var stats = computeOrderStats(statsRows);

    var yearBlocks = stats.years.map(function (y) {
      var monthRows = y.months.map(function (m) {
        return ""
          + '<div class="stats-month-row">'
          + '<span class="stats-month-label">' + STATS_MONTH_NAMES[m.month] + '</span>'
          + '<span class="stats-month-orders">' + m.orders + ' order' + (m.orders === 1 ? "" : "s") + '</span>'
          + '<span class="stats-month-avg mono">avg ' + escapeHtml(formatCurrency(m.avgOrderValue, stats.currencyCode)) + '</span>'
          + '<span class="stats-month-revenue mono">' + escapeHtml(formatCurrency(m.revenue, stats.currencyCode)) + '</span>'
          + '</div>';
      }).join("");
      return ""
        + '<div class="stats-year-block">'
        + '<div class="stats-year-heading">'
        + '<span class="stats-year-label">' + y.year + '</span>'
        + '<span class="stats-year-orders">' + y.orders + ' order' + (y.orders === 1 ? "" : "s") + '</span>'
        + '<span class="stats-year-avg mono">avg ' + escapeHtml(formatCurrency(y.avgOrderValue, stats.currencyCode)) + '</span>'
        + '<span class="stats-year-revenue mono">' + escapeHtml(formatCurrency(y.revenue, stats.currencyCode)) + '</span>'
        + '</div>'
        + monthRows
        + '</div>';
    }).join("");

    fetchMissingBoxWeights();

    statsView.innerHTML = ""
      + '<div class="stats-summary">'
      + '<div class="stats-summary-tile"><strong>' + stats.allTimeOrders + '</strong><span>orders</span></div>'
      + '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(stats.allTimeAvgOrderValue, stats.currencyCode)) + '</strong><span>avg order</span></div>'
      + '<div class="stats-summary-tile"><strong class="mono">' + escapeHtml(formatCurrency(stats.allTimeRevenue, stats.currencyCode)) + '</strong><span>total sales</span></div>'
      + '</div>'
      + (stats.otherCurrencyCount ? '<div class="stats-footnote">' + stats.otherCurrencyCount + ' order' + (stats.otherCurrencyCount === 1 ? "" : "s") + ' in a different currency excluded from the $ totals (still counted in orders/items).</div>' : '')
      + (yearBlocks || '<div class="state-block">No order history found.</div>')
      + boxStatsSectionHtml();
  }

  // ---- Order Lookup ----
  //
  // Finds any order regardless of status or filed state — unlike the main
  // orders list (deliberately unfiled-only, see orders.js), this searches
  // statsRows, the same full-history fetch Sales Stats already uses. An
  // order found here opens the normal order-detail page, just in
  // read-only mode (see orderDetailReadOnly/openOrder) — no pick
  // checkboxes or progress bar, since a looked-up order (often old,
  // filed, or already shipped) isn't what Ryan's actually out picking
  // right now; everything else (contact info, financials, messages,
  // feedback, box choice, status actions) stays fully usable.
  //
  // With an empty search box this doubles as a browsable recent-orders
  // list — Ryan asked for this after using Order Lookup for a while and
  // wanting to just glance at recent orders too, not only search for a
  // specific one, "combining the two" rather than adding a separate
  // button/page. Mirrors Manage Inventory's own "Recently Added" browse
  // view exactly: a date-range select (15/30/365 days, or all time) plus
  // a newest/oldest sort, both shown only while browsing — search itself
  // always covers full history regardless of the range selected (an
  // active search narrowing to "only recent" would be surprising the one
  // time it matters most: finding an older order the range would
  // otherwise hide) and stays fixed newest-first, same as Manage
  // Inventory's own search results are never independently sortable.
  var orderLookupQuery = "";
  var orderLookupSearchDebounceTimer = null;
  var orderLookupRangeDays = 30; // 15 | 30 | 365 | Infinity ("all time")
  var orderLookupSortKey = "newest"; // "newest" | "oldest"
  var ORDER_LOOKUP_RESULT_CAP = 40;

  function orderLookupMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q || !statsRows) return [];
    return statsRows.filter(function (o) {
      return (o.orderId && o.orderId.toLowerCase().indexOf(q) !== -1)
        || (o.buyer && o.buyer.toLowerCase().indexOf(q) !== -1)
        || (o.date && o.date.toLowerCase().indexOf(q) !== -1)
        || (o.date && formatDate(o.date).toLowerCase().indexOf(q) !== -1);
    }).sort(function (a, b) {
      var da = a.date ? new Date(a.date).getTime() : -Infinity;
      var db = b.date ? new Date(b.date).getTime() : -Infinity;
      return db - da;
    });
  }

  // orderLookupRangeDays as Infinity for "all time" makes the cutoff math
  // fall out naturally: Date.now() - Infinity = -Infinity, and every valid
  // date is >= that, so no special case is needed for "no limit" here.
  function orderLookupBrowseRows() {
    var cutoff = Date.now() - orderLookupRangeDays * 24 * 60 * 60 * 1000;
    var rows = statsRows.filter(function (o) {
      var t = o.date ? new Date(o.date).getTime() : NaN;
      return !isNaN(t) && t >= cutoff;
    });
    rows.sort(function (a, b) {
      var da = new Date(a.date).getTime();
      var db = new Date(b.date).getTime();
      return orderLookupSortKey === "oldest" ? da - db : db - da;
    });
    return rows;
  }

  function orderLookupCardHtml(o) {
    var needsLog = !isOrderLogged(o.orderId);
    return '<div class="order-card' + (needsLog ? ' needs-log' : '') + '" role="button" tabindex="0" data-order="' + escapeHtml(o.orderId) + '">'
      + '<div class="order-top-row">'
      + '<span class="order-id-group">'
      + '<span class="order-id mono">#' + escapeHtml(o.orderId) + '</span>'
      + statusBadgeHtml(o.status)
      + feedbackIconsHtml(o.orderId)
      + '</span>'
      + '<span class="order-date">' + escapeHtml(formatDate(o.date)) + '</span>'
      + '</div>'
      + '<div class="order-buyer">'
      + '<span>' + escapeHtml(o.buyer || "") + buyerRealNameHtml(o.orderId) + '</span>'
      + (o.grandTotal ? '<span class="order-total mono">' + escapeHtml(formatCurrency(o.grandTotal, o.currencyCode)) + '</span>' : '')
      + '</div>'
      + '<div class="order-lots-items">' + (o.uniqueCount || 0) + ' lots · ' + (o.totalCount || 0) + ' items</div>'
      + '</div>';
  }

  // Maps a statsRows row (orderId/status/buyer/date/totalCount/
  // uniqueCount/grandTotal/currencyCode) to the shape openOrder()/
  // renderOrderDetail() expect (orderTotal instead of grandTotal — kept
  // separate names in order-stats.js itself since Sales Stats' own
  // aggregation already reads `grandTotal` there and renaming it would
  // ripple through that unrelated code for no reason).
  function openLookupOrder(row) {
    openOrder(row.orderId, false, {
      orderId: row.orderId,
      status: row.status,
      buyer: row.buyer,
      date: row.date,
      totalCount: row.totalCount,
      uniqueCount: row.uniqueCount,
      orderTotal: row.grandTotal,
      currencyCode: row.currencyCode,
      filed: row.filed,
    });
  }

  // Rebuilds only the results area below the search box, same "leave the
  // <input> itself alone" reasoning as renderManageInventoryResults.
  function renderOrderLookupResults() {
    var container = document.getElementById("orderLookupResults");
    if (!container) return;
    var query = orderLookupQuery.trim();
    var browsing = !query;

    var body = "";
    var visibleRows = [];
    if (statsError) {
      body = '<div class="state-block error">' + escapeHtml(statsError) + '<br><button class="reset-btn" id="orderLookupRetryBtn">Retry</button></div>';
    } else if (!statsRows) {
      body = '<div class="state-block">Loading order history…</div>';
    } else if (!browsing) {
      var matches = orderLookupMatches(query);
      var capped = matches.slice(0, ORDER_LOOKUP_RESULT_CAP);
      visibleRows = capped;
      body = '<div class="inventory-summary-row"><span>' + matches.length + ' match' + (matches.length === 1 ? '' : 'es') + '</span></div>'
        + (capped.length ? capped.map(orderLookupCardHtml).join("") : '<div class="state-block">No orders found.</div>')
        + (matches.length > capped.length ? '<div class="manage-inventory-cap-note">Showing the first ' + capped.length + ' of ' + matches.length + ' matches — refine your search to see the rest.</div>' : '');
    } else {
      var rows = orderLookupBrowseRows();
      var cappedRows = rows.slice(0, ORDER_LOOKUP_RESULT_CAP);
      visibleRows = cappedRows;
      body = '<div class="order-lookup-sort-row">'
        + '<select class="order-lookup-sort-select" id="orderLookupRangeSelect">'
        + '<option value="15"' + (orderLookupRangeDays === 15 ? ' selected' : '') + '>Last 15 days</option>'
        + '<option value="30"' + (orderLookupRangeDays === 30 ? ' selected' : '') + '>Last 30 days</option>'
        + '<option value="365"' + (orderLookupRangeDays === 365 ? ' selected' : '') + '>Last year</option>'
        + '<option value="all"' + (orderLookupRangeDays === Infinity ? ' selected' : '') + '>All time</option>'
        + '</select>'
        + '<select class="order-lookup-sort-select" id="orderLookupSortSelect">'
        + '<option value="newest"' + (orderLookupSortKey === "newest" ? ' selected' : '') + '>Newest first</option>'
        + '<option value="oldest"' + (orderLookupSortKey === "oldest" ? ' selected' : '') + '>Oldest first</option>'
        + '</select>'
        + '</div>'
        + '<div class="inventory-summary-row"><span>' + rows.length + ' order' + (rows.length === 1 ? '' : 's') + '</span></div>'
        + (cappedRows.length ? cappedRows.map(orderLookupCardHtml).join("") : '<div class="state-block">No orders in this range.</div>')
        + (rows.length > cappedRows.length ? '<div class="manage-inventory-cap-note">Showing the first ' + cappedRows.length + ' of ' + rows.length + ' orders — narrow the range or search above to find a specific one.</div>' : '');
    }

    container.innerHTML = body;
    fetchMissingBuyerRealNames(visibleRows, container);

    var retryBtn = document.getElementById("orderLookupRetryBtn");
    if (retryBtn) retryBtn.addEventListener("click", fetchStats);

    var rangeSelect = document.getElementById("orderLookupRangeSelect");
    if (rangeSelect) {
      rangeSelect.addEventListener("change", function (e) {
        orderLookupRangeDays = e.target.value === "all" ? Infinity : parseInt(e.target.value, 10);
        renderOrderLookupResults();
      });
    }
    var sortSelect = document.getElementById("orderLookupSortSelect");
    if (sortSelect) {
      sortSelect.addEventListener("change", function (e) {
        orderLookupSortKey = e.target.value;
        renderOrderLookupResults();
      });
    }

    container.querySelectorAll(".order-card").forEach(function (card) {
      var row = statsRows.filter(function (o) { return o.orderId === card.getAttribute("data-order"); })[0];
      if (!row) return;
      card.addEventListener("click", function () { openLookupOrder(row); });
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openLookupOrder(row);
        }
      });
    });
  }

  function renderOrderLookupView() {
    orderLookupView.innerHTML = ""
      + '<input type="search" class="order-lookup-search" id="orderLookupSearchInput" placeholder="Search by order #, name, or date…" value="' + escapeHtml(orderLookupQuery) + '" autocomplete="off">'
      + '<div id="orderLookupResults"></div>';

    document.getElementById("orderLookupSearchInput").addEventListener("input", function (e) {
      orderLookupQuery = e.target.value;
      clearTimeout(orderLookupSearchDebounceTimer);
      orderLookupSearchDebounceTimer = setTimeout(renderOrderLookupResults, 150);
    });

    renderOrderLookupResults();
  }

  // ---- Set/Fig Lookup ----

  // Type a BrickLink set or minifig number, see which of its parts/figs
  // (per BrickLink's own Get Item Subsets BOM) Ryan already has in
  // inventory — "could I build/part this out of what's on the shelf."
  // Deliberately NOT a type-as-you-go search like Order Lookup's: each
  // lookup is a real BrickLink API call (no local data to filter), so it
  // fires on explicit submit (Enter or the button), never per keystroke.
  // Results are cached per type+no for the rest of the session — same
  // {loading, data, error} shape as priceGuideCache — so re-looking-up
  // the same number (switching away and back) is free.
  var setFigLookupType = "SET"; // "SET" | "MINIFIG"
  var setFigLookupQuery = "";
  var setFigLookupCache = {};
  var setFigLookupActiveKey = null;

  function setFigLookupKey(type, no) { return type + ":" + no; }

  // Bare set numbers are sold/printed without BrickLink's own "-1" variant
  // suffix (e.g. the box says "75192", BrickLink's own number is
  // "75192-1") — appended automatically so Ryan doesn't have to know or
  // type that convention. Left alone if he already typed a suffix, or for
  // a minifig number, which never takes one.
  function normalizeSetFigNo(type, raw) {
    var no = (raw || "").trim();
    if (type === "SET" && no && no.indexOf("-") === -1) no += "-1";
    return no;
  }

  // Flips the submit button's label in place (no full re-render, so focus/
  // cursor position in the field is untouched) — called right at submit
  // time, not after the fetch resolves, so it reads "Clear" immediately.
  function updateSetFigLookupSubmitBtn() {
    var btn = document.querySelector(".set-fig-lookup-btn");
    if (btn) btn.textContent = setFigLookupActiveKey ? "Clear" : "Look up";
  }

  function runSetFigLookup() {
    var no = normalizeSetFigNo(setFigLookupType, setFigLookupQuery);
    if (!no) return;
    var key = setFigLookupKey(setFigLookupType, no);
    setFigLookupActiveKey = key;
    updateSetFigLookupSubmitBtn();
    if (!setFigLookupCache[key]) {
      setFigLookupCache[key] = { loading: true, entries: null, error: null };
      fetchJSON("/api/item-subsets?type=" + encodeURIComponent(setFigLookupType) + "&no=" + encodeURIComponent(no))
        .then(function (data) {
          var entries = data.entries || [];
          // .key/.priceExpanded mirror manageInventoryRows's own fields so
          // these entries (and the set/fig's own header item, below) can be
          // handed straight to the shared price-guide helpers
          // (viewOnBricklinkLinkHtml, fetchPriceGuide, renderPriceGuidePanel)
          // as if they were ordinary rows. Assigned once here, not
          // recomputed per render, so toggling a panel open survives
          // re-renders (entries/item are cached, not rebuilt each render).
          entries.forEach(function (e, i) { e.key = key + ":" + i; e.priceExpanded = false; e.manualQty = 0; });
          var item = data.item || { itemNo: no, name: "", type: setFigLookupType };
          item.key = key + ":item";
          item.priceExpanded = false;
          setFigLookupCache[key] = { loading: false, item: item, entries: entries, error: null };
          if (currentView === "set-fig-lookup") renderSetFigLookupResults();
        })
        .catch(function (err) {
          setFigLookupCache[key] = { loading: false, item: null, entries: null, error: err.message };
          if (currentView === "set-fig-lookup") renderSetFigLookupResults();
        });
    }
    renderSetFigLookupResults();
  }

  function renderSetFigLookupView() {
    setFigLookupView.innerHTML = ""
      + '<div class="set-fig-lookup-intro">Enter a BrickLink set or minifig number to see which of its parts/figs you already have in inventory.</div>'
      + '<div class="set-fig-lookup-type-row">'
      + '<button type="button" class="set-fig-type-btn' + (setFigLookupType === "SET" ? " active" : "") + '" data-type="SET">Set</button>'
      + '<button type="button" class="set-fig-type-btn' + (setFigLookupType === "MINIFIG" ? " active" : "") + '" data-type="MINIFIG">Minifig</button>'
      + '</div>'
      + '<form class="set-fig-lookup-form" id="setFigLookupForm">'
      + '<input type="text" class="set-fig-lookup-search" id="setFigLookupInput" placeholder="' + (setFigLookupType === "SET" ? "e.g. 75192 or 75192-1" : "e.g. sw0359") + '" value="' + escapeHtml(setFigLookupQuery) + '" autocomplete="off">'
      + '<button type="submit" class="set-fig-lookup-btn">' + (setFigLookupActiveKey ? "Clear" : "Look up") + '</button>'
      + '</form>'
      + '<div id="setFigLookupResults"></div>';

    setFigLookupView.querySelectorAll(".set-fig-type-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        setFigLookupType = el.getAttribute("data-type");
        // Switching Set/Minifig also resets the query/results — otherwise
        // the box would keep showing the other type's number (and the
        // button "Clear" from its still-active lookup) instead of a fresh
        // field ready for a number of the newly-selected type.
        setFigLookupQuery = "";
        setFigLookupActiveKey = null;
        renderSetFigLookupView();
      });
    });

    // The button (and Enter in the field) does one of two things depending
    // on whether a lookup is currently active: submits the typed number, or
    // — once results are showing, button reads "Clear" — resets the field
    // and results so Ryan doesn't have to select-all/delete by hand before
    // typing the next number.
    document.getElementById("setFigLookupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (setFigLookupActiveKey) {
        clearSetFigLookup();
      } else {
        setFigLookupQuery = document.getElementById("setFigLookupInput").value;
        runSetFigLookup();
      }
    });

    // If Ryan edits the box after a lookup's gone through (retrying past
    // an error, or just typing the next number without hitting Clear
    // first), the button shouldn't stay stuck on "Clear" — as soon as the
    // field no longer matches what was actually submitted, it reverts to
    // "Look up" so Enter/the button submits the edited text instead.
    document.getElementById("setFigLookupInput").addEventListener("input", function () {
      if (setFigLookupActiveKey && this.value !== setFigLookupQuery) {
        setFigLookupActiveKey = null;
        updateSetFigLookupSubmitBtn();
      }
    });

    renderSetFigLookupResults();
  }

  function clearSetFigLookup() {
    setFigLookupQuery = "";
    setFigLookupActiveKey = null;
    renderSetFigLookupView();
  }

  // Each subset entry's match against Ryan's own inventory — type checked
  // alongside itemNo+colorId (unlike inventoryStockCount's simpler two-
  // field match) since a PART and a MINIFIG can't collide on number but a
  // SET's subset list is exactly the case where telling them apart
  // actually matters here.
  function setFigLookupMatch(entry) {
    var rows = manageInventoryRows.filter(function (r) {
      return r.itemNo === entry.itemNo && r.colorId === (entry.colorId || 0) && r.type === entry.type && !r.markedForDelete;
    });
    var haveQty = rows.reduce(function (sum, r) { return sum + (parseInt(r.quantity, 10) || 0); }, 0);
    var totalValue = rows.reduce(function (sum, r) { return sum + (parseFloat(r.unitPrice) || 0) * (parseInt(r.quantity, 10) || 0); }, 0);
    return { entry: entry, haveQty: haveQty, avgPrice: haveQty ? totalValue / haveQty : 0 };
  }

  function setFigLookupRowHtml(bucket, colorsMap) {
    var e = bucket.entry;
    var pseudoItem = { type: e.type, itemNo: e.itemNo, colorId: e.colorId, newOrUsed: "N" };
    var colorName = e.colorId ? (colorsMap[e.colorId] || null) : null;
    // "Really" owned (a real inventory match) vs "manually" owned (Ryan
    // entered a temp-add-to-stock quantity for loose parts he hasn't
    // listed) — both land in the same In-stock section and count toward
    // the summary (any amount on hand counts as "in stock" here, same as
    // a real match for 1 of 10 needed already did — this list means "do I
    // have some," not "do I have enough," so there's no separate partial
    // bucket), but only a real match has a listed price to show, and only
    // a manual mark needs the field (a real match needs no override).
    var reallyOwned = bucket.haveQty > 0;
    var manuallyOwned = !reallyOwned && e.manualQty > 0;
    var stockLine;
    if (reallyOwned) {
      stockLine = ' · Have ' + bucket.haveQty + ' (listed at ' + escapeHtml(formatCurrency(bucket.avgPrice, "USD")) + ')';
    } else if (manuallyOwned) {
      stockLine = ' · Temp added ' + e.manualQty + ' (not in your listed inventory)';
    } else {
      stockLine = ' · None in stock';
    }
    // A stepper only makes sense when there's more than one to count up to
    // — for a qty-1 need, on hand or not is the whole question, so it stays
    // a plain checkbox (still writes into the same e.manualQty, just 0/1).
    var manualFieldHtml;
    if (reallyOwned) {
      manualFieldHtml = '';
    } else if (e.quantity > 1) {
      manualFieldHtml = ''
        + '<label class="set-fig-manual-owned-toggle">'
        + '<span>Temp add to stock</span>'
        + '<input type="number" class="set-fig-manual-qty-input" data-key="' + escapeHtml(e.key) + '" min="0" max="' + e.quantity + '" step="1" value="' + (e.manualQty || 0) + '">'
        + '</label>';
    } else {
      manualFieldHtml = ''
        + '<label class="set-fig-manual-owned-toggle">'
        + '<input type="checkbox" class="set-fig-manual-owned-checkbox" data-key="' + escapeHtml(e.key) + '"' + (e.manualQty > 0 ? ' checked' : '') + '>'
        + ' Temp add to stock'
        + '</label>';
    }
    return '<div class="item-row set-fig-match-row' + ((reallyOwned || manuallyOwned) ? ' owned' : '') + (manuallyOwned ? ' manual-owned' : '') + '">'
      + '<div class="item-thumb">' + thumbHtml(pseudoItem) + '<span class="qty-chip">' + e.quantity + '</span></div>'
      + '<div class="item-body">'
      + '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(e.itemNo) + '</span>'
      + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(e.type) + '</span></span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(decodeHtmlEntities(e.name || "")) + '</div>'
      + (isRealColorName(colorName) ? '<div class="item-color">' + escapeHtml(colorName) + '</div>' : '')
      + '<div class="item-stock-count">Needs ' + e.quantity + stockLine + '</div>'
      + manualFieldHtml
      + '</div>'
      // e doubles as the "row" the shared price-guide helpers expect —
      // it already carries type/itemNo/colorId/key/priceExpanded, same
      // fields they read off a manageInventoryRows row.
      + '<div class="inventory-price-guide-block">'
      + '<div class="price-guide-header-row">'
      + viewOnBricklinkLinkHtml(e)
      + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(e.key) + '">' + (e.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
      + '</div>'
      + renderPriceGuidePanel(e, true)
      + '</div>'
      + '</div>';
  }

  function findSetFigLookupEntry(entryKey) {
    var state = setFigLookupActiveKey && setFigLookupCache[setFigLookupActiveKey];
    if (!state) return null;
    if (state.item && state.item.key === entryKey) return state.item;
    if (!state.entries) return null;
    for (var i = 0; i < state.entries.length; i++) {
      if (state.entries[i].key === entryKey) return state.entries[i];
    }
    return null;
  }

  // The set/fig being looked up, not one of its parts — same card shell as
  // a match row minus the owned/needed stock line, same shared price-guide
  // helpers (item doubles as the "row" they expect, same as a subset entry
  // does in setFigLookupRowHtml).
  function setFigLookupHeaderCardHtml(item) {
    var pseudoItem = { type: item.type, itemNo: item.itemNo, colorId: 0, newOrUsed: "N" };
    return '<div class="item-row set-fig-header-card">'
      + '<div class="item-thumb">' + thumbHtml(pseudoItem) + '</div>'
      + '<div class="item-body">'
      + '<div class="item-line1">'
      + '<span class="item-no mono">' + escapeHtml(item.itemNo) + '</span>'
      + '<span class="item-line1-right"><span class="item-type-tag">' + escapeHtml(item.type) + '</span></span>'
      + '</div>'
      + '<div class="item-name">' + escapeHtml(decodeHtmlEntities(item.name) || "(name unknown)") + '</div>'
      + '</div>'
      + '<div class="inventory-price-guide-block">'
      + '<div class="price-guide-header-row">'
      + viewOnBricklinkLinkHtml(item)
      + '<button type="button" class="price-guide-toggle-btn" data-key="' + escapeHtml(item.key) + '">' + (item.priceExpanded ? "▾" : "▸") + ' See active US listings</button>'
      + '</div>'
      + renderPriceGuidePanel(item, true)
      + '</div>'
      + '</div>';
  }

  // BrickLink's classic Wanted List XML import format — same ITEMTYPE
  // single-letter codes as the BrickScan inventory-upload format already
  // parsed elsewhere in this file (INVENTORY_TYPE_WORD_TO_CODE), plus the
  // wanted-list-specific tags (MINQTY/CONDITION/REMARKS/NOTIFY). Only the
  // not-in-stock entries go in — those are the ones actually missing —
  // with the needed quantity as MINQTY and REMARKS noting which set/fig
  // pulled it in, so the wanted list entry still makes sense out of context.
  function buildSetFigWantedListXml(missingBuckets, label) {
    var items = missingBuckets.map(function (bucket) {
      var e = bucket.entry;
      var typeCode = INVENTORY_TYPE_WORD_TO_CODE[e.type] || "P";
      return '<ITEM>'
        + '<ITEMTYPE>' + typeCode + '</ITEMTYPE>'
        + '<ITEMID>' + escapeHtml(e.itemNo) + '</ITEMID>'
        + (e.colorId ? '<COLOR>' + e.colorId + '</COLOR>' : '')
        + '<MINQTY>' + e.quantity + '</MINQTY>'
        + '<CONDITION>N</CONDITION>'
        + '<REMARKS>' + escapeHtml(label) + '</REMARKS>'
        + '<NOTIFY>Y</NOTIFY>'
        + '</ITEM>';
    }).join("\n");
    return '<INVENTORY>\n' + items + '\n</INVENTORY>\n';
  }

  // Same Blob-URL-download pattern downloadLabelPrepPdf uses — a data:
  // URL's download attribute doesn't reliably fire on iOS Safari, a Blob
  // URL does (or at worst opens in-browser with a working Share/Save).
  function downloadSetFigWantedListXml(missingBuckets) {
    if (!missingBuckets.length) return;
    var no = normalizeSetFigNo(setFigLookupType, setFigLookupQuery);
    var label = (setFigLookupType === "SET" ? "Set " : "Minifig ") + no;
    var xml = buildSetFigWantedListXml(missingBuckets, label);
    var blob = new Blob([xml], { type: "text/xml" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = no.replace(/[^A-Za-z0-9_-]/g, "") + "-wanted-list.xml";
    link.target = "_blank";
    link.rel = "noopener";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  function renderSetFigLookupMatches(container, item, entries, colorsMap) {
    var headerHtml = item ? setFigLookupHeaderCardHtml(item) : "";
    if (!entries.length) {
      container.innerHTML = headerHtml + '<div class="state-block">No parts found for that number.</div>';
      wireThumbLinks(container);
      sizeThumbsToRows(container);
      wireSetFigLookupPriceGuideHandlers(container);
      return;
    }
    var owned = [];
    var missing = [];
    entries.forEach(function (e) {
      var bucket = setFigLookupMatch(e);
      // A manual "temp add to stock" quantity counts as in-stock here same
      // as a real inventory match — it moves the row into the In-stock
      // section, counts toward the summary, and drops out of the
      // wanted-list XML (built from `missing` below) — but it's never
      // written to Ryan's actual BrickLink inventory, purely a
      // client-side/session note.
      (bucket.haveQty > 0 || e.manualQty > 0 ? owned : missing).push(bucket);
    });

    function rowHtml(bucket) { return setFigLookupRowHtml(bucket, colorsMap); }

    container.innerHTML = headerHtml
      + '<div class="inventory-summary-row"><span>' + owned.length + ' of ' + entries.length + ' parts/figs in stock</span></div>'
      + (owned.length ? '<div class="manage-inventory-hint">In stock</div>' + owned.map(rowHtml).join("") : '')
      + (missing.length
        ? '<div class="manage-inventory-hint set-fig-missing-hint"><span>Not in stock</span><button type="button" class="reset-btn" id="setFigWantedListBtn">Export wanted list XML</button></div>' + missing.map(rowHtml).join("")
        : '');

    var wantedListBtn = document.getElementById("setFigWantedListBtn");
    if (wantedListBtn) wantedListBtn.addEventListener("click", function () { downloadSetFigWantedListXml(missing); });

    container.querySelectorAll(".set-fig-manual-owned-checkbox").forEach(function (el) {
      el.addEventListener("change", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        entry.manualQty = el.checked ? 1 : 0;
        renderSetFigLookupResults();
      });
    });
    container.querySelectorAll(".set-fig-manual-qty-input").forEach(function (el) {
      el.addEventListener("change", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        var raw = parseInt(el.value, 10) || 0;
        entry.manualQty = Math.max(0, Math.min(entry.quantity, raw));
        renderSetFigLookupResults();
      });
    });

    wireSetFigLookupPriceGuideHandlers(container);
    wireThumbLinks(container);
    sizeThumbsToRows(container);
  }

  // Shared by both renderSetFigLookupMatches branches (the header card's
  // own toggle shows up whether or not the set/fig has any subset entries)
  // — same "See active US listings" toggle/collapse wiring Manage Inventory
  // uses, just looking entries (and the header item) up via
  // findSetFigLookupEntry instead of findManageInventoryRow.
  function wireSetFigLookupPriceGuideHandlers(container) {
    container.querySelectorAll(".price-guide-toggle-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        entry.priceExpanded = !entry.priceExpanded;
        if (entry.priceExpanded) fetchPriceGuide(entry, renderSetFigLookupResults);
        renderSetFigLookupResults();
      });
    });
    container.querySelectorAll(".price-guide-collapse-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var entry = findSetFigLookupEntry(el.getAttribute("data-key"));
        if (!entry) return;
        entry.priceExpanded = false;
        renderSetFigLookupResults();
      });
    });
  }

  function renderSetFigLookupResults() {
    var container = document.getElementById("setFigLookupResults");
    if (!container) return;
    if (!setFigLookupActiveKey) { container.innerHTML = ""; return; }
    var state = setFigLookupCache[setFigLookupActiveKey];
    if (!state || state.loading) {
      container.innerHTML = '<div class="state-block">Loading parts list…</div>';
      return;
    }
    if (state.error) {
      container.innerHTML = '<div class="state-block error">' + escapeHtml(state.error) + '<br><button class="reset-btn" id="setFigLookupRetryBtn">Retry</button></div>';
      var retryBtn = document.getElementById("setFigLookupRetryBtn");
      if (retryBtn) retryBtn.addEventListener("click", function () {
        delete setFigLookupCache[setFigLookupActiveKey];
        runSetFigLookup();
      });
      return;
    }
    var entries = state.entries;
    Promise.all([ensureManageInventoryLoaded(), getColors()]).then(function (results) {
      var colorsMap = results[1];
      var resultsEl = document.getElementById("setFigLookupResults");
      if (currentView !== "set-fig-lookup" || !resultsEl) return;
      renderSetFigLookupMatches(resultsEl, state.item, entries, colorsMap);
    }).catch(function (err) {
      container.innerHTML = '<div class="state-block error">Couldn’t load your inventory to match against: ' + escapeHtml(err.message) + '</div>';
    });
  }

  // App-level password gate — Netlify's own visitor-access-control isn't
  // available on this team's plan (confirmed: the API rejects every
  // variant with a 422), so this substitutes for it: every /api/* function
  // rejects unauthenticated requests with 401 (see lib/site-auth.js), and
  // this is the frontend half — nothing here renders real data until a
  // session cookie is established via /api/site-login.
  // Tracks whether this is the very first time the app's shown itself
  // (fresh page load) vs. coming back from an interrupted mid-session
  // login — e.g. a request 401'd partway through something. The first
  // time, there's nothing to resume, so the orders list is exactly
  // right (and is already the visible section by default in the static
  // markup). Any time after that, jumping back to Orders instead of
  // wherever the user actually was is how a session hiccup mid-Add-
  // Inventory-submit could silently swallow a reviewed-but-unsubmitted
  // batch from view — the data was still sitting in memory the whole
  // time, just not visible anywhere obvious.
  var appStarted = false;
  function startApp() {
    appEl.classList.remove("hidden");
    if (appStarted) {
      resumeCurrentView();
    } else {
      appStarted = true;
      // The topbar's category/sub-nav state is dynamic (subNavBtn starts
      // with no label at all) — needs an explicit call here, not just
      // from the goTo* functions, to be correct on this first load.
      setTopbarNav("orders", "Label Prep", goToLabelPrep);
    }
    loadState();
    loadOrders();
    syncStateFromRemote();
    syncOrderActionsFromRemote();
  }

  function resumeCurrentView() {
    if (currentView === "inventory") goToInventory();
    else if (currentView === "label-prep") goToLabelPrep();
    else if (currentView === "manage-inventory") goToManageInventory();
    else if (currentView === "stats") goToStats();
    else if (currentView === "order-lookup") goToOrderLookup();
    else if (currentView === "set-fig-lookup") goToSetFigLookup();
    else goToOrders();
  }

  function showLoginGate(message) {
    appEl.classList.add("hidden");

  }

  function hideLoginGate() {
    loginGate.classList.add("hidden");
    loginGateError.classList.add("hidden");
    loginGatePassword.value = "";
  }

  loginGateForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = loginGatePassword.value;
    if (!password) return;
    loginGateSubmit.disabled = true;
    loginGateSubmit.textContent = "Checking…";
    loginGateError.classList.add("hidden");
    fetch("/api/site-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password }),
    }).then(function (res) {
      if (!res.ok) throw new Error("wrong");
      return res.json();
    }).then(function (data) {
      // Setting the cookie here ourselves, not relying on the response's
      // Set-Cookie header, is the actual fix for a real bug: on "Chrome"
      // on iOS (which is Safari's WebKit engine under the hood — Apple
      // requires every iOS browser to use it), Set-Cookie from a fetch()
      // response wasn't reliably landing in the cookie jar in time for
      // the very next request, which then 401'd and bounced back to this
      // screen. document.cookie is a far older, more reliable API.
      document.cookie = data.cookieName + "=" + encodeURIComponent(data.token)
        + "; Path=/; Max-Age=" + data.maxAge + "; SameSite=Lax"
        + (window.location.protocol === "https:" ? "; Secure" : "");
      hideLoginGate();
      startApp();
    }).catch(function () {
      loginGateError.textContent = "Incorrect password. Try again.";
      loginGateError.classList.remove("hidden");
      loginGatePassword.value = "";
      loginGatePassword.focus();
    }).finally(function () {
      loginGateSubmit.disabled = false;
      loginGateSubmit.textContent = "Unlock";
    });
  });

  // Checks for an existing valid session cookie before deciding whether
  // to show the app or the password prompt — avoids a pointless flash of
  // loading state (and a guaranteed 401 from loadOrders()) for a
  // first-time or expired visitor.
  fetch("/api/site-session").then(function (res) {
    if (res.ok) { startApp(); } else { showLoginGate(); }
  }).catch(function () { showLoginGate(); });
})();
</script>
</body>
</html>
